[package]
name = "native-rs-custom-transport-talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Phase 212.L.2 — Application pkg shape. Native-only deploy target.
# `nros check` rejects any RTOS in this list.
[package.metadata.nros.application]
deploy = ["linux"]

[[bin]]
# phase-340 W2 — the artifact name must be unique across the fixture GROUP, not
# just across this directory. A group's members share one flat
# `<group>/[<triple>/]<profile>/` output namespace, and cargo hashes `deps/` by
# `-C metadata` while leaving the FINAL artifact name alone: two members both
# emitting `talker` overwrite each other, last writer wins, and one test then
# runs the other's binary. `native-rs-talker` already claims `talker`, so this
# one carries its own name. Gated by `scripts/check-fixture-groups.py` (A1/A3).
name = "custom-transport-talker"
path = "src/main.rs"

[dependencies]
# Phase 115.L.5-custom-transport — route through `nros_rmw_vtable_t`
# via the zenoh-cffi shim. `link-custom` forwarded by the shim's
# matching feature.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-rmw = { version = "*", default-features = false, features = ["alloc"] }
# Phase 244 E2 — reusable custom-transport callback factories (TCP bridge,
# loopback). Replaces the open-coded TcpBridge + FFI callbacks in src/main.rs.
nros-transport-callbacks = { version = "*" }
# Phase 123.A.1.x.2 — POSIX `nros_platform_*` C symbols ship as a
# standalone C library inside `nros-platform-cffi[posix-c-port]`. Pure-
# cargo builds (no CMake glue) enable the feature so the library's
# `build.rs` compiles the C port into the binary.
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305),
# so this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
native_rs_custom_transport_talker_nros_selection = { path = "build/nros/selection" }
# Only for its `link-custom` link option, which RFC-0031's capability
# registry does not declare; the selection package links the backend.
nros-rmw-zenoh = { version = "*", default-features = false, features = ["link-custom"] }
# Phase 88.16.B — diagnostics route through `nros-log`.
nros-log = { version = "*" }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root. Without it, cargo walks up + adopts the example into the
# outer nano-ros workspace (in nested checkouts) or gets adopted by a user's
# workspace `members` glob when they copy this example out, breaking the
# README's "standalone copy-out template" promise. Canonical in-tree builds
# also pass via the root `exclude = [...]` list (belt-and-braces).
[workspace]
