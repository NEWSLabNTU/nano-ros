# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]

[package]
name = "native_custom_transport_listener"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The OWNED entry of the bringup's images (RFC-0071 D19): this `main` is
# what the example demonstrates, so `nros build` builds it instead of
# generating one. The binary takes the package's name, the entry's.
[[bin]]
name = "native_custom_transport_listener"
path = "src/main.rs"

[dependencies]
# See the custom-transport-talker example for migration notes.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-rmw = { version = "*", default-features = false, features = ["alloc"] }
# Phase 123.A.1.x.2 — POSIX `nros_platform_*` C symbols ship as a
# standalone C library inside `nros-platform-cffi[posix-c-port]`. Pure-
# cargo builds (no CMake glue) enable the feature so the library's
# `build.rs` compiles the C port into the binary.
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }
# Only for its `link-custom` link option, which RFC-0031's capability
# registry does not declare; the adapter crate links the backend.
nros-rmw-zenoh = { version = "*", default-features = false, features = ["link-custom"] }
# Phase 88.16.B — diagnostics route through `nros-log`.
nros-log = { version = "*" }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`). Its RMW and edition features come from the adapter.
nros-board-linux = { version = "*", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
native_custom_transport_listener_nros_derived = { path = "../../generated/nros-derived/native_custom_transport_listener" }
# Phase 244 D4/E2 — reusable TCP-bridge custom-transport factory.
nros-transport-callbacks = { version = "*" }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
