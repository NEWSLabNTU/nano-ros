# What this example deploys to (RFC-0098 D3/D5) — the bringup of a one-package
# workspace (RFC-0122 D3). The program is the owned entry `src/native_lifecycle_node`: it
# keeps its own `main` (no `nros::main!`) and opens its own executor, so the
# bringup declares no component table, and every image names that one entry
# (RFC-0071 D19).

[system]
name = "native_rs_lifecycle_node"
rmw = "zenoh"
domain_id = 0
# The managed-node services (`nros/lifecycle-services`), a declared capability
# (RFC-0031) lowered into the entry's adapter crate.
features = ["lifecycle"]
# The image a bare `nros configure` / `nros build` builds.
default_images = ["linux"]

# Host build. The locator and domain stay runtime env on native.
[image_defaults]
board = "linux"

[image.linux]
entry = "native_lifecycle_node"

# One image per RMW (RFC-0031): `nros build <bringup>:<id>`.
[image.linux_xrce]
entry = "native_lifecycle_node"
rmw = "xrce"

[image.linux_cyclonedds]
entry = "native_lifecycle_node"
rmw = "cyclonedds"
