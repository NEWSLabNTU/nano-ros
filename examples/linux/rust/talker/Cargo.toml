[package]
name = "native-rs-talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "talker"
path = "src/main.rs"

# phase-338 W3 — node logic moved to a lib so it can be byte-identical to every
# other platform's copy; `main.rs` is the platform glue (`nros::main!()`).
[lib]
name = "native_rs_talker"
crate-type = ["rlib"]
path = "src/lib.rs"

# The board, RMW, ROS edition, domain and node declaration live in
# `system.toml` beside this manifest (RFC-0098 D3/D5) — nothing here names a
# board, an RMW or an edition. They reach the build through the generated
# selection package below (RFC-0098 D6, RFC-0031, issue 1305).

[features]
# Zenoh link options. Not declared capabilities — RFC-0031's capability
# registry (`capability_resolver::CAPABILITIES`) has no entry for them — so they
# stay features of this package and name the zenoh backend only to forward to
# it. Meaningful on a zenoh image only (`linux`, `linux_iron`,
# `linux_jazzy`); the selection package brings the backend itself.
link-tls = ["dep:nros-rmw-zenoh", "nros-rmw-zenoh/link-tls"]

[dependencies]
nros = { version = "*", default-features = false, features = ["log", "alloc", "env", "rmw-cffi", "macros"] }
# The image's board crate (`LinuxBoard::run`, the `BoardEntry` lifecycle
# `nros::main!` drives), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305).
# `nros::main!` reaches the board through it.
native_rs_talker_nros_selection = { path = "build/nros/selection" }
# Only for the link options above; the selection package links the backend.
nros-rmw-zenoh = { version = "*", default-features = false, optional = true }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root. Without it, cargo walks up + adopts the example into the
# outer nano-ros workspace (in nested checkouts) or gets adopted by a user's
# workspace `members` glob when they copy this example out, breaking the
# README's "standalone copy-out template" promise. Canonical in-tree builds
# also pass via the root `exclude = [...]` list (belt-and-braces).
[workspace]
