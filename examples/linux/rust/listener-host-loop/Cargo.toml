[package]
name = "native-rs-listener-host-loop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "listener-host-loop"
path = "src/main.rs"

# The node logic is the `listener` example's `lib.rs`, unchanged. Only
# `main.rs` differs: `nros::setup!()` plus a loop the program owns
# (RFC-0112 Tier 0, phase-520 W2).
[lib]
name = "native_rs_listener_host_loop"
crate-type = ["rlib"]
path = "src/lib.rs"

# The board, RMW, ROS edition, network identity and node declaration live in
# `system.toml` beside this manifest (RFC-0098 D3/D5) — nothing here names a
# board, an RMW or an edition. They reach the build through the generated
# selection package below (RFC-0098 D6, RFC-0031, issue 1305).

[dependencies]
nros = { version = "*", default-features = false, features = ["log", "alloc", "env", "rmw-cffi", "macros"] }
# The image's board crate (its `BoardEntry` start-up, which `nros_boot` runs
# without its loop), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305).
# `nros::setup!` reaches the board through it.
native_rs_listener_host_loop_nros_selection = { path = "build/nros/selection" }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"

# Empty `[workspace]` table: this example is a standalone workspace root, so
# cargo neither walks up into an enclosing workspace nor gets adopted by one
# when the directory is copied out.
[workspace]
