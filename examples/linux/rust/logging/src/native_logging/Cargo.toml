[package]
name = "native_logging"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The OWNED entry of the bringup's image (RFC-0071 D19): this `main` is what
# the example demonstrates, so `nros build` builds it instead of generating
# one. The binary takes the package's name, the entry's.
[[bin]]
name = "native_logging"
path = "src/main.rs"

[dependencies]
# Phase 88 — `nros-log` facade + `PlatformSink` + the `nros_*!` macros.
nros-log = { version = "*" }
# POSIX `nros_platform_log_*` impl. `PlatformSink` forwards into
# this. The `nros_platform_*` clock / alloc / etc. symbols are
# also pulled in here so the example links standalone.
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }

# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]
