# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]

[package]
name = "native_service_client_callback"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The OWNED entry of the bringup's images (RFC-0071 D19): this `main` is
# what the example demonstrates, so `nros build` builds it instead of
# generating one. The binary takes the package's name, the entry's.
[[bin]]
name = "native_service_client_callback"
path = "src/main.rs"

[dependencies]
nros = { version = "*", default-features = false, features = ["log", "alloc", "env", "rmw-cffi"] }
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`). Its RMW and edition features come from the adapter.
nros-board-linux = { version = "*", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
native_service_client_callback_nros_derived = { path = "../../generated/nros-derived/native_service_client_callback" }
example_interfaces = { path = "../../generated/example_interfaces", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"
