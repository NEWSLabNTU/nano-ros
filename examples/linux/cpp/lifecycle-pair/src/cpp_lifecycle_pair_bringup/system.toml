# What this example deploys to (RFC-0098 D3/D5): the bringup of a one-package
# workspace (RFC-0122 D3). The program is the owned entry `src/cpp_lifecycle_pair`
# (RFC-0071 D19). It keeps its own `main`, which constructs two
# `rclcpp_lifecycle::LifecycleNode`s, each with its own services and machine. So
# every image names it, and the bringup declares no component table.

[system]
name = "cpp_lifecycle_pair"
rmw = "zenoh"
domain_id = 0
# The managed-node services, a declared capability (RFC-0031).
features = ["lifecycle"]
default_images = ["linux"]

[image_defaults]
board = "linux"

[image.linux]
entry = "cpp_lifecycle_pair"
