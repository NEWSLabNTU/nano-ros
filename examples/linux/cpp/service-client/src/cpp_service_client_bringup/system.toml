# What this example deploys to (RFC-0098 D3/D5) — the bringup of a one-package
# workspace (RFC-0122 D3). The program is the owned entry
# `src/cpp_service_client` (RFC-0071 D19): it keeps its own `main`, which
# blocks first in `wait_for_service`, which issue 1556's census case needs, so
# every image names it and the bringup declares no component table.

[system]
name = "cpp_service_client"
rmw = "zenoh"
domain_id = 0
# The image a bare `nros configure` / `nros build` builds.
default_images = ["linux"]

# Host build. The locator and domain stay runtime env on native
# (`NROS_LOCATOR` / `ROS_DOMAIN_ID`).
[image_defaults]
board = "linux"

[image.linux]
entry = "cpp_service_client"
