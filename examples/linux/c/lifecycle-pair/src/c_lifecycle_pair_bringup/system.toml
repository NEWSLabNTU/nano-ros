# What this example deploys to (RFC-0098 D3/D5): the bringup of a one-package
# workspace (RFC-0122 D3). The program is the owned entry `src/c_lifecycle_pair`
# (RFC-0071 D19). It keeps its own `main`, which binds two nodes and makes each
# a managed node with lifecycle services and a state machine of its own. So
# every image names it, and the bringup declares no component table.

[system]
name = "c_lifecycle_pair"
rmw = "zenoh"
domain_id = 0
# The managed-node services, a declared capability (RFC-0031).
features = ["lifecycle"]
default_images = ["linux"]

# The program makes BOTH of its nodes managed in its own `main`, which no
# declaration or model shows the build: state how many, so every image's
# sizing counts two REP-2002 state machines (five lifecycle services each) and
# the XRCE service-server pool derives from it.
[lifecycle]
managed_nodes = 2

[image_defaults]
board = "linux"

[image.linux]
entry = "c_lifecycle_pair"

# The same program on the two DDS-shaped backends, for the interop cells
# on every RMW the matrix carries. Each managed node pays its own service
# entities there (RFC-0128 D7).
[image.linux_xrce]
entry = "c_lifecycle_pair"
rmw = "xrce"

[image.linux_cyclonedds]
entry = "c_lifecycle_pair"
rmw = "cyclonedds"
