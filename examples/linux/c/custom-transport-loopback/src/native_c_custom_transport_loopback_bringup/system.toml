# What this example deploys to (RFC-0098 D3/D5) — the bringup of a one-package
# workspace (RFC-0122 D3). The program is the owned entry
# `src/native_c_custom_transport_loopback` (RFC-0071 D19): it keeps its own
# `main`, which registers its own link vtable before it opens the executor, so
# every image names it and the bringup declares no component table.

[system]
name = "native_c_custom_transport_loopback"
rmw = "zenoh"
domain_id = 0
# The image a bare `nros configure` / `nros build` builds.
default_images = ["linux"]

# Host build. The domain stays runtime env on native (`ROS_DOMAIN_ID`).
[image_defaults]
board = "linux"

[image.linux]
entry = "native_c_custom_transport_loopback"
# The session rides the link `main` registers (RFC-0109 D6: the locator's
# scheme is the link). Stating it here is what compiles zenoh-pico's custom
# link into the image (`NROS_LINK_CUSTOM`, issue 2452) and leaves its own IP
# links out; `main` opens the session on the same locator.
locator = "custom/loopback"
