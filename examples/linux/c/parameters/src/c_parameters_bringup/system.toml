# What this example deploys to (RFC-0098 D3/D5) — the bringup of a one-package
# workspace (RFC-0122 D3). The program is the owned entry `src/c_parameters`
# (RFC-0071 D19): it keeps its own `main`, which declares parameters on the
# executor's store, which the six `rcl_interfaces/srv/*` servers read, so
# every image names it and the bringup declares no component table.
#
# `features` turns on the parameter service family: a workspace image imports
# the runtime with these axes, before the package's own CMakeLists.txt runs.

[system]
name = "c_parameters"
rmw = "zenoh"
domain_id = 0
features = ["param_services"]
# The image a bare `nros configure` / `nros build` builds.
default_images = ["linux"]

# Host build. The locator and domain stay runtime env on native
# (`NROS_LOCATOR` / `ROS_DOMAIN_ID`).
[image_defaults]
board = "linux"

[image.linux]
entry = "c_parameters"

# Issue 2304 — the same program on Cyclone: the cmake road's
# `rcl_interfaces` descriptors for the parameter services.
[image.linux_cyclonedds]
entry = "c_parameters"
rmw = "cyclonedds"
