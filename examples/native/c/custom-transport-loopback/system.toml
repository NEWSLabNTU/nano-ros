# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses, and the same file a Rust leaf writes.
# Replaces the `package.xml` `<nano_ros deploy= board= rmw=/>` tuple:
# `find_package(nano_ros)` reads this through `nros ws leaf-system`, which
# derives the platform (`native`) from the board. Switching board is editing
# `[image.*] board`.


[system]
name = "native_c_custom_transport_loopback"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "native_c_custom_transport_loopback"
class = "native_c_custom_transport_loopback::CustomTransportLoopback"
name = "loopback_demo"

# Host build. The locator and domain stay runtime env on native
# (`NROS_LOCATOR` / `ROS_DOMAIN_ID`); the board applies only the node name.
[image.native]
board = "native"
