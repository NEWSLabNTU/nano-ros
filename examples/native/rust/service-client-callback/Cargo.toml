[package]
name = "native-rs-service-client-callback"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "service-client-callback"
path = "src/main.rs"

# Phase 212.L.2 — Application pkg shape. Native-only deploy target.
[package.metadata.nros.application]
deploy = ["linux"]

[dependencies]
nros = { version = "*", default-features = false, features = ["std", "alloc", "env", "rmw-cffi", "ros-humble"] }
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305),
# so this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
native_rs_service_client_callback_nros_selection = { path = "build/nros/selection" }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
log = "0.4"
env_logger = "0.11"

# Standalone-workspace marker (see service-client/Cargo.toml for rationale).
[workspace]
