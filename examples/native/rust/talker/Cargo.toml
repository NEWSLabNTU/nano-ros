[package]
name = "native-rs-talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "talker"
path = "src/main.rs"

# Phase 212.L.2 — Application pkg shape. Native-only deploy target.
# `nros check` rejects any RTOS in this list.
[package.metadata.nros.application]
deploy = ["native"]

[features]
# Phase 118 — single source-of-truth talker. RMW selected at build
# time via mutually exclusive features. `cargo build` with no
# `--features` flag falls into the canonical `rmw-zenoh` path so
# `cargo run -p native-rs-talker` Just Works for the docs-first
# experience.
# The edition is deliberately NOT in `default`. Cargo features are ADDITIVE
# and `ros-{humble,iron,jazzy}` are `compile_error!`-exclusive, so a default
# edition makes `--features ros-jazzy` yield BOTH and fail to compile — the
# user would have to know to pass `--no-default-features` and then re-name
# every other default they still wanted. The C++ standalone selector
# (`-DNANO_ROS_ROS_EDITION=jazzy`) simply REPLACES; this is how the cargo side
# gets the same UX. Naming no edition is legal (only >1 trips the
# `compile_error!`) and resolves to humble by construction: every edition
# consumer gates on `cfg(not(any(ros-iron, ros-jazzy)))`. phase-315 W3.
default = ["rmw-zenoh"]
# Each `rmw-*` activates the app-owned optional backend dep and forwards to
# `nros-board-native`, whose `register_linked_rmw()` call in `main.rs`
# registers the selected backend before the executor opens. (`nros/rmw-cyclonedds`
# is the typed-descriptor marker the Cyclone path additionally needs.)
rmw-zenoh = ["dep:nros-rmw-zenoh", "nros-board-native/rmw-zenoh"]
rmw-cyclonedds = ["nros/rmw-cyclonedds", "dep:nros-rmw-cyclonedds-sys", "nros-board-native/rmw-cyclonedds"]
rmw-xrce = ["dep:nros-rmw-xrce-cffi", "nros-board-native/rmw-xrce"]

# ROS edition — orthogonal to RMW/platform, selected like the `rmw-*` block
# above. `default` pins `ros-humble` (byte-identical to the historical build);
# the multi-edition harness builds a fixture with `--no-default-features
# --features "rmw-<x> ros-<edition>"`. Each forwards to the `nros` umbrella,
# which gates the RIHS01 keyexpr/type-hash tail. Editions are mutually exclusive
# (the umbrella `compile_error!`s on two), exactly like the RMW backends.
# Forward to BOTH the `nros` umbrella (codegen/type-hash consistency) AND the
# app-owned optional `nros-rmw-zenoh` (the `?` = only when `rmw-zenoh` is on),
# whose keyexpr module cfg-gates the RIHS01 type-hash tail on `ros-iron`/
# `ros-jazzy`. Without the zenoh forward the keyexpr silently stays the Humble
# `TypeHashNotSupported` placeholder even in a jazzy build.
ros-humble = ["nros/ros-humble", "nros-rmw-zenoh?/ros-humble"]
ros-iron = ["nros/ros-iron", "nros-rmw-zenoh?/ros-iron"]
ros-jazzy = ["nros/ros-jazzy", "nros-rmw-zenoh?/ros-jazzy"]

# Zenoh-specific link plumbing (no source gate). The test-only variants that
# used to be feature gates here (safety-e2e / param-services / header) live in
# `packages/testing/nros-tests/bins/{safety,param,header}-chatter-talker`.
link-tls = ["nros-rmw-zenoh?/link-tls"]

[dependencies]
nros = { version = "*", default-features = false, features = ["std", "rmw-cffi"] }
# Phase 123.A.1.x.2 — POSIX `nros_platform_*` C symbols ship as a
# standalone C library inside `nros-platform-cffi[posix-c-port]`. Pure-
# cargo builds (no CMake glue) enable the feature so the library's
# `build.rs` compiles the C port into the binary.
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }
# Native board shim: `nros_board_native::register_linked_rmw()` (called first
# thing in `main`) registers whichever backend the selected `rmw-*` feature
# linked. The app still owns its concrete backend dep below so the backend's
# feature set (std / ros edition / link options) is pinned here.
nros-board-native = { version = "*", default-features = false }
nros-rmw-zenoh = { version = "*", default-features = false, features = ["std", "platform-posix", "ros-humble"], optional = true }
nros-rmw-cyclonedds-sys = { version = "*", features = ["platform-posix"], optional = true }
nros-rmw-xrce-cffi = { version = "*", default-features = false, features = ["std"], optional = true }
std_msgs = { path = "generated/std_msgs", default-features = false }
log = "0.4"
env_logger = "0.11"

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root. Without it, cargo walks up + adopts the example into the
# outer nano-ros workspace (in nested checkouts) or gets adopted by a user's
# workspace `members` glob when they copy this example out, breaking the
# README's "standalone copy-out template" promise. Canonical in-tree builds
# also pass via the root `exclude = [...]` list (belt-and-braces).
[workspace]
