# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses. Switching board is editing `[image.*] board`
# and re-running `nros sync`.


[system]
name = "native_service_server"
rmw = "zenoh"
domain_id = 0
# The image a bare `nros sync` / `nros build` / `cargo build` builds.
default_images = ["linux"]

[[component]]
pkg = "native_service_server"
class = "native_rs_service_server::AddTwoIntsServer"
name = "add_two_ints_server"

# Host build. The locator and domain stay runtime env on native
# (`NROS_LOCATOR` / `ROS_DOMAIN_ID`); the board applies only the node name.
#
# ONE IMAGE PER RMW × ROS EDITION (issue 1305, RFC-0031 / RFC-0056). The RMW
# and the edition are declared here and lowered into the generated selection
# package (`build/nros/selection`), never named as cargo features in
# `Cargo.toml`. `nros sync` / `nros build` take the default image; name another
# with `nros sync --image <id> && nros build <id>`. The edition images exist
# for `just ros_editions build-e2e-fixtures`; the id is `linux`, then `_<rmw>`
# unless zenoh, then `_<edition>` unless humble.
[image_defaults]
board = "linux"

[image.linux]

[image.linux_xrce]
rmw = "xrce"

[image.linux_cyclonedds]
rmw = "cyclonedds"

[image.linux_iron]
ros_edition = "iron"

[image.linux_xrce_iron]
rmw = "xrce"
ros_edition = "iron"

[image.linux_cyclonedds_iron]
rmw = "cyclonedds"
ros_edition = "iron"

[image.linux_jazzy]
ros_edition = "jazzy"

[image.linux_xrce_jazzy]
rmw = "xrce"
ros_edition = "jazzy"

[image.linux_cyclonedds_jazzy]
rmw = "cyclonedds"
ros_edition = "jazzy"
