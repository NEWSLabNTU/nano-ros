[package]
name = "native-rs-service-server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "service-server"
path = "src/main.rs"

# phase-338 W3 — node logic moved to a lib so it is byte-identical to every
# other platform's copy; `main.rs` is the platform glue (`nros::main!()`).
[lib]
name = "native_rs_service_server"
crate-type = ["rlib"]
path = "src/lib.rs"

# The board, RMW, ROS edition, network identity and node declaration live in
# `system.toml` beside this manifest (RFC-0098 D3/D5) — nothing here names a
# board, an RMW or an edition. They reach the build through the generated
# selection package below (RFC-0098 D6, RFC-0031, issue 1305).

[dependencies]
nros = { version = "*", default-features = false, features = ["std", "alloc", "env", "rmw-cffi", "macros"] }
# The image's board crate (`LinuxBoard::run`, the `BoardEntry` lifecycle
# `nros::main!` drives), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305).
# `nros::main!` reaches the board through it.
native_rs_service_server_nros_selection = { path = "build/nros/selection" }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
log = "0.4"
env_logger = "0.11"

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root. Without it, cargo walks up + adopts the example into the
# outer nano-ros workspace (in nested checkouts) or gets adopted by a user's
# workspace `members` glob when they copy this example out, breaking the
# README's "standalone copy-out template" promise. Canonical in-tree builds
# also pass via the root `exclude = [...]` list (belt-and-braces).
[workspace]
