include = [ "../../../../../nros-patch.toml", "nros-board.toml"]
[build]
target = "thumbv7m-none-eabi"

# Phase 132 — serial-only firmware. See serial-talker/.cargo/config.toml
# for the full rationale; `zpico-sys`'s build.rs honours this env
# var and skips the smoltcp glue that would otherwise fail to link.
[env]
ZPICO_NO_SMOLTCP = "1"
# Phase 204.7 — serial-only: shed the IP link layer (Z_FEATURE_LINK_TCP/UDP=0);
# --gc-sections strips the residual smoltcp impl. Serial link stays on.
NROS_LINK_IP = "0"
# #184 — the phase-271 per-entry executor backing is a single ~75 KB
# allocation, so the phase-204.5 24 KB "zenoh-pico working set" heap OOMs at
# boot (`memory allocation of 74888 bytes failed`). Match the #176 board
# default (128 KB): HEAP is `.bss` on the 16 MB MPS2-AN385 — no flash cost.
NROS_HEAP_SIZE = "131072"


[patch.crates-io]
nros-board-mps2-an385 = { path = "../../../../packages/boards/nros-board-mps2-an385" }  # nros-managed
nros-rmw-zenoh = { path = "../../../../packages/rmw/zenoh/nros-rmw-zenoh" }  # nros-managed

