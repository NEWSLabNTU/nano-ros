[package]
name = "nuttx_rs_action_client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "NuttX QEMU ARM Fibonacci action client — Component pkg"

# phase-338 W2 — collapsed from the retired `-entry` package: this ONE
# package carries both the node logic (src/lib.rs) and the entry
# (src/main.rs's `nros::main!()`), the shape native already had.
[[bin]]
name = "action-client"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]
# phase-359 W7 — was `["rlib", "staticlib"]`. A `staticlib` is a FINAL artifact,
# so it needs its own `#[panic_handler]`; that used to arrive from `std` via
# `nros`, and with the family on `no_std` there is nothing to supply one for a
# node package (which should not own lang items anyway). Nothing consumes these
# staticlibs — the entry links the RLIB, via `class = "<pkg>::<Node>"` — and the
# node packages of every other no_std family (freertos, mps2) are `rlib`-only
# for exactly this reason. This makes NuttX match them.

[dependencies]
# phase-359 W7 — was `["std", "rmw-cffi"]`; this family is no_std now.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
# Demo-parity log lines route through the `log` facade; the platform
# entry runtime owns the sink.
log = "0.4"

# Everything only the IMAGE needs is one generated dependency, the same for
# every board (RFC-0098 D6, issue 1305): the selection package `nros sync`
# writes per image under `build/<image>/nros-selection/`. It carries the board
# crate with the features the image's `system.toml` implies (RMW, transport,
# entry shape), the platform and runtime crates, and the board's crate-root
# items; `nros::main!` reaches the board through it. The generated settings
# file's `[patch]` row points this name at the image's copy.
#
# Target-scoped, so the node in `lib.rs` still builds for the host: the
# metadata probe compiles it there to learn what it creates (issue 1265),
# and the image's crates do not build for the host.
[target.'cfg(target_os = "nuttx")'.dependencies]
nuttx_rs_action_client_nros_selection = { version = "0.0.0" }

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5), and nothing here names the board: switching board is
# editing `[image.*] board` there and re-running `nros sync`.

[package.metadata.ament]
build_depend = ["example_interfaces"]
exec_depend = ["example_interfaces"]

[profile.release]
opt-level = "s"
lto = true

[workspace]
