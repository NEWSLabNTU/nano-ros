[package]
name = "nuttx_rs_listener"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "NuttX QEMU ARM listener — Phase 212.L Component pkg"

# phase-338 W2 — collapsed from the retired `-entry` package: this ONE
# package carries both the node logic (src/lib.rs) and the entry
# (src/main.rs's `nros::main!()`), the shape native already had.
[[bin]]
name = "listener"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]
# phase-359 W7 — was `["rlib", "staticlib"]`. A `staticlib` is a FINAL artifact,
# so it needs its own `#[panic_handler]`; that used to arrive from `std` via
# `nros`, and with the family on `no_std` there is nothing to supply one for a
# node package (which should not own lang items anyway). Nothing consumes these
# staticlibs — the entry links the RLIB, via `class = "<pkg>::<Node>"` — and the
# node packages of every other no_std family (freertos, mps2) are `rlib`-only
# for exactly this reason. This makes NuttX match them.

[dependencies]
# phase-338 W2 — carried over from the collapsed `-entry` package.
# #127: `rmw-zenoh` bakes the zenoh RMW backend into the image (the board's
# `run_entry` registers it explicitly — NuttX has no .init_array
# auto-register); without it `Executor::open` fails instantly with
# Transport(ConnectionFailed) before touching the network.
nros-board-nuttx-qemu = { version = "*", features = ["rmw-zenoh"] }
# phase-359 W7 — was `["std", "rmw-cffi"]`; this family is no_std now.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
nros-platform = { version = "*", default-features = false, features = ["platform-nuttx"] }
std_msgs = { path = "generated/std_msgs", default-features = false }
# phase-277 W4 — chatter log lines (`Publishing:` / `I heard:`) route through
# the `log` facade; the platform entry runtime owns the sink.
log = "0.4"

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board.

[package.metadata.ament]
build_depend = ["std_msgs"]
exec_depend = ["std_msgs"]

[profile.release]
opt-level = "s"
lto = true

[workspace]
