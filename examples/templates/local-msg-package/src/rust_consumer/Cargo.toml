[package]
name = "rust_consumer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Phase 244.C4 — single-pkg clean shape. `src/lib.rs` is the agnostic Node
# (`nros::node!(Consumer)` emits `register`); `src/main.rs` is the Entry
# (`nros::main!()` Form-1 self-bringup links the sibling lib's `register`).
# The native board's `BoardEntry` owns executor / RMW / spin.
[lib]
name = "rust_consumer"
path = "src/lib.rs"

[[bin]]
name = "rust_consumer"
path = "src/main.rs"

# Phase 210.D.3 fixture — standalone Cargo pkg. Empty [workspace] marker
# (cargo-ros2 pattern) so cargo treats this Cargo.toml as the patch
# authority for the auto-managed [patch.crates-io] block written by
# `nros sync` (block lives at the bottom of this file).
[workspace]

# Marks this package as an ENTRY. What it deploys to — `[image.native] board =
# "native"`, which `nros::main!()` maps to `nros_board_linux::LinuxBoard` — and
# the node it registers are stated in the `system.toml` beside this manifest
# (RFC-0098 D3/D5). phase-445 W5 moved the `deploy` key, the
# `[package.metadata.nros.deploy.native]` overlay and the
# `[package.metadata.nros.node]` table there.
[package.metadata.nros.entry]

[dependencies]
# Board crate — hosted Linux native board. Supplies the
# `LinuxBoard` ZST the macro resolves; force-links the zenoh RMW.
nros-board-linux = { version = "*" }
# nros — `nros::node!` (lib) + `nros::main!` (bin) macros + Node API.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble", "macros"] }
# Phase 248 C5c — posix platform symbols via a direct `nros-platform` dep
nros-platform = { version = "*", default-features = false, features = ["platform-posix"] }

# Msg deps — workspace + AMENT, all resolved through the auto-managed
# [patch.crates-io] block below.
local_msgs = { path = "../../generated/local_msgs", version = "0.0.0", default-features = false }
extra_msgs = { path = "../../generated/extra_msgs", version = "0.0.0", default-features = false }
std_msgs = { path = "../../generated/std_msgs" }
geometry_msgs = { path = "../../generated/geometry_msgs" }
sensor_msgs = { path = "../../generated/sensor_msgs" }
