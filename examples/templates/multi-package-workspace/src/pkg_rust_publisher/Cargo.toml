# Escape the in-repo nano-ros workspace — this example deliberately
# behaves like a downstream consumer: a standalone Cargo project that
# resolves the nano-ros crates through the `[patch.crates-io]` block
# `nros sync` writes, exactly as `local-msg-package` does.
[workspace]

[package]
name = "pkg_rust_publisher"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Phase 123.A.10 — multi-package workspace demo (Rust publisher).
#
# The nano-ros crates are named by VERSION, not by path. A `path =
# "../../../../../packages/api/nros"` walks five levels up and out of the
# template, so it resolves only while the template sits inside this checkout:
# copied out the way a user copies it, cargo reports `failed to read
# <copy-root>/packages/api/nros/Cargo.toml`. That is what it did until
# 2026-09-20, when `check-template-copy-out.sh` built a copy for the first
# time. `version = "*"` is resolved by the `[patch.crates-io]` block `nros
# sync` writes, which points at whatever nano-ros the user has — the same
# shape `local-msg-package/src/rust_consumer` uses, and the reason that one
# survives a copy-out.
#
# Crates.io publishing isn't available for `nros` because the package depends
# transitively on C/C++ submodules (zenoh-pico, mbedtls); the patch block is
# what stands in for a registry here.

# Phase 244.C4 — single-pkg clean shape. `src/lib.rs` is the agnostic Node
# (`nros::node!(Talker)` emits `register`); `src/main.rs` is the Entry
# (`nros::main!()` Form-1 self-bringup links the sibling lib's `register`).
# The native board's `BoardEntry` owns executor / RMW / spin.
[lib]
name = "pkg_rust_publisher"
path = "src/lib.rs"

[[bin]]
name = "pkg_rust_publisher"
path = "src/main.rs"

# This package is an ENTRY because the `system.toml` beside this manifest
# declares its image: what it deploys to — `[image.linux] board = "linux"`,
# which `nros::main!()` maps to `nros_board_linux::LinuxBoard`, reached through
# the generated selection package below — and the node it registers
# (RFC-0098 D3/D5). No manifest table marks it (issue 1289).

[dependencies]
# nros — `nros::node!` (lib) + `nros::main!` (bin) macros + Node API.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
# The image's board crate (`LinuxBoard`, the `BoardEntry` lifecycle
# `nros::main!` drives), its RMW backend, its platform and its ROS edition —
# GENERATED by `nros sync` / `nros build` from `system.toml` (RFC-0098 D6,
# issue 1305), so this manifest names no board and a board switch is one line
# there. `nros::main!` reaches the board through it.
pkg_rust_publisher_nros_selection = { path = "build/nros/selection" }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
builtin_interfaces = { path = "../../generated/builtin_interfaces", default-features = false }  # nros-managed
