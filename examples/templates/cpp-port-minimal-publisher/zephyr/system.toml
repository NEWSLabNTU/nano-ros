# What this build deploys to (RFC-0098 D3/D5). The board is the Zephyr
# `mps2/an385` (Cortex-M3, QEMU) board package, `mps2-an385-zephyr`: it lowers
# to `west build -b mps2_an385` and carries the board's own Kconfig (the
# in-kernel IP stack on QEMU's lan9118, the slirp address, sizing, entropy),
# which the nano-ros module merges ahead of `os_config` (issue 1782). The RMW
# is stated here rather than in a conf file: the nano-ros module renders this
# image into a Kconfig fragment merged after every conf (RFC-0098 D10/D11).

[system]
name = "minimal_publisher"
rmw = "zenoh"
domain_id = 0

[image.zephyr]
board = "mps2-an385-zephyr"
rmw = "zenoh"
# The Zephyr-native settings zenoh-pico needs (POSIX threads, sockets); the
# module adds it ahead of the caller's EXTRA_CONF_FILE (phase-481 W3).
os_config = ["prj-zenoh.conf"]
