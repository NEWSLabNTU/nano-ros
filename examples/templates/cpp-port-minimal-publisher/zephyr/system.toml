# What this build deploys to (RFC-0098 D3/D5). The board is Zephyr's: the
# concrete target (`mps2/an385`) is the `west build -b` argument. The RMW is
# stated here rather than in a conf file: the nano-ros module renders this
# image into a Kconfig fragment merged after every conf (RFC-0098 D10/D11).

[system]
name = "minimal_publisher"
rmw = "zenoh"
domain_id = 0

[image.zephyr]
board = "zephyr"
rmw = "zenoh"
# The Zephyr-native settings zenoh-pico needs (POSIX threads, sockets); the
# module adds it ahead of the caller's EXTRA_CONF_FILE (phase-481 W3).
conf = ["prj-zenoh.conf"]
