# Base config. The RMW choice comes from prj-<rmw>.conf (the image's
# `os_config`); the board's network, sizing and static address from the
# `mps2-an385-zephyr` board package's own `prj.conf`, which the nano-ros module
# merges after this file because `system.toml` names that board (issue 1782).

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=n

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_DNS_RESOLVER=n

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
CONFIG_STD_CPP17=y

# A ported ROS 2 program is written against the C++ standard library
# (`std::string`, `std::to_string`, `<chrono>` literals, `std::make_shared`),
# so it needs the toolchain's full libstdc++ rather than Zephyr's minimal one.
# Exceptions stay off: nano-ros reports a failed create by aborting with a
# message (RFC-0089), never by throwing.
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
