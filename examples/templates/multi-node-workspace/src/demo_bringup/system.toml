# Bringup pkg system descriptor — declarative topology + per-target
# deploy config. No Cargo.toml / CMakeLists.txt / src/ lives here.
#
# `default_launch` is the launch file `nros::main!(launch = "demo_bringup")`
# (or `nros plan demo_bringup` with no explicit file) picks by default.

[system]
name = "demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "talker_pkg"
class = "talker_pkg::Talker"
name = "talker"

[[component]]
pkg = "listener_pkg"
class = "listener_pkg::Listener"
name = "listener"

# The LAST `[deploy.*]` block: the implicit machine this system runs on.
#
# Everything else has moved — placement to `[host.<name>]`, board builds to
# `[image.<id>]`, site config to `[board_config.<board>]`. This one is a
# machine too, so it belongs in `[host.*]`; it stays here until that move is
# measured, because it is the block that currently makes placement HAPPEN
# (issue 0951).
[deploy.native]
kind = "self"
board = "native"
