# nano-ros Zephyr starter — zenoh RMW, C API (Phase 205.A).
# The RMW is `system.toml`'s; for xrce/cyclonedds see
# modules/nano-ros/examples/zephyr/c/talker (one image per RMW).

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Networking (any networked RMW on QEMU / native_sim)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_DNS_RESOLVER=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# nano-ros: enable the module. The RMW (zenoh) and the API are NOT stated here:
# the module renders them from `system.toml`'s image (phase-481, RFC-0098 D11).
# (ROS edition is a build-time Cargo feature, NOT a Kconfig symbol — do not set
# CONFIG_NROS_ROS_EDITION; Zephyr aborts on the undefined symbol.)
CONFIG_NROS=y
# The TYPED Zephyr carrier entry is C++ (it drives the C component's
# factory/configure seam via ZephyrBoard::run_components) and compiles as
# C++17 (nros-cpp qos.hpp uses mutating constexpr members).
CONFIG_STD_CPP17=y

# zenoh-pico needs POSIX threads + a roomy heap/stack
CONFIG_POSIX_API=y
# 64, not 32 — the build derives a floor and refuses below it; see
# `_nros_mutex_floor` in `zephyr/cmake/nros_cargo_build.cmake`.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
