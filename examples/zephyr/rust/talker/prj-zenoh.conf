# RMW overlay: zenoh-pico backend.

CONFIG_NROS_RMW_ZENOH=y

# Zenoh-pico uses TCP to reach zenohd.
CONFIG_NET_TCP=y

# zenoh-pico thread + mutex requirements.
CONFIG_POSIX_API=y
# 64, not 32 — the build derives a floor and refuses below it; see
# `_nros_mutex_floor` in `zephyr/cmake/nros_cargo_build.cmake`.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

# Resource sizing — zenoh-pico is lighter than DDS.
CONFIG_MAIN_STACK_SIZE=16384
# Issue 0155 — phase-271 moved the executor's default backing to a leaked
# heap allocation (~75 KB at Executor::open); 64 KB OOM'd at boot.
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_NET_SHELL=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DEBUG=y

# Issue 1611 -- this overlay states NO libc arena size and NO executor
# backing, on purpose.
#
# Both lines used to sit here as one pairing (issues 0163/1145/1171): Rust's
# `alloc` went to picolibc `malloc`, so the arena was raised to 1 MiB and then
# lowered by the executor backing once that became a `.bss` static. Issue 1324
# moved every Rust allocation onto the nros heap (CONFIG_NROS_ZEPHYR_HEAP_SIZE),
# so the premise went with it. MEASURED on native_sim rust/talker with gdb on
# Zephyr's common-libc `malloc`: zero calls in a 6 s publishing run, and the
# image's only static caller is NSOS `getaddrinfo`'s `strdup` of a canonical
# name. The Kconfig default (16 KiB on native_sim, the remaining RAM on
# mps2_an385) serves that; the executor backing is the DERIVED default.
