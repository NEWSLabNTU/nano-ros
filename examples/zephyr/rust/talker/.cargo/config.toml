include = ["../../../../../nros-patch.toml"]
# Phase 97.4.zephyr-native_sim — pin SPDP unicast locator + mcast TX
# iface for the Cyclone DDS RMW; harmless for zenoh/xrce (read only by
# `nros-platform-zephyr`).
[env]
NROS_LOCAL_IPV4 = "127.0.0.10"
NROS_LOCAL_IPV4_BYTES = "127,0,0,10"

[patch.crates-io]
nros-platform = { path = "../../../../packages/platform/nros-platform" }  # nros-managed
nros-rmw-xrce-cffi = { path = "../../../../packages/rmw/xrce/nros-rmw-xrce-cffi" }  # nros-managed
nros-rmw-zenoh = { path = "../../../../packages/rmw/zenoh/nros-rmw-zenoh" }  # nros-managed
nros-zephyr-build = { path = "../../../../packages/tooling/nros-zephyr-build" }  # nros-managed

