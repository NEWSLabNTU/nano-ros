# The native_sim RAM budget of the zenoh image -- named by
# `[image.zephyr_zenoh] os_config` after `prj-zenoh.conf`.
#
# Split out of `prj-zenoh.conf` (phase-531 W6) because these are the symbols
# the mps2/an385 board package (`packages/boards/nros-board-mps2-an385-zephyr/
# prj.conf`) also sets, to that board's measured budget. A workspace image
# merges its board package's Kconfig BEFORE its own `os_config` fragments, so
# naming them in the shared fragment would override the board on mps2. The
# standalone leaf merged the board file last, which is why the values could
# sit in one fragment until now. The mps2 images name `prj-zenoh.conf` alone
# and get the board's values; these are native_sim's.

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# The kernel heap. mps2 takes its board package's measured value (issue 2202:
# 0 B used by the Rust talker there); native_sim keeps the leaf's 128 KiB.
CONFIG_HEAP_MEM_POOL_SIZE=131072
