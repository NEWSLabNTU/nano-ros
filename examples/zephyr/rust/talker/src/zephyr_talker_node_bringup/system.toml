# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses. Switching board is editing `[image.*] board`
# and re-running `nros configure`.
#
# ONE IMAGE PER RMW (phase-481 W3, RFC-0098 D10/D11). The nano-ros Zephyr
# module renders the selected image into a Kconfig fragment merged after every
# conf file: the RMW choice from `rmw`, the language API from the package, the
# agent endpoint from `locator`, and every `env` knob. So the `prj*.conf` files
# hold Zephyr's own settings only, and each image's `conf` names the fragment
# its RMW needs (networking, POSIX, heap), which the module adds before that
# rendering. Build one with `west build ... -- -DNROS_IMAGE=<id>`; with none,
# `default_images` builds zenoh.

[system]
name = "zephyr_talker"
# The system default every image below overrides with its own `rmw`.
rmw = "zenoh"
domain_id = 0
default_images = ["zephyr_zenoh"]

[[component]]
pkg = "zephyr_talker_node"
class = "zephyr_talker_node::Talker"
name = "talker"

# The Zephyr family; the concrete Zephyr board (`native_sim/native/64`) is the
# west `-b` argument, resolved through the board catalog.
[image.zephyr_zenoh]
board = "zephyr"
rmw = "zenoh"
os_config = ["prj-zenoh.conf", "prj-zenoh-native-sim.conf"]

[image.zephyr_xrce]
board = "zephyr"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
# The Micro-XRCE-DDS agent. A test harness passes its own port per run
# (`-DCONFIG_NROS_XRCE_AGENT_PORT=…`, which merges after this).
locator = "udp/127.0.0.1:2018"
# This image creates: pub:std_msgs/msg/String:/chatter + timer
# so: no subscription, no service of either direction.
# Issue 1033 -- `xrce_session_state_t` is one platform-heap allocation sized
# by these three caps at BUILD time; at the crate defaults it is 6.4x the
# 64 KiB arena and the image cannot boot. This is the one standalone Zephyr
# leaf whose entity inventory composes (`derived`, MAX_SUBSCRIBERS 0,
# MAX_QUERYABLES 1 -- measured, phase-481 W3):
#   * SUBSCRIBERS: not stated -- the derived 0 reaches BOTH lanes (issue 1796:
#     until then it reached only the cmake one, and deleting this row booted
#     `HEAP EXHAUSTED (TOO SMALL): request 283912 bytes, arena 131584`);
#   * SERVICE_SERVERS: the derived 1 is the queryable a TRANSIENT_LOCAL
#     publisher costs on ZENOH, which XRCE does not create, so 0 is stated;
#   * SERVICE_CLIENTS has no derivation at all.
[image.zephyr_xrce.knobs.xrce]
max_service_servers = 0
max_service_clients = 0

[image.zephyr_cyclonedds]
board = "zephyr"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]

# phase-531 W6 -- the mps2/an385 image, the one QEMU boots
# (`tests/zephyr_cortex_m_qemu.rs`). The board package supplies the board's
# Kconfig and RAM budget (`packages/boards/nros-board-mps2-an385-zephyr/
# prj.conf`), merged ahead of `os_config`, so the image names the shared zenoh
# fragment only: `prj-zenoh-native-sim.conf` would override the board's budget.
# The zenoh locator (the QEMU SLIRP host, a per-cell port) is the fixture
# row's isolation value, not the image's.
[image.mps2_zenoh]
board = "mps2-an385-zephyr"
rmw = "zenoh"
os_config = ["prj-zenoh.conf"]

# Issue 2078 -- the same talker with NO IP stack: zenoh over a UART, a LINK
# witness (`tests/zephyr_link_layout.rs` reads the ELF; nothing boots it). The
# entry `nros::main!` emits calls `nros_platform_zephyr_wait_network` whatever
# the transport, and the symbol was compiled only with CONFIG_NET_SOCKETS.
# `mps2-an385-serial.conf` is a delta that turns the board's networking off,
# so it is named last, after the board package's Kconfig and the zenoh
# fragment. The locator (uart1, the board's free UART) is the fixture row's.
[image.mps2_serial]
board = "mps2-an385-zephyr"
rmw = "zenoh"
os_config = [
    "prj-zenoh.conf",
    "../../../../../../cmake/zephyr/mps2-an385-serial.conf",
]

# Issue 2389 -- the zenoh image with a connect BUDGET, for the cell that boots
# it against a router that is not there and against one that accepts the TCP
# connect and never answers (`tests/zephyr_connect_budget.rs`). Each must end in
# `ConnectionFailed` within the budget, with a console line naming it. The test
# passes its own locator (`-testargs --nros-locator=`), so the row's baked one
# is never dialled.
[image.zephyr_connect_budget]
board = "zephyr"
rmw = "zenoh"
os_config = ["prj-zenoh.conf", "prj-zenoh-native-sim.conf"]

[image.zephyr_connect_budget.knobs.zenoh.limits]
connect_timeout_ms = 3000
