# Zephyr-native settings the xrce image needs -- named by
# `[image.zephyr_xrce] conf` in system.toml, which the nano-ros module adds
# to the build. The RMW choice and every nano-ros knob are the image's
# (phase-481, RFC-0098 D10/D11): never `CONFIG_NROS_*` here.

# XRCE uses UDP to reach the agent (no TCP needed) — but the base
# transport-posix-udp.c also pulls TCP headers; keep TCP on for
# the same reason zenoh does.
CONFIG_NET_TCP=y

# XRCE-DDS doesn't require POSIX threads — Kconfig in
# `nros-rmw-xrce-cffi` already gates the platform-zephyr feature.

# Resource sizing — XRCE is lighter than DDS, heavier than zenoh.
CONFIG_MAIN_STACK_SIZE=16384
# Issue 0155 — phase-271 moved the executor's default backing to a leaked
# heap allocation (~75 KB at Executor::open); 64 KB OOM'd at boot.
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_NET_SHELL=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DEBUG=y

# Issue 1189 — this overlay states NO libc arena size, on purpose.
#
# `CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576` used to sit here under a
# comment about picolibc, copied from prj-zenoh.conf. Measured on the resolved
# `.config` of a native_sim XRCE build: the image is `CONFIG_EXTERNAL_LIBC=y`
# and that symbol is ABSENT, so the line reached nothing and the 1 MiB was
# never measured for an XRCE image.
#
# Neither overlay picks a libc, and neither should. Zephyr's
# `choice LIBC_IMPLEMENTATION` reads `default EXTERNAL_LIBC if NATIVE_BUILD &&
# !(NATIVE_LIBRARY && NATIVE_LIBC_INCOMPATIBLE)`, and `CONFIG_POSIX_API` —
# which prj-zenoh.conf sets for zenoh-pico's pthreads — `select
# NATIVE_LIBC_INCOMPATIBLE`, so a zenoh image falls through to
# `default PICOLIBC`. XRCE needs no POSIX option and keeps the host libc. That
# arm is NATIVE_BUILD-only: on a real board both RMWs already take
# `default PICOLIBC`, so there is nothing to make alike here.

