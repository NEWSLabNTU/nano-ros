# Base config for Zephyr C talker (Phase 168.4 collapsed shape).
# The RMW choice comes from system.toml's image; the Zephyr-native settings
# its RMW needs from that image's `conf` (prj-<rmw>.conf).

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=n

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_DNS_RESOLVER=n

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
# The TYPED Zephyr carrier entry is C++ (it drives the C component's
# factory/configure seam via ZephyrBoard::run_components) and compiles as
# C++17 (nros-cpp qos.hpp uses mutating constexpr members). The nano-ros API
# choice itself is rendered from system.toml (phase-481, RFC-0098 D11).
CONFIG_STD_CPP17=y

CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y
