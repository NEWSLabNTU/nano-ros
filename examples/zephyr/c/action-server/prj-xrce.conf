CONFIG_NROS_RMW_XRCE=y
CONFIG_NROS_XRCE_AGENT_ADDR="127.0.0.1"
CONFIG_NROS_XRCE_AGENT_PORT=2018

CONFIG_NET_TCP=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Issue 1010 / 1033 — `xrce_session_state_t` is ONE heap allocation out of the
# platform arena (CONFIG_NROS_ZEPHYR_HEAP_SIZE, default 65536), and these three
# caps decide its size at BUILD time. At the crate defaults (8 subscribers / 4
# service servers / 4 service clients) it is 423,824 bytes — 6.4x the whole
# arena in a single request, so the image cannot boot on any host, ever.
#
# STATED rather than derived because a standalone Zephyr application reaches no
# entity inventory: it calls no `nano_ros_entry`, and phase-412 retired the
# `ENTITIES` declaration that used to feed the standalone composer. The cmake
# bridge therefore reports `left to its crate default -- no value stated and
# none derivable` for both -1 knobs, which is what these lines answer. The six
# C++ overlays have carried them since issue 1033; the C and Rust ones had not,
# which is why six of the nine Zephyr XRCE cells died at `Executor::open`.
#
# This image creates: action_server:example_interfaces/action/Fibonacci:/fibonacci + timer
# so: one action server = ACTION_SERVER_QUERYABLES (3) service servers
# (send_goal / cancel_goal / get_result); feedback and status are topics.
CONFIG_NROS_XRCE_MAX_SUBSCRIBERS=0
CONFIG_NROS_XRCE_MAX_SERVICE_SERVERS=3
CONFIG_NROS_XRCE_MAX_SERVICE_CLIENTS=0
