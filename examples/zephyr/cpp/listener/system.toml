# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses, and the same file a Rust leaf writes.
# Replaces the `package.xml` `<nano_ros deploy= board= rmw=/>` tuple:
# `find_package(nano_ros)` reads this through `nros ws leaf-system`, which
# derives the platform (`zephyr`) from the board. Switching board is editing
# `[image.*] board`.
#
# ONE IMAGE PER RMW (phase-481 W3, RFC-0098 D10/D11). The nano-ros Zephyr
# module renders the selected image into a Kconfig fragment merged after every
# conf file: the RMW choice from `rmw`, the language API from the package, the
# agent endpoint from `locator`, and every `env` knob. So the `prj*.conf` files
# hold Zephyr's own settings only, and each image's `conf` names the fragment
# its RMW needs (networking, POSIX, heap), which the module adds before that
# rendering. Build one with `west build ... -- -DNROS_IMAGE=<id>`; with none,
# `default_images` builds zenoh.

[system]
name = "zephyr_cpp_listener"
# The system default every image below overrides with its own `rmw`.
rmw = "zenoh"
domain_id = 0
default_images = ["zephyr_zenoh"]

[[component]]
pkg = "zephyr_cpp_listener"
class = "zephyr_cpp_listener::Listener"
name = "listener"

# The Zephyr family; the concrete Zephyr board (`native_sim/native/64`) is the
# west `-b` argument, resolved through the board catalog.
[image.zephyr_zenoh]
board = "zephyr"
rmw = "zenoh"
conf = ["prj-zenoh.conf"]

[image.zephyr_xrce]
board = "zephyr"
rmw = "xrce"
conf = ["prj-xrce.conf"]
# The Micro-XRCE-DDS agent. A test harness passes its own port per run
# (`-DCONFIG_NROS_XRCE_AGENT_PORT=…`, which merges after this).
locator = "udp/127.0.0.1:2018"
# This image creates: sub:std_msgs/msg/String:/chatter
# so: one subscription; no service of either direction.
# Issue 1033 -- `xrce_session_state_t` is one platform-heap allocation sized
# by these three caps at BUILD time; at the crate defaults it is 6.4x the
# 64 KiB arena and the image cannot boot. STATED, not derived: a standalone
# Zephyr leaf's entity inventory does not compose (measured, phase-481 W3:
# refused for every C/C++ leaf and five of the six Rust ones), and the client
# cap has no derivation at all, so `-1` would fall to the crate default.
# Issue 1761 -- the platform arena, from the issue-1424 heap gate's dump
# (2026-10-09, native_sim, `example_e2e` pubsub cell): this image peaked at
# 52,080 of the 66,048-byte default and kept 13,968 B, under the gate's
# 24,576 floor ("set CONFIG_NROS_ZEPHYR_HEAP_SIZE >= 76656"). 96 KiB keeps
# the floor with room for the run-to-run variance one dump cannot show.
env = { NROS_XRCE_MAX_SUBSCRIBERS = "1", NROS_XRCE_MAX_SERVICE_SERVERS = "0", NROS_XRCE_MAX_SERVICE_CLIENTS = "0", NROS_ZEPHYR_HEAP_SIZE = "98304" }

[image.zephyr_cyclonedds]
board = "zephyr"
rmw = "cyclonedds"
conf = ["prj-cyclonedds.conf"]
