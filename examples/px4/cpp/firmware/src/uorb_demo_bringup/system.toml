[system]
name = "uorb_demo"
rmw = "uorb"
domain_id = 0
default_launch = "demo.launch.xml"
# A PX4 module opts out of the stock node interfaces (the six parameter
# services and /rosout): PX4 serves its own parameters, and the module's
# budget is the flight stack's.
node_interfaces = "none"

[[component]]
pkg = "uorb_demo_pkg"
class = "uorb_demo_pkg::UorbDemo"
name = "uorb_demo"
