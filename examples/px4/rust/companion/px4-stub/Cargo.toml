[package]
name = "px4-stub"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Fake-PX4 XRCE-DDS stub: publishes /fmu/out/vehicle_odometry so the companion example (and CI) can exercise the round-trip without PX4 SITL (RFC-0039 Track B / Phase 233)"

[[bin]]
name = "px4-stub"
path = "src/main.rs"

[package.metadata.nros.application]
deploy = ["px4"]

[features]
# Phase 277 W3.b — single-RMW example: the xrce backend dep is unconditional
# (below). `rmw-xrce` is kept as a no-op feature name so existing
# `--features rmw-xrce` invocations (just/px4.just) keep working.
default = ["rmw-xrce"]
rmw-xrce = []

[dependencies]
# phase-359 W10 — was `["std", …]`. The stub is a hosted binary, but it builds
# its `ExecutorConfig` with `ExecutorConfig::new` from its OWN `std::env::var`
# reads (src/main.rs), never `ExecutorConfig::from_env`, so it needs no `env`
# (and hence no `std`) from the core.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble"] }
nros-rmw-xrce-cffi = { version = "*", default-features = false, features = ["std"] }
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }
# phase-361 W3.b — NO `features = ["std"]` here, and this line is a trap that
# only springs on regeneration. `nros generate-px4-msgs` emits a msg crate whose
# manifest is `[features] default = []` and nothing else
# (`rosidl_bindgen::generator::generate_cargo_toml`), so asking for `std`
# resolves to
#   error: failed to select a version for `px4_msgs` ... `px4_msgs` does not
#          have that feature   help: available features: default
# The generated tree is gitignored, so a checkout that never regenerated kept
# building against an OLDER crate that still had the feature. Issue 0716.
px4_msgs = { version = "*", default-features = false }
log = "0.4"
env_logger = "0.11"

[workspace]

[patch.crates-io]
# px4_msgs is generated from the PX4-Autopilot .msg tree by `nros
# generate-px4-msgs` (just px4 build-fixtures) — this row is maintained by
# hand, outside the nros-managed block (`nros sync` leaves it alone).
px4_msgs = { path = "generated/px4_msgs" }
