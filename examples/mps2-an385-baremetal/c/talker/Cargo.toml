[package]
name = "baremetal-c-talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "C talker on the pure bare-metal MPS2-AN385: C application, Rust link root (issue 1512)"

[[bin]]
name = "baremetal-c-talker"
test = false
bench = false

[dependencies]
# The C ABI. `platform-mps2-an385` is the arm issue 1512 added: bare metal is
# the one platform where `nros-platform`'s feature is board-specific, because
# the board IS the port.
#
# `panic-platform` is the image's ending (RFC-0077 `platform`): the handler in
# `nros-c` routes to `nros_platform_panic`, which the board's platform crate
# exports through `nros_platform_export_panic!` and lands on semihosting. It is
# named EXPLICITLY rather than left to `default-features` because this crate's
# `staticlib` crate-type is a FINAL artifact even when it is only a dependency,
# so without a provider cargo fails with `#[panic_handler] function required,
# but not found` — for the rlib the binary actually links. And it is the reason
# this leaf does NOT also carry `panic-semihosting` like its `rust/` siblings:
# two providers in one graph is a duplicate lang item.
nros-c = { version = "*", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "platform-mps2-an385",
    "panic-platform",
] }
# RFC-0071 D9 (phase-506 W4d) — the backend is this image's own dependency,
# not an `nros-c` feature: the API crate names no backend. A DIRECT dependency
# because `nros_cc_flags::backends` reads the backend's self-announcement
# (`DEP_NROS_RMW_ZENOH_NROS_RMW_BACKEND`), which cargo hands a direct dependent
# only. Its platform is what `nros-c`'s `platform-mps2-an385` used to forward
# to it. Its EDITION is not stated here: the selection package below names it
# from `system.toml` (issue 2045), so a declared `ros_edition` is the only knob.
nros-rmw-zenoh = { version = "*", default-features = false, features = ["platform-bare-metal"] }
# The image's board crate (reset vector, CMSDK Timer0 clock, LAN9118 + smoltcp
# bring-up, semihosting console and the `nros_log` sink — none of it reachable
# from C, which is why this leaf is rooted in Rust), its RMW backend and its
# runtime crates — GENERATED by `nros sync` / `nros build` from `system.toml`
# and the board descriptor (RFC-0098 D6, issue 1305), so this manifest names
# no board crate. `src/main.rs` reaches the board through it. The image states
# `panic = "platform"`, so the package links no second panic provider beside
# `nros-c`'s `panic-platform`.
baremetal_c_talker_nros_selection = { path = "build/nros/selection" }

[build-dependencies]
# Compiles `src/*.c` and the generated message C bindings for
# `thumbv7m-none-eabi`. `CC_thumbv7m_none_eabi` comes from the board's
# `cargo_config`, rendered into `build/<image>/nros-cargo.toml` by `nros sync`.
cc = "1"
# The nano-ros cc policy every C compile in the tree takes (issue 1542): the
# strict-declaration diagnostics as errors (issue 0383 — the pinned
# arm-none-eabi-gcc 13.2 only WARNS on an implicit declaration) and the
# gcc-safe frame pointer (issue 0478 — cc-rs hands gcc the clang-only
# `-mno-omit-leaf-frame-pointer` on a debug build, which gcc rejects).
# `check-cc-build-policy` holds every tracked `cc::Build` to it.
nros-cc-flags = { version = "*" }

# Phase 208.F1 — standalone workspace root, so cargo never adopts this leaf
# into the outer nano-ros workspace or a copy-out user's one.
[workspace]
