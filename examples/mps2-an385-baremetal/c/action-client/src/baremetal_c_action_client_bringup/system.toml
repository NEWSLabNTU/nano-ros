# What this example deploys to (RFC-0098 D3/D5): the bringup of a one-package
# workspace (RFC-0122 D3). The component `baremetal_c_action_client` is an ordinary
# C package; the build generates the image's entry, and on this board the
# entry's `main` is the board's C start (`nros_board_mps2_an385_start`), so
# the image is rooted in CMake like every RTOS board's (phase-553 W4).

[system]
name = "baremetal_c_action_client"
rmw = "zenoh"
ros_edition = "humble"
domain_id = 0
# The image a bare `nros configure` / `nros build` builds.
default_images = ["mps2-an385-baremetal"]

[[component]]
pkg = "baremetal_c_action_client"
class = "baremetal_c_action_client::FibClient"
name = "fib_client"

# Bare-metal MPS2-AN385 (QEMU).
[image.mps2-an385-baremetal]
board = "mps2-an385-baremetal"
# `nros_tests::alloc::port_of(QemuBaremetal, C, Action)` —
# THIS cell's router port, so `tests/emulator.rs` runs each pair against its
# own router (issue 1512). 10.0.2.2 is the guest's route to the host (slirp).
locator = "tcp/10.0.2.2:10320"
os_config = ["board-net.toml"]
