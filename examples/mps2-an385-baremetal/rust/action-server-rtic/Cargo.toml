[package]
name = "qemu-rtic-action-server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "RTIC action server example for nros on QEMU MPS2-AN385"

[[bin]]
name = "qemu-rtic-action-server"
test = false
bench = false

# Self-contained standalone example (issue 0100): node logic in this crate's
# lib.rs (`nros::node!` -> `register_dispatch`); `node_pkgs` self-references
# this crate; `main.rs` is the `nros::main!()` RTIC Entry.
[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5), and nothing here names the board: switching board is
# editing `[image.*] board` there and re-running `nros sync`.

[package.metadata.nros.entry]
node_pkgs = ["qemu-rtic-action-server"]

[dependencies]
# Node deps folded in from the former action_server_rtic_pkg (issue 0100).
example_interfaces = { path = "generated/example_interfaces", default-features = false }
heapless = "0.8"
# nros Executor API + bare-metal platform glue.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble", "macros"] }
# User diagnostics route through `nros-log`; the dispatcher is installed by the
# board boot scaffold.
# phase-338 W7 — one facade in user source: the body logs through `log`,
# and the board bridges it to semihosting on BOTH boot paths.
log = { version = "0.4", default-features = false }

# Everything only the IMAGE needs is one generated dependency, the same for
# every board (RFC-0098 D6, issue 1305): the selection package `nros sync`
# writes per image under `build/<image>/nros-selection/`. It carries the board
# crate with the features the image's `system.toml` implies (RMW, transport,
# entry shape), the platform and runtime crates, and the board's crate-root
# items; `nros::main!` reaches the board through it. The generated settings
# file's `[patch]` row points this name at the image's copy.
#
# Target-scoped, so the node in `lib.rs` still builds for the host: the
# metadata probe compiles it there to learn what it creates (issue 1265),
# and the image's crates do not build for the host.
[target.'cfg(target_os = "none")'.dependencies]
qemu_rtic_action_server_nros_selection = { version = "0.0.0" }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

# Size-optimized profile.
[profile.size]
inherits = "release"
opt-level = "s"
debug = false
strip = true

# The empty `[workspace]` table makes this example a standalone
# workspace root (copy-out template promise).
[workspace]
