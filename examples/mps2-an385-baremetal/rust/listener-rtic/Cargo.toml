[package]
name = "qemu-rtic-listener"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "RTIC listener example for nros on QEMU MPS2-AN385"

[[bin]]
name = "qemu-rtic-listener"
test = false
bench = false

# Self-contained standalone example (issue 0100): node logic in this crate's
# lib.rs (`nros::node!` -> `register_dispatch`); `nros::main!()` registers this crate itself
# (issue 1289: no `node_pkgs` needed); `main.rs` is the `nros::main!()` RTIC Entry.
[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5).
# Nothing here names a board: every image-only dependency (board crate, RMW
# backend, platform, runtime, panic handler) comes from the generated
# selection package (RFC-0098 D6, issue 1305), so switching `[image.*] board`
# is the only edit a board switch needs.

[dependencies]
# Node deps folded in from the former listener_rtic_pkg (issue 0100).
# phase-338 W7 — one facade in user source: the body logs through `log`,
# and the board bridges it to semihosting on BOTH boot paths.
log = { version = "0.4", default-features = false }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
# nros declarative-node + main! API.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }

# Everything only the IMAGE needs is TARGET-scoped, so the node in `lib.rs`
# builds for the host as well and `nros sync` can PROBE what it creates
# (issues 1265, 1603). `main.rs` (the Entry) is never built for the host.
[target.'cfg(target_os = "none")'.dependencies]
# The image's board crate, RMW backend, runtime and panic handler —
# GENERATED by `nros sync` / `nros build` from `system.toml` and the board
# descriptor (RFC-0098 D6, issue 1305). `nros::main!` reaches the board
# through it.
qemu_rtic_listener_nros_selection = { path = "build/nros/selection" }
# MPS2-AN385 PAC (interrupt bindings for RTIC dispatchers). It and `rtic` stay
# in this manifest, not the selection: the `#[rtic::app]` expansion names
# `rtic::` and `device = mps2_an385_pac` from THIS crate (issue 1305).
mps2-an385-pac = { version = "*" }
# RTIC v2
rtic = { version = "2.1", features = ["thumbv7-backend"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

# Phase 204.3 — size-optimized profile: opt-level "z" + strip, inheriting
# release's lto/codegen-units. Build with `cargo build --profile size`
# (or fleet-wide via `NROS_CARGO_PROFILE=size just <plat> build`).
[profile.size]
inherits = "release"
opt-level = "s"
debug = false
strip = true

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root. Without it, cargo walks up + adopts the example into the
# outer nano-ros workspace (in nested checkouts) or gets adopted by a user's
# workspace `members` glob when they copy this example out, breaking the
# README's "standalone copy-out template" promise. Canonical in-tree builds
# also pass via the root `exclude = [...]` list (belt-and-braces).
[workspace]
