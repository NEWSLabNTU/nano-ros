[package]
name = "qemu-rtic-listener"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "RTIC listener example for nros on QEMU MPS2-AN385"

[[bin]]
name = "qemu-rtic-listener"
test = false
bench = false

# Self-contained standalone example (issue 0100): node logic in this crate's
# lib.rs (`nros::node!` -> `register_dispatch`); `node_pkgs` self-references
# this crate; `main.rs` is the `nros::main!()` RTIC Entry.
[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board.

[package.metadata.nros.entry]
node_pkgs = ["qemu-rtic-listener"]

[dependencies]
# Node deps folded in from the former listener_rtic_pkg (issue 0100).
# phase-338 W7 — one facade in user source: the body logs through `log`,
# and the board bridges it to semihosting on BOTH boot paths.
log = { version = "0.4", default-features = false }
std_msgs = { path = "generated/std_msgs", default-features = false }
# nros declarative-node + main! API.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble", "macros"] }
# RTIC board entry (RticBoardEntry) for QEMU MPS2-AN385.
# phase-337 W6.a — the RTIC entry surface is the base board crate's `rtic`
# feature; `nros-board-rtic-mps2-an385` no longer exists.
nros-board-mps2-an385 = { version = "*", features = ["rtic"] }
# RMW backend — bare-metal callers link it explicitly so the boot scaffold
# can register it.
nros-rmw-zenoh = { version = "*", features = ["platform-bare-metal", "ros-humble"] }

# MPS2-AN385 PAC (interrupt bindings for RTIC dispatchers)
mps2-an385-pac = { version = "*" }

# RTIC v2
rtic = { version = "2.1", features = ["thumbv7-backend"] }

# Cortex-M runtime
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }

# Panic handler (required for no_std)
panic-semihosting = { version = "0.6", features = ["exit"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

# Phase 204.3 — size-optimized profile: opt-level "z" + strip, inheriting
# release's lto/codegen-units. Build with `cargo build --profile size`
# (or fleet-wide via `NROS_CARGO_PROFILE=size just <plat> build`).
[profile.size]
inherits = "release"
opt-level = "s"
debug = false
strip = true

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root. Without it, cargo walks up + adopts the example into the
# outer nano-ros workspace (in nested checkouts) or gets adopted by a user's
# workspace `members` glob when they copy this example out, breaking the
# README's "standalone copy-out template" promise. Canonical in-tree builds
# also pass via the root `exclude = [...]` list (belt-and-braces).
[workspace]
