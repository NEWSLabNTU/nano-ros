[package]
name = "qemu-bsp-talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Simple QEMU talker example (nros::main!() BoardEntry shape, MPS2-AN385)"

[[bin]]
name = "qemu-bsp-talker"
test = false
bench = false

# Self-contained standalone example (issue 0100): `lib.rs` IS the node
# (`nros::node!(Talker)` emits `register`); `main.rs` is the `nros::main!()`
# Form-1 Entry that dispatches to this same crate's `register`.
[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5), and nothing here names the board: switching
# board is editing `[image.*] board` there and re-running `nros sync`.

[dependencies]
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble", "macros"] }
# User diagnostics route through `nros-log`; the dispatcher is installed by the
# board BoardEntry boot scaffold — this crate only registers its Logger handle.
# phase-338 W7 — the node body logs through the `log` facade like every
# other platform's copy; the board bridges it to semihosting.
log = { version = "0.4", default-features = false }
# Generated message types (from package.xml via `nros generate-rust`).
std_msgs = { path = "generated/std_msgs", default-features = false }

# Everything only the IMAGE needs is TARGET-scoped, so the node in `lib.rs`
# builds for the host as well (issue 1265). That is what lets `nros sync`
# PROBE what the node creates instead of this leaf declaring it by hand: the
# probe compiles the lib for the host, and the image's crates do not build
# there. `main.rs` (the Entry) is never built for the host.
#
# ONE dependency, the same for every board (RFC-0098 D6, issue 1305): the
# selection package `nros sync` generates per image under `build/<image>/`. It
# carries the board crate with its features, the RMW backend, the runtime and
# panic crates, and the board's crate-root items; `nros::main!` reaches the
# board through it. The generated settings file's `[patch]` row points this
# name at the image's copy.
[target.'cfg(target_os = "none")'.dependencies]
qemu_bsp_talker_nros_selection = { version = "0.0.0" }

# Phase 204.3 — size-optimized profile: opt-level "s" + strip, inheriting
# release's lto/codegen-units. Build with `cargo build --profile size`
# (or fleet-wide via `NROS_CARGO_PROFILE=size just <plat> build`).
[profile.size]
inherits = "release"
opt-level = "s"
debug = false
strip = true

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root. Without it, cargo walks up + adopts the example into the
# outer nano-ros workspace (in nested checkouts) or gets adopted by a user's
# workspace `members` glob when they copy this example out, breaking the
# README's "standalone copy-out template" promise.
[workspace]
