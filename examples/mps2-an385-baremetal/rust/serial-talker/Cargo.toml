[package]
name = "qemu-serial-talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Serial (UART) talker example using nros-board-mps2-an385"

[[bin]]
name = "qemu-serial-talker"
test = false
bench = false

# Self-contained standalone example (issue 0100): `lib.rs` IS the node
# (`nros::node!(SerialTalker)` emits `register`); `main.rs` is the
# `nros::main!()` Form-1 Entry dispatching to this same crate's `register`.
[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5).
# Nothing here names a board: every image-only dependency (board crate, RMW
# backend, platform, runtime, panic handler) comes from the generated
# selection package (RFC-0098 D6, issue 1305), so switching `[image.*] board`
# is the only edit a board switch needs.

[dependencies]
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
# User diagnostics route through `nros-log`; the dispatcher is installed by the
# board BoardEntry boot scaffold — this crate only registers its Logger handle.
# phase-338 W7 — one facade in user source: the body logs through `log`,
# and the board bridges it to semihosting on BOTH boot paths.
log = { version = "0.4", default-features = false }
# Generated message types (from package.xml via `nros generate-rust`).
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed

# Everything only the IMAGE needs is TARGET-scoped, so the node in `lib.rs`
# builds for the host as well (issue 1265). That is what lets `nros sync`
# PROBE what the node creates instead of this leaf declaring it by hand: the
# probe compiles the lib for the host, and these crates do not build there.
# `main.rs` (the Entry) is never built for the host.
[target.'cfg(target_os = "none")'.dependencies]
# The image's board crate, RMW backend, runtime and panic handler —
# GENERATED by `nros sync` / `nros build` from `system.toml` and the board
# descriptor (RFC-0098 D6, issue 1305). `nros::main!` reaches the board
# through it.
qemu_serial_talker_nros_selection = { path = "build/nros/selection" }

# Phase 204.3 — size-optimized profile.
[profile.size]
inherits = "release"
opt-level = "s"
debug = false
strip = true

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root (copy-out template promise).
[workspace]
