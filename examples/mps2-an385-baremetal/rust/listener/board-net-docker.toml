# The board network file for image `docker` (RFC-0109 D4): its
# interfaces, read by `nros sync` through `os_config`. Format owned by
# the board package; one table per interface.
[eth0]
network = "docker"
host = 11
mac = "02:00:00:00:00:01"

[network.docker]
subnet = "192.168.100.0/24"
gateway = "192.168.100.1"
