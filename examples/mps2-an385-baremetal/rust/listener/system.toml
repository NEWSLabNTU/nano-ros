# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses. Switching board is editing `[image.*] board`
# and re-running `nros sync`.

[system]
# The image a plain build (and every fixture row) takes; `docker` below is
# the compose test's (`tests/qemu-baremetal`), built with `--image docker`.
default_images = ["mps2-an385-baremetal"]
name = "qemu_bsp_listener"
rmw = "zenoh"
domain_id = 0

# `dispatch` — callbacks hand off to a ring rather than running inline
# (phase-216 A.5); read by `nros check`'s framework × dispatch lint (issue 1278).
[[component]]
pkg = "qemu_bsp_listener"
class = "qemu_bsp_listener::ListenerNode"
name = "qemu_bsp_listener"
dispatch = "deferred"

# Bare-metal MPS2-AN385 (QEMU). The network identity overlays the board's
# compiled-in `Config::default()` through `BoardEntry::run_with_deploy`.
[image.mps2-an385-baremetal]
board = "qemu-mps2-an385"
locator = "tcp/10.0.2.2:10500"
os_config = ["board-net-mps2-an385-baremetal.toml"]

# phase-497 W3 (RFC-0103 D10) — the network `tests/qemu-baremetal` runs this
# image on: each container's own bridge `br0` (192.168.100.1/24, NAT'd onto the
# compose network where zenohd is 172.20.0.2), joined through TAP `tap0`. It
# replaced the board crate's `docker` feature, which hard-coded the same plan.
# RFC-0109 D6 (phase-514 W4) — the network's subnet lives in the image's board
# network file, its router in the image's `locator`, its TAP in `run.nic`.

[image.docker]
board = "qemu-mps2-an385"
os_config = ["board-net-docker.toml"]
locator = "tcp/172.20.0.2:7447"

[image.docker.run]
nic = { tap = "tap0" }
