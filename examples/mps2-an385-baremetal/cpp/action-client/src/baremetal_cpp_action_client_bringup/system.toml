# What this example deploys to (RFC-0098 D3/D5) — the bringup of a one-package
# workspace (RFC-0122 D3). The program is the owned entry
# `src/baremetal_cpp_action_client` (RFC-0071 D19): a cargo package whose `src/main.rs` boots the
# board and calls the C++ application `build.rs` compiles into it, because
# on a board with no RTOS the link root is Rust (issue 1512). So the image
# names that package and the bringup declares no component table.

[system]
name = "baremetal_cpp_action_client"
rmw = "zenoh"
domain_id = 0
# The image a bare `nros configure` / `nros build` builds.
default_images = ["mps2-an385-baremetal"]

# Bare-metal MPS2-AN385 (QEMU). The network identity overlays the board's
# compiled-in `Config::default()` through `Config::from_image()`.
[image.mps2-an385-baremetal]
board = "mps2-an385-baremetal"
entry = "baremetal_cpp_action_client"
# The C/C++ runtime brings the panic handler (`nros-c`'s `panic-platform`,
# RFC-0077), so the board's adapter must not link the board's own provider
# beside it (issue 1305).
panic = "platform"
# `nros_tests::alloc::port_of(QemuBaremetal, Cpp, Action)` —
# THIS cell's router port, so `tests/emulator.rs` runs each pair against its
# own router (issue 1512). 10.0.2.2 is the guest's route to the host (slirp).
locator = "tcp/10.0.2.2:10420"
os_config = ["board-net.toml"]
