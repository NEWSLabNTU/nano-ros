[package]
name = "baremetal_cpp_action_client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "C++ action client on the pure bare-metal MPS2-AN385: C++ application, Rust link root (issue 1512)"

# The OWNED entry of the bringup's image (RFC-0071 D19): this crate is the
# image's link root, so `nros build` builds it instead of generating one.
# The binary takes the package's name, the entry's.
[[bin]]
name = "baremetal_cpp_action_client"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# The C++ ABI. `nros-cpp` bundles `nros-c` (the C ABI the C++ headers call
# into) and forwards every feature named here to it, so this is the one
# runtime selection in the image — the same "one umbrella" rule the cmake road
# follows (`libnros_cpp.a` is the only Rust staticlib a C++ binary links).
# `platform-mps2-an385` is the bare-metal arm issue 1512 added; see the `c/`
# sibling's manifest for why `panic-platform` is named explicitly and why this
# leaf carries no `panic-semihosting`.
nros-cpp = { version = "*", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "platform-mps2-an385",
    "panic-platform",
] }
# Named for its `links = "nros_c"` channel only — `DEP_NROS_C_INCLUDE` & co.
# reach the build script of a DIRECT dependent, and the C++ headers include the
# C ones. No features: cargo unifies this with the set `nros-cpp` forwards, so
# this line selects nothing and cannot disagree with it.
nros-c = { version = "*", default-features = false }
# RFC-0071 D9 (phase-506 W4c) — the backend is this image's own dependency,
# not an `nros-cpp` feature: the API crate names no backend. Its platform and
# edition are what `nros-cpp`'s `platform-mps2-an385` / `ros-humble` used to
# forward to it.
nros-rmw-zenoh = { version = "*", default-features = false, features = ["platform-bare-metal"] }
# The image's board crate: the reset vector, the CMSDK Timer0 clock, the
# LAN9118 + smoltcp bring-up, the semihosting console and the `nros_log`
# sink. None of it is reachable from C++, which is why the link root is
# this crate. `src/main.rs` boots it and calls the application. Its RMW,
# edition and link-set features come from the adapter below.
nros-board-mps2-an385 = { version = "*", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19, issue 2448):
# the board half of the image (its RMW, edition and link set). The image
# states `panic = "platform"`, so nothing links a second panic provider beside
# `nros-cpp`'s `panic-platform`.
baremetal_cpp_action_client_nros_derived = { path = "../../generated/nros-derived/baremetal_cpp_action_client" }
# The CDR codec the generated C++ message glue serializes with (`src/main.rs`
# compiles that glue in; on the cmake road it is a per-package staticlib that
# names this same crate).
nros-serdes = { version = "*", default-features = false }

[build-dependencies]
# Compiles `src/action_client.cpp` for `thumbv7m-none-eabi`; the generated message
# headers are header-only C++, their serializers are Rust (see `src/main.rs`).
cc = "1"
# The nano-ros cc policy every C/C++ compile in the tree takes (issue 1542),
# held by `check-cc-build-policy`.
nros-cc-flags = { version = "*" }

# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]
