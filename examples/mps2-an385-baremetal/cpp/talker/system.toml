# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema the `rust/talker` and `c/talker` siblings use, and the same board.
# Switching board is editing `[image.*] board` and re-running `nros sync`.

[system]
name = "baremetal_cpp_talker"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "baremetal_cpp_talker"
class = "baremetal_cpp_talker::Talker"
name = "talker"

# Bare-metal MPS2-AN385 (QEMU). The network identity overlays the board's
# compiled-in `Config::default()` through `Config::from_image()`.
[image.mps2-an385-baremetal]
board = "qemu-mps2-an385"
# The C/C++ runtime brings the panic handler (`nros-c`'s `panic-platform`,
# RFC-0077), so the generated selection package must not link the board's
# own provider beside it (issue 1305).
panic = "platform"
# `nros_tests::alloc::port_of(QemuBaremetal, Cpp, Pubsub)` —
# THIS cell's router port, so `tests/emulator.rs` runs each pair against its
# own router (issue 1512). 10.0.2.2 is the guest's route to the host (slirp).
locator = "tcp/10.0.2.2:10400"
net = { eth0 = { network = "qemu", host = 10 } }
