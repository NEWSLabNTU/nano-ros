[package]
name = "esp32_qemu_listener"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Simple QEMU OpenETH subscriber example using nros-board-esp32-qemu"

# Phase 244 D2 — single-pkg clean shape: `lib.rs` is the agnostic Node
# (`nros::node!(Listener)` emits `register`), `main.rs` is the Entry
# (`nros::main!()` Form-1 self-bringup links the sibling lib's
# `register`). The board crate's `BoardEntry` owns executor / RMW / spin.
[lib]
name = "esp32_qemu_listener"

[[bin]]
name = "esp32_qemu_listener"
path = "src/main.rs"
test = false
bench = false

# The board (`esp32-c3-baremetal` → `nros_board_esp32_qemu::Esp32QemuEntry` +
# the `Framework::Esp32` emit shape), network identity, node and its declared
# entities live in `system.toml` beside this manifest (RFC-0098 D3/D5/D8).

[dependencies]
# nros — `nros::node!` (lib) + `nros::main!` (bin) macros + Executor API.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble", "macros"] }

# Generated message types (from package.xml via nros generate-rust)
std_msgs = { path = "generated/std_msgs", default-features = false }

# Per-message log lines (Published:/Received:) routed to the console by the
# board log writer; the esp32 e2e harness waits on them.
log = { version = "0.4", default-features = false }

# Everything only the IMAGE needs is TARGET-scoped, so the node in `lib.rs`
# builds for the host as well (issue 1265). That is what lets `nros sync`
# PROBE what the node creates instead of this leaf declaring it by hand: the
# probe compiles the lib for the host, and the board crate, esp-hal and
# esp-backtrace do not build there. `main.rs` (the Entry) is never built for
# the host.
[target.'cfg(target_os = "none")'.dependencies]
# The image's board crate (`Esp32QemuEntry`), esp-hal (the `#[esp_hal::main]`
# boot symbol), the panic handler and the bootloader app descriptor —
# GENERATED by `nros sync` / `nros build` from `system.toml` and the board
# descriptor (RFC-0098 D6, issue 1305). `nros::main!` reaches the board, and
# `esp_hal`, through it.
esp32_qemu_listener_nros_selection = { path = "build/nros/selection" }

# Phase 204.11 — release profile reconcile. `debug-assertions = true` in
# *release* was a bug: it compiles the assertion checks + their panic strings
# into the flashed image (bigger `.text`, slower). Release drops them (debug
# assertions belong in `[profile.dev]`); `debug = false` keeps no debuginfo in
# the artifact. lto=fat + codegen-units=1 stay (size; matches the other
# embedded examples).
[profile.release]
debug = false
debug-assertions = false
lto = "fat"
codegen-units = 1

# Phase 208.F1 — empty `[workspace]` table makes this example a standalone
# workspace root. Without it, cargo walks up + adopts the example into the
# outer nano-ros workspace (in nested checkouts) or gets adopted by a user's
# workspace `members` glob when they copy this example out, breaking the
# README's "standalone copy-out template" promise. Canonical in-tree builds
# also pass via the root `exclude = [...]` list (belt-and-braces).
[workspace]
