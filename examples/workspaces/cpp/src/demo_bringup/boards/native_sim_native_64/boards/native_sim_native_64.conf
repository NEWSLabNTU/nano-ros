# Native Sim Offloaded Sockets (NSOS) — host kernel BSD sockets instead of a
# TAP device. No bridge and no root, and several instances can run at once.
#
# phase-470 W5.b3 (issue 1288) — this file is NEW, and it is a MOVE rather than
# a new fact. Neither hand-written entry (`zephyr_entry`,
# `zephyr_cyclonedds_entry`) carried a `boards/` directory, so these four lines
# reached the image only from `scripts/build/zephyr-fixture-leaves.sh`, which
# appends `zephyr/native-sim-nsos.conf` to a row's `-DCONF_FILE`. A migrated row
# has no `conf_files` — it suppresses `APPLICATION_CONFIG_DIR` discovery, and
# its relative names resolve against a directory a generated application does
# not hold — so the tail has to move with it.
#
# Which means the fixture harness was supplying a property of the IMAGE: a plain
# `nros build zephyr --workspace examples/workspaces/cpp` produced a
# TAP-networked image that could never reach the router, and only the fixture
# lane's tail made it work. Stated here, it is the same for both drivers and for
# both images (the cyclone overlay already set three of the four; the fourth,
# `CONFIG_ETH_NATIVE_POSIX=n`, it never did).
#
# The four lines are `zephyr/native-sim-nsos.conf` verbatim. The sibling
# workspaces that carry their own copy (`rust`, `derived-tiers-cpp`,
# `realtime-cpp`) add `CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y`; these images
# have never had it and gaining it would be a runtime change, not a migration.
CONFIG_ETH_NATIVE_POSIX=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
