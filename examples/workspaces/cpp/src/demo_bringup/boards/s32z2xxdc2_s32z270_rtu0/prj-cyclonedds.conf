# Issue 2811 -- Cyclone DDS Kconfig for `[image.s32z270_rtu0]`, the same
# fragment shape as realtime-cpp's FVP image (prj.conf + prj-<rmw>.conf).

# Cyclone spawns ~8 worker threads whose DYNAMIC_THREAD stacks come from this
# heap. 1 MiB here plus the board's 2 MiB nros arena stays inside the 7 MiB
# `sram2` the board overlay chooses.
CONFIG_HEAP_MEM_POOL_SIZE=1048576
CONFIG_DYNAMIC_THREAD_STACK_SIZE=32768

# Cyclone's receive thread select()s over four fds; Zephyr's default cap is 3
# (issue 1674).
CONFIG_NET_SOCKETS_POLL_MAX=8

# SPDP discovery is UDP multicast.
CONFIG_NET_IPV4_IGMP=y
