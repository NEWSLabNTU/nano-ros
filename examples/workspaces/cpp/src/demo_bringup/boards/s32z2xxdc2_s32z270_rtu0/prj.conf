# Issue 2811 -- the S32Z270 RTU0 image's (`[image.s32z270_rtu0]`) Kconfig,
# layered on the board package's base prj.conf
# (packages/boards/nros-board-zephyr/boards/s32z270-rtu0-zephyr/prj.conf),
# which carries the networking, POSIX API and logging. What issue 2631 found
# an image on this board must state itself lives here, not in the board.

# A C++ image: the board base conf targets the Rust road and enables
# zephyr-lang-rust, so a C++ image switches it off.
CONFIG_RUST=n

# The C++ runtime the ASI consumer ships on this board: newlib + GNU
# libstdc++ + C++17.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

# The S32ZE SoC's Kconfig.defconfig defaults MAIN_STACK_SIZE to 1024, which
# wins over the nros module's default, so the image states its own.
CONFIG_MAIN_STACK_SIZE=32768
