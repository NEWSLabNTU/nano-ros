# phase-474 T4 - base config for the Zephyr C++ violation fixture. Same base
# as derived-tiers-cpp, plus the violation channel the safety island runs:
# monitors armed by the application (nros::arm_monitors()) and the
# drain-and-report hook, which logs each stored verdict with its sequence
# number ("contract violation #1: ...") on the console the test reads.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_DNS_RESOLVER=n

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
CONFIG_NROS_C_API=y
CONFIG_NROS_CPP_API=y
CONFIG_STD_CPP17=y

CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y

# phase-474 I2 -- verdicts before the handler's RUN are counted, not stored.
CONFIG_NROS_MONITOR_ARM_ON_CALL=y
# phase-474 I1 -- drain the ring every spin and log each verdict.
CONFIG_NROS_VIOLATION_DRAIN_REPORT=y
