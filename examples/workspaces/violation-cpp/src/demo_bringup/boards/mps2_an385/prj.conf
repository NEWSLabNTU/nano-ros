# phase-544 W2 - base config for the violation fixture on mps2/an385. The
# network stack, the static SLIRP address, the main stack and the heap come
# from the `mps2-an385-zephyr` board package's own prj.conf, which `nros build`
# merges for this image; this file holds only what the application adds.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
# The test reads every verdict line off the console. native_sim logs in
# immediate mode; this board defaults to deferred mode with a 1 KiB buffer,
# which dropped six messages in the first run (the arming line and verdict
# #1 among them). Immediate mode, as on native_sim.
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
CONFIG_STD_CPP17=y
