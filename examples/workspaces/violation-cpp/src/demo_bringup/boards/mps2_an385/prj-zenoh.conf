# phase-544 W2 - zenoh RMW overlay for the violation fixture on mps2/an385.
# The native_sim overlay's stack, heap and net-buffer sizes are left out on
# purpose: the board package sets them for this board (issue 0552's 128 KiB
# main stack), and a smaller value here would merge after it and win.

CONFIG_NET_TCP=y
CONFIG_POSIX_API=y
# 64, not 32 - the build derives a floor and refuses below it; see
# `_nros_mutex_floor` in `zephyr/cmake/nros_cargo_build.cmake`.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
