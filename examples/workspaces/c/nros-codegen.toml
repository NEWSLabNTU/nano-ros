# RFC-0033 capacity for the stock `std_msgs/String`, at WORKSPACE scope.
#
# The talker and listener are the ROS 2 tutorial pair (phase-535, RFC-0122
# option B): they carry `std_msgs/String` "Hello World: N". The type states no
# bound of its own (issue 0964), so the consumer states it. Here rather than
# beside a package: a stock type is generated once per project, so a cap
# attached to one consumer would depend on which reached it first (issue 1470).
#
# 256 is the number the standalone C and C++ examples chose: the payload is one
# short line, so the bound is generous rather than tight. A sample above it is
# refused by `_deserialize` and never dispatched.
[fields]
"std_msgs/String.data" = 256
