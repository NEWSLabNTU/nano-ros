# Both cores: zenoh over RPMsg only, no network stack. The RPMsg service, its
# IPM and main's stack are the board package's (`nros-board-mps2-an521-zephyr`);
# the zenoh links are each image's `env` in system.toml.
CONFIG_NROS=y
CONFIG_PRINTK=y
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
