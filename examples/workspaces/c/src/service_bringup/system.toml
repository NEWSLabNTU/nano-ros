# phase-535 (RFC-0122 D1) — the service pair as images: one image per
# (platform, role, rmw), ids `<platform>_<role>[_<rmw>]`. The test-side map
# from a matrix cell to these ids is `nros_tests::fixtures::workspace_image`.
# `locator` is the cell's `alloc::port_of` on QEMU's SLIRP host; the test
# `pair_image_rows_dial_their_allocator_port` holds it there.

[system]
name = "c_service"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "service_server_pkg"
class = "service_server_pkg::AddServer"
name = "add_server"

[[component]]
pkg = "service_client_pkg"
class = "service_client_pkg::AddClient"
name = "add_client"

# phase-535 W6 (RFC-0122 D2) — the callback VARIANT of the client: its own
# package, image ids `<platform>_service_client_callback[_<rmw>]`.
[[component]]
pkg = "service_client_callback_pkg"
class = "service_client_callback_pkg::AddCallbackClient"
name = "add_callback_client"

[image_defaults]
rmw = "zenoh"

[image.freertos_service_server]
board = "mps2-an385-freertos"
launch = "service_server.launch.xml"
locator = "tcp/10.0.2.2:7910"
os_config = ["board-net-10.toml"]

[image.freertos_service_client]
board = "mps2-an385-freertos"
launch = "service_client.launch.xml"
locator = "tcp/10.0.2.2:7910"
os_config = ["board-net-11.toml"]

# Linux: one image per (role, rmw). The router locator is ephemeral
# (NROS_LOCATOR at run time), so none is baked here.

[image.linux_service_server]
board = "linux"
launch = "service_server.launch.xml"

[image.linux_service_server_xrce]
board = "linux"
launch = "service_server.launch.xml"
rmw = "xrce"

[image.linux_service_server_cyclonedds]
board = "linux"
launch = "service_server.launch.xml"
rmw = "cyclonedds"

[image.linux_service_client]
board = "linux"
launch = "service_client.launch.xml"

[image.linux_service_client_xrce]
board = "linux"
launch = "service_client.launch.xml"
rmw = "xrce"

[image.linux_service_client_cyclonedds]
board = "linux"
launch = "service_client.launch.xml"
rmw = "cyclonedds"

# The callback variant (phase-535 W6): zenoh, and Cyclone for RFC-0041's
# backend-parity check (phase 239.8). Was `examples/linux/c/service-client-callback`.
[image.linux_service_client_callback]
board = "linux"
launch = "service_client_callback.launch.xml"

[image.linux_service_client_callback_cyclonedds]
board = "linux"
launch = "service_client_callback.launch.xml"
rmw = "cyclonedds"

# ThreadX's Linux simulator (a hosted process, NSOS host sockets): it
# dials loopback directly. `locator` is the cell's `alloc::port_of`; the
# Cyclone images bake the leaf's `alloc::domain_of` domain.

[image.threadx_service_server]
board = "threadx-linux"
launch = "service_server.launch.xml"
locator = "tcp/127.0.0.1:9110"

[image.threadx_service_server_cyclonedds]
board = "threadx-linux"
launch = "service_server.launch.xml"
rmw = "cyclonedds"
domain_id = 107

[image.threadx_service_client]
board = "threadx-linux"
launch = "service_client.launch.xml"
locator = "tcp/127.0.0.1:9110"

[image.threadx_service_client_cyclonedds]
board = "threadx-linux"
launch = "service_client.launch.xml"
rmw = "cyclonedds"
domain_id = 107

# Zephyr native_sim: one image per (role, rmw). The router port, Agent port
# and DDS domain are the cell's `nros_tests::alloc` values (the
# `cell-isolation` table). The west lane passes the same values as
# `-DCONFIG_*` defines. The Kconfig fragments live in
# `boards/native_sim_native_64/`. They came from the `examples/zephyr/c` leaves.

[image.zephyr_service_server]
board = "zephyr"
launch = "service_server.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7510"

[image.zephyr_service_server_xrce]
board = "zephyr"
launch = "service_server.launch.xml"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
locator = "udp/127.0.0.1:2510"
domain_id = 35

[image.zephyr_service_server_xrce.knobs.xrce]
max_subscribers = 0
max_service_servers = 1
max_service_clients = 0

[image.zephyr_service_server_cyclonedds]
board = "zephyr"
launch = "service_server.launch.xml"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]
domain_id = 26

[image.zephyr_service_client]
board = "zephyr"
launch = "service_client.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7510"

[image.zephyr_service_client_xrce]
board = "zephyr"
launch = "service_client.launch.xml"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
locator = "udp/127.0.0.1:2510"
domain_id = 35

[image.zephyr_service_client_xrce.knobs.xrce]
max_subscribers = 0
max_service_servers = 0
max_service_clients = 1

[image.zephyr_service_client_cyclonedds]
board = "zephyr"
launch = "service_client.launch.xml"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]
domain_id = 26

# ThreadX on QEMU rv-virt (riscv64, NetX Duo, SLIRP). `locator` is the
# cell's `alloc::port_of`. They came from the `examples/rv-virt-threadx`
# leaves. Each QEMU has its own SLIRP network, so the board's default address
# serves both roles of a pair.

[image.riscv_threadx_service_server]
board = "rv-virt-threadx"
launch = "service_server.launch.xml"
locator = "tcp/10.0.2.2:9510"

[image.riscv_threadx_service_client]
board = "rv-virt-threadx"
launch = "service_client.launch.xml"
locator = "tcp/10.0.2.2:9510"

# NuttX on QEMU virt (armv7-a). `locator` is the cell's `alloc::port_of`
# on QEMU's SLIRP host. They came from the `examples/qemu-armv7a-nuttx` leaves.

[image.nuttx_service_server]
board = "qemu-armv7a-nuttx"
launch = "service_server.launch.xml"
locator = "tcp/10.0.2.2:8310"

[image.nuttx_service_client]
board = "qemu-armv7a-nuttx"
launch = "service_client.launch.xml"
locator = "tcp/10.0.2.2:8310"

[board_config."mps2-an385-freertos"]
netstack = "lwip"

[board_config."threadx-linux"]
netstack = "netxduo"

[board_config."rv-virt-threadx"]
netstack = "netxduo"

[board_config."qemu-armv7a-nuttx"]
