[package]
name = "telem_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg — telemetry on the low-priority tier (100 ms)."

[lib]
path = "src/lib.rs"

# phase-263 B2 — telemetry runs on the `low` tier, bound like ctrl_pkg's group
# in the bringup's `system.toml` (`group_tiers`); the two nodes resolve to two
# POSIX-priority tasks.
[package.metadata.nros.node]
class = "telem_pkg::Telem"
name = "telem_node"

[dependencies]
nros = { version = "*", default-features = false, features = [
    "alloc",
    "rmw-cffi", "macros"] }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
# issue 0572 — a fixture that proves DELIVERY must say when a publish fails.
log = { version = "0.4", default-features = false }
