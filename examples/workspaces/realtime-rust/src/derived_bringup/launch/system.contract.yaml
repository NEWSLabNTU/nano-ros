# Node interface contract for system.launch.xml (issue 1537).
#
# The rates the sched task derivation ranks by. Nothing else in this bringup states
# a rate, a priority or a sched task: `nros::main!` DERIVES the schedule from these
# two rates (rate-monotonic, ctrl above telem) and allocates the priorities out
# of the IMAGE's own plan. The numbers match the code's timers (ctrl_pkg 10 ms,
# telem_pkg 100 ms).
#
# The derivation ranks by `trigger.timer.rate_hz` alone. `min_rate_hz` is a
# publication floor for the runtime monitor, never a schedule input (issue
# 1372); here it happens to equal the timer. derived-sched-tasks-cpp's contract makes
# the two differ, and its bake test is what proves the trigger is the one read.

version: 1

nodes:
  control_node:
    paths:
      on_ctrl:
        trigger: { timer: { rate: 100Hz } }
        output: [ctrl]
    pub:
      ctrl: { min_rate: 100Hz }

  telem_node:
    paths:
      on_telem:
        trigger: { timer: { rate: 10Hz } }
        output: [telem]
    pub:
      telem: { min_rate: 10Hz }

topics:
  /ctrl:
    type: std_msgs/msg/Int32
    external: sub
    pub: [control_node/ctrl]
    rate: 100Hz
  /telem:
    type: std_msgs/msg/Int32
    external: sub
    pub: [telem_node/telem]
    rate: 10Hz
