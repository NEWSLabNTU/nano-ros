# Issue 1537 — THE AXIS OF THIS IMAGE: a lowered transport band.
#
# On the 15-priority native_sim image this moves the zenoh read task from
# k_thread 4 (the default band, 200) to k_thread 9, so the image's transport
# band is [4, 9] and its tier pool is [10, 14]. The Kconfig DEFAULTS
# projection still says pool [5, 14], so a derived tier allocated out of the
# projection lands at 5 / 6 — INSIDE the transport — and the Zephyr boot
# report (`nros_zephyr_report_tier_vs_transport`) fires. Allocated out of the
# image's own `.config` (what `nros::main!` does since issue 1537) the tiers
# land at 10 / 11 and the report is silent.
#
# A default-band image could not tell the two apart: there the projection and
# the image's plan agree. That is why this fragment exists at all.
#
# Its own fragment, merged LAST (`conf` order in system.toml), so no earlier
# fragment can shadow it — Zephyr's Kconfig merge is last-wins (issue 0876).
# `sched_dims_applied_e2e` reads the BUILT `.config` back and fails if the value
# did not land, so a fragment that stops applying fails loudly instead of
# turning the silent-report assertion vacuous.
CONFIG_NROS_ZENOH_READ_PRIORITY=100
