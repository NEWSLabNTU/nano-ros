[package]
name = "ctrl_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg — control loop on the high-priority tier (10 ms)."

[lib]
path = "src/lib.rs"

# phase-263 B2 — the control node's code declares its callback group with
# `node.callback_group("ctrl")`; WHICH tier that group runs on is deployment
# policy, bound in the bringup's `system.toml` (`[[component]] group_tiers`,
# RFC-0047), which `nros::main!()` resolves against `[tiers.<tier>]` to emit
# `run_tiers` (RFC-0015 / RFC-0032).
[package.metadata.nros.node]
class = "ctrl_pkg::Control"
name = "control_node"

[dependencies]
nros = { path = "../../../../../packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi", "macros"] }
std_msgs = { path = "../../generated/std_msgs", default-features = false }
# issue 0572 — a fixture that proves DELIVERY must say when a publish fails.
log = { version = "0.4", default-features = false }
