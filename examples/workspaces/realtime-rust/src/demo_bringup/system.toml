[system]
name = "demo"
rmw = "zenoh"
domain_id = 0

# Phase 273 W2 (RFC-0047): group→tier binding added to [[component]].group_tiers.
# This is the new SSoT for deployment config; the package-manifest
# `callback_groups` tier binding in Cargo.toml is deprecated and will be removed
# in W4 (the nros::main!() proc-macro migration). For now, both sources exist:
# the CLI resolver (collect_callback_groups) uses group_tiers; the proc-macro
# still reads Cargo.toml (W4 scope).
[[component]]
pkg = "ctrl_pkg"
class = "ctrl_pkg::Control"
name = "control_node"
group_tiers = { ctrl = "high" }

[[component]]
pkg = "telem_pkg"
class = "telem_pkg::Telem"
name = "telem_node"
group_tiers = { telem = "low" }

# Two priority tiers (RFC-0015 §4.2). Only the `posix` sub-table is needed for
# the native deploy; priorities are raw POSIX (advisory on native).
# phase-330 W1 (RFC-0063) — THE DIMS LIVE HERE NOW.
#
# This block used to say the scoped dims were "intentionally left in the YAML
# only", because `nros_orchestration_ir::TierRtosSpec` had no field for them.
# That was a schema gap, not a design choice, and it is what made issue 0380
# possible: the dims lived only in the generated-and-regenerable model, so
# regenerating deleted them.
#
# W1.a added `core`/`deadline_us`/`budget_us`/`period_us` to that struct
# (the shared `ros_launch_manifest_sched::TierPlatformSpec` the RESOLVER parses
# this same block into always had them — the two mirrors had drifted). The
# model is now reproducible from launch + this file alone.
#
# SCOPING IS THE POINT. A dim on `[tiers.high]` applies to EVERY platform; the
# same dim in `[tiers.high.<rtos>]` engages one kernel's mechanism and lowers to
# None elsewhere. A generic `budget_us` flips every executor into cooperative
# sporadic gating, while `[tiers.high.nuttx].budget_us` engages only NuttX's
# SCHED_SPORADIC.
[tiers.high]
class = "real_time"
spin_period_us = 1000
[tiers.high.posix]
priority = 80
core = 0
# phase-276 W2 / issue #128 half 2 — RAW Zephyr priority (preemptive; lower
# number = higher priority). Consumed by the zephyr_entry projection.
[tiers.high.zephyr]
priority = 5
# issue 0655 — the zephyr `core` lives on THIS tier, not on `low`, because
# `high` is SPAWNED. Zephyr accepts a cpu mask only on a thread that has not
# started, so the board pins a spawned tier in its `k_thread_create` ->
# `k_thread_start` window. `low` is the BOOT tier: the kernel started it before
# nros ran, it has no such window, and a `core` declared there can only ever
# produce the loud fallback. Declared here, the dim is actually honored.
core = 0
# ZEPHYR-SCOPED: fires the kernel-EDF path (k_thread_deadline_set) here and
# lowers to None (Fifo, unchanged) on posix/nuttx/threadx.
deadline_us = 10000
# phase-281 W3-nuttx — RAW NuttX SCHED_FIFO priority (higher number = higher
# priority). `[tiers.*.nuttx]` flips the macro's generic OwnedSpin arm onto
# `<QemuArmVirt>::run_tiers` (RFC-0015 Model 1), one std::thread (NuttX pthread)
# per tier over one shared session.
[tiers.high.nuttx]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 99
# NUTTX-SCOPED sporadic policy (both fields required): engages NuttX
# SCHED_SPORADIC without flipping other platforms into cooperative gating.
budget_us = 5000
period_us = 10000
# phase-297 W5 — RAW ThreadX priority (lower number = higher priority), near
# the app thread priority (4). Mirrors config/system_model.yaml (the entries
# read the model; this file feeds `play_launch resolve --system`).
[tiers.high.threadx]
priority = 5
# issue 0636 gap 2 — RAW FreeRTOS priority (0..configMAX_PRIORITIES-1; the MPS2
# board builds with 8, so 0..7). Bigger is more urgent, which is why the BOOT
# tier on this board is `low` and not `high`: `resolve_tiers` sorts descending
# by raw number and the boot tier is the least urgent one, so `high` (ctrl,
# 10 ms) is chain-spawned. Mirrors the `realtime-cpp` bringup's freertos
# numbers so the two language arms are comparable.
[tiers.high.freertos]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 3

[tiers.low]
spin_period_us = 10000
[tiers.low.posix]
priority = 10
[tiers.low.zephyr]
priority = 10
# issue 0655 — no `core` here on purpose: `low` is the BOOT tier on zephyr and
# Zephyr cannot pin an already-started thread. The declaration moved to
# `[tiers.high.zephyr]`, which is spawned. (The nuttx/threadx `core` below stay
# — those boards apply placement through their own mechanisms.)
[tiers.low.nuttx]
# RFC-0079 — 99, not 100. 100 is the priority zenoh-pico's read and lease
# threads INHERIT from the thread that opens the session (app_main's
# SCHED_PRIORITY_DEFAULT), so a tier at 100 shares a priority with the link it
# publishes over — and equal-priority SCHED_FIFO threads round-robin, which is
# not an ordering. One step below keeps the tier order (high 110 > low 99)
# and vacates the band. Declared in the port's [board.priority_plan];
# `check-tier-priority-plan` rejects a pin that lands on it.
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 98
core = 0
[tiers.low.freertos]
priority = 2
# No `core` here: mps2-an385 is uniprocessor, so a declared pin can only
# produce the loud fallback (RFC-0052). `realtime-cpp` declares one on its
# `low` tier precisely to exercise that fallback; this arm asserts tier
# PRIORITY, so it does not need a second copy of that experiment.
[tiers.low.threadx]
priority = 15
# THREADX-SCOPED: preemption threshold + round-robin slice; `core` is an SMP
# pin via tx_thread_smp_core_exclude (threadx-linux is non-SMP, so the board
# seam ignores it there).
preempt_threshold = 10
core = 0
time_slice_us = 5000
