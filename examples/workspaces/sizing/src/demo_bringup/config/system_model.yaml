# model schema has no timer entity, so `count_callbacks` returns 0 for
# `/burst_talker` even though it registers six. The source-metadata sidecar is
# the only input that knows.
structure:
  scopes:
    /: {}
  nodes:
    /burst_talker:
      scope: /
      pkg: burst_pkg
      exec: burst_talker
  topics:
    /chatter:
      type: std_msgs/msg/Int32
      publishers: ["/burst_talker/chatter"]
      subscribers: []
