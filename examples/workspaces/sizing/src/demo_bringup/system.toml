# phase-307 W6 lane 2 (issue 0257) — the executor-sizing showcase.
#
# One node, six timers, no subscription. The launch wiring names zero callback
# entities for it; the runtime needs six slots. Everything about this bringup is
# ordinary — the interesting part is that the entity count lives only in the
# source-metadata sidecar `nros sync` produces.

[system]
name = "sizing_demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "burst_pkg"
class = "burst_pkg::BurstTalker"
name = "burst_talker"


# Issue 0951 — the implicit machine this system runs on. A host says WHERE a
# node runs; what it is built as comes from `[image.*]`. Unscoped and with no
# `nodes`, so it governs every launch file and every node — which is what the
# `kind = "self"` deploy block it replaces already meant.
[host.native]
[image_defaults]
rmw = "zenoh"

[image.native]
board = "native"
