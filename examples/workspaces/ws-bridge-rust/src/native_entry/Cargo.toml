[package]
name = "native_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Entry pkg — boots the zenoh↔cyclonedds bridge on the native host."

[[bin]]
name = "native_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
native_entry_nros_selection = { path = "../../generated/nros-selection/native_entry" }
# `nros::main!` macro — detects the [[bridge]] + emits the bridge entry.
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["std", "rmw-cffi"] }
# The data-driven bridge runtime the macro calls (run_from_config_str).
nros-bridge = { path = "../../../../../packages/rmw/bridge", features = ["std", "config"] }
# phase-296 R4 followup — the MODEL arm bakes node registration into the
# entry, so the macro-generated code references the board runner and the
# workspace's node pkg (the launch arm's bridge-only entry never did).
nros-board-native = { path = "../../../../../packages/boards/nros-board-native" }
talker_pkg = { path = "../talker_pkg", default-features = false }
# POSIX platform symbols (wake / clock) the backends + executor need.
nros-platform = { path = "../../../../../packages/platform/nros-platform", default-features = false, features = ["platform-posix"] }
# The two RMW backends — linked here so they self-register on the native host
# (`nros_rmw_register_backend!` .init_array ctor). The bridge opens one session
# per backend via `Executor::open_multi`.
nros-rmw-zenoh = { path = "../../../../../packages/rmw/zenoh/nros-rmw-zenoh", features = ["std", "platform-posix"] }
nros-rmw-cyclonedds-sys = { path = "../../../../../packages/rmw/cyclonedds/nros-rmw-cyclonedds-sys", features = ["platform-posix"] }
# phase-267 (non-flat types) — the typed Cyclone descriptor staging
# (`register::<M>()`) the macro emits for a non-flat forwarded type, + the msg
# crate that provides the `M: Message` (std_msgs/Header). `nros sync` resolves
# `std_msgs` through the generated-crate `[patch.crates-io]`.
nros-rmw-cyclonedds = { path = "../../../../../packages/rmw/cyclonedds/nros-rmw-cyclonedds", features = ["std"] }
std_msgs = { path = "generated/std_msgs", default-features = false }
