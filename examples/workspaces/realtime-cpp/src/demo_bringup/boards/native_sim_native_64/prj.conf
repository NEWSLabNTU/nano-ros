# phase-281 W3b — base config for the Zephyr C++ RT-tiers workspace entry (ctrl + telem).
# RMW choice + RMW-specific sizing come from the prj-<rmw>.conf overlay. Mirrors the C++
# workspaces/cpp/src/zephyr_entry base (the proven C++ zephyr build shape).

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_DNS_RESOLVER=n

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
# The TYPED Zephyr entry is C++ (it drives the nodes through ZephyrBoard), so it
# compiles as C++17. The nano-ros API choice itself is rendered from the image
# by the module (phase-481, RFC-0098 D11) -- never stated here.
CONFIG_STD_CPP17=y

CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y

# phase-296 W5.8 follow-up — kernel EDF for the C/C++ tier image (mirror of
# the ws-realtime-rust W5.5 exercise). The model's `high` tier is real_time
# with a zephyr-scoped deadline_us; with this on, zephyr_apply_tier_deadline
# applies a real k_thread_deadline_set at boot (equal-priority EDF tiebreak).
CONFIG_SCHED_DEADLINE=y
