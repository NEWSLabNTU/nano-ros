# phase-292 W1.a — Cyclone DDS Kconfig for the FVP image (`[image.fvp]`,
# rmw = cyclonedds — the RMW the ASI reference consumer ships). Kept as a
# separate overlay for shape-parity with the other workspace images
# (prj.conf + prj-<rmw>.conf).

# Heap budget — DDS participant + per-topic descriptors + two tier nodes'
# message buffers (mirrors the single-app cpp talker-aemv8r board overlay).
# phase-298 W1 (issue 0232) — Cyclone spawns ~8 worker threads whose 32 KiB
# DYNAMIC_THREAD stacks are allocated from this heap (DYNAMIC_THREAD_POOL_SIZE=0),
# ~256 KiB just for stacks; 192 KiB overflowed it (pthread_create -> "tid in
# use" / ddsrt_thread_create failed panic). Match the nros-cyclonedds snippet's
# 4 MiB (the value the working ASI image uses).
CONFIG_HEAP_MEM_POOL_SIZE=4194304

# RNG — the FVP has no entropy peripheral; the test PRNG is the only
# `sys_rand_get` backend.
CONFIG_TEST_RANDOM_GENERATOR=y

# Issue 1674 — Cyclone's receive thread select()s over a socket waitset of
# four fds here (self-pipe + three UDP sockets, measured on native_sim), and
# Zephyr's select refuses any set larger than this cap with ENOMEM — the image
# then delivers nothing and floods its console. Zephyr's default is 3. The
# module's Kconfig defaults it to 8 for Cyclone too; it is ALSO stated here
# because a Kconfig default never reaches an existing build dir (Zephyr reloads
# the old .config while the merged fragments are unchanged), and a fragment
# change does.
CONFIG_NET_SOCKETS_POLL_MAX=8

# Issue 1288 — what `nano_ros_use_board()` used to add from
# `zephyr/snippets/nros-cyclonedds/cyclonedds.conf`, which is for an
# application with NO system.toml and so does not reach a generated one. The
# image's `rmw` renders `CONFIG_NROS_RMW_CYCLONEDDS`, and the board, prj.conf
# and Kconfig defaults already give the rest of the snippet (NET_TCP,
# NET_SOCKETPAIR, POSIX_API, CPP, ASSERT_VERBOSE). Measured: without the three
# lines below the merged .config differed from the hand-written image's in
# exactly these and their dependents, and in nothing else.
#
# SPDP discovery is UDP multicast.
CONFIG_NET_IPV4_IGMP=y
# Diagnostics — asserts + immediate logging keep Cyclone init failures legible.
CONFIG_ASSERT=y
CONFIG_LOG_MODE_IMMEDIATE=y
