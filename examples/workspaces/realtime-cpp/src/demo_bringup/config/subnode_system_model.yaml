meta:
  version: 1
  inputs:
  - path: launch/subnode_system.launch.xml
    sha256: cf0adad5e1ba8b071ba62df40b084d2df2d6b91ba15a123a9b182085b33913f0
  - path: system.toml
    sha256: b8cd55ad5265cfdab7ab1e01cdb2bc8d92ff56085fba4d56620a0310b4bdbc5c
  resolver:
    tool: ros-launch-resolve
    version: 0.1.0
  diagnostics:
  - 'system config: [[component]] ''ctrl_node'' has group_tiers but no matching launch node (absent in this variant?)'
  - 'system config: [[component]] ''telem_node'' has group_tiers but no matching launch node (absent in this variant?)'
structure:
  scopes:
    subnode_system.launch.xml:
      file: subnode_system.launch.xml
  nodes:
    /sub_node:
      scope: subnode_system.launch.xml
      pkg: subnode_pkg
      exec: subnode
      node_name: sub_node
execution:
  deploy:
    /sub_node:
      domain: 0
      rmw: zenoh
      extra:
        deploy_name: native
        kind: self
        target: x86_64-unknown-linux-gnu
  tiers:
    high:
      class: real_time
      spin_period_us: 10000
      posix:
        priority: 80
      freertos:
        priority: 5
      zephyr:
        priority: 5
        deadline_us: 10000
      nuttx:
        priority: 110
        budget_us: 5000
        period_us: 10000
    low:
      spin_period_us: 100000
      posix:
        priority: 10
      freertos:
        priority: 2
        core: 0
      zephyr:
        priority: 10
      nuttx:
        priority: 100
