[system]
name = "realtime_cpp_demo"
rmw = "zenoh"
domain_id = 0

# Phase 269 W4 (RFC-0015 §4.2) — C++ two-tier realtime demo.
# The ctrl node publishes /ctrl every 10 ms (high tier);
# the telem node publishes /telem every 100 ms (low tier).
# Phase 273 W2 (RFC-0047): group→tier binding moved from [[node_overrides]] to
# [[component]].group_tiers (deployment config, not package manifest).
# CALLBACK_GROUPS in cmake declares the group IDs; group_tiers here assigns
# them to the named tiers. nros codegen emits NodeBuilder::sched() calls so
# each node binds to its posix-priority sched context.
[[component]]
pkg = "ctrl_pkg"
class = "ctrl_pkg::Ctrl"
name = "ctrl_node"
group_tiers = { ctrl = "high" }

# issue 0395 / phase-144 (#144) — the mid tier's node. Listed in the catalog;
# the shared `system.launch.xml` stays 2-node, and `freertos_system.launch.xml`
# is the 3-node resolve that `freertos_entry` consumes (aux_pkg builds only on
# the mps2 board). The mid tier makes the spawn chain TWO hops — boot high ->
# mid -> low — so mid is spawned BY a spawned tier, which is the tier<->tier
# declare race the chained-spawn fix closes. `realtime_tiers_e2e`'s
# `freertos_cpp` cell asserts SerialTicks(ctrl, aux, telem) on exactly this.
# issue 1509 — `group_tiers` below is the WHOLE binding, and it is declared only
# here. aux_pkg's own comments used to restate it as a FreeRTOS task priority;
# that restatement had already drifted — it said 3, which is the `high` tier's
# number, not this node's. The node now names the tier and nothing else, which
# is also what makes it true off FreeRTOS: the same `mid` lands on
# `[tiers.mid.posix]` when this bringup is built for a posix image.
[[component]]
pkg = "aux_pkg"
class = "aux_pkg::Aux"
name = "aux_node"
group_tiers = { aux = "mid" }

[[component]]
pkg = "telem_pkg"
class = "telem_pkg::Telem"
name = "telem_node"
group_tiers = { telem = "low" }

[tiers.high]
# phase-330 W2 (RFC-0063) — authored HERE, not in the generated model.
class = "real_time"
spin_period = "10000us"
[tiers.high.posix]
priority = 80
# phase-281 W3b — RAW Zephyr priority (preemptive; lower number = higher priority).
# Consumed by the zephyr_entry projection: [tiers.*.zephyr] flips the codegen onto
# ZephyrBoard::run_tiers (RFC-0015 Model 1), one k_thread per tier.
[tiers.high.zephyr]
# RFC-0079 §4.1 — allocated from the DERIVED pool.app, strictly less urgent
# than the transport band. Zephyr's band is not a literal: the zenoh read/lease
# tasks are pthreads whose Kconfig band maps through Zephyr's POSIX layer to a
# k_thread priority that depends on the IMAGE: 4, pool [5, 14], on the default
# band this bringup's images run (measured, issue 1583). 9 is a pool priority
# of THIS bringup's images and is judged only against them; a lowered-band
# image such as derived_bringup's (transport [4, 9]) is a different image.
# 5 outranked the transport, undeclared. Resolve for any image:
#   python3 scripts/check-tier-priority-plan-image.py <build>/zephyr/.config
priority = 9
# ZEPHYR-SCOPED: kernel EDF here, lowers to None (Fifo) elsewhere.
deadline = "10000us"
# phase-281 W3-nuttx — RAW NuttX SCHED_FIFO priority (higher number = higher
# priority; verbatim into pthread_attr_setschedparam). `[tiers.*.nuttx]` flips the
# C++ codegen onto NuttxBoard::run_tiers (RFC-0015 Model 1), one pthread per tier.
# phase-331 W6 / issue 0395 — RAW FreeRTOS priority (0–7 for
# configMAX_PRIORITIES=8 on MPS2). Restored: the W6 consolidation retargeted the
# `workspace-cpp-freertos-realtime` fixture onto this bringup but left these
# behind, so the freertos bake had no tier priorities at all.
[tiers.high.freertos]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 3

[tiers.high.nuttx]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 99
# NUTTX-SCOPED sporadic policy (both fields required).
budget = "5000us"
period = "10000us"

# issue 0395 — the mid tier came back with aux_node above; W6 dropped both when
# it folded ws-realtime-cpp-mps2 in, and the two-tier reading looked right only
# because the fixture row's comment was stale (it said 2-tier while the row
# pointed at the 3-node mps2 bringup).
[tiers.mid]
spin_period = "50000us"
[tiers.mid.posix]
priority = 40
[tiers.mid.freertos]
# `[tiers.*.freertos]` flips the C++ codegen onto FreertosBoard::run_tiers
# (RFC-0015 Model 1), one FreeRTOS task per tier — so the `priority` below is
# what `aux_node` runs at on the mps2 image. Stated once, here (issue 1509):
# read it, do not copy it into a node.
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 2

[tiers.low]
spin_period = "100000us"
[tiers.low.posix]
priority = 10
# FREERTOS-SCOPED SMP core pin. `tests/freertos_core_pin_applied.rs` asserts
# this exact dim reaches the tier spawn — "the realtime-cpp `low` tier pins to
# core 0" — so dropping it silently is the failure that test exists to catch.
[tiers.low.freertos]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 1
core = 0

[tiers.low.zephyr]
priority = 10
[tiers.low.nuttx]
# RFC-0079 — 99, not 100. 100 is the priority zenoh-pico's read and lease
# threads INHERIT from the thread that opens the session (app_main's
# SCHED_PRIORITY_DEFAULT), so a tier at 100 shares a priority with the link it
# publishes over — and equal-priority SCHED_FIFO threads round-robin, which is
# not an ordering. One step below keeps the tier order (high 110 > low 99)
# and vacates the band. Declared in the port's [board.priority_plan];
# `check-tier-priority-plan` rejects a pin that lands on it.
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 98


# Issue 0951 — the implicit machine this system runs on. A host says WHERE a
# node runs; what it is built as comes from `[image.*]`. Unscoped and with no
# `nodes`, so it governs every launch file and every node — which is what the
# `kind = "self"` deploy block it replaces already meant.
[host.native]
[[model]]
launch = "subnode_system.launch.xml"
out    = "subnode_system_model.yaml"

[[model]]
launch = "freertos_system.launch.xml"
out    = "freertos_system_model.yaml"
# --- phase-383 W9 (RFC-0065 D6) — images are the buildable unit.
# Derived from the entry packages that existed at migration time; each
# entry's `deploy` token picked its board, and its `launch` its topology.
[image_defaults]
rmw = "zenoh"

[image.freertos]
board = "mps2-an385-freertos"
launch = "freertos_system.launch.xml"

# issue 1517 / phase-470 W2 — the Arm AEMv8-R FVP, NOT native_sim. This row read
# `board = "native_sim/native/64"` from the phase-383 W9 migration onward, and the
# value never had to be right because `just zephyr build-fvp-ws-entry` passes no
# `-b`: the board comes from `nano_ros_use_board(fvp-aemv8r-smp)` in the entry's
# own CMakeLists (phase-215.B). `nros build fvp` DOES pass `-b`, so the wrong
# value was reaching a real command line — measured: it emitted
# `west build -b native_sim/native/64 src/fvp_entry`, which `nano_ros_use_board`
# then warns about ("BOARD=... overrides the board crate's ZEPHYR_ID=...") and
# builds anyway, i.e. the FVP application compiled for native_sim.
#
# `fvp-aemv8r-smp` is the nano-ros board id, which is what this field takes —
# see `ImageBlock::board`: "NEVER a framework's own board string", the Zephyr
# `<board>/<soc>/<variant>` spelling being a resolution RESULT. It resolves to
# `packages/boards/nros-board-zephyr/boards/fvp-aemv8r-smp/nros-board.toml`,
# whose `[board.zephyr] west_board` carries the Zephyr id `west -b` receives.
[image.fvp]
board = "fvp-aemv8r-smp"
# NOT derivable, and not for the reason this comment used to give. It claimed
# two entry packages target this board and the choice was therefore ambiguous —
# an ambiguity MANUFACTURED by the wrong `board` above: with both spellings
# reading `native_sim/native/64`, `zephyr_entry` and `fvp_entry` both matched,
# and the derivation refused with two candidates (measured, both states).
#
# With the board correct the derivation matches ZERO packages, so it falls back
# to the bringup directory and dies on `conf fragment prj-cyclonedds.conf not
# found` in `src/demo_bringup` (measured). The reason is structural: the
# resolver matches a package by the board its `DEPLOY` token resolves to, and a
# Zephyr entry's `DEPLOY` names the PLATFORM (`zephyr`) because that is what
# `NanoRosEntry.cmake`'s link gate compares against (`NANO_ROS_PLATFORM`). The
# board this entry really targets is chosen by `nano_ros_use_board(...)` inside
# its CMakeLists, which the token scan does not read. So until an entry can
# state its board where the resolver looks (issue 1288 generates the entry FROM
# this row, which removes the question), the image names its application.
entry = "fvp_entry"
conf = ["prj-cyclonedds.conf"]

[image.native]
board = "native"

[image.native_rclcpp]
board = "native"
launch = "rclcpp_system.launch.xml"

[image.native_subnode]
board = "native"
launch = "subnode_system.launch.xml"

[image.nuttx]
board = "qemu-armv7a-nuttx"

[image.riscv_nuttx]
board = "rv-virt-nuttx"

[image.zephyr]
board = "zephyr"
conf = ["prj-zenoh.conf"]
# phase-470 W5.b3 (issue 1288) — the west application is GENERATED, so no
# `entry =`: a generated application is found by construction at
# `build/<coord>/<image>_entry/`, which is the ambiguity `entry =` existed to
# resolve. `panic` is the one fact the deleted `CMakeLists.txt` stated that no
# other declaration carried (`nano_ros_add_executable(... PANIC platform)`);
# `LANG`, `BRINGUP` and the `add_subdirectory` list are derived from the
# packages the launch names.
panic = "platform"

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."mps2-an385-freertos"]
netstack = "lwip"
sdk = { freertos = "{env:FREERTOS_DIR}", lwip = "{env:LWIP_DIR}" }

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."qemu-armv7a-nuttx"]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."rv-virt-nuttx"]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }
