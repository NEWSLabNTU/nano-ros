[system]
name = "realtime_cpp_demo"
rmw = "zenoh"
domain_id = 0

# Phase 269 W4 (RFC-0015 §4.2) — C++ two-tier realtime demo.
# The ctrl node publishes /ctrl every 10 ms (high tier);
# the telem node publishes /telem every 100 ms (low tier).
# Phase 273 W2 (RFC-0047): group→tier binding moved from [[node_overrides]] to
# [[component]].group_tiers (deployment config, not package manifest).
# CALLBACK_GROUPS in cmake declares the group IDs; group_tiers here assigns
# them to the named tiers. nros codegen emits NodeBuilder::sched() calls so
# each node binds to its posix-priority sched context.
[[component]]
pkg = "ctrl_pkg"
class = "ctrl_pkg::Ctrl"
name = "ctrl_node"
group_tiers = { ctrl = "high" }

# issue 0395 / phase-144 (#144) — the mid tier's node. Listed in the catalog;
# the shared `system.launch.xml` stays 2-node, and `freertos_system.launch.xml`
# is the 3-node resolve that `freertos_entry` consumes (aux_pkg builds only on
# the mps2 board). The mid tier makes the spawn chain TWO hops — boot high ->
# mid -> low — so mid is spawned BY a spawned tier, which is the tier<->tier
# declare race the chained-spawn fix closes. `realtime_tiers_e2e`'s
# `freertos_cpp` cell asserts SerialTicks(ctrl, aux, telem) on exactly this.
[[component]]
pkg = "aux_pkg"
class = "aux_pkg::Aux"
name = "aux_node"
group_tiers = { aux = "mid" }

[[component]]
pkg = "telem_pkg"
class = "telem_pkg::Telem"
name = "telem_node"
group_tiers = { telem = "low" }

[tiers.high]
# phase-330 W2 (RFC-0063) — authored HERE, not in the generated model.
class = "real_time"
spin_period = "10000us"
[tiers.high.posix]
priority = 80
# phase-281 W3b — RAW Zephyr priority (preemptive; lower number = higher priority).
# Consumed by the zephyr_entry projection: [tiers.*.zephyr] flips the codegen onto
# ZephyrBoard::run_tiers (RFC-0015 Model 1), one k_thread per tier.
[tiers.high.zephyr]
# RFC-0079 §4.1 — allocated from the DERIVED pool.app, strictly less urgent
# than the transport band. Zephyr's band is not a literal: the zenoh read/lease
# tasks are pthreads whose Kconfig band maps through Zephyr's POSIX layer to a
# k_thread priority that depends on the IMAGE (7, with pool [8, 14], for the
# realtime entries' .config). 5 outranked it, undeclared. Resolve for any image:
#   python3 scripts/check-tier-priority-plan-image.py <build>/zephyr/.config
priority = 9
# ZEPHYR-SCOPED: kernel EDF here, lowers to None (Fifo) elsewhere.
deadline = "10000us"
# phase-281 W3-nuttx — RAW NuttX SCHED_FIFO priority (higher number = higher
# priority; verbatim into pthread_attr_setschedparam). `[tiers.*.nuttx]` flips the
# C++ codegen onto NuttxBoard::run_tiers (RFC-0015 Model 1), one pthread per tier.
# phase-331 W6 / issue 0395 — RAW FreeRTOS priority (0–7 for
# configMAX_PRIORITIES=8 on MPS2). Restored: the W6 consolidation retargeted the
# `workspace-cpp-freertos-realtime` fixture onto this bringup but left these
# behind, so the freertos bake had no tier priorities at all.
[tiers.high.freertos]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 3

[tiers.high.nuttx]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 99
# NUTTX-SCOPED sporadic policy (both fields required).
budget = "5000us"
period = "10000us"

# issue 0395 — the mid tier came back with aux_node above; W6 dropped both when
# it folded ws-realtime-cpp-mps2 in, and the two-tier reading looked right only
# because the fixture row's comment was stale (it said 2-tier while the row
# pointed at the 3-node mps2 bringup).
[tiers.mid]
spin_period = "50000us"
[tiers.mid.posix]
priority = 40
[tiers.mid.freertos]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 2

[tiers.low]
spin_period = "100000us"
[tiers.low.posix]
priority = 10
# FREERTOS-SCOPED SMP core pin. `tests/freertos_core_pin_applied.rs` asserts
# this exact dim reaches the tier spawn — "the realtime-cpp `low` tier pins to
# core 0" — so dropping it silently is the failure that test exists to catch.
[tiers.low.freertos]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 1
core = 0

[tiers.low.zephyr]
priority = 10
[tiers.low.nuttx]
# RFC-0079 — 99, not 100. 100 is the priority zenoh-pico's read and lease
# threads INHERIT from the thread that opens the session (app_main's
# SCHED_PRIORITY_DEFAULT), so a tier at 100 shares a priority with the link it
# publishes over — and equal-priority SCHED_FIFO threads round-robin, which is
# not an ordering. One step below keeps the tier order (high 110 > low 99)
# and vacates the band. Declared in the port's [board.priority_plan];
# `check-tier-priority-plan` rejects a pin that lands on it.
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 98

[deploy.native]
kind = "self"

# phase-281 W3b — the Zephyr (native_sim) embedded deploy target. Both [posix] and
# [zephyr] tier tables let the same bringup deploy to native (Phase 269 W4) or embedded
# Zephyr (this wave) by changing the BOARD cmake variable.
[deploy.zephyr]
kind = "embedded"
board = "native_sim/native/64"

# phase-281 W3-nuttx — the NuttX (QEMU arm-virt) embedded deploy target. The
# `[tiers.*.nuttx]` tables let the same bringup deploy to native, embedded Zephyr,
# or embedded NuttX by changing the BOARD cmake variable.
[deploy.nuttx]
kind = "embedded"
board = "nuttx-qemu-arm"

# phase-315 — the embedded BOARD BUILDS of this system.
#
# Not placements: `kind = "self"` blocks are machines and PARTITION the nodes;
# a `kind = "embedded"` block is the whole system compiled for another board,
# running every node. The resolver excludes embedded blocks from placement.
#
# Missing while entries named them, which was invisible until the SystemModel
# started carrying real `execution.deploy` — then those entries failed with
# "places no nodes on board <x>". Ids are the DEPLOY values the entries pass.

[deploy.nuttx-qemu-arm]
kind = "embedded"
board = "nuttx-qemu-arm"

[deploy.nuttx-qemu-riscv]
kind = "embedded"
board = "nuttx-qemu-riscv"

# phase-331 W6 — folded in from ws-realtime-cpp-{mps2,fvp}. Board variants are
# ENTRIES, not workspaces.
#
# No `[deploy.fvp]`: `fvp_entry` already declares `BOARD zephyr` + `DEPLOY
# zephyr` and rides the existing zephyr block. Adding one made the resolver
# demand explicit `nodes = [..]` on EVERY deploy ("node '/ctrl_node' is not
# placed — with multiple [deploy.*] blocks every node needs a nodes entry"),
# because `kind = "zephyr"` participates in placement.
[deploy.freertos]
kind = "embedded"
board = "mps2-an385-freertos"

# phase-315 — the embedded BOARD BUILDS of this system.
#
# Not placements: `kind = "self"` blocks are machines and PARTITION the nodes;
# a `kind = "embedded"` block is the whole system compiled for another board,
# running every node. The resolver excludes embedded blocks from placement.
#
# Missing while entries named them, which was invisible until the SystemModel
# started carrying real `execution.deploy` — then those entries failed with
# "places no nodes on board <x>". Ids are the DEPLOY values the entries pass.

[deploy.mps2-an385-freertos]
kind = "embedded"
board = "mps2-an385-freertos"


[[model]]
launch = "subnode_system.launch.xml"
out    = "subnode_system_model.yaml"

[[model]]
launch = "freertos_system.launch.xml"
out    = "freertos_system_model.yaml"

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.nuttx.nros]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.nuttx-qemu-arm.nros]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.nuttx-qemu-riscv.nros]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.freertos.nros]
netstack = "lwip"
sdk = { freertos = "{env:FREERTOS_DIR}", lwip = "{env:LWIP_DIR}" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.mps2-an385-freertos.nros]
netstack = "lwip"
sdk = { freertos = "{env:FREERTOS_DIR}", lwip = "{env:LWIP_DIR}" }

# --- phase-383 W9 (RFC-0065 D6) — images are the buildable unit.
# Derived from the entry packages that existed at migration time; each
# entry's `deploy` token picked its board, and its `launch` its topology.
[image_defaults]
rmw = "zenoh"

[image.freertos]
board = "mps2-an385-freertos"
launch = "freertos_system.launch.xml"

[image.fvp]
board = "native_sim/native/64"
# Two entry packages target this board (`zephyr_entry`, `fvp_entry`) and both
# declare `DEPLOY zephyr`, so the application cannot be derived — see
# `[image.zephyr]` below, which is the other one.
entry = "fvp_entry"
conf = ["prj-cyclonedds.conf"]

[image.native]
board = "native"

[image.native_rclcpp]
board = "native"
launch = "rclcpp_system.launch.xml"

[image.native_subnode]
board = "native"
launch = "subnode_system.launch.xml"

[image.nuttx]
board = "nuttx-qemu-arm"

[image.riscv_nuttx]
board = "nuttx-qemu-riscv"

[image.zephyr]
board = "native_sim/native/64"
entry = "zephyr_entry"
conf = ["prj-zenoh.conf"]
