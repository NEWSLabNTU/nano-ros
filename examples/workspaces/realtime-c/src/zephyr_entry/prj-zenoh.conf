# phase-281 W3c — zenoh RMW overlay for the Zephyr C RT-tiers workspace entry. Mirrors the
# ws-realtime-cpp zephyr_entry zenoh overlay (W3b) plus the ws-realtime realtime tweaks.

CONFIG_NROS_RMW_ZENOH=y

CONFIG_NET_TCP=y
CONFIG_POSIX_API=y
# 64, not 32 — the build derives a floor and refuses below it; see
# `_nros_mutex_floor` in `zephyr/cmake/nros_cargo_build.cmake`.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

CONFIG_MAIN_STACK_SIZE=16384
# Issue 1551 -- NEITHER of these is the heap nano-ros allocates from. zenoh-pico's
# z_malloc and Rust's __rust_alloc both go through nros_platform_alloc, the rlsf
# arena sized by CONFIG_NROS_ZEPHYR_HEAP_SIZE (Kconfig default 64 KiB), and the
# tiers' executor storage is a .bss static the generated entry emits.
# Measured under gdb on the derived-tiers-cpp native_sim image, boot + 3 s under
# a router: the kernel heap served 232 bytes, all of it Zephyr's own NSOS socket
# driver (nsos_getaddrinfo 144, nsos_socket_create 88), and picolibc's malloc
# was called ZERO times. The kernel heap must stay non-zero (nsos_sockets.c
# asserts it); 64 KiB is what every sibling C/C++ workspace conf states. The
# 1 MiB CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE line is gone: Kconfig's native_sim
# default (16 KiB) is already more than zero calls need.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# phase-276 W2 — the 100 Hz ctrl tier needs > 100 tx windows/s: Zephyr zsock serializes send
# behind the read task's recv window, so the window must be far shorter than the fastest
# publish period (issues 0129/0139).
CONFIG_NROS_ZENOH_SOCKET_TIMEOUT_MS=5
