# issue 0260 / phase-356 W3 — the SMP fixture's board overlay.
#
# Why this board and this entry. The core-pin ACCEPT arm is verified today only
# on a UNIPROCESSOR image, where a pin to cpu 0 is accepted and cpu 0 is the
# only CPU the tier could have run on. Proving PLACEMENT needs more than one.
#
# Zephyr's `qemu_cortex_a53/qemu_cortex_a53/smp` is the viable target: it boots
# two cores under plain QEMU (measured), and unlike `qemu_riscv64/.../smp` it
# has a real NIC, which the zenoh-talking entry needs. The RISC-V board falls
# back to SLIP and wants a `zephyr,uart-pipe` chosen node its devicetree does
# not define.
#
# It must be the C entry: zephyr-lang-rust's `RUST_SUPPORTED` requires
# `CPU_AARCH64_CORTEX_A`, and this board sets `CPU_CORTEX_A53` / `CPU_CORTEX_A`,
# so a Rust image cannot build here at all (`CONFIG_RUST must be set to build
# Rust in Zephyr`). That is a property of the module's Kconfig, not of nano-ros.

# The placement dim itself. Without this, `k_thread_cpu_pin` is -ENOSYS and the
# tier reports the loud fallback — issue 0655's gate is CONFIG_SCHED_CPU_MASK,
# NOT CONFIG_SCHED_CPU_MASK_PIN_ONLY (which additionally requires SMP and is
# not what the board seam calls).
CONFIG_SCHED_CPU_MASK=y

# `undefined reference to z_impl_sys_rand_get` at link: this board has no
# entropy driver, and zenoh-pico seeds from `sys_rand_get`. Same line the
# fvp-aemv8r-smp overlay carries, for the same reason. Test-quality randomness
# is correct here — this is a fixture asserting scheduler placement, not a
# security surface.
CONFIG_TEST_RANDOM_GENERATOR=y

# NOTHING here for networking. `CONFIG_QEMU_CORTEX_A53_ETH_E1000` looks like
# the knob and is NOT user-configurable (no prompt) — assigning it is a hard
# Kconfig error, not a silent no-op. It is unnecessary anyway: `ETH_E1000`
# already defaults y from `DT_HAS_INTEL_E1000_ENABLED`, which this board's
# devicetree satisfies. Verified in the build's own .config, not assumed.

# --- why this board needs IP settings and native_sim does not ---------------
#
# The native_sim overlay sets CONFIG_NET_SOCKETS_OFFLOAD +
# CONFIG_NET_NATIVE_OFFLOADED_SOCKETS: that image delegates sockets to the HOST
# stack, so it never configures an address and the entry's prj.conf carries no
# IP settings at all.
#
# This board has no offload driver, so it runs Zephyr's NATIVE IP stack — and an
# interface with no IPv4 context is what made `get_ifaddr` (net_if.c:4780) walk
# a NULL `iface->config.ip.ipv4` and take a Data Abort at FAR 0x50, before any
# nros output. Nothing in the entry was wrong; the settings simply never had to
# exist until now.
#
# The addresses are QEMU user-mode networking's fixed subnet (guest 10.0.2.15,
# gateway/host 10.0.2.2), the same pair the threadx qemu boards already use, so
# a zenoh locator pointing at the host works unchanged.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# --- stacks: aarch64 frames are larger than the native_sim x86 these were
# --- sized for -------------------------------------------------------------
#
# HYPOTHESIS UNDER TEST (see the phase doc): the image took instruction aborts
# through a NULL pointer and through 0x401a3470 — an address past every section
# (text ends ~0x40077350, bss starts 0x4009c000), i.e. garbage, which is what a
# smashed return address looks like. `prj.conf`'s 16 KiB main / 4 KiB workqueue
# were tuned on native_sim.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=8192
# Catch the overflow instead of jumping into hyperspace: with MMU present this
# turns a silent smash into a named "stack overflow" fault, which is the
# difference between diagnosing in one run and bisecting for an afternoon.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y
