[system]
name = "realtime_c_demo"
rmw = "zenoh"
domain_id = 0

# Phase 269 W4 (RFC-0015 §4.2) — C two-tier realtime demo.
# The ctrl node publishes /ctrl every 10 ms (high tier);
# the telem node publishes /telem every 100 ms (low tier).
# Phase 273 W2 (RFC-0047): group→tier binding moved from [[node_overrides]] to
# [[component]].group_tiers (deployment config, not package manifest).
# CALLBACK_GROUPS in cmake declares the group IDs; group_tiers here assigns
# them to the named tiers. nros codegen emits nros_cpp_create_sched_context +
# nros_cpp_bind_group_sched to bind each group to its priority tier.
[[component]]
pkg = "ctrl_pkg"
class = "ctrl_pkg::Ctrl"
name = "ctrl_node"
group_tiers = { ctrl = "high" }

[[component]]
pkg = "telem_pkg"
class = "telem_pkg::Telem"
name = "telem_node"
group_tiers = { telem = "low" }

[tiers.high]
# phase-330 / issue 0380 — authored HERE, not in the generated model. Commit
# 15a72db8e restored `class` and the Zephyr `deadline` into
# config/system_model.yaml after a re-resolve stripped them, but the model is
# GENERATED: nothing declared them in the inputs, so the next regeneration would
# have stripped them again. Declaring them closes that loop (W1 made both
# expressible).
class = "real_time"
spin_period = "10000us"
[tiers.high.posix]
priority = 80
# phase-281 W3c — RAW Zephyr priority (preemptive; lower number = higher priority).
# Consumed by the zephyr_entry projection: [tiers.*.zephyr] flips the C codegen onto
# ZephyrBoard::run_tiers (RFC-0015 Model 1), one k_thread per tier.
[tiers.high.zephyr]
# RFC-0079 §4.1 — allocated from the DERIVED pool.app, strictly less urgent
# than the transport band. Zephyr's band is not a literal: the zenoh read/lease
# tasks are pthreads whose Kconfig band maps through Zephyr's POSIX layer to a
# k_thread priority that depends on the IMAGE (7, with pool [8, 14], for the
# realtime entries' .config). 5 outranked it, undeclared. Resolve for any image:
#   python3 scripts/check-tier-priority-plan-image.py <build>/zephyr/.config
priority = 9
# issue 0260 / phase-356 W3 — THE POINT OF THIS BRINGUP.
#
# `demo_bringup` declares no `core` for zephyr, so its tier is unpinned and the
# observed-CPU marker can only report where the tier HAPPENED to run. Pinning to
# core 1 — not 0 — is what makes the assertion falsifiable: an unpinned tier
# lands on cpu 0 anyway (measured), so `running_on=0` would prove nothing.
#
# A SEPARATE BRINGUP rather than a `core` in `demo_bringup`, because `bringup` is
# a per-row fixture field and the native_sim rows share this workspace.
# native_sim is UNIPROCESSOR: `core = 1` there cannot succeed and would flip an
# already-green cell to the loud fallback. Same workspace, same entry, different
# configuration per row — RFC-0066's "a configuration is a fixture axis", with no
# second workspace directory.
#
# `nros sync` warns that two bringups declare a system and skips FACADE
# generation (phase-315 W1). That is a warning and a skip, not a failure: the
# facades exist to derive cargo features for Rust entries, and this is a C entry
# whose selection is CMake-side. Verified by building it, after first misreading
# that warning as the cause of an unrelated failure.
core = 1
# ZEPHYR-SCOPED: kernel EDF here (k_thread_deadline_set); lowers to None (Fifo)
# on posix/nuttx, so the other bakes are byte-identical.
deadline = "10000us"
# phase-281 W3-nuttx — RAW NuttX SCHED_FIFO priority (higher number = higher
# priority; verbatim into pthread_attr_setschedparam). `[tiers.*.nuttx]` flips the
# C codegen onto NuttxBoard::run_tiers (RFC-0015 Model 1), one pthread per tier.
# phase-331 W6 / issue 0395 — RAW FreeRTOS priority, restored with the C arm's
# freertos bake (same consolidation dropped it here).
[tiers.high.freertos]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 3

[tiers.high.nuttx]
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 99

[tiers.low]
spin_period = "100000us"
[tiers.low.posix]
priority = 10
[tiers.low.freertos]
priority = 2

[tiers.low.zephyr]
priority = 10
[tiers.low.nuttx]
# RFC-0079 — 99, not 100. 100 is the priority zenoh-pico's read and lease
# threads INHERIT from the thread that opens the session (app_main's
# SCHED_PRIORITY_DEFAULT), so a tier at 100 shares a priority with the link it
# publishes over — and equal-priority SCHED_FIFO threads round-robin, which is
# not an ordering. One step below keeps the tier order (high 110 > low 99)
# and vacates the band. Declared in the port's [board.priority_plan];
# `check-tier-priority-plan` rejects a pin that lands on it.
# RFC-0079 — allocated from the port's `pool.app`, strictly BELOW the
# reserved transport band. A tier that outranks the link cannot be drained
# or refilled by it (issue 0623, measured again in 0736); a tier that needs
# the other side must SAY so with `above = "transport"` on the tier.
priority = 98


# Issue 0951 — the implicit machine this system runs on. A host says WHERE a
# node runs; what it is built as comes from `[image.*]`. Unscoped and with no
# `nodes`, so it governs every launch file and every node — which is what the
# `kind = "self"` deploy block it replaces already meant.
[host.native]
[image_defaults]
rmw = "zenoh"

[image.freertos]
board = "mps2-an385-freertos"

[image.native]
board = "native"

[image.nuttx]
board = "nuttx-qemu-arm"

[image.riscv_nuttx]
board = "nuttx-qemu-riscv"

[image.zephyr]
board = "native_sim/native/64"
conf = ["prj-zenoh.conf"]

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."mps2-an385-freertos"]
netstack = "lwip"
sdk = { freertos = "{env:FREERTOS_DIR}", lwip = "{env:LWIP_DIR}" }

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."nuttx-qemu-arm"]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."nuttx-qemu-riscv"]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }
