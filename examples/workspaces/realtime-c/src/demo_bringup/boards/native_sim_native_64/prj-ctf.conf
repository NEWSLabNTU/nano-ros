# Zephyr CTF tracing on native_sim, for the `zephyr_ctf` image (issue 2766).
# The posix backend needs TRACING_SYNC; it writes each event to `channel0_0`
# in the image's working directory and flushes it, so a stream read after the
# image is stopped holds every event written. Zephyr's own
# samples/subsys/tracing/prj_native_ctf.conf is the same set.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_POSIX=y
CONFIG_TRACING_PACKET_MAX_SIZE=64
