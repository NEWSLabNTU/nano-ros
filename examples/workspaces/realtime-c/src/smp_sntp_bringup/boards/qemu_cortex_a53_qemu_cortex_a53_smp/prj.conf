# phase-281 W3c — base config for the Zephyr C RT-sched-tasks workspace entry (ctrl + telem).
# RMW choice + RMW-specific sizing come from the prj-<rmw>.conf overlay. Mirrors the
# workspaces/c/src/zephyr_entry base (the proven C Zephyr entry shape).

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
# Issue 2846 -- the image names its SNTP server by hostname
# (`ntp.nros.test`), so the re-sync thread runs Zephyr's DNS resolver, the
# deeper of the two paths its measured stack peak covers (the 32-bit row's
# shape). The DNS server is the host, through QEMU's user-mode gateway; the
# stack-floor twin's responder answers 10.0.2.2.
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="10.0.2.2:15353"

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
# The TYPED Zephyr entry is C++ (it drives the C sched task nodes via ZephyrBoard::run_sched_tasks), so
# the nros-cpp header surface must be on the app include path and the entry compiles as C++17.
CONFIG_STD_CPP17=y

CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y

# phase-296 W5.8 follow-up — kernel EDF for the C sched task image (mirror of the
# cpp/rust siblings; see ws-realtime-cpp/src/zephyr_entry/prj.conf).
CONFIG_SCHED_DEADLINE=y
