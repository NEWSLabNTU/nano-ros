[package]
name = "rust_reading_listener_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg — subscribes custom_msgs/Reading on /reading, republishes the sequence on /reading_seq."

[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "rust_reading_listener_pkg::ReadingListener"
name = "reading_listener"
default_namespace = "/"

[dependencies]
nros = { path = "../../../../../packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi", "macros"] }
custom_msgs = { path = "../../generated/custom_msgs", version = "0.0.0", default-features = false }
std_msgs = { path = "../../generated/std_msgs", default-features = false }
