[package]
name = "native_rust_params_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Entry pkg — boots the parameterised system on the native board."

[[bin]]
name = "native_rust_params_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
native_rust_params_entry_nros_selection = { path = "../../generated/nros-selection/native_rust_params_entry" }
# phase-264 W4a/W4b — `nros::main!` bakes the launch `<param>` initials into the entry
# (`ctx.param(...)` reads them at register time, W4a). `[param_services]` in system.toml
# makes the macro register the ROS 2 param services + seed the volatile store, so
# `param-services` must be enabled for that registration to compile in (W4b — mirrors
# the lifecycle-services opt-in; a bake build adds it automatically).
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-board-native = { path = "../../../../../packages/boards/nros-board-native" }
rust_param_talker_pkg = { path = "../rust_param_talker_pkg", default-features = false }
