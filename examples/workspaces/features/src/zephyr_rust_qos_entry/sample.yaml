# phase-276 W5 — nano-ros QoS-override Rust workspace Entry as a Zephyr
# sample (Twister-discoverable). Boots the reliable_talker + qos_listener
# pair (per-entity reliable+transient_local profiles) from a single launch.
sample:
  name: nano-ros Rust QoS Workspace Entry
  description: nano-ros per-entity QoS-override workspace Entry on Zephyr, zenoh RMW
common:
  tags:
    - nano-ros
    - nros
  harness: console
  harness_config:
    type: one_line
    regex:
      - "nros: zephyr workspace entry up"
tests:
  sample.nano-ros.rust.ws-params-entry.zenoh:
    build_only: true
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    extra_args:
      - SNIPPET=nros-zenoh
