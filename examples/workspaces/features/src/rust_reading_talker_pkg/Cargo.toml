[package]
name = "rust_reading_talker_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg — publishes the in-workspace custom_msgs/Reading on /reading."

[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "rust_reading_talker_pkg::ReadingTalker"
name = "reading_talker"
default_namespace = "/"

[dependencies]
nros = { path = "../../../../../packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi",
] }
# In-workspace custom interface package — generated by `nros sync` into
# `generated/custom_msgs`, resolved through the auto-managed [patch.crates-io].
custom_msgs = { path = "../../generated/custom_msgs", version = "0.0.0", default-features = false }
