[package]
name = "rust_remap_talker_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg — publishes std_msgs/Int32 on the PRIVATE name ~/out (remapped by the model)."

# Node pkg shape — lib only, no [[bin]], no main.rs. `nros::node!()`
# exports the register / init / dispatch trampolines; the sibling
# Entry pkg brings up the executor + spin loop via `nros::main!()`.
[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "rust_remap_talker_pkg::RemapTalker"
name = "remap_talker"
default_namespace = "/"

[dependencies]
# Single platform/RMW-agnostic `nros` dep (phase-248 C6a): the concrete RMW
# backend + platform flow from the board crate the sibling Entry pkg deps.
nros = { path = "../../../../../packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi",
] }
std_msgs = { path = "../../generated/std_msgs", default-features = false }
