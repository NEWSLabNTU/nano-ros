meta:
  version: 1
  inputs:
  - path: launch/rust_qos.launch.xml
    sha256: 563ec9431d02ca8ba57f5ea341d8fd7e1cb24ff4405df668aa2648bb755519ed
  - path: system.toml
    sha256: 8cbc553de78028b3e8ab479899d416e1b52d8f81f20375abec8fe907793ffb44
  resolver:
    tool: ros-launch-resolve
    version: 0.1.0
structure:
  scopes:
    rust_qos.launch.xml:
      file: rust_qos.launch.xml
  nodes:
    /qos_listener:
      scope: rust_qos.launch.xml
      pkg: rust_qos_listener_pkg
      exec: qos_listener
      lifecycle_autostart: active
      node_name: qos_listener
    /reliable_talker:
      scope: rust_qos.launch.xml
      pkg: rust_qos_talker_pkg
      exec: reliable_talker
      lifecycle_autostart: active
      node_name: reliable_talker
execution:
  deploy:
    /qos_listener:
      target: linux
      domain: 0
      rmw: zenoh
      extra:
        deploy_name: native
        kind: self
        target: x86_64-unknown-linux-gnu
    /reliable_talker:
      target: linux
      domain: 0
      rmw: zenoh
      extra:
        deploy_name: native
        kind: self
        target: x86_64-unknown-linux-gnu
  features:
  - param_services
  - lifecycle
