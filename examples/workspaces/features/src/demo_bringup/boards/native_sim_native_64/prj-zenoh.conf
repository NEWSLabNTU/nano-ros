# RMW overlay: zenoh-pico backend.

CONFIG_NROS_RMW_ZENOH=y

# Zenoh-pico uses TCP to reach zenohd.
CONFIG_NET_TCP=y

# zenoh-pico thread + mutex requirements.
CONFIG_POSIX_API=y
# 64, not 32 — the build derives a floor and refuses below it; see
# `_nros_mutex_floor` in `zephyr/cmake/nros_cargo_build.cmake`.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

# Resource sizing. A Rust image's global allocator is nros_platform_alloc
# (issue 1324), so every Rust allocation lands in CONFIG_NROS_ZEPHYR_HEAP_SIZE
# beside zenoh-pico's. The params/lifecycle/qos entries here all build the
# parameter store, and `ParameterStorage<32>` is ONE 285,696-byte allocation
# (phase-382 W2': ~8.5 KiB a slot, sized by `ParameterValue`'s StringArray
# variant). The "~75 KiB" this block used to cite predates that, and the
# 256 KiB issue 1324 sized from it made all three images halt at boot with
# `HEAP EXHAUSTED (TOO SMALL): request 285696 bytes, arena 262656` (issue 1677).
# Measured peaks with a 1 MiB heap, read from the live boot record
# (`read-boot-report.py --heap-headroom`, the e2e heap gate's own decoder):
# lifecycle 399,600, params 399,696, qos 406,592. 512 KiB leaves ~115 KiB
# above the worst of them, and the e2e heap gate refuses the value by name if
# it is outgrown. native_sim runs on host RAM, so the cost is irrelevant.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_NROS_ZEPHYR_HEAP_SIZE=524288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_NET_SHELL=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DEBUG=y
