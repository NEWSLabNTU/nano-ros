# RMW overlay: zenoh-pico backend.

CONFIG_NROS_RMW_ZENOH=y

# Zenoh-pico uses TCP to reach zenohd.
CONFIG_NET_TCP=y

# zenoh-pico thread + mutex requirements.
CONFIG_POSIX_API=y
# 64, not 32 — the build derives a floor and refuses below it; see
# `_nros_mutex_floor` in `zephyr/cmake/nros_cargo_build.cmake`.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

# Resource sizing. A Rust image's global allocator is nros_platform_alloc
# (issue 1324), so every Rust allocation lands in CONFIG_NROS_ZEPHYR_HEAP_SIZE
# beside zenoh-pico's. This bringup declares `param_services` and `lifecycle`.
# The heap is NOT stated here: `nros build` hands the declared axes to Kconfig
# (`CONFIG_NROS_CAPABILITY_*`), and `NROS_ZEPHYR_HEAP_SIZE` DERIVES its
# default from them (issue 1702). The parameter store (285,696 B, issue 1677)
# is no longer on that heap: the same axes make the executor carve it from its
# .bss backing (phase-382 W3'), so the derived default is 192 KiB, not 512.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_NET_SHELL=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DEBUG=y
