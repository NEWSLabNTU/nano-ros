# Issue 1681 -- the Zephyr side of the one C++ image in this bringup,
# `[image.zephyr_cpp_params]`, layered AFTER the shared `prj.conf` (which is
# the Rust images' and turns on `CONFIG_RUST`). Zephyr merges fragments
# last-wins, so this file switches the Rust toolchain off and C++17 on; the
# Rust images never list it. The nano-ros API choice (`CONFIG_NROS_CPP_API`) is
# not here: the module renders it from the image's C++ entry (phase-481 W3).
CONFIG_RUST=n
CONFIG_STD_CPP17=y
