# Issue 1681 -- the C/C++ API for the one C++ image in this bringup,
# `[image.zephyr_cpp_params]`, layered AFTER the shared `prj.conf` (which is
# the Rust images' and turns on `CONFIG_RUST` / `CONFIG_NROS_RUST_API`).
# Zephyr merges fragments last-wins, so this file is the image's word on the
# language axis; the Rust images never list it.
CONFIG_RUST=n
CONFIG_NROS_RUST_API=n
CONFIG_NROS_C_API=y
CONFIG_NROS_CPP_API=y
CONFIG_STD_CPP17=y
