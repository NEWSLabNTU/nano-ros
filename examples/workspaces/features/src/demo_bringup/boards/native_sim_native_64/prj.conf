# nros Zephyr workspace Entry (Rust) — Phase 225.P.
#
# Base config: common subset across zenoh / dds / xrce. RMW choice +
# resource sizing comes from prj-<rmw>.conf overlays.
#
# phase-470 W5.b1 (issue 1288) — this file is the BRINGUP's now, one rung up
# from the three entry packages that each carried a byte-identical copy of it
# (`zephyr_rust_{lifecycle,params,qos}_entry`, all deleted; the copies differed
# only in the entry directory this comment used to name). `nros build` passes
# the directory holding it as `-DAPPLICATION_CONFIG_DIR`, so Zephyr discovers
# `prj.conf` and `boards/<board>.conf` here by its own rules, and the image's
# `conf = [...]` adds the RMW fragment through EXTRA_CONF_FILE — never
# `-DCONF_FILE`, which would suppress that discovery (builder/zephyr.rs).
#
#   nros build zephyr_rust_qos --workspace examples/workspaces/features
#
# =============================================================================
# Rust Support (zephyr-lang-rust)
# =============================================================================
CONFIG_RUST=y
CONFIG_RUST_ALLOC=y

CONFIG_LOG_BACKEND_RTT=n

# =============================================================================
# Logging
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# =============================================================================
# Networking (common)
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_DNS_RESOLVER=n

# =============================================================================
# Timing
# =============================================================================
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# =============================================================================
# nros Module
# =============================================================================
CONFIG_NROS=y
CONFIG_NROS_RUST_API=y

# =============================================================================
# Logging detail
# =============================================================================
CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y

# issue 0460 — the executor needs room for the CAPABILITY services, not just
# this entry's node callbacks. The features workspace declares
# `features = ["param_services", "lifecycle"]` in ONE shared `system.toml`
# (rust cannot hold two systems — phase-315 W1), so EVERY entry here registers
# both: six ROS 2 parameter services + five REP-2002 lifecycle services, 11
# slots on top of its own callbacks. The Kconfig default is 4, so
# `register_lifecycle_services()` failed, the entry returned Err, and the image
# printed nothing after "Network ready".
#
# `zephyr_rust_safety_entry` needs no override because `safety` is a BACKEND
# feature that registers no services — which is why it was the one cell of the
# four that passed.
CONFIG_NROS_EXECUTOR_MAX_CBS=16

# issue 0460 — a service server IS a zenoh queryable, and the same eleven
# capability services (six param + five lifecycle, above) need eleven queryable
# slots. The shim default is 8, so `register_lifecycle_services()` was refused
# the ninth and the entry died with a bare
# `Transport(ServiceServerCreationFailed)`. The Rust-side slot guard logs the
# knob's name only under `feature = "std"`, so on an embedded image it said
# nothing at all.
#
# Until issue 0460 this Kconfig reached the C lane and NOT the Rust one
# (`rust_cargo_application` inherits none of cmake's `set(ENV{...})` exports);
# `nros_zephyr_build::knob_usize` now reads it from `$DOTCONFIG`.
CONFIG_NROS_MAX_QUERYABLES=16
