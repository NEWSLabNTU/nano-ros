# Issue 2415 -- the `zephyr_rust_qos` image's own Zephyr pool, merged AFTER the
# shared `prj-zenoh.conf` (last wins), so the three other images that merge
# that file keep its 16.
#
# zenoh-pico takes one pthread condition variable per subscriber and per
# queryable, and Zephyr's pool is static. This image's queryable table is
# DERIVED from its declarations: 2 nodes x 6 parameter services + 5 lifecycle
# services + 1 transient-local publisher = 18. With its 1 subscriber the
# configure's floor (`zephyr/cmake/nros_cargo_build.cmake`) is
# 1 + 18 + 4 zenoh-pico fixed + 4 headroom = 27.
CONFIG_MAX_PTHREAD_COND_COUNT=27
