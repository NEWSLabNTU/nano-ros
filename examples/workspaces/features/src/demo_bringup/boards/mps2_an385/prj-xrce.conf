# Issue 2780 - the Zephyr-native settings the XRCE image adds on mps2/an385,
# named by `[image.zephyr_mps2_c_lifecycle_pair_xrce] os_config`. The network
# stack, its packet and buffer counts and the kernel heap are the board
# package's (packages/boards/nros-board-mps2-an385-zephyr/prj.conf); stating
# them again here would override the board (check-kconfig-overridden-values).

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
