# Issue 2780 - base config for `zephyr_mps2_c_lifecycle_pair_xrce` on
# mps2/an385. The network stack, the static SLIRP address, the main stack and
# the heap come from the `mps2-an385-zephyr` board package's own prj.conf,
# which `nros build` merges for this image; this file holds only what the
# application adds. Never `CONFIG_NROS_*` here (phase-481, RFC-0098 D10/D11).

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
# The test reads the heap lines off the console; deferred mode with this
# board's 1 KiB buffer drops lines in the registration burst (issue 2815).
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
