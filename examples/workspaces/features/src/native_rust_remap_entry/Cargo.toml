[package]
name = "native_rust_remap_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Entry pkg — boots the remap/private-name system on the native board."

[[bin]]
name = "native_rust_remap_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
native_rust_remap_entry_nros_selection = { path = "../../generated/nros-selection/native_rust_remap_entry" }
# phase-306 W4 — `nros::main!(model = …)` bakes the model's per-node `<remap>`
# rules into `runtime.remaps` before the register call; no extra feature is
# needed (the remap seam is part of the core entity-creation path).
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-board-linux = { path = "../../../../../packages/boards/nros-board-linux" }
rust_remap_talker_pkg = { path = "../rust_remap_talker_pkg", default-features = false }
