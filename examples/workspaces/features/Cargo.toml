# phase-331 W2 (RFC-0066 R2) — the rust half of the capability-demo workspace.
# Native only; see CMakeLists.txt for why.
[workspace]
resolver = "2"
members = [
    "src/rust_qos_talker_pkg",
    "src/rust_qos_listener_pkg",
    "src/rust_param_talker_pkg",
    "src/rust_lifecycle_talker_pkg",
    "src/rust_reading_talker_pkg",
    "src/rust_reading_listener_pkg",
    "src/rust_remap_talker_pkg",
    "src/native_rust_qos_entry",
    "src/native_rust_params_entry",
    "src/native_rust_lifecycle_entry",
    "src/native_rust_custom_msg_entry",
    "src/native_rust_remap_entry",
]

# phase-331 W3 — the ZEPHYR capability entries. West-built staticlibs exporting
# `rust_main`, not plain cargo, so they are excluded rather than listed as
# members (mirrors `workspaces/rust`). They carry NO `[workspace]` table of
# their own, so `nros::main!`'s pkg-index still resolves the sibling node pkgs
# against THIS workspace root.
#
# NOTE (RFC-0066 R2 workaround): these are EMBEDDED images in a workspace whose
# system declares the alloc-gated `param_services` / `lifecycle` capabilities —
# exactly what R2's "native only" rule was written to avoid. They were already
# built that way before this phase (`ws-{qos,params,lifecycle}-rust`), so this
# preserves existing coverage rather than introducing the problem. Resolving the
# alloc-gating properly needs its own campaign; see RFC-0066 Open questions.
exclude = [
    "src/zephyr_rust_qos_entry",
    "src/zephyr_rust_params_entry",
    "src/zephyr_rust_lifecycle_entry",
]
