[system]
name = "realtime_cpp_subnode_portable_demo"
rmw = "zenoh"
domain_id = 0

# Phase 273 W4 (RFC-0047) — portability proof.
# The subnode_pkg::SubNode component is IDENTICAL to ws-realtime-cpp-subnode,
# but this workspace uses DIFFERENT sched task names: "fast" and "bulk" instead of
# "high" and "low". The package (subnode_pkg) carries NO sched task reference — only
# the group IDs "ctrl" and "telem". The binding is entirely here in system.toml.
# This proves a group-using package is portable across workspaces (RFC-0047 §3).
[[component]]
pkg = "subnode_pkg"
class = "subnode_pkg::SubNode"
name = "sub_node"
group_tasks = { ctrl = "fast", telem = "bulk" }

[tasks.fast]
spin_period = "10000us"
[tasks.fast.posix]
priority = 80
# phase-427 W12 — RAW FreeRTOS priority for the mps2-an385 image below. The
# port's address plan (`packages/platform/nros-platform-freertos/
# nros-platform.toml` `[priority_plan]`) reserves 4 for the transport band and
# hands `pool.app = [1, 3]` to sched tasks, so `fast` takes the top app slot and
# still sits strictly BELOW the link it publishes over (RFC-0079, issue 0623).
[tasks.fast.freertos]
priority = 3

[tasks.bulk]
spin_period = "100000us"
[tasks.bulk.posix]
priority = 10
[tasks.bulk.freertos]
priority = 1


# Issue 0951 — the implicit machine this system runs on. A host says WHERE a
# node runs; what it is built as comes from `[image.*]`. Unscoped and with no
# `nodes`, so it governs every launch file and every node — which is what the
# `kind = "self"` deploy block it replaces already meant.
[host.native]
[image_defaults]
rmw = "zenoh"

[image.linux]
board = "linux"

# phase-427 W12 (issue 1247) — the FREESTANDING image of the same package.
# RFC-0089 correction 1 measured that deriving `rclcpp::Node` costs nothing on a
# freestanding target (no allocator, no exceptions, no vtable), and correction 8
# recorded that the capability had no in-tree consumer: every fixture over a
# `SHAPE rclcpp` package was `platform = "linux"`. This image is the consumer.
#
# It is this workspace and not `realtime-cpp` because the portability proof is
# exactly what the port needs: `subnode_pkg` names only the group IDs "ctrl" and
# "telem", so moving it onto an RTOS board is a deploy-side edit — the sched task
# table above gains a `[tasks.*.freertos]` priority and nothing in the package
# changes. Same launch file, same component, different board.
[image.freertos]
board = "mps2-an385-freertos"

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the SDK
# roots it builds against. Keyed by BOARD, not by an image name, because that is
# what the fact is about (issue 0951).
[board_config."mps2-an385-freertos"]
netstack = "lwip"
