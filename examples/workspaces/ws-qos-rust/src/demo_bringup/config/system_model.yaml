meta:
  version: 1
# RFC-0052 / phase-296 R4 — resolved model for the qos demo (2 nodes).
#
# Issue #52 / 0303 / 0306 — the talker's publisher carries a plan-level QoS
# OVERRIDE. `reliable_talker_pkg` declares `reliable + transient_local +
# depth(10)` in code; the model overrides RELIABILITY to `best_effort`, which
# the code never asks for. That makes the override the only possible source of
# a BEST_EFFORT publisher, so a peer that reports the advertised profile
# (`ros2 topic info --verbose`) distinguishes "the override reached the running
# entity" from "the code's profile stands" with no ambiguity.
#
# Precedence, matching rclcpp: the node's declared profile is the input, the
# plan override folds on top — plan is authority.
structure:
  scopes:
    /: {}
  nodes:
    /reliable_talker:
      scope: /
      pkg: reliable_talker_pkg
      exec: reliable_talker
      params:
        qos_overrides./qos_chatter.publisher.reliability: best_effort
    /qos_listener:
      scope: /
      pkg: qos_listener_pkg
      exec: qos_listener
execution: {}
