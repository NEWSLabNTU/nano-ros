# Phase 269 W3 — E2E-safety C workspace.
#
# `[system].features = ["safety"]` is the declarative axis (NanoRosCapabilities.cmake:64):
# it lowers to `NANO_ROS_SAFETY_E2E=ON` in the CMake build.
# - The C talker component attaches a CRC on every /chatter publish (automatic when
#   compiled with `safety-e2e`).
# - The C listener component registers a validated subscription via
#   `nros_cpp_subscription_register_validated` and republishes the running count of
#   CRC-valid samples on `/safe_ok`.
#
# In-process delivery does not happen (same zenoh session; issue 0096), so the demo
# is split into two entries: `native_safety_talker_entry` + `native_safety_listener_entry`.
# Cross-process e2e: tests/workspace_features_e2e.rs.

[system]
name = "c_safety_demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"
features = ["safety"]

[[component]]
pkg = "c_safety_talker_pkg"
class = "c_safety_talker_pkg::Talker"
name = "c_safety_talker"

[[component]]
pkg = "c_safety_listener_pkg"
class = "c_safety_listener_pkg::Listener"
name = "c_safety_listener"

[[component]]
pkg = "cpp_safety_talker_pkg"
class = "cpp_safety_talker_pkg::SafetyTalker"
name = "cpp_safety_talker"

[[component]]
pkg = "cpp_safety_listener_pkg"
class = "cpp_safety_listener_pkg::SafetyListener"
name = "cpp_safety_listener"

[[component]]
pkg = "rust_safety_talker_pkg"
class = "rust_safety_talker_pkg::Talker"
name = "rust_safety_talker"

[[component]]
pkg = "rust_safety_listener_pkg"
class = "rust_safety_listener_pkg::SafeListener"
name = "rust_safety_listener"

[deploy.native]
kind = "self"

# phase-331 W4 — one model per language launch.

[[model]]
launch = "c_safety_listener.launch.xml"
out    = "c_safety_listener_model.yaml"

[[model]]
launch = "c_safety_talker.launch.xml"
out    = "c_safety_talker_model.yaml"

[[model]]
launch = "cpp_safety_listener.launch.xml"
out    = "cpp_safety_listener_model.yaml"

[[model]]
launch = "cpp_safety_talker.launch.xml"
out    = "cpp_safety_talker_model.yaml"

[[model]]
launch = "rust_safety_listener.launch.xml"
out    = "rust_safety_listener_model.yaml"

[[model]]
launch = "rust_safety_talker.launch.xml"
out    = "rust_safety_talker_model.yaml"

