# Phase 269 W3 — E2E-safety C workspace.
#
# `[system].features = ["safety"]` is the declarative axis (NanoRosCapabilities.cmake:64):
# it lowers to `NANO_ROS_SAFETY_E2E=ON` in the CMake build and to the `safety-e2e`
# cargo feature for the Rust runtime. This line, not any node package, is what turns
# message integrity on:
# - Every talker component attaches a CRC-32 + sequence number on every /chatter
#   publish. No talker source declares or implements this — it is automatic once the
#   feature is compiled in, which is why the talkers here read as plain talkers.
# - Every listener component registers a validated subscription (C/C++:
#   `nros_cpp_subscription_register_validated`; Rust:
#   `create_subscription_for_callback_name_with_safety`) and reads the per-sample
#   verdict — CRC ok, sequence gap, or duplicate. The C listener republishes the
#   running count of CRC-valid samples on `/safe_ok`.
# - IMPLEMENTED BY THE ZENOH BACKEND ONLY, today. That is a property of which backends
#   have the CRC path, NOT of the feature or of any node: `rmw = "zenoh"` below is what
#   makes the declaration above have an effect. A node package stays agnostic; pointing
#   another `rmw` at this bringup is what would change the answer. Protocol: RFC-0028.
#
# In-process delivery does not happen (same zenoh session; issue 0096), so the demo
# is split into two entries: `native_safety_talker_entry` + `native_safety_listener_entry`.
# Cross-process e2e: tests/workspace_features_e2e.rs.

[system]
name = "c_safety_demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"
features = ["safety"]

[[component]]
pkg = "c_safety_talker_pkg"
class = "c_safety_talker_pkg::Talker"
name = "c_safety_talker"

[[component]]
pkg = "c_safety_listener_pkg"
class = "c_safety_listener_pkg::Listener"
name = "c_safety_listener"

[[component]]
pkg = "cpp_safety_talker_pkg"
class = "cpp_safety_talker_pkg::SafetyTalker"
name = "cpp_safety_talker"

[[component]]
pkg = "cpp_safety_listener_pkg"
class = "cpp_safety_listener_pkg::SafetyListener"
name = "cpp_safety_listener"

[[component]]
pkg = "rust_safety_talker_pkg"
class = "rust_safety_talker_pkg::Talker"
name = "rust_safety_talker"

[[component]]
pkg = "rust_safety_listener_pkg"
class = "rust_safety_listener_pkg::SafeListener"
name = "rust_safety_listener"


# Issue 0951 — the implicit machine this system runs on. A host says WHERE a
# node runs; what it is built as comes from `[image.*]`. Unscoped and with no
# `nodes`, so it governs every launch file and every node — which is what the
# `kind = "self"` deploy block it replaces already meant.
[host.native]
[[model]]
launch = "c_safety_listener.launch.xml"
out    = "c_safety_listener_model.yaml"

[[model]]
launch = "c_safety_talker.launch.xml"
out    = "c_safety_talker_model.yaml"

[[model]]
launch = "cpp_safety_listener.launch.xml"
out    = "cpp_safety_listener_model.yaml"

[[model]]
launch = "cpp_safety_talker.launch.xml"
out    = "cpp_safety_talker_model.yaml"

[[model]]
launch = "rust_safety_listener.launch.xml"
out    = "rust_safety_listener_model.yaml"

[[model]]
launch = "rust_safety_talker.launch.xml"
out    = "rust_safety_talker_model.yaml"


# --- phase-383 W9 (RFC-0065 D6) — images are the buildable unit.
# Derived from the entry packages that existed at migration time; each
# entry's `deploy` token picked its board, and its `launch` its topology.
[image_defaults]
rmw = "zenoh"

[image.native_c_safety_listener]
board = "native"
launch = "c_safety_listener.launch.xml"

[image.native_c_safety_talker]
board = "native"
launch = "c_safety_talker.launch.xml"

[image.native_cpp_safety_listener]
board = "native"
launch = "cpp_safety_listener.launch.xml"

[image.native_cpp_safety_talker]
board = "native"
launch = "cpp_safety_talker.launch.xml"

[image.native_rust_safety_listener]
board = "native"
launch = "rust_safety_listener.launch.xml"

[image.native_rust_safety_talker]
board = "native"
launch = "rust_safety_talker.launch.xml"

# Claims the hand-written west entry `zephyr_rust_safety_entry` by its
# `<id>_entry` name; its locator was that entry's
# `[package.metadata.nros.deploy.zephyr]` table (phase-445 W5).
[image.zephyr_rust_safety]
board = "zephyr"
conf = ["prj-zenoh.conf"]
launch = "rust_safety.launch.xml"
locator = "tcp/10.0.2.2:7467"
