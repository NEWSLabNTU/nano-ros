[package]
name = "native_rust_safety_listener_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "phase-263 B1 — listener half of the cross-process E2E-safety demo."

[[bin]]
name = "native_rust_safety_listener_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
native_rust_safety_listener_entry_nros_selection = { path = "../../generated/nros-selection/native_rust_safety_listener_entry" }
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-board-native = { path = "../../../../../packages/boards/nros-board-native" }
# rust_safety_listener_pkg/safety-e2e forwards nros/safety-e2e so CallbackCtx::integrity()
# is in scope; the node validates the CRC and republishes the validated count on /safe_ok.
rust_safety_listener_pkg = { path = "../rust_safety_listener_pkg", default-features = false, features = [
    "safety-e2e",
] }
