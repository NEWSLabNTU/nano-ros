[package]
name = "native_rust_safety_talker_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "phase-263 B1 — talker half of the cross-process E2E-safety demo."

[[bin]]
name = "native_rust_safety_talker_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
native_rust_safety_talker_entry_nros_selection = { path = "../../generated/nros-selection/native_rust_safety_talker_entry" }
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
# safety-e2e on the board → the zenoh backend attaches a CRC on publish, so the
# cross-process safe_listener can validate it (issue 0096: in-process delivery does
# not happen, hence the split). Talker side only attaches; no integrity read needed.
nros-board-linux = { path = "../../../../../packages/boards/nros-board-linux" }
rust_safety_talker_pkg = { path = "../rust_safety_talker_pkg", default-features = false }
