[package]
name = "rust_safety_talker_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg — publishes std_msgs/Int32 on /chatter (CRC attached by the safety backend)."

[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "rust_safety_talker_pkg::Talker"
name = "talker"
default_namespace = "/"

[dependencies]
nros = { path = "../../../../../packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi",
] }
std_msgs = { path = "generated/std_msgs", default-features = false }
