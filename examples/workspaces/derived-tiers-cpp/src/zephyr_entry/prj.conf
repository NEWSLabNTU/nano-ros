# phase-459 W0 - base config for the Zephyr C++ derived-tiers workspace entry.
# RMW choice + RMW-specific sizing come from the prj-<rmw>.conf overlay. Mirrors
# the realtime-cpp zephyr_entry base without its kernel-EDF line: nothing in this
# workspace declares a deadline, so the derived tiers are plain priorities.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_DNS_RESOLVER=n

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
CONFIG_NROS_C_API=y
# The entry is C++ and, once a tier table exists, drives the nodes through
# ZephyrBoard::run_tiers; that seam is compiled only under CONFIG_NROS_C_API
# OR CONFIG_NROS_CPP_API, and the C++ API is what puts the nros-cpp headers on
# the app include path and compiles the entry as C++17.
CONFIG_NROS_CPP_API=y
CONFIG_STD_CPP17=y

CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y
