# phase-459 W0 - zenoh RMW overlay for the Zephyr C++ derived-tiers workspace
# entry. Same sizing as the realtime-cpp zephyr_entry overlay.

CONFIG_NROS_RMW_ZENOH=y

CONFIG_NET_TCP=y
CONFIG_POSIX_API=y
# 64, not 32 - the build derives a floor and refuses below it; see
# `_nros_mutex_floor` in `zephyr/cmake/nros_cargo_build.cmake`.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# The 30 Hz tiers need tx windows well inside their period: Zephyr zsock
# serializes send behind the read task's recv window (issues 0129/0139).
CONFIG_NROS_ZENOH_SOCKET_TIMEOUT_MS=5
