# Node interface contract for system.launch.xml (phase-459 W0).
#
# The provider sidecar: `<stem>.contract.yaml` beside `<stem>.launch.xml`,
# folded into the SystemModel by the pinned resolver. It states, per node, the
# one timer path each component runs and what that tick publishes. The tier
# derivation reads the TIMER rates; nothing else in this workspace states a
# rate, a priority or a tier.
#
# THE TWO NUMBERS DIFFER ON PURPOSE (phase-459 W7, issue 1372). Each node's
# `paths.on_timer.trigger.timer.rate_hz` is when its callback fires, and that
# is the only number the schedule reads. Each `pub.<ep>.min_rate_hz` is a
# publication FLOOR the endpoint promises - a runtime-monitor input, never a
# schedule input. They are chosen so that ranking by the promises would INVERT
# the schedule: the 30 Hz pair promises only 5 Hz and the 10 Hz pair 8 Hz, so
# a derivation still reading `min_rate_hz` (as nano-ros did before phase-457
# W2) would put the slow pair first. `derived_tiers_bake` asserts it does not.
#
# Both promises are true lower bounds, which is why the resolver says nothing
# about them. One ABOVE the fire rate is a `min-rate-mismatch` warning from the
# resolver; that is the divergence check issue 1372 asked for, and
# `derived_tiers_bake` covers it too. The topics carry no `rate_hz`: the
# resolver derives each from the timer that drives it.
#
# The timer periods in code are 33 ms and 100 ms (`create_wall_timer_in` takes
# whole milliseconds); 30 Hz and 10 Hz are the rates the island's components
# declare as their `update_rate` parameters, and they are what the ranker
# orders by.

version: 1

nodes:
  mrm_emergency_stop_operator:
    paths:
      on_timer:
        trigger: { timer: { rate_hz: 30 } }
        output: [control_cmd]
    pub:
      control_cmd: { min_rate_hz: 5 }

  stop_mode_operator:
    paths:
      on_timer:
        trigger: { timer: { rate_hz: 30 } }
        output: [control]
    pub:
      control: { min_rate_hz: 5 }

  mrm_comfortable_stop_operator:
    paths:
      on_timer:
        trigger: { timer: { rate_hz: 10 } }
        output: [status]
    pub:
      status: { min_rate_hz: 8 }

  mrm_handler:
    paths:
      on_timer:
        trigger: { timer: { rate_hz: 10 } }
        output: [mrm_state]
    pub:
      mrm_state: { min_rate_hz: 8 }

# Every topic leaves the image: the consumer is the vehicle or Autoware
# proper (`external: sub`), as for the island's command outputs. Nothing here
# subscribes, so the derivation places nodes by their timers alone.
topics:
  /system/emergency/control_cmd:
    type: std_msgs/msg/Int32
    external: sub
    pub: [mrm_emergency_stop_operator/control_cmd]
  /system/stop_mode/control:
    type: std_msgs/msg/Int32
    external: sub
    pub: [stop_mode_operator/control]
  /system/mrm/comfortable_stop/status:
    type: std_msgs/msg/Int32
    external: sub
    pub: [mrm_comfortable_stop_operator/status]
  /system/fail_safe/mrm_state:
    type: std_msgs/msg/Int32
    external: sub
    pub: [mrm_handler/mrm_state]
