# Zephyr's POSIX pools are static, and zenoh-pico takes a mutex and a
# condition variable per subscriber and queryable plus a fixed set; configure
# refuses an image whose pools are too small for its entities. Sized for the
# raised pools in system.toml, as the island's board fragments size theirs.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=32
