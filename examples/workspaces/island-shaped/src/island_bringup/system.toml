# The island-shaped workspace (phase-567 W4): one in-tree project with the
# layouts the safety island hit, so the merge queue breaks on them before a
# downstream build does. Every layout a downstream project reports that the
# tree did not cover is added here in the same PR as its fix.
#
#   - param files in a SIBLING package, loaded absolute and
#     $(dirname)-relative (launch/system.launch.xml; issue 2615)
#   - a C and a Rust component in one system and one image
#   - pools raised above their derived counts ([image.freertos] and
#     [image.zephyr] knobs; issue 2618)
#   - a board build ([image.freertos]) checked against a census taken from
#     the native image ([image.linux])

[system]
name = "island_shaped"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "c_controller_pkg"
class = "c_controller_pkg::Controller"
name = "controller"

[[component]]
pkg = "rust_monitor_pkg"
class = "rust_monitor_pkg::Monitor"
name = "monitor"

[host.native]

# The census image: a native build of the same components, run to count the
# entities the code really creates.
[image.linux]
board = "linux"

# The board build. Its pools are stated ABOVE what the inventory derives
# (3 publishers, 3 subscriptions), as the island states headroom for
# entities a later feature adds.
[image.freertos]
board = "mps2-an385-freertos"
knobs.zenoh.max_publishers = 6
knobs.zenoh.max_subscribers = 6

# The same raise on the Zephyr road, where it is rendered into Kconfig (a
# generated image refuses the knob in a .conf fragment: system.toml is its one
# source). The island's case was CONFIG_NROS_MAX_PUBLISHERS=13 over a derived
# 11, refused after link (issue 2618). The daily Zephyr lane builds this image
# and checks its knob delivery; the merge queue checks the committed snapshot
# of that build dir (tests/fixtures/knob-delivery/island-shaped-zephyr).
[image.zephyr]
board = "zephyr"
os_config = ["zephyr/prj-posix.conf"]
knobs.zenoh.max_publishers = 6
knobs.zenoh.max_subscribers = 6

[board_config."mps2-an385-freertos"]
netstack = "lwip"
