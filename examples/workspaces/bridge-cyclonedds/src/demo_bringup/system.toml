[system]
name = "bridge_demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

# phase-263 B3 — cross-RMW bridge showcase. `talker_pkg` is a plain talker: it
# publishes /chatter and names no session and no backend. THIS FILE decides both.
# The [[domain]] rows below put it on the primary (zenoh) session, and the
# [[bridge]] forwards every declared topic (here /chatter) zenoh→cyclonedds, so a
# stock rmw_cyclonedds_cpp peer (`ros2 topic echo /chatter`) receives it.
# `nros codegen system` reads the [[bridge]]/[[domain]] blocks and the (issue #99)
# planner emits the build.transports + plan.bridges the relay codegen consumes.
[[component]]
pkg = "talker_pkg"
class = "talker_pkg::Talker"
name = "talker"

# The two bridged sessions. Each `[[bridge]]` endpoint is an `<rmw>:<domain>`
# selector resolved to these `[[domain]]` ids. Each domain's wiring is its
# middleware's OWN file (RFC-0109 D6, U5): the zenoh session dials what
# `rmw/zenoh-zen.json5` says, the Cyclone participant reads
# `rmw/cyclonedds-dds.xml` — the two documents `rmw_zenoh` and
# `rmw_cyclonedds_cpp` would read on a ROS 2 host.
[[domain]]
name = "zen"
rmw = "zenoh"
id = 0
config = "rmw/zenoh-zen.json5"

[[domain]]
name = "dds"
rmw = "cyclonedds"
id = 5
config = "rmw/cyclonedds-dds.xml"

[[bridge]]
name = "gw"
from = "zenoh:zen"
to = "cyclonedds:dds"

# --- phase-383 W9 (RFC-0065 D6) — images are the buildable unit.
# Derived from the entry packages that existed at migration time; each
# entry's `deploy` token picked its board, and its `launch` its topology.
[image_defaults]
rmw = "zenoh"

[image.linux]
board = "linux"
