[package]
name = "native_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Entry pkg — boots the E2E-safety showcase on the native board."

[[bin]]
name = "native_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
native_entry_nros_selection = { path = "../../generated/nros-selection/native_entry" }
nros = { path = "../../../../../packages/core/nros", default-features = false, features = ["alloc", "rmw-cffi"] }
# phase-263 B1 — `safety-e2e` on the board forwards to the zenoh backend's CRC
# attach/validate (`nros-rmw-zenoh/safety-e2e`); the demo declares
# `features=["safety"]` in system.toml. (For a bake build, `nros codegen-system`
# lowers that automatically — phase-261 W3; here the plain-cargo entry sets it
# explicitly.)
nros-board-native = { path = "../../../../../packages/boards/nros-board-native" }
talker_pkg = { path = "../talker_pkg", default-features = false }
# `safe_listener_pkg/safety-e2e` forwards `nros/safety-e2e`, putting
# `CallbackCtx::integrity()` in scope; cargo unifies `nros` across the graph.
safe_listener_pkg = { path = "../safe_listener_pkg", default-features = false, features = [
    "safety-e2e",
] }
