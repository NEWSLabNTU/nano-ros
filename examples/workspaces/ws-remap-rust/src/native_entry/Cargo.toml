[package]
name = "native_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Entry pkg — boots the remap/private-name system on the native board."

[[bin]]
name = "native_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-305 W4 — `nros::main!(model = …)` bakes the model's per-node `<remap>`
# rules into `runtime.remaps` before the register call; no extra feature is
# needed (the remap seam is part of the core entity-creation path).
nros = { path = "../../../../../packages/core/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "ros-humble",
] }
nros-board-native = { path = "../../../../../packages/boards/nros-board-native", features = ["rmw-zenoh"] }
remap_talker_pkg = { path = "../remap_talker_pkg", default-features = false }
