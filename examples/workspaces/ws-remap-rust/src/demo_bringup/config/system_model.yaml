meta:
  version: 1
# phase-306 W4 (issue 0255) — resolved model for the remap demo. The node is
# namespaced under /island (identity from the FQN key) and carries a remap
# from its PRIVATE `~/out` to /remapped_out. `nros::main!(model = …)` bakes
# the rules verbatim into `runtime.remaps`; the runtime seam does the `~`
# expansion + matching, so the wire topic is /remapped_out (never the
# expansion /island/remap_talker/out).
structure:
  scopes:
    /: {}
  nodes:
    /island/remap_talker:
      scope: /
      pkg: remap_talker_pkg
      exec: remap_talker
      remaps:
        - from: "~/out"
          to: /remapped_out
