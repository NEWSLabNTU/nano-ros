# phase-306 W4 (issue 0255) — launch/model remap + `~` private-name showcase.
#
# The Node pkg publishes on the PRIVATE name `~/out` (source-level; never an
# absolute path in code). The resolved system model namespaces the node under
# `/island` and carries a `<remap>` from `~/out` to `/remapped_out`;
# `nros::main!(model = …)` bakes the rules into `runtime.remaps` and entity
# creation resolves the wire name through them (RFC-0046 / phase-306 W3) — so
# the topic that hits the wire is `/remapped_out`, not the `~` expansion
# `/island/remap_talker/out`.

[workspace]
resolver = "2"
members = [
    "src/remap_talker_pkg",
    "src/native_entry",
]
# `demo_bringup` is declarative (no Cargo.toml) and is NOT a member.

[workspace.metadata.nros]
default_system = "demo_bringup"
