[package]
name = "urgent_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg -- a 100 Hz timer that logs when each activation runs (the RTIC levels cell's urgent level)."

# Node pkg shape: lib only. Platform and RMW come from the entry's board.
[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "urgent_pkg::Urgent"
name = "urgent"

[dependencies]
nros = { version = "*", default-features = false, features = [
    "alloc",
    "rmw-cffi", "macros"] }
log = { version = "0.4", default-features = false }
