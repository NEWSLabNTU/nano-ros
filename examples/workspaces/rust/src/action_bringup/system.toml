# phase-535 (RFC-0122 D1) — the action pair as images: one image per
# (platform, role, rmw), ids `<platform>_<role>[_<rmw>]`. The test-side map
# from a matrix cell to these ids is `nros_tests::fixtures::workspace_image`.
# `locator` is the cell's `alloc::port_of` on QEMU's SLIRP host; the test
# `pair_image_rows_dial_their_allocator_port` holds it there.

[system]
name = "rust_action"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "action_server_pkg"
class = "action_server_pkg::FibonacciServer"
name = "fibonacci_server"

[[component]]
pkg = "action_client_pkg"
class = "action_client_pkg::FibonacciClient"
name = "fibonacci_client"

[image_defaults]
rmw = "zenoh"

[image.freertos_action_server]
board = "mps2-an385-freertos"
panic = "own"
launch = "action_server.launch.xml"
locator = "tcp/10.0.2.2:7820"
os_config = ["board-net-15.toml"]

[image.freertos_action_client]
board = "mps2-an385-freertos"
panic = "own"
launch = "action_client.launch.xml"
locator = "tcp/10.0.2.2:7820"
os_config = ["board-net-16.toml"]

# phase-535 W6 — the same bare-metal board with the RTIC entry framework
# (board word `rtic-mps2-an385`: `nros::main!` emits a `#[rtic::app]` whose
# run task registers the launch's node). They came from the
# `examples/mps2-an385-baremetal/rust/action-{server,client}-rtic` leaves.
# `locator` is the cell's `alloc::port_of`; there is no plain bare-metal
# Rust action image to share it.

[image.baremetal_action_server_rtic]
board = "rtic-mps2-an385"
launch = "action_server.launch.xml"
locator = "tcp/10.0.2.2:10220"
os_config = ["board-net-15.toml"]

[image.baremetal_action_client_rtic]
board = "rtic-mps2-an385"
launch = "action_client.launch.xml"
locator = "tcp/10.0.2.2:10220"
os_config = ["board-net-16.toml"]

# Linux: one image per (role, rmw). The router locator is ephemeral
# (NROS_LOCATOR at run time), so none is baked here.

[image.linux_action_server]
board = "linux"
launch = "action_server.launch.xml"

[image.linux_action_server_xrce]
board = "linux"
launch = "action_server.launch.xml"
rmw = "xrce"

[image.linux_action_server_cyclonedds]
board = "linux"
launch = "action_server.launch.xml"
rmw = "cyclonedds"

[image.linux_action_client]
board = "linux"
launch = "action_client.launch.xml"

[image.linux_action_client_xrce]
board = "linux"
launch = "action_client.launch.xml"
rmw = "xrce"

[image.linux_action_client_cyclonedds]
board = "linux"
launch = "action_client.launch.xml"
rmw = "cyclonedds"

# ThreadX's Linux simulator (a hosted process, NSOS host sockets): it
# dials loopback directly. `locator` is the cell's `alloc::port_of`; the
# Cyclone images bake the leaf's `alloc::domain_of` domain.

[image.threadx_action_server]
board = "threadx-linux"
launch = "action_server.launch.xml"
locator = "tcp/127.0.0.1:9020"

[image.threadx_action_client]
board = "threadx-linux"
launch = "action_client.launch.xml"
locator = "tcp/127.0.0.1:9020"

# Zephyr native_sim: one image per (role, rmw). The router port, Agent port
# and DDS domain are the cell's `nros_tests::alloc` values (the
# `cell-isolation` table). The west lane passes the same values as
# `-DCONFIG_*` defines. The Kconfig fragments live in
# `boards/native_sim_native_64/`. They came from the `examples/zephyr/rust` leaves.

[image.zephyr_action_server]
board = "zephyr"
launch = "action_server.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7420"

[image.zephyr_action_server_xrce]
board = "zephyr"
launch = "action_server.launch.xml"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
locator = "udp/127.0.0.1:2420"
domain_id = 37

[image.zephyr_action_server_xrce.knobs.xrce]
max_subscribers = 0
max_service_servers = 3
max_service_clients = 0

[image.zephyr_action_client]
board = "zephyr"
launch = "action_client.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7420"

[image.zephyr_action_client_xrce]
board = "zephyr"
launch = "action_client.launch.xml"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
locator = "udp/127.0.0.1:2420"
domain_id = 37

[image.zephyr_action_client_xrce.knobs.xrce]
max_subscribers = 1
max_service_servers = 0
max_service_clients = 3

# Issue 2313 — the Rust Cyclone DDS images. They came from the
# `examples/zephyr/rust/<role>` leaves, which stayed leaves until a generated
# Rust Zephyr entry could run Cyclone (issues 2354/2313). `domain_id` is the
# cell's `alloc::domain_of` (Rust's port index is 0, so 22/25/28 beside C's
# 23/26/29 and C++'s 24/27/30); `prj-cyclonedds.conf` is the leaf's own.

[image.zephyr_action_server_cyclonedds]
board = "zephyr"
launch = "action_server.launch.xml"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]
domain_id = 28

[image.zephyr_action_client_cyclonedds]
board = "zephyr"
launch = "action_client.launch.xml"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]
domain_id = 28

# ThreadX on QEMU rv-virt (riscv64, NetX Duo, SLIRP). `locator` is the
# cell's `alloc::port_of`. They came from the `examples/rv-virt-threadx`
# leaves. Each QEMU has its own SLIRP network, so the board's default address
# serves both roles of a pair.

[image.riscv_threadx_action_server]
board = "rv-virt-threadx"
launch = "action_server.launch.xml"
locator = "tcp/10.0.2.2:9420"

[image.riscv_threadx_action_client]
board = "rv-virt-threadx"
launch = "action_client.launch.xml"
locator = "tcp/10.0.2.2:9420"

# NuttX on QEMU virt (armv7-a). `locator` is the cell's `alloc::port_of`
# on QEMU's SLIRP host. They came from the `examples/qemu-armv7a-nuttx` leaves.

[image.nuttx_action_server]
board = "qemu-armv7a-nuttx"
launch = "action_server.launch.xml"
panic = "platform"
locator = "tcp/10.0.2.2:8220"

[image.nuttx_action_client]
board = "qemu-armv7a-nuttx"
launch = "action_client.launch.xml"
panic = "platform"
locator = "tcp/10.0.2.2:8220"

[board_config."mps2-an385-freertos"]
netstack = "lwip"

[board_config."threadx-linux"]
netstack = "netxduo"

[board_config."rv-virt-threadx"]
netstack = "netxduo"

[board_config."qemu-armv7a-nuttx"]
