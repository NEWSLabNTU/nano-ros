[package]
name = "native_service_client_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "phase-263 A1 — client half of the cross-process AddTwoInts service demo."

[[bin]]
name = "native_service_client_entry"
path = "src/main.rs"

# phase-263 A1 (Track D) — the CLIENT process of the cross-process service
# round-trip. `nros::main!(launch = "demo_bringup:service_client.launch.xml")`
# emits `service_client_pkg::register` only; `add_client` calls `add_server`
# (in the sibling `native_service_server_entry` process) on /add_two_ints each
# tick and republishes the server-computed sum on /sum (issue 0096).
[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
native_service_client_entry_nros_selection = { path = "../../generated/nros-selection/native_service_client_entry" }
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-board-native = { path = "../../../../../packages/boards/nros-board-native" }
service_client_pkg = { path = "../service_client_pkg", default-features = false }
