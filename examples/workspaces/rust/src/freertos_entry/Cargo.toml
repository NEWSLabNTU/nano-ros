[package]
name = "freertos_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Entry pkg — boots the demo topology on FreeRTOS QEMU MPS2-AN385."

[[bin]]
name = "freertos_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "freertos"

[package.metadata.nros.deploy.freertos]
rmw = "zenoh"
domain_id = 0
locator = "tcp/10.0.2.2:7830"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
freertos_entry_nros_selection = { path = "../../generated/nros-selection/freertos_entry" }
# Phase 248 C6a (#60 T5) — agnostic `nros` (alloc + rmw-cffi vtable + ROS
# edition). Platform (`platform-freertos`) AND the concrete zenoh backend now
# come from the board crate's `rmw-zenoh` feature below; `nros` names neither.
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi"] }
# Board crate is the RMW+platform selection point: `features = ["rmw-zenoh"]`
# links+registers the zenoh backend (via `nros-board-freertos`'s direct
# `nros-rmw-zenoh` dep + boot-path `register()`).
nros-board-mps2-an385-freertos = { path = "../../../../../packages/boards/nros-board-mps2-an385-freertos" }
# Concrete platform impl (`nros_platform_*` symbols) — also pulled by the board;
# kept explicit here for the link map. NOT the agnostic-forbidden `nros/platform-*`.
nros-platform = { path = "../../../../../packages/platform/nros-platform", default-features = false, features = ["platform-freertos"] }
panic-semihosting = "0.6"
talker_pkg = { path = "../talker_pkg", default-features = false }
listener_pkg = { path = "../listener_pkg", default-features = false }
