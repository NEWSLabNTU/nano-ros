# phase-535 (RFC-0122 D1) — the pubsub pair as images: one image per
# (platform, role, rmw), ids `<platform>_<role>[_<rmw>]`. The test-side map
# from a matrix cell to these ids is `nros_tests::fixtures::workspace_image`.
# `locator` is the cell's `alloc::port_of` on QEMU's SLIRP host; the test
# `pair_image_rows_dial_their_allocator_port` holds it there.

include = ["../../shared/system-defaults.toml"]  # rmw, domain_id: shared by every bringup here

[system]
name = "rust_pubsub"
default_launch = "system.launch.xml"

[[component]]
pkg = "talker_pkg"
class = "talker_pkg::Talker"
name = "talker"

[[component]]
pkg = "listener_pkg"
class = "listener_pkg::Listener"
name = "listener"

# The stub board of the `clock-board` configuration (phase-582 W1d): its
# wall-clock hook and a node printing the wall clock. Only
# `linux_talker_clock_board` launches it.
[[component]]
pkg = "clock_board_pkg"
class = "clock_board_pkg::ClockBoard"
name = "clock_board"

[image.freertos_talker]
board = "mps2-an385-freertos"
panic = "own"
launch = "talker.launch.xml"
locator = "tcp/10.0.2.2:7800"
os_config = ["board-net-15.toml"]

[image.freertos_listener]
board = "mps2-an385-freertos"
panic = "own"
launch = "listener.launch.xml"
locator = "tcp/10.0.2.2:7800"
os_config = ["board-net-16.toml"]

# Bare-metal MPS2-AN385 (no RTOS; phase-535 W5). `locator` is the cell's
# `alloc::port_of(QemuBaremetal, Rust, Pubsub)`. The two images share the
# FreeRTOS pair's network files: each QEMU has its own SLIRP network.

[image.baremetal_talker]
board = "mps2-an385-baremetal"
launch = "talker.launch.xml"
locator = "tcp/10.0.2.2:10200"
os_config = ["board-net-15.toml"]

[image.baremetal_listener]
board = "mps2-an385-baremetal"
launch = "listener.launch.xml"
locator = "tcp/10.0.2.2:10200"
os_config = ["board-net-16.toml"]

# Bare metal over UART0 (phase-535 W6, RFC-0122 D2): the `serial`
# configuration of the same two packages. The locator IS the link: a
# `serial/...` (zenoh) or `custom://uart` (XRCE) locator makes `nros configure`
# derive `NROS_ZENOH_NO_SMOLTCP=1` + `NROS_LINK_IP=0`, so the image carries no IP
# stack and no `os_config`. The router (or Agent) sits on the other end of a
# socat PTY pair, so these images dial no port.

[image.baremetal_talker_serial]
board = "mps2-an385-baremetal"
launch = "talker.launch.xml"
locator = "serial/UART_0#baudrate=115200"

[image.baremetal_listener_serial]
board = "mps2-an385-baremetal"
launch = "listener.launch.xml"
locator = "serial/UART_0#baudrate=115200"

# XRCE framed over UART0. The board installs the XRCE custom-transport vtable
# for `rmw = "xrce"` over the `custom` link the locator names (RFC-0109 D6,
# issue 1601). The knobs are the APP rung (RFC-0049): phase 207.6 shrank
# `xrce_session_state_t` from ~390 KB at the defaults to ~12 KB at these, so
# its calloc fits the board's heap. The other bare-metal images want the
# defaults, so they are not a board fact. The service-server cap is the one
# left to the entity derivation: the image's sizing descriptor states its
# runtime families, so the XRCE build sizes the six parameter services.
[image.baremetal_talker_xrce_serial]
board = "mps2-an385-baremetal"
launch = "talker.launch.xml"
rmw = "xrce"
locator = "custom://uart"

[image.baremetal_talker_xrce_serial.knobs.xrce]
# MTU matches the serial transport's; the default is 4096.
custom_transport_mtu = 512
buffer_bytes = 256
max_subscribers = 1
# No `max_service_servers`: the cargo road derives it from the sizing
# descriptor (the application's servers plus the six parameter services
# of its one node).
max_service_clients = 1

# phase-535 W6 — the same bare-metal board with the RTIC entry framework
# (`framework = "rtic"`: `nros::main!` emits a `#[rtic::app]` whose
# run task registers the launch's node). They came from the
# `examples/mps2-an385-baremetal/rust/{talker,listener}-rtic` leaves and the
# `-rtic-mixed` pair (issue 2417: its `ffi-sync` reached no code). `locator`
# is `nros_tests::alloc::BAREMETAL_RTIC_PUBSUB_PORT`: the cell's `port_of` is
# the plain pair's above.

[image.baremetal_talker_rtic]
board = "mps2-an385-baremetal"
framework = "rtic"
# The RTIC entry registers no parameter services and no /rosout writer,
# so this image opts out of the stock node interfaces (issue 2559).
node_interfaces = "none"
launch = "talker.launch.xml"
locator = "tcp/10.0.2.2:10540"
os_config = ["board-net-15.toml"]

[image.baremetal_listener_rtic]
board = "mps2-an385-baremetal"
framework = "rtic"
# The RTIC entry registers no parameter services and no /rosout writer,
# so this image opts out of the stock node interfaces (issue 2559).
node_interfaces = "none"
launch = "listener.launch.xml"
locator = "tcp/10.0.2.2:10540"
os_config = ["board-net-16.toml"]

# Linux: one image per (role, rmw). The router locator is ephemeral
# (NROS_LOCATOR at run time), so none is baked here.

[image.linux_talker]
board = "linux"
launch = "talker.launch.xml"

[image.linux_talker_xrce]
board = "linux"
launch = "talker.launch.xml"
rmw = "xrce"

[image.linux_talker_cyclonedds]
board = "linux"
launch = "talker.launch.xml"
rmw = "cyclonedds"

# The `clock-board` configuration of the linux talker (phase-582 W1d,
# RFC-0141 D2): the wall clock comes from the board's hook, which
# `clock_board_pkg` defines as a stub answering one fixed instant. The launch
# runs the talker beside that package's node, which prints the wall clock and
# its state; the talker's samples carry the same clock as their source stamp.
# `tests/linux_board_clock.rs` runs it.
[image.linux_talker_clock_board]
board = "linux"
launch = "talker_clock_board.launch.xml"

[image.linux_talker_clock_board.knobs.clock]
source = "board"

# The same configuration on the other two backends: each backend stamps its
# own samples, so these say whether the source stamp follows the selected
# wall clock there too. `tests/linux_board_clock.rs` reads it back through the
# MessageInfo observer's image for the same backend.
[image.linux_talker_cyclonedds_clock_board]
board = "linux"
launch = "talker_clock_board.launch.xml"
rmw = "cyclonedds"

[image.linux_talker_cyclonedds_clock_board.knobs.clock]
source = "board"

[image.linux_talker_xrce_clock_board]
board = "linux"
launch = "talker_clock_board.launch.xml"
rmw = "xrce"

[image.linux_talker_xrce_clock_board.knobs.clock]
source = "board"

[image.linux_listener]
board = "linux"
launch = "listener.launch.xml"

[image.linux_listener_xrce]
board = "linux"
launch = "listener.launch.xml"
rmw = "xrce"

[image.linux_listener_cyclonedds]
board = "linux"
launch = "listener.launch.xml"
rmw = "cyclonedds"

# phase-535 W6 — the `peer-mode` configuration of the linux listener
# (RFC-0122 D2), from the `examples/linux/rust/listener` variant row:
# zenoh-pico with the multicast transport, scouting and multicast
# declarations compiled in (issue 0711; off by default for size, issue 0682),
# so a session opened with `NROS_SESSION_MODE=peer` needs no router. Its talker
# is the `examples/linux/rust/talker` witness's peer row. (The listener's
# `link-tls` row keeps its own directory: issue 2423.)
[image.linux_listener_peer_mode]
board = "linux"
launch = "listener.launch.xml"

[image.linux_listener_peer_mode.knobs.zenoh]
multicast_transport = true

# ThreadX's Linux simulator (a hosted process, NSOS host sockets): it
# dials loopback directly. `locator` is the cell's `alloc::port_of`; the
# Cyclone images bake the leaf's `alloc::domain_of` domain.

[image.threadx_talker]
board = "threadx-linux"
launch = "talker.launch.xml"
locator = "tcp/127.0.0.1:9000"

[image.threadx_listener]
board = "threadx-linux"
launch = "listener.launch.xml"
locator = "tcp/127.0.0.1:9000"

# Zephyr native_sim: one image per (role, rmw). The router port, Agent port
# and DDS domain are the cell's `nros_tests::alloc` values (the
# `cell-isolation` table). The west lane passes the same values as
# `-DCONFIG_*` defines. The Kconfig fragments live in
# `boards/native_sim_native_64/`. They came from the `examples/zephyr/rust` leaves.

[image.zephyr_talker]
board = "zephyr"
launch = "talker.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

# The wall-clock cells' timer witness: the talker with an SNTP source whose
# server never answers (TEST-NET-1, RFC 5737), so boot waits 2 x 1500 ms
# before the platform fallback. Its 1 s publish timer must not replay that
# wait once spinning starts.
[image.zephyr_talker_clock_sntp]
board = "zephyr"
launch = "talker.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

[image.zephyr_talker_clock_sntp.knobs.clock]
source = "sntp,platform"
sntp_attempts = 2

[image.zephyr_talker_clock_sntp.knobs.sntp]
server = "192.0.2.1"
timeout_ms = 1500

# RFC-0141 D5 (phase-582 W3): the same talker against an SNTP server the
# test runs on loopback, whose time it steps mid-run. `_resync` re-queries
# every 500 ms, so its stamps follow the step; `_once` keeps the default 0,
# one exchange at boot, so its stamps do not. Each has its own port so the
# two cases may run at once. `tests/zephyr_clock_resolve.rs` runs them.
[image.zephyr_talker_clock_sntp_resync]
board = "zephyr"
launch = "talker.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

[image.zephyr_talker_clock_sntp_resync.knobs.clock]
source = "sntp,platform"
sntp_attempts = 3
sntp_resync_interval_ms = 500

[image.zephyr_talker_clock_sntp_resync.knobs.sntp]
server = "127.0.0.1:12397"
timeout_ms = 400

# Issue 2846 -- the re-sync thread on a real 32-bit target, for its
# stack-floor walk and its thread-analyzer peak (`config/stack-floors.toml`,
# role SNTP_RESYNC). The server is a HOSTNAME so the thread runs Zephyr's DNS
# resolver too, the deeper path. The locator, server and DNS server
# (`boards/mps2_an385/prj-zenoh.conf`) are QEMU's user-mode gateway, the host's
# address from the guest.
[image.zephyr_cortex_m_talker_clock_sntp_resync]
board = "mps2-an385-zephyr"
# The stack-floor key the drift check finds this image by (bringup@image).
stack_floor_image = "pubsub_bringup@zephyr_cortex_m_talker_clock_sntp_resync"
launch = "talker.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/10.0.2.2:10600"

[image.zephyr_cortex_m_talker_clock_sntp_resync.knobs.clock]
source = "sntp,platform"
sntp_attempts = 3
sntp_resync_interval_ms = 500

[image.zephyr_cortex_m_talker_clock_sntp_resync.knobs.sntp]
server = "ntp.nros.test:12399"
timeout_ms = 400

[image.zephyr_talker_clock_sntp_once]
board = "zephyr"
launch = "talker.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

[image.zephyr_talker_clock_sntp_once.knobs.clock]
source = "sntp,platform"
sntp_attempts = 3

[image.zephyr_talker_clock_sntp_once.knobs.sntp]
server = "127.0.0.1:12398"
timeout_ms = 400

# issue 2839: `sntp,platform` + `epoch_failure = "halt"` against a loopback
# port with no server. Zephyr's `platform` has no wall clock and does not
# answer, so the image halts at boot. `tests/zephyr_clock_resolve.rs`.
[image.zephyr_talker_clock_halt]
board = "zephyr"
launch = "talker.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

[image.zephyr_talker_clock_halt.knobs.clock]
source = "sntp,platform"
sntp_attempts = 1
epoch_failure = "halt"

[image.zephyr_talker_clock_halt.knobs.sntp]
server = "127.0.0.1:12396"
timeout_ms = 500

[image.zephyr_talker_xrce]
board = "zephyr"
launch = "talker.launch.xml"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
locator = "udp/127.0.0.1:2400"
domain_id = 31

[image.zephyr_talker_xrce.knobs.xrce]
max_service_servers = 6  # 0 of its own + the six parameter services of its node
max_service_clients = 0

[image.zephyr_listener]
board = "zephyr"
launch = "listener.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

# The wall-clock cells (`tests/zephyr_clock_resolve.rs`). The listener waits
# for a zenoh-hlc timestamp on its subscription, else falls back to the
# platform after 4 s; with a native talker behind the router it latches the
# HLC (the router stamps an unstamped sample), with none it falls back.
[image.zephyr_listener_clock_hlc]
board = "zephyr"
launch = "listener.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

[image.zephyr_listener_clock_hlc.knobs.clock]
source = "zenoh-hlc,platform"
fallback_settle_ms = 4000

[image.zephyr_listener_xrce]
board = "zephyr"
launch = "listener.launch.xml"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
locator = "udp/127.0.0.1:2400"
domain_id = 31

[image.zephyr_listener_xrce.knobs.xrce]
max_subscribers = 1
max_service_servers = 6  # 0 of its own + the six parameter services of its node
max_service_clients = 0

# Issue 2313 — the Rust Cyclone DDS images. They came from the
# `examples/zephyr/rust/<role>` leaves, which stayed leaves until a generated
# Rust Zephyr entry could run Cyclone (issues 2354/2313). `domain_id` is the
# cell's `alloc::domain_of` (Rust's port index is 0, so 22/25/28 beside C's
# 23/26/29 and C++'s 24/27/30); `prj-cyclonedds.conf` is the leaf's own.

[image.zephyr_talker_cyclonedds]
board = "zephyr"
launch = "talker.launch.xml"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]
domain_id = 22

[image.zephyr_listener_cyclonedds]
board = "zephyr"
launch = "listener.launch.xml"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]
domain_id = 22

# ThreadX on QEMU rv-virt (riscv64, NetX Duo, SLIRP). `locator` is the
# cell's `alloc::port_of`. They came from the `examples/rv-virt-threadx`
# leaves. Each QEMU has its own SLIRP network, so the board's default address
# serves both roles of a pair.

[image.riscv_threadx_talker]
board = "rv-virt-threadx"
launch = "talker.launch.xml"
locator = "tcp/10.0.2.2:9400"

[image.riscv_threadx_listener]
board = "rv-virt-threadx"
launch = "listener.launch.xml"
locator = "tcp/10.0.2.2:9400"

# NuttX on QEMU virt (armv7-a). `locator` is the cell's `alloc::port_of`
# on QEMU's SLIRP host. They came from the `examples/qemu-armv7a-nuttx` leaves.

[image.nuttx_talker]
board = "qemu-armv7a-nuttx"
launch = "talker.launch.xml"
panic = "platform"
locator = "tcp/10.0.2.2:8200"

[image.nuttx_listener]
board = "qemu-armv7a-nuttx"
launch = "listener.launch.xml"
panic = "platform"
locator = "tcp/10.0.2.2:8200"

[board_config."mps2-an385-freertos"]
netstack = "lwip"

[board_config."threadx-linux"]
netstack = "netxduo"

[board_config."rv-virt-threadx"]
netstack = "netxduo"

[board_config."qemu-armv7a-nuttx"]
