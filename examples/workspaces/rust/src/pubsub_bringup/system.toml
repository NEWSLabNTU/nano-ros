# phase-535 (RFC-0122 D1) — the pubsub pair as images: one image per
# (platform, role, rmw), ids `<platform>_<role>[_<rmw>]`. The test-side map
# from a matrix cell to these ids is `nros_tests::fixtures::workspace_image`.
# `locator` is the cell's `alloc::port_of` on QEMU's SLIRP host; the test
# `pair_image_rows_dial_their_allocator_port` holds it there.

[system]
name = "rust_pubsub"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "talker_pkg"
class = "talker_pkg::Talker"
name = "talker"

[[component]]
pkg = "listener_pkg"
class = "listener_pkg::Listener"
name = "listener"

[image_defaults]
rmw = "zenoh"

[image.freertos_talker]
board = "mps2-an385-freertos"
panic = "own"
launch = "talker.launch.xml"
locator = "tcp/10.0.2.2:7800"
os_config = ["board-net-15.toml"]

[image.freertos_listener]
board = "mps2-an385-freertos"
panic = "own"
launch = "listener.launch.xml"
locator = "tcp/10.0.2.2:7800"
os_config = ["board-net-16.toml"]

# Bare-metal MPS2-AN385 (no RTOS; phase-535 W5). `locator` is the cell's
# `alloc::port_of(QemuBaremetal, Rust, Pubsub)`. The two images share the
# FreeRTOS pair's network files: each QEMU has its own SLIRP network.

[image.baremetal_talker]
board = "mps2-an385-baremetal"
launch = "talker.launch.xml"
locator = "tcp/10.0.2.2:10200"
os_config = ["board-net-15.toml"]

[image.baremetal_listener]
board = "mps2-an385-baremetal"
launch = "listener.launch.xml"
locator = "tcp/10.0.2.2:10200"
os_config = ["board-net-16.toml"]

# Bare metal over UART0 (phase-535 W6, RFC-0122 D2): the `serial`
# configuration of the same two packages. The locator IS the link: a
# `serial/...` (zenoh) or `custom://uart` (XRCE) locator makes `nros configure`
# derive `ZPICO_NO_SMOLTCP=1` + `NROS_LINK_IP=0`, so the image carries no IP
# stack and no `os_config`. The router (or Agent) sits on the other end of a
# socat PTY pair, so these images dial no port.

[image.baremetal_talker_serial]
board = "mps2-an385-baremetal"
launch = "talker.launch.xml"
locator = "serial/UART_0#baudrate=115200"

[image.baremetal_listener_serial]
board = "mps2-an385-baremetal"
launch = "listener.launch.xml"
locator = "serial/UART_0#baudrate=115200"

# XRCE framed over UART0. The board installs the XRCE custom-transport vtable
# for `rmw = "xrce"` over the `custom` link the locator names (RFC-0109 D6,
# issue 1601). The knobs are the APP rung (RFC-0049): phase 207.6 shrank
# `xrce_session_state_t` from ~390 KB at the defaults to ~12 KB at these, so
# its calloc fits the board's heap. The other bare-metal images want the
# defaults, so they are not a board fact, and the XRCE pools take no part in
# the entity derivation (RFC-0098 D7 covers `ZPICO_*` only).
[image.baremetal_talker_xrce_serial]
board = "mps2-an385-baremetal"
launch = "talker.launch.xml"
rmw = "xrce"
locator = "custom://uart"

[image.baremetal_talker_xrce_serial.knobs.xrce]
# MTU matches the serial transport's; the default is 4096.
custom_transport_mtu = 512
buffer_size = 256
max_subscribers = 1
max_service_servers = 1
max_service_clients = 1

# Linux: one image per (role, rmw). The router locator is ephemeral
# (NROS_LOCATOR at run time), so none is baked here.

[image.linux_talker]
board = "linux"
launch = "talker.launch.xml"

[image.linux_talker_xrce]
board = "linux"
launch = "talker.launch.xml"
rmw = "xrce"

[image.linux_talker_cyclonedds]
board = "linux"
launch = "talker.launch.xml"
rmw = "cyclonedds"

[image.linux_listener]
board = "linux"
launch = "listener.launch.xml"

[image.linux_listener_xrce]
board = "linux"
launch = "listener.launch.xml"
rmw = "xrce"

[image.linux_listener_cyclonedds]
board = "linux"
launch = "listener.launch.xml"
rmw = "cyclonedds"

# ThreadX's Linux simulator (a hosted process, NSOS host sockets): it
# dials loopback directly. `locator` is the cell's `alloc::port_of`; the
# Cyclone images bake the leaf's `alloc::domain_of` domain.

[image.threadx_talker]
board = "threadx-linux"
launch = "talker.launch.xml"
locator = "tcp/127.0.0.1:9000"

[image.threadx_listener]
board = "threadx-linux"
launch = "listener.launch.xml"
locator = "tcp/127.0.0.1:9000"

# Zephyr native_sim: one image per (role, rmw). The router port, Agent port
# and DDS domain are the cell's `nros_tests::alloc` values (the
# `cell-isolation` table). The west lane passes the same values as
# `-DCONFIG_*` defines. The Kconfig fragments live in
# `boards/native_sim_native_64/`. They came from the `examples/zephyr/rust` leaves.

[image.zephyr_talker]
board = "zephyr"
launch = "talker.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

[image.zephyr_talker_xrce]
board = "zephyr"
launch = "talker.launch.xml"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
locator = "udp/127.0.0.1:2400"
domain_id = 31

[image.zephyr_talker_xrce.knobs.xrce]
max_service_servers = 0
max_service_clients = 0

[image.zephyr_listener]
board = "zephyr"
launch = "listener.launch.xml"
os_config = ["prj-zenoh.conf"]
locator = "tcp/127.0.0.1:7400"

[image.zephyr_listener_xrce]
board = "zephyr"
launch = "listener.launch.xml"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
locator = "udp/127.0.0.1:2400"
domain_id = 31

[image.zephyr_listener_xrce.knobs.xrce]
max_subscribers = 1
max_service_servers = 0
max_service_clients = 0

# Issue 2313 — the Rust Cyclone DDS images. They came from the
# `examples/zephyr/rust/<role>` leaves, which stayed leaves until a generated
# Rust Zephyr entry could run Cyclone (issues 2354/2313). `domain_id` is the
# cell's `alloc::domain_of` (Rust's port index is 0, so 22/25/28 beside C's
# 23/26/29 and C++'s 24/27/30); `prj-cyclonedds.conf` is the leaf's own.

[image.zephyr_talker_cyclonedds]
board = "zephyr"
launch = "talker.launch.xml"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]
domain_id = 22

[image.zephyr_listener_cyclonedds]
board = "zephyr"
launch = "listener.launch.xml"
rmw = "cyclonedds"
os_config = ["prj-cyclonedds.conf"]
domain_id = 22

# ThreadX on QEMU rv-virt (riscv64, NetX Duo, SLIRP). `locator` is the
# cell's `alloc::port_of`. They came from the `examples/rv-virt-threadx`
# leaves. Each QEMU has its own SLIRP network, so the board's default address
# serves both roles of a pair.

[image.riscv_threadx_talker]
board = "rv-virt-threadx"
launch = "talker.launch.xml"
locator = "tcp/10.0.2.2:9400"

[image.riscv_threadx_listener]
board = "rv-virt-threadx"
launch = "listener.launch.xml"
locator = "tcp/10.0.2.2:9400"

# NuttX on QEMU virt (armv7-a). `locator` is the cell's `alloc::port_of`
# on QEMU's SLIRP host. They came from the `examples/qemu-armv7a-nuttx` leaves.

[image.nuttx_talker]
board = "qemu-armv7a-nuttx"
launch = "talker.launch.xml"
panic = "platform"
locator = "tcp/10.0.2.2:8200"

[image.nuttx_listener]
board = "qemu-armv7a-nuttx"
launch = "listener.launch.xml"
panic = "platform"
locator = "tcp/10.0.2.2:8200"

[board_config."mps2-an385-freertos"]
netstack = "lwip"

[board_config."threadx-linux"]
netstack = "netxduo"

[board_config."rv-virt-threadx"]
netstack = "netxduo"

[board_config."qemu-armv7a-nuttx"]
