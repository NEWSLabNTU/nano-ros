# Issue 2846 - base config for the SNTP re-sync talker on mps2_an385. The network
# stack, the static SLIRP address and the main stack come from the board
# package's own prj.conf (nros-board-mps2-an385-zephyr), which `nros build` merges for this image;
# this file holds only what the application adds. Never `CONFIG_NROS_*` here
# (phase-481, RFC-0098 D10/D11).

CONFIG_RUST=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
