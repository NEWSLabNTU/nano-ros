# Issue 2846 -- the Zephyr-native settings the SNTP re-sync talker adds on
# mps2/an385, named by its image's `os_config`. The network stack and its
# buffers are the board package's
# (packages/boards/nros-board-mps2-an385-zephyr/prj.conf); stating them again
# here would override the board (check-kconfig-overridden-values). Every
# nano-ros knob is the image's, never `CONFIG_NROS_*` here.

CONFIG_POSIX_API=y
CONFIG_POSIX_THREAD_THREADS_MAX=16

# The image names its SNTP server by hostname (`ntp.nros.test`), so the
# re-sync thread runs Zephyr's DNS resolver: the deeper of the two paths its
# measured stack peak covers. The DNS server is the host, through QEMU's
# user-mode gateway; the measurement's responder answers 10.0.2.2.
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="10.0.2.2:15353"
