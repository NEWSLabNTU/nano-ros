[package]
name = "clock_board_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg -- a stub board's wall-clock hook (a fixed instant) and a node that prints the wall clock it yields."

# Node pkg shape: lib only. Platform and RMW come from the entry's board.
[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "clock_board_pkg::ClockBoard"
name = "clock_board"

[dependencies]
nros = { version = "*", default-features = false, features = [
    "alloc",
    "rmw-cffi", "macros"] }
log = { version = "0.4", default-features = false }
