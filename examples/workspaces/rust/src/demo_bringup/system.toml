# Bringup pkg system descriptor — declarative topology + per-target
# deploy config. No Cargo.toml / CMakeLists.txt / src/ lives here.
#
# `default_launch` is the launch file `nros::main!(launch = "demo_bringup")`
# (or `nros plan demo_bringup` with no explicit file) picks by default.

[system]
name = "demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "talker_pkg"
class = "talker_pkg::Talker"
name = "talker"

[[component]]
pkg = "listener_pkg"
class = "listener_pkg::Listener"
name = "listener"

# phase-263 A1 — service round-trip components. Listed in the catalog; only the
# `showcase.launch.xml` runs them (the default `system.launch.xml` stays
# talker+listener). `add_client` calls `add_server` on /add_two_ints each tick
# and republishes the sum on /sum.
[[component]]
pkg = "service_server_pkg"
class = "service_server_pkg::AddServer"
name = "add_server"

[[component]]
pkg = "service_client_pkg"
class = "service_client_pkg::AddClient"
name = "add_client"

# phase-263 A4 — action round-trip components. Like the service pair, only the
# `showcase.launch.xml` runs them. `fibonacci_client` sends one goal to
# `fibonacci_server` on /fibonacci and republishes the final number on
# /fib_result.
[[component]]
pkg = "action_server_pkg"
class = "action_server_pkg::FibonacciServer"
name = "fibonacci_server"

[[component]]
pkg = "action_client_pkg"
class = "action_client_pkg::FibonacciClient"
name = "fibonacci_client"

[deploy.native]
kind = "self"

# phase-326 (issue 0364) — per-host deploy targets for the multi-host launch
# (`launch/multihost.launch.xml`: talker on robot1, listener on robot2, chosen
# at RESOLVE time by the `host` launch argument). Each per-host model
# (`config/multihost_robot<N>_model.yaml`, resolved with `host:=robot<N>`)
# contains only that host's nodes; the explicit `nodes = [..]` below places
# them — with `machine=` gone there is no launch-derived placement fact, so
# every node needs a list entry (pre-0291 behaviour, restored).
# (RFC-0004 §4 home; NOT a root nros.toml — see issue #51.)
# phase-315 — the embedded BOARD BUILDS of this system.
#
# These are not placements. `kind = "self"` blocks (native/robot1/robot2) are
# machines and PARTITION the nodes between them; a `kind = "embedded"` block is
# the whole system compiled for another board, running every node. The resolver
# excludes embedded blocks from placement for exactly this reason.
#
# They were missing while the workspace carried entries declaring them, and
# nothing noticed: the pre-0.1.0 SystemModel had no `execution:` section at all,
# so `nros::main!` placed every node on whatever board asked.
#
# Board ids come from the ws-realtime-c / ws-realtime-c-mps2 bringups and each
# entry's fixtures.toml row.
[deploy.zephyr]
kind = "embedded"
board = "native_sim/native/64"

[deploy.freertos]
kind = "embedded"
board = "mps2-an385-freertos"

[deploy.nuttx]
kind = "embedded"
board = "nuttx-qemu-arm"

[deploy.threadx-linux]
kind = "embedded"
board = "threadx-linux"

[deploy.esp32-qemu]
kind = "embedded"
board = "esp32-qemu"

[deploy.robot1]
kind = "self"
target = "x86_64-unknown-linux-gnu"
launch = "multihost.launch.xml"
nodes = ["/talker"]

[deploy.robot2]
kind = "self"
target = "x86_64-unknown-linux-gnu"
launch = "multihost.launch.xml"
nodes = ["/listener"]

# phase-330 W4.0 (RFC-0063) — binding variants declared as INPUTS.
# These resolves take launch ARGUMENTS, which nothing in the launch tree
# records; until now the only machine-readable trace was the committed
# model's own `meta.args` — the artifact W4 deletes. Declaring them here
# lets the variant set survive that deletion.

[[model]]
launch = "multihost.launch.xml"
out    = "multihost_robot1_model.yaml"
args   = { host = "robot1" }

[[model]]
launch = "multihost.launch.xml"
out    = "multihost_robot2_model.yaml"
args   = { host = "robot2" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.freertos.nros]
netstack = "lwip"
sdk = { freertos = "{env:FREERTOS_DIR}", lwip = "{env:LWIP_DIR}" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.nuttx.nros]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.threadx-linux.nros]
netstack = "netxduo"
sdk = { threadx = "{env:THREADX_DIR}", netxduo = "{env:NETX_DIR}" }

# --- phase-383 W9 (RFC-0065 D6) — images are the buildable unit.
# Derived from the entry packages that existed at migration time; each
# entry's `deploy` token picked its board, and its `launch` its topology.
# `panic` and `args` carry over from the entry package each image was derived
# from. Neither is cosmetic: `panic` (RFC-0077) decides the generated crate
# root and the `nros::main!` invocation, and `args` is how an image selects a
# MACHINE — a multihost image with no bindings resolves the whole system
# instead of one host. An image missing either generates a DIFFERENT program
# than the entry it replaces, and one that still compiles. phase-383 W9.a
# declared the images without them.
[image_defaults]
rmw = "zenoh"

[image.esp32]
board = "esp32-qemu"
panic = "own"

[image.freertos]
board = "mps2-an385-freertos"
panic = "own"

[image.native]
board = "native"
launch = "system.launch.xml"

# Issue 0831 — the RMW axis over this workspace. Each declares its backend and
# gets it: the selection facade reads `[image.<id>].rmw` (falling back to
# `[system] rmw`), so `build/posix-cyclonedds/` now holds a cyclonedds binary.
# Before the fix these two coordinates were fixture rows claiming an RMW against
# an image that declared none, and tier 2 ran zenoh for both.
[image.native_cyclonedds]
board = "native"
launch = "system.launch.xml"
rmw = "cyclonedds"

[image.native_xrce]
board = "native"
launch = "system.launch.xml"
rmw = "xrce"

[image.native_action_client]
board = "native"
launch = "action_client.launch.xml"

[image.native_action_server]
board = "native"
launch = "action_server.launch.xml"

[image.native_robot1]
board = "native"
launch = "multihost.launch.xml"
args = { host = "robot1" }

[image.native_robot2]
board = "native"
launch = "multihost.launch.xml"
args = { host = "robot2" }

[image.native_service_client]
board = "native"
launch = "service_client.launch.xml"

[image.native_service_inprocess]
board = "native"
launch = "service_inprocess.launch.xml"

[image.native_service_server]
board = "native"
launch = "service_server.launch.xml"

[image.native_showcase]
board = "native"
launch = "showcase.launch.xml"

[image.nuttx]
board = "nuttx-qemu-arm"
panic = "platform"

[image.threadx]
board = "threadx-linux"

[image.zephyr]
board = "native_sim/native/64"
entry = "zephyr_entry"
conf = ["prj-zenoh.conf"]

[image.zephyr_robot1]
board = "native_sim/native/64"
entry = "zephyr_entry_robot1"
conf = ["prj-zenoh.conf"]
launch = "multihost.launch.xml"
args = { host = "robot1" }
