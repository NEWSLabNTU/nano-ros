# Bringup pkg system descriptor — declarative topology + per-target
# deploy config. No Cargo.toml / CMakeLists.txt / src/ lives here.
#
# `default_launch` is the launch file `nros::main!(launch = "demo_bringup")`
# (or `nros plan demo_bringup` with no explicit file) picks by default.

[system]
name = "demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "talker_pkg"
class = "talker_pkg::Talker"
name = "talker"

[[component]]
pkg = "listener_pkg"
class = "listener_pkg::Listener"
name = "listener"

# phase-263 A1 — service round-trip components. Listed in the catalog; only the
# `showcase.launch.xml` runs them (the default `system.launch.xml` stays
# talker+listener). `add_client` calls `add_server` on /add_two_ints each tick
# and republishes the sum on /sum.
[[component]]
pkg = "service_server_pkg"
class = "service_server_pkg::AddServer"
name = "add_server"

[[component]]
pkg = "service_client_pkg"
class = "service_client_pkg::AddClient"
name = "add_client"

# phase-263 A4 — action round-trip components. Like the service pair, only the
# `showcase.launch.xml` runs them. `fibonacci_client` sends one goal to
# `fibonacci_server` on /fibonacci and republishes the final number on
# /fib_result.
[[component]]
pkg = "action_server_pkg"
class = "action_server_pkg::FibonacciServer"
name = "fibonacci_server"

[[component]]
pkg = "action_client_pkg"
class = "action_client_pkg::FibonacciClient"
name = "fibonacci_client"


# Issue 0951 — the implicit machine this system runs on. A host says WHERE a
# node runs; what it is built as comes from `[image.*]`. Unscoped and with no
# `nodes`, so it governs every launch file and every node — which is what the
# `kind = "self"` deploy block it replaces already meant.
[host.native]
[host.robot1]
launch = "multihost.launch.xml"
nodes = ["/talker"]

[host.robot2]
launch = "multihost.launch.xml"
nodes = ["/listener"]

# phase-330 W4.0 (RFC-0063) — binding variants declared as INPUTS.
# These resolves take launch ARGUMENTS, which nothing in the launch tree
# records; until now the only machine-readable trace was the committed
# model's own `meta.args` — the artifact W4 deletes. Declaring them here
# lets the variant set survive that deletion.

[[model]]
launch = "multihost.launch.xml"
out    = "multihost_robot1_model.yaml"
args   = { host = "robot1" }

[[model]]
launch = "multihost.launch.xml"
out    = "multihost_robot2_model.yaml"
args   = { host = "robot2" }
# --- phase-383 W9 (RFC-0065 D6) — images are the buildable unit.
# Derived from the entry packages that existed at migration time; each
# entry's `deploy` token picked its board, and its `launch` its topology.
# `panic` and `args` carry over from the entry package each image was derived
# from. Neither is cosmetic: `panic` (RFC-0077) decides the generated crate
# root and the `nros::main!` invocation, and `args` is how an image selects a
# MACHINE — a multihost image with no bindings resolves the whole system
# instead of one host. An image missing either generates a DIFFERENT program
# than the entry it replaces, and one that still compiles. phase-383 W9.a
# declared the images without them.
[image_defaults]
rmw = "zenoh"

[image.esp32]
board = "esp32-c3-baremetal"
panic = "own"
# phase-445 W5 — the allocator's (esp32, rust, EntryPubsub) slot, dialed
# through the QEMU slirp gateway. It was the hand-written entry's
# `[package.metadata.nros.deploy.esp32-c3-baremetal] locator`; the entry is
# generated now (`build/<coord>/esp32_entry/`), so the image states it.
# `esp32_emulator.rs`'s `ESP32_WS_ENTRY_PORT` must agree.
locator = "tcp/10.0.2.2:9830"

[image.freertos]
board = "mps2-an385-freertos"
panic = "own"
# issue 1581 — a Rust image on this board bakes its locator ONLY from here (the
# board reads no `NROS_LOCATOR`), so an image that states none dials the board
# default `tcp/192.0.3.1:7447`. Lost when phase-383 W9 deleted `freertos_entry`
# and its `[package.metadata.nros.deploy.freertos]` table. Port 7830 =
# `port_of(FreertosMps2, Rust, EntryPubsub)`; host 192.0.3.1 is the board's own
# gateway, as on the C/C++ siblings' rows. Gate: `check-image-locator-bake`.
locator = "tcp/192.0.3.1:7830"

[image.native]
board = "native"
launch = "system.launch.xml"

# Issue 0831 — the RMW axis over this workspace. Each declares its backend and
# gets it: the selection facade reads `[image.<id>].rmw` (falling back to
# `[system] rmw`), so `build/posix-cyclonedds/` now holds a cyclonedds binary.
# Before the fix these two coordinates were fixture rows claiming an RMW against
# an image that declared none, and tier 2 ran zenoh for both.
[image.native_cyclonedds]
board = "native"
launch = "system.launch.xml"
rmw = "cyclonedds"

[image.native_xrce]
board = "native"
launch = "system.launch.xml"
rmw = "xrce"

[image.native_action_client]
board = "native"
launch = "action_client.launch.xml"

[image.native_action_server]
board = "native"
launch = "action_server.launch.xml"

[image.native_robot1]
board = "native"
launch = "multihost.launch.xml"
args = { host = "robot1" }

[image.native_robot2]
board = "native"
launch = "multihost.launch.xml"
args = { host = "robot2" }

[image.native_service_client]
board = "native"
launch = "service_client.launch.xml"

[image.native_service_inprocess]
board = "native"
launch = "service_inprocess.launch.xml"

[image.native_service_server]
board = "native"
launch = "service_server.launch.xml"

[image.native_showcase]
board = "native"
launch = "showcase.launch.xml"

[image.nuttx]
board = "qemu-armv7a-nuttx"
panic = "platform"

[image.threadx]
board = "threadx-linux"
# issue 1581 — the threadx-linux board reads no `NROS_LOCATOR`, so this is the
# only carrier; without it the image dials the board default
# `tcp/192.0.3.1:7447`. Lost with phase-383 W9's `threadx_entry`. Port 9030 =
# `port_of(ThreadxLinux, Rust, EntryPubsub)` (host sim, loopback).
locator = "tcp/127.0.0.1:9030"

# phase-470 W5.a (issue 1288) — MIGRATED. `src/zephyr_entry` is gone; `nros
# build zephyr` generates the whole west application (`CMakeLists.txt`,
# `build.rs`, the staticlib manifest and `src/lib.rs`) under
# `build/zephyr-zenoh/zephyr_entry/`. This row is now the only place the image
# is described, which is why it names no `entry`: the application is found by
# CONSTRUCTION — the builder emits it, so it knows where it is — and the
# `DEPLOY`-token scan that used to need `entry =` is not consulted.
#
# Its Kconfig moved WITH it, to `<bringup>/boards/native_sim_native_64/`
# (RFC-0065 D4). That directory is `-DAPPLICATION_CONFIG_DIR`, so Zephyr takes
# `prj.conf` and `boards/native_sim_native_64.conf` from there by its own
# discovery, and `conf` below adds the RMW fragment through EXTRA_CONF_FILE.
# `prj-xrce.conf` / `prj-cyclonedds.conf` moved too and are inert until an
# image names one — a fragment is only applied when `conf` lists it.
[image.zephyr]
board = "zephyr"
conf = ["prj-zenoh.conf"]
locator = "tcp/10.0.2.2:7430"

# NOT migrated (W5.b). It keeps its hand-written application, and `entry =` is
# what points west at it — deliberately still exercised beside the generated
# one above, because `entry` names a package whose name is NOT `<id>_entry` and
# that is the case the locate path has to keep answering.
[image.zephyr_robot1]
board = "zephyr"
entry = "zephyr_entry_robot1"
conf = ["prj-zenoh.conf"]
launch = "multihost.launch.xml"
args = { host = "robot1" }
locator = "tcp/10.0.2.2:7469"

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."mps2-an385-freertos"]
netstack = "lwip"
sdk = { freertos = "{env:FREERTOS_DIR}", lwip = "{env:LWIP_DIR}" }

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."qemu-armv7a-nuttx"]
sdk = { nuttx = "{env:NUTTX_DIR}", nuttx_apps = "{env:NUTTX_APPS_DIR}" }

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951).
[board_config."threadx-linux"]
netstack = "netxduo"
sdk = { threadx = "{env:THREADX_DIR}", netxduo = "{env:NETX_DIR}" }
