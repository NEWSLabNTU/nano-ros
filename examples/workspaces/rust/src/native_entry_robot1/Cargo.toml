[package]
name = "native_entry_robot1"
version = "0.1.0"
edition = "2024"
publish = false
description = "Phase 211.F — per-host entry for `robot1` (the multi-host demo)."

[[bin]]
name = "native_entry_robot1"
path = "src/main.rs"

# Per-host Entry pkg (phase-326 / issue 0364). The partition happens at
# RESOLVE time: `multihost_robot1_model.yaml` (resolved with `host:=robot1`)
# contains only the talker, so the macro emits `talker_pkg::register` only.
# Sibling `native_entry_robot2` consumes the robot2 model (the listener).
# Running both as two processes is the multi-host runtime topology.
[package.metadata.nros.entry]
deploy = "native"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
native_entry_robot1_nros_selection = { path = "../../generated/nros-selection/native_entry_robot1" }
# Phase 248 C6a (#60 T5) — agnostic `nros`; the board brings RMW+platform.
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-board-linux = { path = "../../../../../packages/boards/nros-board-linux" }
# robot1 hosts only the talker, so the macro emits `talker_pkg::register`.
talker_pkg = { path = "../talker_pkg", default-features = false }
