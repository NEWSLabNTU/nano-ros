[package]
name = "threadx_entry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Entry pkg — boots the demo topology on ThreadX Linux."

[[bin]]
name = "threadx_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "threadx-linux"

[package.metadata.nros.deploy.threadx-linux]
rmw = "zenoh"
domain_id = 0
locator = "tcp/127.0.0.1:9030"

[dependencies]
# phase-315 W1/W2 — selection facade. GENERATED by `nros sync` from the
# bringup's `system.toml`; carries the ROS edition, the RMW and the
# capability features, which cargo unifies onto the `nros` / board deps
# below. This entry names none of them: the declaration is the SSoT, and
# an edition restated here would fail on the WIRE, not at build time.
threadx_entry_nros_selection = { path = "../../generated/nros-selection/threadx_entry" }
# Phase 248 C6a (#60 T5) — agnostic `nros`. The board brings
# `platform-threadx`. The concrete RMW (zenoh) is linked through the ThreadX
# NetX-Duo C port (CMake), so — unlike the other boards — there is no board
# `rmw-*` feature to set here.
# phase-359 W10 — was `["std", …]`. ThreadX is a no_std board that merely RUNS
# as a Linux process; nothing in this entry calls `ExecutorConfig::from_env`,
# so no `env` either.
nros = { path = "../../../../../packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
nros-board-threadx-linux = { path = "../../../../../packages/boards/nros-board-threadx-linux" }
# Concrete platform impl — also pulled by the board; kept explicit for the link
# map. NOT the agnostic-forbidden `nros/platform-*`.
nros-platform = { path = "../../../../../packages/platform/nros-platform", default-features = false, features = ["platform-threadx"] }
talker_pkg = { path = "../talker_pkg", default-features = false }
listener_pkg = { path = "../listener_pkg", default-features = false }
