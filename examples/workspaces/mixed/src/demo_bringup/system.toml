[system]
name = "mixed_demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "c_talker_pkg"
class = "c_talker_pkg::Talker"
name = "talker"

[[component]]
pkg = "cpp_listener_pkg"
class = "cpp_listener_pkg::Listener"
name = "listener"

# phase-263 A1 (services, MIXED) — cross-language AddTwoInts: a C server + a C++ client (#203; catalog
# only; run as the two native_service_{server,client}_entry processes — issue 0096).
[[component]]
pkg = "c_add_server_pkg"
class = "c_add_server_pkg::AddServer"
name = "add_server"

[[component]]
pkg = "cpp_add_client_pkg"
class = "cpp_add_client_pkg::AddClient"
name = "add_client"

# phase-263 A4 (actions, MIXED) — Fibonacci action: a C server + a C client (catalog only; run
# as the two native_action_{server,client}_entry processes — issue 0096).
[[component]]
pkg = "c_fib_server_pkg"
class = "c_fib_server_pkg::FibServer"
name = "fib_server"

[[component]]
pkg = "c_fib_client_pkg"
class = "c_fib_client_pkg::FibClient"
name = "fib_client"

[deploy.native]
kind = "self"
target = "x86_64-unknown-linux-gnu"

# Embedded deploy targets for this workspace's embedded Entry packages (issue
# 0356). No `launch` key → the default `system.launch.xml` nodes deploy to each
# board (the same demo, cross-compiled). The resolver places multi-board nodes
# board-agnostically; `nros codegen entry --board <b>` selects the concrete board.

[deploy.freertos]
kind = "embedded"
board = "mps2-an385-freertos"

[deploy.threadx-linux]
kind = "embedded"
board = "threadx-linux"

# phase-326 (issue 0364) — per-host deploy targets for the multi-host launch
# (`launch/multihost.launch.xml`: C talker + Rust heartbeat on robot1, C++ listener on robot2, chosen at RESOLVE time by the `host`
# launch argument). Each per-host model (`config/multihost_robot<N>_model.yaml`,
# resolved with `host:=robot<N>`) contains only that host's nodes;
# `native_entry_robot{1,2}` consume those models via `nano_ros_entry(MODEL …)`.
# The explicit `nodes = [..]` below places them — with `machine=` gone there is
# no launch-derived placement fact, so every node needs a list entry.
[deploy.robot1]
kind = "self"
target = "x86_64-unknown-linux-gnu"
launch = "multihost.launch.xml"
nodes = ["/talker", "/heartbeat"]

[deploy.robot2]
kind = "self"
target = "x86_64-unknown-linux-gnu"
launch = "multihost.launch.xml"
nodes = ["/listener"]

# phase-315 — the embedded BOARD BUILDS of this system.
#
# Not placements: `kind = "self"` blocks are machines and PARTITION the nodes;
# a `kind = "embedded"` block is the whole system compiled for another board,
# running every node. The resolver excludes embedded blocks from placement.
#
# Missing while entries named them, which was invisible until the SystemModel
# started carrying real `execution.deploy` — then those entries failed with
# "places no nodes on board <x>". Ids are the DEPLOY values the entries pass.

[deploy.mps2-an385-freertos]
kind = "embedded"
board = "mps2-an385-freertos"

[deploy.zephyr]
kind = "embedded"
board = "native_sim/native/64"
