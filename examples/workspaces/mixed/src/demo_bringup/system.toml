[system]
name = "mixed_demo"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "c_talker_pkg"
class = "c_talker_pkg::Talker"
name = "talker"

[[component]]
pkg = "cpp_listener_pkg"
class = "cpp_listener_pkg::Listener"
name = "listener"

# phase-263 A1 (services, MIXED) — cross-language AddTwoInts: a C server + a C++ client (#203; catalog
# only; run as the two native_service_{server,client}_entry processes — issue 0096).
[[component]]
pkg = "c_add_server_pkg"
class = "c_add_server_pkg::AddServer"
name = "add_server"

[[component]]
pkg = "cpp_add_client_pkg"
class = "cpp_add_client_pkg::AddClient"
name = "add_client"

# phase-263 A4 (actions, MIXED) — Fibonacci action: a C server + a C client (catalog only; run
# as the two native_action_{server,client}_entry processes — issue 0096).
[[component]]
pkg = "c_fib_server_pkg"
class = "c_fib_server_pkg::FibServer"
name = "fib_server"

[[component]]
pkg = "c_fib_client_pkg"
class = "c_fib_client_pkg::FibClient"
name = "fib_client"

[deploy.native]
kind = "self"

# Embedded deploy targets for this workspace's embedded Entry packages (issue
# 0356). No `launch` key → the default `system.launch.xml` nodes deploy to each
# board (the same demo, cross-compiled). The resolver places multi-board nodes
# board-agnostically; `nros codegen entry --board <b>` selects the concrete board.

[deploy.freertos]
kind = "embedded"
board = "mps2-an385-freertos"

[deploy.threadx-linux]
kind = "embedded"
board = "threadx-linux"

# phase-326 (issue 0364) — per-host deploy targets for the multi-host launch
# (`launch/multihost.launch.xml`: C talker + Rust heartbeat on robot1, C++ listener on robot2, chosen at RESOLVE time by the `host`
# launch argument). Each per-host model (`config/multihost_robot<N>_model.yaml`,
# resolved with `host:=robot<N>`) contains only that host's nodes;
# `native_entry_robot{1,2}` consume those models via `nano_ros_entry(MODEL …)`.
# The explicit `nodes = [..]` below places them — with `machine=` gone there is
# no launch-derived placement fact, so every node needs a list entry.
[deploy.robot1]
kind = "self"
target = "x86_64-unknown-linux-gnu"
launch = "multihost.launch.xml"
nodes = ["/talker", "/heartbeat"]

[deploy.robot2]
kind = "self"
target = "x86_64-unknown-linux-gnu"
launch = "multihost.launch.xml"
nodes = ["/listener"]

# phase-315 — the embedded BOARD BUILDS of this system.
#
# Not placements: `kind = "self"` blocks are machines and PARTITION the nodes;
# a `kind = "embedded"` block is the whole system compiled for another board,
# running every node. The resolver excludes embedded blocks from placement.
#
# Missing while entries named them, which was invisible until the SystemModel
# started carrying real `execution.deploy` — then those entries failed with
# "places no nodes on board <x>". Ids are the DEPLOY values the entries pass.

[deploy.mps2-an385-freertos]
kind = "embedded"
board = "mps2-an385-freertos"

[deploy.zephyr]
kind = "embedded"
board = "native_sim/native/64"

# phase-330 W4.0 (RFC-0063) — binding variants declared as INPUTS.
# These resolves take launch ARGUMENTS, which nothing in the launch tree
# records; until now the only machine-readable trace was the committed
# model's own `meta.args` — the artifact W4 deletes. Declaring them here
# lets the variant set survive that deletion.

[[model]]
launch = "multihost.launch.xml"
out    = "multihost_robot1_model.yaml"
args   = { host = "robot1" }

[[model]]
launch = "multihost.launch.xml"
out    = "multihost_robot2_model.yaml"
args   = { host = "robot2" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.freertos.nros]
netstack = "lwip"
sdk = { freertos = "{env:FREERTOS_DIR}", lwip = "{env:LWIP_DIR}" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.threadx-linux.nros]
netstack = "netxduo"
sdk = { threadx = "{env:THREADX_DIR}", netxduo = "{env:NETX_DIR}" }

# phase-351 W2 — SITE config for this deploy (RFC-0072 §5): where THIS
# checkout's SDKs live and which stack it uses. Generated from
# `just/sdk-env.just`; `scripts/check-site-config.py` keeps them in step.
# `{env:…}` rather than a literal so the value survives a second checkout.
[deploy.mps2-an385-freertos.nros]
netstack = "lwip"
sdk = { freertos = "{env:FREERTOS_DIR}", lwip = "{env:LWIP_DIR}" }

# --- phase-383 W9 (RFC-0065 D6) — images are the buildable unit.
# Derived from the entry packages that existed at migration time; each
# entry's `deploy` token picked its board, and its `launch` its topology.
[image_defaults]
rmw = "zenoh"

[image.freertos]
board = "mps2-an385-freertos"

[image.native]
board = "native"

# The multihost pair: these differ ONLY in `LAUNCH_ARGS host=`, so an image
# without `args` resolves the whole system instead of one host and the two
# become the same program. The gap W9.a left in every workspace it touched.
[image.native_robot1]
board = "native"
launch = "multihost.launch.xml"
args = { host = "robot1" }

[image.native_robot2]
board = "native"
launch = "multihost.launch.xml"
args = { host = "robot2" }

[image.native_action_client]
board = "native"
launch = "action_client.launch.xml"

[image.native_action_server]
board = "native"
launch = "action_server.launch.xml"

[image.native_service_client]
board = "native"
launch = "service_client.launch.xml"

[image.native_service_server]
board = "native"
launch = "service_server.launch.xml"

[image.threadx]
board = "threadx-linux"

[image.zephyr]
board = "native_sim/native/64"
conf = ["prj-zenoh.conf"]
