    sha256: 07806eef107da22d4b3c1b680cafb91a57466befaeb4f534e88fa73559154388
  - path: system.toml
    sha256: fe0419ce31737ffd472b5203f1d05bb93ccb7bc819d838fb346d195c7c5f35be
  resolver:
    tool: ros-launch-resolve
    version: 0.1.0
  diagnostics:
