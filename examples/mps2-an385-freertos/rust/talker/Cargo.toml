[package]
name = "freertos_rs_talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "FreeRTOS QEMU MPS2-AN385 talker — Phase 212.L Component pkg"

# phase-338 W2 — collapsed from the retired `-entry` package: this ONE
# package carries both the node logic (src/lib.rs) and the entry
# (src/main.rs's `nros::main!()`), the shape native already had.
[[bin]]
name = "talker"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

# Phase 248 C6f (#60 T5) — the node is platform/RMW-AGNOSTIC: `nros` names no
# `rmw-*` or `platform-*` feature. The platform and the concrete RMW backend
# come from the image's board crate (`nros-board-mps2-an385-freertos` with
# `rmw-zenoh` self-links and registers the zenoh-pico C backend and brings
# `nros-platform/platform-freertos`), which the generated selection package
# below names. This crate carries only the functional `nros` features (alloc +
# the rmw-cffi vtable seam + ROS edition).

[dependencies]
# The image's board crate, RMW backend, runtime and panic handler —
# GENERATED by `nros sync` / `nros build` from `system.toml` and the board
# descriptor (RFC-0098 D6, issue 1305). `nros::main!` reaches the board
# through it.
freertos_rs_talker_nros_selection = { path = "build/nros/selection" }
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
std_msgs = { path = "generated/std_msgs", default-features = false }
# phase-277 W4 — chatter log lines (`Publishing:` / `I heard:`) route through
# the `log` facade; the platform entry runtime owns the sink.
log = "0.4"

# The board, RMW, network identity and node declaration live in `system.toml`
# beside this manifest (RFC-0098 D3/D5).
# Nothing here names a board: every image-only dependency (board crate, RMW
# backend, platform, runtime, panic handler) comes from the generated
# selection package (RFC-0098 D6, issue 1305), so switching `[image.*] board`
# is the only edit a board switch needs.

[package.metadata.ament]
build_depend = ["std_msgs"]
exec_depend = ["std_msgs"]

[profile.dev]
# Phase 214.S.5.b — `panic = "abort"` is required for the no_std
# rlib crate-type (pure-cargo Entry-pkg path; #45). The Entry pkg inherits this on the
# firmware build; the standalone host `cargo check` also needs it for
# its host-only panic-handler shim (see src/lib.rs::host_shim).
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Phase 208.F1 — empty `[workspace]` table keeps this example standalone
# (copy-out template promise + outer-workspace adoption guard).
[workspace]
