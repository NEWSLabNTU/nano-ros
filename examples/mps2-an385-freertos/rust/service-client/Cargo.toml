[package]
name = "freertos_rs_service_client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "FreeRTOS QEMU MPS2-AN385 AddTwoInts service client — Component pkg"

# phase-338 W2 — collapsed from the retired `-entry` package: this ONE
# package carries both the node logic (src/lib.rs) and the entry
# (src/main.rs's `nros::main!()`), the shape native already had.
[[bin]]
name = "service-client"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

# Phase 248 C6f (#60 T5) — Node pkg is platform/RMW-AGNOSTIC. The old
# `rmw-zenoh`/`rmw-xrce`/`rmw-cyclonedds` parity rows (which forwarded
# `nros/rmw-*`) are gone, as is `nros/platform-freertos`: platform + the
# concrete RMW backend now flow from the BOARD crate the sibling firmware Entry
# pkg deps (`nros-board-mps2-an385-freertos` built with `rmw-zenoh`
# self-links+registers the zenoh-pico C backend AND brings
# `nros-platform/platform-freertos`). This lib carries only the functional
# `nros` features below (alloc + the rmw-cffi vtable seam + ROS edition).

[dependencies]
# phase-338 W2 — carried over from the collapsed `-entry` package.
# Phase 212.N.3 tier-1 per-board shim. `Mps2An385::run` provides the
# `BoardEntry` lifecycle the Entry pkg's `main.rs` invokes.
# Phase 248 C6f (#60 T5) — the BOARD is the RMW+platform selection point:
# `features = ["rmw-zenoh"]` links+registers the zenoh-pico C backend (via
# `nros-board-freertos`'s `nros-rmw-zenoh` dep + boot-path `register()`) AND
# brings `nros-platform/platform-freertos`. The sibling node pkg + this Entry's
# `nros` dep name neither `rmw-*` nor `platform-*`.
nros-board-mps2-an385-freertos = { version = "*", features = ["rmw-zenoh"] }
# phase-338 W2 — carried from the collapsed `-entry` package. The board
# brings the FreeRTOS port; without this the image boots but the app never
# reaches "Application setup complete".
nros-platform = { version = "*", default-features = false, features = ["platform-freertos"] }
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
# Demo-parity log lines route through the `log` facade; the platform
# entry runtime owns the sink.
log = "0.4"

[package.metadata.nros.entry]
deploy = "freertos"

[package.metadata.nros.node]
class = "freertos_rs_service_client::AddTwoIntsClient"
name = "service_client"
default_namespace = "/"

[package.metadata.nros.deploy.freertos]
rmw = "zenoh"
domain_id = 0
# phase-338 W2 — the ENTRY's locator, not the node's. The role
# ports are what the e2e harness binds zenohd to; the node block's
# generic 7447 was never the deployed value.
locator = "tcp/10.0.2.2:7810"
ip = "10.0.2.16"
gateway = "10.0.2.2"

[package.metadata.ament]
build_depend = ["example_interfaces"]
exec_depend = ["example_interfaces"]

[profile.dev]
# Phase 214.S.5.b — `panic = "abort"` is required for the no_std
# rlib crate-type (pure-cargo Entry-pkg path; #45). The Entry pkg inherits this on the
# firmware build; the standalone host `cargo check` also needs it for
# its host-only panic-handler shim (see src/lib.rs::host_shim).
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
