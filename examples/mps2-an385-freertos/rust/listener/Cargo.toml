[package]
name = "freertos_rs_listener"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "FreeRTOS QEMU MPS2-AN385 listener — Phase 212.L Component pkg"

# phase-338 W2 — collapsed from the retired `-entry` package: this ONE
# package carries both the node logic (src/lib.rs) and the entry
# (src/main.rs's `nros::main!()`), the shape native already had.
[[bin]]
name = "listener"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

# Phase 248 C6f (#60 T5) — Node pkg is platform/RMW-AGNOSTIC. The old
# `rmw-zenoh`/`rmw-xrce`/`rmw-cyclonedds` parity rows (which forwarded
# `nros/rmw-*`) are gone, as is `nros/platform-freertos`: platform + the
# concrete RMW backend now flow from the BOARD crate the sibling firmware Entry
# pkg deps (`nros-board-mps2-an385-freertos` built with `rmw-zenoh`
# self-links+registers the zenoh-pico C backend AND brings
# `nros-platform/platform-freertos`). This lib carries only the functional
# `nros` features below (alloc + the rmw-cffi vtable seam + ROS edition).

[dependencies]
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
std_msgs = { path = "generated/std_msgs", default-features = false }
# phase-277 W4 — chatter log lines (`Publishing:` / `I heard:`) route through
# the `log` facade; the platform entry runtime owns the sink.
log = "0.4"

# Everything only the IMAGE needs is one generated dependency, the same for
# every board (RFC-0098 D6, issue 1305): the selection package `nros sync`
# writes per image under `build/<image>/nros-selection/`. It carries the board
# crate with the features the image's `system.toml` implies (RMW, transport,
# entry shape), the platform and runtime crates, and the board's crate-root
# items; `nros::main!` reaches the board through it. The generated settings
# file's `[patch]` row points this name at the image's copy.
#
# Target-scoped, so the node in `lib.rs` still builds for the host: the
# metadata probe compiles it there to learn what it creates (issue 1265),
# and the image's crates do not build for the host.
[target.'cfg(target_os = "none")'.dependencies]
freertos_rs_listener_nros_selection = { version = "0.0.0" }

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5), and nothing here names the board: switching board is
# editing `[image.*] board` there and re-running `nros sync`.

[package.metadata.ament]
build_depend = ["std_msgs"]
exec_depend = ["std_msgs"]

[profile.dev]
# Phase 214.S.5.b — `panic = "abort"` is required for the no_std
# rlib crate-type (pure-cargo Entry-pkg path; #45). The Entry pkg inherits this on the
# firmware build; the standalone host `cargo check` also needs it for
# its host-only panic-handler shim (see src/lib.rs::host_shim).
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
