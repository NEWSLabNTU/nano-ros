# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses. Switching board is editing `[image.*] board`
# and re-running `nros sync`.


[system]
name = "freertos_rs_action_server"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "freertos_rs_action_server"
class = "freertos_rs_action_server::FibonacciServer"
name = "action_server"

# FreeRTOS on MPS2-AN385 (QEMU).
[image.mps2-an385-freertos]
board = "freertos"
# `main.rs` says `nros::main!(panic = "platform")`; stated here too so
# the generated selection package does not also link the board's
# crate-root panic provider (RFC-0077, issue 1305).
panic = "platform"
locator = "tcp/10.0.2.2:7820"
net = { eth0 = { network = "qemu", host = 15 } }

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951). Generated
# from `just/sdk-env.just`; this gate keeps the two in step. `{env:…}`
# rather than a literal so the value survives a second checkout.
[board_config."mps2-an385-freertos"]
netstack = "lwip"
