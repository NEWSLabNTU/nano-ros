# What this example deploys to (RFC-0098 D3/D5): its board, RMW, domain and
# locator. The node is a component; the generated entry boots it
# (RFC-0122 D10).

[system]
name = "freertos_c_talker"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "freertos_c_talker"
class = "freertos_c_talker::Talker"
name = "talker"

[image.mps2-an385-freertos]
board = "mps2-an385-freertos"
# The image's own router port (the e2e harness binds zenohd there).
locator = "tcp/10.0.2.2:7900"
# RFC-0103 D10 (phase-497 W2) — this image's address on QEMU's network;
# its pair partner states the other one, so the two seed distinct zenoh ZIDs.
os_config = ["board-net.toml"]

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951). Generated
# from `just/sdk-env.just`; this gate keeps the two in step. `{env:…}`
# rather than a literal so the value survives a second checkout.
[board_config."mps2-an385-freertos"]
netstack = "lwip"
