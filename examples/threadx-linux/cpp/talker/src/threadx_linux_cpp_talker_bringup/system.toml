# What this example deploys to (RFC-0098 D3/D5): its board, RMW, domain and
# locator, one `[image.*]` per build. The node is a component; the generated
# entry boots it (RFC-0122 D10).

[system]
name = "threadx_linux_cpp_talker"
rmw = "zenoh"
domain_id = 0
default_images = ["threadx-linux"]

[[component]]
pkg = "threadx_linux_cpp_talker"
class = "threadx_linux_cpp_talker::Talker"
name = "talker"

# ThreadX's Linux simulator (a hosted process).
[image.threadx-linux]
board = "threadx-linux"
# The image's own router port (`alloc::port_of(ThreadxLinux, Cpp, Pubsub)`).
locator = "tcp/127.0.0.1:9200"

# The Cyclone build of the same board, as its own image (issue 1946): the
# domain is a property of the BUILD — 108 is `alloc::domain_of(ThreadxLinux, Cpp,
# Pubsub)` — so the lane builds this image rather than passing a
# `-DNROS_DOMAIN_ID` this file would contradict.
[image.threadx-linux-cyclonedds]
board = "threadx-linux"
rmw = "cyclonedds"
domain_id = 108

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951). Generated
# from `just/sdk-env.just`; this gate keeps the two in step. `{env:…}`
# rather than a literal so the value survives a second checkout.
[board_config."threadx-linux"]
netstack = "netxduo"
