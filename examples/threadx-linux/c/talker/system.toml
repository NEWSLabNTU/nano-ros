# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses, and the same file a Rust leaf writes.
# Replaces the `package.xml` `<nano_ros deploy= board= rmw=/>` tuple:
# `find_package(nano_ros)` reads this through `nros ws leaf-system`, which
# derives the platform (`threadx`) from the board. Switching board is editing
# `[image.*] board`.


[system]
name = "threadx_c_talker"
rmw = "zenoh"
domain_id = 0
default_images = ["threadx-linux"]

[[component]]
pkg = "threadx_c_talker"
class = "threadx_c_talker::Talker"
name = "talker"

# ThreadX's Linux simulator (a hosted process).
[image.threadx-linux]
board = "threadx-linux"

# The Cyclone build of the same board, as its own image (issue 1946): the
# domain is a property of the BUILD — 107 is `alloc::domain_of(ThreadxLinux, C,
# Pubsub)` — so a lane selects this image with
# `-DNROS_IMAGE=threadx-linux-cyclonedds` rather than passing a `-DNROS_DOMAIN_ID`
# this file would contradict.
[image.threadx-linux-cyclonedds]
board = "threadx-linux"
rmw = "cyclonedds"
domain_id = 107

# SITE config for this board (RFC-0072 §5): where THIS checkout keeps the
# SDK roots it builds against. Keyed by BOARD, not by a deploy or image
# name, because that is what the fact is about (issue 0951). Generated
# from `just/sdk-env.just`; this gate keeps the two in step. `{env:…}`
# rather than a literal so the value survives a second checkout.
[board_config."threadx-linux"]
netstack = "netxduo"
