[package]
name = "threadx_linux_rs_action_client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "ThreadX Linux action client — Phase 212.L Component pkg"

# phase-338 W2 — collapsed from the retired `-entry` package: this ONE
# package carries both the node logic (src/lib.rs) and the entry
# (src/main.rs's `nros::main!()`), the shape native already had.
[[bin]]
name = "action-client"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]
# phase-366 — was `["rlib", "staticlib"]`. Nothing consumed the staticlib: this
# family has no CMakeLists, no C runtime links it, and no build or fixture row
# names a `.a`. A `staticlib` is a FINAL artifact and rustc holds it to that —
# it needs its own lang items — so declaring one nothing builds is a standing
# obligation with no consumer. Same removal, same reasoning, as phase-359 W7 on
# qemu-arm-nuttx. threadx-linux is a hosted (`std`) sim, which is why the
# obligation was invisible: libstd supplied the items and no one had to notice.

[features]
# Phase 248 C6e — RMW is selected by config (`[package.metadata.nros.deploy.*].rmw`)
# and the concrete backend is linked by the board's C port (NetX-Duo BSD / zpico-sys
# C TU), NOT a Rust `nros/rmw-*` dep. These rows are now inert build-target markers
# (same pattern as `nros-board-mps2-an385`), kept so existing
# `cargo build --no-default-features --features rmw-zenoh` invocations
# (examples/fixtures.toml) still resolve; they no longer forward `nros/rmw-*`. (#60 T5)
rmw-zenoh = []
rmw-xrce = []
rmw-cyclonedds = []

[dependencies]
# phase-338 W2 — carried over from the collapsed `-entry` package.
# #131 / #194 — forward the family board's zenoh-backend link + boot-path register().
nros-board-threadx-linux = { version = "*", features = ["rmw-zenoh"] }
# issue 0644 — `alloc`, not `std`. The `std` here was never about the API: it
# was there because removing it left the image with neither per-image lang item.
# That is fixed, and NOT the way the issue's Direction expected.
#
# The blocker was `crate-type = ["rlib", "staticlib"]`. A staticlib is a FINAL
# artifact, so rustc demanded `#[global_allocator]` and `#[panic_handler]` while
# compiling `src/lib.rs` — which is `#![no_std]` and references no board, so
# nothing could supply them. phase-366 dropped the staticlib (nothing consumed
# it), and the obligation went with it.
#
# What remains needs NO board feature and NO `panic_to_platform!()`, and that is
# the part worth writing down: on THIS family the Rust bin IS the Linux process
# entry, so `src/main.rs` links std for its runtime (crt0 + the `main` shim) and
# std legitimately owns both lang items. Adding either would be wrong —
# `panic_to_platform!()` is an E0152 conflict with std's handler (measured), and
# a board `#[global_allocator]` would reroute every allocation through
# `tx_byte_allocate` for no reason. The RISC-V sibling differs precisely here:
# its entry is `app_main.rs` in a staticlib called from C, so it has no std
# runtime and must declare both.
#
# Acceptance is the issue's own: this leaf builds with `nros`'s `std` OFF.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
# Phase 212.N.7 step-2 — Entry-pkg-callable `pub fn register(runtime: &mut RuntimeCtx)` wrapper.
nros-platform = { version = "*", default-features = false, features = ["platform-threadx"] }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
# Demo-parity log lines route through the `log` facade; the platform entry
# runtime owns the sink.
log = "0.4"

[package.metadata.nros.entry]
deploy = "threadx-linux"

[package.metadata.nros.node]
class = "threadx_linux_rs_action_client::FibonacciClient"
name = "fibonacci_action_client"
default_namespace = "/"

[package.metadata.nros.deploy.threadx-linux]
board = "threadx-linux"
rmw = "zenoh"
domain_id = 0
locator = "tcp/127.0.0.1:9020"

[package.metadata.ament]
build_depend = ["example_interfaces"]
exec_depend = ["example_interfaces"]

[profile.release]
opt-level = "s"
lto = true

[workspace]
