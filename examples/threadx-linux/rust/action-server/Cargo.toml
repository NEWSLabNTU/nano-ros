[package]
name = "threadx_linux_rs_action_server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "ThreadX Linux action server — Phase 212.L Component pkg"

# phase-338 W2 — collapsed from the retired `-entry` package: this ONE
# package carries both the node logic (src/lib.rs) and the entry
# (src/main.rs's `nros::main!()`), the shape native already had.
[[bin]]
name = "action-server"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Phase 248 C6e — RMW is selected by config (`[package.metadata.nros.deploy.*].rmw`)
# and the concrete backend is linked by the board's C port (NetX-Duo BSD / zpico-sys
# C TU), NOT a Rust `nros/rmw-*` dep. These rows are now inert build-target markers
# (same pattern as `nros-board-mps2-an385`), kept so existing
# `cargo build --no-default-features --features rmw-zenoh` invocations
# (examples/fixtures.toml) still resolve; they no longer forward `nros/rmw-*`. (#60 T5)
rmw-zenoh = []
rmw-xrce = []
rmw-cyclonedds = []

[dependencies]
# phase-338 W2 — carried over from the collapsed `-entry` package.
# #131 / #194 — forward the family board's zenoh-backend link + boot-path register().
nros-board-threadx-linux = { version = "*", features = ["rmw-zenoh"] }
# phase-359 W10 — this one STAYS on `std`, and the reason is measured, not
# stylistic. ThreadX-Linux is a no_std board that happens to run as a Linux
# process, so `alloc` is the right flavour on paper — but the image then has
# NEITHER of the two lang items a final artifact needs: `rust-rtos-link-check`
# fails first with "no global memory allocator found", and once the board
# supplies one, with "`#[panic_handler]` function required". Today `std`
# supplies both. Giving the board an `image-runtime` feature (the pair bound
# together, as `nros-board-nuttx` does since W7) is the fix. Owned by issue
# 0618, which is about exactly this — the lang items are per-IMAGE singletons
# decided in libraries, so an image gets two or none; this is a "none" — and it
# lands in phase-366's territory, which is currently moving board panic paths
# onto `nros_platform_panic`, so a third board growing its own handler here
# would collide with that wave.
nros = { version = "*", default-features = false, features = ["std", "rmw-cffi", "macros"] }
# Phase 212.N.7 step-2 — Entry-pkg-callable `pub fn register(runtime: &mut RuntimeCtx)` wrapper.
nros-platform = { version = "*", default-features = false, features = ["platform-threadx"] }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
# Demo-parity log lines route through the `log` facade; the platform entry
# runtime owns the sink.
log = "0.4"
heapless = { version = "0.8", default-features = false }

[package.metadata.nros.entry]
deploy = "threadx-linux"

[package.metadata.nros.node]
class = "threadx_linux_rs_action_server::FibonacciServer"
name = "fibonacci_action_server"
default_namespace = "/"

[package.metadata.nros.deploy.threadx-linux]
board = "threadx-linux"
rmw = "zenoh"
domain_id = 0
locator = "tcp/127.0.0.1:9020"

[package.metadata.ament]
build_depend = ["example_interfaces"]
exec_depend = ["example_interfaces"]

[profile.release]
opt-level = "s"
lto = true

[workspace]
