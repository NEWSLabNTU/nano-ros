[package]
name = "threadx_linux_rs_talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "ThreadX Linux talker — Phase 212.L Component pkg"

[lib]
crate-type = ["rlib"]
# phase-366 — was `["rlib", "staticlib"]`. Nothing consumed the staticlib: this
# family has no CMakeLists, no C runtime links it, and no build or fixture row
# names a `.a`. A `staticlib` is a FINAL artifact and rustc holds it to that —
# it needs its own lang items — so declaring one nothing builds is a standing
# obligation with no consumer. Same removal, same reasoning, as phase-359 W7 on
# qemu-armv7a-nuttx. threadx-linux was a hosted (`std`) sim then, which is why
# the obligation was invisible: libstd supplied the items and no one had to notice.

[dependencies]
# issue 0644 — `alloc`, not `std`. The `std` here was never about the API: it
# was there because removing it left the image with neither per-image lang item.
# That is fixed, and NOT the way the issue's Direction expected.
#
# The blocker was `crate-type = ["rlib", "staticlib"]`. A staticlib is a FINAL
# artifact, so rustc demanded `#[global_allocator]` and `#[panic_handler]` while
# compiling `src/lib.rs` — which is `#![no_std]` and references no board, so
# nothing could supply them. phase-366 dropped the staticlib (nothing consumed
# it), and the obligation went with it.
#
# issue 1759 — and since then the image links no libstd at all. The generated
# entry is `#![no_std]` + `#![no_main]` (the board's `entry_kind` is
# `board-run`): glibc's crt0 calls the C-ABI `main(argc, argv)` that
# `nros::main!` emits, the bringup's `panic = "platform"` ends a panic in
# `nros_platform_panic`, and the board's `image-runtime` feature installs the
# `#[global_allocator]` over the ThreadX byte pool — the same three lang items
# the RISC-V sibling declares, and the allocator real ThreadX hardware uses.
#
# Acceptance is the issue's own: this package builds with `nros`'s `std` OFF.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
# phase-277 W4 — chatter log lines (`Publishing:` / `I heard:`) route through
# the `log` facade; the platform entry runtime owns the sink.
log = "0.4"

# The board, RMW, locator and node declaration live in the bringup's
# `system.toml` (`../threadx_linux_rs_talker_bringup`, RFC-0098 D3/D5).
# Nothing here names a board: every image-only dependency (board crate, RMW
# backend, platform, runtime, panic handler) is the generated entry's
# (RFC-0121 D6), so switching `[image.*] board` is the only edit a board
# switch needs.

[package.metadata.ament]
build_depend = ["std_msgs"]
exec_depend = ["std_msgs"]
