# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses. Switching board is editing `[image.*] board`
# and re-running `nros sync`.

[system]
name = "rv_virt_threadx_talker"
rmw = "zenoh"
domain_id = 0
default_images = ["rv-virt-threadx"]

[[component]]
pkg = "rv_virt_threadx_talker"
class = "rv_virt_threadx_talker::Talker"
name = "talker"

# ThreadX on the QEMU RISC-V virt machine. The network identity reaches the
# board `Config` via `BoardEntry::run_with_deploy`; CycloneDDS ignores the
# locator (no router).
[image.rv-virt-threadx]
board = "rv-virt-threadx"
locator = "tcp/10.0.2.2:9400"
net = { eth0 = { network = "qemu", host = 15 } }

# The Cyclone build of the same board, as its own image (issue 1946): the
# domain is a property of the BUILD — 127 is `alloc::domain_of(ThreadxRiscv64, Rust,
# Pubsub)` — so a lane selects this image with
# `-DNROS_IMAGE=rv-virt-threadx-cyclonedds` rather than passing a `-DNROS_DOMAIN_ID`
# this file would contradict.
[image.rv-virt-threadx-cyclonedds]
board = "rv-virt-threadx"
rmw = "cyclonedds"
domain_id = 127
locator = "tcp/10.0.2.2:9400"
net = { eth0 = { network = "qemu", host = 15 } }
