# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses, and the same file a Rust leaf writes.
# Replaces the `package.xml` `<nano_ros deploy= board= rmw=/>` tuple:
# `find_package(nano_ros)` reads this through `nros ws leaf-system`, which
# derives the platform (`threadx`) from the board. Switching board is editing
# `[image.*] board`.


[system]
name = "riscv64_threadx_cpp_talker"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "riscv64_threadx_cpp_talker"
class = "riscv64_threadx_cpp_talker::Talker"
name = "talker"

# ThreadX on the QEMU RISC-V virt machine.
[image.rv-virt-threadx]
board = "rv-virt-threadx"
# RFC-0103 D10 (phase-497 W2) — the Cyclone pair shares one L2 link, so each
# member states its own address, and the MAC QEMU gives its virtio device
# (`threadx_riscv64_qemu.rs` passes the same one to `-device`).
net = { eth0 = { network = "qemu", host = 40, mac = "52:54:00:12:34:56" } }
