# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses, and the same file a Rust leaf writes.
# Replaces the `package.xml` `<nano_ros deploy= board= rmw=/>` tuple:
# `find_package(nano_ros)` reads this through `nros ws leaf-system`, which
# derives the platform (`threadx`) from the board. Switching board is editing
# `[image.*] board`.


[system]
name = "riscv64_threadx_cpp_listener"
rmw = "zenoh"
domain_id = 0
default_images = ["rv-virt-threadx"]

[[component]]
pkg = "riscv64_threadx_cpp_listener"
class = "riscv64_threadx_cpp_listener::Listener"
name = "listener"

# ThreadX on the QEMU RISC-V virt machine.
[image.rv-virt-threadx]
board = "rv-virt-threadx"
# RFC-0103 D10 (phase-497 W2) — the Cyclone pair shares one L2 link, so each
# member states its own address, and the MAC QEMU gives its virtio device
# (`threadx_riscv64_qemu.rs` passes the same one to `-device`).
os_config = ["board-net-rv-virt-threadx.toml"]

# The Cyclone build of the same board, as its own image (issue 1946): the
# domain is a property of the BUILD — 129 is `alloc::domain_of(ThreadxRiscv64, Cpp,
# Pubsub)` — so a lane selects this image with
# `-DNROS_IMAGE=rv-virt-threadx-cyclonedds` rather than passing a `-DNROS_DOMAIN_ID`
# this file would contradict.
[image.rv-virt-threadx-cyclonedds]
board = "rv-virt-threadx"
rmw = "cyclonedds"
domain_id = 129
os_config = ["board-net-rv-virt-threadx-cyclonedds.toml"]
