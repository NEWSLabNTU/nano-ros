[package]
name = "nros-lifecycle-msgs"
# A generated message crate's version is the CONSTANT `0.0.0`, never the
# workspace version (issue 0394, issue 1428). These three were hand-adapted as
# workspace members before that rule existed, so they carried the release
# version and five consumer dep rows pinned it as `version = "0.5.0"` — rows
# that stop resolving the moment the workspace version bumps, which takes every
# cargo command in the tree rather than one consumer.
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated nros types for lifecycle_msgs (ROS 2 Humble 1.2.2)"

[package.metadata.ros]
upstream-package = "lifecycle_msgs"
upstream-version = "1.2.2"
ros-edition = "humble"

[features]
default = []
# phase-359 W10 — the `std` feature is GONE from this crate. It never gated
# anything here: this crate's own sources contain no `std::` path and no
# `feature = "std"` arm, so the feature existed purely to hand the flavour down
# to nros-core / nros-serdes on a consumer's behalf. A message crate has no
# business deciding whether the runtime under it is hosted.

[dependencies]
nros-core.workspace = true
nros-serdes.workspace = true
heapless = "0.8"
