# RFC-0033 capacities for the core pre-generated interface set.
#
# ONE config for ONE invocation (phase-465 W1): keys are package-qualified, so
# merging the four driver packages' configs is lossless — a `CapacityResolver`
# is built once for the whole closure and each key still names exactly the
# field it did. Only `diagnostic-msgs/` ever had one; the rows below are that
# file verbatim.
#
# RFC-0052 W3b.1 — the reporter emits ONE status per array with a handful of
# key/values; the generated defaults (64-element sequences of 256-byte strings)
# put multi-MB structs on the stack. Keep /diagnostics entries small and
# embeddable.
[fields]
"diagnostic_msgs/DiagnosticArray.status" = 4
"diagnostic_msgs/DiagnosticStatus.values" = 8
"diagnostic_msgs/DiagnosticStatus.name" = 64
"diagnostic_msgs/DiagnosticStatus.message" = 128
"diagnostic_msgs/DiagnosticStatus.hardware_id" = 96
"diagnostic_msgs/KeyValue.key" = 32
"diagnostic_msgs/KeyValue.value" = 64
