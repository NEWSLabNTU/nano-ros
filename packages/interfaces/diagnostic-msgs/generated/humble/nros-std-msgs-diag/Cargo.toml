[package]
name = "nros-std-msgs-diag"
version = "0.0.0"
edition = "2021"

# Version of the interface package this was generated FROM. Informational: the
# crate version is the CONSTANT above so no consumer or lock can pin a value the
# generator would change (issue 0394).
[package.metadata.nros]
ament_version = "4.9.1"


[features]
default = []
# phase-359 W10 — the `std` feature is GONE from this crate. It never gated
# anything here: this crate's own sources contain no `std::` path and no
# `feature = "std"` arm, so the feature existed purely to hand the flavour down
# to nros-core / nros-serdes on a consumer's behalf. A message crate has no
# business deciding whether the runtime under it is hosted.

[dependencies]
# nros crates (patched to local via .cargo/config.toml during development)
nros-core = { path = "../../../../../core/nros-core", default-features = false  }
nros-serdes = { path = "../../../../../core/nros-serdes", default-features = false  }
heapless = "0.8"
nros-builtin-interfaces-diag = { path = "../nros-builtin-interfaces-diag", default-features = false }
