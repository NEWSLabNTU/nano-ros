[package]
name = "rcl-interfaces"
version = "0.4.0"
edition = "2021"
description = "Generated rcl_interfaces bindings for nros parameter services"
license = "Apache-2.0"

[features]
default = []
# phase-359 W10 — the `std` feature is GONE from this crate. It never gated
# anything here: this crate's own sources contain no `std::` path and no
# `feature = "std"` arm, so the feature existed purely to hand the flavour down
# to nros-core / nros-serdes on a consumer's behalf. A message crate has no
# business deciding whether the runtime under it is hosted.

[dependencies]
nros-core = { path = "../../core/nros-core", default-features = false }
nros-serdes = { path = "../../core/nros-serdes", default-features = false }
heapless = "0.8"
