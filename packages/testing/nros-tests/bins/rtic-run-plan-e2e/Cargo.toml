[package]
name = "qemu-rtic-main-e2e"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Generated nros::main RTIC run-plan E2E fixture for QEMU MPS2-AN385 (phase-216.B)"

[[bin]]
name = "qemu-rtic-main-e2e"
test = false
bench = false

# Self-contained standalone fixture (issue 0100): node logic in this crate's
# lib.rs (`nros::node!(E2eNode)` → `register_dispatch`); `nros::main!()` registers
# this crate itself (issue 1289: no `node_pkgs` needed). `main.rs` is the `nros::main!()` RTIC Entry.
[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board.

[dependencies]
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble", "macros"] }
# The image's board crate (with its `rtic` entry surface), its RMW backend and
# the board's panic provider — GENERATED by `nros sync` / `nros build` from
# `system.toml` (RFC-0098 D6, issue 1305). `e2e-synthetic-callback` is the one
# board feature no image fact implies — the synthetic callback enqueued at RTIC
# `#[init]`, so this run-plan fixture proves deferred dispatch without a live
# peer — named here, on the selection, which passes it through to the board
# crate. The node reaches `exit_success()` through the selection's re-export.
qemu_rtic_main_e2e_nros_selection = { path = "build/nros/selection", features = ["e2e-synthetic-callback"] }
# What the RTIC `#[app]` the macro emits names directly.
mps2-an385-pac = { version = "*" }
rtic = { version = "2.1", features = ["thumbv7-backend"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[workspace]
