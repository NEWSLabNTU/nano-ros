# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses. Switching board is editing `[image.*] board`
# and re-running `nros sync`.


[system]
name = "qemu_rtic_main_e2e"
rmw = "zenoh"
domain_id = 0

# `dispatch` — callbacks hand off to a ring rather than running inline
# (phase-216 A.5); read by `nros check`'s framework × dispatch lint (issue 1278).
[[component]]
pkg = "qemu_rtic_main_e2e"
class = "qemu_rtic_main_e2e::E2eNode"
name = "rtic_run_plan_e2e"
dispatch = "deferred"

# RTIC on bare-metal MPS2-AN385 (QEMU). The network identity overlays the
# board's compiled-in `Config::default()` through `BoardEntry::run_with_deploy`.
#
# issue 1865 — the locator is the ONE home of the router port: `just qemu
# test-rtic-main-e2e` starts its router on whatever port this states
# (`scripts/lib/image_locator.py`). Its own allocator slot,
# `nros_tests::alloc::BAREMETAL_RTIC_RUN_PLAN_PORT`, so it shares no router with
# the RTIC talker/listener pair on 10200. Without it the image baked the board
# default `tcp/10.0.2.2:7450`, which nothing listened on.
[image.mps2-an385-baremetal]
board = "rtic-mps2-an385"
locator = "tcp/10.0.2.2:10530"
