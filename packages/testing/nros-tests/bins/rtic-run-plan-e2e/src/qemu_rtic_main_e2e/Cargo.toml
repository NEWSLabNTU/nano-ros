# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]

[package]
name = "qemu_rtic_main_e2e"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Generated nros::main RTIC run-plan E2E fixture for QEMU MPS2-AN385 (phase-216.B)"

# Self-contained standalone fixture (issue 0100): node logic in this crate's
# lib.rs (`nros::node!(E2eNode)` → `register`); `nros::main!()` registers
# this crate itself (issue 1289: no `node_pkgs` needed). `main.rs` is the `nros::main!()` RTIC Entry.
[[bin]]
name = "qemu_rtic_main_e2e"
path = "src/main.rs"
test = false
bench = false

[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board.

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW and
# edition features come from the adapter.
# `rtic`: the board's RTIC entry surface (`rtic-mps2-an385`). `e2e-synthetic-callback`:
# the board's test-only queue producer this E2E dispatches through; a board
# feature no image fact implies, so this owned entry names it itself.
nros-board-mps2-an385 = { path = "../../../../../../boards/nros-board-mps2-an385", default-features = false, features = ["rtic", "e2e-synthetic-callback"] }
# `panic = "own"`: the board's crate-root panic provider is this image's
# handler (its descriptor's `own_panic_root_*`), linked here by the entry.
panic-semihosting = { version = "0.6", features = ["exit"] }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
qemu_rtic_main_e2e_nros_derived = { path = "../../generated/nros-derived/qemu_rtic_main_e2e" }
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
# What the RTIC `#[app]` the macro emits names directly.
mps2-an385-pac = { version = "*" }
rtic = { version = "2.1", features = ["thumbv7-backend"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
