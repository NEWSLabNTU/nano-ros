# Issue 1706 fixture — see Cargo.toml for what this image is for.

[system]
name = "param_store_nuttx"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "param_store_nuttx_qemu_arm"
class = "param_store_nuttx_qemu_arm::ParamTalker"
name = "param_talker"

# NuttX on the QEMU ARM virt machine (slirp: the host is 10.0.2.2). The port is
# this fixture's own: `nros_tests::alloc::port_of(NuttxArm, Rust, Params)`.
[image.qemu-armv7a-nuttx]
board = "nuttx"
# `main.rs` says `nros::main!(panic = "platform")`; stated here too so
# the generated selection package does not also link the board's
# crate-root panic provider (RFC-0077, issue 1305).
panic = "platform"
locator = "tcp/10.0.2.2:8270"

[board_config."qemu-armv7a-nuttx"]
