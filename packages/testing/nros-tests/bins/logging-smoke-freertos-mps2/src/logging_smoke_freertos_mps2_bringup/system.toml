# What this test image deploys to (RFC-0098 D3/D5). It keeps its own `main`
# (no `nros::main!`, no session) and declares no component table; the file
# names its board. Its program is the image's OWNED entry (RFC-0071 D19),
# which names its board crate itself; the generated adapter carries the image's
# RMW and link features (issue 2448), and `build/<image>/nros-cargo.toml` the
# target / link settings.
# The program opens no session; `rmw` is the image's backend all the same, as
# for every image (the board crate is built with it).

[system]
name = "logging_smoke_freertos"
rmw = "zenoh"
domain_id = 0

# FreeRTOS on QEMU MPS2-AN385. The network identity the smoke prints comes from
# its own `config.toml` (`Config::from_toml`), not from here.
[image.mps2-an385-freertos]
entry = "logging-smoke-freertos-mps2"
board = "freertos"

[board_config."mps2-an385-freertos"]
netstack = "lwip"
