# FreeRTOS + MPS2-AN385 QEMU logging-smoke network config (Slirp NAT default).
# Read at compile time via `include_str!("../config.toml")` →
# `Config::from_toml` (RFC-0109 D4: the board package's own network file).
[node]
domain_id = 0
locator = "tcp/10.0.2.2:7451"

[eth0]
network = "qemu"
host = 99
mac = "02:00:00:00:00:99"
