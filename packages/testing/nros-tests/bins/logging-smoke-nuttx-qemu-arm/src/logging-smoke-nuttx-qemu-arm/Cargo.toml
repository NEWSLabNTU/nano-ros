# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "logging-smoke-nuttx-qemu-arm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 88.15.c — NuttX QEMU ARM virt nros-log smoke fixture"

[[bin]]
name = "logging-smoke-nuttx-qemu-arm"
test = false
bench = false

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW and
# edition features come from the adapter.
nros-board-nuttx-qemu = { path = "../../../../../../boards/nros-board-nuttx-qemu", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
logging_smoke_nuttx_qemu_arm_nros_derived = { path = "../../generated/nros-derived/logging-smoke-nuttx-qemu-arm" }
nros-log = { path = "../../../../../../core/nros-log" }

[profile.release]
opt-level = "s"
lto = true
