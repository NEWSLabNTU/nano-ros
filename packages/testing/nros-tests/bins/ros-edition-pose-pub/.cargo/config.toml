include = ["../../../../../../nros-patch.toml"]
[patch.crates-io]
# Generated msg crates (leaf-local; regenerated per edition for interop lanes).
builtin_interfaces = { path = "generated/builtin_interfaces" }  # nros-managed
geometry_msgs = { path = "generated/geometry_msgs" }  # nros-managed
std_msgs = { path = "generated/std_msgs" }  # nros-managed
# Platform/backend crates the central nros-patch.toml omits (not in every graph).
# `path` is relative to the package dir; `include` above is relative to .cargo/.
nros-board-native = { path = "../../../../../packages/boards/nros-board-native" }  # nros-managed
nros-platform-cffi = { path = "../../../../../packages/core/nros-platform-cffi" }  # nros-managed
nros-rmw-cyclonedds-sys = { path = "../../../../../packages/dds/nros-rmw-cyclonedds-sys" }  # nros-managed
