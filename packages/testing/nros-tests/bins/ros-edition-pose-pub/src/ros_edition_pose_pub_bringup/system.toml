# What this test image deploys to (RFC-0098 D3/D5) — see the package's
# Cargo.toml for what the program is for. Its program is the OWNED entry
# `ros_edition_pose_pub` (RFC-0071 D19): it keeps its own `main` (no
# `nros::main!`) and opens its own executor, so it declares no component
# table. The generated adapter links the image's RMW and edition.

# Cyclone only (no router). `just ros_editions build-fixture <distro>` builds a
# copy of this workspace whose `[system] ros_edition` is that edition, as
# `build-e2e-fixtures` does for the six examples (issue 2409).

[system]
name = "ros_edition_pose_pub"
rmw = "cyclonedds"
domain_id = 0
# The image a bare `nros configure` / `nros build` / `cargo build` builds.
default_images = ["linux"]

# Host build. The locator and domain stay runtime env on native.
[image_defaults]
board = "linux"

[image.linux]
entry = "ros_edition_pose_pub"
