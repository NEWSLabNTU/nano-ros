# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]

[package]
name = "ros_edition_pose_pub"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# phase-309 W5 residual — a nano-ros CYCLONE publisher of geometry_msgs/
# PoseStamped (the #0267 depth-2 nested shape), built against GENERATED bindings
# so the per-edition interop lane runs a real product node against a live ROS 2
# edition peer (not a stock publisher). RMW is cyclone only (the edition peers
# discover over RTPS on a shared domain). Values are fixed to the #0267 vector.

[[bin]]
name = "ros-edition-pose-pub"
path = "src/main.rs"

[package.metadata.nros.application]
deploy = ["linux"]

[dependencies]
# Registry names, not repo paths: `just ros_editions build-fixture` builds a COPY
# of this workspace outside the checkout, and `nros build` patches these to the
# in-tree crates wherever the workspace sits, as it does for the examples.
nros = { version = "*", default-features = false, features = ["log", "alloc", "env", "rmw-cffi"] }
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`). Its RMW and edition features come from the adapter.
nros-board-linux = { version = "*", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19). It links the
# image's backend (cyclonedds) and names its ROS edition.
ros_edition_pose_pub_nros_derived = { path = "../../generated/nros-derived/ros_edition_pose_pub" }
geometry_msgs = { path = "../../generated/geometry_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"
