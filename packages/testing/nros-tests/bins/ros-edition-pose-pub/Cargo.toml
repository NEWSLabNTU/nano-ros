[package]
name = "ros-edition-pose-pub"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# phase-309 W5 residual — a nano-ros CYCLONE publisher of geometry_msgs/
# PoseStamped (the #0267 depth-2 nested shape), built against GENERATED bindings
# so the per-edition interop lane runs a real product node against a live ROS 2
# edition peer (not a stock publisher). RMW is cyclone only (the edition peers
# discover over RTPS on a shared domain). Values are fixed to the #0267 vector.

[[bin]]
name = "ros-edition-pose-pub"
path = "src/main.rs"

[package.metadata.nros.application]
deploy = ["native"]

[dependencies]
# `nros/rmw-cyclonedds`, the typed-descriptor marker the Cyclone path needs
# (a typed `create_publisher::<M>` fails PublisherCreationFailed without it),
# comes from the selection package, which names it for a cyclonedds image
# (issue 1295).
nros = { version = "*", default-features = false, features = ["std", "alloc", "env", "rmw-cffi"] }
nros-platform-cffi = { version = "*", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
ros_edition_pose_pub_nros_selection = { path = "build/nros/selection" }
geometry_msgs = { path = "generated/geometry_msgs", default-features = false }
log = "0.4"
env_logger = "0.11"

[workspace]
