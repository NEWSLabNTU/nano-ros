# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "int32-source"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Generic std_msgs/Int32 publisher fixture, the twin of int32-sink. Publishes the same counter on every topic in `NROS_PUB_TOPICS` (comma-separated, default `/chatter`) every `NROS_PUB_PERIOD_MS` ms (default 100) and prints `Published: N` per tick. phase-482 W3: the peer of the topic-state-monitor-port cells."

[[bin]]
name = "int32-source"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# adapter `nros build` generates for this owned entry links the image's
# backend (RFC-0071 D13/D19).

[dependencies]
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`). Its RMW and edition features come from the adapter.
nros-board-linux = { path = "../../../../../../boards/nros-board-linux", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
int32_source_nros_derived = { path = "../../generated/nros-derived/int32-source" }
nros = { path = "../../../../../../api/nros", default-features = false, features = [
    "log", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../../../core/nros-core" }
nros-serdes = { path = "../../../../../../core/nros-serdes" }
