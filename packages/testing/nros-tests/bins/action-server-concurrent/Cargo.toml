[workspace]

[package]
name = "action-server-concurrent"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Concurrent Fibonacci action-server fixture (extracted from the examples/native/rust/action-server `NROS_ACTION_CONCURRENT` escape hatch in phase-277 W5, when the example slimmed to the official single-goal demo). Accepts and advances several goals at once, draining get_result every spin so multiple early get_result requests are held (deferred) simultaneously — exercises the backends' seq-keyed reply tables under real concurrent load. Consumed by tests/interop_e2e.rs (ex-rmw_interop) and tests/xrce_ros2_interop.rs concurrent action tests."

[[bin]]
name = "action-server-concurrent"
path = "src/main.rs"

[features]
# RMW selected at build time via mutually exclusive features (same shape as
# the examples): each `rmw-*` activates the optional backend dep and forwards
# to `nros-board-linux`, whose `register_linked_rmw()` call in `main.rs`
# registers the selected backend before the executor opens.
default = ["rmw-zenoh"]
rmw-zenoh = ["dep:nros-rmw-zenoh", "nros-board-linux/rmw-zenoh"]
rmw-xrce = ["dep:nros-rmw-xrce-cffi", "nros-board-linux/rmw-xrce"]

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "std", "alloc", "env",
    "rmw-cffi",
    "ros-humble",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
nros-board-linux = { path = "../../../../boards/nros-board-linux", default-features = false }
nros-rmw-zenoh = { path = "../../../../rmw/zenoh/nros-rmw-zenoh", default-features = false, features = [
    "std",
    "platform-posix",
    "ros-humble",
], optional = true }
nros-rmw-xrce-cffi = { path = "../../../../rmw/xrce/nros-rmw-xrce-cffi", default-features = false, features = [
    "std",
], optional = true }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
log = "0.4"
env_logger = "0.11"
heapless = "0.8"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
# The generated action package declares these nros crates by registry name
# (`nros-rmw` unconditionally for RosAction protocol types, `nros-rmw-cyclonedds`
# as an optional feature dep), and nano-ros publishes nothing to crates.io — so
# without a redirect any RE-resolution fails `no matching package named
# nros-rmw-cyclonedds`. The committed lock predated the optional dep and hid it.
# RFC-0067 D1 retires the MESSAGE-crate patches only; nros-* keep theirs.
nros-rmw = { path = "../../../../core/nros-rmw" }
nros-rmw-cyclonedds = { path = "../../../../rmw/cyclonedds/nros-rmw-cyclonedds" }
