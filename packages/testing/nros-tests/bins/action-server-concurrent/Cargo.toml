[workspace]

[package]
name = "action-server-concurrent"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Concurrent Fibonacci action-server fixture (extracted from the examples/linux/rust/action-server `NROS_ACTION_CONCURRENT` escape hatch in phase-277 W5, when the example slimmed to the official single-goal demo). Accepts and advances several goals at once, draining get_result every spin so multiple early get_result requests are held (deferred) simultaneously — exercises the backends' seq-keyed reply tables under real concurrent load. Consumed by tests/interop_e2e.rs (ex-rmw_interop) and tests/xrce_ros2_interop.rs concurrent action tests."

[[bin]]
name = "action-server-concurrent"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# generated selection package links the image's backend (issue 1305).

[features]
# issue 0902 / phase-455 W2 — print the zenoh reply-slot refusal total
# (`nros_rmw_zenoh::reply_slot_refusals_total`). Meaningful on the zenoh image
# (`native`) only, where the selection package already links the backend; the
# fixture row for that image enables it. Without it the program reports
# `None` (it cannot measure), never a safe-looking zero.
zenoh-reply-slots = ["dep:nros-rmw-zenoh"]

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "std", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
action_server_concurrent_nros_selection = { path = "build/nros/selection" }
# Only for the feature above; the selection package links the backend.
nros-rmw-zenoh = { path = "../../../../rmw/zenoh/nros-rmw-zenoh", default-features = false, optional = true }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
log = "0.4"
env_logger = "0.11"
heapless = "0.8"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
# The generated action package declares these nros crates by registry name
# (`nros-rmw` unconditionally for RosAction protocol types, `nros-rmw-cyclonedds`
# as an optional feature dep), and nano-ros publishes nothing to crates.io — so
# without a redirect any RE-resolution fails `no matching package named
# nros-rmw-cyclonedds`. The committed lock predated the optional dep and hid it.
# RFC-0067 D1 retires the MESSAGE-crate patches only; nros-* keep theirs.
nros-rmw = { path = "../../../../core/nros-rmw" }
nros-rmw-cyclonedds = { path = "../../../../rmw/cyclonedds/nros-rmw-cyclonedds" }
