[package]
name = "example_interfaces"
version = "0.0.0"
edition = "2021"

# Version of the interface package this was generated FROM. Informational: it
# varies by host (ROS install vs vendored interfaces) and must never reach the
# `version` field above, or it lands in consumers' lockfiles.
[package.metadata.nros]
ament_version = "0.9.3"

[features]
default = []
std = ["nros-core/std", "nros-serdes/std", "builtin_interfaces/std", "action_msgs/std", "unique_identifier_msgs/std"]
rmw-cyclonedds = ["dep:nros-rmw-cyclonedds"]

[dependencies]
# nros crates (patched to local via .cargo/config.toml during development)
nros-core = { path = "../../../../../../core/nros-core", default-features = false  }
nros-serdes = { path = "../../../../../../core/nros-serdes", default-features = false  }
heapless = "0.8"
nros-rmw-cyclonedds = { path = "../../../../../../rmw/cyclonedds/nros-rmw-cyclonedds", default-features = false, optional = true  }
builtin_interfaces = { path = "../builtin_interfaces", default-features = false }
action_msgs = { path = "../action_msgs", default-features = false }
unique_identifier_msgs = { path = "../unique_identifier_msgs", default-features = false }
