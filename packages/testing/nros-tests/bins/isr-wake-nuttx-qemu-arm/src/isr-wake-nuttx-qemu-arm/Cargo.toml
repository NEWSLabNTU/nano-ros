# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "isr-wake-nuttx-qemu-arm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Issue 2706 — a NuttX timer interrupt wakes a parked executor"

[[bin]]
name = "isr-wake-nuttx-qemu-arm"
test = false
bench = false

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW and
# edition features come from the adapter.
nros-board-nuttx-qemu = { path = "../../../../../../boards/nros-board-nuttx-qemu", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
isr_wake_nuttx_qemu_arm_nros_derived = { path = "../../generated/nros-derived/isr-wake-nuttx-qemu-arm" }
nros = { path = "../../../../../../api/nros", default-features = false, features = ["rmw-cffi"] }
nros-node = { path = "../../../../../../core/nros-node", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-rmw-zenoh = { path = "../../../../../../rmw/zenoh/nros-rmw-zenoh" }

[profile.release]
opt-level = "s"
lto = true
