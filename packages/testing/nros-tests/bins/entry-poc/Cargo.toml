[workspace]

[package]
name = "entry-poc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 212.N.7 step-1 — proof-of-concept Entry pkg consuming `nros-board-linux` + the codegen-emitted `run_plan(runtime)`."

[[bin]]
name = "entry-poc"
path = "src/main.rs"

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board.

[dependencies]
# Phase 212.N.9 — `nros::main!()` proc-macro lives here.
# phase-361 W3 — `nros` defaults to `no_std`; this is a hosted Linux entry.
nros = { version = "*", default-features = false, features = ["alloc", "macros"] }
# Phase 212.N.3 tier-1 per-board shim. `LinuxBoard::run` provides the
# `BoardEntry` lifecycle the Entry pkg's `main.rs` invokes.
nros-board-linux = { version = "*" }
# Phase 212.N.1 trait surface — `BoardEntry`, `RuntimeCtx`, `RuntimeError`.
nros-platform = { version = "*", default-features = false, features = ["std"] }
