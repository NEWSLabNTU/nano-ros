[workspace]

[package]
name = "entry-poc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 212.N.7 step-1 — proof-of-concept Entry pkg consuming `nros-board-linux` + the codegen-emitted `run_plan(runtime)`."

[[bin]]
name = "entry-poc"
path = "src/main.rs"

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board. The board crate
# comes from the generated selection package below (RFC-0098 D6, issue 1305).

[dependencies]
# Phase 212.N.9 — `nros::main!()` proc-macro lives here.
# phase-361 W3 — `nros` defaults to `no_std`; this is a hosted Linux entry.
nros = { version = "*", default-features = false, features = ["alloc", "macros"] }
# The image's board crate (`LinuxBoard::run` provides the `BoardEntry`
# lifecycle `nros::main!` drives) and its RMW — GENERATED by `nros sync` /
# `nros build` from `system.toml` (RFC-0098 D6, issue 1305). `nros::main!`
# reaches the board through it.
entry_poc_nros_selection = { path = "build/nros/selection" }
# Phase 212.N.1 trait surface — `BoardEntry`, `RuntimeCtx`, `RuntimeError`.
nros-platform = { version = "*", default-features = false, features = ["std"] }
