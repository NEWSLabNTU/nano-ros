# Issue 1706 fixture — see Cargo.toml for what this image is for.

[system]
name = "param_store_threadx"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "param_store_threadx_riscv64"
class = "param_store_threadx_riscv64::ParamTalker"
name = "param_talker"

# ThreadX on the QEMU RISC-V virt machine, slirp networking (the host is
# 10.0.2.2). The port is this fixture's own:
# `nros_tests::alloc::port_of(ThreadxRiscv64, Rust, Params)`.
[image.rv-virt-threadx]
board = "rv-virt-threadx"
locator = "tcp/10.0.2.2:9470"
ip = "10.0.2.15"
netmask = "255.255.255.0"
gateway = "10.0.2.2"
