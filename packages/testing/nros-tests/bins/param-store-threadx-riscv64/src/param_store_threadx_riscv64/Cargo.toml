# Issue 1706 — an rv-virt-threadx (QEMU riscv64, ThreadX + NetX Duo) image
# that CARVES its parameter store from the executor backing (phase-382 W3'),
# with a live zenoh session.
#
# The sibling of `bins/param-store-nuttx-qemu-arm` (same `lib.rs`): a talker
# with ONE declared parameter (`start_value`) whose `system.contract.yaml`
# makes the store visible to the build, so `nros configure` writes the sizing
# descriptor's `[params] store = "declared"`. Without the contract the same
# image takes the HEAP road, which is the before/after issue 1706 records.
#
# The node package of a one-package workspace (phase-531 W7): the image is
# the bringup's `[image.rv-virt-threadx]`, built as the GENERATED
# `rv-virt-threadx_entry`, whose `nros-cargo.toml` names the sizing descriptor
# to cargo. Not the `app_main!` staticlib the `examples/rv-virt-threadx/rust/*`
# leaves are: those link through `nros_threadx_rv64_rust_app` (CMake), which
# names no sizing descriptor to cargo, so a contract beside them reaches
# nothing.
#
# Consumed by tests/param_store_carve.rs.
[package]
name = "param_store_threadx_riscv64"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Issue 1706 — rv-virt-threadx talker that carves its parameter store"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# `param-services`: a declared parameter is what builds the store.
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros", "param-services"] }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"

# Everything only the IMAGE needs is TARGET-scoped, so the node in `lib.rs`
# builds for the host as well and `nros configure` can PROBE what it creates
# (issues 1265, 1603) — the shape of `examples/rv-virt-threadx/rust/talker`.
[target.'cfg(target_os = "none")'.dependencies]
# `alloc-stats`: the Rust global allocator's peak — where the store lands on
# the heap road.
nros-platform = { version = "*", default-features = false, features = ["global-allocator", "critical-section", "alloc-stats"] }

[package.metadata.ament]
build_depend = ["std_msgs"]
exec_depend = ["std_msgs"]
