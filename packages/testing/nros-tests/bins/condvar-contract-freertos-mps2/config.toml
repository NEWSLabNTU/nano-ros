# FreeRTOS + MPS2-AN385 QEMU condvar-contract network config (the image opens no session; the board still brings the interface up) (Slirp NAT default).
# Read at compile time via `include_str!("../config.toml")` →
# `Config::from_toml` (RFC-0004: config in a file, not hardcoded in code).
[node]
domain_id = 0

[[transport]]
kind = "ethernet"
ip = "10.0.2.98/24"
mac = "02:00:00:00:00:98"
gateway = "10.0.2.2"
locator = "tcp/10.0.2.2:7451"
