# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "condvar-contract-freertos-mps2"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Issue 1906: the platform condvar contract on FreeRTOS + MPS2-AN385"

[[bin]]
name = "condvar-contract-freertos-mps2"
test = false
bench = false

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW and
# edition features come from the adapter.
nros-board-mps2-an385-freertos = { path = "../../../../../../boards/nros-board-mps2-an385-freertos", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
condvar_contract_freertos_mps2_nros_derived = { path = "../../generated/nros-derived/condvar-contract-freertos-mps2" }
# Phase 88 facade.
nros-log = { path = "../../../../../../core/nros-log", default-features = false }
# `zenoh-condvar-wait`: phase-502 W2, the zenoh layer's bounded `_z_condvar_wait`
# (the board brings zpico-sys with `rmw = "zenoh"`).
nros-condvar-contract = { path = "../../../../../nros-condvar-contract", features = ["zenoh-condvar-wait"] }
# Pull `nros-platform-freertos` symbols into the link graph (the
# board crate already does this transitively, but make it explicit
# so the binary stays linkable if board-crate deps shift).
nros-platform = { path = "../../../../../../platform/nros-platform", default-features = false, features = ["platform-freertos", "global-allocator"] }

cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
opt-level = "s"
