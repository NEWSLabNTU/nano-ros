[package]
name = "unique_identifier_msgs"
version = "0.0.0"
edition = "2021"

# Version of the interface package this was generated FROM. Informational: it
# varies by host (ROS install vs vendored interfaces) and must never reach the
# `version` field above, or it lands in consumers' lockfiles.
[package.metadata.nros]
ament_version = "2.2.1"

[features]
default = []
std = ["nros-core/std", "nros-serdes/std"]

[dependencies]
# nros crates (patched to local via .cargo/config.toml during development)
nros-core = { version = "*", default-features = false }
nros-serdes = { version = "*", default-features = false }
heapless = "0.8"
