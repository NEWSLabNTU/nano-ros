[workspace]

[package]
name = "action-client-multigoal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Multi-goal Fibonacci action-client fixture (issue 0322). Sends more concurrent goals than the server's MAX_GOALS table holds and reports each acceptance verdict, so a full table can be shown to REJECT rather than acknowledge-and-drop. Paired with action-server-concurrent, which holds goals across spins. Consumed by tests/action_multigoal.rs."

[[bin]]
name = "action-client-multigoal"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# generated selection package links the image's backend (issue 1305).

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "log", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
action_client_multigoal_nros_selection = { path = "build/nros/selection" }
example_interfaces = { path = "generated/example_interfaces", default-features = false }
log = "0.4"
env_logger = "0.11"
heapless = "0.8"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
# The generated action package declares these nros crates by registry name
# (`nros-rmw` unconditionally for RosAction protocol types, `nros-rmw-cyclonedds`
# as an optional feature dep), and nano-ros publishes nothing to crates.io — so
# without a redirect any RE-resolution fails `no matching package named
# nros-rmw-cyclonedds`. The committed lock predated the optional dep and hid it.
# RFC-0067 D1 retires the MESSAGE-crate patches only; nros-* keep theirs.
nros-rmw = { path = "../../../../core/nros-rmw" }
nros-rmw-cyclonedds = { path = "../../../../rmw/cyclonedds/nros-rmw-cyclonedds" }
