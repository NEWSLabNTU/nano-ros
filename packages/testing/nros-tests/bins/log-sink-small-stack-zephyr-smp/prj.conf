# Issue 2738 -- the log sink's buffers are the SINK's, not the logging
# thread's. Deferred mode: the mode the pool's claim-format-log-release cycle
# is designed around, and the one where Zephyr's own log core does not run on
# the caller's stack.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
# Large enough that the 50 records the thread logs never drop for want of
# log buffer: a drop must mean the thread died, not that Zephyr ran short.
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_PRINTK=y

# The logging thread reports how deep its stack went: INIT_STACKS paints it,
# k_thread_stack_space_get reads the high-water mark. The SENTINEL stays as a
# backstop, but it cannot be the verdict: the old sink's 1280-byte buffer is
# written from its low end, so an overflow skips the sentinel word entirely.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y

# nros module -- C API only; zenoh satisfies `choice NROS_RMW_BACKEND`, and
# no RMW API is called.
CONFIG_NROS=y
CONFIG_NROS_C_API=y
CONFIG_NROS_RMW_ZENOH=y

CONFIG_POSIX_THREADS=y
CONFIG_POSIX_API=y
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16

# zpico_zephyr.c references `iface->config.ip`, gated on CONFIG_NET_IP.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y
# The network stack seeds from sys_rand_get; qemu_cortex_a53 has no entropy
# device, so link the test generator (as nros-board-qemu-cortex-a53 does).
CONFIG_TEST_RANDOM_GENERATOR=y
# The harness attaches `-nic user,model=e1000`; at the default 1500 the RX
# thread overflows about 1 s after boot under slirp, whichever sink is built.
CONFIG_NET_RX_STACK_SIZE=4096
