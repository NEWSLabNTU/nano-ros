# The negative control: the sink formats every record in a 1280-byte buffer
# on the stack of the thread that logged, as it did before issue 2738. The
# thread's stack use must exceed the budget the pool image is held to; if it
# does not, the budget cannot tell the two sinks apart and the cell proves
# nothing.
CONFIG_NROS_ZEPHYR_LOG_SINK_BUFFERS=0
