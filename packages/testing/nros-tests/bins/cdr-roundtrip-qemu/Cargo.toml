[workspace]

[package]
name = "qemu-rs-test"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "qemu-rs-test"
test = false
bench = false

[dependencies]
nros = { path = "../../../../../packages/api/nros", default-features = false }
std_msgs = { path = "generated/std_msgs", default-features = false }
builtin_interfaces = { path = "generated/builtin_interfaces", default-features = false }

cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
heapless = "0.8"

[build-dependencies]
# phase-471 W4 — the linker-script emit, shared. Zero-dependency and
# host-only, so this edge adds one compile unit and nothing behind it.
nros-build-paths = { path = "../../../../tooling/nros-build-paths" }
