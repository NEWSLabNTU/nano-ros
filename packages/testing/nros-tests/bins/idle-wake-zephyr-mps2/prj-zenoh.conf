# Zephyr-native settings the zenoh image needs -- named by
# `[image.zephyr_zenoh] conf` in system.toml, which the nano-ros module adds
# to the build. The RMW choice and every nano-ros knob are the image's
# (phase-481, RFC-0098 D10/D11): never `CONFIG_NROS_*` here.

CONFIG_NET_TCP=y
CONFIG_POSIX_API=y
# 64, not 32 — the build derives a floor and refuses below it; see
# `_nros_mutex_floor` in `zephyr/cmake/nros_cargo_build.cmake`.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Stack, heap and network buffer sizes come from the board's own fragment
# (packages/boards/nros-board-mps2-an385-zephyr/prj.conf), which merges after
# this one; a value here would be dead (`check-kconfig-overridden-values`).
