# phase-521 W7 (RFC-0113 D2) -- the idle-wake witness, one image per RMW. The
# board is the mps2/an385 board package (the leaf exists only for that board;
# phase-531 W6 -- a workspace image declares its board, and the build passes
# no `-b`). The fixture rows author the isolation values (router locator,
# agent port).

[system]
name = "nros_idle_wake_witness_c"
rmw = "zenoh"
domain_id = 0
default_images = ["zephyr_zenoh"]

[[component]]
pkg = "nros_idle_wake_witness_c"
class = "nros_idle_wake_witness_c::Witness"
name = "witness"
# Its sources call Zephyr directly (`k_cycle_get_32`, the devicetree), so they
# cannot build for the host and no census can count them (RFC-0120 D4). What
# it creates, stated: one /chatter subscription and one timer.
entities = ["subscription:std_msgs/msg/String:/chatter", "timer"]

[image.zephyr_zenoh]
board = "mps2-an385-zephyr"
rmw = "zenoh"
os_config = ["prj-zenoh.conf"]

[image.zephyr_xrce]
board = "mps2-an385-zephyr"
rmw = "xrce"
os_config = ["prj-xrce.conf"]
# An mps2/an385 guest reaches the host through QEMU's user network at
# 10.0.2.2; the fixture row sets the port (`west_xrce_agent_port`).
locator = "udp/10.0.2.2:2018"
# One subscription, no services; sized as the C listener's xrce image is
# (issue 1033 / issue 1761).
[image.zephyr_xrce.knobs.xrce]
max_subscribers = 1
max_service_servers = 6  # 0 of its own + the six parameter services of its node
max_service_clients = 0

[image.zephyr_xrce.knobs.zephyr]
# The arena default the parameter services had when this was stated (196608) plus
# the 32 KiB this image stated above the plain default (65536) before
# the stock interfaces: the six parameter service slots in the XRCE session
# state are about 27 KiB, inside the 128 KiB the capability default adds.
heap_size = 229376
