# phase-521 W7 (RFC-0113 D2) -- the idle-wake witness on Zephyr's own IP stack
# (mps2/an385). The listener's base config, plus Zephyr's user tracing hooks:
# the component counts how often the thread running the executor is switched
# in, which is the number of times it woke.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=n

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_DNS_RESOLVER=n

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
CONFIG_STD_CPP17=y

# `sys_trace_thread_switched_in_user` (src/Witness.c) is the counter.
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
