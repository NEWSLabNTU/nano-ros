# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "isr-wake-threadx-riscv64"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Issue 2706 — a ThreadX RISC-V tick interrupt wakes a parked executor"

[[bin]]
name = "isr-wake-threadx-riscv64"
test = false
bench = false

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW and
# edition features come from the adapter.
nros-board-threadx-qemu-riscv64 = { path = "../../../../../../boards/nros-board-threadx-qemu-riscv64", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
isr_wake_threadx_riscv64_nros_derived = { path = "../../generated/nros-derived/isr-wake-threadx-riscv64" }
nros = { path = "../../../../../../api/nros", default-features = false, features = ["rmw-cffi"] }
nros-node = { path = "../../../../../../core/nros-node", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-rmw-zenoh = { path = "../../../../../../rmw/zenoh/nros-rmw-zenoh", features = ["platform-threadx"] }
nros-platform = { path = "../../../../../../platform/nros-platform", default-features = false, features = ["platform-threadx", "global-allocator", "critical-section"] }

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
opt-level = "s"
