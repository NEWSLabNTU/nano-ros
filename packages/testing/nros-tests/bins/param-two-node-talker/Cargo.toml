[workspace]

[package]
name = "param-two-node-talker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Two-node parameter fixture (phase-426 W6). One executor composes `alpha` and `beta`; both declare the same parameter name with different values, and `alpha` additionally declares a step-constrained one. Registers the REP-2002 parameter services, which phase-426 W3 publishes once PER NODE. Consumed by tests/params_per_node_interop.rs, which drives `ros2 param list/get/set` against both fully-qualified names."

[[bin]]
name = "param-two-node-talker"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# generated selection package links the image's backend (issue 1305).

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    # phase-361 W8.e — `param-services` requires the heap; it no longer enables it.
    "log", "alloc", "env",
    "rmw-cffi",
    "param-services",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
param_two_node_talker_nros_selection = { path = "build/nros/selection" }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
