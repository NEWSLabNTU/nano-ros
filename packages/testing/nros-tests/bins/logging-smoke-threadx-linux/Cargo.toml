[workspace]

[package]
name = "logging-smoke-threadx-linux"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "ThreadX Linux nros-log smoke fixture"

[[bin]]
name = "logging-smoke-threadx-linux"
test = false
bench = false

[dependencies]
# The image's board crate and the crates its board implies — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board. `main.rs` reaches the board through it.
logging_smoke_threadx_linux_nros_selection = { path = "build/nros/selection" }
nros-log = { path = "../../../../core/nros-log" }
