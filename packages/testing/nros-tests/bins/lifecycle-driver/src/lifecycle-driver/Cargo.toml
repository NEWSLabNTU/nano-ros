# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "lifecycle-driver"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Test fixture: drives one managed node through configure, activate and deactivate with nano-ros lifecycle_msgs service clients, and counts the std_msgs/Int32 messages it publishes on /chatter in each state. The host test asserts on what it prints, so an embedded managed node's lifecycle is checked with no ROS 2 install."

[[bin]]
name = "lifecycle-driver"
path = "src/main.rs"

[dependencies]
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`). Its RMW and edition features come from the adapter.
nros-board-linux = { path = "../../../../../../boards/nros-board-linux", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
lifecycle_driver_nros_derived = { path = "../../generated/nros-derived/lifecycle-driver" }
nros = { path = "../../../../../../api/nros", default-features = false, features = [
    "log", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The core pre-generated lifecycle messages (committed, path dep, no version).
nros-lifecycle-msgs = { path = "../../../../../../interfaces/generated/humble/nros-lifecycle-msgs" }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../../../core/nros-core" }
nros-serdes = { path = "../../../../../../core/nros-serdes" }
