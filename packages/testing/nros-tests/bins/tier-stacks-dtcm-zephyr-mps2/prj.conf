# Issue 2084 -- the tier pool must follow CONFIG_NROS_ZEPHYR_STACKS_IN_DTCM
# into the devicetree's DTCM region. CONFIG_NROS_ZEPHYR_TIER_STACKS_IN_DTCM is
# left to its default (it follows the task-stack knob), which is the rule
# under test. One 64 KiB tier slot, the size the MR-CANHUBK344 level needs.
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_NROS=y
CONFIG_NROS_C_API=y
CONFIG_NROS_RMW_ZENOH=y
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NROS_ZEPHYR_STACKS_IN_DTCM=y
CONFIG_NROS_ZEPHYR_MAX_TIERS=1
CONFIG_NROS_ZEPHYR_TIER_STACK_SIZE=65536
CONFIG_NROS_ZEPHYR_TASK_STACK_SIZE=8192
