[workspace]

[package]
name = "constrained-link-probe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Constrained-link zenoh witness (issue 2163, phase-473 W1/W2). Late-joins a stock latched std_msgs/Int32 publisher with a TRANSIENT_LOCAL (or, for the negative control, VOLATILE) subscription and prints `CLP_RECEIVED <n>` per sample, then asks the graph for its node names and prints `CLP_GRAPH_NODES <count>` or `CLP_GRAPH_UNSUPPORTED`. Built twice: graph discovery on (`linux`) and compiled out (`linux_no_graph`)."

[[bin]]
name = "constrained-link-probe"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# generated selection package links the image's backend (issue 1305).

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "log", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate, its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305).
constrained_link_probe_nros_selection = { path = "build/nros/selection" }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
