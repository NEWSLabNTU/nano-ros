# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "condvar-contract-threadx-linux"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Issue 1906: the platform condvar contract on ThreadX Linux"

[[bin]]
name = "condvar-contract-threadx-linux"
test = false
bench = false

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW comes from
# the adapter; `image-runtime` (the image's `#[global_allocator]`) is the
# board descriptor's `board_features`, which an owned entry names itself.
nros-board-threadx-linux = { path = "../../../../../../boards/nros-board-threadx-linux", default-features = false, features = ["image-runtime"] }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
condvar_contract_threadx_linux_nros_derived = { path = "../../generated/nros-derived/condvar-contract-threadx-linux" }
nros-condvar-contract = { path = "../../../../../nros-condvar-contract" }
nros-log = { path = "../../../../../../core/nros-log" }
