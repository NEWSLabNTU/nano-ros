# What this fixture deploys to (RFC-0098 D3/D5): the same schema the C++
# talker example carries. `find_package(nano_ros)` reads it through `nros ws
# leaf-system`, which derives the platform (`native`) from the board.

[system]
name = "contract_monitor_cpp"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "contract_monitor_cpp"
class = "contract_monitor_cpp::Pub"
name = "pub"

# Host build. The locator and domain stay runtime env on native
# (`NROS_LOCATOR` / `ROS_DOMAIN_ID`); the board applies only the node name.
[image.native]
board = "native"
