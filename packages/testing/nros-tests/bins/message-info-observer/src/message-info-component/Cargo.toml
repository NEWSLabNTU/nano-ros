# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]

[package]
name = "message-info-component"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Component-API MessageInfo observer (issue 2349). A Component + ExecutableNode whose subscription asks for the message metadata and prints it from CallbackCtx::message_info(), in the same line format as message-info-observer."

[[bin]]
name = "message-info-component"
path = "src/main.rs"

# The OWNED entry of `message_info_observer_bringup`'s `linux_component` image
# (RFC-0071 D19). The RMW is an IMAGE fact (`system.toml`); the adapter
# `nros build` generates turns on the board's backend.

[dependencies]
nros = { path = "../../../../../../api/nros", default-features = false, features = [
    "log", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`). Its RMW and edition features come from the adapter.
nros-board-linux = { path = "../../../../../../boards/nros-board-linux", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
message_info_component_nros_derived = { path = "../../generated/nros-derived/message-info-component" }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../../../core/nros-core" }
nros-serdes = { path = "../../../../../../core/nros-serdes" }
