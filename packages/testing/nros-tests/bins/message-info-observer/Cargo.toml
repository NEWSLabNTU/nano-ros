[workspace]

[package]
name = "message-info-observer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Receive-side MessageInfo observer (issue 0441). Subscribes to NROS_SUB_TOPIC (default /chatter) typed std_msgs/String through the executor's `.message_info()` builder and prints `seq=<n> gid=<hex> ts=<t>` per message. Exists because CallbackCtx exposes no MessageInfo, so no example written against the Node API can observe the receive path the zero-copy trampoline changes."

[[bin]]
name = "message-info-observer"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# generated selection package links the image's backend (issue 1305).

[features]
# issue 0441 — the zero-copy receive path. This is the ONLY axis this bin
# varies: the same `seq=`/`gid=` line must appear with and without it, which is
# what makes the pair a trampoline check rather than two unrelated runs.
# phase-347 W1 — forwards to the BACKEND; the `nros` route was a no-op. Not a
# declared capability (`capability_resolver::CAPABILITIES` has no entry), so it
# stays a feature of this package, as on `examples/linux/rust/listener`.
unstable-zenoh-api = ["dep:nros-rmw-zenoh", "nros-rmw-zenoh/unstable-zenoh-api"]

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "log", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
message_info_observer_nros_selection = { path = "build/nros/selection" }
# Only for the feature above; the selection package links the backend.
nros-rmw-zenoh = { path = "../../../../rmw/zenoh/nros-rmw-zenoh", default-features = false, optional = true }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
