# What this probe deploys to (RFC-0098 D3/D5, phase-445 W3) — the same schema
# a workspace bringup uses, and the same file a Rust leaf writes. Replaces the
# `package.xml` `<nano_ros deploy="native"/>` tuple: `find_package(nano_ros)`
# reads this through `nros ws leaf-system`, which derives the platform from the
# board.

[system]
name = "action_raw_goal_probe"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "action_raw_goal_probe"
class = "action_raw_goal_probe::RawGoalProbe"
name = "raw_goal_probe"

# Host build.
[image.native]
board = "native"
