[workspace]

[package]
name = "service-info-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Service response-info observer (issue 2136). Calls example_interfaces/AddTwoInts on /add_two_ints through `Promise::wait_with_info` and prints `RESPONSE_INFO guid=<hex> seq=<n> source_ts=<ns> received_ts=<ns>` per reply — the backend's take_response_with_info answer, which no example written against the Node API reads."

[[bin]]
name = "service-info-client"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# generated selection package links the image's backend (issue 1305).

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "log", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
service_info_client_nros_selection = { path = "build/nros/selection" }
example_interfaces = { path = "generated/example_interfaces", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
