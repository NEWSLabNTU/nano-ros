[workspace]

[package]
name = "logging-smoke-threadx-riscv64"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 88.15.d — ThreadX RISC-V QEMU nros-log smoke fixture"

[[bin]]
name = "logging-smoke-threadx-riscv64"
test = false
bench = false

[dependencies]
# Board crate's `run()` registers a UART writer with the
# ThreadX platform's log fn-ptr slot (Phase 88.11). Has a hard
# dep on a `[network]` block in the config TOML, so the fixture
# supplies a slirp-style default.
# The image's board crate and the crates its board implies — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board. `main.rs` reaches the board through it.
logging_smoke_threadx_riscv64_nros_selection = { path = "build/nros/selection" }
nros-log = { path = "../../../../core/nros-log", default-features = false }

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
opt-level = "s"
