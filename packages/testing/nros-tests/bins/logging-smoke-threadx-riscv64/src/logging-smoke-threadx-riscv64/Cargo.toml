# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "logging-smoke-threadx-riscv64"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 88.15.d — ThreadX RISC-V QEMU nros-log smoke fixture"

[[bin]]
name = "logging-smoke-threadx-riscv64"
test = false
bench = false

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW and
# edition features come from the adapter.
nros-board-threadx-qemu-riscv64 = { path = "../../../../../../boards/nros-board-threadx-qemu-riscv64", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
logging_smoke_threadx_riscv64_nros_derived = { path = "../../generated/nros-derived/logging-smoke-threadx-riscv64" }
nros-log = { path = "../../../../../../core/nros-log", default-features = false }

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
opt-level = "s"
