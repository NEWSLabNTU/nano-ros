[workspace]

[package]
name = "sim-clock-listener"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "A node with `use_sim_time` true and TWO timers of the same period — one ROS-time, one wall (phase-425 W5). Prints both counts once per real second, so a paired sim-clock-publisher can be observed driving one and not the other. The pair is the phase's end-to-end evidence: every other sim-time test installs a ROS time by calling the setter."

[[bin]]
name = "sim-clock-listener"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# generated selection package links the image's backend (issue 1305).

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "std", "alloc", "env",
    "rmw-cffi",
    # The two under test. `param-services` because `use_sim_time` is a
    # PARAMETER — the seam W3b hooks is `Executor::declare_parameter`, which
    # lives behind it.
    "sim-time",
    "param-services",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
sim_clock_listener_nros_selection = { path = "build/nros/selection" }
# The COMMITTED bindings, not a `generated/` tree: `rosgraph_msgs` is one of the
# core pre-generated interface packages (phase-425 W2), so this leaf needs no
# per-host message codegen (its `nros sync` writes only the selection package).
nros-rosgraph-msgs = { path = "../../../../interfaces/generated/humble/nros-rosgraph-msgs", default-features = false }
# Named directly because the generated crate does not re-export its own deps —
# `Clock`'s one field is a `builtin_interfaces/Time`, and the `-clock` suffix is
# the rename that keeps two generated copies of builtin_interfaces from
# colliding in one workspace (phase-425 W2).
nros-builtin-interfaces = { path = "../../../../interfaces/generated/humble/nros-builtin-interfaces", default-features = false }
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
