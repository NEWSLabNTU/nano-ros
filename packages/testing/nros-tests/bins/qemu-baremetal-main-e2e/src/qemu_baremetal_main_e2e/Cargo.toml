# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]

[package]
name = "qemu_baremetal_main_e2e"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 244.D1 — bare-metal nros::main!() BoardEntry E2E fixture for QEMU MPS2-AN385"

# Self-contained standalone fixture (issue 0100): `lib.rs` IS the node
# (`nros::node!(E2eNode)` emits `register`); `main.rs` is the `nros::main!()`
# Form-1 Entry dispatching to this same crate's `register`.
[[bin]]
name = "qemu_baremetal_main_e2e"
path = "src/main.rs"
test = false
bench = false

[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board.

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW and
# edition features come from the adapter.
nros-board-mps2-an385 = { path = "../../../../../../boards/nros-board-mps2-an385", default-features = false, features = ["board-entry"] }
# `panic = "own"`: the board's crate-root panic provider is this image's
# handler (its descriptor's `own_panic_root_*`), and an owned entry links it
# itself. `exit` ends the QEMU run on a panic instead of hanging it.
panic-semihosting = { version = "0.6", features = ["exit"] }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
qemu_baremetal_main_e2e_nros_derived = { path = "../../generated/nros-derived/qemu_baremetal_main_e2e" }
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
