[package]
name = "qemu-baremetal-main-e2e"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 244.D1 — bare-metal nros::main!() BoardEntry E2E fixture for QEMU MPS2-AN385"

[[bin]]
name = "qemu-baremetal-main-e2e"
test = false
bench = false

# Self-contained standalone fixture (issue 0100): `lib.rs` IS the node
# (`nros::node!(E2eNode)` emits `register`); `main.rs` is the `nros::main!()`
# Form-1 Entry dispatching to this same crate's `register`.
[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board.

[dependencies]
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble", "macros"] }
# Phase 244.D1 enabler — `board-entry` pulls the `nros_platform::BoardEntry`
# impl so `nros::main!(deploy = "qemu-mps2-an385")` can drive this board.
nros-board-mps2-an385 = { version = "*", features = ["board-entry"] }
# Linked RMW backend (force-linked; self-registers via the macro's
# `__register_linked_rmw()` on `target_os = "none"`).
nros-rmw-zenoh = { version = "*", features = ["platform-bare-metal", "ros-humble"] }

# Bare-metal Cortex-M entry: `nros::main!()` emits `#[cortex_m_rt::entry]` for
# the `qemu-mps2-an385` deploy; the reset trampoline halts via `cortex_m::asm`.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-semihosting = { version = "0.6", features = ["exit"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[workspace]
