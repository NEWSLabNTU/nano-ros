[package]
name = "qemu-baremetal-main-e2e"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 244.D1 — bare-metal nros::main!() BoardEntry E2E fixture for QEMU MPS2-AN385"

[[bin]]
name = "qemu-baremetal-main-e2e"
test = false
bench = false

# Self-contained standalone fixture (issue 0100): `lib.rs` IS the node
# (`nros::node!(E2eNode)` emits `register`); `main.rs` is the `nros::main!()`
# Form-1 Entry dispatching to this same crate's `register`.
[lib]
crate-type = ["rlib"]

# The board, network identity and node declaration live in `system.toml` beside
# this manifest (RFC-0098 D3/D5) — nothing here names a board.

[dependencies]
nros = { version = "*", default-features = false, features = ["alloc", "rmw-cffi", "macros"] }
# The image's board crate (with the `board-entry` surface `nros::main!` drives),
# its RMW backend, the Cortex-M runtime and the board's panic provider —
# GENERATED by `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue
# 1305). `nros::main!` reaches the board through it, and so does the node:
# `lib.rs` calls `<this>::nros_board_mps2_an385::exit_success()`, board code the
# test needs, reached through the selection's re-export the way the mps2 C mains
# reach `run_bare`.
qemu_baremetal_main_e2e_nros_selection = { path = "build/nros/selection" }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[workspace]
