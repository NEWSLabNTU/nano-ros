# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "pool-exhaustion-threadx-linux"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "issue 0697 — the zenoh session-pool exhaustion arm, executed on a no_std target"

[[bin]]
name = "pool-exhaustion-threadx-linux"
test = false
bench = false

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW comes from
# the adapter; `image-runtime` (the image's `#[global_allocator]`) is the
# board descriptor's `board_features`, which an owned entry names itself.
nros-board-threadx-linux = { path = "../../../../../../boards/nros-board-threadx-linux", default-features = false, features = ["image-runtime"] }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
pool_exhaustion_threadx_linux_nros_derived = { path = "../../generated/nros-derived/pool-exhaustion-threadx-linux" }
nros-log = { path = "../../../../../../core/nros-log", default-features = false }
# `platform-threadx`, not `platform-posix`: the point of this fixture is that the
# arm runs on a `no_std` target, and the posix flavour would be a second
# implementation of the platform layer (ARCHITECTURE §2).
nros-rmw-zenoh = { path = "../../../../../../rmw/zenoh/nros-rmw-zenoh", default-features = false, features = ["platform-threadx"] }
# The raw pool handle, to establish the PRECONDITION (a full pool) without a
# network. The arm under test is still reached through `Context::new`.
zpico-sys = { path = "../../../../../../rmw/zenoh/zpico-sys", default-features = false }
