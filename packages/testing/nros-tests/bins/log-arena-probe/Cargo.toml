[workspace]

[package]
name = "log-arena-probe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "phase-479 W5 / RFC-0102 D5 — the runtime-logger arena knob's acceptance fixture. Built for the `native` board (which states `[board.knobs.log] dynamic_loggers = 32`) with an `[image.native] env` that states NROS_LOG_DYNAMIC_LOGGERS=24, so the capacity it reports says which rung won. Creates a few runtime loggers and keeps its boot record live for `tests/log_arena_knob.rs`."

[[bin]]
name = "log-arena-probe"
path = "src/main.rs"

[dependencies]
nros-log = { path = "../../../../core/nros-log" }
# The boot record (`nros_node::boot_report`), enabled by the image's
# `NROS_BOOT_REPORT=1`. Nothing else of the node layer is used.
nros-node = { path = "../../../../core/nros-node", default-features = false, features = ["std"] }
# The POSIX `nros_platform_*` symbols the core links against.
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
