# phase-479 W5 (RFC-0102 D5) — the acceptance fixture for NROS_LOG_DYNAMIC_LOGGERS.
#
# The `native` board states `[knobs.log] dynamic_loggers = 32`
# (packages/boards/linux/nros-board.toml). This image states 24 through the
# RFC-0049 APP rung, which must win, and `tests/log_arena_knob.rs` asserts the
# capacity the built binary reports. 24 is deliberately neither the board's
# number nor the builtin 16, so a result of either names the rung that leaked.
#
# issue 1037 — the rest of the `[knobs.log]` tenant, each at a value that is
# not its builtin (info/384/6/12 against trace/256/4/16; 384, 6 and 12 are no
# old feature member either), so the probe's second line names the rung that
# won.

[system]
name = "log_arena_probe"
rmw = "zenoh"
domain_id = 0

[image.linux]
board = "linux"
env = { NROS_BOOT_REPORT = "1" }

[image.linux.knobs.log]
dynamic_loggers = 24
max_level = "info"
buffer_size = 384
early_records = 6
rosout_records = 12
