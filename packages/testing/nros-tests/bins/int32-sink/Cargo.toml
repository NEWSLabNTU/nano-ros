[workspace]

[package]
name = "int32-sink"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Generic std_msgs/Int32 observer fixture (extracted from the examples/linux/rust/listener `NROS_SUB_TOPIC` escape hatch in phase-277 W4, when the example flipped to the official std_msgs/String chatter). Subscribes to the Int32 topic named by `NROS_SUB_TOPIC` (default `/chatter`) and prints `Received: N` per message. Used by the service/action/param/safety/realtime e2e tests as a cross-process sink for Int32 side topics (/sum, /fib_result, /safe_ok, /ctrl, /telem, ...)."

[[bin]]
name = "int32-sink"
path = "src/main.rs"

# The RMW is an IMAGE (`system.toml`, RFC-0031), not a cargo feature: the
# generated selection package links the image's backend (issue 1305).

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "log", "alloc", "env",
    "rmw-cffi",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
# The image's board crate (`nros_board_linux::register_linked_rmw()`, called
# first thing in `main`), its RMW backend and its ROS edition — GENERATED by
# `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so
# this manifest names no board, RMW or edition. `main.rs` reaches the board
# through it.
int32_sink_nros_selection = { path = "build/nros/selection" }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
