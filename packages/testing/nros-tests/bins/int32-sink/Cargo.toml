[workspace]

[package]
name = "int32-sink"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Generic std_msgs/Int32 observer fixture (extracted from the examples/native/rust/listener `NROS_SUB_TOPIC` escape hatch in phase-277 W4, when the example flipped to the official std_msgs/String chatter). Subscribes to the Int32 topic named by `NROS_SUB_TOPIC` (default `/chatter`) and prints `Received: N` per message. Used by the service/action/param/safety/realtime e2e tests as a cross-process sink for Int32 side topics (/sum, /fib_result, /safe_ok, /ctrl, /telem, ...)."

[[bin]]
name = "int32-sink"
path = "src/main.rs"

[features]
# phase-338 W3 — RMW selected at build time via mutually exclusive features
# (same shape as the examples and as `action-client-multigoal`). This bin was
# hardcoded to zenoh, which made it unusable as the XRCE half of the
# zenoh->xrce bridge e2e and forced that test to keep driving the EXAMPLE with
# a test-only `NROS_SUB_TYPE` env switch. A test fixture must not pin the RMW
# any more than an example does.
default = ["rmw-zenoh"]
rmw-zenoh = ["dep:nros-rmw-zenoh", "nros-board-linux/rmw-zenoh"]
rmw-xrce = ["dep:nros-rmw-xrce-cffi", "nros-board-linux/rmw-xrce"]
# issue 0449 — the cyclone half. Without it the zenoh->cyclonedds bridge e2e
# had to drive `examples/native/c/listener` with an `NROS_SUB_TYPE=int32` env
# switch, which is why that example carried a type switch no ROS demo has.
rmw-cyclonedds = ["nros/rmw-cyclonedds", "dep:nros-rmw-cyclonedds-sys", "nros-board-linux/rmw-cyclonedds"]

[dependencies]
nros = { path = "../../../../api/nros", default-features = false, features = [
    "std", "alloc", "env",
    "rmw-cffi",
    "ros-humble",
] }
nros-platform-cffi = { path = "../../../../platform/nros-platform-cffi", features = ["posix-c-port"] }
nros-board-linux = { path = "../../../../boards/nros-board-linux", default-features = false }
nros-rmw-zenoh = { path = "../../../../rmw/zenoh/nros-rmw-zenoh", default-features = false, features = [
    "std",
    "platform-posix",
    "ros-humble",
], optional = true }
nros-rmw-xrce-cffi = { path = "../../../../rmw/xrce/nros-rmw-xrce-cffi", default-features = false, features = [
    "std",
], optional = true }
nros-rmw-cyclonedds-sys = { path = "../../../../rmw/cyclonedds/nros-rmw-cyclonedds-sys", features = [
    "platform-posix",
], optional = true }
std_msgs = { path = "generated/std_msgs", default-features = false }
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
nros-core = { path = "../../../../core/nros-core" }
nros-serdes = { path = "../../../../core/nros-serdes" }
