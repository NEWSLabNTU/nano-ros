# The `acme` backend's descriptor (RFC-0071 D1/D7). A third party writes this
# file; the nano-ros toolchain lowers it. The names come from `package.xml`.
[rmw]
cpp_define = "NROS_RMW_ACME"

# RFC-0071 D17 (issue 2381) -- acme speaks zenoh, so `nros run --router auto`
# starts (or reuses) a zenoh router for it. nros reads this, never the name.
[rmw.host]
peer = "zenoh-router"

# Issue 2372 -- on Zephyr, acme is built over the module's zenoh backend: the
# image selects `CONFIG_NROS_RMW_ZENOH`, so the module compiles zenoh-pico's
# Zephyr port, which acme's zenoh delegate links against.
[rmw.zephyr]
module_backend = "zenoh"

# RFC-0071 D11/D15 — the image links this crate itself (no in-tree board has an
# `rmw-acme` feature) and registers the backend as `acme_rmw::register()`.
[rmw.provides.cargo]
crate = "acme-rmw"
register = "register"

# The board descriptor's `platform_feature`, passed through when this crate
# declares it.
[rmw.provides.cargo.platform_features]
platform-posix = "platform-posix"
platform-zephyr = "platform-zephyr"

[rmw.link]
rlib_dep = "acme-rmw"
edition_feature = "ros-{edition}"
needs_cxx_linker = false
