[package]
name = "talker_pkg"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node pkg — publishes std_msgs/String on /chatter."

[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "talker_pkg::Talker"
name = "talker"

# The node names no RMW: the image picks it (`rmw = "acme"` in the bringup).
[dependencies]
nros = { version = "*", default-features = false, features = ["alloc", "log", "rmw-cffi", "macros"] }
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
log = "0.4"
