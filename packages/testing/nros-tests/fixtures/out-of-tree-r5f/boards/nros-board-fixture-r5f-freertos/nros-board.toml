# Board definition for `fixture-r5f-freertos`: a test fixture, not a real board
# (phase-575 W2, phase-577 W8). It stands for a hard-float Cortex-R5F under
# FreeRTOS, kept outside nano-ros and reached through NROS_EXTRA_BOARD_PATH.
#
# What makes it an out-of-tree board package (RFC-0135 D2):
#   - its CMake module ships here, `cmake/nano-ros-board-fixture-r5f-freertos.cmake`,
#     and `nros build` names it on the configure line;
#   - its vendor SDK is named through the package's own variable,
#     FIXTURE_R5F_SDK_ROOT, never fetched and never an SDK-index row;
#   - the core's profile is nano-ros's in-tree `[arch.cortex-r5f]`, and the
#     toolchain file is nano-ros's `cmake/toolchain/arm-freertos-armcr5f.cmake`.
[[board]]
names = ["fixture-r5f-freertos"]
cmake_module = "fixture-r5f-freertos"
platform = "freertos"
toolchain = "stable"
entry_kind = "board-run"
supported_netstacks = ["lwip"]
# The board crate is this package's own directory (`crate_path` defaults to it).
board_crate = "nros-board-fixture-r5f-freertos"
# The cargo half: the triple, the link script, and the board's own FreeRTOS
# port and config dir. `${board_dir}` is this package's directory (RFC-0135 D2).
cargo_config = '''
[build]
target = "armv7r-none-eabihf"

[target.armv7r-none-eabihf]
rustflags = [
    "-C", "link-arg=-Tfixture_r5f.ld",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=--gc-sections",
]

[env]
CC_armv7r_none_eabihf = "arm-none-eabi-gcc"
FREERTOS_PORT = { value = "GCC_ARM_CRX_NOGIC", force = true }
FREERTOS_CONFIG_DIR = { value = "${board_dir}/config", force = true }
'''

# Hardware only: no `[board.run]`, so nano-ros runs nothing itself, and the
# image's output is the SDK's debug UART (ZynqMP UART0) on a serial adapter.
[board.console]
kind = "serial"

# How `nros::main!` names this board's type; `nros build` hands it to the
# generated entry (RFC-0135 D2).
[board.entry]
type = "::nros_board_fixture_r5f_freertos::FixtureR5f"

[board.capabilities]
heap = true
atomics = true
threads = true

[board.cmake]
# Relative to the nano-ros tree: the toolchain file is nano-ros's.
toolchain_file = "cmake/toolchain/arm-freertos-armcr5f.cmake"

[board.net]
stack = "board"
links = ["tcp", "udp"]

[board.provisioning]
# Index packages this board needs (RFC-0135 D3, phase-577 W10). The vendor
# SDK is not one: it is FIXTURE_R5F_SDK_ROOT.
tools = ["arm-none-eabi-gcc"]

# The same board, built the way TI's Processor SDK builds an R5F: every C
# translation unit (nano-ros's, zenoh-pico, lwIP, the FreeRTOS kernel, this
# package's) by TI Arm Clang, the Rust staticlib by rustc, the image linked by
# TI's tiarmlnk with `config/fixture_r5f.cmd` (phase-575 W3). C and C++ images;
# a Rust image's link is rustc's, which this board does not configure.
#
# TI Arm Clang is licence-gated (`[gated.ti-arm-clang]` in nano-ros's SDK
# index): it is never fetched, `TI_ARM_CLANG_ROOT` names an install, and its
# `bin/` must be on PATH for the cargo road's C builds below.
[[board]]
names = ["fixture-r5f-tiarmclang"]
cmake_module = "fixture-r5f-tiarmclang"
platform = "freertos"
toolchain = "stable"
entry_kind = "board-run"
supported_netstacks = ["lwip"]
board_crate = "nros-board-fixture-r5f-freertos"
# cc-rs passes `--target=armv7r-none-eabihf`, which tiarmclang refuses for
# vendor `ti`; a later --target wins, so the CPU flags and TI's own triple
# follow. `__STDC_WANT_LIB_EXT1__`: TI's libc offers strnlen only as C11
# Annex K's strnlen_s.
cargo_config = '''
[build]
target = "armv7r-none-eabihf"

[env]
CC_armv7r_none_eabihf = "tiarmclang"
AR_armv7r_none_eabihf = "tiarmar"
CFLAGS_armv7r_none_eabihf = "--target=arm-ti-none-eabihf -mcpu=cortex-r5 -mfpu=vfpv3-d16 -mfloat-abi=hard -D__STDC_WANT_LIB_EXT1__=1"
FREERTOS_PORT = { value = "GCC_ARM_CRX_NOGIC", force = true }
FREERTOS_CONFIG_DIR = { value = "${board_dir}/config", force = true }
'''

[board.console]
kind = "serial"

[board.entry]
type = "::nros_board_fixture_r5f_freertos::FixtureR5f"

[board.capabilities]
heap = true
atomics = true
threads = true

[board.cmake]
toolchain_file = "cmake/toolchain/arm-freertos-tiarmclang-cr5f.cmake"

[board.net]
stack = "board"
links = ["tcp", "udp"]

[board.provisioning]
# The kernel, lwIP and zenoh-pico sources come from nano-ros's store as for
# the GCC board; the compiler is `[gated.ti-arm-clang]`, which setup checks
# and never installs.
tools = []
