# What this example deploys to (RFC-0098 D3/D5, phase-445 W3) — the same
# schema a workspace bringup uses. Switching board is editing `[image.*] board`
# and re-running `nros configure`.

[system]
name = "freertos_rs_talker"
rmw = "zenoh"
domain_id = 0

[[component]]
pkg = "freertos_rs_talker"
class = "freertos_rs_talker::Talker"
name = "talker"

# The fixture board. The locator is the ENTRY's role port — what the
# e2e harness binds zenohd to (phase-338 W2).
[image.fixture-r5f-freertos]
board = "fixture-r5f-freertos"
locator = "tcp/192.0.3.1:7447"

# RFC-0140 D5/G6 (phase-581 W3) -- a knob the BOARD PACKAGE declares, stated
# exactly as a core one; the board crate's build script reads it.
[image.fixture-r5f-freertos.knobs.fixture_r5f_freertos]
uart_rx_slots = 3

[board_config."fixture-r5f-freertos"]
netstack = "lwip"
