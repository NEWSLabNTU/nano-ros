# Issue 1036 — a console-less image that exhausts its executor arena on
# purpose, so the boot report is the only witness. Merged after the talker's
# own prj.conf by the `build-cortex-m-c-boot-report-zenoh` fixture row; read
# by `zephyr_cortex_m_c_boot_report_names_arena_exhaustion`, which dumps the
# record over the QEMU monitor and decodes it with scripts/read-boot-report.py.
#
# No console and no log stream: this is the board the record exists for (the
# MR-CANHUBK344's console UART is not wired). CONFIG_PRINTK stays on because
# the board selects it; with no console it has no sink.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_EARLY_CONSOLE=n
CONFIG_LOG=n
CONFIG_NET_LOG=n

CONFIG_NROS_BOOT_REPORT=y
CONFIG_NROS_ARENA_EXHAUSTION_IS_FATAL=y
# The arena itself (32 B: the talker's first registration claims 48 B, so it is
# exhausted on the first entity, short by 16) is a KNOB, and the talker has a
# system.toml, so a conf line cannot set it (phase-484 W5b, RFC-0103 D2a): the
# fixture row passes -DNROS_OVERRIDE_EXECUTOR_ARENA_SIZE=32 (`west_overrides`).
