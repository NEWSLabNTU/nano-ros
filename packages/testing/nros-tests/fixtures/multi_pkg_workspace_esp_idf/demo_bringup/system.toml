# Phase 212.H.5 fixture — system spec (Path A bringup, no Cargo.toml).
[system]
name      = "demo"
rmw       = "xrce"
domain_id = 0

[[component]]
pkg  = "talker_pkg"
class = "talker_pkg::talker"
name = "talker"

[[component]]
pkg  = "listener_pkg"
class = "listener_pkg::listener"
name = "listener"

# Issue 0951 — a BOARD BUILD is an image, not a placement. `kind` here named a
# platform family, which `[image.*]` reads off the board, and `target` restated
# the rustc triple the board descriptor already states. `launch` loses its
# `launch/` prefix: an image's value is resolved against that directory.

# Issue 1312 — `entry` claims the hand-written IDF project beside this bringup.
# The ESP-IDF shim names its entry (`codegen-system --for-entry
# ${CMAKE_SOURCE_DIR}`) because an IDF configure knows its project directory and
# not which image named it; without this key the bake resolves no image and
# takes the HOST defaults, tier sub-table included.
[image.esp_idf_esp32c3]
board = "esp32c3"
launch = "system.launch.xml"
entry = "esp_idf_app"
