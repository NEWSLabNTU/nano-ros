# Phase 212.M.5.a.3 fixture — listener Component pkg (Rust, no_std).
#
# Companion to `talker_pkg`. Same standalone-workspace shape; see
# the talker pkg for the rationale.
[workspace]

[package]
name = "listener_pkg"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

# Issue 0686 — the planner synthesises this node's component artifact from THIS
# table (`find_source_metadata` / `metadata_matches`), and `nros-build` passes no
# `metadata_files`, so the table IS the source. Without it the planner reports
# `missing-source-metadata` for `listener`, the Entry pkg's build.rs falls back to
# a Placeholder `run_plan.rs`, and the fixture proves only that the firmware ELF
# LINKS — not that its launch file plans. `class`/`name` must match the
# `<node pkg exec name>` entry in `src/firmware/launch/system.launch.xml`.
[package.metadata.nros.node]
class = "listener_pkg::Listener"
name = "listener"
default_namespace = "/"

[dependencies]
# Phase 212.M-F.13 path (b) — `nros::component!()` now emits references
# through `::nros::__macro_support::nros_platform::*`, so a Component
# pkg only needs `nros` as a dep. The N.7 step-3.4 era `nros-platform`
# dep is gone (M-F.13 closed that UX gap).
nros = { path = "@NANO_ROS_ROOT@/packages/api/nros", default-features = false, features = ["alloc", "rmw-cffi", "ros-humble", "macros"] }
