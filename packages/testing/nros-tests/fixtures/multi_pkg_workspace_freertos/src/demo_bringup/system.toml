# Phase 212.H.3 bringup spec.
#
# Pure declarative — no `Cargo.toml` lives in this directory (Phase
# 212.F.2 lint). The BSP's `build.rs` reads this file via the
# `NROS_SYSTEM_TOML` env var and bakes it into `nros_config_generated.h`
# + `system_main.c`.

# phase-330 / issue 0392 A — migrated off the phase-212 spelling, which no
# reader understood any more: `launch` -> `default_launch` (a bare file name,
# resolved against `launch/`), `zenoh_locator` -> `locator`, and `components`
# dropped because the node set comes from the launch file. The header below
# described a `build.rs` reading this via `NROS_SYSTEM_TOML`; no such reader
# exists in the tree today, so the legacy keys had no second consumer to
# protect.
[system]
name           = "demo"
default_launch = "system.launch.xml"
rmw            = "zenoh"
domain_id      = 0
locator        = "tcp/10.0.2.2:7447"

# Issue 0951 — a BOARD BUILD is an image, not a placement. `kind` here named a
# platform family, which `[image.*]` reads off the board, and `target` restated
# the rustc triple the board descriptor already states. `launch` loses its
# `launch/` prefix: an image's value is resolved against that directory.
[image.qemu-mps2-an385]
board = "qemu-mps2-an385"
