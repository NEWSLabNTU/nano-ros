# Zephyr requires a prj.conf beside the application. The image's settings come
# from the board package and `[image.zephyr]` in demo_bringup/system.toml.

# This application is a nano-ros image: without this the module builds
# nothing, and the link fails on every zpico_* and nros_platform_* symbol.
CONFIG_NROS=y

# Issue 2861 -- defined by `support_pkg`, a workspace package that is a Zephyr
# module for its Kconfig only. Undefined unless `nros build` passes the
# entry's workspace modules on the west line.
CONFIG_DEMO_SUPPORT=y
