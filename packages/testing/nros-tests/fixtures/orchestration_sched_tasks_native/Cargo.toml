# Phase 228.G fixture — multi-sched-task `nros::main!()` emit round-trip.
#
# A colcon-style workspace with TWO node pkgs assigned to two sched tasks:
#   src/ctrl_pkg/      — control node, callback group `ctrl` → sched task `high`.
#   src/telem_pkg/     — telemetry node, group `telem` → sched task `low`.
#   src/demo_bringup/  — bringup pkg: system.toml with `[tasks.*]` + two
#                        `[[component]]`s + a launch spawning both nodes.
#   src/demo_entry/    — Entry pkg whose `main.rs` is `nros::main!(launch =
#                        "demo_bringup")`; deploy = "native".
#
# The companion test stages this into a tempdir, rewrites `@NROS_REPO_DIR@`,
# and `cargo check`s the Entry pkg. Because system.toml declares `[tasks.*]`,
# the macro emits `<LinuxBoard>::run_sched_tasks(SCHED_TASKS, ...)` (RFC-0032 §5) — the
# check proves that emit compiles.

[workspace]
members = [
    "src/ctrl_pkg",
    "src/telem_pkg",
    "src/demo_entry",
]
# `demo_bringup` is metadata-only (package.xml + launch.xml + system.toml).
resolver = "2"
