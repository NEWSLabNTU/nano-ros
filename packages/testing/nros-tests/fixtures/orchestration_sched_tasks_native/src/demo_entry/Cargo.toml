[package]
name = "demo_entry"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "demo_entry"
path = "src/main.rs"

[dependencies]
nros = { path = "@NROS_REPO_DIR@/packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "ros-humble", "macros"] }
# The image's board crate (and its RMW backend, platform and runtime) —
# GENERATED by `nros sync` from this package's `system.toml` (RFC-0098 D6,
# issue 1305), so this manifest names no board crate.
demo_entry_nros_selection = { path = "build/nros/selection" }
ctrl_pkg = { path = "../ctrl_pkg" }
telem_pkg = { path = "../telem_pkg" }
