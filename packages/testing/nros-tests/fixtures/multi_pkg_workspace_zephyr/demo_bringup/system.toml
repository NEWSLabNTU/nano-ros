# Phase 212.H.1 fixture — system spec (Path A bringup, no Cargo.toml).
[system]
name      = "demo"
rmw       = "zenoh"
domain_id = 0

[[component]]
pkg  = "talker_pkg"
class = "talker_pkg::talker"
name = "talker"

[[component]]
pkg  = "listener_pkg"
class = "listener_pkg::listener"
name = "listener"

# Issue 0951 — a BOARD BUILD is an image, not a placement. `kind` here named a
# platform family, which `[image.*]` reads off the board, and `target` restated
# the rustc triple the board descriptor already states. `launch` loses its
# `launch/` prefix: an image's value is resolved against that directory.

# Issue 1312 — `entry` is how this image CLAIMS the hand-written west
# application beside it. `nros_system_generate()` names its entry
# (`codegen-system --for-entry`, the spelling `nros image-facts` and
# `nros ws board-facts` already use) and this is the key that answers it;
# without it the bake resolves no image and silently takes the HOST defaults,
# tier sub-table included. The id is not derivable from the app's name —
# a generated entry would be `zephyr_native_sim_entry`, and this one is
# hand-written — which is exactly the case `entry =` exists for.
[image.zephyr_native_sim]
board = "native_sim/native/64"
launch = "system.launch.xml"
entry = "zephyr_app"
