[package]
name = "talker_pkg"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Phase 212.H.2 fixture — talker component (NuttX)."

[lib]
crate-type = ["staticlib"]

[dependencies]

# phase-330 / issue 0392 B — no `[package.metadata.nros.node]` here. This
# package is a C-ABI STUB (`#[no_mangle] nros_node_listener`), not a Rust
# component: there is no type for `class` to name. Declaring the block made
# `nros sync` run the metadata harness, which then failed with "declares no
# `class`". The block also only restated the default namespace, so removing it
# changes nothing else. The multi_pkg_workspace_freertos siblings, which sync
# clean, declare no such block either.

[package.metadata.ament]
build_depend = ["std_msgs"]
exec_depend = ["std_msgs"]
