# What this entry deploys to (RFC-0098 D3/D5). It was the manifest's
# `[package.metadata.nros.entry] deploy = "native"` until phase-445 W5 retired
# the key. `shared_bringup` is a launch file only, so each entry states its
# own board.

[system]
name = "posix_entry"
rmw = "zenoh"
domain_id = 0

# `native`, not `posix`: this board's reach is Linux — `apply_tier_affinity`
# calls `sched_setaffinity`, which libc does not define for apple. `native`
# is the ROLE word (host build, not cross), which is what this fixture is
# actually contrasting against its `freertos_entry` sibling.
[image.native]
board = "native"
