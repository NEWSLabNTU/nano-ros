[package]
name = "stub-rmw"
version = "0.1.0"
edition = "2024"
publish = false
description = "An out-of-tree nano-ros RMW backend, `stub`, that is its own Zephyr module."

[lib]
name = "stub_rmw"
path = "src/lib.rs"

# Every nano-ros crate is reached BY VERSION, as a third party's crate would
# reach it; the image's `[patch]` set points each one at the SDK it builds
# against (RFC-0071 D15, "Patches").
[dependencies]
nros-rmw-cffi = { version = "*", default-features = false }

[features]
default = []
# The board descriptor's `platform_feature` (`zephyr` -> `platform-zephyr`).
platform-zephyr = []
