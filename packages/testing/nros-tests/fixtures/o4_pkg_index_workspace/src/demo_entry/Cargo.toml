[package]
name = "demo_entry"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "demo_entry"
path = "src/main.rs"

# Phase 212.N.9 form-3+ Entry pkg. `nros::main!(launch = "demo_bringup:...")`
# reads the board from the `system.toml` beside this manifest (phase-445 W5),
# whose image is also what makes this package an entry (issue 1289).

[dependencies]
# DELIBERATELY single-dep on `nros` (matches `nros::main!` design lock).
nros = { path = "@NROS_REPO_DIR@/packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "ros-humble", "macros"] }
# Board crate — supplies the `LinuxBoard` ZST referenced by the
# macro-emitted `<Board as BoardEntry>::run(...)` call.
# The image's board crate (and its RMW backend, platform and runtime) —
# GENERATED by `nros sync` from this package's `system.toml` (RFC-0098 D6,
# issue 1305), so this manifest names no board crate.
demo_entry_nros_selection = { path = "build/nros/selection" }
# The macro emits `::node_a::register(runtime)?;`, etc. The bin target
# must link each rlib for those calls to compile + resolve.
node_a = { path = "../node_a" }
node_b = { path = "../node_b" }
node_c = { path = "../node_c" }
