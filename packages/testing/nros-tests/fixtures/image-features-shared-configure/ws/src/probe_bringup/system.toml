# Issue 2702 fixture: two C images on one `linux` coordinate, one of which
# states its own `node_interfaces`. That image gets a cmake configure of its
# own, built and sized with its own axes; the other keeps the shared one.
[system]
name = "image_features_probe"
rmw = "zenoh"
domain_id = 0
default_launch = "system.launch.xml"

[[component]]
pkg = "probe_pkg"
class = "probe_pkg::Probe"
name = "probe"

[image.plain]
board = "linux"

[image.slim]
board = "linux"
node_interfaces = "none"
