[package]
name = "ctrl_pkg"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

# Phase 228.G — the control node's group → tier binding lives in the
# bringup's `system.toml` (`[[component]] group_tiers`, RFC-0047).
[package.metadata.nros.node]
class = "ctrl_pkg::Control"
name = "control_node"

[dependencies]
nros = { path = "@NROS_REPO_DIR@/packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "ros-humble", "macros"] }
