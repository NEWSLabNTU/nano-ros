# Phase 212.O.5 fixture — secondary Component pkg (Rust, no_std).
#
# This pkg ships a sibling `launch/secondary.launch.xml` that the
# primary launch `<include>`s via `$(find-pkg-share secondary_node)/launch/…`.
# `nros sync` registers this package in the ament prefix it synthesizes for
# the launch resolver (issue 1861), so that substitution resolves to this
# directory with no install step.

[workspace]

[package]
name = "secondary_node"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[package.metadata.nros.node]
class = "secondary_node::Secondary"
name = "secondary"

[dependencies]
nros = { path = "@NROS_REPO_DIR@/packages/api/nros", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "ros-humble", "macros"] }
