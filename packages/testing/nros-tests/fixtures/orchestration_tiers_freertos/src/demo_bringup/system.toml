[system]
name = "demo"
rmw = "zenoh"
domain_id = 0

# issue 0438 — `group_tiers` BINDS a callback group to a tier (phase-273 W2 /
# RFC-0047). Without it the `[tiers.*]` tables below have no members, resolve to
# a single synthesized `default`, and the entry silently emits the SINGLE-tier
# path — the same latent defect the native sibling of this fixture carried.
[[component]]
pkg = "ctrl_pkg"
class = "ctrl_pkg::Control"
name = "control_node"
group_tiers = { ctrl = "high" }

[[component]]
pkg = "telem_pkg"
class = "telem_pkg::Telem"
name = "telem_node"
group_tiers = { telem = "low" }

# Two FreeRTOS priority tiers. Raw FreeRTOS priorities (0..configMAX-1, higher =
# higher) authored directly in the per-RTOS sub-table.
#
# Issue #48 — each spawned tier task shares the boot session and runs the
# zenoh-pico-backed per-tier spin (publish/take). zenoh-pico operations are
# stack-heavy on the Cortex-M3; the original 8192/4096-byte stacks overflowed
# (`*** STACK OVERFLOW: nros_tier ***`) the moment the firmware actually
# connected (a #46-class overflow, previously masked because the inert deploy
# config never let `Executor::open` succeed). 64 KiB boots + runs both tiers.
[tiers.high]
spin_period = "1000us"
[tiers.high.freertos]
priority = 5
stack_bytes = 65536

[tiers.low]
spin_period = "10000us"
[tiers.low.freertos]
priority = 2
stack_bytes = 65536
