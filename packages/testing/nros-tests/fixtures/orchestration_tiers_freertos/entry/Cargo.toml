[package]
name = "demo_entry"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "demo_entry"
path = "src/main.rs"

[package.metadata.nros.entry]
deploy = "freertos"

[package.metadata.nros.deploy.freertos]
rmw = "zenoh"
domain_id = 0
# Issue #48 cause 1 — slirp addressing threaded into the firmware boot Config
# via `Mps2An385::run_tiers` (multi-tier path): guest 10.0.2.15 / gateway 10.0.2.2,
# dialing the host zenohd at the slirp alias 10.0.2.2.
#
# Issue 0342 — the PORT is the allocator's slot for this cell:
# `port_of(FreertosMps2, Rust, RealtimeTiers)` = 7891. It was a bare 7447, which
# is not merely unallocated but sits inside ANOTHER platform's window, so it
# could collide as the matrix grows. A baked literal cannot call the allocator,
# so `orchestration_tiers_freertos.rs` asserts this file's port against
# `port_of(...)` before booting — the mirror cannot drift silently.
ip = "10.0.2.15"
gateway = "10.0.2.2"
locator = "tcp/10.0.2.2:7891"

[dependencies]
nros = { path = "@NANO_ROS_ROOT@/packages/api/nros", default-features = false }
nros-board-mps2-an385-freertos = { path = "@NANO_ROS_ROOT@/packages/boards/nros-board-mps2-an385-freertos" }
nros-platform = { path = "@NANO_ROS_ROOT@/packages/core/nros-platform", default-features = false, features = ["platform-freertos"] }
ctrl_pkg = { path = "../src/ctrl_pkg" }
telem_pkg = { path = "../src/telem_pkg" }
panic-semihosting = "0.6"
