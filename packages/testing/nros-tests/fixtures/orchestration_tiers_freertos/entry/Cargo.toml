[package]
name = "demo_entry"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "demo_entry"
path = "src/main.rs"

[package.metadata.nros.entry]

[dependencies]
nros = { path = "@NANO_ROS_ROOT@/packages/api/nros", default-features = false, features = ["macros"] }
nros-board-mps2-an385-freertos = { path = "@NANO_ROS_ROOT@/packages/boards/nros-board-mps2-an385-freertos" }
nros-platform = { path = "@NANO_ROS_ROOT@/packages/platform/nros-platform", default-features = false, features = ["platform-freertos"] }
ctrl_pkg = { path = "../src/ctrl_pkg" }
telem_pkg = { path = "../src/telem_pkg" }
panic-semihosting = "0.6"
