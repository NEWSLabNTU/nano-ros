# Its own cargo root: an owned entry is built by manifest path (RFC-0098 D9).
[workspace]


[package]
name = "qemu_bsp_large_msg_test"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "QEMU large message publish test on the MPS2-AN385 bare-metal board"

[[bin]]
name = "qemu-bsp-large-msg-test"
path = "src/main.rs"
test = false
bench = false

# Phase 212.M-F.18 — Application pkg shape (matches §M.10 native
# example pattern). Single-board bare-metal bench fixture; deploy
# target is the platform path the binary runs on.
[package.metadata.nros.application]
deploy = ["mps2-an385-baremetal"]

[features]
default = []

[dependencies]
# The image's board crate, which `main` reaches directly. Its RMW and
# edition features come from the adapter.
nros-board-mps2-an385 = { path = "../../../../../boards/nros-board-mps2-an385", default-features = false }
# GENERATED by `nros build` from the bringup (RFC-0071 D13/D19).
qemu_bsp_large_msg_test_nros_derived = { path = "../../generated/nros-derived/qemu_bsp_large_msg_test" }

# nros Executor API
nros = { path = "../../../../../api/nros", default-features = false, features = ["rmw-cffi"] }
# `nros_rmw_zenoh::register()`, called before `Executor::open_in`. The
# adapter links the backend with the image's platform and edition.
nros-rmw-zenoh = { path = "../../../../../rmw/zenoh/nros-rmw-zenoh" }

# The board's crate-root panic provider (its descriptor's `own_panic_root_deps`),
# which an owned entry links itself: `exit` ends the QEMU run on a panic.
panic-semihosting = { version = "0.6", features = ["exit"] }

# Generated message types
std_msgs = { path = "../../generated/std_msgs", default-features = false }  # nros-managed
