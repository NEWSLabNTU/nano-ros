[workspace]

[package]
name = "qemu-bsp-large-msg-test"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "QEMU large message publish test on the MPS2-AN385 bare-metal board"

[[bin]]
name = "qemu-bsp-large-msg-test"
test = false
bench = false

# Phase 212.M-F.18 — Application pkg shape (matches §M.10 native
# example pattern). Single-board bare-metal bench fixture; deploy
# target is the platform path the binary runs on.
[package.metadata.nros.application]
deploy = ["mps2-an385-baremetal"]

[features]
default = []

[dependencies]
# The image's board crate (hardware + network init), its RMW backend, the
# Cortex-M runtime and the board's panic provider — GENERATED by `nros sync` /
# `nros build` from `system.toml` (RFC-0098 D6, issue 1305), so this manifest
# names no board or RMW. `main.rs` reaches the board through it.
qemu_bsp_large_msg_test_nros_selection = { path = "build/nros/selection" }

# nros Executor API
nros = { path = "../../../../packages/api/nros", default-features = false, features = ["rmw-cffi"] }
# `nros_rmw_zenoh::register()`, called before `Executor::open_in`. The
# selection package links the backend with the image's platform and edition.
nros-rmw-zenoh = { path = "../../../../packages/rmw/zenoh/nros-rmw-zenoh" }

# Generated message types
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
