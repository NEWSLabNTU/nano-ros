# Both cores: zenoh over RPMsg only, no network stack.
CONFIG_NROS=y
CONFIG_PRINTK=y
CONFIG_IPM=y
CONFIG_RPMSG_SERVICE=y
CONFIG_NROS_ZENOH_LINK_RPMSG=y
CONFIG_NROS_ZENOH_LINK_TCP=n
CONFIG_NROS_ZENOH_LINK_UDP_UNICAST=n
CONFIG_NROS_ZENOH_LINK_UDP_MULTICAST=n
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_TEST_RANDOM_GENERATOR=y
