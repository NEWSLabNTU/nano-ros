[workspace]

[package]
name = "qemu-rs-wcet-bench"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "qemu-rs-wcet-bench"
test = false
bench = false

[dependencies]
nros = { path = "../../../../packages/api/nros", default-features = false, features = ["safety-e2e"] }
std_msgs = { path = "generated/std_msgs", default-features = false }
builtin_interfaces = { path = "generated/builtin_interfaces", default-features = false }

cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
heapless = "0.8"
