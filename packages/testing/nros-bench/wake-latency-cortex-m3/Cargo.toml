[workspace]

[package]
name = "wake-latency-cortex-m3"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Phase 141.D wake-latency microbench on FreeRTOS + Cortex-M3 + zenoh-pico"

# Issue #0317 — two-image bench: the shared config/scenario consts live in the
# crate lib; the SUBSCRIBER (measured) and PUBLISHER run as separate QEMU images
# so the zenohd router delivers a real transport-arrival wake to the subscriber.
[lib]

[[bin]]
name = "wake-latency-cortex-m3"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "wake-latency-pub"
path = "src/publisher.rs"
test = false
bench = false

# Phase 212.M-F.18 — Application pkg shape (matches §M.10 native
# example pattern). Single-board FreeRTOS bench fixture; deploy
# target is the platform path the binary runs on.
[package.metadata.nros.application]
deploy = ["mps2-an385-freertos"]

[features]
default = []
# Phase 141.D scenarios — exactly one must be active at build
# time. Defaults pull the talker-only "single sub @ 100 Hz" run.
scenario-single = []
scenario-fanout = [] # 4 idle subs + 1 active
scenario-burst = []  # 10 messages back-to-back

[dependencies]
# The image's board crate, its RMW backend, platform and panic provider —
# GENERATED by `nros sync` / `nros build` from `system.toml` (RFC-0098 D6, issue
# 1305), so this manifest names no board, platform feature or edition. The bins
# reach the board through it. (Phase 230, #0317: `nros` / `nros-node` carry no
# `platform-freertos` feature; `nros-platform-mps2-an385` below is the cycle
# counter the bench reads.)
wake_latency_cortex_m3_nros_selection = { path = "build/nros/selection" }
nros = { path = "../../../../packages/api/nros", default-features = false, features = [
    "rmw-cffi",
] }
# Phase 141.B.2 — wake-latency probe lives behind a feature on
# `nros-node`. The umbrella `nros` crate re-exports nothing
# from the probe today, so depend on `nros-node` directly to
# pull the feature in + reach `nros::executor::wake_probe`
# through the umbrella's `executor` module.
nros-node = { path = "../../../../packages/core/nros-node", default-features = false, features = [
    "alloc",
    "rmw-cffi",
    "wake-latency-probe",
] }
# Issue #0317 — used ONLY for the Cortex-M DWT timing (`CycleCounter`,
# `clock_cycles`, `cycles_to_ns`). `default-features = false` drops its
# `libc-stubs` (this is a FreeRTOS/picolibc build — the board already provides
# libc), avoiding a `duplicate symbol: strtol` link conflict.
nros-platform-mps2-an385 = { path = "../../../../packages/platform/nros-platform-mps2-an385", default-features = false }
# `nros_rmw_zenoh::register()`, called by both bins. The selection package
# links the backend with the image's platform and edition.
nros-rmw-zenoh = { path = "../../../../packages/rmw/zenoh/nros-rmw-zenoh" }
std_msgs = { path = "generated/std_msgs", default-features = false }  # nros-managed
# Phase 230 (#0317) — was pulled transitively via `nros-node/platform-freertos`;
# now a direct dep for the semihosting `debug::exit` at scenario end.
cortex-m-semihosting = "0.5"
heapless = "0.8"

[build-dependencies]
# phase-471 W4 — the linker-script emit, shared. Zero-dependency and
# host-only, so this edge adds one compile unit and nothing behind it.
nros-build-paths = { path = "../../../tooling/nros-build-paths" }
