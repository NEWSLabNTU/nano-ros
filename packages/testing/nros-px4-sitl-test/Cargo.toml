[workspace]
# Phase 208.D.3 — empty `[workspace]` table on purpose. Keeps this
# package OUT of the nano-ros root workspace so cargo doesn't try to
# resolve the `px4-sitl-tests` path-dep into the `px4-rs` submodule
# at workspace-load time. The submodule may be absent on a clean clone
# (`nros setup linux --rmw zenoh` does not fetch it); when it's
# missing, the root workspace still loads cleanly. Building / testing
# THIS crate requires the submodule, and is invoked only by
# `just px4 test-sitl`.

[package]
name        = "nros-px4-sitl-test"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
publish     = false
description = "PX4 SITL E2E test fixture for nano-ros uORB modules (out-of-workspace)"

# phase-316 / issue 0356 — the `px4_e2e` Track A test was REMOVED here. It built
# SITL against `examples/px4/rust/uorb/{talker,listener}`, retired by phase-277
# W7, and it started two NANO-ROS modules and asserted one of them logged
# `recv:` — a loopback, which passes identically with a correct and a broken
# struct layout. phase-325 W2 replaces it with a test whose far end is a STOCK
# PX4 consumer. The `Px4Sitl` harness it used survives in `px4_xrce_e2e`.

[[test]]
name = "px4_xrce_e2e"
path = "tests/px4_xrce_e2e.rs"

# phase-325 W2.4 — Track A's runtime lane, replacing the px4_e2e issue 0356
# removed. Unlike its predecessor it asserts on a STOCK PX4 consumer, and it does
# not build SITL: `just px4 build-sitl-example` does that, per CLAUDE.md.
[[test]]
name = "px4_uorb_interop_e2e"
path = "tests/px4_uorb_interop_e2e.rs"

# phase-325 W3.4 — the bridge's acceptance: a stock PX4 module's uORB topic
# reaches a REAL ROS 2 subscriber. Consumes the SITL image from
# `just px4 build-bridge-example` and the `px4_msgs` overlay from
# `just px4 build-px4-msgs-ros`; builds neither.
[[test]]
name = "px4_bridge_ros2_e2e"
path = "tests/px4_bridge_ros2_e2e.rs"

# Issue 1896 — the same bridge on the XRCE backend, in one image with PX4's own
# `uxrce_dds_client`: both clients deliver to ROS 2 through one agent. Consumes
# `NROS_PX4_BRIDGE_RMW=xrce just px4 build-bridge-example`; builds nothing.
[[test]]
name = "px4_bridge_xrce_ros2_e2e"
path = "tests/px4_bridge_xrce_ros2_e2e.rs"

[dependencies]
# Path-dep into the px4-rs submodule. Out-of-workspace, so its
# absence on a fresh clone is a build-time error here only, not a
# root-workspace-load error everywhere else.
px4-sitl-tests = { path = "../../../third-party/px4/px4-rs/tests/sitl" }
# phase-336 — the ambient build profile, so the probe looks where the builder
# wrote instead of naming a profile that can be renamed out from under it.
nros-cargo-profile = { path = "../../tooling/nros-cargo-profile" }
# phase-325 W3.4 — the ROS 2 peer machinery every interop cell uses
# (`Ros2Process`, the router fixture, `require_ros2`). Reused rather than a
# second harness; a path dep is fine here because this crate is already
# outside the root workspace.
nros-tests = { path = "../nros-tests" }
