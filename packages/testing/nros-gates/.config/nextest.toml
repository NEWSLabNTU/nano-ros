# nextest configuration for the GATE harness (phase-543), not for the tests.
#
# This crate is its own cargo root, so nextest reads this file and not the
# repository's `.config/nextest.toml`. That is deliberate: the repository's file
# names `binary()` filters for test binaries this root does not have, and an
# unmatched `binary()` is a parse error (issue 0743).

[profile.default]
# No retries, as in the repository's config (maintainer ruling 2026-11-02): a
# gate that fails once and passes on a re-run has a race to fix, not to hide.
retries = 0
fail-fast = false
# A gate is a whole `just` recipe. Build gates compile for minutes, so the
# slow mark is informational and the cap is the build lane's own scale.
slow-timeout = { period = "120s", terminate-after = 20 }
# A plain run is every gate in a lane. `exempt::` gates (recipes carrying
# `[metadata("tier", "exempt", "<why>")]`) are in no lane: they need an image, a
# provisioned SDK, or are run by name. Ask for them with `-E 'test(/^exempt::/)'`
# plus `--ignore-default-filter`.
default-filter = "not test(/^exempt::/)"

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
