# The C++ entry pack.
#
# See `../c/pack.toml` for why this file exists.
#
# This is the pack a C entry routes to on a board family with no C-ABI
# `run_components` (none since issue 1286, so the route is kept for a future
# family): the C pack declares `c_abi_runners = true`, and the rule that sends
# such a language here lives in Rust (`entry_pack_for`) — but its OUTCOME is
# what the `entry-pack` query reports, which is how CMake stops re-deriving it.
language = "cpp"

extension = "cpp"
c_family = true

entry_template = "entry_cpp.cpp"

# phase-474 W2 — see `../c/pack.toml`. This pack constructs every component
# kind, drives the board through its C++ class (`cpp_board_class` spells it),
# and also renders the phase-308 metadata-probe tail.
context = "lowered-entry"
filters = ["c_str", "pkg_ident", "cpp_board_class"]
components = ["c", "rust", "rclcpp", "configure"]
metadata_probe = true

# See `../c/pack.toml` for what `templates` declares.
templates = [
    { key = "entry_cpp.cpp", file = "entry.cpp.jinja" },
    { key = "node_body_cpp.jinja", file = "node_body.jinja" },
    { key = "monitor_install_cpp.jinja", file = "monitor_install.jinja" },
    { key = "boot_wrapper_cpp.jinja", file = "boot_wrapper.jinja" },
    { key = "service_trailer_cpp.jinja", file = "service_trailer.jinja" },
]
