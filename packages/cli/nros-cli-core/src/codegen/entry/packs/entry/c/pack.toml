# The C entry pack.
#
# phase-432 W3.2 — this file is the SSoT for what CMake needs to know about a
# pack before codegen has run: what the generated TU is called and which
# toolchain compiles it. That knowledge used to be re-derived in
# `NanoRosEntry.cmake`, keyed on a DIFFERENT variable than the CLI's dispatch
# (`NANO_ROS_PLATFORM != "posix"` there, `board_family()` here), so the two
# could disagree about the same entry. Ask `nros codegen entry-pack` instead.

# The `nros_lang::Language` this pack renders for.
language = "c"

# The generated TU's extension, and whether a C-family compiler builds it.
# `c_family` is what tells CMake to link the C runtime rather than the C++ one;
# the two are separate because a future pack could be C-family with a different
# extension, or neither.
extension = "c"
c_family = true

# The template that renders the whole TU — a key from `templates` below.
entry_template = "entry_c.c"

# phase-474 W2 — what the generic renderer needs to know, and the whole of
# what this pack asks of Rust. There is no `emit_c.rs`: the template renders
# `nros_entry_lower::LoweredEntry` itself (`context`), spells what it reads
# through the filters it names (`filters.rs` registers them), constructs the
# component kinds it lists, and calls the board's C-ABI runners — which is why
# a C entry is ROUTED to the C++ pack on a family that exports none.
context = "lowered-entry"
filters = ["c_str", "pkg_ident"]
components = ["c"]
c_abi_runners = true

# The templates this pack contributes, DISCOVERED at build time (phase-474
# W1): `key` is the stable registry name a `render` call or an `{% include %}`
# uses, `file` the template beside this manifest. An OUTPUT key is
# `<artifact>_<surface>.<ext>`, a partial keeps its `.jinja` suffix.
# `entry_template` names the output among them. The shared partials this pack
# also includes belong to `../shared/pack.toml`.
templates = [
    { key = "entry_c.c", file = "entry.c.jinja" },
    { key = "node_body_c.jinja", file = "node_body.jinja" },
    { key = "boot_wrapper_c.jinja", file = "boot_wrapper.jinja" },
    { key = "service_trailer_c.jinja", file = "service_trailer.jinja" },
]
