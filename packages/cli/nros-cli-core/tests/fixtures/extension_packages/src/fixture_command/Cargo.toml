# phase-527 fixture: a command package with one bin target and no
# dependencies. The empty `[workspace]` makes it its own root, so a build of a
# copy never walks up into another workspace.
[package]
name = "fixture_command"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nros-fixture-hello"
path = "src/main.rs"

[workspace]
