# [package.metadata.nros.entry] with NO `deploy` key. That used to be the
# offending shape (`entry-deploy-missing`); since RFC-0098 D5 retired the key it
# is the correct one, and `nros check --workspace` accepts it. The test adds the
# key back to prove the lint now refuses it (`entry-deploy-retired`).

