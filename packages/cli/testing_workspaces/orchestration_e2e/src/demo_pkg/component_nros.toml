# Phase 172.U — demo_pkg declares its `talker` component so `nros deploy`
# (and `nros metadata`) can resolve + collect its source metadata from the
# root nros.toml's [system].components = ["demo_pkg"]. source_metadata points
# at the workspace's pre-collected artifact (present ⇒ no rebuild needed).
version = 1
package = "demo_pkg"
component = "talker"
# phase-330 / issue 0392 B — the component type, without which the metadata
# harness cannot name what it registers ("declares no `class` and its id is
# not `crate::module`"). The fallback builds `<crate>::<module>::Component`
# from a `crate::module` id; this id is the bare instance name `talker`, so
# the type has to be stated.
class = "demo_pkg::talker::Component"
language = "rust"

[linkage]
crate_name = "demo_pkg"
executable = "talker"
exported_symbol = "nros_component_talker"

[metadata]
source_metadata = "metadata/talker.json"
generated_by = "cargo nros metadata"

[overrides]
default_namespace = "/"
parameters = {}
remaps = []
