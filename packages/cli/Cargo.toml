[workspace]
resolver = "2"
members = [
    "rosidl-parser",
    "rosidl-resolve",
    "rosidl-lower",
    "rosidl-codegen",
    "rosidl-bindgen",
    "cargo-nano-ros",
    # phase-432 W2.1 (RFC-0091 §3) — the language enumeration, declared once.
    # serde-only on purpose: the proc-macro must be able to afford it.
    "nros-lang",
    # phase-432 W2.2 (RFC-0091 §4) — entry Stage 2. Same budget rule as
    # nros-lang: the proc-macro must be able to depend on it.
    "nros-entry-lower",
    "nros-pkg-index",
    "nros-launch-parser",
    "nros-cli-core",
    "nros-cli",
    # phase-443 W3 (RFC-0097 D4) — the launcher, its OWN artifact and its own
    # version. It must not gain dependencies; see its manifest.
    "nros-launcher",
    "nros-msg-to-idl",
    # Phase 212.N.4 — build-script codegen library for Entry pkgs.
    "nros-build",
    "colcon-cargo-ros2",  # Package dir name (contains colcon-nano-ros crate)
]

[workspace.package]
# Phase 218.J — JetPack-style bundle versioning. MUST match the root
# workspace's `[workspace.package].version` at `../../Cargo.toml`.
# `scripts/check-version-lockstep.sh` (wired into `.github/workflows/
# lint.yml`) errors if the two diverge; `just release-bump <X.Y.Z>`
# bumps both atomically. Previous CLI versions (last standalone tag:
# `nros-v0.3.7`) are preserved in the archived
# `github.com/NEWSLabNTU/nros-cli` repo's tag history.
version = "0.6.0"
authors = ["Lin Hsiang-Jui <jerry73204@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NEWSLabNTU/nano-ros"
homepage = "https://github.com/NEWSLabNTU/nano-ros"
documentation = "https://github.com/NEWSLabNTU/nano-ros/tree/main/packages/cli"
rust-version = "1.75"

[workspace.dependencies]
# Shared dependencies across workspace members
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minijinja = "2.5"
nros-lang = { path = "nros-lang" }
nros-entry-lower = { path = "nros-entry-lower" }
toml = "0.8"

# PyO3 for Python bindings
pyo3 = { version = "0.29", features = ["extension-module"] }

# Workspace member dependencies
cargo-nano-ros = { path = "cargo-nano-ros" }
nros-cli-core = { path = "nros-cli-core" }
nros-launcher = { path = "nros-launcher" }
rosidl-bindgen = { path = "rosidl-bindgen" }
rosidl-parser = { path = "rosidl-parser" }
rosidl-resolve = { path = "rosidl-resolve" }
rosidl-lower = { path = "rosidl-lower" }
rosidl-codegen = { path = "rosidl-codegen" }
nros-msg-to-idl = { path = "nros-msg-to-idl" }

# Issue 2654 (user ruling 2026-11-16) — the CLI's release build is
# incremental. `just setup-cli` rebuilds this workspace whenever the checkout
# moves (ASI follows main), and without it an edit or a commit rebuilt
# `nros-cli-core` in 35-39 s; with it, 5 s. Every other setting stays cargo's
# default release (opt-level 3, thin-local LTO, unwind), and release-nros.yml
# builds the shipped `nros` with this same profile, so dev-mode and the shipped
# binary match.
#
# It is HERE and not in the shared `.cargo/config.toml` on purpose:
# `check-cargo-profile-mirror` requires a profile defined in both that file and
# the root `Cargo.toml` to be identical, and the root's `[profile.release]` is
# fat LTO + `codegen-units = 1` + `panic = "abort"`. A shared `release` would
# carry those to the CLI, a far slower build, and `panic = "abort"` would end
# `nros setup`'s per-step `catch_unwind` (one failing install step would kill
# the run). The shared `dev` profile stays `incremental = false` for phase-340
# W6's sccache reason (issue 2656).
#
# Cost, measured: the target dir is about 1.7 GB, against 0.59 GB. It stays
# flat across rebuilds (rustc collects its own stale sessions), so no sweep is
# needed.
[profile.release]
incremental = true

[profile.dev-release]
inherits = "release"
debug = true
strip = false
