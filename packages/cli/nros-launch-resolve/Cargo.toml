# nano-ros's dedicated launch-resolution helper (issue 0285, RFC-0059).
#
# A SEPARATE, DISTINCTLY NAMED binary — not `play_launch`. `nros sync` used
# to shell out to whatever `play_launch` sat on PATH, where an unrelated ROS 2
# record/replay tool of the same name shadowed ours and every platform's
# fixture build died inside a cmake configure. Naming this binary
# `nros-launch-resolve` makes that collision impossible in both directions: we
# cannot be shadowed, and we never shadow a user's real `play_launch`.
#
# Its OWN workspace on purpose. It links layer 2 from the `play_launch` repo,
# whose `ros-launch-resolve` git-deps `ros-launch-manifest` by tag (v0.1.11, in
# the submodule's own workspace manifest); `nros-cli-core` deps the SAME rlm tag. Both resolve to one rev, but keeping
# this crate excluded from the `packages/cli` workspace (its own lock) preserves
# the separation the old two-copies layout needed and stays robust if the two
# ever diverge on a pin.
[package]
name = "nros-launch-resolve"
version = "0.5.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "nros-launch-resolve"
path = "src/main.rs"

[dependencies]
# Layer 2 (RFC-0060). No feature gymnastics needed any more: the resolver is
# its own repo, so "no rclrs, no colcon-generated messages" is a property of
# the package graph rather than of a `default-features = false` flag that one
# `default = ["runtime"]` could undo. CPython is still required — the launch
# parser embeds it via pyo3 — which is why this stays a separately built helper
# instead of being linked into the portable `nros` binary.
# default-features = false drops `smt` — the checker's z3-backed
# satisfiability rule, the ONE consumer of z3 -> z3-sys -> bindgen, whose
# build put libclang AND libz3-dev on every reader's host-prerequisite list
# (phase-368's clean-container probe measured both, iterations 5-6). The
# no-smt checker is not silently smaller: it registers a stub under the same
# rule id that emits one Info diagnostic whenever the rule battery runs (the
# battery runs on CONTRACT-manifest resolves; a plain launch-XML resolve
# never reaches it, so most syncs are byte-identical either way). In-tree
# consumers that want the full battery enable `ros-launch-resolve/smt`.
ros-launch-resolve = { path = "../third-party/play_launch/src/ros-launch-resolve/resolve", default-features = false }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
# `default-features = false` drops the upstream `cli` feature: `clap` and
# `env_logger` (and its `env_filter`/`regex`/`jiff` tree) exist only for
# `play_launch_parser`'s own binary, which this crate never runs.
play_launch_parser = { path = "../third-party/play_launch/src/ros-launch-resolve/parser/crates/play_launch_parser", default-features = false }
serde_json = "1"
