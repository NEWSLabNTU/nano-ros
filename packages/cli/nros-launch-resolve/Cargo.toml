# nano-ros's dedicated launch-resolution helper (issue 0285, RFC-0059).
#
# A SEPARATE, DISTINCTLY NAMED binary — not `play_launch`. `nros ws sync` used
# to shell out to whatever `play_launch` sat on PATH, where an unrelated ROS 2
# record/replay tool of the same name shadowed ours and every platform's
# fixture build died inside a cmake configure. Naming this binary
# `nros-launch-resolve` makes that collision impossible in both directions: we
# cannot be shadowed, and we never shadow a user's real `play_launch`.
#
# Its OWN workspace on purpose. It links `play_launch`, which path-deps its own
# vendored `ros-launch-manifest`; `nros-cli-core` path-deps nano-ros's separate
# copy. Two crates of the same name in one cargo graph is an error, so this
# crate is excluded from the `packages/cli` workspace and carries its own lock.
[package]
name = "nros-launch-resolve"
version = "0.5.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "nros-launch-resolve"
path = "src/main.rs"

[dependencies]
# `default-features = false` drops `rclrs` + the colcon-generated
# `play_launch_msgs`, so this builds with plain cargo — no ROS, no ament, no
# colcon. CPython IS still required (the launch parser embeds it via pyo3),
# which is the whole reason this stays a separately-built helper rather than
# being linked into the portable `nros` binary.
play_launch = { path = "../third-party/play_launch/src/play_launch", default-features = false }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
