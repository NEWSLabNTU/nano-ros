[package]
name = "nros-log"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ROS 2 style leveled logging facade for nros (Phase 88)"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "logging", "embedded", "no-std"]
categories = ["embedded", "no-std", "development-tools::debugging"]

# Phase 88 — portable facade. NO target deps. Per-platform log
# delivery lives in each `nros-platform-<rtos>` crate via the
# `nros_platform_log_write` / `nros_platform_log_flush` ABI; the
# `PlatformSink` here is the only sink that calls the ABI.
#
# CONFIGURATION IS NOT HERE (issue 1037, RFC-0086 D5). The compile-time level
# ceiling, the formatting-buffer size, the early-record ring, the `/rosout`
# queue depth and the runtime-logger arena are the `[knobs.log]` tenant —
# `NROS_LOG_{MAX_LEVEL,BUFFER_SIZE,EARLY_RECORDS,ROSOUT_RECORDS,DYNAMIC_LOGGERS}`,
# resolved by `build.rs` on the RFC-0049 ladder (`[image.<id>] env` /
# environment > Kconfig > the board's `[board.knobs.log]` > builtin) and
# printed by `nros config explain`. The features below that used to carry them
# are DEPRECATED — see the block at the end of `[features]`.

[features]
default = []
std = ["alloc"]
alloc = []

# Issue #503 — populate `Record::timestamp_ns` from the platform's monotonic
# clock (`nros_platform_clock_ns`) and have `PlatformSink` prefix rendered lines
# with `[sssss.uuuuuu]`.
#
# issue 1037 — this is now ONE of two ways the clock turns on, and not the one
# an image normally uses: `build.rs` sets `cfg(nros_log_clock)` when the lane's
# platform declares `[capabilities] clock = true` (every in-tree port does), OR
# when this feature is on. The feature survives because it only PULLS CODE IN —
# a link-time requirement on the final binary, which RFC-0086 D5 permits —
# and `nros-c`'s `platform-*` arms set it, since a linked port is exactly the
# condition under which the symbol resolves. A bare `cargo test -p nros-log`
# has neither, so its test binaries link without a port.
platform-clock = []

# phase-467 Q4 / ledger row `c:logging_rosout_enabled` — the `/rosout` QUEUE.
#
# OFF by default: it is `rosout_depth() * size_of::<Slot>()` of `.bss` and a
# `LogSink` in the dispatch walk, and an image with no ROS operator on the far
# end pays neither. `nros-node/rosout` turns it on together with the publisher
# half; nothing else should. (Pulls code in, which D5 permits; its DEPTH is the
# `NROS_LOG_ROSOUT_RECORDS` knob.)
rosout = []

# ---- DEPRECATED (issue 1037; phase-479 W5 for `dynamic-loggers-*`) ----------
#
# Five pick-one families that encoded configuration as features — three of
# them with a member meaning "off", which RFC-0086 D5 forbids. Features UNION
# across a build with no precedence: each old `const fn` tested its members in
# a fixed order, so two crates picking different members silently got
# whichever came first (`max-level-info` beside the old default
# `max-level-trace` did NOTHING). Removed after one release. Use the knob:
#
#   max-level-*          -> NROS_LOG_MAX_LEVEL       (trace..fatal, off; builtin trace)
#   buffer-size-<N>      -> NROS_LOG_BUFFER_SIZE     (128..=4096; builtin 256)
#   early-records-<N>    -> NROS_LOG_EARLY_RECORDS   (0..=256; builtin 4)
#   rosout-records-<N>   -> NROS_LOG_ROSOUT_RECORDS  (1..=1024; builtin 16)
#   dynamic-loggers-<N>  -> NROS_LOG_DYNAMIC_LOGGERS (0..=1024; builtin 16)
#
# While they last (`build.rs`): a feature with no stated knob is honoured with a
# `cargo:warning`; one agreeing with a stated knob is reported as redundant; one
# DISAGREEING with it, or with another member of its family, fails the build.
# They left `default` in the same change — a default member would have
# disagreed with every stated knob.
max-level-trace = []
max-level-debug = []
max-level-info  = []
max-level-warn  = []
max-level-error = []
max-level-off   = []
early-records-0  = []
early-records-8  = []
early-records-16 = []
dynamic-loggers-0  = []
dynamic-loggers-8  = []
dynamic-loggers-32 = []
rosout-records-8  = []
rosout-records-32 = []
rosout-records-64 = []
buffer-size-128  = []
buffer-size-256  = []
buffer-size-512  = []
buffer-size-1024 = []

# Optional `log` crate bridge (Phase 88.10). Lets ecosystem crates
# that target `log::info!` etc. feed through the same dispatcher.
log-compat = ["dep:log"]

# phase-479 W5 / issue 1037 — `build.rs` resolves the `[knobs.log]` tenant on
# the RFC-0049 ladder. Both are host-only, build-only leaves: `nros-zephyr-build` has no
# dependencies at all, and `nros-platform-config` exists precisely so a crate
# the platform layer reaches can read the ladder without the
# `nros-board-common -> nros-platform -> ... -> nros-log` cycle. This crate
# stays `no_std` with no target deps.
[build-dependencies]
nros-zephyr-build = { path = "../../tooling/nros-zephyr-build" }
nros-platform-config = { path = "../../tooling/nros-platform-config" }

[dependencies]
heapless = { workspace = true }
log = { workspace = true, optional = true }
# Phase 88.16.E — `compare_exchange` on `AtomicBool` / `AtomicPtr`
# isn't available on `core::sync::atomic` for RISC-V `imc` and
# similar CAS-less targets. `portable-atomic` provides the atomics;
# target-specific dependency entries below select the fallback only
# where the target needs it.
portable-atomic = { version = "1", default-features = false }

# phase-337 W2.b — one spelling of "this target needs the interrupt-disable
# polyfill", shared with nros-smoltcp and nros-board-esp32-qemu. A target
# triple (the old gate here) and an arch list (the old gate in nros-smoltcp)
# were two different approximations of the same question; the arch list was
# wrong on thumbv7m, which HAS native CAS and where the feature hard-conflicts
# with the `critical-section` the `zephyr` crate enables. Ask directly instead:
# no CAS => needs the polyfill, and bare-metal only, because the polyfill
# disables interrupts. Still scoped, so host and SMP-capable targets do not
# inherit the single-core assumption through feature unification.
[target.'cfg(all(target_os = "none", not(target_has_atomic = "ptr")))'.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["unsafe-assume-single-core"] }

# Integration tests pull the POSIX C impl of `nros_platform_log_*`
# in via `nros-platform-cffi[posix-c-port]` so `PlatformSink ->
# nros_platform_log_write` actually resolves at link time without
# needing a separate `nros-platform-posix` cargo dep on the host
# (cffi already wraps the C build via its `cc` build dep).
#
# Phase 214.F.2 — target-gate the dev-dep. Cargo feature unification
# doesn't honour [dev-dependencies] boundaries during target-aware
# resolution unless they live under [target.<cfg>.dev-dependencies].
# Host targets still see the cffi dev-dep (cargo test works
# unchanged); embedded (`target_os = "none"`) sees an empty set so
# the `posix-c-port → feature "std"` activation path collapses.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
nros-platform-cffi = { path = "../../platform/nros-platform-cffi", default-features = false, features = ["posix-c-port"] }

# Issue 1613 -- the `log` bridge files a record under its target. Run by
# `just check required-features-tests`; `test-unit` activates no features.
[[test]]
name = "log_bridge_keeps_the_target"
required-features = ["log-compat"]

[lints]
workspace = true

