[package]
name = "nros-serdes"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CDR serialization/deserialization for nros"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "cdr", "serialization", "no-std", "embedded"]
categories = ["embedded", "no-std", "encoding"]

[features]
# phase-345 W3 / issue 0493 — EMPTY; `std` is opt-in per dep-site.
default = []
# phase-345 W2 (revised) — `std` does NOT imply `alloc`. On embedded, both are
# opted into EXPLICITLY, per package, by the end user; a dep that needs the heap
# must make the user say `alloc`, never turn it on behind their back.
std = []
alloc = []

[dependencies]
heapless = { workspace = true }

[dev-dependencies]
nros-ghost-types = { path = "../../verification/nros-ghost-types" }

[lints]
workspace = true
