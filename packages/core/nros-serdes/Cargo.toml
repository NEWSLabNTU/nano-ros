[package]
name = "nros-serdes"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CDR serialization/deserialization for nros"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "cdr", "serialization", "no-std", "embedded"]
categories = ["embedded", "no-std", "encoding"]

[features]
# phase-361 W3 / issue 0591 — EMPTY; `std` is opt-in per dep-site.
default = []
# phase-359 W10 — no `std` feature. A core crate is `core` or `core+alloc`
# (ARCHITECTURE §2); `alloc` is the one heap axis.
alloc = []

[dependencies]
heapless = { workspace = true }

[dev-dependencies]
nros-ghost-types = { path = "../../verification/nros-ghost-types" }

[lints]
workspace = true
