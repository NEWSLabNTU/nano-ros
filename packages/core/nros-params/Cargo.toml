[package]
name = "nros-params"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ROS 2 parameter server for nros"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "parameters", "embedded", "no-std"]
categories = ["embedded", "no-std"]

[features]
default = ["std"]
# phase-359 W8 — `std` implies `alloc`, matching nros / nros-node / nros-core.
# The `ParameterVariant` impls below are gated on `alloc` (they are `alloc`
# types); without this implication a consumer enabling only `std` would lose
# them.
std = ["alloc"]
alloc = []

[dependencies]
heapless = { workspace = true }

[dev-dependencies]
nros-ghost-types = { path = "../../verification/nros-ghost-types" }

[lints]
workspace = true
