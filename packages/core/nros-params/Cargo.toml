[package]
name = "nros-params"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ROS 2 parameter server for nros"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "parameters", "embedded", "no-std"]
categories = ["embedded", "no-std"]
# phase-382 W3' -- the store's SHAPE rides `links` metadata to `nros-node`,
# which forwards it to the C/C++ sizes probe (`DEP_NROS_NODE_PARAM_STORE_SHAPE`).
# The store is now carved from the executor backing, so its size is part of
# `NROS_EXECUTOR_SIZE`, and a dependent build script that never learns the
# store moved keeps a museum `EXECUTOR_OPAQUE_U64S` (the 0088/0268 class:
# measured, `NROS_PARAM_STORE=1` failed nros-c's `EXECUTOR_OPAQUE_U64S too
# small` assert until this channel existed).
links = "nros_params"

[features]
# phase-361 W3 — EMPTY; `std` is opt-in per dep-site.
default = []
# phase-359 W8 — `std` implies `alloc`, matching nros / nros-node / nros-core.
# The `ParameterVariant` impls below are gated on `alloc` (they are `alloc`
# types); without this implication a consumer enabling only `std` would lose
# them. Upstream reached this independently; phase-361 W2.a reached it too,
# after trying the opposite and measuring what it cost.
std = ["alloc"]
alloc = []

[dependencies]
heapless = { workspace = true }

[dev-dependencies]
nros-ghost-types = { path = "../../verification/nros-ghost-types" }

[lints]
workspace = true

[build-dependencies]
nros-zephyr-build = { path = "../../tooling/nros-zephyr-build" }

# phase-400 W6 — the RFC-0049 knob ladder, so the five parameter bounds get
# their platform and board rungs. Host-only (`build-helpers` gates serde/toml)
# and build-only; no cycle, `nros-board-common` does not depend on this crate.
nros-board-common = { path = "../../boards/nros-board-common", features = [
    "build-helpers",
], default-features = false }

# phase-454 (issue 1408) — RFC-0100 D4's `[params]`, the descriptor road for the
# five parameter-store facts the contract derives. Build-only and host-only, the
# same shape `nros-node` and `nros-rmw-cffi` already have; this crate stays
# `no_std` at compile time.
nros-sizing-descriptor = { path = "../../tooling/nros-sizing-descriptor" }
