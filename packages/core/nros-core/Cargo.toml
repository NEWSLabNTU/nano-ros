[package]
name = "nros-core"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, traits, and node abstraction for nros"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "embedded", "no-std", "robotics", "middleware"]
categories = ["embedded", "no-std", "network-programming"]

[features]
# phase-361 W3 / issue 0591 — EMPTY. A non-empty `default` made `default`
# itself a feature-set member, so a consumer reaching this crate through it and
# one naming the same features explicitly were TWO compile units for identical
# code.
default = []
# phase-359 W10 — no `std` feature. A core crate is `core` or `core+alloc`
# (ARCHITECTURE §2); `alloc` is the one heap axis.
# phase-359 W10 (backend tier) — "a platform port is linked, so its wall-clock
# symbols resolve". Off by default: a pure-core build (no port) would fail to
# link. `nros-rmw-cffi` forwards it, because a C-ABI build always has a port.
#
# This exists so `Clock::system()` stopped being a thing you got by naming
# `std`. The RMW backends used to forward `nros-core/std` purely to keep that
# working on native, which made every backend a `std` grantor for the whole graph.
platform-clock = []
# phase-361 W2 (final) / issue 0598 — `alloc` forwards to `nros-serdes`, in ONE
# line: the defect was this crate's heap gate and `nros-serdes`'s disagreeing.
alloc = ["nros-serdes/alloc"]

[dependencies]
log = { version = "0.4", default-features = false }
nros-serdes = { workspace = true, default-features = false }
heapless = { workspace = true }

[lints]
workspace = true
