# A sizing descriptor whose ONLY job is to carry one declared endpoint —
# phase-454 W13, the Rust half of W10.
#
# `just check declared-qos-registration` builds `nros-node` against this and
# asserts the same `declared_qos::tests::declared_image` module the
# `NROS_ENTITY_DECLARED_DEPTHS` step asserts. The two carriers must deliver the
# SAME table, because they are the same fact arriving on two roads: the cmake
# road (native C/C++, Zephyr west, NuttX) sets the variable, and the
# single-package cargo leaf road — the one phase-454 W12 taught to read a
# contract — names a descriptor and sets no variable at all. W10 shipped with
# only the first, so `DECLARED_QOS_ROWS` was `None` on exactly the road that had
# a contract to compare against.
#
# The row deliberately matches the lane's variable
# (`std_msgs/msg/Int32|/chatter=1`) so one test body proves both.
#
# `undeclared_endpoints = 1` is DELIBERATE and is the second thing this fixture
# proves. It makes `descriptor_subscriptions` refuse — arena sizing prices every
# subscription or none, so a partial picture is no picture — while leaving the
# per-endpoint row available to the registration check, which needs no such
# guard: whether `/chatter`'s declared depth matches the depth registered on
# `/chatter` is a question about `/chatter`. If the check ever starts borrowing
# the sizing guard, this fixture stops producing a table and the lane goes red.

schema_version = 2

[meta]
entry = "declared-qos-fixture"
status = "partial"
basis = "contract"
undeclared_endpoints = 1

[[endpoint]]
kind = "subscription"
type = "std_msgs/msg/Int32"
topic = "/chatter"
history = "keep_last"
depth = 1

# issue 1256 -- a subscription that states the two POLICIES and no depth. The
# descriptor is the ONLY carrier of a declared reliability or durability (no env
# knob is added for them), so this row is what proves they reach
# `DECLARED_QOS_ROWS`: the lane expects a THIRD declared-image test on this
# carrier's step and only two on the env step, whose variable is depth-only.
[[endpoint]]
kind = "subscription"
type = "std_msgs/msg/Int32"
topic = "/status"
reliability = "best_effort"
durability = "volatile"

# issue 1608 -- two PUBLISHER rows. The descriptor is the only carrier of a
# publisher's declaration, so these are what prove it reaches
# `DECLARED_PUBLISHER_QOS_ROWS`: the lane expects a FOURTH declared-image test
# on this carrier's step. `/latched` is a latched topic (a default publisher is
# RAISED to it); `/plain` is declared volatile, so a transient_local publisher
# there is REFUSED -- the opposite direction from a subscription's rule.
[[endpoint]]
kind = "publisher"
type = "std_msgs/msg/Int32"
topic = "/latched"
history = "keep_last"
depth = 1
reliability = "reliable"
durability = "transient_local"

[[endpoint]]
kind = "publisher"
type = "std_msgs/msg/Int32"
topic = "/plain"
durability = "volatile"
