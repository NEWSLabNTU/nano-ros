[package]
name = "nros-diagnostics"
version = "0.5.0"
edition = "2021"
description = "Thin on-target contract-violation reporter (RFC-0052 W3b.1) — builds DiagnosticArray entries in the play_launch rule-id vocabulary; the caller owns the /diagnostics publisher"
license = "MIT OR Apache-2.0"

[features]
default = []
# phase-359 W10 — the `std` feature is GONE from this crate. It never gated
# anything here: this crate's own sources contain no `std::` path and no
# `feature = "std"` arm, so the feature existed purely to hand the flavour down
# to nros-core / nros-serdes on a consumer's behalf. A message crate has no
# business deciding whether the runtime under it is hosted.

[dependencies]
# phase-333 / issue 0394 — a generated msg crate carries the CONSTANT version
# `0.0.0`; its ament version moved to `[package.metadata.nros] ament_version`.
# This requirement still named the ament version (4.9.1), which after that
# change can never be satisfied — it broke resolution for the ROOT workspace,
# not just for consumers of this crate.
# PATH-ONLY, no version (RFC-0067 D1). A generated crate's version is the
# constant `0.0.0`, so pinning ANY value here re-couples this manifest to
# codegen output: the first spelling named the ament version (4.9.1) and broke
# the ROOT workspace when the constant landed (0394); the second named 0.0.0 and
# broke again when the core crates were briefly reverted. A path dep with no
# version cannot be wrong in either direction.
nros-diagnostic-msgs = { path = "../../interfaces/generated/humble/nros-diagnostic-msgs", default-features = false }
heapless = "0.8"
# phase-474 I7 -- `write_violation_report` streams a report's CDR without
# building the 5 KB `DiagnosticArray` value; it needs the writer and the
# header type the generated crate serializes with. Path-only, as above; both
# are already in every graph this crate is in, through nros-diagnostic-msgs.
nros-serdes = { path = "../nros-serdes", default-features = false }
nros-std-msgs = { path = "../../interfaces/generated/humble/nros-std-msgs", default-features = false }
