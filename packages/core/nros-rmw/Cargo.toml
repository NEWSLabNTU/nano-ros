[package]
name = "nros-rmw"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RMW abstraction layer for nros (middleware-agnostic traits)"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "rmw", "middleware", "embedded", "no-std"]
categories = ["embedded", "no-std", "network-programming"]
# Issue 1577 — carries the linked backends' dispatch declaration to direct
# dependents (`nros-node` reads `DEP_NROS_RMW_{IN_PLACE,BUFFERED}_DISPATCH`);
# see `in-place-dispatch` / `buffered-dispatch` below.
links = "nros_rmw"
build = "build.rs"

[features]
# Default: no-std. Depending crates that want `std` must opt in
# explicitly (matches nros-core). Previously `default = ["std"]`, which
# required `default-features = false` on every `no_std` downstream.
default = []
# phase-361 W2 (revised) — `std` does NOT imply `alloc`. On embedded, both are
# opted into EXPLICITLY, per package, by the end user; a dep that needs the heap
# must make the user say `alloc`, never turn it on behind their back.
std = ["alloc", "nros-core/std", "log"]
alloc = ["nros-core/alloc"]
# phase-359 W10 (backend tier) — pass-through only; see `nros-core`'s row.
platform-clock = ["nros-core/platform-clock"]

# Synchronization backends (mutually exclusive for mutex implementation)
# Default: spin::Mutex (works everywhere, but not RTIC-compatible)
sync-spin = ["dep:spin"]
# Critical section: uses cortex_m::interrupt::free (RTIC-compatible)
sync-critical-section = ["dep:critical-section"]

# Logging
log = ["dep:log"]

# E2E safety protocol (CRC-32 + sequence tracking)
safety-e2e = []

# Marker for backends that support native slot lending (zero-copy publish
# / borrow). Backends that opt in expose SlotLending / SlotBorrowing trait
# impls; nros-node's EmbeddedRawPublisher / RawSubscription select between
# native lend and the arena fallback at compile time via this flag.
# Phase 95.
lending = []

# Issue 1577 — how the LINKED backends deliver a subscription sample, declared
# by each BACKEND CRATE on this crate (never by a router or an umbrella: every
# image reaches its backend through `nros-rmw-cffi`, which knows nothing).
#
# * `in-place-dispatch` — the backend hands the sample to the callback out of its
#   own receive slot (`nros-rmw-zenoh`, `nros-rmw-xrce-cffi`), so an in-place
#   registration claims no receive region in the executor arena.
# * `buffered-dispatch` — it cannot (`nros-rmw-cyclonedds`, `nros-rmw-metadata`),
#   so every subscription claims one.
#
# `nros-node/build.rs` honours a sizing descriptor's `registration_path =
# "in_place"` row only when in-place is declared AND buffered is not. Both halves
# are load-bearing, because Cargo features UNIFY by union:
#
# * buffered must VETO — a bridge image links zenoh and cyclone, and zenoh's
#   declaration would otherwise apply to cyclone's subscriptions;
# * in-place must be CLAIMED rather than assumed — a backend with no Rust crate
#   (Cyclone and uORB under cmake reach cargo as a bare `rmw-cffi`) declares
#   nothing, and silence has to price the full region.
#
# Every crate that depends on this one under `packages/rmw/` is classified in
# `check-backend-dispatch-declared`.
in-place-dispatch = []
buffered-dispatch = []

[dependencies]
nros-core = { workspace = true, default-features = false }
# Phase 248 (C2) — `type_descriptor` seam passes the message's static
# field schema (`nros_serdes::schema::{Field, Message}`) across the
# generic descriptor-registration hook. no_std + alloc-free.
nros-serdes = { workspace = true, default-features = false }
heapless = { workspace = true }

# Synchronization backends (optional)
spin = { version = "0.9", optional = true, default-features = false, features = ["mutex", "spin_mutex"] }
critical-section = { version = "1.1", optional = true }

# Logging
log = { workspace = true, optional = true }

[dev-dependencies]
nros-ghost-types = { path = "../../verification/nros-ghost-types" }

[lints]
workspace = true
