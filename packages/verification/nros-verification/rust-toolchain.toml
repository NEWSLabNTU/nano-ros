# The rust toolchain the pinned Verus binary was built with: the `toolchain`
# field of `version.json` in its bundle (`$(nros dev sdk path verus)/bin/`), the
# same value `verus --version` prints as `Toolchain:`. Verus runs only under
# that toolchain, and it compiles `vstd` itself, so the `vstd` pin in
# Cargo.toml is part of the same release (issue 2499).
#
# This file, Cargo.toml's `vstd = "=…"` and `[tool.verus]` in
# `nros-sdk-index.toml` move TOGETHER. `just verify-verus` refuses a mismatch
# (`scripts/check-verus-pins.py`) before cargo runs, naming the value to set.
[toolchain]
channel = "1.96.0"
