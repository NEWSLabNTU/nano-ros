# The runner packages workspace (RFC-0119 D5, phase-527 W3).
#
# Runners are HOST tools: they drive a launcher, flasher or console for
# `nros run`, `nros flash` and `nros monitor` (RFC-0118). They are their own
# cargo workspace with their own `Cargo.lock`, as `packages/cli` is, because a
# host tool must not share a target directory with an image root (issue 0616:
# one target directory per workspace root).
#
# Members: `nros-extension`, the SDK crate every runner, every command package
# and the core CLI depend on, and the first-party runner packages of RFC-0119
# D8 (phase-528 W3: native, qemu, fvp, west, command; phase-529 adds the
# hardware ones). `just setup-cli` builds whatever is here beside the CLI.
[workspace]
resolver = "2"
members = [
    "nros-extension",
    "nros_runner_command",
    "nros_runner_fvp",
    "nros_runner_native",
    "nros_runner_qemu",
    "nros_runner_west",
]

[workspace.package]
authors = ["Lin Hsiang-Jui <jerry73204@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NEWSLabNTU/nano-ros"
homepage = "https://github.com/NEWSLabNTU/nano-ros"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
