[package]
name = "nuttx-sys"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bindgen-generated FFI bindings for NuttX POSIX sockets"
publish = false

[lib]
name = "nuttx_sys"

[build-dependencies]
bindgen = "0.72"
# Issue 0525 — the ONE resolution of "which arch's NuttX headers", shared with
# the board crates. Without it this script binds whichever arch the shared
# checkout was configured for last.
nros-build-paths = { path = "../../../tooling/nros-build-paths" }
