[package]
name = "threadx-netx-sys"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bindgen-generated FFI bindings for NetX Duo BSD sockets on ThreadX"
publish = false

[lib]
name = "threadx_netx_sys"

[build-dependencies]
# issue 0652 — the ONE riscv64 toolchain resolver (see its module docs).
nros-build-paths = { path = "../../../tooling/nros-build-paths" }
bindgen = "0.72"
