[package]
name = "nros-smoltcp"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "smoltcp TCP/UDP network provider for nros (bare-metal systems)"

[lib]
name = "nros_smoltcp"

[features]
default = []
# Phase 204.2 — bump the smoltcp UDP socket-pool default to 4 (3 RTPS
# sockets/participant + 1 spare) for a bare-metal DDS/RTPS backend. Off by
# default: every shipped bare-metal board is brokered (zenoh/XRCE → 1 UDP),
# and bare-metal DDS over smoltcp is not built yet (Phase 175.B). A board that
# grows that path enables `nros-smoltcp/rtps` and the pool sizes itself — no
# per-example `NROS_NET_MAX_UDP_SOCKETS` env.
rtps = []
# Phase 173.6 — expose the smoltcp socket layer through the
# `embedded-nal` `TcpClientStack` / `UdpClientStack` ecosystem traits
# (additive adapter over the existing C-ABI bridge ops).
embedded-nal = ["dep:embedded-nal", "dep:nb"]

[dependencies]
nros-platform-api = { version = "0.6.0", path = "../../../platform/nros-platform-api" }
# Phase 173.6 — optional `embedded-nal` adapter. `core::net`-based
# network-stack traits; `nb` for the non-blocking result type.
embedded-nal = { version = "0.9", optional = true }
nb = { version = "1", optional = true }
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp",
    # Phase 71.26 — IGMP for RTPS SPDP multicast (239.255.0.1:7400+).
    "multicast",
] }
# Phase 97.3.esp32-qemu — diagnostic counters use atomic fetch_add, which a
# CAS-less target (riscv32imc, thumbv6m) has only through portable-atomic.
# Phase 214.L.1 / phase-337 W2.b chose the backend here by target cfg; see
# the note below for why that moved out of this crate.
portable-atomic = { version = "1", default-features = false }
# Issue 2962 -- this crate does NOT choose portable-atomic's backend on a
# CAS-less target (thumbv6m, riscv32imc). portable-atomic refuses
# `unsafe-assume-single-core` together with `critical-section`, and the
# backend is a fact about the SYSTEM, which a library cannot know: a Zephyr
# Rust image gets `critical-section` from upstream's `zephyr` crate, a C/C++
# image from `nros-c`'s `critical-section` capability, and a bare-metal board
# names its own in its board crate. Choosing it here (the old
# `cfg(all(target_os = "none", not(target_has_atomic = "ptr")))` row) failed
# every Rust image on rpi-pico-w-zephyr, where both halves met. Gate:
# check-portable-atomic-backend.

[build-dependencies]
# phase-400 W6 — the `[knobs.net]` platform/board rungs. The LEAF ladder crate,
# not `nros-board-common`: that one reaches back here through `nros-platform ->
# nros-platform-esp32-qemu -> nros-smoltcp`, which cargo rejects as a cycle.
nros-platform-config = { path = "../../../tooling/nros-platform-config" }
# phase-484 W5a — the one knob ladder, which reads every registry spelling of a
# knob (`NROS_SMOLTCP_*` and its legacy `ZPICO_SMOLTCP_*`). Already in this
# crate's graph through `nros-platform-config`; named so the call is direct.
nros-zephyr-build = { path = "../../../tooling/nros-zephyr-build" }
