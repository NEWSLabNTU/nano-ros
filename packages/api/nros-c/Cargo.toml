[package]
name = "nros-c"
version.workspace = true
publish = false
edition = "2024"
description = "C API for nros - rclc-compatible interface for embedded systems"
license = "Apache-2.0"
repository.workspace = true
keywords = ["ros", "ros2", "embedded", "c", "ffi"]
categories = ["embedded", "robotics", "api-bindings"]
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
# issue 1512 — the cargo channel this crate's own headers travel on, for a
# consumer that compiles C in a BUILD SCRIPT rather than under cmake.
#
# It buys two things, and the second is the load-bearing one:
#
#  * `DEP_NROS_C_INCLUDE` / `DEP_NROS_C_CONFIG_INCLUDE` — the public `include/`
#    and the per-build `nros_config_generated.h` directory, so a consumer never
#    has to guess a path from `NROS_REPO_DIR` or walk up out of `OUT_DIR`.
#  * ORDERING. Cargo guarantees that a dependent's build script runs AFTER the
#    build script of every dependency carrying a `links` key. Without that, a
#    consumer compiling C against `nros_config_generated.h` is racing the
#    script that writes it, and the loser silently reads the committed
#    `#error` stub or a museum copy — issue 0088/0268's class, which cmake
#    solves with an explicit ninja edge and cargo solves with this.
#
# Same channel and spelling `nros-node` already uses (`links = "nros_node"` ->
# `DEP_NROS_NODE_RX_BUF_SIZE`, which THIS crate's build script reads).
links = "nros_c"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[features]
# phase-361 W3 / issue 0591 — EMPTY of `std`, deliberately. But a bare
# `cargo check -p nros-c` builds this crate's `staticlib`/`cdylib`, which is a
# FINAL artifact: `no_std` + no panic provider is `#[panic_handler] function
# required, but not found`. Naming the crate's own spin handler here keeps the
# standalone check meaningful without reintroducing a `std` default — every
# real consumer takes this crate with `default-features = false` and picks its
# own provider, so nothing downstream is affected.
default = ["panic-platform"]
# phase-359 W10 — `env` rides with `std` here; see the same note in `nros-cpp`.
# `std` on the C API has always meant "hosted", and a hosted C entry resolves
# its locator/domain from the environment at runtime.
# phase-359 W10 — the process-environment CAPABILITY, named here so this crate's
# own `#[cfg]` can ask for it. `std` continues to imply it, which preserves what
# a C image linking the std flavour has always had: `$NROS_RMW` backend
# selection. Without this feature the cfg would be permanently false and that
# selection would vanish from the C API silently.
env = ["nros/env"]
std = ["alloc", "env", "nros/std", "nros-node/std", "nros-rmw/std"]
# Issue 1556 items 2-3 — a C application is a census PRODUCER. With this
# feature the hosted support init answers `$NROS_CENSUS_OUT` by selecting the
# recording backend, and the first spin writes what the recorder saw (the
# hooks are `nros::census_hooks`, which every `nros-c` node / timer / guard /
# parameter entry point calls) and exits instead of spinning. Host-only: it
# REQUIRES `std` (the switch is an environment variable and the census a file;
# `compile_error!` without it),
# which no RTOS image has. `nros-cpp`'s `metadata-mode` forwards here, because
# that umbrella bundles this crate.
metadata-mode = ["nros/metadata-mode", "dep:nros-rmw-metadata"]
alloc = ["nros/alloc", "nros-node/alloc", "nros-rmw/alloc"]

# RMW backend (cffi vtable dispatch) — every backend ships as a cffi
# shim that installs a C vtable into `nros-rmw-cffi`'s runtime
# registry. Each backend's standalone staticlib (`libnros_rmw_<x>.a`)
# carries a `.init_array` ctor (phase 104.A) that runs its register fn
# before `main()` on POSIX / macOS / Windows. `nros-c` does NOT pin a
# specific RMW.
rmw-cffi = ["nros/rmw-cffi"]

# Phase 252 / issue 0073 — E2E message-integrity (CRC + sequence gap/dup) for the
# C/C++ API. Forwards to the `nros` umbrella (the CFFI integrity machinery +
# `IntegrityStatus`) AND the zenoh backend's own `safety-e2e` (the CRC attach on
# publish + validate on receive — `nros/safety-e2e` does not reach the backend;
# Cargo features don't propagate upward). Surfaces `nros_integrity_status_t` +
# `nros_subscription_take_validated` across the C ABI. zenoh-only (the only
# backend with the CRC path); `?` keeps it inert when zenoh isn't selected.
safety-e2e = ["nros/safety-e2e", "nros-rmw-zenoh?/safety-e2e"]


# Phase 124.A — opt in to the zero-copy publisher loan / subscriber
# borrow surface (`nros_publisher_loan` / `_commit` / `_discard` /
# `nros_subscription_borrow` / `_release`). Threads the
# `nros-rmw-cffi/lending` cargo bound through.
lending = ["rmw-cffi", "nros/lending"]

# Phase 8 (autoware-safety-island `docs/design/callback_tracing.rst`) —
# callback-level dispatch tracing. Pure forward to `nros`; the hooks and the
# runtime-installed `extern "C" fn(u32, u32)` sink live in `nros-node`. A C
# image installs the sink itself — the ABI is deliberately the C signature a
# platform trace shim already has — so nothing here names a platform. Off by
# default.
trace-callbacks = ["nros/trace-callbacks"]

# Phase 123.A.11 — `cffi-xrce-c` / `cffi-dds-cffi` / `cffi-zenoh-cffi`
# DELETED. They previously selected which `extern fn
# nros_rmw_<x>_register()` call site got compiled into
# `nros_support_init`. The auto-register pattern in each backend's
# wrapper staticlib makes nros-c truly RMW-agnostic — one
# `libnros_c.a` per target triple covers every backend.
#
# Compatibility shims: keep the feature names accepted so downstream
# CMake glue that still passes them doesn't error. `cffi-xrce-c` also
# links the C XRCE backend for Zephyr's in-tree staticlib path, where
# downstream `nano_ros_link_rmw()` is not involved.
# Phase 241.D3-rev — single-runtime umbrella. Bundle the selected RMW backend as an
# rlib dep so `libnros_c.a` carries the C ABI + the cffi shim + the backend in ONE
# archive: one `std`, one `REGISTRY`, one backend closure. The backend self-registers
# via the `RMW_INIT_ENTRIES` linkme section (same path as a pure-Rust binary), walked
# by `nros_rmw_cffi_walk_init_section` at `Executor::open`.
#
# This reverts Phase 134.fix's `dep:nros-rmw-zenoh` drop. That drop worked around a
# *multi-staticlib* hazard — `libnros_c.a` AND `libnros_rmw_zenoh.a` each bundling a
# crate-hash-distinct cffi/zenoh-pico instance, reconciled only by
# `--allow-multiple-definition`, leaving each public no_mangle entry possibly bound
# to the other instance's structs. With exactly one Rust staticlib that cannot occur:
# one cffi instance, one VTABLE, one zenoh-pico. The linkme DUPCHECK that forced the
# standalone-staticlib `.init_array` workaround likewise cannot collide.
#
# Backends are mutually exclusive — select exactly one. The backend rlib is
# force-linked into the umbrella via `src/rmw_backend.rs` (a `pub use` of its
# `register` + an `.init_array` ctor), NOT the linkme section: `nros-c` is the
# staticlib root and would otherwise DCE the unreferenced backend rlib entirely.
# (Mirrors the retired `nros-rmw-zenoh-staticlib` wrapper, now folded in here.)
rmw-zenoh = ["rmw-cffi", "dep:nros-rmw-zenoh"]
rmw-xrce = ["rmw-cffi", "dep:nros-rmw-xrce-cffi"]
# Cyclone DDS is a C++ CMake lib linked separately (not a Rust staticlib) — the
# umbrella only carries the cffi shim it registers against.
rmw-cyclonedds = ["rmw-cffi"]
# Back-compat shims (downstream cmake glue may still pass these names).
cffi-xrce-c = ["rmw-xrce"]
cffi-zenoh-cffi = ["rmw-zenoh"]
cffi-dds-cffi = ["rmw-cyclonedds"]

# Zenoh transport refinements (require rmw-zenoh-cffi)
# Phase 128.E.1 — `link-tcp` / `link-udp-unicast` retired.

# XRCE transport refinements (require rmw-xrce-cffi)
# Phase 248 C5c — `nros`'s vestigial `xrce-udp`/`xrce-serial` aliases (chained
# to inert/platform features) were removed; these stay as inert markers for
# downstream cmake glue that may still pass the names. The XRCE transport mode
# is selected by the linked backend + board, not these.
xrce-udp = []
xrce-serial = ["nros-node/posix-serial"]

# Functional capability — install the Rust `#[global_allocator]` routing
# through the platform vtable (`nros_platform_alloc`/`_dealloc`). Phase 248:
# replaces the per-platform `#[global_allocator]` cfg in lib.rs so the crate
# stays platform-agnostic. Enabled by RTOS ports whose kernel owns the
# unified heap and that don't bring an external allocator (zephyr-lang-rust
# etc.); the concrete allocator lives behind the vtable.
# phase-361 W8.a / issue 0594 — does NOT enable `alloc`. The allocator module
# uses only `core::alloc::GlobalAlloc`; `extern crate alloc` is gated separately
# on the `alloc` feature. Installing a `#[global_allocator]` says "this platform
# owns a heap", not "this image may allocate" — the second is the user's call.
# phase-361 W8.c / issue 0594 — it no longer MIRRORS nros-platform's feature, it
# FORWARDS to it. This crate's own `#[global_allocator]` is deleted: it sat under
# a gate identical to nros-platform's and reached the same heap by a different
# route, and since `nros-platform` is a non-optional dep below, an image turning
# on both got a duplicate lang item. One owner, so the collision cannot be
# spelled.
global-allocator = ["nros-platform/global-allocator"]

# Functional capability — register the `critical_section::Impl` backed by
# the platform vtable (`nros_platform_critical_section_{acquire,release}`).
# Phase 248: replaces the `platform-zephyr` cfg on the critical-section
# block. Mirrors nros-platform's `critical-section`.
critical-section = ["dep:critical-section"]

# phase-361 W8.d / issue 0594 — a `platform-*` feature selects the PROVIDER of
# malloc + panic for this platform (that is the "unified per platform" half of
# the contract) and NOTHING else. It no longer lists `alloc`: whether the image
# may allocate is the end user's call, spelled `alloc` at their own dep-site.
# The CMake path already worked this way — `nros_feature_set()` emits
# `std`/`alloc` + `panic-halt` explicitly per platform — so this only brings the
# Rust manifests into line with that table.
# Platform backends (select one — orthogonal to RMW and ROS version).
# Ports that own the unified kernel heap enable `global-allocator` (and, where
# DDS/portable-atomic need it, `critical-section`) so the agnostic blocks in
# lib.rs compile without the build script passing them explicitly. They do NOT
# select a panic provider: that is the entry's, via `panic-platform` (phase-366).
# Phase 248 C5c — route the platform impl through a DIRECT `nros-platform`
# dep, NOT the now-agnostic `nros` umbrella (`nros` no longer carries
# `platform-*`). nros-c is the C/C++ staticlib root: it brings the bundled
# backend (D3) + the platform-cffi symbols via `nros-platform/platform-X`.
# phase-417 W4.d — every platform arm activates `nros-log/platform-clock`,
# because a linked port is exactly the condition under which
# `nros_platform_clock_ns` resolves. Without it `nros_log_*` records carry
# `timestamp_ns: 0` and `nros_log_throttle_admit` has no time base — a stuck
# clock is a window that never elapses, so a 200 ms window admits the FIRST
# record and then none (issue 1152; before it the same constant admitted EVERY
# record: measured 40 of 40 without, 5 of 40 with).
platform-posix = [
    "nros-log/platform-clock",
    "nros-platform/platform-posix",
    "nros-rmw-zenoh?/platform-posix",
]
platform-zephyr = [
    "nros-log/platform-clock",
    "global-allocator",
    "critical-section",
    "nros-platform/platform-zephyr",
    "nros-rmw-zenoh?/platform-zephyr",
]
platform-freertos = [
    "nros-log/platform-clock",
    "global-allocator",
    "nros-platform/platform-freertos",
    "nros-rmw-zenoh?/platform-freertos",
]
platform-nuttx = [
    # issue 0617 — NuttX owns a kernel heap (`kmm_malloc`, reached through the
    # cffi vtable's `nros_platform_alloc`), so it belongs with zephyr/freertos/
    # threadx: the port SUPPLIES malloc and panic. It was the one RTOS row
    # missing both, which went unnoticed only because NuttX images used to link
    # `std` — libstd supplied the `#[panic_handler]` and the allocator. The
    # drop-std campaign (phase-359/361) removed that cover and the row was never
    # updated, so `nros-c` failed to compile for armv7a-nuttx-eabihf with
    # "`#[panic_handler]` function required, but not found" and took the whole
    # NuttX fixture family with it.
    "nros-log/platform-clock",
    "global-allocator",
    "nros-platform/platform-nuttx",
    "nros-rmw-zenoh?/platform-nuttx",
]
platform-threadx = [
    "nros-log/platform-clock",
    "global-allocator",
    "nros-platform/platform-threadx",
    "nros-rmw-zenoh?/platform-threadx",
]

# ---- Bare metal: one arm PER BOARD, and that is not a slip (issue 1512) ----
#
# Every other platform above names a single `nros-platform/platform-X`. Bare
# metal has no such X: `nros-platform` carries THREE board-specific ones
# (`platform-mps2-an385`, `platform-stm32f4`, `platform-esp32-qemu`), because a
# no-RTOS port IS the board — its clock is that board's timer, its net is that
# board's MAC, and it has no kernel in between to abstract them. The RMW half
# does have one name (`nros-rmw-zenoh/platform-bare-metal`), because zenoh-pico
# only needs to know "freestanding", and that asymmetry is what makes this look
# like an omission.
#
# Issue 1512 put two shapes on the table and said it picked neither. This is
# shape (a). Shape (b) — ONE `platform-bare-metal` arm that omits the
# `nros-platform/platform-X` line and leaves the concrete platform to whoever
# brings the board crate, which is what the Rust road and
# `nros-cli-core/src/builder/entry.rs` do — was MEASURED and does not compile:
#
#   cargo check -p nros-c --no-default-features --target thumbv7m-none-eabi \
#     --features panic-halt,alloc,rmw-zenoh,ros-humble,global-allocator,\
#   nros-log/platform-clock,nros-rmw-zenoh/platform-bare-metal
#   error[E0432]: unresolved import `crate::ConcretePlatform`
#     --> packages/platform/nros-platform/src/lib.rs:187:9
#     note: found an item that was configured out … gated here
#           #[cfg(any(feature = "platform-posix", … "platform-mps2-an385", …))]
#
# The reason the Rust road gets away with it is feature UNIFICATION inside one
# cargo graph: a Rust image's entry crate, its board crate and `nros-platform`
# are all members of the same resolve, so the board's unconditional
# `platform-mps2-an385` reaches `nros-platform` no matter who else is silent.
# `nros-c` has no such graph — Corrosion imports THIS manifest as its own cargo
# root (`corrosion_import_crate(MANIFEST_PATH .../nros-c/Cargo.toml)`), the
# board crate is not in it and cannot be (it is an rlib, and `nros-c` depending
# on a board is the inversion RFC-0064 forbids), so the platform selection has
# to be spelled here or it is spelled nowhere.
#
# So the two roads differ because their LINK ROOTS differ, not because one of
# them is wrong. What this costs is that the C staticlib root names a board —
# which is exactly what `nros_feature_set()`'s new bare-metal arm resolves from
# `NANO_ROS_BOARD`, so no caller spells one of these by hand.
#
# BUILD-VERIFIED: `platform-mps2-an385` only (thumbv7m-none-eabi, staticlib).
# The other two are the same four lines over the sibling `nros-platform`
# features; `platform-stm32f4` has no in-tree board and `platform-esp32-qemu`'s
# C/C++ road is the ESP-IDF component (see `PlatformKind::cmake_deploy`). They
# are listed anyway because a PARTIAL set is how a fourth spelling gets
# invented: `check-baremetal-platform-arms` holds these three against
# `nros-platform`'s three, both directions.
#
# `nros-platform/critical-section` rather than this crate's own
# `critical-section`: on a Cortex-M the impl is `cortex-m`'s PRIMASK
# single-core one, reached through `nros-platform-mps2-an385`, and that is the
# same impl the board crate registers for a Rust image — one per board. Taking
# the vtable route here instead would put a second `critical_section::Impl` in
# the tree for this board, which is the double-registration
# `nros-platform`'s own feature comment warns about.
platform-mps2-an385 = [
    "nros-log/platform-clock",
    "global-allocator",
    "nros-platform/platform-mps2-an385",
    "nros-platform/critical-section",
    "nros-rmw-zenoh?/platform-bare-metal",
]
platform-stm32f4 = [
    "nros-log/platform-clock",
    "global-allocator",
    "nros-platform/platform-stm32f4",
    "nros-rmw-zenoh?/platform-bare-metal",
]
platform-esp32-qemu = [
    "nros-log/platform-clock",
    "global-allocator",
    "nros-platform/platform-esp32-qemu",
    "nros-rmw-zenoh?/platform-bare-metal",
]

# ROS edition (orthogonal to RMW and platform)
ros-humble = ["nros/ros-humble"]
ros-iron = ["nros/ros-iron"]
ros-jazzy = ["nros/ros-jazzy"]

# Bare-metal panic handler (enables building staticlib without std)
panic-halt = ["dep:panic-halt"]


# phase-366 M4 / RFC-0077 — the ENTRY-selected panic provider, set by
# `nano_ros_entry(… PANIC platform)` through `corrosion_set_features()` after the
# entry is declared.
#
# The `platform-*` features do NOT select it, because they cannot answer the
# question it asks. Whether
# anything ELSE already supplies the handler is a property of the entry and its
# link step, not of the RTOS — the same platform is `own` for a Zephyr-hosted
# C/C++ image (the `zephyr` crate supplies it) and `platform` for a bare one.
panic-platform = []

# Opt-in instrumentation of the RTOS Rust global allocator (FreeRTOS
# pvPortMalloc / ThreadX z_malloc / Zephyr k_malloc). Tracks used/peak
# bytes routed through the Rust `#[global_allocator]` and exposes them via
# `nros_heap_used_bytes()` / `nros_heap_peak_bytes()`. NOTE: counts only the
# Rust allocator's footprint — zenoh-pico's direct C-side z_malloc/pvPortMalloc
# traffic is not included (see issue #6).
# phase-361 W8.c — the counter moved to `nros-platform` with the allocator it
# instruments; what stays here is the C surface that reads it. The old body
# pulled `zpico-alloc` (an RMW-layer crate) in for a pair of `AtomicUsize`.
alloc-stats = ["nros-platform/alloc-stats"]

# Expose ROS 2 parameter services (~/get_parameters, ~/set_parameters, etc.)
# via `nros_executor_register_parameter_services`. Requires alloc for boxed
# service responses.
param-services = ["nros/param-services", "nros-node/param-services"]

# Expose ROS 2 lifecycle services (~/change_state, ~/get_state, etc. — REP-2002)
# via `nros_executor_register_lifecycle_services`. Requires alloc for boxed
# service responses.
lifecycle-services = ["nros/lifecycle-services", "nros-node/lifecycle-services"]

# issue 1589 — the `/rosout` bridge from C (`nros_rosout_*`, declared in
# `<nros/log.h>`). Pulls code in and nothing else: without it every symbol
# still links and answers `NROS_RET_UNSUPPORTED` / `false`. Chosen per image by
# the `rosout` capability axis (`[system].features`), not named by hand.
rosout = ["nros/rosout", "nros-node/rosout"]

# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "cdylib/staticlib C ABI surface, built per-platform by cmake not by the workspace lane"

[dependencies]
# phase-361 W3 — `ffi-size-markers` is REQUESTED here, not inherited. It used to
# ride in on `nros`'s `default`, which this dep-site disables, so a `-p nros-c`
# build (what cmake/corrosion actually runs) resolved `nros` to `alloc,std` and
# got no markers; only a whole-workspace build did, by unification. The `#[used]`
# attribute those markers carry is what keeps `--gc-sections` from dropping the
# `__NROS_SIZE_*` arrays the build script probes (cf. issue 0464).
nros = { version = "0.5.0", path = "../nros", default-features = false, features = ["ffi-size-markers"] }
nros-node.workspace = true
nros-rmw.workspace = true
nros-core.workspace = true
# Issue 1556 — the recording backend, behind `metadata-mode` (host census only).
nros-rmw-metadata = { path = "../../rmw/metadata", optional = true }
# Phase 248 C5c — platform impl + the `nros_platform_*` cffi symbols come from
# here (via the `platform-X` features above), not the agnostic `nros` umbrella.
nros-platform = { workspace = true, default-features = false }
# Phase 88.12 — `nros_node_get_logger` returns a `&'static nros_log::Logger`
# resolved via the facade's intern table.
# phase-417 W4.d — NOT `features = ["platform-clock"]` here, deliberately.
# Cargo unifies features across a workspace build, so turning it on at the
# dependency turns it on for every crate that reaches `nros-log` -- including
# TEST binaries, which link no platform port and then fail with `undefined
# reference to nros_platform_clock_ns`. Measured: it broke `nros-log`'s own
# integration tests and `nros-rmw-cffi`'s lib test, neither of which touches
# this manifest.
#
# The feature's own comment says why: a host tool composing sinks without a
# platform port cannot satisfy it, which is exactly what a test binary is. So
# the clock rides on the PLATFORM features below, where a port is linked by
# construction and the symbol exists.
nros-log = { workspace = true }
# issue 0710 — `nros_log_init_default` installs the platform-ABI sink, which
# moved to `nros_platform_cffi::log` so that "this binary needs
# `nros_platform_log_write`" is a dependency rather than a Cargo feature. NO
# port feature here: without one this crate is bindgen declarations only, so the
# edge costs an embedded build nothing. The C API's consumers are images, and an
# image links a port by construction.
nros-platform-cffi = { workspace = true, default-features = false }
nros-rmw-zenoh = { workspace = true, optional = true, default-features = false }
nros-rmw-xrce-cffi = { workspace = true, optional = true, default-features = false }
# phase-361 W8.c — the `zpico-alloc` dep is gone with the `HeapStats` static it
# provided; `alloc-stats` now forwards to `nros-platform/alloc-stats`, whose
# counter lives beside the one global allocator.
paste = "1"
panic-halt = { version = "1", optional = true }
# critical-section impl provided by the Zephyr alloc module on
# platform-zephyr. DDS + portable-atomic depend on it being set.
#
# Same gating as nros-cpp/Cargo.toml — restore-state-u32 is only safe
# on real Cortex-M Zephyr; native_sim x86 needs to fall back to
# DDS[std]'s restore-state-bool.
critical-section = { version = "1.1", optional = true }
# Phase 212.M.7 — riscv32imc (esp32c3 under ESP-IDF) has no hardware
# atomics. `core::sync::atomic::AtomicBool::compare_exchange` is gated
# behind `target_has_atomic = "ptr"` and unresolved on that target.
# `portable_atomic::AtomicBool` polyfills via the
# `portable_atomic_unsafe_assume_single_core` cfg (set by the ESP-IDF
# integration shell on single-core riscv targets) or a `critical-
# section` impl.
portable-atomic = { version = "1", default-features = false }

[target.'cfg(target_arch = "arm")'.dependencies]
critical-section = { version = "1.1", optional = true, features = ["restore-state-u32"] }

# AArch64 Zephyr (Phase 117.10/13) — DAIF mask used by
# `nros_zephyr_irq_{lock,unlock}` is a 32-bit value, same width as the
# armv7 path above.
[target.'cfg(target_arch = "aarch64")'.dependencies]
critical-section = { version = "1.1", optional = true, features = ["restore-state-u32"] }

[build-dependencies]
nros-build-helpers = { workspace = true }
# phase-340 W5.b — the `nros` BUILD-dependency is gone (2026-08-07).
#
# Phase 77.25 added it purely to force ordering: the size probe's filesystem
# path polled the OUTER target dir for a `libnros-*.rlib`, so `nros` had to be
# compiled before this build script ran. Issue 0464 deleted that path — the
# probe now builds `nros` itself in an isolated nested target dir and never
# reads the outer graph — so the edge orders something nobody waits for.
#
# It was not free: it dragged nros -> nros-node -> nros-core -> heapless,
# portable-atomic, log ... into the BUILD-dependency graph, where cargo compiles
# them again at opt-level=0/panic=unwind. Measured 181 units -> 165 and the
# product/build-graph overlap 12 -> 8 on its removal.
#
# `nros` remains a REGULAR dependency below, which is what the nested probe's
# `cargo build -p nros` resolves through — with `ffi-size-markers` requested at
# that dep-site (issue 0593), so the probe's `--features=<resolved>` carries it.

# phase-361 W3 fallout — the crate's OWN tests need `std` spelled.
#
# `default = []` is the contract: an embedded user picks `std`/`alloc`/platform
# deliberately, and nothing is enabled behind their back. But it applies to this
# crate's test build too, and there the "user" is `cargo test --workspace`, which
# passes no features at all. With no `std`, `platform.rs` takes its `no_std` arm
# and calls `nros_platform_clock_us` / `_sleep_us` — C ABI symbols supplied by a
# platform port that no feature selected — so the lib test failed to LINK:
#
#     rust-lld: error: undefined symbol: nros_platform_clock_us
#       >>> referenced by platform.rs:58 (nros_c::platform::get_time_ns)
#
# A self dev-dependency is how a crate enables its own features for tests only:
# it leaves the published feature set untouched (a consumer still gets
# `default = []`) while making the test target hosted, which is what these tests
# are. This is NOT a default in disguise — `cargo build -p nros-c` is unchanged.
#
# It went unnoticed because every check in phase-361 named its features
# explicitly (`std,rmw-cffi,platform-posix,ros-humble`, `platform-threadx,alloc`,
# …); the featureless configuration is the one nobody built.
[dev-dependencies]
# phase-417 stage 3 — `rmw-cffi` joined `std` here, and the reason is issue
# 1226's rule: a test that WORKS is not a test that RUNS. Eleven of this crate's
# modules — `node`, `service`, `subscription`, `publisher`, `timer`, `executor`,
# … — are behind `#[cfg(feature = "rmw-cffi")]` (see `rmw_modules!` in `lib.rs`),
# and `just test-unit` is `cargo nextest run --workspace` with NO `--features`,
# which resolves this crate to `default, panic-platform, std, alloc, env` and
# nothing else (measured with `cargo tree --workspace -i nros-c -e features`).
# So every unit test in those modules compiled, passed locally under an explicit
# `--features rmw-cffi`, and was built by no merge-gating lane: 95 of this
# crate's 126 lib tests, including phase-417 W5.c's timer accessors and this
# stage's `is_valid` family. It costs the lane the cffi vtable registry and no
# backend — `rmw-cffi` is `nros/rmw-cffi`, not `rmw-zenoh`, so no vendored
# source is pulled in.
nros-c = { path = ".", features = ["std", "rmw-cffi"] }
# issue 0619 — same reason as `nros-cpp`'s: a lib TEST is a final artifact and
# links no platform port, so `nros-log`'s `PlatformSink` leaves
# `nros_platform_log_write` / `_flush` declared and never defined.
#
# 0619 recorded this half as fixed in passing and added no dev-dependency. It
# reproduces at BOTH profiles — the `nros-relwithdebinfo` repro the issue
# verified as clean, and the dev profile its own new gate line runs — so the
# measurement that found this dead weight did not hold.
#
# `posix-c-port` compiles `nros-platform-posix/src/{platform,net,timer}.c`, the
# host port every real consumer links. NOT `c-stub-test`: the two are mutually
# exclusive and a workspace build unifies both on.
nros-platform-cffi = { workspace = true, features = ["posix-c-port"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
