# cbindgen configuration for nros-c — generates include/rclc/detail/nros_generated.h.

language = "C"
header = """/**
 * nros C API — auto-generated type definitions and function declarations.
 *
 * AUTO-GENERATED — DO NOT EDIT MANUALLY.
 *
 * This header is the single source of truth for all nros C API types.
 * Individual headers (publisher.h, executor.h, etc.) include this file.
 *
 * Copyright 2024 nros contributors
 * Licensed under Apache-2.0
 */

#include <stdarg.h>
#include <stdbool.h>
#include <stdint.h>
#include <stddef.h>

#include "rclc/visibility_control.h"
#include "rclc/detail/nros_config_generated.h"
/* issue 2081 — `rmw_request_id_t`, hand-written under the guard the RMW ABI
 * and rclcpp share; excluded from export below. */
#include "rclc/detail/request_id.h"
/* phase-515 C4b — `unique_identifier_msgs__msg__UUID`, the goal id of an rclc
 * goal handle, declared under the guard the generated message shares;
 * excluded from export below. */
#include "rclc/detail/uuid.h"

/* Forward declarations for callback typedefs that reference these
 * structs before they appear in source-order output. Without these,
 * gcc treats `struct rcl_timer_t *` inside a callback parameter list
 * as a parameter-local incomplete type that doesn't match the later
 * file-scope struct definition. */
#ifdef __cplusplus
extern "C" {
#endif
struct rclc_executor_t;
struct rcl_node_t;
struct rcl_publisher_t;
struct rcl_subscription_t;
struct rcl_service_t;
struct rcl_client_t;
struct rcl_timer_t;
struct rcl_guard_condition_t;
struct rcl_action_server_t;
struct rcl_action_client_t;
struct rcl_lifecycle_state_machine_t;
struct rclc_support_t;
struct rcl_clock_t;
struct rclc_goal_handle_t;
struct rclc_goal_uuid_t;
#ifdef __cplusplus
}
#endif
"""
include_guard = "NROS_GENERATED_H"
autogen_warning = "/* Warning: this file is autogenerated. Don't modify this manually. */"
include_version = false
no_includes = true
cpp_compat = true

# Map usize to size_t (not uintptr_t)
usize_is_size_t = true

[defines]
# Don't map features to C #ifdef — we want all types unconditionally
# cbindgen includes items with unknown cfg values by default

[export]
# Prefix for exported item names (not needed — Rust names already have nros_ prefix)
#
# *_OPAQUE_U64S consts are excluded so that the real, feature-aware
# values from `nros_config_generated.h` (emitted by build.rs) win
# unambiguously. Letting cbindgen emit them can #define placeholder
# values from the non-cffi cfg branch, which produces redefinition
# warnings and wrong fallback storage sizes.
exclude = [
    "SESSION_OPAQUE_U64S",
    "PUBLISHER_OPAQUE_U64S",
    "GUARD_HANDLE_OPAQUE_U64S",
    "EXECUTOR_OPAQUE_U64S",
    "NROS_LIFECYCLE_CTX_OPAQUE_U64S",
    "SUBSCRIPTION_OPAQUE_U64S",
    "SERVICE_SERVER_OPAQUE_U64S",
    "SERVICE_CLIENT_OPAQUE_U64S",
    "ACTION_SERVER_OPAQUE_U64S",
    "ACTION_CLIENT_OPAQUE_U64S",
    # Phase 88.12 — the log surface is hand-authored in
    # `<rclc/log.h>` so the macros + Doxygen comments survive.
    # Cbindgen would re-emit the enum + functions under their
    # mangled forms and collide with the hand-written header.
    "rcl_log_severity_t",
    # phase-417 stage 3 — the seven `NROS_LOG_SEVERITY_*` levels are ASSOCIATED
    # CONSTS on that type now, and EXCLUDING THE TYPE DOES NOT EXCLUDE THEM:
    # cbindgen sees seven separate constant items whose value is a struct
    # literal it cannot render, and emits a blank line for each. Neither their
    # bare names nor the `nros_log_severity_t_`-prefixed spelling match here
    # (both were measured); the annotation that does work is a
    # `/// cbindgen:ignore` doc line on each const, which is where they carry
    # it. Look there, not here, if they ever reappear in the header.
    "rclc_log_emit",
    "rclc_log_emit_fmt",
    "rclc_log_init",
    "rclc_log_default_logger",
    # phase-417 W4.d — same reason, same header. `rclc_log_sink_fn` also brings
    # cbindgen's synthesised `Option_nros_log_sink_fn` (from the `Option<fn>`
    # nullable-callback slot), which is an OPAQUE struct in the generated header
    # and therefore not passable by value from C at all.
    "rclc_log_emit_at",
    "rclc_log_get_logger",
    "rclc_logger_get_name",
    "rclc_logger_set_level",
    "rclc_logger_get_child",
    # issue 1589 — the `/rosout` bridge, hand-authored in the same header.
    "rcl_logging_rosout_enabled",
    "rclc_rosout_publisher_init",
    "rclc_rosout_qos_default",
    "rclc_rosout_enable",
    "rclc_rosout_pump",
    "rclc_logger_get_level",
    "rclc_logger_is_enabled",
    # phase-467 — the process-wide default threshold, hand-authored in
    # `<rclc/log.h>` beside the rest of the level surface for the same reason.
    "rclc_log_set_default_level",
    "rclc_log_get_default_level",
    "rclc_log_sink_fn",
    "Option_nros_log_sink_fn",
    "rclc_log_add_sink",
    "rclc_log_throttle_admit",
    "rclc_log_timestamp_available",
    # issue-0027 (gcc 14 / riscv NuttX) — platform-PROVIDED functions
    # (posix.h / board startup.c), imported by Rust in a `cfg(not(std))`
    # `unsafe extern "C"` block. `[parse] clean` does not strip the edition-2024
    # `unsafe extern` block, so cbindgen re-emits them as ungated `extern` decls
    # that collide with the `static inline` defs in
    # `platform/{posix,freertos,baremetal,zephyr}.h` (gcc 14 errors "static
    # declaration follows non-static"; gcc 10 only warned). `platform.h` is their
    # canonical `#ifndef NROS_PLATFORM_HAS_ATOMICS`-gated declaration site for C
    # consumers, so suppress the cbindgen copies.
    "nros_platform_time_ns",
    "nros_platform_sleep_ns",
    "nros_platform_atomic_store_bool",
    "nros_platform_atomic_load_bool",
    # issue 2081 — `rmw_request_id_t` is declared by `<rclc/detail/request_id.h>`
    # under the guard `<nros/rmw_entity.h>` and rclcpp's `service.hpp` share, so
    # a TU that includes two of them sees one definition. The Rust side names
    # it as an alias of `nros_node::RawRequestId`, same layout.
    "rmw_request_id_t",
    # phase-515 C4b — declared by `<rclc/detail/uuid.h>` under the guard the
    # generated `unique_identifier_msgs` header shares.
    "unique_identifier_msgs__msg__UUID",
]

[export.rename]
# Map Rust constant names (without prefix) to C names (with NROS_ prefix)
"MAX_LOCATOR_LEN" = "NROS_MAX_LOCATOR_LEN"
"MAX_NAME_LEN" = "NROS_MAX_NAME_LEN"
"MAX_NAMESPACE_LEN" = "NROS_MAX_NAMESPACE_LEN"
"MAX_TOPIC_LEN" = "NROS_MAX_TOPIC_LEN"
"MAX_SERVICE_NAME_LEN" = "NROS_MAX_SERVICE_NAME_LEN"
"MAX_ACTION_NAME_LEN" = "NROS_MAX_ACTION_NAME_LEN"
"MAX_TYPE_NAME_LEN" = "NROS_MAX_TYPE_NAME_LEN"
"MAX_TYPE_HASH_LEN" = "NROS_MAX_TYPE_HASH_LEN"

[fn]
rename_args = "None"
# Add NROS_PUBLIC visibility attribute to all function declarations
prefix = "NROS_PUBLIC"

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"

[parse]
parse_deps = false
# Remove extern blocks from output (we only want type definitions and fn declarations)
clean = true

# NOTE: `[parse.expand]` would let cbindgen expand `paste!` macros so the
# `unsafe extern "C" fn` declarations they generate appear in the C header.
# (The C parameter server is hand-declared in `<rclc_parameter/rclc_parameter.h>`
# on purpose, phase-491 / issue 0865: its module is `cbindgen:ignore`.) It
# requires nightly Rust (`-Zunpretty=expanded`), so we leave it disabled
# and keep those specific function declarations hand-written in
# parameter.h. Re-enable here if the project ever moves to nightly.
# [parse.expand]
# crates = ["nros-c"]
