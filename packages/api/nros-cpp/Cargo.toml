[package]
name = "nros-cpp"
version.workspace = true
publish = false
edition = "2024"
description = "nros C++ API — header-only C++14 library + Rust FFI staticlib"
license = "MIT OR Apache-2.0"
repository.workspace = true
keywords = ["ros", "ros2", "embedded", "cpp", "ffi"]
categories = ["embedded", "robotics", "api-bindings"]
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

[lib]
crate-type = ["staticlib", "lib"]

[features]
# phase-361 W3 / issue 0591 — EMPTY of `std`, deliberately. But a bare
# `cargo check -p nros-cpp` builds this crate's `staticlib`/`cdylib`, which is a
# FINAL artifact: `no_std` + no panic provider is `#[panic_handler] function
# required, but not found`. Naming the crate's own spin handler here keeps the
# standalone check meaningful without reintroducing a `std` default — every
# real consumer takes this crate with `default-features = false` and picks its
# own provider, so nothing downstream is affected.
default = ["panic-platform"]
std = [
    "env",
    "alloc",
    # phase-359 W10 — `env` rides with `std` HERE, and only here.
    #
    # W10 split `ExecutorConfig::from_env` and `try_resolve`'s hosted rung off
    # the `std` flavour onto an `env` CAPABILITY, so a Rust consumer now names
    # `alloc` + `env` explicitly. The C/C++ API has no such per-consumer
    # feature list to update — `std` on this crate has always MEANT "hosted",
    # and the hosted C entry resolves its locator and domain from the
    # environment at runtime.
    #
    # Dropping the forward silently removed that rung: the C++ and MIXED
    # service/action servers built and started, resolved against the baked
    # fallback instead of the environment, and the harness reported "server
    # never became ready" — 4 of 8 `roundtrip_xprocess` cells. Compiling proved
    # nothing about it.
    "nros/env",
    "nros/std",
    "nros-node/std",
    "nros-rmw/std",
    "nros-c/std",
    # Optional-dep forward: only applies when `bridge` is also on. Without it the
    # bridge ABI's std-only diagnostics compile out (issue 0436).
    "nros-bridge?/std",
]
alloc = ["nros/alloc", "nros-node/alloc", "nros-rmw/alloc", "nros-c/alloc", "nros-platform/alloc"]
# phase-359 W10 — the process-environment CAPABILITY, named so this crate's own
# `#[cfg]` can ask for it (the same reason `nros-c` gained one). `std` implies
# it, so a C++ image linking the std flavour keeps exactly what it had: the
# hosted component entry resolving its locator and domain from the environment.
env = ["nros/env", "nros-c/env"]

# Phase 241.D3-rev — single-runtime umbrella. `nros-cpp` bundles `nros-c` (the C
# ABI + the cffi shim + the force-linked backend) as an rlib dep, so `libnros_cpp.a`
# is the ONE Rust staticlib a C++ binary links: the C++ FFI + the full C ABI + the
# backend + one `std`. Backend selection forwards to `nros-c`'s umbrella features
# (its `rmw_backend` ctor does the auto-register); `nros-cpp` no longer pulls a
# backend rlib directly. Reverts Phase 161's drop, mirroring nros-c's W2.
rmw-cffi = ["nros/rmw-cffi", "nros-c/rmw-cffi"]

# Issue 0436 — the multi-RMW bridge ABI (`nros_init_multi` / `nros_fini_multi` /
# `nros_pubsub_bridge_*`) that `<nros/bridge.hpp>`'s `MultiExecutor` calls.
#
# The header shipped without any archive carrying its symbols: `nros-bridge` was
# reachable only from the RUST façade's `bridge` feature, so a C++ consumer could
# include `bridge.hpp`, compile, and then fail to link — and a PX4 module (which
# links `libnros_cpp.a` and nothing else) had no way to get them at all. Bundling
# it here follows the same rule the backends already do: ONE archive is what a C++
# binary links.
#
# Off by default: it pulls `alloc` (every bridge entity handle is boxed), which a
# bare-metal image must opt into deliberately.
bridge = ["dep:nros-bridge"]

# phase-308 — record declared entities instead of transporting them, for the
# host metadata probe. Turns on the three executor-side hooks (node / timer /
# guard condition) that the recording RMW backend cannot observe. Host only:
# never enabled by a board or entry build.
metadata-mode = ["nros/metadata-mode", "dep:nros-rmw-metadata"]

# Phase 252 / issue 0073 — E2E message-integrity (CRC) for the C++ API. Forwards
# to nros + nros-c + the zenoh backend's safety-e2e, and surfaces
# nros_cpp_integrity_status_t + nros_cpp_subscription_take_validated.
safety-e2e = ["nros/safety-e2e", "nros-c/safety-e2e", "nros-rmw-zenoh?/safety-e2e"]
# The backend is also a DIRECT dep here (`dep:`) so nros-cpp's own `rmw_backend`
# module can force-link it: nros-cpp is the staticlib root, and a `#[used]` anchor
# living in the `nros-c` dependency is DCE'd before nros-cpp's archive is emitted.
# cargo dedups the backend rlib with nros-c's, so this adds no second closure.
rmw-zenoh-cffi = ["rmw-cffi", "nros-c/rmw-zenoh", "dep:nros-rmw-zenoh"]
rmw-xrce-cffi = ["rmw-cffi", "nros-c/rmw-xrce", "dep:nros-rmw-xrce-cffi"]
rmw-cyclonedds-cffi = ["rmw-cffi", "nros-c/rmw-cyclonedds"]

# Phase 124.A — zero-copy publisher/subscriber loan ABI exposed
# through the C++ FFI (`nros_cpp_publisher_loan` / `_commit` /
# `_discard`, `nros_cpp_subscription_borrow` / `_release`).
lending = ["rmw-cffi", "nros/lending"]

# Phase 8 (autoware-safety-island `docs/design/callback_tracing.rst`) —
# callback-level dispatch tracing. Forwards to BOTH `nros` and `nros-c`: a C++
# image links `libnros_c.a` too, and the two crates must agree on whether the
# hooks are compiled in (a half-enabled pair would give a trace with the C
# entry points' callbacks missing). Hooks + sink live in `nros-node`. Off by
# default.
trace-callbacks = ["nros/trace-callbacks", "nros-c/trace-callbacks"]

# Phase 241.D3-rev (W8) — expose the param / lifecycle service surfaces through the
# umbrella. The C++ executor headers call the gated nros-c C entry points
# (nros_executor_register_parameter_services, nros_executor_lifecycle_*, …); a C++
# binary that uses them needs the umbrella built with these features so those symbols
# are compiled into libnros_cpp.a. Forward to nros-c (which pulls nros/nros-node).
param-services = ["rmw-cffi", "nros-c/param-services"]
lifecycle-services = ["rmw-cffi", "nros-c/lifecycle-services"]

# Zenoh transport refinements (require rmw-zenoh-cffi)
# Phase 128.E.1 — `link-tcp` / `link-udp-unicast` retired.

# XRCE transport refinements (require rmw-xrce-cffi)
# Phase 248 C5c — inert markers (nros's vestigial aliases removed); forward to
# nros-c's equivalents so downstream cmake passing the names still resolves.
xrce-udp = ["nros-c/xrce-udp"]
xrce-serial = ["nros-c/xrce-serial"]

# phase-361 W8.c / issue 0594 — `global-allocator` is GONE from this crate. It
# was a dead declaration: zero `cfg` sites, forwarding nowhere, while the
# comment claimed it installed an allocator. The single-runtime rule below
# already says nros-c owns the lang item and nros-cpp's `platform-*` must not
# enable a second copy — so the feature could only ever mislead. Consumers that
# want the allocator select a `platform-*` feature, which reaches
# `nros-c/global-allocator` → `nros-platform/global-allocator`, the one owner.

# Functional capability — register the `critical_section::Impl` backed by
# the platform vtable (`nros_platform_critical_section_{acquire,release}`).
# Phase 248: replaces the `platform-zephyr` cfg on the critical-section
# block. Mirrors nros-platform's `critical-section`.
critical-section = ["dep:critical-section"]

# Platform backends (select one — orthogonal to RMW and ROS version).
# Phase 241.D3-rev (W12) × phase-248 — single-runtime: nros-c (bundled) owns the
# `#[global_allocator]` / `#[panic_handler]` / `critical_section::set_impl!`. nros-cpp's
# `platform-*` therefore forward to `nros-c/platform-*` (which enable nros-c's
# `global-allocator` / `critical-section`) and must NOT enable nros-cpp's OWN copies —
# two of any would conflict in the one crate graph.
# phase-361 W8.d / issue 0594 — a `platform-*` feature selects the PROVIDER of
# malloc + panic for this platform (that is the "unified per platform" half of
# the contract) and NOTHING else. It no longer lists `alloc`: whether the image
# may allocate is the end user's call, spelled `alloc` at their own dep-site.
# The CMake path already worked this way — `nros_feature_set()` emits
# `std`/`alloc` + `panic-halt` explicitly per platform — so this only brings the
# Rust manifests into line with that table.
# Phase 248 C5c — platform flows through `nros-c/platform-X` (which routes to a
# direct `nros-platform` dep); the agnostic `nros` umbrella no longer carries
# `platform-*`, so the old `nros/platform-X` forward is dropped.
platform-posix = [
    "nros-c/platform-posix",
]
platform-zephyr = [
    "nros-c/platform-zephyr",
]
platform-freertos = [
    "nros-c/platform-freertos",
]
platform-nuttx = [
    "nros-c/platform-nuttx",
]
platform-threadx = [
    "nros-c/platform-threadx",
]

# ROS edition (orthogonal to RMW and platform)
ros-humble = [
    "nros/ros-humble",
    "nros-c/ros-humble",
]
ros-iron = [
    "nros/ros-iron",
    "nros-c/ros-iron",
]
ros-jazzy = [
    "nros/ros-jazzy",
    "nros-c/ros-jazzy",
]

# Bare-metal panic handler (enables building staticlib without std)
# Phase 241.D3-rev (W12) — forward to nros-c too. nros-c is now a dependency of the
# C++ umbrella and its `[lib] crate-type` includes `staticlib`/`cdylib`, so rustc
# emits those final artifacts for the dep too; on a no_std target each needs a
# `#[panic_handler]`. Both crates `use panic_halt as _` over the SAME panic-halt crate
# (one instance), so this provides exactly one handler — no duplicate.
panic-halt = ["dep:panic-halt", "nros-c/panic-halt"]


# phase-366 M4 — the entry-selected provider, forwarded like every other.
panic-platform = ["nros-c/panic-platform"]

# Opt-in instrumentation of the RTOS Rust global allocator (FreeRTOS
# pvPortMalloc / ThreadX z_malloc / Zephyr k_malloc). Tracks used/peak
# bytes routed through the Rust `#[global_allocator]` and exposes them via
# `nros_heap_used_bytes()` / `nros_heap_peak_bytes()`. NOTE: counts only the
# Rust allocator's footprint — zenoh-pico's direct C-side z_malloc/pvPortMalloc
# traffic is not included (see issue #6).
# phase-361 W8.c — FORWARDS to nros-c rather than defining a second copy. Both
# crates exported the same four `#[no_mangle]` names off their own `HeapStats`
# static, so enabling this on both was a duplicate-symbol link error waiting to
# happen. Same single-runtime rule as the allocator and the panic handler.
alloc-stats = ["nros-c/alloc-stats"]

# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "C++ ABI surface, built per-platform by cmake not by the workspace lane"

[dependencies]
# phase-361 W3 — `ffi-size-markers` REQUESTED, not inherited from `nros`'s
# (now empty) `default`; see the same note on nros-c.
nros = { version = "0.5.0", path = "../nros", default-features = false, features = ["ffi-size-markers", "macros"] }
nros-node.workspace = true
# Phase 241.D3-rev — bundle the C umbrella as an rlib so `libnros_cpp.a` carries the
# full C ABI + the cffi shim + the force-linked RMW backend (one archive, one std).
# Replaces the separate `libnros_c.a` + backend-staticlib links and nros-cpp's own
# optional backend deps.
nros-c = { version = "0.5.0", path = "../nros-c", default-features = false }
# Issue 0436 — the C/C++ multi-RMW bridge ABI behind the `bridge` feature. `cffi`
# is what emits the `nros_init_multi` / `nros_pubsub_bridge_*` exports that
# `<nros/bridge.h>` declares and `<nros/bridge.hpp>` wraps.
nros-bridge = { version = "0.5.0", path = "../../rmw/bridge", default-features = false, features = ["cffi", "alloc"], optional = true }
# Phase 88.12 — `nros_cpp_node_get_logger` returns `&'static nros_log::Logger`.
nros-log = { workspace = true }
nros-platform = { workspace = true, default-features = false }
nros-rmw = { version = "0.5.0", path = "../../core/nros-rmw", default-features = false }
# Backend deps for nros-cpp's own root-crate force-link (`src/rmw_backend.rs`);
# shared with nros-c's copy by cargo (one backend rlib).
# phase-308 — the recording RMW backend. Optional and pulled in ONLY by
# `metadata-mode`, so a firmware build never links it. Without this dep the
# backend is an orphan crate: the probe links `libnros_cpp.a`, the backend's
# `.init_array` self-registration is never in the image, and `NROS_RMW=metadata`
# resolves to an unknown backend.
nros-rmw-metadata = { path = "../../rmw/metadata", optional = true }
nros-rmw-zenoh = { workspace = true, optional = true, default-features = false }
nros-rmw-xrce-cffi = { workspace = true, optional = true, default-features = false }
# phase-361 W8.c — `zpico-alloc` is gone with the duplicate `HeapStats` static;
# `alloc-stats` forwards to `nros-c`, which forwards to `nros-platform`.
panic-halt = { version = "1", optional = true }
# critical-section impl provided by the Zephyr alloc module on
# platform-zephyr. DDS + portable-atomic depend on it being set.
#
# `restore-state-u32` is only safe to enable on real Cortex-M Zephyr
# targets where `nros_zephyr_irq_lock` returns a u32 IRQ key. On
# native_sim (x86_64) Zephyr DDS the DDS[std] path enables
# `critical-section/std`, which selects `restore-state-bool` — having
# both u32 and bool active produces `error[E0428]: RawRestoreStateInner
# defined multiple times` inside critical-section. Gate by target arch:
# arm → u32 (the no_std Zephyr Cortex-M path), other → no
# restore-state set (the std fallback wins).
critical-section = { version = "1.1", optional = true }

[target.'cfg(target_arch = "arm")'.dependencies]
critical-section = { version = "1.1", optional = true, features = ["restore-state-u32"] }

# AArch64 Zephyr (Phase 117.10/14) — DAIF mask used by
# `nros_zephyr_irq_{lock,unlock}` is a 32-bit value, same width as the
# armv7 path above. Mirrors `nros-c/Cargo.toml`.
[target.'cfg(target_arch = "aarch64")'.dependencies]
critical-section = { version = "1.1", optional = true, features = ["restore-state-u32"] }

[build-dependencies]
nros-build-helpers = { workspace = true }
# phase-340 W5.b/c — the `nros` BUILD-dependency is gone (2026-08-07).
#
# Phase 77.25's reason was real at the time: the probe's filesystem path polled
# the OUTER target dir, so a missing rlib on a clean build silently returned 0
# for every `NROS_*_SIZE` macro (Phase 77.23/77.24's damage). Issue 0464 deleted
# that path — the probe now builds `nros` in an isolated nested target dir, and
# a failure there PANICS rather than returning 0 — so the ordering this edge
# bought is no longer waited on, and the silent-zero failure mode it guarded
# against cannot happen.
#
# The cost it was paying: nros -> nros-node -> nros-core -> heapless,
# portable-atomic, log ... pulled into the BUILD-dependency graph and recompiled
# at opt-level=0/panic=unwind. `nros` stays a REGULAR dependency, which is what
# the nested probe's `cargo build -p nros` resolves through — with
# `ffi-size-markers` requested at that dep-site (issue 0593), so the probe's
# `--features=<resolved>` carries it.

[dev-dependencies]
# issue 0619 — a lib TEST is a final artifact and links no platform port, so the
# platform ABI's `extern "C"` symbols (`nros_platform_log_write`,
# `nros_platform_clock_ns`, …) have no definition and the harness fails to link.
# The crate's LIBRARY is fine; only `cargo test` breaks, which is why it stayed
# invisible until something ran the workspace test-compile.
#
# `posix-c-port` compiles `nros-platform-posix/src/{platform,net,timer}.c` — the
# same host port every real consumer links, and the pattern `nros-tests` and the
# test bins already use. DEV-only, so no consumer's link set changes. NOT
# `c-stub-test`: that is mutually exclusive with `posix-c-port`, and feature
# unification turns both on in a workspace build.
nros-platform-cffi = { workspace = true, features = ["posix-c-port"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
