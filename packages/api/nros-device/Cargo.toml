[package]
name = "nros-device"
version.workspace = true
publish = false
edition = "2024"
description = "nros device ports: accelerators, cameras and other job devices as executor event sources"
license = "MIT OR Apache-2.0"
repository.workspace = true
keywords = ["ros", "ros2", "embedded", "no_std", "accelerator"]
categories = ["embedded", "no-std", "robotics"]
authors.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
# The executor and its device hook (`Executor::register_device`, `Completion`,
# `CompletionCell`). An executor exists only over the RMW seam, so the seam is
# not optional here; it is the cffi registry, never a backend.
nros-node = { workspace = true, default-features = false, features = ["rmw-cffi"] }
# The port ABI's committed bindings (`<nros/device_port.h>`), re-exported as
# `nros_device::sys`. Never hand-mirrored.
nros-rmw-cffi = { workspace = true, default-features = false }
# The census hook a Rust registration calls, so the census and the metadata
# probe count a device's callback slot.
nros = { path = "../nros", default-features = false }
portable-atomic = { version = "1", default-features = false }

[dev-dependencies]
nros-node = { workspace = true, default-features = false, features = ["rmw-cffi", "alloc"] }
# A test binary links no platform port of its own: `posix-c-port` is the host
# port every real consumer links.
nros-platform-cffi = { workspace = true, features = ["posix-c-port"] }

[lints]
workspace = true
