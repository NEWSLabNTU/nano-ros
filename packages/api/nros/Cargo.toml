[package]
name = "nros"
version.workspace = true
publish = false
edition = "2024"
description = "Unified ROS 2 client library for embedded systems"
license = "MIT OR Apache-2.0"
repository.workspace = true
keywords = ["ros", "ros2", "embedded", "no_std"]
categories = ["embedded", "no-std", "robotics"]
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

[build-dependencies]
# issue 0460 — the shared Kconfig-via-$DOTCONFIG knob fallback, so a Zephyr Rust
# image reads the knobs Kconfig set rather than this crate's defaults.
nros-zephyr-build = { path = "../../tooling/nros-zephyr-build" }

[features]
# phase-361 W3 / issue 0591 — EMPTY; `std` is opt-in per dep-site.
#
# `ffi-size-markers` used to ride in here, and that was the ONLY thing enabling
# it: both consumers (`nros-c`, `nros-cpp`) dep this crate `default-features =
# false`, so `cargo tree -p nros-c` resolved `nros` to `alloc,std` — no markers.
# They arrived only in a WHOLE-WORKSPACE build, by feature unification from some
# other member. The C/C++ path is built per-crate by cmake/corrosion, not
# whole-workspace. Both consumers now request the feature explicitly on their
# `nros` dep, which is what the size probe needed all along (cf. issue 0464).
default = []
# phase-361 W7 — `nros::main!` / `nros::node!` / `nros::derive::RosMessage`.
#
# NOT in `default`, and that is forced rather than chosen: 62 of the 62
# in-workspace dep-sites on this crate pass `default-features = false`, so a
# default-only feature is reachable ONLY by feature unification in a
# whole-workspace build and vanishes in the per-package builds cmake runs.
# That is issue 0593 exactly, and `check-feature-contract` clause (d) rejects
# it. A crate that invokes a macro names this feature at its own dep-site.
macros = ["dep:nros-macros"]
# Phase 11.3.C — `#[used]` markers on the `__NROS_SIZE_*` opaque-storage
# statics. nros-c / nros-cpp build scripts probe these out of the rlib
# to derive C/C++ FFI macros (Phase 87). Pure-Rust applications (e.g.
# autoware-sentinel's SPE firmware) don't need them — the markers are
# `#[used]` so `--gc-sections` cannot drop the underlying [u8; N]
# arrays from the final binary, which costs ~340 KB on Cortex-R5
# because `size_of::<Executor>()` ≈ 348 KB. Disable this feature with
# `default-features = false` + opt back into `std` to recover the
# 340 KB at link time.
ffi-size-markers = []
# phase-308 — the process-global recorder non-Rust adapters feed (see
# `src/metadata_mode.rs`). Host probe only: it never ships in firmware, and a
# build that enables it also replaces the RMW with a backend that transports
# nothing. REQUIRES `std` (the probe writes a file and exits) — it does not
# imply it: the feature list is `[]` and the `compile_error!` beside
# `metadata_mode` names `std` for the consumer to add. ARCHITECTURE.md §2
# clause (a); `= ["std"]` would also make that guard unreachable.
metadata-mode = ["nros-rmw/sync-spin"]
# phase-359 W10 / issue 0687 — a CAPABILITY, not the `std` flavour, and it
# lives HERE now: `src/env.rs` is the one place in the tree that reads the
# process environment. It forwards to nothing, because there is nothing below
# to forward to — the core takes VALUES (`ExecutorConfig::resolve_with` +
# `EnvRung`), which is what let `nros-node` drop the capability entirely.
#
# A hosted build that wants `from_env` says `env`; a target build says nothing
# and never compiles it. Clause (a): it REQUIRES `std` (`compile_error!` below)
# rather than granting it.
env = []

std = [
    "alloc",
    "nros-core/std",
    "nros-node/std",
    "nros-rmw/std",
    "nros-params/std",
    "nros-serdes/std",
]
alloc = [
    "dep:portable-atomic-util",
    "nros-core/alloc",
    "nros-node/alloc",
    "nros-rmw/alloc",
    "nros-params/alloc",
    "nros-serdes/alloc",
]

# RMW vtable runtime registry. Every backend ships as a cffi shim
# that installs a C vtable here.
rmw-cffi = ["dep:nros-rmw-cffi", "nros-node/rmw-cffi"]
# Phase 128.C.3 — `rmw-{zenoh,xrce,dds,cyclonedds}-cffi` features
# deleted. Selection lives entirely in the manifest: depend on
# `nros-rmw-<name>` directly and the `RMW_INIT_ENTRIES` walker
# discovers it on first `Executor::open`. The C++ side picks via
# `target_link_libraries(... NanoRos::Rmw::<name>)`. `rmw-cffi` is
# the only Rust feature that still gates the vtable runtime.

# Phase 248 C5c — the concrete-backend selector features
# (`rmw-{zenoh,xrce,cyclonedds}`) + their optional `nros-rmw-*` deps are
# REMOVED. `nros` is fully RMW-agnostic: it consumes only the `rmw-cffi`
# vtable (above). The concrete backend is brought into the link graph by the
# BOARD crate (embedded — self-links + registers via its boot path, C5a) or by
# the board-less APP/staticlib root (native posix app owns `nros-rmw-*` +
# force-link; `nros-c`/`nros-cpp` bundle one backend, D3). Selection lowers to
# the board feature (RFC-0031, codegen C5b), not an `nros` feature.

# Phase 248-C2 follow-up (issue #67) — CycloneDDS descriptor-hook MARKER.
# Cyclone resolves topic-type descriptors via a RUNTIME registry, so the typed
# creators must build `M`'s descriptor before `dds_create_topic`. nros-node
# compiles that hook in ONLY under `cfg(rmw_cyclonedds_present)`, emitted from the
# private `nros-node/__cyclonedds-link` marker. A native RUST app that links the
# Cyclone backend (`dep:nros-rmw-cyclonedds-sys`, app-owned) MUST also enable this
# or `create_publisher::<M>` hits `PublisherCreationFailed` (the descriptor is
# never registered). This forwards ONLY the cfg marker — it pulls NO concrete-RMW
# dependency, so it does NOT reintroduce the phase-248-C5c concrete-backend
# coupling (the backend dep stays app-owned). C/C++ use the static
# `descriptors.cpp` table and never need this.
rmw-cyclonedds = ["nros-node/needs-type-descriptors"]

# Phase 99: backend native slot lending. See nros-node's rmw-lending
# feature for backend support matrix.
rmw-lending = ["nros-node/rmw-lending"]

# Phase 8 (autoware-safety-island `docs/design/callback_tracing.rst`) —
# callback-level dispatch tracing. Pure forward to `nros-node`, which owns the
# hooks and the runtime-installed `extern "C" fn(u32, u32)` sink; see the
# rationale on `nros-node/trace-callbacks`. Off by default — the hooks sit on
# the executor's hot path and must vanish in production.
trace-callbacks = ["nros-node/trace-callbacks"]

# Phase 128.G — bridge surface. `bridge` re-exports `nros_bridge`'s
# Rust API (PubSubBridge etc.); `config` additionally pulls the TOML
# loader (`run_from_config`).
bridge = ["dep:nros-bridge"]
config = ["bridge", "nros-bridge/config"]

# Phase 124.A — zero-copy publisher/subscriber loan ABI exposed
# through the cffi vtable. Forwards `lending` to the cffi crate so
# `CffiPublisher: SlotLending` / `CffiSubscriber: SlotBorrowing`
# come into scope.
lending = ["rmw-cffi", "nros-rmw-cffi/lending"]

# Phase 248 C5c — the platform-impl selector features (`platform-posix`,
# `-bare-metal`, `-freertos`, `-nuttx`, `-threadx`, `-cffi`),
# `platform-udp`, the `xrce-udp`/`xrce-serial` legacy aliases, and the
# zenoh-specific `link-tls`/`link-custom` forwards are REMOVED. `nros` is
# platform-agnostic: nros-node selects the kernel primitive at runtime (C2
# wake-probe), and the `nros_platform_*` symbols come from whoever links the
# binary — the board crate (embedded), `nros-platform-cffi[posix-c-port]`
# (board-less native), or the CMake C-port (zephyr). Platform lowers to a
# dependency (`nros-platform[platform-X]` on the board/staticlib root), not an
# `nros` feature (RFC-0031 platform amendment, C5-plat). zenoh link tuning
# (`link-tls`/`link-custom`) is set on the consumer's own `nros-rmw-zenoh` dep.
#
# Phase 248 C7 (Method A) — `platform-zephyr` DELETED: it was the last
# `platform-*` feature, kept only to gate the `zephyr_component_main!` entry
# macro. That macro is now gated on `rmw-cffi` (framework entry codegen, like
# `nros::main!`); the Zephyr platform impl + the `wait_network` helper come from
# `nros-platform[platform-zephyr]` (a dep the Zephyr consumer enables), not an
# `nros` feature. `nros` now carries ZERO `platform-*` features.

# E2E safety protocol (CRC-32 + sequence tracking).
safety-e2e = [
    "nros-node/safety-e2e",
    "nros-rmw/safety-e2e",
    "nros-rmw-cffi?/safety-e2e",
]

# Zero-copy receive via z_bytes_get_contiguous_view (unstable zenoh-pico API).
# phase-347 W1 — `unstable-zenoh-api` DELETED here. It forwarded to
# `nros-node`'s empty feature and reached nothing; the live chain is
# `nros-rmw-zenoh` -> `zpico-sys` -> `Z_FEATURE_UNSTABLE_API`, which a consumer
# reaches through its own optional backend dep. `nros` is agnostic (RFC-0071)
# and must not name a backend, so it cannot legitimately forward this at all.

# Async feedback stream (futures_core::Stream impl on FeedbackStream).
stream = ["nros-node/stream"]

# FFI reentrancy guards (critical-section around all RMW FFI calls).
ffi-sync = ["nros-node/ffi-sync"]

# Parameter services for ROS 2 interop (ros2 param list/get/set).
param-services = ["nros-node/param-services"]

# Lifecycle services for ROS 2 interop (ros2 lifecycle set|get|list|nodes — REP-2002).
lifecycle-services = ["nros-node/lifecycle-services"]

# ROS edition feature flags.
ros-humble = ["nros-node/ros-humble"]
ros-iron = ["nros-node/ros-iron"]
ros-jazzy = ["nros-node/ros-jazzy"]

[dependencies]
# Core functionality (default-features = false for no_std support).
nros-core = { version = "0.5.0", path = "../../core/nros-core", default-features = false }
# phase-361 W7 / issue 0592 — OPTIONAL. A firmware build of `nros` compiles 58
# crates and 39 of them exist only to run this proc-macro: `syn`, `toml_edit`,
# `serde_yaml_ng`, the `ros-launch-manifest` git deps and their duplicate
# `thiserror` major. A consumer that hand-writes its entry point — already a
# supported shape — should not pay for a macro it never invokes.
nros-macros = { version = "0.5.0", path = "../../core/nros-macros", optional = true }
nros-node = { version = "0.5.0", path = "../../core/nros-node", default-features = false }
# issue 0589 — the diagnostic sink. `std::eprintln!` is FATAL on Zephyr
# `native_sim` (recursive `zvfs_write`, SIGSEGV from stack exhaustion), and this
# crate carries no `platform-*` feature to gate on (ARCHITECTURE §2), so the sink
# has to be the one that already knows where it is. Adds an EDGE, not a crate:
# `nros-node` above deps `nros-log` non-optionally, so it is already in the graph.
nros-log = { version = "0.5.0", path = "../../core/nros-log" }
nros-rmw = { version = "0.5.0", path = "../../core/nros-rmw", default-features = false }
nros-rmw-cffi = { version = "0.5.0", path = "../../rmw/cffi", default-features = false, optional = true }
# Phase 248 C5c — the optional concrete-backend deps (`nros-rmw-zenoh`,
# `nros-rmw-xrce-cffi`, `nros-rmw-cyclonedds-sys`) are REMOVED. `nros` consumes
# only the generic `nros-rmw-cffi` vtable; the concrete backend enters the link
# graph via the board crate (embedded) or the board-less app / `nros-c`/`nros-cpp`
# staticlib root that owns it directly.
# Phase 128.G — bridge surface (manifest-driven multi-RMW). Optional;
# only pulled in when the umbrella's `bridge` or `config` feature is
# enabled.
nros-bridge = { version = "0.5.0", path = "../../rmw/bridge", default-features = false, optional = true }
# Phase 104.A — concrete RMW deps (`nros-rmw-xrce-cffi`,
# `nros-rmw-zenoh`) removed. The umbrella consumes
# only the generic vtable shim (`nros-rmw-cffi`); callers depend on
# the concrete backend crate directly and trigger registration via
# the backend's `#[ctor]` (POSIX) or an explicit `register()` call
# (bare-metal). See
# `docs/roadmap/phase-104-multi-backend-bridges.md` Thread A.
nros-params = { version = "0.5.0", path = "../../core/nros-params", default-features = false }
nros-platform = { version = "0.5.0", path = "../../platform/nros-platform", default-features = false }
nros-serdes = { version = "0.5.0", path = "../../core/nros-serdes", default-features = false }
# Phase 212.M.7 — Arc that works on targets lacking ptr atomics
# (riscv32imc / esp32c3 under ESP-IDF). `alloc::sync::Arc` is gated
# behind `target_has_atomic = "ptr"`; `portable_atomic_util::Arc`
# uses the portable-atomic polyfill (consumer brings a
# `critical-section` impl on no-atomic targets).
# decl_err_from_node's no_std diagnostic (std builds use eprintln!).
log = { version = "0.4", default-features = false }
portable-atomic = { version = "1", default-features = false }
# W5-endgame (issue 0843) — OPTIONAL and carried by the `alloc` feature:
# only `node_runtime`'s alloc-gated dynamic half (`CellHandle::Pooled`)
# names `Arc`, and the dep's own "alloc" feature links the `alloc` crate,
# which demands a global allocator in every downstream image.
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"], optional = true }
paste = "1"

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
