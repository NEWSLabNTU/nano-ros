# Phase 195.C — board profile descriptor for Zephyr (zephyr-lang-rust staticlib).
# Crate-less: the generated package depends on the `zephyr` crate (emitted by the
# CLI's per-platform extra-deps path); kernel / RMW / nros C runtime link at the
# CMake layer via `rust_cargo_application()`.

[[board]]
# phase-351 / issue 0606 — the ZEPHYR board string a deploy names — `[deploy.*].board` carries the
# downstream ecosystem's id, and for Zephyr that is `<board>/<soc>/<variant>`.
names = ["zephyr", "native_sim/native/64"]
platform = "zephyr"
toolchain = "stable"
entry_kind = "zephyr-staticlib"
# phase-351 W4 — this board makes NO netstack choice: Zephyr's own IP stack is not a nano-ros choice. An empty
# list is a statement, not an omission: a deploy naming one is refused.
supported_netstacks = []

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT). Zephyr heap +
# mutex are Kconfig-gated (CONFIG_HEAP_MEM_POOL_SIZE / CONFIG_MULTITHREADING);
# declared true, lowered to prj.conf (not -D) by C.2.
[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0079 §4.1 — a DERIVED priority address plan.
#
# The other three ports state literals read off the port: FreeRTOS 4, NuttX
# 100, ThreadX 14. Zephyr cannot, and that is a property of the port rather
# than of anyone's diligence (issue 0766).
#
# Tiers here are RAW `k_thread` priorities passed straight to
# `k_thread_create`. The transport is NOT: its read/lease tasks are created
# through Zephyr's POSIX layer, so the priority travels a chain — a normalised
# band, then SCHED_RR, then k_thread — before it lands anywhere a tier can be
# compared against.
#
# THE CHAIN IS WRITTEN ONCE, IN RFC-0079 §4.1, AND IS NOT RESTATED HERE.
# It used to be, and the copy went stale: this file carried "Kconfig, default
# 16", a private 0-31 band and `zpico_posix_set_priority`'s
# `lo + (span*n*2 + 31)/62` for a month after phase-364 W5 / issue 0852 moved
# the band to the platform ABI's 0..255 with a default of 200 and the map to
# `nros_zephyr_native_priority`. The RFC's own copy was corrected by phase-459
# W4 and this one was not, which is the failure the section immediately below
# describes, committed by the file describing it (issue 1427). The two live
# spellings of the arithmetic are `scripts/lib/priority_plan.py:
# resolve_zephyr_plan` and `nros-orchestration-ir`'s `priority_plan::
# zephyr_plan`, and they check each other; prose cannot join that pair.
#
# BOTH ends of the chain are per-IMAGE Kconfig — the band itself, and
# NUM_PREEMPT_PRIORITIES, which is per-board. So a literal `reserved.transport`
# would be true for exactly one image and quietly wrong for the next: the very
# failure this plan exists to prevent, one level up. The numbers therefore live
# nowhere static; this declares WHAT they depend on and WHO resolves them, and
# `check-tier-priority-plan` reports Zephyr pins as DEFERRED rather than
# pretending to judge them.
[board.priority_plan]
tier_key = "zephyr"
direction = "smaller-is-urgent"
derived = "zephyr"
resolver = "scripts/lib/priority_plan.py:resolve_zephyr_plan"
inputs = [
    "CONFIG_NUM_PREEMPT_PRIORITIES",
    "CONFIG_NUM_COOP_PRIORITIES",
    "CONFIG_NROS_ZENOH_READ_PRIORITY",
    "CONFIG_NROS_ZENOH_LEASE_PRIORITY",
    "CONFIG_POSIX_PRIORITY_SCHEDULING",
    "CONFIG_PREEMPT_ENABLED",
]
