# Phase 195.C — board profile descriptor. Bare-metal ThreadX on QEMU RISC-V virt.
# Shares the `threadx` name with threadx-linux; `target_contains` picks this one
# when the requested target is riscv64.

[[board]]
# phase-341 W3 — 12 leaves deploy to `threadx-qemu-riscv64`, which no
# descriptor named. Note `threadx` alone stays AMBIGUOUS (the threadx-linux
# descriptor also claims it); this alias is the unambiguous spelling.
# phase-445 W3b — `rv-virt-threadx` is this board's RFC-0093 name (phase-437
# W4: the cmake board, the index key and the example directory all use it), and
# the C/C++ leaves' `system.toml` names it. Without it here no descriptor
# answered, so `nros ws leaf-system` could not derive the `threadx` platform.
names = ["threadx", "threadx-riscv64", "threadx-qemu-riscv64", "rv-virt-threadx"]
disambiguate_by_target = "riscv64"
platform = "threadx-riscv64"
toolchain = "stable"
local_aliases = ["platform-threadx-riscv64"]
entry_kind = "board-run"
# phase-351 W4 — the stacks this board can be built with: the board boots NetX Duo over virtio-net.
supported_netstacks = ["netxduo"]
board_crate = "nros-board-threadx-qemu-riscv64"
cargo_config = '''
[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tlink.lds",
    "-C", "link-arg=--nmagic",
    # phase-341 W1 — hoisted from the leaves; 6 of 7 carried it.
    "-C", "link-arg=--gc-sections",
]

[env]
NETX_CONFIG_DIR = { value = "${workspace}/packages/boards/nros-board-threadx-qemu-riscv64/config", force = true }
THREADX_CONFIG_DIR = { value = "${workspace}/packages/boards/nros-board-threadx-qemu-riscv64/config", force = true }
THREADX_PORT = { value = "risc-v64/gnu", force = true }
THREADX_EXTRA_INCLUDES = { value = "${workspace}/third-party/threadx/kernel/ports/risc-v64/gnu/example_build/qemu_virt", force = true }
'''

[board.entry]

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT). Bare-metal
# ThreadX but HAS a heap (CFFI alloc/dealloc) — this is the #38 board; heap=true
# is what C.2 lowers to -D NROS_PLATFORM_HAS_MALLOC, replacing the hand-set
# THREADX_GLUE_DEFINES entry.
[board.capabilities]
heap = true
atomics = true
threads = true

# issue 1557 — the executor-backing rung, STATED (it was the one ThreadX board
# left at the `#ifndef … 0` default, so its image reserved the backing twice:
# once as `.bss` `EXECUTOR_BACKING`, once inside the 4 MiB byte pool).
#
# MEASURED on this board, 2026-09-29: `riscv-none-elf-nm -S` on the zenoh
# `rv-virt-threadx/rust/listener` image (cmake leaf, riscv64gc-unknown-none-elf)
# reads `nros_node::executor::backing::EXECUTOR_BACKING` = 0x159e8 = 88,552 B =
# 11,069 words — the unnarrowed `ExecutorSizing::DEFAULT` on a 64-bit target,
# exactly the number threadx-linux states (issue 1388's rule: the statement must
# cover the LARGEST default any unit on the board compiles, and the synthesised
# umbrella takes the unnarrowed one). Same pointer width, same defaults, same
# words. With it stated, `byte_pool_storage` = 4 MiB - 88,552 and
# `EXECUTOR_BACKING + byte_pool_storage == BYTE_POOL_BASE_SIZE` (checked with
# `nm -S` on the rebuilt image).
#
# 11,071 since phase-476 W0 (2026-10-05): one 4-byte lifetime tag per callback
# slot joined the backing, 4 slots x 4 B = 16 B = 2 words. `node-std-tests`
# refused 11,069 on this target; its own `cargo check` accepts 11,071 and
# refuses 11,070. Not re-measured with `nm` on a rebuilt image.
[board.knobs.executor]
backing_u64s = 11071

# RFC-0048 §6 / phase-287 W5 — CMake toolchain file for `nros setup`'s preset.
[board.cmake]
toolchain_file = "cmake/toolchain/riscv64-threadx.cmake"
