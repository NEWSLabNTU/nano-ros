[package]
name = "nros-board-threadx-qemu-riscv64"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ThreadX QEMU RISC-V 64-bit virt board crate for nros (NetX Duo + virtio-net)"

[lib]
name = "nros_board_threadx_qemu_riscv64"

[dependencies]
# Phase 121.3 — canonical symbols from ThreadX C port; see sibling
# nros-board-threadx-linux for full rationale.
nros-platform = { path = "../../platform/nros-platform", default-features = false, features = ["platform-threadx", "global-allocator"] }
# Phase 88 — Rust binding for `nros_platform_register_log_writer`.
nros-platform-cffi = { path = "../../platform/nros-platform-cffi", default-features = false }
# Issue #205 step 4 — the board owns the global `critical_section::Impl`
# (ThreadX `tx_interrupt_control` port); consumer apps no longer carry their
# own dep + staticlib-DCE anchor.
nros-platform-critical-section = { path = "../../platform/nros-platform-critical-section" }
# Phase 152.2.B — `BoardInit` / `BoardPrint` / `BoardExit` trait
# impls so this overlay fits the canonical overlay shape (same
# pattern as `nros-board-mps2-an385-freertos`
# 152.1.B.5). Generic-crate `run<B>` lift deferred to a follow-up
# session.
# phase-337 W4 — `deploy-overlay` brings `BaseConfig::apply_overlay`, the
# `DeployOverlay` -> `Config` merge this board used to write out by hand.
nros-board-common = { path = "../nros-board-common", default-features = false, features = ["deploy-overlay"] }
# Phase 152.2.B.4 — generic `run<B>` lifted into the parent
# crate.
nros-board-threadx = { path = "../nros-board-threadx", default-features = false }

[build-dependencies]
cc = "1"
# Phase 152.2.B — shared ThreadX kernel + port source helpers.
nros-board-common = { path = "../nros-board-common", features = ["build-helpers"] }
# phase-337 W4.a — the layer-2 arch port (RFC-0064): upstream's
# `ports/risc-v64/gnu` forked to type `ULONG` as 4 bytes, which NetX Duo's
# `ULONG *` packet arithmetic requires and which shifts every `TX_THREAD`
# offset the context-switch assembly loads. Build-side only: the crate ships
# `.S` + a header and the paths to reach them.
nros-board-threadx-port-riscv64 = { path = "../nros-board-threadx-port-riscv64" }

[features]
default = []
# #131 — forward the family board's zenoh-backend link + boot-path register().
# The example forwards its own `rmw-zenoh` here; a cyclonedds build leaves it off.
rmw-zenoh = ["nros-board-threadx/rmw-zenoh"]
