# Phase 212.N.3 — empty `[workspace]` marker. The outer workspace's
# `exclude = [...]` already lists this package so it builds
# standalone (cf. `nros-board-zephyr`); the empty marker makes
# `cargo check --offline` from this dir resolve to this package as
# its own workspace root, which matters when the workspace `Cargo.toml`
# isn't an ancestor (e.g. cargo invoked from a git worktree nested
# under `.claude/worktrees/`).
[workspace]

[package]
name = "nros-board-nuttx-qemu"
version = "0.4.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
description = "NuttX QEMU board crate for nros — arm virt (Cortex-A7) and rv-virt (rv32imac), both virtio-net"

[lib]
name = "nros_board_nuttx_qemu"

[dependencies]
# issue 0710 — the `nsh_main` boot funnel publishes the nros_log sink list.
nros-log = { path = "../../core/nros-log", default-features = false }
# issue 0710 — the platform-ABI log sink moved to `nros_platform_cffi::log`,
# so the boot funnel that installs it names the crate that owns the ABI. A
# board IS the platform edge, so this edge is where it belongs; what it
# replaces is `nros-log` declaring the extern itself and every binary that
# logged inheriting the link requirement.
nros-platform-cffi = { path = "../../platform/nros-platform-cffi" }
# No platform crate needed — NuttX is POSIX-compatible, zenoh-pico reuses unix/ platform.
# No smoltcp/lwIP needed — NuttX has built-in BSD sockets.
# No custom Ethernet driver — NuttX has virtio-net built into the kernel.
# Phase 152.4.B — implements `nros_board_common::BoardInit` so the
# `nros_board_nuttx` generic crate can drive boot via the
# `run_generic<B: BoardInit>` shim.
nros-board-common = { path = "../nros-board-common" }
# Phase 212.N.3 — implements the new platform-level board trait
# family (`nros_platform::{BoardInit, BoardPrint, BoardExit,
# BoardEntry}`) so the per-board ZST can plug directly into
# `nros_board_nuttx::run_entry::<Self, _, _>` from a codegen-emitted
# Entry pkg `main.rs`.
# `global-allocator` UNCONDITIONALLY, as every sibling bare-metal board does
# (mps2-an385, mps2-an385-freertos, mps3-an536-freertos, s32z270-freertos,
# threadx-qemu-riscv64). NuttX was the one board that did not, and reached the
# tree's single `#[global_allocator]` only through `nros-board-nuttx/image-runtime`
# — a route that runs through the generated selection facade. When the facade is
# absent the Entry is emitted without it SILENTLY, and the allocator vanishes with
# it: `no global memory allocator found`, a link error a long way from its cause.
# Naming it here makes the board self-sufficient. Issue 0937.
nros-platform = { path = "../../platform/nros-platform", default-features = false, features = ["global-allocator"] }
# Phase 212.N.3 — `BoardEntry::run` delegates to the NuttX family
# driver's `run_entry`. We do NOT enable `reference-qemu` here:
# that feature flag pulls `nros-board-nuttx-qemu` as an optional
# dep of `nros-board-nuttx`, which IS this crate — cargo flags it as
# a cyclic package dependency. The `run_entry` symbol is also gated
# `target_os = "nuttx"`, which is the gate we rely on (matched by the
# `BoardEntry` impl below).
# phase-359 W7 — `default-features = false` + an explicit forward, so an image
# that supplies its own panic handler / global allocator (a C/C++ image, via
# `nros-c`) can switch the base crate's off through THIS crate. Without the
# `default-features = false` the chain would re-enable it behind the bin's back.
nros-board-nuttx = { path = "../nros-board-nuttx", default-features = false }

[features]
default = ["image-runtime"]
# Forward to the generic NuttX board's explicit zenoh-backend registration
# (its `run_entry` calls `nros_rmw_zenoh::register()` under this feature).
rmw-zenoh = ["nros-board-nuttx/rmw-zenoh"]
# phase-359 W7 — see `nros-board-nuttx`'s `image-runtime`. Default ON here too,
# so a pure-Rust image needs no flag; the FFI bins take this crate with
# `default-features = false`.
image-runtime = ["nros-board-nuttx/image-runtime"]
# Phase 252 (issue 0072) — forward a declared [safety] axis through the nuttx family
# crate to the zenoh backend's safety-e2e (CRC attach/validate). The descriptor
# (both `[[board]]` entries of `nros-board.toml`) advertises this via capability_features.
safety-e2e = ["nros-board-nuttx/safety-e2e"]

[build-dependencies]
# 194.3c.2 — the NuttX platform-port compile moved to the shared
# nros-board-common build helper (pulls cc + repo-path resolution via its
# build-helpers feature); the board no longer drives cc-rs directly.
nros-board-common = { path = "../nros-board-common", features = ["build-helpers"] }
