[workspace]

[package]
name = "nros-nuttx-riscv-ffi"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "NuttX rv-virt kernel + nros C/C++ FFI bundle for CMake-built examples"

[dependencies]
# Path deps go up 3 levels to the repo root.
# phase-359 W7 — this bin supplies the image's runtime through `nros-c`
# (`global-allocator` gives it the `#[global_allocator]`, and its own
# `#[panic_handler]` activates once `std` is gone), so the board crate's copies
# of both are switched off with `default-features = false`. Exactly one of each
# may exist per image.
nros-board-nuttx-qemu = { path = "..", default-features = false }
# `panic-spin`: this bin owns the image's panic handler through `nros-c` (the
# board crate's is off via `default-features = false` above). phase-361 W8.b
# moved that handler from the `global-allocator` gate onto its own feature —
# "asking for a panic handler no longer means asking for a heap" — so the choice
# has to be stated here rather than arriving as a side effect of the allocator.
nros-c = { path = "../../../api/nros-c", default-features = false, features = [
    "alloc", "global-allocator", "panic-spin", "cffi-zenoh-cffi", "platform-nuttx", "ros-humble"
] }
nros-cpp = { path = "../../../api/nros-cpp", default-features = false, features = [
    "alloc", "rmw-zenoh-cffi", "platform-nuttx", "ros-humble"
] }
# Link the cffi shim directly so register() is callable from main.rs before
# app_main() jumps into C/C++ code.
nros-rmw-zenoh = { path = "../../../rmw/zenoh/nros-rmw-zenoh", features = ["platform-nuttx", "ros-humble"] }

[build-dependencies]
# NuttX FFI build helper (run_nuttx) + repo path resolution.
nros-board-common = { path = "../../nros-board-common", features = ["build-helpers"] }

# #134 follow-up: the cmake glue (packages/api/nros-c/cmake/nros-nuttx.cmake)
# copies `<triple>/release/nros-nuttx-ffi` — the ARM crate's bin name. Pin the
# same artifact name here so both NuttX families share one copy path.
[[bin]]
name = "nros-nuttx-ffi"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
# #134 follow-up: unlike `armv7a-nuttx-eabihf`, the tier-3
# `riscv32imac-unknown-nuttx-elf` target spec does NOT bake
# `panic-strategy: abort`, so without this the build-std `std` is built
# with unwinding and nros-c fails "unwinding panics are not supported
# without std".
panic = "abort"
