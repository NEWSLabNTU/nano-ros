[workspace]

[package]
name = "nros-nuttx-ffi"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "NuttX kernel + nros C/C++ FFI bundle for CMake-built examples"

[dependencies]
# Phase 144.6 — relocated under packages/boards/nros-board-nuttx-qemu/.
# Path deps go up 3 levels to the repo root (was 4 under
# examples/qemu-arm-nuttx/cmake/).
# phase-359 W7 — this bin supplies the image's runtime through `nros-c`
# (`global-allocator` gives it the `#[global_allocator]`, and its own
# `#[panic_handler]` activates once `std` is gone), so the board crate's copies
# of both are switched off with `default-features = false`. Exactly one of each
# may exist per image.
nros-board-nuttx-qemu = { path = "..", default-features = false }
# `panic-platform`: this bin IS the final artifact, so it owns the image's panic
# handler through `nros-c` (the board crate's is off via `default-features =
# false` above). phase-361 W8.b first moved that handler off the
# `global-allocator` gate onto its own feature — "asking for a panic handler no
# longer means asking for a heap" — and phase-366 R1 replaced that feature's
# spin loop with the port's own ending: the image now panics through
# `nros_platform_panic`, which on NuttX is the platform's, not a bare `loop {}`.
nros-c = { path = "../../../api/nros-c", default-features = false, features = [
    "alloc", "global-allocator", "panic-platform", "cffi-zenoh-cffi", "platform-nuttx", "ros-humble"
] }
nros-cpp = { path = "../../../api/nros-cpp", default-features = false, features = [
    "alloc", "rmw-zenoh-cffi", "platform-nuttx", "ros-humble"
] }
# Phase 115.L.x — link cffi shim directly so `register()` is callable
# from main.rs before app_main() jumps into C/C++ code.
nros-rmw-zenoh = { path = "../../../rmw/zenoh/nros-rmw-zenoh", features = ["platform-nuttx", "ros-humble"] }

[build-dependencies]
# Phase 221.A.3 — NuttX FFI build helper; pulls repo path
# resolution through nros-board-common's build-helper feature.
nros-board-common = { path = "../../nros-board-common", features = ["build-helpers"] }

[profile.release]
opt-level = "s"
lto = true
