# The base Kconfig of board `nucleo-f767zi-zephyr` (phase-524 W3).
#
# The settings phase-524 W1 spike 2 booted in Renode 1.17.0 with the C
# talker over a serial zenoh link (docs/roadmap/data/phase-524-w1-renode-nucleo.log,
# `serial.conf`). A leaf whose image says `board = "nucleo-f767zi-zephyr"`
# gets this file from the nano-ros module hook (`NROS_LEAF_CONF`), AHEAD of
# the image's own `os_config` fragments, so an image fragment still overrides
# it (issue 1782's order).
#
# SERIAL FIRST (RFC-0115 D4, RFC-0116 D5): the board's chapter one is zenoh
# over USART3, the ST-LINK virtual COM port, so this file is that image's
# shape. An ethernet image (chapter two, phase-524 W4) names an `os_config`
# fragment that turns the IP stack back on (NETWORKING, NET_L2_ETHERNET,
# static IPv4), and writes its `locator` as `tcp/...`.

# --- The zenoh link over a UART ----------------------------------------------
# The shape of cmake/zephyr/mps2-an385-serial.conf: no IP stack, a ring buffer
# for zenoh-pico's serial framing.
CONFIG_NROS_TRANSPORT_SERIAL=y
CONFIG_NETWORKING=n
CONFIG_RING_BUFFER=y
CONFIG_SERIAL=y
# Issue 0852 — interrupt-driven RX; polled RX drops bytes at 115200.
CONFIG_UART_INTERRUPT_DRIVEN=y
# Issue 2164 — main below zenoh-pico's read task, so the RX drain is not
# starved by the publishing thread.
CONFIG_MAIN_THREAD_PRIORITY=5

# --- What zenoh-pico needs from the kernel -------------------------------------
# The non-network half of a zenoh leaf's `prj-zenoh.conf`. A serial image on
# this board names NO `os_config`: that fragment merges after this file and
# would put the 64 KiB kernel heap back (and its NET_* lines mean nothing with
# NETWORKING=n). So the POSIX pieces zenoh-pico's Zephyr port uses live here.
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Randomness ----------------------------------------------------------------
# With NETWORKING=n nothing enables the STM32 RNG driver, so zenoh's session id
# needs a generator: the spike used the test one, as mps2-an385-serial.conf
# does. A constant seed: two images built from this file derive the same
# session id, so a PAIR needs a different TIMER_RANDOM_INITIAL_STATE (archived
# issue 0157's class). TODO for the bench (phase-524 W5): try
# CONFIG_ENTROPY_GENERATOR on the board's `rng` node instead.
CONFIG_TEST_RANDOM_GENERATOR=y

# --- Sizing --------------------------------------------------------------------
# sram0 is 384 KiB. Zephyr's kernel heap is not what nano-ros allocates from
# (CONFIG_NROS_ZEPHYR_HEAP_SIZE is), so 16 KiB keeps Zephyr's own users fed;
# the leaf's 64 KiB left the image 138,944 bytes over at the crate defaults.
# The pool knob the image still has to state is in nros-board.toml's header.
CONFIG_HEAP_MEM_POOL_SIZE=16384
