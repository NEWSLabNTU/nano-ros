# Board descriptor for `mps2-an385-zephyr`.
#
# A board is a PACKAGE (RFC-0064 R5 D1): this file says what the board
# lowers to, and the `package.xml` beside it announces that the board
# exists. Both are required — a descriptor with no announcement is
# refused, because it would resolve here and be invisible to every
# consumer that reaches providers through `provider_scan`.

[[board]]
names = ["mps2-an385-zephyr"]
platform = "zephyr"
toolchain = "stable"
# `hosted-main` when the host OS owns `main`, `zephyr-staticlib` on
# Zephyr, `board-run` when the board crate's `run()` is the entry.
# NOT derivable from `platform`: freertos carries both hosted and bare
# boards.
entry_kind = "zephyr-staticlib"
# An EMPTY list is a statement, not an omission: a deploy naming a
# netstack this board does not support is refused (phase-351 W4).
supported_netstacks = []

# Issue 2177 — the crate-root boilerplate a GENERATED Rust entry needs on
# Zephyr, the same two lines and two deps as `packages/boards/zephyr`'s
# descriptor gives native_sim (whose comment says why each is there). Without
# them a generated image for this board failed with `cannot find `log` in the
# crate root` and `#[panic_handler] function required`.
[board.entry]
crate_root_extra = "extern crate zephyr;"
crate_root_deps = ["zephyr = \"0.1.0\"", "log = \"0.4\""]

[board.zephyr]
west_board = "mps2/an385"
# Issue 2151 — what a RUST image for this board needs beyond a C one.
# zephyr-lang-rust picks the triple from the Zephyr board at build time, and
# runs bindgen over Zephyr's headers (clang for its builtin headers,
# libclang-dev for the library bindgen loads).
rust_target = "thumbv7m-none-eabi"
rust_prereqs = ["clang", "libclang-dev"]
# zephyr-lang-rust lints every Rust app as part of `ALL` (`cargo clippy`).
rust_components = ["clippy"]
# Derived, so absent on purpose: prj.conf and
# `boards/<west_board with / and @ as _>.{conf,overlay}`,
# present-if-exists. The emulator `west build -t run` drives is Zephyr's own
# board definition's; `[board.run]` names it for nano-ros (RFC-0118 D4).

# phase-528 W2 (RFC-0118 D4) — the emulator this board runs under. The support
# registry reads `emulator` from here; Zephyr's own board definition drives the
# launch (`west build -t run`), and `NROS_BOARD_RUNNER` is derived from it.
[board.run]
emulator = "qemu:mps2-an385"

# Issue 2379 -- the QEMU facts, stated once. `nros run` does NOT read them on
# the west road: a west build of a `qemu` board goes to the `west` runner,
# which boots Zephyr's own line (`boards/arm/mps2/board.cmake`). The test
# harness reads them (`nros_tests::qemu::MPS2_AN385_ZEPHYR`), and so does
# `nros run` for an image that names the `qemu` runner itself. Zephyr's file
# is upstream and is not edited, so they are held to it by comparison: every
# Zephyr QEMU cell checks `system`, `cpu`, the machine and `nic_model` against
# the `run_qemu` command its own west build generated before it boots
# (`nros_tests::zephyr::west_qemu_boot`). `icount` is nano-ros's, not
# Zephyr's (book-internals/src/testing/qemu-icount.md). No `semihosting`: a
# Zephyr image prints on its UART, and Zephyr's line has none.
[board.run.qemu]
system = "arm"
cpu = "cortex-m3"
icount = "shift=auto"
nic_model = "lan9118"

[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0109 D2 — the RTOS's own configuration owns the network devices.
[board.net]
stack = "os"
# RFC-0109 D3 — the link kinds this board carries.
links = ["tcp", "udp"]

# Issue 2177 — what `nros setup board mps2-an385-zephyr --zephyr-workspace <ws>`
# does to a reader's own west workspace: apply the 3.7 patch set. A workspace
# made with plain `west init` / `west update` runs an UNPATCHED
# zephyr-lang-rust, whose cargo command carries none of nano-ros's env (the
# board facts, the derived knobs and the C cross compiler, `NROS_BOARD_FACTS_ENV`
# in `zephyr/CMakeLists.txt`) — so a Rust image's `zpico-sys` fell back to a
# PATH `arm-none-eabi-gcc` and failed. The triple is `[board.zephyr]
# rust_target`'s.
[board.provisioning]
zephyr_line = "3.7"
rust_targets = ["thumbv7m-none-eabi"]
