[package]
name = "mps2-an385-pac"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Minimal PAC for ARM CMSDK Cortex-M3 (MPS2-AN385 FPGA image) — interrupt bindings only"

[lib]
name = "mps2_an385_pac"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["device"] }

[build-dependencies]
# phase-471 W4 — the linker-script emit, shared. Zero-dependency and
# host-only, so this edge adds one compile unit and nothing behind it.
nros-build-paths = { path = "../../tooling/nros-build-paths" }
