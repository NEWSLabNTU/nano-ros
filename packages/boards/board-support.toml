# ---------------------------------------------------------------------------
# `maintainers` is deliberately empty everywhere and NOT yet enforced.
#
# Rust's target-tier policy requires a named person per target and demotes
# targets whose maintainer goes unreachable — that mechanism, not the directory
# layout, is what actually collects abandoned targets. Recording an owner is the
# point; inventing one would be worse than leaving it blank, so the field exists,
# the gate reports how many boards are unowned, and enforcement (non-empty for
# tier 2 and below, plus the demotion clause) turns on once owners are assigned.
# ---------------------------------------------------------------------------
