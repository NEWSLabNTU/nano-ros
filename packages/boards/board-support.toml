# ===== scaffold — explicitly not supported =================================
#
# EMPTY since phase-337 W7.b. The four boards that lived here
# (`embassy-stm32f4`, `esp32s3`, `s32z270dc2-r52`, `orin-spe`) contributed zero
# cells of any tier, so deleting them cost no coverage. The STATE stays declared
# above: it is what stops the next unfinished board from reading as support.

# phase-375 W6 — DECLARED at last. Both boards were already built and tested by
# this tree while appearing in no registry, no descriptor and no announcement:
# `examples/fixtures.toml` named them as raw Zephyr id STRINGS, which is a
# fourth way to add a board and the one with no record at all.
#
# `tier = "scaffold"` is the honest entry, and deliberately NOT a promotion.
# (Both have since moved to the descriptor-only directories below, issue 2177.) These rows are new; a tier with a promise needs a named maintainer (W1: 1/2/3
# for tiers 3/2/1) and neither has one. What changed today is that they are
# VISIBLE — a board nobody declared cannot be given a tier, an owner, or a
# demotion, which is what made the fourth route worse than any of the other
# three.
# phase-522 W1 (RFC-0114 migration table) — the S32K344 safety island. A board
# nano-ros has measured booting on silicon, declared nowhere until now: the
# Autoware safety island (simple-autoware-safety-island) runs a Zephyr image on
# an NXP MR-CANHUBK344, and phase-474's "The board halves, 2026-10-26" quotes
# nine board acts, every one PASS, on nano-ros 8b95e90dd6 and 5feeb32a7b.
#
# The board package lives in the island's repository, not under
# packages/boards/, so the row says so with `external` and the directory
# completeness check skips it. It has no PlatformId: the evidence is the
# island's, dated, and a `manual` cadence is exactly that.
#
# `breadth` inherits the Zephyr Cortex-M witness rather than FreertosMps2 as
# the RFC's draft table had it: the island image is Zephyr (phase-474 names no
# other kernel), so its family is Zephyr's.
[[board]]
crate = "s32k344-safety-island"
external = "simple-autoware-safety-island"
tier = 3
execution_class = "hardware"
real_hardware = true
book_flash = "getting-started/integration-zephyr.md#flash-a-real-board"
runs = "hardware"
hardware = "mr-canhubk344"
cadence = "manual"
last_run = "2026-10-26"
breadth = "inherits ZephyrQemuCortexM"
maintainers = []
notes = "NXP S32K344 (Cortex-M7) on the MR-CANHUBK344, Zephyr, behind a 921,600-baud UART zenoh link to an island gateway router. Evidence: phase-474 \"The board halves, 2026-10-26\" (nine acts, all PASS, violation records read over SWD). The board package is the downstream island's."

