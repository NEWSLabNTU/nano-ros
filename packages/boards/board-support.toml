book_run = "getting-started/integration-nuttx.md#run-on-qemu-arm-virt"
runs = "emulator"
emulator = "qemu:virt-armv7a"
cadence = "daily"
breadth = "witness"
maintainers = []

[[board]]
crate = "nros-board-threadx-linux"
matrix_platform = "ThreadxLinux"
nightly_token = "threadx_linux"
link_check_example = "examples/threadx-linux/rust/talker"
tier = 1
