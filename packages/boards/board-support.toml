# ===== infra — not boards ==================================================

[[board]]
crate = "nros-board-common"
tier = "infra"
maintainers = []
notes = "Build-helper library plus one trait; 2180 of 2252 code lines are behind `build-helpers`."

[[board]]
crate = "nros-board-cffi"
tier = "infra"
maintainers = []
notes = "Header ABI mirror with ZERO in-tree C consumers; kept alive by its own drift gate. Spec artifact, not a library."

[[board]]
crate = "nros-board-bare-metal"
tier = "infra"
maintainers = []
notes = "Family driver NO board opted into — mps2-an385, stm32f4 and esp32-qemu each hand-roll BoardEntry::run instead. 135 of its 161 lines are doc comment. phase-322 W1.h decides delete-vs-adopt."

[[board]]
crate = "nros-board-freertos"
tier = "infra"
maintainers = []
notes = "Real family driver: the MPS2 overlay is `pub use nros_board_freertos::Config` and carries zero config code. The pattern the forked boards should copy."

[[board]]
crate = "nros-board-nuttx"
tier = "infra"
maintainers = []
notes = "NuttX FAMILY DRIVER, not a façade: owns run_entry / run_tiers / the tier spin loops, which the one board overlay (nros-board-nuttx-qemu) delegates to. phase-337 W3 merged the two board crates below it; this layer stays."

[[board]]
crate = "nros-board-threadx"
tier = "infra"
maintainers = []
notes = "Real family driver: a 1120-line generic entry.py both ThreadX boards call into."

[[board]]
crate = "nros-board-threadx-port-riscv64"
tier = "infra"
maintainers = []
notes = "NOT a board: RFC-0064 layer 2, the ThreadX RISC-V64/GNU ARCH PORT. Upstream types ULONG as 8 bytes there; NetX Duo's packet code does `ULONG *` arithmetic assuming 4, and retyping it shifts every TX_THREAD offset the context-switch assembly loads — so the fork is a header plus five `.S` files, and it is arch, not board. Extracted from nros-board-threadx-qemu-riscv64 by phase-337 W4.a; a second riscv64 ThreadX board would need every line of it unchanged. threadx-linux has none because upstream's Linux port already types ULONG as 4 bytes — which is why the two ThreadX boards did NOT merge."

[[board]]
crate = "mps2-an385-pac"
tier = "infra"
maintainers = []
notes = "IRQ enum only. Kept because RTIC's `#[rtic::app(device = ...)]` needs a nameable path."

