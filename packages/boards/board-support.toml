# Board support registry — phase-320 W2.
#
# ONE table listing every board package, its support tier, and its maintainers.
# This is the SSoT the book's supported-boards table is generated from and the
# `check-board-tiers` gate validates against evidence.
#
# Why a single registry instead of a `tier` field in each `nros-board.toml`:
# only 12 of the 27 board directories have a descriptor at all, so a per-crate
# field could not cover the set — and the completeness check (every board is
# listed exactly once) is the whole point. This mirrors Rust's platform-support
# table rather than its per-target spec files.
#
# Why not tier DIRECTORIES: tier is metadata, not layout. Rust keeps target
# specs flat and the tier in target metadata precisely so a promotion is a
# one-line edit rather than a path change rippling through ~200 references.
#
# ---------------------------------------------------------------------------
# TIERS — each is a promise, and each is mechanically checkable.
#
#   1  Supported   `just ci` exercises it, it has asserted runtime coverage,
#                  and a nightly lane builds it. A regression fails before
#                  merge.
#   2  Verified    Asserted runtime coverage + a nightly lane, but not in
#                  `just ci`. Breakage is found within a day.
#   3  Build-only  Compiles; NO CI lane can boot it (hardware or a
#                  license-gated model is required). Nobody has booted it
#                  recently unless a maintainer did so by hand.
#   scaffold       Structurally incomplete. Explicitly NOT supported. Distinct
#                  from tier 3: tier 3 is finished-but-unverified, scaffold is
#                  unfinished. `embassy-stm32f4` is why this state exists — it
#                  is actively committed to, which reads as support unless the
#                  registry says otherwise.
#   infra          Not a board: shared traits, family drivers, ABI mirrors,
#                  PACs. Carries no platform and no tier promise.
#
# Gate predicates (scripts/check-board-tiers.py):
#   - tier 1|2  => the platform has >=1 `Runtime` cell in matrix.rs
#   - tier 3    => the platform has ZERO Runtime cells (build-only means it)
#   - scaffold  => zero Runtime cells AND zero fixture rows
#   - tier 1    => a nightly lane covers it (or it is the native host, which
#                  `just ci` runs directly — stronger than a nightly build)
#   - every board directory appears exactly once; every entry names a real one
#
# `maintainers` is recorded but NOT yet enforced — see the note at the bottom.
# ---------------------------------------------------------------------------

# ===== tier 1 — supported ==================================================

[[board]]
crate = "nros-board-native"
matrix_platform = "Native"
tier = 1
maintainers = []
notes = "The reference platform: the densest Runtime coverage of any target, all three RMWs."

