# Board support registry — RFC-0114 (phase-522), first written by phase-320 W2.
#
# ONE table listing every board package, the evidence nano-ros holds for it,
# and its maintainers. It is the only place a board fact is typed:
# `scripts/gen-board-support.py` writes the test-matrix cells, the probe
# tracks, issue 2169's ROWS, the book's support pages and the status file the
# CLI reads from it, and `just check board-registry` holds every view to it.
#
# Why a single registry instead of a field in each `nros-board.toml`: a
# descriptor states what a BUILD needs (RFC-0049, RFC-0064), and a build must
# not read a test registry; and the completeness check (every board directory
# is listed exactly once) needs one table. This mirrors Rust's platform-support
# table rather than its per-target spec files.
#
# ---------------------------------------------------------------------------
# EVIDENCE PRIMITIVES — RFC-0114 D10/D11. A row states what nano-ros can SHOW,
# never a rank:
#
#   runs       none | host | emulator | hardware — where the board's image
#              executes in evidence nano-ros holds.
#   emulator   qemu:<machine> | renode:<platform> | wokwi:<board> | fvp:<model>;
#              required when runs = "emulator", allowed elsewhere to record a
#              twin that is not the evidence.
#   hardware   a board id; required when runs = "hardware", allowed elsewhere
#              to record the silicon an emulator (or a build) stands in for.
#   cadence    merge | daily | weekly | manual — how often the run happens.
#              Absent exactly when runs = "none".
#   last_run   ISO date; required when cadence = "manual", refused otherwise.
#   infra      true — shared traits, family drivers, ABI mirrors, PACs and
#              descriptor directories. No other evidence field on such a row.
#   breadth    "witness" | "inherits <PlatformId>" — whose matrix the row's
#              breadth is (D11). Required on every row that runs.
#   external   the repository that holds a board package living outside this
#              tree; exempts the row from the packages/boards/ directory check.
#   board_keys the descriptor board keys (`nros-board.toml` `names`) this row's
#              evidence is for, where the package directory alone cannot say:
#              a package carrying several rows (`nros-board-zephyr`, the
#              NuttX QEMU pair) or a row whose descriptor lives in another
#              directory (`linux`). `nros doctor --report` maps an image's
#              board through it; the gate requires every key to name a
#              descriptor and no key to answer for two rows.
#
# The STATUS WORD is derived, never typed (scripts/lib/board_registry.py):
#
#   Verified on host / in emulator / on hardware (cadence)   runs + automated cadence
#   Boots, manual (date)                                      runs + cadence manual
#   Builds                                                    runs none + a build
#   Not supported                                             runs none, nothing builds
#   Infrastructure                                            infra = true
#
# A manual row whose `last_run` is older than `manual_stale_days` reads
# "Builds (last booted <date>)" in every live view (`nros board`,
# `check-board-tiers.py --print-status`) and in the rendered book (the mdBook
# preprocessor `scripts/mdbook-board-status.py` applies the date at build
# time); the committed pages, which must not change on a day nobody edited
# anything, print the date that starts instead.
#
# Predicates (scripts/check-board-tiers.py, run by `just check board-registry`):
#   - an automated run (merge/daily/weekly) => >=1 `Runtime` cell for the platform
#   - runs = "none"                         => ZERO Runtime cells for the platform
#   - cadence merge  => a host executable, and in `ci_lane`'s tier-1 pool
#   - cadence daily  => a `nightly_token` the nightly sweep runs
#   - cadence weekly => `probe` tracks of the weekly probe workflow
#   - cadence manual => `last_run`
#   - every board directory appears; every row names a real one or is `external`
#   - a Verified row needs >=2 named maintainers, a Boots or Builds row >=1
#     (RFC-0114 D10), rows that predate the rule grandfathered by
#     scripts/board-maintainer-baseline.json — a list that only shrinks
#
# Where the BOOK says how to run it (phase-517 W9, scripts/check-book-board-run-sections.py):
#   - book_run      "<chapter>.md#<anchor>" under book/src/: the chapter's
#                   "Run …" section (QEMU, a simulator, or the host) — required
#                   on every row that runs, unless real_hardware = true
#   - real_hardware true when the board is physical silicon that is FLASHED;
#                   required when runs = "hardware"
#   - book_flash    "<chapter>.md#<anchor>": the "Flash …" section — required
#                   when real_hardware = true (a build-only board says so there)
#   The anchor is the id mdbook gives the heading; the section must hold a
#   fenced command block.
# ---------------------------------------------------------------------------
manual_stale_days = 120

# phase-522 W2 — the registry's cell table: every `matrix::CELLS` cell, in its
# own file because it is long. Part of the registry, read by the same generator.
cell_table = "board-support-cells.toml"

# ===== boards =================================================================

