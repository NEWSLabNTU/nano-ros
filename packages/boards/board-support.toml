# ---------------------------------------------------------------------------
# `maintainers` is ENFORCED (phase-375 W1, re-keyed by RFC-0114 D10): a
# Verified row needs 2, a Boots or Builds row needs 1; Not supported and
# Infrastructure rows owe nobody.
#
# Rust's target-tier policy requires a named person per target and demotes
# targets whose maintainer goes unreachable — that mechanism, not the directory
# layout, is what actually collects abandoned targets.
#
# It is still empty everywhere, and that is the point of the shape the rule took.
# Inventing an owner would be worse than leaving the field blank, so enforcement
# landed as a RATCHET rather than a cliff: the rows that predate it are
# grandfathered in scripts/board-maintainer-baseline.json, which only shrinks. A
# NEW board is bound immediately, an existing one when someone claims it, and a
# stronger level is bound too — an exemption granted at Builds does not cover
# Verified, because a stronger claim is a new one.
#
# To claim a board: add your handle to its `maintainers`, then run
# `python3 scripts/check-board-tiers.py --write-baseline` to drop the row from
# the grandfather list.
# ---------------------------------------------------------------------------

# ===== probe tracks (phase-522 W2) ==========================================
#
# Every track of the installed-toolchain book probe (`just probe <track>`,
# phase-517 W10): the chapter it replays and the `variant=` of the chapter's
# blocks it selects. `scripts/gen-board-support.py` writes them to
# `scripts/probe/probe-tracks.json`, which `run-bootstrap-probe.sh` resolves a
# track from and `probe-platforms.yml` takes its weekly matrix from: the two
# lists that used to be typed separately.
#
#   track       the `just probe <track>` / PROBE_PLATFORM name
#   chapter     the book page under book/src/
#   variant     the chapter blocks' `variant=` the track replays ("" = none)
#   weekly      true when `probe-platforms.yml` replays it every Monday
#   row         the board row (crate@platform) whose evidence this is, if any
#   qemu_board  the board the image is built for, when the run step boots QEMU;
#               these are the ROWS of issue 2169's printed-run-command test

[[probe]]
track = "linux"
chapter = "getting-started/first-project.md"
variant = ""
weekly = false
row = "nros-board-linux@Linux"
notes = "The installed track's default chapter; replayed by `probe.yml`, not the weekly platform lane."

[[probe]]
track = "baremetal"
chapter = "getting-started/bare-metal.md"
variant = ""
weekly = true
row = "nros-board-mps2-an385@QemuBaremetal"
qemu_board = "mps2-an385-baremetal"

