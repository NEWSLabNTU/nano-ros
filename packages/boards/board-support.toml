# descriptor + Kconfig, no Rust; it was `cmake/zephyr/mps2-an385.conf` until
# issue 1782), which is RFC-0064's whole thesis working as intended.
#
# phase-522 W1 (RFC-0114 migration table) — the row's package is that
# descriptor directory, not `nros-board-zephyr`. Booking the witness on the
# family crate is what made the generated tiers page list
# `nros-board-mps2-an385-zephyr` as a scaffold (and, after issue 2177, as
# infrastructure) while it was the very board the witness boots; the
# directory's own `infra` row is gone because this row now names it.
[[board]]
crate = "nros-board-mps2-an385-zephyr"
matrix_platform = "ZephyrQemuCortexM"
nightly_token = "zephyr"
book_run = "getting-started/integration-zephyr.md#run-on-qemu-mps2-an385"
