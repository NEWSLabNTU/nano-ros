# The Arm MPS2+ AN521's base Kconfig, merged into every image on either core
# after the application's own prj.conf.
#
# The cores talk over Zephyr's RPMsg service on the MHU (the IPM driver) and
# the shared SRAM window each image's devicetree overlay declares. Which end
# is the RPMsg master is the image's choice (`RPMSG_SERVICE_MODE_*`, cpu0 the
# master), not the board's.
CONFIG_IPM=y
CONFIG_RPMSG_SERVICE=y

# The board has no entropy device; zenoh-pico's session ids need one.
CONFIG_TEST_RANDOM_GENERATOR=y

# Issue 2359: a Rust entry registers its nodes on main's stack, and the module
# refuses less than NROS_RUST_MAIN_STACK_FLOOR for a Rust image. The board
# states the floor so every image, C included, gets the same main.
CONFIG_MAIN_STACK_SIZE=32768
