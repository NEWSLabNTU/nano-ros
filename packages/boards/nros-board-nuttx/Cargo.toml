[package]
name = "nros-board-nuttx"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Generic NuttX board scaffolding for nano-ros (Phase 152.4 — overlay foundation)"
authors = ["nano-ros contributors"]
repository = "https://github.com/NEWSLabNTU/nano-ros"
keywords = ["nano-ros", "ros2", "nuttx", "embedded"]
categories = ["embedded", "hardware-support"]

[lib]
name = "nros_board_nuttx"

# Phase 152.4.A scaffolding — thin façade. NuttX owns the kernel
# build (the user's NuttX tree compiles ThreadX-equivalent task /
# socket / clock primitives via `apps/external/nano-ros/` + the
# Phase 152.7 `Make.defs` / `Makefile` / `Kconfig` shell). The
# Cargo side ships `Config` + `run` shape only; no `build.rs`
# bundles the kernel here.
[dependencies]
# 152.4.B — `BoardInit` trait used by the `run<B: BoardInit>`
# generic entry point. `nros-board-common` is itself no_std-friendly
# (no `nros/std` activation) so it can stay unconditional.
nros-board-common = { path = "../nros-board-common" }

# Phase 214.F.1 (Path B) — every dep below activates `nros/std`,
# `nros/platform-nuttx`, or `nros-platform/std` on shared workspace
# crates. Workspace feature unification (resolver=2) leaks those
# activations into bare-metal embedded targets (e.g.
# `thumbv7em-none-eabihf`) unless we target-gate the block. NuttX
# is hosted (`target_os = "nuttx"`); host builds also need these
# deps for workspace `cargo check`. Gating on
# `cfg(not(target_os = "none"))` keeps them active on host + nuttx
# while excluding pure bare-metal.
[target.'cfg(not(target_os = "none"))'.dependencies]
# #132 — a minimal `log::Log` sink installed by `run_entry` so the chatter
# examples' `log::info!("Publishing:" / "I heard:")` reach the NuttX console.
# Without a sink the log facade is dark (C examples printf → visible; Rust →
# nothing), so the rtos_e2e delivery assertion could never observe a sample
# even though pub/sub works.
log = { version = "0.4", default-features = false }
# Phase 212.N.2 — `run_entry::<B, _, _>` consumes the 212.N.1
# `BoardInit` / `RuntimeCtx` re-exports from the `nros-platform`
# crate root (the trait family lives at
# `packages/platform/nros-platform/src/board/`). NuttX ships `std`, so
# `default-features = false` + explicit `["std"]` keeps the family
# driver from inheriting a `platform-*` selection — the Entry pkg
# pins the concrete platform.
# Phase 248 C5c-platform (#60 T3, RFC-0031 platform amendment) — the NuttX
# family driver brings the `platform-nuttx` impl DIRECTLY (pulls
# `nros-platform-cffi`; the canonical `nros_platform_*` C symbols come from the
# NuttX-built C port at `packages/platform/nros-platform-nuttx/`). Board-driven
# platform selection: the umbrella `nros` dep below stays platform-agnostic.
# phase-359 W7 — was `["std", "platform-nuttx"]`. The platform crate's ONLY
# `std` gate is "std supplies the allocator, so do not install ours", so
# dropping it here ENABLES the allocator that already exists rather than
# requiring a new one.
nros-platform = { version = "0.5.0", path = "../../platform/nros-platform", default-features = false, features = ["alloc", "platform-nuttx"] }
# Phase 212.N.7 step-3.5 — Executor + ExecutorComponentRuntime so
# `run_entry` installs a live component runtime sink on `RuntimeCtx`
# before invoking the user `setup` closure + spins forever
# afterwards. The actual RMW backend
# (`nros-rmw-zenoh`, ...) must be linked by the per-board overlay
# (`nros-board-nuttx-qemu`, ...) so `Executor::open` resolves a
# backend at boot.
# phase-359 W7 — was `["std", "rmw-cffi"]`.
nros = { path = "../../api/nros", default-features = false, features = ["alloc", "rmw-cffi"] }
nros-board-nuttx-qemu = { path = "../nros-board-nuttx-qemu", optional = true }
# Phase 225.O — explicit RMW backend registration on NuttX. The unified-RMW
# `nros_rmw_register_backend!` macro is a NO-OP on NuttX (linkme has no
# NuttX support — see nros-rmw-zenoh/src/lib.rs), and the NuttX flat image
# does not run the auto-register `.init_array` path, so `run_entry` must
# call `nros_rmw_zenoh::register()` explicitly (like the esp32 board does)
# before `Executor::open`. Optional + feature-gated so non-zenoh NuttX
# deployments don't pull the backend.
nros-rmw-zenoh = { path = "../../rmw/zenoh/nros-rmw-zenoh", default-features = false, features = [
    "platform-nuttx",
    "ros-humble",
], optional = true }

[features]
# Reference QEMU ARM virt (Cortex-A7 + virtio-net) configuration.
reference-qemu = ["dep:nros-board-nuttx-qemu"]
# Link + explicitly register the zenoh RMW backend in `run_entry`.
rmw-zenoh = ["dep:nros-rmw-zenoh"]
# Phase 252 (issue 0072) — forward a declared [safety] axis to the zenoh backend's
# safety-e2e (CRC attach/validate); `?` keeps it inert without rmw-zenoh. Re-exported
# by the per-board overlays (nros-board-nuttx-qemu-{arm,riscv}) the descriptor names.
safety-e2e = ["nros-rmw-zenoh?/safety-e2e"]
# phase-359 W7 — "this crate supplies the image's runtime": the
# `#[panic_handler]` and the `#[global_allocator]`. Each may exist exactly ONCE
# per image, and a no_std image must have both.
#
# There are two image shapes on this family and they get them from different
# places. A PURE-RUST image links only the board, so the board must supply them
# — hence default ON, so the common case needs no flag. A C/C++ image also links
# `nros-c`, which supplies both itself (its own gates: `global-allocator`, not
# `std`, not `panic-halt`); those images take `default-features = false` here,
# which is why the two FFI bins spell that out.
#
# Both live behind ONE feature on purpose. They are not two decisions — an image
# that gets its allocator from `nros-c` gets its panic handler from there too,
# and splitting them into two flags would let a build pick one of each and
# duplicate a lang item.
default = ["image-runtime"]
image-runtime = ["nros-platform/global-allocator"]
