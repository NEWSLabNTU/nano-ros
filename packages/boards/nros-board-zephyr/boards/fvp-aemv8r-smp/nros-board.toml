# Board descriptor for the Arm Fast Models AEMv8-R FVP (Cortex-A AArch64 SMP).
#
# RFC-0064 revision 5 / phase-215.K.1. This board used to keep its facts in a
# private `board.cmake` — 14 `NROS_BOARD_*` cmake variables, the only file of
# its kind in the tree, beside eleven other boards using this format. It had no
# descriptor at all: it resolved because `attach_bundle_aliases` read that
# `board.cmake` and pushed the bundle name onto the `zephyr` descriptor as an
# ALIAS, so the FVP board BORROWED the native_sim board's descriptor.
#
# Eight authored keys here replace those fourteen. What is derived, and by what
# rule, is documented on `BoardZephyr` in `board_descriptor.rs`.

[[board]]
names = ["fvp-aemv8r-smp"]
platform = "zephyr"
toolchain = "stable"
entry_kind = "zephyr-staticlib"
# The FVP's networking is Zephyr's `ethernet` L2 over the model's virtual NIC,
# owned by Zephyr rather than by us — so this board makes no netstack choice.
# An empty list is a statement (phase-351 W4): a deploy naming one is refused.
supported_netstacks = []

# Issue 2177 — the crate-root boilerplate a GENERATED Rust entry needs on
# Zephyr, the same two lines and two deps as `packages/boards/zephyr`'s
# descriptor gives native_sim (whose comment says why each is there). Without
# them a generated image for this board failed with `cannot find `log` in the
# crate root` and `#[panic_handler] function required`.
[board.entry]
crate_root_extra = "extern crate zephyr;"
crate_root_deps = ["zephyr = \"0.1.0\"", "log = \"0.4\""]

[board.zephyr]
west_board = "fvp_baser_aemv8r/fvp_aemv8r_aarch64/smp"
sdk_abi = "aarch64-zephyr-elf"
default_rmw = "cyclonedds"
default_transport = "ethernet"
# STATED because it differs from what Zephyr's own board definition selects.
# `armfvp` drives Zephyr's stock `cmake/emu/armfvp.cmake`, which spawns
# `FVP_BaseR_AEMv8R` with UART on stdout, given `ARMFVP_BIN_PATH`.
runner = "armfvp"
# Issue 2151 — what a RUST image for this board needs beyond a C one.
# zephyr-lang-rust picks the triple from the Zephyr board at build time, and
# runs bindgen over Zephyr's headers (clang for its builtin headers,
# libclang-dev for the library bindgen loads).
rust_target = "aarch64-unknown-none"
rust_prereqs = ["clang", "libclang-dev"]
# zephyr-lang-rust lints every Rust app as part of `ALL` (`cargo clippy`).
rust_components = ["clippy"]

[board.provisioning]
zephyr_line = "3.7"
# AArch64 AEMv8-R: zephyr-lang-rust's `_rust_map_target` returns this triple
# (see scripts/zephyr/aarch64-rust-patch.sh). `requires_rust` is DERIVED from
# this list being non-empty rather than restated.
rust_targets = ["aarch64-unknown-none"]
rmw_source = "cyclonedds-src"
# The Arm FVP. `[tool.arm-fvp]` in `nros-sdk-index.toml` carries the pinned CDN
# URL and digest, so `nros setup board fvp-aemv8r-smp` FETCHES it.
#
# It was `gated = ["arm-fvp"]` until 2026-09-06, on the belief that the model is
# licence-walled. Measured against Arm's own permalink: HTTP 200, 68 MB, no
# authentication — the same URL `autoware-safety-island` has downloaded in CI
# all along. The belief cost every user a manual install for a file we could
# always have fetched.
tools = ["arm-fvp"]

[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0109 D2 — the RTOS's own configuration owns the network devices.
[board.net]
stack = "os"
# RFC-0109 D3 — the link kinds this board carries.
links = ["tcp", "udp"]
