# s32z270-rtu0-zephyr (`s32z2xxdc2@D/s32z270/rtu0`) — per-board Kconfig.
#
# RNG — Zephyr 3.7 has no entropy driver for the S32Z270, so without this the
# image fails to link (`undefined reference to z_impl_sys_rand_get`, from the
# net stack and nros's random_zephyr.c). Zephyr's test PRNG is the only
# sys_rand_get backend there, as on the FVP; it is not a security RNG.
CONFIG_TEST_RANDOM_GENERATOR=y
