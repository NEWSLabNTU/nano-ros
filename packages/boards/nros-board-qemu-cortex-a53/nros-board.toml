# Board descriptor for `qemu-cortex-a53`.
#
# A board is a PACKAGE (RFC-0064 R5 D1): this file says what the board
# lowers to, and the `package.xml` beside it announces that the board
# exists. Both are required — a descriptor with no announcement is
# refused, because it would resolve here and be invisible to every
# consumer that reaches providers through `provider_scan`.

[[board]]
names = ["qemu-cortex-a53"]
platform = "zephyr"
toolchain = "stable"
# `hosted-main` when the host OS owns `main`, `zephyr-staticlib` on
# Zephyr, `board-run` when the board crate's `run()` is the entry.
# NOT derivable from `platform`: freertos carries both hosted and bare
# boards.
entry_kind = "zephyr-staticlib"
# An EMPTY list is a statement, not an omission: a deploy naming a
# netstack this board does not support is refused (phase-351 W4).
supported_netstacks = []

# Issue 2177 — the crate-root boilerplate a GENERATED Rust entry needs on
# Zephyr, the same two lines and two deps as `packages/boards/zephyr`'s
# descriptor gives native_sim (whose comment says why each is there). Without
# them a generated image for this board failed with `cannot find `log` in the
# crate root` and `#[panic_handler] function required`.
[board.entry]
crate_root_extra = "extern crate zephyr;"
crate_root_deps = ["zephyr = \"0.1.0\"", "log = \"0.4\""]

[board.zephyr]
west_board = "qemu_cortex_a53/qemu_cortex_a53/smp"
# Issue 2151 — what a RUST image for this board needs beyond a C one.
# zephyr-lang-rust picks the triple from the Zephyr board at build time, and
# runs bindgen over Zephyr's headers (clang for its builtin headers,
# libclang-dev for the library bindgen loads).
rust_target = "aarch64-unknown-none"
rust_prereqs = ["clang", "libclang-dev"]
# zephyr-lang-rust lints every Rust app as part of `ALL` (`cargo clippy`).
rust_components = ["clippy"]
# Derived, so absent on purpose: prj.conf and
# `boards/<west_board with / and @ as _>.{conf,overlay}`,
# present-if-exists. The emulator `west build -t run` drives is Zephyr's own
# board definition's; `[board.run]` names it for nano-ros (RFC-0118 D4).

# phase-528 W1 (RFC-0118 D4) — the emulator this board runs under. Zephyr's own
# board definition drives the launch (`west build -t run`); the RunPlan's
# runner is `west`, and `NROS_BOARD_RUNNER` is derived from it.
[board.run]
emulator = "qemu:virt"

# Issue 2379 -- the QEMU facts of the `smp` variant `west_board` names, stated
# once. `nros run` does NOT read them on the west road (the `west` runner
# boots Zephyr's own line, `boards/qemu/cortex_a53/board.cmake` plus the
# `-smp` Zephyr adds for `CONFIG_MP_MAX_NUM_CPUS`); the test harness reads
# them (`nros_tests::qemu::QEMU_CORTEX_A53`), and so does `nros run` for an
# image that names the `qemu` runner itself. Every Zephyr QEMU cell checks
# `system`, `machine`, `cpu`, `smp` and `nic_model` against the `run_qemu`
# command its own west build generated before it boots
# (`nros_tests::zephyr::west_qemu_boot`). The NIC's ATTACHMENT is the
# caller's: Zephyr's line puts the e1000 on a TAP (`ifname=zeth`, which needs
# `/dev/net/tun`), the harness puts it on QEMU's user network.
[board.run.qemu]
system = "aarch64"
machine = "virt,gic-version=3"
cpu = "cortex-a53"
smp = "cpus=2"
nic_model = "e1000"

[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0109 D2 — the RTOS's own configuration owns the network devices.
[board.net]
stack = "os"
# RFC-0109 D3 — the link kinds this board carries.
links = ["tcp", "udp"]
