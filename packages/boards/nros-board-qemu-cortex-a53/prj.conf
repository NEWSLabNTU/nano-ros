# Base Kconfig for this board, layered ahead of the consumer's own
# prj.conf by `nano_ros_use_board()`.
#
# Issue 2290 -- the board's network, which a scaffolded workspace image
# (`nros new <ws> --board qemu-cortex-a53`) gets from nowhere else: it names
# no `os_config` fragment, so this file and Zephyr's defaults are all it has.
# These lines used to live only in the one bringup that ran on this board
# (`examples/workspaces/realtime-c/src/smp_bringup/`); a scaffolded image had
# no NETWORKING, so every net symbol was dropped and it dialled the Kconfig
# default with no sockets.

# --- Zephyr's native IP stack on the QEMU e1000 NIC ---------------------------
# No offload driver on this board. The NIC needs nothing named: ETH_E1000
# defaults y from the devicetree, and the board's Kconfig picks
# NET_QEMU_ETHERNET under NETWORKING.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y

# --- Static IPv4 on QEMU's user-mode network ----------------------------------
# Guest 10.0.2.15, gateway (the host) 10.0.2.2, as on mps2-an385-zephyr. An
# interface with no IPv4 context took a Data Abort in `get_ifaddr` before any
# nros output (the bringup's board conf has the measurement).
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Under QEMU's user-mode network the host is 10.0.2.2: the Kconfig default
# `tcp/127.0.0.1:7447` is the guest's own loopback here.
CONFIG_NROS_ZENOH_LOCATOR="tcp/10.0.2.2:7447"

# --- Randomness ----------------------------------------------------------------
# No entropy driver on this board, and zenoh-pico seeds from `sys_rand_get`:
# without a generator the image fails to link on `z_impl_sys_rand_get`. The
# test generator is the only arm Kconfig offers without an entropy device. Its
# seed is a constant, so a PAIR of images needs a different
# TIMER_RANDOM_INITIAL_STATE on the second.
CONFIG_TEST_RANDOM_GENERATOR=y

# --- Stacks: aarch64 frames are larger than the native_sim x86 ones ------------
# The sizes the bringup's board conf measured on this board (it took
# instruction aborts through a smashed return address at Zephyr's 16 KiB main
# stack), with the guard on so an overflow is a named fault, not a jump into
# garbage.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=8192
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y
