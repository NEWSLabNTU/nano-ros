# Phase 195.C — board profile descriptor for the Linux host target.
# Crate-less: the generated package depends on `nros-platform-cffi` (emitted by
# the CLI's per-platform extra-deps path) rather than on the board crate.
#
# phase-337 W8.a / RFC-0064 R3 — the BOARD is `linux`; `native` and `posix` stay
# as accepted INPUT spellings because ~200 example and fixture manifests carry
# `deploy = "native"`. `platform = "posix"` is unchanged and deliberate: the
# platform layer names software-stack facts, the board layer names what we
# claim to support.

[[board]]
names = ["linux", "native", "posix"]
platform = "posix"
toolchain = "stable"
platform_feature = "platform-posix"
link_kind = "none"
entry_kind = "hosted-main"
# phase-351 W4 — this board makes NO netstack choice: the host kernel owns the stack. An empty
# list is a statement, not an omission: a deploy naming one is refused.
supported_netstacks = []

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT).
[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0079 — the PORT's priority address plan.
#
# STATIC, unlike Zephyr's: Linux's SCHED_FIFO range is fixed by POSIX
# (`sched_get_priority_min/max` report 1..99 here) rather than by a per-image
# Kconfig, so the band is a literal the checker can judge with nothing but the
# repo.
#
# The transport band sits at the TOP, and the tiers below it. That direction is
# the one thing this port could not express until issue 0765: tier priorities
# were advisory, so nothing was applied and there was no ordering to get wrong.
# Once they became real the default was the WRONG way round — a SCHED_FIFO tier
# outranks every SCHED_OTHER thread unconditionally, and zenoh-pico's read and
# lease tasks are SCHED_OTHER, so every tier preempted the link it publishes
# over with no arrangement in which it did not.
[board.priority_plan]
tier_key = "posix"
direction = "bigger-is-urgent"
# `sched_get_priority_{min,max}(SCHED_FIFO)` on glibc/Linux. Cross-checked
# against the value the board actually uses by `check-tier-priority-plan`.
range = [1, 99]
# zenoh-pico's read and lease tasks. A RANGE rather than a point because the
# two are configured separately and a future flush task joins them; the board
# places them at the floor, 90, leaving room above for anything an operator
# deliberately puts higher.
reserved.transport = [90, 99]
# What tiers may be allocated. The existing pins (10, 40, 80) already live here
# — this plan describes where they were, it does not move them.
pool.app = [1, 89]
