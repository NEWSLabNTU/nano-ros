# Phase 195.C — board profile descriptor for the Linux host target.
# Crate-less: the generated package depends on `nros-platform-cffi` (emitted by
# the CLI's per-platform extra-deps path) rather than on the board crate.
#
# phase-337 W8.a / RFC-0064 R3 — the BOARD is `linux`; `native` and `posix` stay
# as accepted INPUT spellings because ~200 example and fixture manifests carry
# `deploy = "native"`. `platform = "posix"` is unchanged and deliberate: the
# platform layer names software-stack facts, the board layer names what we
# claim to support.

[[board]]
names = ["linux", "native", "posix"]
platform = "posix"
toolchain = "stable"
platform_feature = "platform-posix"
link_kind = "none"
entry_kind = "hosted-main"
# phase-351 W4 — this board makes NO netstack choice: the host kernel owns the stack. An empty
# list is a statement, not an omission: a deploy naming one is refused.
supported_netstacks = []

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT).
[board.capabilities]
heap = true
atomics = true
threads = true
