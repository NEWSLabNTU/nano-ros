# Phase 195.C — board profile descriptor. ThreadX-Linux host (hosted `fn main`,
# board `run()` boots ThreadX + NetX Duo over the NSOS BSD shim). Shares the
# `threadx` name with threadx-riscv64; this unconstrained entry wins on any
# non-riscv64 target.

[[board]]
names = ["threadx", "threadx-linux"]
platform = "threadx-linux"
toolchain = "stable"
entry_kind = "hosted-main"
# phase-351 W4 — the stacks this board can be built with: the board boots NetX Duo over the NSOS BSD shim.
supported_netstacks = ["netxduo"]
board_crate = "nros-board-threadx-linux"

[board.entry]
signature = "fn main() -> !"

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT).
[board.capabilities]
heap = true
atomics = true
threads = true

# RFC-0079 — the PORT's priority address plan.
#
# `tier_key` because the pin key and the board platform differ here: bringups
# write `[tiers.<name>.threadx]` while this board's platform is
# `threadx-linux`. FreeRTOS and NuttX happened to match; stating it is cheaper
# than relying on that.
#
# The whole plan is READ FROM the port. Note especially that the transport is
# NOT on the normalised band: `zpico_set_task_config` is never called on
# ThreadX, so `_z_task_init` takes its `attr == NULL` path and every zenoh task
# gets the compile-time `Z_TASK_PRIORITY` — a RAW ThreadX priority, in the same
# units the tiers are written in. The band and its inversion
# (`_z_task_threadx_priority`) only apply to a caller that configures one, and
# today nobody does.
[board.priority_plan]
tier_key = "threadx"
# ThreadX documents priority as "0 through (TX_MAX_PRIORITIES-1), where a value
# of 0 represents the highest priority" — the OPPOSITE direction to FreeRTOS
# and NuttX, which is exactly why a plan has to state it rather than assume.
direction = "smaller-is-urgent"
range = [0, 31]
# Z_TASK_PRIORITY, zpico-sys/c/platform/threadx/platform.h:42 — the read, lease
# and tx-flush tasks all take it.
reserved.transport = [14, 14]
# Tiers allocate strictly less urgent than the transport, i.e. NUMERICALLY
# LARGER on this kernel. The direction flip is the trap issue 0623 is about:
# the same "below the transport" rule reads as `<= 3` on FreeRTOS and `>= 15`
# here.
pool.app = [15, 31]

# phase-448 W5 / issue 1145 — the executor backing, reserved ONCE.
#
# phase-392 W6 moved the executor's per-entry storage out of a `Box::leak` and
# into the named `.bss` static `EXECUTOR_BACKING`, so `mem-report` could price
# it. On this port the allocator that `Box` came out of is `byte_pool_storage`
# in `nros-board-common/c/threadx_hooks.c` — itself a fixed `.bss` array — so
# an image that turns the static on without lowering that pool holds the same
# bytes twice.
#
# This rung is the ONE statement of the size, and both halves read it:
# `nros-node/build.rs` sizes the static from it, and
# `threadx_sources::add_threadx_hooks_source` subtracts `8 *` it from the
# pool's 4 MiB base. Nothing writes the subtrahend down a second time — that
# is issue 1171's defect, and it is what a stated number buys over an `nm`
# reading.
#
# THE NUMBER, and why it is NOT the per-role measurement (issue 1388).
#
# It was 4,494 from 2026-09-12 to 2026-09-20, derived as `35,952 / 8` from the
# heaviest ROLE's backing measured with `nm -S` on this board:
#
#     talker / listener / service-server   23,336 B
#     action-client / action-server        29,008 B
#     service-client                       35,952 B   <- the heaviest role
#
# That is a true measurement of the wrong population, and every ThreadX-Linux
# image — Rust, and C/C++ through the size probe — failed to COMPILE on it.
#
# `nros sync` narrows each LEAF's executor knobs, so the derived default
# differs per role. But this rung is stated ONCE per BOARD, and not every unit
# compiled with it gets a leaf's narrowing. Measured in one build of this
# board: `nros-node` resolves defaults of 2917, 3626, 4494 AND 11069 words.
# The last is the synthesised `nros_ws_runtime` umbrella, which is compiled per
# CARGO ROOT rather than per image and so takes the unnarrowed default —
# the same `ExecutorSizing::DEFAULT` the Zephyr confs state.
#
# `nros-node`'s const assertion is `stated >= default` in EVERY unit it
# compiles, so the statement has to cover the LARGEST of those, not the
# heaviest role. Hence 11,069.
#
# The cost is real and is the price of one statement per board: a talker
# reserves 11,069 words where its own executor needs 2,917, and gives back the
# same 11,069 from the pool. The image's total is unchanged either way — this
# rung MOVES bytes between `.bss` and the pool, it does not save them — so
# over-stating costs `mem-report` accuracy, not memory.
#
# Checked now, in a lane that gates merges: `check-executor-backing-arena-pairing
# --claims` emits this rung as a claim and
# `nros-node/tests/executor_backing_claims.rs` compares it against the measured
# default. Before issue 1388 that check read Zephyr confs only, so this claim
# was the one spelling nothing vouched for.
#
# WHY THIS NUMBER CANNOT BE LOWERED, and what was measured to say so (issue
# 1390). 1388 left open whether the unnarrowed default is a real floor or just
# the first obstacle. It is a floor, for two independent reasons.
#
#   1. MECHANISM. `nros-node`'s build script was instrumented to log, per unit,
#      the knobs it resolved and the answer the RFC-0049 ladder gave, and one
#      serial `just threadx_linux build-examples` was run (2026-09-20). It
#      compiles `nros-node` 18 times. Exactly TWO of those units both carry this
#      rung AND have no image's narrowing:
#
#        * the synthesised `nros_ws_runtime` umbrella of `examples/workspaces/
#          mixed`, which `nros_board_facts_env()` hands this descriptor and
#          which is compiled per CARGO ROOT, so it serves every entry in the
#          configure and can belong to no single image's knobs;
#        * the `nros-c` / `nros-cpp` SIZE PROBE spawned beneath it, which
#          inherits `NROS_BOARD_TOML` and nothing else.
#
#      Every other rung-carrying unit is a standalone Rust example leaf, where
#      `nros sync` narrows the knobs and the derived defaults are 2917 / 3626 /
#      4494. Every other UNNARROWED unit — `nros_c-static` / `nros_cpp-static`
#      in the three cmake workspace roots, the cargo-built `workspaces/rust` and
#      `workspaces/realtime-rust` entries, and their own probes — resolves NO
#      rung at all, so it sizes the static at its own default and the assertion
#      there compares a number with itself.
#
#      Issue 1390 removed the probe from that population (it never links, never
#      opens an executor, and the reservation is not a term in anything it
#      measures, so it declines the static outright). The umbrella stays, and a
#      per-cargo-root crate has no image's narrowing BY CONSTRUCTION — so it
#      pins the floor at the unnarrowed default, which is this number.
#
#   2. VOUCHABILITY, and this one holds even if the umbrella were fixed.
#      Issue 1197 established that nothing outside `nros-node`'s own dependency
#      graph can DERIVE this size: it is `arena + repr(Rust) tables`, laid out
#      by the target compiler. So the only number a host-side lane can measure
#      is the unnarrowed `ExecutorSizing::DEFAULT`, and a board's narrowed
#      maximum could be established only by building every image for the board.
#      A claim below the default is therefore a claim nothing vouches for —
#      which is exactly the state issue 1388 was caused by. Lowering this rung
#      would buy ~52 KB of byte pool in six leaf images and pay for it by
#      trading a MEASURED claim for an asserted one.
[board.knobs.executor]
backing_u64s = 11069
