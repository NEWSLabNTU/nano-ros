[package]
name = "nros-board-threadx-linux"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ThreadX Linux simulation board crate for nros (NetX Duo + BSD sockets)"

[lib]
name = "nros_board_threadx_linux"

[dependencies]
# Phase 121.3 — canonical `nros_platform_*` symbols come from the
# ThreadX C port linked via CMake. The Rust dep here exists only to
# pull `nros-platform`'s `platform-threadx` feature into the link map
# so `ConcretePlatform = CffiPlatform` resolves.
nros-platform = { path = "../../platform/nros-platform", default-features = false, features = ["platform-threadx"] }
# Phase 88 — Rust binding for `nros_platform_register_log_writer`.
nros-platform-cffi = { path = "../../platform/nros-platform-cffi", default-features = false }
# Phase 152.2.B — `BoardInit` / `BoardPrint` / `BoardExit` trait
# impls so this overlay fits the canonical overlay shape (same
# pattern as `nros-board-mps2-an385-freertos`
# 152.1.B.5). Generic-crate `run<B>` lift deferred to a follow-up
# session; the trait surface lands now so future consumers can
# already write `<ThreadxLinux as BoardInit>::init_hardware(&cfg)`.
# phase-337 W4 — `deploy-overlay` brings `BaseConfig::apply_overlay`, the
# `DeployOverlay` -> `Config` merge this board used to write out by hand.
nros-board-common = { path = "../nros-board-common", default-features = false, features = ["deploy-overlay"] }
# Phase 152.2.B.4 — generic `run<B>` lifted into the parent
# crate. The overlay's `pub fn run` is now a thin non-generic
# wrapper that calls `nros_board_threadx::run::<ThreadxLinux,
# _, _, _>(config, f)`.
nros-board-threadx = { path = "../nros-board-threadx", default-features = false }

[build-dependencies]
# issue 1558 — the repo-root marker walk, in place of a `.parent()` hop count.
# Zero-dependency and host-only.
nros-build-paths = { path = "../../tooling/nros-build-paths" }
cc = "1"
# issue 0383 — strict C diagnostics (implicit-function-declaration,
# int-conversion) as ERRORS at every `cc::Build` below. One shared spelling.
nros-cc-flags = { path = "../../tooling/nros-cc-flags" }
# Phase 152.2.B — shared ThreadX kernel + port source helpers.
nros-board-common = { path = "../nros-board-common", features = ["build-helpers"] }

[features]
default = []
# #131 / #194 — forward the family board's zenoh-backend link + boot-path
# register() (same as the riscv64 sibling). Without this, a rust Entry image's
# `Executor::open` finds NoBackend and fails Transport(ConnectionFailed) with
# ZERO wire I/O (the observed threadx-linux rust rtos_e2e zero-delivery). The
# Entry pkg forwards its own `rmw-zenoh`; a cyclonedds build leaves it off.
rmw-zenoh = ["nros-board-threadx/rmw-zenoh"]
# issue 1759 — the image's `#[global_allocator]`: `nros_platform_alloc` over the
# ThreadX byte pool, the allocator the RISC-V sibling and real ThreadX hardware
# use. An `nros::main!` image is `#![no_std]` here (`entry_kind = "board-run"`),
# so this is its Rust heap; the C side (zenoh-pico's `z_malloc`) already drew
# from the same pool, so the boot's `nros: byte pool peak` line now counts the
# whole image. The descriptor's `board_features` names it for a generated entry;
# a hand-written leaf names it itself.
#
# NOT a default, unlike `nros-board-nuttx/image-runtime`: two test bins
# (`logging-smoke-threadx-linux`, `pool-exhaustion-threadx-linux`) are ordinary
# `std` programs that boot this board from a hosted `fn main`, and libstd
# allocates before `tx_kernel_enter` creates the pool — a byte-pool allocator
# there would answer that first allocation with NULL.
image-runtime = ["nros-platform/global-allocator"]
