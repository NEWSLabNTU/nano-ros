# Phase 195.C — board profile descriptor. Pure Cortex-M3 (MPS2-AN385).

[[board]]
# phase-341 W3 — the deploy vocabulary had two SSoTs: 18 leaves deploy to
# `qemu-mps2-an385` / `rtic-mps2-an385`, which `nros_orchestration_ir::
# board_path_for` maps but no descriptor named, so `nros sync` could not
# project their board block. Both are THIS board: the separate
# `nros-board-rtic-mps2-an385` crate was folded into it (see its Cargo.toml),
# so RTIC is a feature of this board, not another one.
names = ["baremetal", "bare-metal", "qemu-mps2-an385", "rtic-mps2-an385"]
platform = "bare-metal"
toolchain = "stable"
entry_kind = "board-run"
# phase-351 W4 — the stacks this board can be built with: `src/network.rs` drives smoltcp over the LAN9118.
supported_netstacks = ["smoltcp"]
board_crate = "nros-board-mps2-an385"
# Phase 252 (issue 0072) — forwards [safety] to its zenoh backend.
cargo_config = '''
# phase-445 W2 (RFC-0098 D4) — the board's triple, stated HERE. It was missing,
# so 19 mps2 leaves (13 on this board) hand-wrote `[build] target` in their
# own `.cargo/config.toml`, the only board family that had to.
[build]
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
runner = "qemu-system-arm -cpu cortex-m3 -machine mps2-an385 -nographic -semihosting-config enable=on,target=native -kernel"
rustflags = [
    # cortex-m-rt's `link.x`. NOT `mps2_an385.ld`: that script belongs to the
    # FreeRTOS board (`nros-board-mps2-an385-freertos`), whose C startup
    # provides the vector table and reset handler cortex-m-rt provides here.
    # phase-445 W2 measured both directions: this board linked with the other
    # board's group fails, and vice versa (see that phase's W2 note).
    "-C", "link-arg=-Tlink.x",
    # phase-341 W1 — hoisted from the leaves. 25 of 32 `thumbv7m` leaf
    # configs carried this and 7 did not, which is drift, not a choice:
    # dead-section stripping is a property of the board's link, not of any
    # one example. The `__NROS_SIZE_*` / FORCE_LINK anchors survive it
    # because they are `#[used]` (CLAUDE.md records exactly this).
    "-C", "link-arg=--gc-sections",
]

# The cc-crate cross compiler for this triple — a board toolchain fact
# (phase-445 W2; `examples/workspaces/rust/.cargo/config.toml` carried it).
[env]
CC_thumbv7m_none_eabi = "arm-none-eabi-gcc"
'''

[board.entry]
signature = "#[nros_board_mps2_an385::entry]\nfn main() -> !"
crate_root_extra = "use panic_semihosting as _;"
crate_root_deps = ["panic-semihosting = \"0.6\""]

# RFC-0042 D2 / phase-241 wave C — declared capabilities (SSoT).
#
# issue 1512 — `heap` was `false`, commented "Pure bare-metal: no heap (static
# only)", and that was never true of this board: `nros-platform-mps2-an385`
# holds a `zpico_alloc::FreeListHeap<HEAP_SIZE>` static in `.bss` (128 KB
# default, `NROS_HEAP_SIZE` override), reaches it through `impl PlatformAlloc
# for Mps2An385Platform`, and its DEFAULT features (`libc-stubs`, `libc-heap`)
# define `malloc`/`free`/`realloc`/`calloc` as C symbols. This crate's own
# `nros-platform` dep selects `global-allocator`, so the Rust
# `#[global_allocator]` routes there too. RFC-0034 D6's table names this exact
# platform with `global-alloc` ON. It was the ONLY board in the tree declaring
# `heap = false`; the other fourteen, including the other bare-metal board
# (`nros-board-esp32-qemu`) and the bare-metal-with-CFFI-heap
# `nros-board-threadx-qemu-riscv64`, all say true.
#
# Why it cost nothing until now: this row is read by
# `nros_board_capability_defines()`, whose only output is the C/C++
# `-DNROS_PLATFORM_HAS_MALLOC`, and the family has been Rust-only — Rust images
# never consult it. It was ALSO masked a second way, which is worth recording
# because fixing the mask alone would have broken the build: nothing defined
# `NROS_PLATFORM_BAREMETAL` on this platform either, so `<nros/platform.h>`
# took its hosted default arm and handed a C/C++ TU here a heap regardless of
# what this file said. Two wrong facts that cancelled. Both move together
# (`cmake/platform/nano-ros-baremetal.cmake` now declares the platform, this
# declares the heap), so the issue-0038 compile gate finally answers about this
# board rather than about the absence of a define.
#
# The alternative — keep `heap = false` and ship a permanently alloc-free C
# profile — is a coherent position and stays available where it belongs, at the
# IMAGE: `packages/testing/nros-tests/bins/heap-free-poc-mps2` already builds
# on this silicon with `nros-platform-mps2-an385`'s `default-features = false`,
# dropping the arena and the four libc symbols, and
# `check-no-alloc-image --tier heap-free` gates it. That is an image dropping a
# capability the board offers, which is not the same statement as the board not
# having one.
[board.capabilities]
heap = true
atomics = true
threads = false
