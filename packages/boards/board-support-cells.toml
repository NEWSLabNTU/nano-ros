# The board registry's cell table — RFC-0114 D12, phase-522 W2.
#
# Part of the registry (`packages/boards/board-support.toml` names it as
# `cell_table`): every cell of the declared test matrix (RFC-0051), one
# `[[cell]]` per coordinate. `scripts/gen-board-support.py` writes
# `packages/testing/nros-tests/src/matrix_cells.rs` from it, which
# `matrix::CELLS` includes, and every book page that states a board's breadth
# reads it. Edit HERE, then regenerate; the Rust list is never edited by hand.
#
#   at       [platform, lang, rmw, feature, kind] — the `PlatformId`, `Lang`,
#            `Rmw`, `Feature` and `Kind` variants, spelled as in matrix.rs
#   status   the Rust status expression: `Runtime`, `BuildOnly(..)`,
#            `CarveOut(..)` or `Gated(..)`, verbatim (a reason may name a const
#            from matrix.rs)
#   with     optional `.with(..)` argument: the cell's configurations
#   comment  optional: the comment block written above the cell, kept verbatim.
#            It is the cell's history, so it travels with the cell.
#
# Order is the list's order; the generator keeps it.

[[cell]]
comment = '''
// ── Example kind: the classic pubsub/service/action pairs ──────────
// Linux host (ephemeral isolation; all three RMWs have runtime lanes).
'''
at = ["Linux", "Rust", "Zenoh", "Pubsub", "Example"]
status = 'Runtime'

