# phase-370 W1 — board descriptor for the FreeRTOS POSIX simulator.
#
# The FreeRTOS kernel's `ThirdParty/GCC/Posix` port runs tasks as host pthreads
# with signal-driven preemption, so this is a BOARD-level variant of the
# freertos platform rather than a platform of its own (the "go, small" scoping
# decision recorded in phase-292 W4.a). Everything above the kernel is the
# existing freertos family; everything below it is the host.
#
# Two consequences follow from "below it is the host", and they are the whole
# difference from `nros-board-mps2-an385-freertos`:
#
#   * `supported_netstacks = []` — the HOST kernel owns the network stack, so
#     there is no lwIP and no netif driver. An empty list is a statement, not an
#     omission: a deploy naming a stack is refused. Same spelling, and the same
#     reason, as the `linux` board's (phase-351 W4).
#   * no cross toolchain — `toolchain = "stable"` builds for the host triple,
#     which is what makes this the freertos family's first CI-runnable e2e lane
#     without QEMU.
[[board]]
names = ["freertos-posix"]
cmake_module = "freertos-posix"
platform = "freertos"
toolchain = "stable"
# phase-548 W1 — `board-run`, like the host-process ThreadX board
# (`nros-board-threadx-linux`). It was `hosted-main`, which describes the C/C++
# road's `c/freertos_posix_entry.c` (an ordinary `main` that starts the
# scheduler) and is only read for the RUST entry's shape. A Rust image here is a
# `#![no_std]` entry whose C-ABI `main` (`[board.entry]` below) calls
# `<FreertosPosix as BoardEntry>::run`; a `std` entry would put the std tier
# next to `platform-freertos`, which issue 1778 removed.
entry_kind = "board-run"
# The Rust board crate (phase-548 W1). Without one, the image's board key fell
# through to the platform word `freertos` -- the mps2 board's alias -- and the
# generated entry depended on the lwIP/Cortex-M3 crate.
board_crate = "nros-board-freertos-posix"
# The image's Rust allocator funnels into `nros_platform_alloc` (heap_3).
board_features = ["image-runtime"]
supported_netstacks = []
# Issue 2341 — the board's port and RTOS config dir, stated here as every
# other FreeRTOS board states them (phase-484 W2b, RFC-0103 D1/D3). The board
# cmake module sets the port for the CMake half, but these `[env]` rows are
# the only carrier to the CARGO half (`nros ws board-facts` → Corrosion), and
# `zpico-sys` refuses to build without them: a zenoh image here stopped on
# "FREERTOS_PORT not set". No `[build] target`: the image is a host process.
cargo_config = '''
[env]
# Upstream FreeRTOS-Kernel's enum for `portable/ThirdParty/GCC/Posix`.
FREERTOS_PORT = { value = "GCC_POSIX", force = true }
FREERTOS_CONFIG_DIR = { value = "${workspace}/packages/boards/nros-board-freertos-posix/config", force = true }
'''

# RFC-0042 D2 — declared capabilities (SSoT). Same three as the mps2 board: the
# kernel supplies heap and threads, and the host supplies atomics natively
# rather than through `portable-atomic`.
# RFC-0103 D10e (phase-497 W1) — the host operating system owns this board's
# network: the kernel's interfaces, addresses and routes. An image states none
# (a board network file in its `os_config` is refused naming this, RFC-0109 D4).
[board.net]
stack = "host"
# RFC-0109 D3 — the link kinds this board carries.
links = ["tcp", "udp"]

# phase-548 W1 — the Rust entry's `main`: the C runtime's, as on threadx-linux.
[board.entry]
signature = "#[unsafe(no_mangle)]\nextern \"C\" fn main(argc: i32, argv: *const *const c_char) -> i32"

# phase-528 W2 (RFC-0118 D4) — the image is a host process.
[board.run]
host = true

[board.console]
kind = "stdio"

[board.capabilities]
heap = true
atomics = true
threads = true

# phase-479 W5 (RFC-0102 D5) — the runtime-logger arenas. MEASURED as a host board: no
# `target` is stated (the host triple, no cross toolchain) and `entry_kind` is
# `hosted-main` — the FreeRTOS POSIX port runs inside a Linux process.
#
# How many loggers `nros_log::get_or_create_logger` may create at run time: a
# node's own logger, every distinct `get_logger("x")` and every distinct child
# name each take one. The builtin is 16, an MCU's number; three nodes with four
# children each is already fifteen. Each slot is a `Logger` plus 24 bytes of
# name arena, so 32 costs about 1.3 KB of `.bss` — nothing to a host process.
# `[image.<id>] env = { NROS_LOG_DYNAMIC_LOGGERS = "<n>" }` overrides it per image.
[knobs.log]
dynamic_loggers = 32
