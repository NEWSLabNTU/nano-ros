# The base Kconfig of board `rpi-pico-w-zephyr` (phase-524 W3).
#
# The settings phase-524 W1's spike 3 rerun booted with the C talker over a
# serial zenoh link (docs/roadmap/data/phase-524-w1-wokwi-pico-rerun.log),
# the Nucleo's serial set (packages/boards/nros-board-nucleo-f767zi-zephyr/prj.conf)
# plus a ticking kernel. A leaf whose image says `board = "rpi-pico-w-zephyr"`
# gets this file from the nano-ros module hook (`NROS_LEAF_CONF`), AHEAD of
# the image's own `os_config` fragments, so an image fragment still overrides
# it (issue 1782's order).
#
# SERIAL ONLY (RFC-0115 D4): zenoh over UART0. The Pico W's WiFi (CYW43439
# on SPI/PIO) has no Zephyr 3.7 driver.

# --- The zenoh link over a UART ----------------------------------------------
CONFIG_NROS_TRANSPORT_SERIAL=y
CONFIG_NETWORKING=n
CONFIG_RING_BUFFER=y
CONFIG_SERIAL=y
# Issue 0852 -- interrupt-driven RX; polled RX drops bytes at 115200.
CONFIG_UART_INTERRUPT_DRIVEN=y
# Issue 2164 -- main below zenoh-pico's read task, so the RX drain is not
# starved by the publishing thread.
CONFIG_MAIN_THREAD_PRIORITY=5

# --- The kernel tick ----------------------------------------------------------
# The W1 spike's simulated SysTick did not carry Zephyr 3.7's tickless
# `cortex_m_systick` driver: with the board default (tickless) the kernel
# never left PRE_KERNEL and the image printed nothing, Zephyr's own
# hello_world included (phase-524 W1 rerun). Kept ticking, the setting the
# spike measured, until a bench run (phase-524 W5) says the board needs
# neither.
CONFIG_TICKLESS_KERNEL=n

# --- What zenoh-pico needs from the kernel -------------------------------------
# The non-network half of a zenoh leaf's `prj-zenoh.conf`, so a serial image
# on this board names NO `os_config` (that fragment would put the 64 KiB
# kernel heap back).
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16
# CONFIG_MAIN_STACK_SIZE is not stated here (issue 2365): the nano-ros module
# decides it per image, 32 KiB for a Rust entry (issue 2359) and 16 KiB for C
# and C++. A board can state only one number for every image, and the 32 KiB it
# stated for Rust also reached the C talker (and, through the task stacks that
# inherited it then, cost 48 KiB and overflowed RAM).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Randomness ----------------------------------------------------------------
# With NETWORKING=n nothing enables an entropy driver, so zenoh's session id
# needs a generator: the test one, as mps2-an385-serial.conf does. A constant
# seed: two images built from this file derive the same session id, so a PAIR
# needs a different TIMER_RANDOM_INITIAL_STATE (archived issue 0157's class).
CONFIG_TEST_RANDOM_GENERATOR=y

# --- Sizing --------------------------------------------------------------------
# sram is 264 KiB. Zephyr's kernel heap is not what nano-ros allocates from
# (CONFIG_NROS_ZEPHYR_HEAP_SIZE is), so 16 KiB keeps Zephyr's own users fed.
# The pool knobs the image still has to state are in nros-board.toml's header.
CONFIG_HEAP_MEM_POOL_SIZE=16384
