[package]
name = "nros-platform-stm32f4"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "nros platform implementation for STM32F4 bare-metal"
publish = false

[lib]
name = "nros_platform_stm32f4"

[features]
default = []
# Phase 121.2.embedded — canonical C ABI export.
cffi-export = ["dep:nros-platform-cffi", "dep:nros-log", "nros-log/platform-sink"]

[dependencies]
# issue 0710 follow-up — this crate EMITS `nros_platform_log_write`, so it is
# one of the places that can safely turn on `nros-log`'s dispatch auto-install.
# The dep exists for the feature alone (no code use): cargo has no other way to
# say "the symbol my sibling calls is supplied here". Boards do the same for the
# RTOS ports, whose symbols come from C linked at the board level.
nros-log = { path = "../../core/nros-log", default-features = false, optional = true }
nros-platform-api = { path = "../../platform/nros-platform-api" }
nros-platform-cffi = { path = "../../platform/nros-platform-cffi", optional = true }
# `stats` backs `PlatformAlloc::heap_used_bytes` (Phase 230 1b / RFC-0034).
zpico-alloc = { path = "../../rmw/zenoh/zpico-alloc", features = ["stats"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
defmt = "0.3"
nros-smoltcp = { path = "../../drivers/net/nros-smoltcp" }
# Shared bare-metal helpers (PRNG, sleep, libc stubs)
nros-baremetal-common = { path = "../../platform/nros-baremetal-common", features = ["libc-stubs"] }
