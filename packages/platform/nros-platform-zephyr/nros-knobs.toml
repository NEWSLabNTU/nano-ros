# The configuration rows this platform package declares (RFC-0140 D2,
# phase-581 W2). Found beside its descriptor (nros-platform.toml) by the scan that finds
# the package, so this file's presence is the declaration. The schema is core's
# (packages/tooling/nros-zephyr-build/knobs.toml says what each field means);
# every key starts with this file's owner word, `zephyr`, which is derived
# from the package (its platform name)
# and checked, never chosen. Edit, then run `python3 scripts/gen-knob-registry.py`.

owner = "zephyr"

# The application heap arena is core's `memory.heap_bytes` (RFC-0140
# Appendix A.1), whose Kconfig definition carries this platform's defaults.

[[knob]]
key = "zephyr.log_sink_buffers"
scope = "image"
class = "public"
type = "int"
prompt = "Log sink buffers (records formatted at once)"
kconfig_attrs = [
    "range 0 32",
    "default 4 if SMP",
    "default 2",
]
help = '''
How many nros_log records the Zephyr log sink can format at the same
time. Each buffer is 1280 bytes of .bss, owned by the sink and claimed with
one atomic bit, so a thread or an ISR on any CPU can take one without a
lock. A buffer is held for one format and one LOG_* call.

The default is two per CPU (4 on an SMP image, 2 otherwise): one record from
a thread and one from an interrupt in flight on each CPU. When every buffer
is in use, a record is formatted into a 160-byte stack buffer instead,
truncated and marked "...", and the sink says once that the pool ran dry.
A record is never dropped for want of a buffer.

0 formats every record in a 1280-byte buffer on the stack of the thread that
logged, as the sink did before this knob. A thread whose stack is sized for
its own work (1-2 KiB) then overflows the first time it logs.
'''
