# The configuration rows this platform package declares (RFC-0140 D2,
# phase-581 W2). Found beside its descriptor (nros-platform.toml) by the scan that finds
# the package, so this file's presence is the declaration. The schema is core's
# (packages/tooling/nros-zephyr-build/knobs.toml says what each field means);
# every key starts with this file's owner word, `threadx`, which is derived
# from the package (its platform name)
# and checked, never chosen. Edit, then run `python3 scripts/gen-knob-registry.py`.

owner = "threadx"

# Issue 2624 -- the ThreadX byte pool (the port's whole allocator), in bytes.
# Unset, the board build derives it: app stack + the RMW's measured working set.
# A board's `[knobs.memory] heap_bytes` states it too (the ladder's rung).
[[knob]]
key = "threadx.byte_pool_bytes"
scope = "board"
class = "carrier"
carries = "memory.heap_bytes"
retired = [
    { spelling = "toml:threadx.byte_pool_kb", factor = 1024, from_unit = "KiB" },
    { spelling = "env:NROS_THREADX_BYTE_POOL_KB", factor = 1024, from_unit = "KiB" },
]
