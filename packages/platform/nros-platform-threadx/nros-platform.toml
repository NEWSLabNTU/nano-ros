# RFC-0049 / phase-290 — per-platform-package configuration.
#
# Sections: `[capabilities]` (software-stack facts), `[knobs.*]` (typed
# policy defaults; deny_unknown_fields), top-level `arch_profiles` /
# `compile` / `required_env` (what any vendored C build here needs; the
# zenoh-pico port rows are `[port.<platform>]` in nros-rmw-zenoh's
# nros-rmw.toml since phase-349 W2b), `[arch.*]` (reusable compiler-flag
# profiles; may be duplicated across platform files only byte-identically).
# Resolution ladder: builtin < platform (inherits chain) < board < env.
# Schema + loader: nros-board-common/src/platform_config.rs.
# phase-349 W1 / RFC-0072 — the names this platform answers to; the
# directory is just where the file lives. names[0] is canonical.
# `threadx-linux` and `threadx-riscv64` are the names the TREE uses
# (`examples/fixtures.toml` has no row spelled plain `threadx`), and a name this
# file does not answer to is an UnknownPlatform. That used to become a warning
# plus builtin knobs rather than a panic, so a typo stayed visible — right for
# a typo and wrong here: the builtin executor knobs sit BELOW
# `EXECUTOR_BACKING_DEFAULT_U64S`, so the backing guard then refused the
# reservation and `threadx-linux` stopped COMPILING (issue 1145's 2026-09-12
# regression, nightly run 34680021029). phase-468 W1 made the UnknownPlatform
# itself fatal (`BuildRungs::require_rungs`), which is only safe because every
# board-declared name is now answered; these two aliases are part of why.
#
# `freertos` already carries its variant this way (`["freertos",
# "freertos-lwip"]`); this is the same shape. names[0] stays canonical.
names = ["threadx", "threadx-linux", "threadx-riscv64"]

# phase-349 W2b — what this platform needs from ANY C build of a vendored
# component: which `[arch.*]` profiles apply (first `target_match` wins, in
# this order), the compile settings, and the board facts it requires. The
# zenoh-pico port rows that used to sit beside these in `[build.zenoh]` live
# in the zenoh backend's descriptor now: `[port.threadx]` in
# packages/rmw/zenoh/nros-rmw-zenoh/nros-rmw.toml ("platforms name no
# backends", RFC-0072 §9).
arch_profiles = "riscv64gc"
compile = { opt_level = "s", warnings = false, cflags = ["-ffunction-sections", "-fdata-sections"] }
# phase-484 W2c — the source TREES (kernel, lwIP, ThreadX, NetX Duo) are not
# required env any more: `{source:<name>}` in the zenoh port row locates each through the one
# ladder and refuses with the remedy when none answers. Only board facts the
# board descriptor carries remain here.
required_env = [
  { name = "THREADX_CONFIG_DIR", help = "Directory containing tx_user.h. Example: packages/boards/nros-board-threadx-linux/config" },
  { name = "NETX_CONFIG_DIR", help = "Directory containing nx_user.h. Example: packages/boards/nros-board-threadx-linux/config" },
]

# phase-400 W3 / RFC-0086 — software-stack FACTS (open vocabulary).
[capabilities]
clock = true       # issue 1037 — exports nros_platform_clock_ns (src/platform.c)

[arch.riscv64gc]
target_match = "riscv64"
cflags = ["-march=rv64gc", "-mabi=lp64d", "-mcmodel=medany"]
needs_picolibc = true
needs_errno_override = true

