# RFC-0049 / phase-290 — per-platform-package configuration.
#
# Sections: `[capabilities]` (software-stack facts), `[knobs.*]` (typed
# policy defaults; deny_unknown_fields), `[build.zenoh]` (the zenoh-pico /
# zpico shim build block — keys documented in
# nros-board-common/src/manifest.rs), `[arch.*]` (reusable compiler-flag
# profiles; may be duplicated across platform files only byte-identically).
# Resolution ladder: builtin < platform (inherits chain) < board < env.
# Schema + loader: nros-board-common/src/platform_config.rs.
# phase-349 W1 / RFC-0072 — the names this platform answers to; the
# directory is just where the file lives. names[0] is canonical.
# `freertos-lwip` is an ALIAS being retired: the network stack is a fact
# the user declares, not part of the platform's identity. zenoh-pico
# itself splits system/freertos/{system.c, lwip/, freertos_plus_tcp/}.
names = ["freertos", "freertos-lwip"]

# phase-400 W3 / RFC-0086 — software-stack FACTS. A transport that needs a
# capability this platform declares `false` fails at config time; a capability
# left undeclared is permitted with a warning, because absent means "nobody has
# described this platform yet", not "impossible".
[capabilities]
ip_stack = true    # lwIP / FreeRTOS-Plus-TCP, both named in [build]

[build.zenoh]
defines = ["ZENOH_GENERIC", "ZENOH_FREERTOS_LWIP"]
# Phase 154 — `Z_FEATURE_LINK_UDP_MULTICAST = 0` disables the
# vendor `_z_close_udp_multicast` codepath in
# `system/freertos/lwip/network.c`, which has a vendor
# `sockrecv->socket` typo (the struct field is `_socket`).
# nano-ros doesn't use UDP multicast over zenoh-pico on
# FreeRTOS (router is TCP-only on this slirp path), so the
# feature loss is harmless and the typo stops mattering.
defines_kv = { ZENOH_DEBUG = "0", Z_FEATURE_MULTI_THREAD = "1", Z_FEATURE_LINK_UDP_MULTICAST = "0" }
# Phase 154 — pull vendor's FreeRTOS+lwIP `system/freertos/lwip`
# subtree + the top-level `system/freertos/system.c` so vendor's
# native `_z_send_tcp` / `_z_read_tcp` / `_z_task_*` / `_z_mutex_*`
# impls are compiled. Vendor's `system/common/platform.h`
# dispatch picks `platform/freertos/freertos_plus_tcp.h`
# (`{int _socket;}` struct) — having the matching network /
# system impls in the same TU set keeps caller / callee ABI
# coherent without needing the alias TU's opaque socket
# (alias TU is gated off for FreeRTOS in build.rs).
include = ["system/common", "system/freertos/lwip"]
extra_sources = [
  # Phase 154 — vendor `system/freertos/system.c` +
  # `system/freertos/lwip/network.c` provide the matching
  # `_z_sys_net_socket_t = { int _socket; }` ABI that the vendor
  # `src/link/unicast/tcp.c` caller expects. The alias TU's 32-byte
  # opaque socket would mismatch; vendor impls are the working
  # path. build.rs skips the alias TU entirely on FreeRTOS via
  # `if !use_freertos { ... alias_build.compile(...) }`.
  { path = "{src}/system/freertos/system.c" },
  { path = "{src}/system/freertos/lwip/network.c" },
  { path = "{nros}/c/zpico/zpico.c" },
]
# RFC-0062 — list form (Phase 148): the first arch whose `target_match` matches
# the build target wins. Was the scalar `"cortex-m3"`, which combined with that
# profile's `target_exclude = "thumbv7em"` made every Cortex-M4F / M7 FreeRTOS
# target unbuildable by construction.
# phase-385 W1 — `cortex-r52` was MISSING from this list. Its `[arch.*]` block
# landed with phase-372 W1, but the resolver walks THIS list (declared order,
# first match wins), so the profile was unreachable: an `armv8r-none-eabihf`
# cargo build panicked with "no [arch.*] profile … admits TARGET", naming only
# m3 and m7. The S32Z270 board never noticed because its CMake lane passes
# `FREERTOS_CFLAGS` explicitly (`nros_armv8r_cflags_env`), which short-circuits
# the lookup — so the gap only surfaces on a cargo-native build, which is
# exactly what a QEMU board's `runner` needs.
arch = ["cortex-m3", "cortex-m7", "cortex-r52"]
compile = { opt_level = "s", warnings = false, cflags = ["-ffunction-sections", "-fdata-sections"] }
required_env = [
  { name = "FREERTOS_DIR", help = "FreeRTOS kernel source. just setup-freertos; export FREERTOS_DIR=$PWD/third-party/freertos/kernel", validate_subdir = "include" },
  { name = "FREERTOS_PORT", help = "FreeRTOS portable layer. Examples: export FREERTOS_PORT=GCC/ARM_CM3 (Cortex-M3) | GCC/ARM_CM7/r0p1 (Cortex-M7)" },
  { name = "LWIP_DIR", help = "lwIP source. just setup-freertos; export LWIP_DIR=$PWD/third-party/freertos/lwip", validate_subdir = "src/include" },
  { name = "FREERTOS_CONFIG_DIR", help = "Directory containing FreeRTOSConfig.h + lwipopts.h. Example: packages/boards/nros-board-mps2-an385-freertos/config" },
]
include_paths = [
  "{nros}/c/include",
  "{env:FREERTOS_DIR}/include",
  "{env:FREERTOS_DIR}/portable/{env:FREERTOS_PORT}",
  "{env:FREERTOS_CONFIG_DIR}",
  "{env:LWIP_DIR}/src/include",
  "{env:LWIP_DIR}/contrib/ports/freertos/include",
  # Phase 154 — `nros-platform-api/include` carries
  # `<nros/platform_net.h>` (the canonical `nros_platform_*` ABI).
  # `zpico.c` includes it unconditionally.
  "{nros}/../../platform/nros-platform-api/include",
]
# issue 0491 — VALUE knobs only. `FREERTOS_PORT` is a port NAME and stays; the
# three PATH variables were dropped, because cargo compares an env value as
# TEXT and each leaf spells the same directory differently (`relative = true`).
# The include paths they feed are watched by CONTENT in `runner.rs`.
rerun_if_env_changed = ["FREERTOS_PORT"]


[arch.cortex-m3]
target_match = "thumbv7m"
target_exclude = "thumbv7em"
cflags = ["-mcpu=cortex-m3", "-mthumb"]

# phase-372 W1 — Cortex-R52 (ARMv8-R AArch32), the NXP S32Z270 RTU profile.
# Flags are the ASI consumer's hardware-proven set (VFP/NEON hard float).
# `armv8r` admits `armv8r-none-eabihf` (rustup-shipped); a toolchain without
# it can use `armv7r-none-eabihf` — v7-R code runs unmodified on the R52 —
# by adding a sibling profile or FREERTOS_CFLAGS.
[arch.cortex-r52]
target_match = "armv8r"
cflags = ["-mcpu=cortex-r52", "-mfpu=neon-fp-armv8", "-mfloat-abi=hard"]

# RFC-0062 — Cortex-M7, hard float (`thumbv7em-none-eabihf`). Added for the
# NXP S32K344 / MR-CANHUBK3 bring-up; before it, this platform had exactly one
# arch profile and it vetoed thumbv7em.
#
# KNOWN LIMITATION — `target_match` is a substring test on the target triple,
# and Cortex-M4F and Cortex-M7 share `thumbv7em-none-eabihf`. This profile
# therefore claims every hard-float thumbv7em FreeRTOS+lwIP build. Safe today
# (no M4F board targets this platform — `stm32f4` is bare-metal), but it is the
# layering fault RFC-0062 documents: the `-mfpu` choice below is a HARDWARE
# fact living in a PLATFORM manifest, and `ArchEntry` has no per-board gate to
# express it. The fix is letting the board layer contribute `[arch.*]`
# (RFC-0049's ladder already orders board above platform; only the loader
# needs extending — `BoardKnobsFile` currently parses `[knobs]` only).
#
# `fpv5-sp-d16` (single precision) matches the MR-CANHUBK3 S32DS project's own
# link args. A board whose SDK builds `-mfpu=fpv5-d16` must not mix objects
# with this profile — check your vendor project's link flags before assuming.
# `target_match` is the FULL hard-float triple, not the bare `thumbv7em` arch
# token: `target_exclude` is also a substring test, and `thumbv7em-none-eabi`
# (soft float) is a substring of `thumbv7em-none-eabihf`, so soft float cannot
# be excluded — only not-matched. A soft-float thumbv7em build therefore
# selects no profile and fails loudly, instead of silently compiling with
# `-mfloat-abi=hard` against a soft-float target.
[arch.cortex-m7]
target_match = "thumbv7em-none-eabihf"
cflags = ["-mcpu=cortex-m7", "-mthumb", "-mfloat-abi=hard", "-mfpu=fpv5-sp-d16"]
