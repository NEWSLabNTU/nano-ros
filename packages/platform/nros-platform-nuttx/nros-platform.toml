# RFC-0049 / phase-290 — per-platform-package configuration.
#
# Sections: `[capabilities]` (software-stack facts), `[knobs.*]` (typed
# policy defaults; deny_unknown_fields), top-level `arch_profiles` /
# `compile` / `required_env` (what any vendored C build here needs; the
# zenoh-pico port rows are `[port.<platform>]` in nros-rmw-zenoh's
# nros-rmw.toml since phase-349 W2b), `[arch.*]` (reusable compiler-flag
# profiles; may be duplicated across platform files only byte-identically).
# Resolution ladder: builtin < platform (inherits chain) < board < env.
# Schema + loader: nros-board-common/src/platform_config.rs.
# phase-349 W1 / RFC-0072 — the names this platform answers to; the
# directory is just where the file lives. names[0] is canonical.
names = ["nuttx"]

# phase-349 W2b — what this platform needs from ANY C build of a vendored
# component: which `[arch.*]` profiles apply (first `target_match` wins, in
# this order), the compile settings, and the board facts it requires. The
# zenoh-pico port rows that used to sit beside these in `[build.zenoh]` live
# in the zenoh backend's descriptor now: `[port.nuttx]` in
# packages/rmw/zenoh/nros-rmw-zenoh/nros-rmw.toml ("platforms name no
# backends", RFC-0072 §9).
arch_profiles = "cortex-a7"
compile = { opt_level = "s", warnings = false, cflags = ["-ffunction-sections", "-fdata-sections"] }
# Issue 2149 — no `required_env`: the kernel tree is located through the one
# ladder (`{nuttx_include}` / `locate::try_source("nuttx-kernel")`: the row's
# `NUTTX_DIR` override, the store, this checkout), like the other platforms'
# trees since phase-484 W2c. Demanding `NUTTX_DIR` in the environment was the
# one site left, and it refused every `nros build` of a Rust NuttX image,
# which states no such variable.

# phase-400 W3 / RFC-0086 — software-stack FACTS. A transport that needs a
# capability this platform declares `false` fails at config time; a capability
# left undeclared is permitted with a warning, because absent means "nobody has
# described this platform yet", not "impossible".
[capabilities]
ip_stack = true    # posix sockets, named in [build]
clock = true       # issue 1037 — exports nros_platform_clock_ns (src/platform.c)

[arch.cortex-a7]
target_match = "armv7a"
cflags = ["-march=armv7-a"]
