[package]
name = "nros-baremetal-common"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared bare-metal helpers (PRNG, sleep, libc stubs, heap-refusal report) for nros-platform-* crates"
publish = false

[lib]
name = "nros_baremetal_common"

[features]
default = []
# Emit `#[unsafe(no_mangle)]` libc stubs (strlen, memcpy, …). Enable on
# exactly one platform crate per binary — multiple definitions cause
# linker errors. ESP32 / ESP32-QEMU should NOT enable this since
# esp-hal already provides them.
libc-stubs = []

[dependencies]
# Issue 1640 — the shared heap-refusal report (`src/heap.rs`): the arena type,
# its verdict, and the port's log + fatal hook.
zpico-alloc = { path = "../../rmw/zenoh/zpico-alloc" }
nros-platform-api = { path = "../nros-platform-api" }
