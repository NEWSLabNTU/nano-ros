[package]
name = "nros-platform-cffi"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust mirror of the canonical C ABI for the nros platform abstraction"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["embedded", "no-std", "rtos", "ffi"]
categories = ["embedded", "no-std", "os"]

[features]
default = []
threading = []
# Phase 121.4.a — compile `tests/c_stubs/platform_stubs.c` into a
# static lib that provides every `nros_platform_*` symbol with
# per-category counters. Only the in-crate integration test
# (`tests/c_stub_platform.rs`) consumes this; regular consumers
# never enable it.
c-stub-test = ["dep:cc", "dep:nros-cc-flags"]
# Phase 121.3.posix / 123.A.1.x.2 — compile the sibling `nros-platform-posix`
# crate's `src/platform.c` into a static lib that supplies every
# `nros_platform_*` symbol with a real POSIX implementation. The
# in-crate integration test `tests/c_port_posix.rs` consumes it.
# Mutually exclusive with `c-stub-test` (both would supply
# definitions for the same symbols).
posix-c-port = ["dep:cc", "dep:nros-cc-flags"]

[dependencies]
# issue 0710 follow-up — `posix-c-port` compiles the POSIX C port, which DEFINES
# `nros_platform_log_write`. The dep exists for the feature alone (no code use):
# it is how a provider says the symbol `nros-log`'s default sink calls is
# supplied here, so the auto-install is safe to compile in.
nros-platform-api = { version = "0.5.0", path = "../nros-platform-api" }
# issue 0710 — for `LogSink`/`Record`, so the platform-ABI sink can live beside
# the ABI it speaks. The edge points this way and only this way: `nros-log` is a
# facade and must not depend on any port, which is what kept the sink stranded
# on the wrong side of the layering.
#
# NOT optional. It was, briefly, when `posix-c-port` forwarded a
# `nros-log/platform-sink` feature; that feature is gone (issues 0723/0727) and
# `src/log.rs` compiles unconditionally, which is the whole point — the sink's
# availability is this crate's presence, not a flag.
nros-log = { workspace = true }

[build-dependencies]
cc = { version = "1", optional = true }
# issue 0383 — strict C diagnostics (implicit-function-declaration,
# int-conversion) as ERRORS at every `cc::Build` below. One shared spelling.
nros-cc-flags = { path = "../../tooling/nros-cc-flags", optional = true }

[dev-dependencies]
# Required by the `posix-c-port` integration test for pthread_mutex_t /
# pthread_cond_t / pthread_t type layouts.
libc = "0.2"
# Phase 110.E.b — `c_port_posix_timer.rs` exercises the
# `AtomicSporadicState` + `atomic_sporadic_refill_thunk` round-trip
# against the real POSIX `PlatformTimer` impl. Only the test pulls
# nros-node, so the production crate stays dependency-light.
nros-node = { path = "../../core/nros-node", default-features = false, features = ["alloc", "rmw-cffi"] }

[lints]
workspace = true
