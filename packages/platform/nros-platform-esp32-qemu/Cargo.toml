[package]
name = "nros-platform-esp32-qemu"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "nros platform implementation for ESP32-C3 QEMU bare-metal"
publish = false

[lib]
name = "nros_platform_esp32_qemu"

[features]
default = []
# Phase 97.3.esp32-qemu — DDS / DDS heap budget (256 KB,
# tightest fit on ESP32-C3's 400 KB SRAM). Off by default so zenoh
# / xrce builds keep their 32 KB footprint.
dds-heap = []
# Phase 121.2.embedded — canonical C ABI export.
cffi-export = ["dep:nros-platform-cffi", "dep:nros-log"]

[dependencies]
# issue 0710 follow-up — this crate EMITS `nros_platform_log_write`, so it is
# one of the places that can safely turn on `nros-log`'s dispatch auto-install.
# The dep exists for the feature alone (no code use): cargo has no other way to
# say "the symbol my sibling calls is supplied here". Boards do the same for the
# RTOS ports, whose symbols come from C linked at the board level.
nros-log = { path = "../../core/nros-log", default-features = false, optional = true }
nros-platform-api = { path = "../../platform/nros-platform-api" }
nros-platform-cffi = { path = "../../platform/nros-platform-cffi", optional = true }
zpico-alloc = { path = "../../rmw/zenoh/zpico-alloc" }
esp-hal = { version = "1", features = ["esp32c3", "unstable"] }
nros-smoltcp = { path = "../../drivers/net/nros-smoltcp" }
# Shared bare-metal helpers (PRNG, sleep). esp-hal already provides
# libc symbols, so we do NOT enable the `libc-stubs` feature here.
nros-baremetal-common = { path = "../../platform/nros-baremetal-common" }
