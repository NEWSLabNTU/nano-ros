[package]
name = "nros-build-helpers"
version.workspace = true
edition = "2024"
description = "Shared build-script helpers for nano-ros C and C++ API crates"
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false

# issue 0287 — HOST-ONLY. `just check-workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "build-script helper library, runs on the host"

[dependencies]
cbindgen = "0.29"
cc = "1"
# issue 0383 — strict C diagnostics (implicit-function-declaration,
# int-conversion) as ERRORS at every `cc::Build` below. One shared spelling.
nros-cc-flags = { path = "../nros-cc-flags" }
nros-sizes-build = { workspace = true }

[lints]
workspace = true
