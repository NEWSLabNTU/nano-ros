# phase-291 (#211) — the canonical zephyr-leaf Kconfig→rustc-env bake, shared
# as a build-dependency by every zephyr rust example / workspace zephyr_entry.
# ZERO dependencies by design: upstream `zephyr-build` resolves as a
# west-module PATH dep only, so this crate must stay host-checkable without it
# (the `export_kconfig_bool_options()` call stays in each leaf, which already
# depends on `zephyr-build`).
[package]
name = "nros-zephyr-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Build-script helper baking nros Kconfig values into rustc-env for Zephyr Rust leaves"

# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "host build-script helper for the Zephyr module"

