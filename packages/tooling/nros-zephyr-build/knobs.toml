Longest string a `string` or `string_array` parameter can hold, and
the capacity of a parameter DESCRIPTION (nros-params build.rs). Every
store slot is as large as the largest value the limits allow, so this
is paid once per slot whatever the slot holds.

-1 DERIVES 0 when the contract's `params:` declare no string, which is
what takes a scalar-only image's slot from ~8.9 KiB to 168 bytes; at 0
no parameter can carry a description either. When a node DOES declare
a string the contract cannot say how long it may be -- that is a fact
about the board -- so state a number here, and the build refuses,
naming the parameter and this knob, if nothing does. Without a
declaration the crate default of 256 stands.
'''

[[knob]]
id = "PARAM_EVENTS_DEPTH"
toml = "params.param_events_depth"
type = "int"
prompt = "/parameter_events publisher history depth"
kconfig_attrs = [
    "default 1",
