stated = "rmw_config"
parse = "str"
retired = [{ spelling = "run:ZENOH_MODE" }]
help = "client | peer; compared with the zenoh file's `mode`."

[[env]]
name = "RCUTILS_COLORIZED_OUTPUT"
foreign = "rcutils"
disposition = "respect"
help = "Colour in the Linux console sink."

[[env]]
name = "RCUTILS_CONSOLE_OUTPUT_FORMAT"
foreign = "rcutils"
disposition = "respect"
parse = "str"
help = "The line format of the Linux console sink."

[[env]]
name = "RCUTILS_LOGGING_BUFFERED_STREAM"
foreign = "rcutils"
disposition = "ignore"
help = "One sink per board."

[[env]]
name = "RCUTILS_LOGGING_USE_STDOUT"
foreign = "rcutils"
disposition = "ignore"
help = "One sink per board."

[[env]]
name = "RMW_IMPLEMENTATION"
foreign = "ros2"
disposition = "ignore"
stated = "rmw"
help = "Not a backend selector (an image links its backends at build time; NROS_RMW picks among them). Noticed only when it maps to a backend other than the image's."

[[env]]
name = "RMW_ZENOH_<N>"
foreign = "ros2"
pattern = true
disposition = "ignore"
help = "rmw_zenoh_cpp's own variables (RMW_ZENOH_CONFIG_URI, ...); nano-ros reads none."

[[env]]
name = "ROS_AUTOMATIC_DISCOVERY_RANGE"
foreign = "ros2"
disposition = "ignore"
help = "Discovery scope is the middleware file's (rmw_config)."

[[env]]
name = "ROS_DISABLE_LOANED_MESSAGES"
foreign = "ros2"
disposition = "ignore"
help = "nano-ros does not switch loans by the environment."

[[env]]
name = "ROS_DOMAIN_ID"
foreign = "ros2"
disposition = "respect"
stated = "domain_id"
parse = "int"
help = "Overrides the stated domain on a process with an environment."

[[env]]
name = "ROS_HOME"
foreign = "ros2"
disposition = "ignore"
help = "nano-ros writes no log file."

[[env]]
name = "ROS_LOCALHOST_ONLY"
foreign = "ros2"
disposition = "ignore"
help = "Discovery scope is the middleware file's (rmw_config)."

[[env]]
name = "ROS_LOG_DIR"
foreign = "ros2"
disposition = "ignore"
help = "nano-ros writes no log file."

[[env]]
name = "ROS_NAMESPACE"
foreign = "ros2"
disposition = "ignore"
help = "Stock rcl ignores it too; NROS_NODE_NAMESPACE is the override."

[[env]]
name = "ROS_SECURITY_ENABLE"
foreign = "ros2"
disposition = "refuse"
refuse_if = "ROS_SECURITY_STRATEGY=Enforce"
instead = "nano-ros has no SROS2 support; unset ROS_SECURITY_ENABLE or ROS_SECURITY_STRATEGY"
help = "Refused only with ROS_SECURITY_STRATEGY=Enforce (running unsecured while the operator believes otherwise); otherwise ignored."

[[env]]
name = "ROS_SECURITY_ENCLAVE_OVERRIDE"
foreign = "ros2"
disposition = "ignore"
help = "No SROS2."

[[env]]
name = "ROS_SECURITY_KEYSTORE"
foreign = "ros2"
disposition = "ignore"
help = "No SROS2."

[[env]]
name = "ROS_SECURITY_STRATEGY"
foreign = "ros2"
disposition = "ignore"
help = "No SROS2 (see ROS_SECURITY_ENABLE for the refused case)."

[[env]]
name = "ROS_STATIC_PEERS"
foreign = "ros2"
disposition = "ignore"
help = "The middleware file's peer list (rmw_config)."

[[env]]
name = "RUST_LOG"
foreign = "rust"
disposition = "respect"
parse = "str"
help = "The log level of the linux board's stdout sink, Rust road only."
