[[knob]]
id = "EXECUTOR_ACTION_CLIENTS"
toml = "executor.action_clients"
type = "int"
prompt = "Callback slots to budget at ActionClient size (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
How many of NROS_EXECUTOR_MAX_CBS slots the arena derivation budgets at
ACTION CLIENT size (~18 KiB each) rather than pub/sub size (~3.5 KiB).

-1 DERIVES it from the image's entity inventory, the same way MAX_CBS is
derived: the count is the action clients AND action servers the image's
components declare. An image whose inventory refuses -- any component
that declared no ENTITIES -- falls through to MAX_CBS, which reproduces
the historical arithmetic exactly, so nothing built before this moves.

Action SERVERS count too, though the option is named for clients: the
arena stores ActionServerArenaEntry, so a server image occupies the same
heavy slots and zeroing this on one would trade the saving for a runtime
BufferTooSmall.

Set it to 0 on an image with no action client: at the defaults that takes
the arena from 74240 bytes to 16384. The arena is INLINE ON THE TASK
STACK, not in .bss, so this is stack headroom -- see the FreeRTOS
"Invalid mbox" note in docs/reference/platform-implementation-notes.md.

Too small fails at REGISTRATION with BufferTooSmall, not at link. The
executor reports what it actually used on its first spin, so build once,
read the advisory, then set this. Issue 0900.
'''

[[knob]]
id = "EXECUTOR_ARENA_SIZE"
toml = "executor.arena_size"
type = "int"
prompt = "Executor arena size in bytes (0 = derive)"
kconfig_attrs = [
    "default 0",
]
help = '''
Explicit executor arena size. 0 means let nros-node build.rs derive it,
which budgets EVERY callback slot at action-client size (~18 KiB) --
correct, but several times over for a pub/sub-only image, which needs
about max_cbs * ((depth + 1) * (NROS_SUBSCRIPTION_BUFFER_SIZE + 8) + 1024)
+ 2048.

MIND THE DEPTH (issue 1190). A subscription's arena claim scales with its
QoS history: KEEP_LAST(N > 1) is a ring of N + 1 slots plus a length
beside each, and the ROS default is KEEP_LAST(10), so one ordinary
subscription at the default buffer size costs 12 KiB and not 3.5 KiB.
This help said "3 * NROS_SUBSCRIPTION_BUFFER_SIZE + 512" until the
derivation itself did, and an image sized from that arithmetic dies at
entity creation with NodeError::BufferTooSmall.

Set it only with that arithmetic in hand. On an image that DECLARES its
entities (every NROS_ENTITY_COUNT_* reached the build), a value below
what they are modelled to need does not build: nros-node refuses it at
compile time, naming this option, both numbers and the shortfall
(phase-412, executor::arena_oracle). On an image that declares nothing
the derivation is a worst-case budget, not a requirement, so a smaller
value is accepted -- and too small still fails at runtime, at the first
registration that does not fit, not at link.
'''

[[knob]]
id = "EXECUTOR_BACKING_U64S"
toml = "executor.backing_u64s"
type = "int"
prompt = "Executor backing reservation in 64-bit words (-1 = derive, 0 = none)"
kconfig_attrs = [
    "default -1",
]
help = '''
How many 64-bit words nros-node reserves in .bss for the executor's
per-entry storage -- the named static
nros_node::executor::backing::EXECUTOR_BACKING (phase-392 W6,
RFC-0002 SS 4.4b). The reservation is exactly 8 x this many bytes, on
every target.

-1 DERIVES it, from ExecutorSizing::DEFAULT: MAX_CBS, MAX_SC, MAX_NODES
and the arena (and the parameter store, when the image builds one).

A STATED number covers the executor's tables only: when the image builds
a parameter store (NROS_CAPABILITY_PARAM_SERVICES or NROS_PARAM_STORE),
the store's words are carved from the same static and added ON TOP, so
the reservation is then 8 x (this + the store). phase-382 W3'. That is the right answer for an image that does not care
which budget the bytes come out of.

STATE A NUMBER when the image lowers CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE
to pay for the reservation (issue 1145). The Rust global allocator here is
picolibc malloc, whose arena is ITSELF a fixed static, and before W6 the
backing was a Box::leak out of it -- so leaving that arena where it was
reserves the same bytes twice. Lowering it by a number copied out of `nm`
pairs them once and then drifts the next time an executor knob moves,
in whichever direction, with nothing to say so (issue 1171).

Stating the size inverts that. The crate obeys this number, so the
pairing is exact by construction and identical on every board -- the
DERIVED size is target-dependent (87,256 B on mps2_an385 against
88,328 B on native_sim/native/64 for one and the same conf, which is how
1145's hand-paired leaf kept double-reserving 1,072 bytes on the second
board) and 8 x this is not. State it too SMALL and nros-node refuses to
compile naming this knob, which is the direction that would otherwise
silently re-create the double reservation.

ISSUE 1611 RETIRED THE PAIRING ABOVE. Issue 1324 moved every Zephyr Rust
allocation onto the nros heap (NROS_ZEPHYR_HEAP_SIZE), so no Rust byte
reaches picolibc's arena and there is nothing in it to lower; the six
example confs that did so (a `# nros-arena-base:` marker, this knob and
a lowered COMMON_LIBC_MALLOC_ARENA_SIZE) state none of the three now,
and check-executor-backing-arena-pairing refuses the marker. Stating
this knob is still how an image fixes the reservation at 8 x N bytes on
every board. That a value is stated does not make it ENOUGH: the executor
grows, the conf does not, and the image stops compiling. `just check
node-std-tests` checks every stated value against the MEASURED default
on each board the conf is built for (issue 1284), so restate it there.

0 declines the static entirely and restores the pre-W6 leak, for an image
that would rather keep the bytes in the allocator arena than have the
linker price them.
'''

[[knob]]
id = "EXECUTOR_EXTRA_SESSIONS"
type = "int"
prompt = "Extra-session slots per executor (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Issue 1982 -- slots for sessions a node opens on an RMW backend other
than the primary's (NodeBuilder::rmw, open_multi), per executor (per
tier), at most one per node slot. A slot is the backend's session
(528 bytes on thumbv7em with zenoh) plus a 168-byte id.

`-1` derives it from the image's backend count (the sizing
descriptor's [image] backend_count, which also sizes the RMW backend
registry): backends - 1, so 0 for a one-RMW image. With no backend
count stated, one per node slot (the old size). State a count only for
a second session on the SAME backend (another locator or domain, on a
backend that allows it); a full table is NodeError::NodeTableFull.
'''

[[knob]]
id = "EXECUTOR_MAX_AGE_MONITORS"
type = "int"
prompt = "Contract-monitor age rows per executor (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Age contract rows one executor watches (nros-node build.rs
MAX_AGE_MONITORS, phase-496 W1): one per contracted subscription
carrying max_age_ms. A separate knob from NROS_EXECUTOR_MAX_MONITORS
because it is a separate table, so an image with rate contracts and
no age contracts pays for one table only. `-1` derives it on the same
terms, and a longer table is refused naming this knob.
'''

[[knob]]
id = "EXECUTOR_MAX_CBS"
toml = "executor.max_cbs"
type = "int"
prompt = "Maximum executor callback slots (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Maximum number of callback slots in the executor
(subscriptions + timers + services + service clients + action
entities + guard conditions). Controls both Rust and C APIs.
Arena size is derived automatically from this value and the
subscription buffer size.

A PUBLISHER IS NOT ONE OF THEM. Every registration that claims a slot
calls Executor::next_entry_slot(); create_publisher does not — it writes
an RmwPublisher into caller-owned storage and there is no
nros_executor_add_publisher on the C path. The mr-canhubk344 bring-up
counted 33 "handles" for the island and set 36 here; 14 of those 33 are
publishers and the slot demand is 19.

-1 means DERIVE it from this image's ENTITY inventory (phase-403 W9 /
issue 0965): the sum of every `nano_ros_node_register(... ENTITIES ...)`
declaration in the image, counted by kind. It is derived only when EVERY
component declared; one that did not makes the whole image refuse, so a
partial answer can never be published as a whole one. Any value other
than -1 is yours and WINS; the crate default when nothing is stated and
nothing is derivable is 4.

The derived value carries NO headroom, which makes the running image a
checker of its own declaration: one entity past the table and
registration returns ExecutorFull naming this knob, and the entry halts
boot naming the node. Raise it deliberately if you want slack — the
arena scales with it.

4 is the crate default in nros-node/build.rs. This option was never
forwarded to Cargo before issue 0316, so every Zephyr C image compiled
that default regardless of what was configured here; the old default of
16 had therefore never been built. Honouring it as-is would have grown a
native_sim listener's .bss by 219 KB (+35%) as a side effect of repairing
the plumbing.
'''

[[knob]]
id = "EXECUTOR_MAX_MONITORS"
type = "int"
prompt = "Contract-monitor rate/latency rows per executor (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Rate/latency contract rows one executor watches (nros-node build.rs
MAX_MONITORS, phase-496 W1 / issue 1471). One row per contracted
publisher carrying min_rate_hz, plus latency-only rows from node
paths carrying max_latency_ms.

`-1` DERIVES this from the image's entity inventory, which counts the
rows from the same contract the entry bakes its table from. Without
a contract the crate default of 8 stands. A stated number wins, in
both directions. The rows are inline in the executor (24 bytes each
on a 32-bit target), so a board file should never state a count the
contract already determines. A table longer than this is REFUSED at
install (nros_cpp_install_monitors logs this knob's name and returns
NROS_CPP_RET_FULL; a Rust entry fails to compile), never truncated.
'''

[[knob]]
id = "EXECUTOR_MAX_NODES"
toml = "executor.max_nodes"
type = "int"
prompt = "Maximum nodes per executor (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Nodes attachable to one executor (nros-node build.rs MAX_NODES,
Phase 104.C.2).
'''

[[knob]]
id = "EXECUTOR_MAX_SC"
toml = "executor.max_sc"
type = "int"
prompt = "Maximum scheduling-context slots per executor (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
SchedContext slots per executor (nros-node build.rs MAX_SC,
RFC-0052 / Phase 110.B).

issue 1198 -- `-1` DERIVES this from the image's entity inventory:
slot 0 is the reserved default Fifo context (create_sched_context
searches 1..MAX_SC), plus one per scheduling context the schedule can
create. The Rust runtime creates NONE -- apply_tier_sched_policy ends
in set_default_sched_context, which mutates slot 0 -- while the C/C++
entry pack creates one per tier. A stated number wins, in both
directions. The old default was 8 for every image whatever it
declared, worth 112 bytes a slot in the executor backing on
thumbv7m-none-eabi. Too small is NodeError::NoSchedContextSlot at
create_sched_context, which names this knob.
'''

[[knob]]
id = "EXECUTOR_MAX_SHUTDOWN_CBS"
toml = "executor.max_shutdown_cbs"
type = "int"
prompt = "Shutdown-hook slots per phase"
kconfig_attrs = [
    "default 2",
]
help = '''
How many shutdown hooks the executor can hold PER PHASE — one table
this size for pre-shutdown hooks (run while the session is still open,
so a node can publish a final state or park an actuator) and a second
for on-shutdown hooks (run after the close). Issue 0790;
nros-node/build.rs NROS_EXECUTOR_MAX_SHUTDOWN_CBS.

Deliberately small: the slots are static, so every image pays for them
whether or not it registers a hook (the same cost issue 0460 measured
for queryable slots). Raise it only when an image genuinely has more
things to park on the way down. Overflow is reported at registration
(RCLC_RET_FULL), not silently dropped.
'''

[[knob]]
id = "EXECUTOR_MAX_VIOLATIONS"
type = "int"
prompt = "Contract-violation ring depth per executor"
kconfig_attrs = [
    "default 8",
    "range 1 256",
]
help = '''
phase-474 I1 -- how many contract violations one executor's ring
keeps for a drain (nros-node build.rs MAX_VIOLATIONS), and the slot
count of the image-wide SWD record NROS_VIOLATION_RECORD (present
with CONFIG_NROS_BOOT_REPORT).

The ring keeps the LATEST entries: a violation into a full ring
evicts the oldest and counts it (Executor::violations_dropped). It
used to keep the FIRST entries, so a board whose start-up filled it
stored nothing after. A slot costs 24 bytes in the ring and 28 in the
record on a 32-bit target; 8 is 192 B per executor plus 264 B for
the record. Raise it only when a burst must be kept whole.
'''

[[knob]]
id = "EXECUTOR_RUNTIME_REMAPS"
type = "int"
prompt = "Runtime remap-table slots per executor (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Issue 1971 (RFC-0107 step 1) -- slots of one executor's RUNTIME remap
table (nros-node build.rs RUNTIME_REMAPS): `--ros-args -r` rules and
rules hand-written code declares with nros_cpp_declare_remap /
Executor::declare_remap. The launch file's <remap> rules are NOT here:
the generated entry emits them as one const table in flash that every
executor reads (nros_cpp_set_launch_remaps).

`-1` derives it: 16 on a target with process arguments (Linux, NuttX),
0 on bare metal (Zephyr, FreeRTOS, ThreadX), which has no argv. A rule
costs 404 bytes on a 32-bit target, per executor (per tier). At 0,
declare_remap is refused by name (RemapRefused::NoRuntimeTable,
NROS_CPP_RET_FULL); state a count here to restore runtime slots.
'''

[[knob]]
id = "FREERTOS_APP_STACK_KB"

[[knob]]
id = "FREERTOS_HEAP_KB"

[[knob]]
id = "GRAPH_MAX_ENTITIES"
type = "int"
prompt = "Entities you expect on this ROS 2 domain (0 = state the bytes instead)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default 0",
]
help = '''
A DECLARED CAPABILITY, not a derivation. The graph cache holds one
liveliness keyexpr for every entity of every node on the domain —
remote nodes included — so nothing about this image can answer it.
What an operator does know is roughly how many nodes and endpoints
share the domain, and this takes that count.

The bytes follow from a measurement, not a model: a ROS 2 liveliness
keyexpr runs ~140 bytes and the cache stores them NUL-separated with
no index, so one entity costs 141 bytes. Upstream measured a host
running one stock talker plus the ROS 2 daemon carrying 222 tokens.

0 means "I am stating the bytes instead" — NROS_GRAPH_CACHE_SIZE
outranks this and keeps its own default, so nothing that already sets
it changes.

UNDER-STATING IS NOT A SMALLER CACHE. Overflow is counted, never
truncated, and a non-zero dropped count makes service_is_ready answer
"cannot say", which every caller reads as keep waiting; the node and
topic list verbs discard the count entirely and simply under-report.
Being generous costs .bss; being short costs a hang and a wrong graph
answer.
'''

[[knob]]
id = "KEYEXPR_STRING_SIZE"
toml = "zenoh.limits.keyexpr_string_size"

[[knob]]
id = "LET_BUFFER_SIZE"
toml = "runtime.let_buffer_size"

[[knob]]
id = "LOG_BUFFER_SIZE"
toml = "log.buffer_size"
type = "int"
prompt = "nros-log per-call formatting buffer (bytes)"
kconfig_attrs = [
    "default 256",
    "range 128 4096",
]
help = '''
Bytes of the buffer one Rust log call formats into, and of the message
held in each early-record and /rosout slot (nros-log build.rs, as
NROS_LOG_BUFFER_SIZE; issue 1037). Longer messages are truncated with
an ellipsis. The C/C++ NROS_LOG_* printf front-end keeps its own
256-byte frame (<rclc/log.h>), so a C record is bounded by the smaller
of the two. Bigger costs stack on every logging task. Replaces the
deprecated buffer-size-<N> cargo features.
'''

[[knob]]
id = "LOG_DYNAMIC_LOGGERS"
toml = "log.dynamic_loggers"
type = "int"
prompt = "Loggers nros-log may create at run time"
kconfig_attrs = [
    "default 16",
    "range 0 1024",
]
help = '''
How many loggers nros_log::get_or_create_logger may CREATE at run time
(nros-log build.rs, as NROS_LOG_DYNAMIC_LOGGERS): a node's own logger,
every distinct get_logger("x") and every distinct child name each take
one slot. Each slot costs a Logger plus 24 bytes of name arena in .bss.

0 declines the arenas entirely -- no runtime loggers, lookup only --
which is right for an image whose loggers are all static. A creation
past the capacity falls back to the parent logger and warns once.

Size it from a measurement: the boot report records the slots in use
against this capacity, and `just mem-report` prices the arenas.
A board states its own default in [knobs.log] dynamic_loggers;
this Kconfig value outranks it, and the environment outranks both.
'''

[[knob]]
id = "LOG_EARLY_RECORDS"
toml = "log.early_records"
type = "int"
prompt = "nros-log records held for delivery"
kconfig_attrs = [
    "default 4",
    "range 0 256",
]
help = '''
How many records nros_log::early holds until a sink can take them:
before init installs the sinks, or while another thread is inside a
sink (issue 2000). nros-log build.rs reads it as
NROS_LOG_EARLY_RECORDS (issue 1037). 0 declines the queue: such
records are dropped and only counted, and the count is logged.
Each slot is a formatting buffer plus a logger name in .bss.
Replaces the deprecated early-records-<N> cargo features.
'''

[[knob]]
id = "LOG_MAX_LEVEL"
toml = "log.max_level"
type = "int"
# A project or board may also write the level's name; the index is the value.
names = ["trace", "debug", "info", "warn", "error", "fatal", "off"]
prompt = "nros-log compile-time severity ceiling"
kconfig_attrs = [
    "default 0",
    "range 0 6",
]
help = '''
The least severe record the image can emit at all (nros-log build.rs,
as NROS_LOG_MAX_LEVEL; issue 1037): 0 trace, 1 debug, 2 info, 3 warn,
4 error, 5 fatal, 6 off. A number, as Zephyr's own LOG_MAX_LEVEL is.

Rust nros_*! call sites below the ceiling compile to nothing; C and
C++ records below it are refused at the facade (the same check
nros_log_is_enabled answers). It is a BOUND, not the runtime level:
rclc_logger_set_level / set_level still move each logger's threshold
beneath it. Replaces the deprecated max-level-* cargo features.
'''

[[knob]]
id = "LOG_ROSOUT_RECORDS"
toml = "log.rosout_records"
type = "int"
prompt = "nros-log /rosout queue depth"
kconfig_attrs = [
    "default 16",
    "range 1 1024",
]
help = '''
Records the /rosout queue holds between pumps, and the KEEP_LAST
depth of the /rosout publisher (nros-log build.rs, as
NROS_LOG_ROSOUT_RECORDS; issue 1037). Only paid when nros-node's
rosout feature is on. Replaces the deprecated rosout-records-<N>
cargo features.
'''

[[knob]]
id = "MAX_ARRAY_LEN"
toml = "params.max_array_len"
type = "int"
prompt = "Array parameter capacity in elements (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Elements a `bool_array`, `integer_array`, `double_array` or
`string_array` parameter can hold (nros-params build.rs).

-1 DERIVES 0 when the contract's `params:` declare none of those
types. When one is declared, state a number here; the build refuses,
naming the parameter and this knob, if nothing does. Without a
declaration the crate default of 32 stands.
'''

[[knob]]
id = "MAX_BYTE_ARRAY_LEN"
toml = "params.max_byte_array_len"
type = "int"
prompt = "Byte-array parameter capacity in bytes (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Bytes a `byte_array` parameter can hold (nros-params build.rs).

-1 DERIVES 0 when the contract's `params:` declare no byte_array.
When one is declared, state a number here; the build refuses, naming
the parameter and this knob, if nothing does. Without a declaration
the crate default of 256 stands.
'''

[[knob]]
id = "MAX_PARAMETERS"
toml = "params.max_parameters"
type = "int"
prompt = "Maximum declared parameters per image (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Static parameter-store pool size (nros-params build.rs). A node
declaring more parameters than this fails declare_parameter with
ErrorCode::Full (-5) at boot. The Autoware trajectory follower
declares ~150.

phase-446 W4 -- -1 DERIVES it from the contract's `params:`: every
declared parameter plus one `use_sim_time` per node, which nano-ros
declares on every node. An image whose contract declares no
parameters (or declares them on only some nodes) falls through to the
crate default of 32. Stating a number here WINS.
'''

[[knob]]
id = "MAX_PARAM_CONSTRAINTS_LEN"
toml = "params.max_param_constraints_len"
type = "int"
prompt = "Parameter additional_constraints capacity in bytes"
kconfig_attrs = [
    "default 0",
    "range 0 256",
]
help = '''
Longest `additional_constraints` a parameter's descriptor can hold
(nros-params build.rs) -- the free text `ros2 param describe` prints
and rclc's rclc_add_parameter_description takes as its fourth
argument. Paid once per store slot whatever the slot holds.

phase-417 W4.a -- a board fact, never derived, exactly like
NROS_MAX_PARAM_DESCRIPTION_LEN beside it. It has its OWN knob rather
than sharing that one, and the DEFAULT IS 0: the describe reply's
derived buffer prices CAPACITY, not use, so sharing would have cost
every image 256 bytes per parameter for a field it never sets -- 2,048
bytes on the eight-parameter reference island, taking its reply past
the 4,096 fallback. State a number here to use the field. Longer text
is truncated at a character boundary and logged once per parameter,
naming this knob.
'''

[[knob]]
id = "MAX_PARAM_DESCRIPTION_LEN"
toml = "params.max_param_description_len"
type = "int"
prompt = "Parameter description capacity in bytes"
kconfig_attrs = [
    "default 256",
    "range 0 256",
]
help = '''
Longest DESCRIPTION a parameter's descriptor can hold
(nros-params build.rs). Paid once per store slot whatever the slot
holds, like the other per-slot limits.

phase-446 F2 -- a board fact, never derived: the contract states a
parameter's name and type, not its description. 0 is a real choice
meaning "no descriptions". A longer description is truncated at a
character boundary and logged once per parameter, naming this knob.
256 is the most an rcl_interfaces describe reply carries.
'''

[[knob]]
id = "MAX_PARAM_NAME_LEN"
toml = "params.max_param_name_len"
type = "int"
prompt = "Longest parameter name in bytes (-1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
Per-slot name capacity of the parameter store (nros-params build.rs).

-1 DERIVES it from the contract's `params:` -- the longest declared
name, and never shorter than `use_sim_time`. Without a declaration
the crate default of 64 stands.
'''

[[knob]]
