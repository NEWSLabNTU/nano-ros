# The knob registry: ONE row per build-time knob (RFC-0103 D2b, phase-484 W5a).
#
# Every other spelling of a knob is DERIVED from its row:
#   env      NROS_<id>; `legacy` names are accepted until phase-484 W8
#   Kconfig  CONFIG_<kconfig>, default CONFIG_NROS_<id>. A row names `kconfig`
#            only where today's symbol differs; no Kconfig symbol is renamed
#            (phase-481 owns them). The zenoh pools read the RMW-agnostic
#            DEMAND symbol, which is why the id is not the Kconfig stem.
#   TOML     `[knobs.<toml>]` — the `[board.knobs]` / platform key, where one exists
#
# Edit here, then run `python3 scripts/gen-knob-registry.py`; the generated
# Rust beside it is checked by `just check knob-registry`.

