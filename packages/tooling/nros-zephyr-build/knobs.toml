]
help = '''
History depth of each node's /parameter_events publisher (phase-491
W3, RFC-0105 D8), read by nros-params build.rs. Upstream's
parameter_events profile is KEEP_LAST(1000); a reliable DDS writer
reserves that history, so an RTOS image defaults to 1. Depth is not a
QoS matching criterion, so a subscriber with upstream's profile still
matches.
