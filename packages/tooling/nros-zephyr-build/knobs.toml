Each half of the one request/reply buffer pair an executor's
parameter services share (nros-node build.rs PARAM_SERVICE_BUFFER_SIZE).

phase-446 F3 -- -1 DERIVES it: when the contract's `params:` declare
every node's parameters, nros-node sizes the buffer for the largest
message those names and types can produce at the store's capacities
(CONFIG_NROS_MAX_STRING_VALUE_LEN, CONFIG_NROS_MAX_ARRAY_LEN,
CONFIG_NROS_MAX_BYTE_ARRAY_LEN, CONFIG_NROS_MAX_PARAM_DESCRIPTION_LEN).
Without a declaration the crate default of 4096 stands. Stating a
number here WINS; a request or reply past it is dropped and logged
once per service.
'''

[[knob]]
id = "PARAM_SERVICE_INBOX_BYTES"
type = "int"
prompt = "Parameter/lifecycle service inbox slot size (bytes, -1 = derive)"
kconfig_attrs = [
    "default -1",
]
help = '''
phase-461 W2 -- bytes one request slot holds in the inbox ring of each
ROS parameter service queryable (six per node) and each REP-2002
lifecycle service queryable (five per node).

-1 means DERIVE it, which is what almost every image wants: nros-node
and nros-rmw-zenoh then size the slot from the contract's declared
parameters, as the largest request a set_parameters over the
worst-declared node can produce, against the parameter store's
resolved capacities. On the Autoware Safety Island that is 1016 bytes
(a 1015-byte set_parameters, rounded to the slot alignment).

Any other value STATES the size and wins over the derivation. A stated
size smaller than the declarations can produce FAILS THE BUILD naming
this symbol, rather than dropping a well-formed request at run time
(issue 1352). 0 is not a size and is refused (issue 1485): it used to
be this symbol's derive sentinel, and the readers took it literally.
On XRCE the same number is XRCE_PARAM_REQUEST_BYTES, which raises
NROS_XRCE_SERVICE_REQUEST_BUFFER_SIZE to fit it (issue 1722).

Not under NROS_RMW_ZENOH, unlike PARAM_SERVICE_INBOX_DEPTH (whose ring
only a caller-inbox backend allocates): nros-node and the XRCE backend
read this size too, so an XRCE image must be able to state it. Under
the zenoh `if` it was undeclared there, while XRCE's own refusal told
the user to set it.
Maps to NROS_PARAM_SERVICE_INBOX_BYTES.
'''

[[knob]]
id = "PARAM_SERVICE_INBOX_DEPTH"
type = "int"
prompt = "Parameter/lifecycle service inbox ring depth"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default 1",
]
help = '''
phase-461 W2 -- requests one parameter or lifecycle service queryable
holds before the newest is dropped.

One, because this traffic is one request and one reply from a client
that waits: ros2 param and rclcpp's SyncParametersClient block on each
call, and a node's six services are polled serially in one spin. Two
clients hitting the SAME service of the SAME node inside one spin
period is the only case depth 1 loses, and the loser sees a timeout and
retries. Raise it to 2 for an image that serves a parameter dashboard.
Must be >= 1. Maps to NROS_PARAM_SERVICE_INBOX_DEPTH.
'''

[[knob]]
id = "PUBSUB_QOS_DEPTH"
type = "int"
prompt = "QoS history depth the arena budgets per subscription"
kconfig_attrs = [
    "default 10",
]
help = '''
How deep a history the executor arena reserves for each pub/sub
callback slot. 10 is ROS 2's own default -- `rmw_qos_profile_default`
is KEEP_LAST(10), which is what a subscription created with no QoS
argument actually gets -- so an image that says nothing here is sized
the way ROS would size it.

STATE 1 IF YOUR SUBSCRIPTIONS ARE KEEP_LAST(1), and the saving is large
rather than marginal. The buffer shape is a step function, not a slope:
depth 1 is a TripleBuffer of 3 slots and anything deeper is an SpscRing
of depth+1, so the default budgets 11 slots where 3 would do. Measured
on the reference island's entity shape (11 subscriptions, 4 timers, 2
service servers): 144,584 bytes of arena at 10, 53,504 at 1.

This is the IMAGE-WIDE number. A per-endpoint answer is derived instead
from `<stem>.contract.yaml`'s `qos.depth` when EVERY endpoint states one
(phase-412 W3); that is finer, needs no knob, and this value still wins
over it -- env > Kconfig/board > derived > default, the ladder every
derivable knob follows.

TOO SMALL IS NOT A SMALLER BUFFER. The arena is sized from this, and an
arena that does not fit halts during entity creation, before the first
spin -- so raise it, or state the depths, rather than trimming it to fit.
'''

[[knob]]
id = "RMW_LOCAL_QUERYABLE"
type = "int"
prompt = "Same-session query delivery (-1 = derive, 0 = off, 1 = on)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default -1",
    "range -1 1",
]
help = '''
Maps to Z_FEATURE_LOCAL_QUERYABLE, zenoh-pico's same-session query
path. Every node of a Zephyr image shares ONE zenoh session, and
neither zenoh-pico nor the router sends a query back to the session
it came from. So a service client and a service server in the SAME
image never meet without this: the call goes out, no server answers,
and nothing reports it (issue 1549; measured on the Autoware Safety
Island, whose handler's `operate` request never reached its own
operator).

`-1` DERIVES it from the image's entity inventory: on when the image
declares at least one service client (an action client counts, it
opens three) AND at least one service server (an action server
counts, three queryables), off otherwise. An image with only one
side of a service pays nothing for a path it cannot use. The sibling
for topics, Z_FEATURE_LOCAL_SUBSCRIBER, is always on.

Stating 0 or 1 WINS over the derivation, as for every derivable
knob. Where the inventory cannot answer (a component that declares
nothing), the knob keeps zenoh-pico's own default, 0, and the
configure says so.

The name is the RMW's, not zenoh's, because the boot record in
nros-node carries the resolved value and its rung, and a core crate
names no backend (RFC-0071). Only the zenoh backend consumes it.
'''

