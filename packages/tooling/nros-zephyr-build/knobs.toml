# The knob registry: ONE row per build-time knob (RFC-0103 D2b, phase-484 W5a).
#
# Every other spelling of a knob is DERIVED from its row:
#   env      NROS_<id>; `legacy` names are RETIRED (phase-484 W8): set, each
#            stops the build naming NROS_<id>. Kept for good as the error
#            table: an unlisted old name would be ignored, not refused.
#   Kconfig  CONFIG_<kconfig>, default CONFIG_NROS_<id>. A row names `kconfig`
#            only where today's symbol differs; no Kconfig symbol is renamed
#            (phase-481 owns them). The zenoh pools read the RMW-agnostic
#            DEMAND symbol, which is why the id is not the Kconfig stem.
#   TOML     `[knobs.<toml>]` — the board / platform key, where one exists
#
# Edit here, then run `python3 scripts/gen-knob-registry.py`; the generated
# Rust beside it is checked by `just check knob-registry`.

[[knob]]
id = "ACTION_INBOX_BYTES"
type = "int"
prompt = "Action inbox slot size (bytes, -1 = derive)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default -1",
]
help = '''
Bytes one request slot holds in the inbox ring of each action server
queryable (send_goal, cancel_goal, get_result).

-1 means DERIVE it (phase-461 W3), from this image's declared
`pkg/action/Name_SendGoal_Request` types -- the largest of the three
requests those queryables receive. A SEPARATE family from the service
one above, so neither inherits the other's worst case. Any other value
is yours and WINS; when nothing derives, the crate falls through to
the service family's resolved size. Maps to NROS_ACTION_INBOX_BYTES.
'''

[[knob]]
id = "ACTION_INBOX_DEPTH"
type = "int"
prompt = "Action inbox ring depth"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default 4",
]
help = '''
Requests one action server queryable holds before the newest is
dropped: the family depth 4 was designed for, and the twin of the C
shim's ZPICO_MAX_PENDING_REPLIES (both 4). Must be >= 1. Maps to
NROS_ACTION_INBOX_DEPTH.
'''

