[[knob]]
id = "ZENOH_READ_PRIORITY"
legacy = ["ZPICO_READ_TASK_PRIORITY"]
type = "int"
prompt = "zenoh-pico read task priority (normalised band, 0-255)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default 200",
]
help = '''
Scheduling priority of the zenoh-pico READ task, on the platform ABI's
normalised band: 0 = least urgent, NROS_PLATFORM_PRIORITY_MAX (255) =
most urgent (phase-364 W5). nros_zephyr_native_priority maps it onto
whatever sched_get_priority_min/max report for SCHED_RR in THIS image,
which depends on CONFIG_NUM_PREEMPT_PRIORITIES.

issue 0852 — THE SCALE CHANGED, AND THE OLD VALUES DO NOT CARRY OVER.
This was documented "normalized 0-31" with a default of 16, and mapped by
a second, private conversion (zpico_posix_set_priority) that wrote into a
pthread_attr_t nothing on this platform ever read. Two normalised bands
meeting in one scheduler is issue 0623 verbatim: a 16 authored against
0-31 is (16*14)/255 = 0 through the real map — the LEAST urgent slot,
which is exactly where every Zephyr transport task has been running.
The private scale and its conversion are deleted; this band is the only
one left.

Why 200: on a CONFIG_NUM_PREEMPT_PRIORITIES=15 image it maps to SCHED_RR
10, i.e. k_thread 4 — ABOVE the tier pool ([8,14] in
[board.priority_plan]) and below the main thread. That ordering is
CHOSEN, not inherited: it is what the board's priority plan already
declares, and what FreeRTOS ships (app 3 / transport 4). The reverse
starves the RX drain and stalls publishers on retransmission timeouts
(issue 0623). Both orderings are legitimate; choosing by accident is the
bug this issue was.

The number is IMAGE-DERIVED (issue 0766): re-resolve it against your
own .config rather than assuming k_thread 4.

Before issue 0626 this was not settable at all on Zephyr: the shim's
POSIX branch configured only the stack size, carrying a comment about
SCHED_FIFO needing root — true of Linux, meaningless on Zephyr — so the
transport tasks ran at whatever default applied and issue 0506's
question (what preempts the RT tiers under load?) could not be asked.

Raising it above your RT tiers means transport preempts control;
lowering it below means a busy tier can starve the RX drain, which
stalls publishers on retransmission timeouts. Both are real failure
modes with real cost — see issues 0506 and 0623 before changing it.
'''

[[knob]]
id = "ZENOH_RX_TASK_BUDGET_FRAMES"
toml = "zenoh.wire.rx_task_budget_frames"
type = "int"
prompt = "zenoh read task frame budget (-1 = derive, else unbounded)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default -1",
    "range -1 65535",
]
help = '''
RFC-0074 / phase-462 W6a. The most frames the zenoh-pico read task
processes back to back before it rests NROS_ZENOH_RX_TASK_BUDGET_REST_US.
Bounds the task's contiguous CPU occupancy at FRAMES x per-frame cost
(~0.94 ms a frame measured on FreeRTOS mps2-an385), so a flood cannot
stall the tiers below the transport band. It defers rather than drops:
unread bytes stay in the socket and TCP backpressures the sender.

-1 (and unset) states nothing: the budget derived from the contract's
declared subscriber ingress applies (phase-462 W6b: FRAMES = burst of
the subscriber with the largest rate_hz x burst), and with no ingress
declared the read task is unbounded, as before.
0 is REFUSED -- a budget of zero frames is not "unlimited". Too large a
budget is worse than none on stall COUNT (128 frames: 12.5 stalls/run
against 9.1 unbounded), so size it so FRAMES x cost fits the tightest
tier's slack. Maps to Z_RX_TASK_BUDGET_FRAMES.
'''

[[knob]]
id = "ZENOH_RX_TASK_BUDGET_REST_US"
toml = "zenoh.wire.rx_task_budget_rest_us"
type = "int"
prompt = "zenoh read task rest after a full budget (us, -1 = derive)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default -1",
    "range -1 1000000",
]
help = '''
RFC-0074 / phase-462 W6a. How long the zenoh-pico read task rests after
NROS_ZENOH_RX_TASK_BUDGET_FRAMES frames. Read only when the frame budget
is in force. RFC-0074's measured cells use 1000.

On zenoh-pico 1.10 the read task is an executor future, so it yields for
the rest instead of sleeping, rounded up to whole milliseconds and never
less than 2 ms: the executor does not wait for a wake-up 1 ms or less
away (RFC-0110 D6).

-1 (phase-462 W6b) states nothing: the value derived from the contract's
declared subscriber ingress applies (burst x 10^6 / rate_hz of the
subscriber with the largest rate_hz x burst), else the builtin 1000.
Maps to Z_RX_TASK_BUDGET_REST_US.
'''

