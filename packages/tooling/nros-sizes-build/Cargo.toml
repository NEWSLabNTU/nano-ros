[package]
name = "nros-sizes-build"
version.workspace = true
edition = "2024"
description = "Build-script helper that extracts Rust-side type sizes from a compiled rlib for C/C++ FFI header generation"
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false

# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "host build-script that probes runtime type sizes"

[dependencies]
object = { version = "0.39", default-features = false, features = ["read", "archive", "elf", "macho", "coff", "std"] }
serde_json = "1"
# phase-336 — the profile the nested size probe compiles at must match the
# outer build's; the mapping lives in the shared table, not here.
nros-cargo-profile = { path = "../nros-cargo-profile" }
# phase-343 I1 — `try_repo_root` for the SHARED probe dir default. One
# spelling of "where is the repo"; do not re-implement the walk here.
nros-build-paths = { path = "../nros-build-paths" }

[lints]
workspace = true
