[package]
name = "nros-rmw-cffi"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C function table adapter for nros RMW backends"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "rmw", "ffi", "embedded"]
categories = ["embedded", "no-std", "api-bindings"]

[lib]
name = "nros_rmw_cffi"

[dependencies]
# issue 0589 — the diagnostic sink, and the reason there is no `std::eprintln!`
# left in this crate. Rust std stdio is FATAL on Zephyr `native_sim`:
# `zvfs_write(1, …)` dispatches to `stdinout_write_vmeth`, which calls
# `zvfs_write(1, …)` again, and `k_mutex` is recursive, so a diagnostic
# exhausts the stack and SIGSEGVs the image it was diagnosing. A `no_std` crate
# cannot gate on the platform (no `platform-*` feature — ARCHITECTURE §2), so
# the sink has to be the one that already knows where it is. Costs nothing in a
# real image: `nros-node` deps `nros-log` non-optionally, so anything that links
# an RMW backend already has it.
nros-log = { workspace = true }
nros-rmw = { workspace = true, default-features = false }
portable-atomic = { version = "1", default-features = false }

[build-dependencies]
# issue 0460 — the sizing knobs must resolve from `$DOTCONFIG`, not from
# an env a Zephyr Rust image never receives. Same helper `nros-node` and
# `nros-params` use; gated by `check-kconfig-knob-forwarding`.
nros-zephyr-build = { path = "../../tooling/nros-zephyr-build" }
# Phase 115.G.4 — compiles the second-language smoke-test stubs in
# `tests/c_stubs/*.c` into a small static lib that the integration
# tests link against. Only used during `cargo build`/`cargo test`;
# the compiled stub is gated behind the `c-stub-test` feature so a
# default `cargo build` of consumers doesn't need a C toolchain.
cc = "1"
# issue 0383 — strict C diagnostics (implicit-function-declaration,
# int-conversion) as ERRORS at every `cc::Build` below. One shared spelling.
nros-cc-flags = { path = "../../tooling/nros-cc-flags" }

[features]
default = []
# phase-361 W2 (revised) — `std` does NOT imply `alloc`. On embedded, both are
# opted into EXPLICITLY, per package, by the end user; a dep that needs the heap
# must make the user say `alloc`, never turn it on behind their back.
# phase-359 W10 (backend tier) — this used to forward `nros-rmw/std`, which made
# THIS crate the reason `nros-core/std` was on in every native graph: a leaf
# that asked for `alloc` still got the std flavour of the core because a
# backend it linked asked for it. `Clock::system()` was the one thing that
# depended on it, and it now reaches the platform's wall clock instead
# (`nros-core/platform-clock`), so the forward has nothing left to carry.
std = ["alloc"]
alloc = ["nros-rmw/alloc", "nros-rmw/platform-clock"]
safety-e2e = ["nros-rmw/safety-e2e"]
# Phase 124.A — enables `CffiPublisher: SlotLending` +
# `CffiSubscriber: SlotBorrowing`. The vtable carries the slots either
# way; this feature gates the Rust trait impls so the trait surface
# stays gated behind `nros-rmw/lending` for the umbrella too. Becomes
# unconditional once Phase 124.A.4 lands and the umbrella drops the
# feature on its own surface.
lending = ["nros-rmw/lending"]
# Phase 115.G.4 — opt-in compile of `tests/c_stubs/c_stub_transport.c`.
# Off by default so consumers that vendor `nros-rmw-cffi` don't need a
# C toolchain on the build host. `cargo test --features c-stub-test`
# turns it on for the integration test.
c-stub-test = []

[lints]
workspace = true
