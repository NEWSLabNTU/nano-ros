[package]
name = "cyclonedds-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Phase 212.K.1 — build-only sys crate that vendors Cyclone DDS from third-party/dds/cyclonedds via the `cmake` build-script crate. Exposes libddsc + idlc to downstream crates via DEP_DDSC_* metadata."
publish = false
links = "ddsc"
build = "build.rs"

# Build-only — no Rust API surface. Downstream crates pick up
# `libddsc.a`, the include dir, and the host `idlc` binary via the
# `cargo:include` / `cargo:idlc` metadata keys emitted by build.rs
# (Cargo turns those into `DEP_DDSC_INCLUDE` / `DEP_DDSC_IDLC` env
# vars in downstream `build.rs` runs).
# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "bindgen + C build of CycloneDDS; needs a host toolchain"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []

[build-dependencies]
cmake = "0.1"
nros-build-paths = { path = "../../../tooling/nros-build-paths" }

[lints]
workspace = true
