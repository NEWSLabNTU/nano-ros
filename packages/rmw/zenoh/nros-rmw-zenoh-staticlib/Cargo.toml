[package]
name = "nros-rmw-zenoh-staticlib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone staticlib wrapper for nros-rmw-zenoh — emits libnros_rmw_zenoh_staticlib.a (Phase 123.A.1.x.4)"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false

# Phase 123.A.1.x.4.a — emit `libnros_rmw_zenoh_staticlib.a` containing
# the full `nros-rmw-zenoh` Rust dependency closure + zenoh-pico C
# sources + compiler_builtins. Lets the SDK ship the zenoh RMW
# backend as a separate archive that `NanoRos::NanoRos` links in
# alongside `libnros_c.a`, mirroring the existing
# `libnros_rmw_xrce.a` / `libnros_rmw_cyclonedds.a` split.
#
# A separate staticlib means a second copy of compiler_builtins is
# embedded. Downstream link uses `--allow-multiple-definition` (GNU
# ld / lld) to reconcile.
[lib]
crate-type = ["staticlib"]

[features]
default = []
# phase-361 W2.a / W4 — `std` implies `alloc`, one line, like every other crate
# that declares both. Missed by W2.a's hand-sweep (twelve crates found, this one
# not) and caught by `check-feature-contract` on its first run, which is the
# argument for the gate: a hand-sweep's coverage is unverifiable.
std = ["alloc", "nros-rmw-zenoh/std"]
platform-posix = ["nros-rmw-zenoh/platform-posix"]
platform-zephyr = ["nros-rmw-zenoh/platform-zephyr"]
# phase-337 W2.b — bare-metal Zephyr (i.e. any real board) needs exactly what
# `platform-freertos` / `platform-nuttx` / `platform-threadx` below already
# declare: a global allocator and a panic handler. `platform-zephyr` alone
# carries neither, and nothing noticed, because the only Zephyr target this
# repo has ever built is `native_sim/native/64` — where `zephyr/CMakeLists.txt`
# appends `,std` and the HOST's std supplies both lang items. Point the same
# feature set at mps2_an385 and the staticlib does not compile:
#
#   error: no global memory allocator found but one is required; link to std
#          or add `#[global_allocator]` to a static item ...
#   error: `#[panic_handler]` function required, but not found
#
# A SEPARATE feature rather than folding the deps into `platform-zephyr`:
# `panic-halt` on the std path would collide with std's own panic handler, so
# phase-361 W8.d / issue 0594 — these rows select the malloc/panic PROVIDER
# (`nros-platform/global-allocator`, `panic-halt`) for the platform and nothing
# else. They no longer list `alloc`/`std`: the heap and the standard library are
# the end user's call, named at their own dep-site.
# the two Zephyr flavours cannot share one spelling — the same reason
# `platform-threadx` and `platform-threadx-std` are two features.
platform-zephyr-baremetal = [
    "nros-rmw-zenoh/platform-zephyr",
    "dep:nros-platform",
    "nros-platform/platform-zephyr",
    "nros-platform/global-allocator",
    "dep:panic-halt",
]
alloc = ["nros-rmw-zenoh/alloc"]
platform-freertos = [
    "nros-rmw-zenoh/platform-freertos",
    "dep:nros-platform",
    "nros-platform/platform-freertos",
    "nros-platform/global-allocator",
    "dep:panic-halt",
]
platform-nuttx = [
    "nros-rmw-zenoh/platform-nuttx",
    "dep:nros-platform",
    "nros-platform/platform-nuttx",
    "nros-platform/global-allocator",
    "dep:panic-halt",
]
platform-threadx = [
    "nros-rmw-zenoh/platform-threadx",
    "dep:nros-platform",
    "nros-platform/platform-threadx",
    "nros-platform/global-allocator",
    "dep:panic-halt",
]
platform-threadx-std = [
    "nros-rmw-zenoh/platform-threadx",
    "dep:nros-platform",
    "nros-platform/platform-threadx",
    "nros-platform/global-allocator",
]
platform-bare-metal = ["nros-rmw-zenoh/platform-bare-metal"]
# Phase 128.E.1 — `link-tcp` / `link-udp-unicast` deleted on
# `nros-rmw-zenoh` (always-on in vendor build). Forwards
# stripped here too.
link-tls = ["nros-rmw-zenoh/link-tls"]
link-custom = ["nros-rmw-zenoh/link-custom"]
ros-humble = ["nros-rmw-zenoh/ros-humble"]
ros-iron = ["nros-rmw-zenoh/ros-iron"]
ros-jazzy = ["nros-rmw-zenoh/ros-jazzy"]

# issue 0287 — HOST-ONLY. `just check workspace-embedded` builds the whole
# workspace for a thumb target, and cargo unifies features across ALL members
# regardless of what firmware can reach. A host-only member therefore turns
# `std` on for everything and the lane dies in an unrelated crate
# (`can't find crate for \`std\`` in nros-serdes). Declared here rather than
# hand-listed in the justfile so the reason lives with the crate and the
# exclude list is derived — see scripts/build/host-only-members.sh.
[package.metadata.nros]
host-only = true
host-only-reason = "staticlib wrapper, built per-platform by cmake"

[dependencies]
nros-rmw-zenoh = { workspace = true, default-features = false }
nros-platform = { workspace = true, default-features = false, optional = true }
panic-halt = { workspace = true, optional = true }

[lints]
workspace = true
