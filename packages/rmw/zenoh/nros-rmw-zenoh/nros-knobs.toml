# phase-581 W2). Found beside its descriptor (nros-rmw.toml) by the scan that finds
# the package, so this file's presence is the declaration. The schema is core's
# (packages/tooling/nros-zephyr-build/knobs.toml says what each field means);
# every key starts with this file's owner word, `zenoh`, which is derived
# from the package (its RMW name)
# and checked, never chosen. Edit, then run `python3 scripts/gen-knob-registry.py`.

