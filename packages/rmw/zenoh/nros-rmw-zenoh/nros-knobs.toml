prompt = "Receive ring depth per subscriber"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "default 4",
]
help = '''
Samples held per subscriber before the ring drops the oldest. This is
the receive queue depth, so lowering it is a QoS reduction, not slack.
It multiplies BOTH zenoh payload classes:
  SMALL_PAYLOADS = ZPICO_MAX_SUBSCRIBERS x DEPTH x SUBSCRIBER_BUFFER_SIZE
  LARGE_PAYLOADS = MAX_LARGE_SUBSCRIBERS x DEPTH x SUBSCRIBER_LARGE_SIZE
Maps to ZPICO_SUBSCRIBER_RING_DEPTH.
'''

[[knob]]
key = "zenoh.tl_retain_bytes"
scope = "image"
class = "public"
retired = [{ spelling = "env:ZPICO_TL_RETAIN_BYTES" }]

[[knob]]
key = "zenoh.tl_retain_depth"
scope = "image"
class = "public"
retired = [{ spelling = "env:ZPICO_TL_RETAIN_DEPTH" }]

[[knob]]
key = "zenoh.tx_batch"
scope = "image"
class = "public"
retired = [
    { spelling = "env:ZPICO_TX_BATCH" },
    { spelling = "toml:zenoh.tx.batch" },
]
ladder = true
type = "bool"
prompt = "zenoh-pico tx batching (one send per executor spin)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "# DERIVED from nros-platform-zephyr [knobs.zenoh] tx_batch —",
    "# re-render with `scripts/check-zephyr-knob-agreement.py --write`.",
    "default y",
]
help = '''
Tx batching (ZPICO_TX_BATCH). Publishes queue in the transport write
buffer and ship as ONE socket send per executor spin (zpico_spin_once
flush), so total tx throughput scales with messages-per-flush instead of
being capped at ~1 send per socket recv window (the zsock per-fd-mutex
ceiling above). Adds up to FLUSH_MS of publish latency; service/query
requests and replies bypass the batch (express), as do publishers
declared express (tx_express QoS). DEFAULT ON for Zephyr, the only
platform with the per-fd tx ceiling, where it measured 15-20x streaming.
Requires the zenoh-pico fork's fix that makes declarations bypass the
batch (otherwise a server's readiness banner outruns its still-batched
queryable declares and immediately-fired queries miss). This default
MUST mirror config/zephyr/nros-platform.toml [knobs.zenoh] tx_* — the
kconfig_platform_default_drift test asserts the mirror.
'''

[[knob]]
key = "zenoh.tx_batch_flush_ms"
scope = "image"
class = "public"
retired = [
    { spelling = "env:ZPICO_TX_BATCH_FLUSH_MS" },
    { spelling = "toml:zenoh.tx.flush_ms" },
]
ladder = true
type = "int"
prompt = "zenoh-pico tx batch flush cadence (ms)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "# DERIVED from nros-platform-zephyr [knobs.zenoh] tx_batch_flush_ms —",
    "# re-render with `scripts/check-zephyr-knob-agreement.py --write`.",
    "default 50",
    "depends on NROS_ZENOH_TX_BATCH",
]
help = '''
Period of the dedicated tx-flush thread (and the
rate limit of the spin-driven fallback flush) when TX_BATCH is on.
Bounds the extra publish latency batching adds: a batched sample waits
at most this long before it ships (express publishers bypass the batch
entirely). Lower = less added latency, more (smaller) socket sends.
Forwards to zpico.c's ZPICO_TX_BATCH_FLUSH_MS.
'''

[[knob]]
key = "zenoh.tx_split_lock"
scope = "image"
class = "public"
retired = [
    { spelling = "env:ZPICO_TX_SPLIT_LOCK" },
    { spelling = "toml:zenoh.tx.split_lock" },
]
ladder = true
type = "bool"
prompt = "zenoh-pico split tx locking (append while sending)"
kconfig_if = "NROS_RMW_ZENOH"
kconfig_attrs = [
    "# DERIVED from nros-platform-zephyr [knobs.zenoh] tx_split_lock —",
    "# re-render with `scripts/check-zephyr-knob-agreement.py --write`.",
    "default y",
    "depends on NROS_ZENOH_TX_BATCH",
]
help = '''
The batch flush steals the pending write buffer under the tx mutex and
performs the socket write under a separate link-write mutex, so
publishers keep appending to the fresh batch while the (up to one
recv-window) send is in flight. Wire order still equals SN order.
Requires TX_BATCH. Costs a second wbuf (Z_BATCH_UNICAST_SIZE) of RAM per
session. DEFAULT ON for Zephyr; mirrors config/zephyr/nros-platform.toml
(drift-tested).
'''

[[env]]
name = "ZENOH_CONFIG_OVERRIDE"
foreign = "zenoh"
disposition = "respect"
stated = "rmw_config"
parse = "str"
retired = [
    { spelling = "run:ZENOH_LISTEN", instead = "ZENOH_CONFIG_OVERRIDE='listen/endpoints=[...]'" },
    { spelling = "run:ZENOH_MULTICAST_SCOUTING", instead = "ZENOH_CONFIG_OVERRIDE='scouting/multicast/enabled=...'" },
    { spelling = "run:ZENOH_SCOUTING_TIMEOUT", instead = "ZENOH_CONFIG_OVERRIDE='scouting/timeout=...'" },
    { spelling = "run:ZENOH_TLS_ROOT_CA_CERTIFICATE", instead = "ZENOH_CONFIG_OVERRIDE='transport/link/tls/root_ca_certificate=...'" },
    { spelling = "run:ZENOH_TLS_ROOT_CA_CERTIFICATE_BASE64", instead = "ZENOH_CONFIG_OVERRIDE='transport/link/tls/root_ca_certificate_base64=...'" },
    { spelling = "run:ZENOH_TLS_VERIFY_NAME_ON_CONNECT", instead = "ZENOH_CONFIG_OVERRIDE='transport/link/tls/verify_name_on_connect=...'" },
]
help = "Key overrides of the zenoh session config, lowered by the same reader as the session file. The six ZENOH_* variables nano-ros invented are retired in its favour; a later release refuses them, and until then they are still read."

[[env]]
name = "ZENOH_ROUTER_CONFIG_URI"
foreign = "zenoh"
disposition = "ignore"
help = "A router variable; nano-ros ships no router."

[[env]]
name = "ZENOH_SESSION_CONFIG_URI"
foreign = "zenoh"
disposition = "respect"
stated = "rmw_config"
parse = "str"
help = "Replaces the baked session table whole."
