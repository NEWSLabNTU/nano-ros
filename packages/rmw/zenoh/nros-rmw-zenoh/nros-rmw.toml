# nano-ros RMW backend descriptor — RFC-0071 D1/D7, phase-347 W2.
#
# The backend declares itself here; the toolchain lowers it. Nothing in
# `packages/core/**` or `packages/api/**` may name this backend (RFC-0071).
#
# W2 is INERT: `nros_rmw_dispatch()` and `resolve_rmw()` remain the live path,
# and `check-rmw-descriptors` asserts this file agrees with them row for row.
# W3 inverts that — the descriptor becomes the source and the closed lists go.
[rmw]
# phase-420 W5 / RFC-0087 D4 — this table used to open with five more lines:
#
#   names = [...]            the `<nano_ros_provides>` announcements, restated
#   cargo_feature = "..."    `<kind>-<name>`
#   cmake_value = "..."      the canonical name
#   c_define_token = "..."   `UPPER(name)`
#   cffi_feature = "..."     `<cargo_feature>-cffi`
#
# All five are DERIVED now (`cargo-nano-ros/src/derived_descriptor.rs`, shared
# by `build.rs` and the library). The names come from `package.xml`, which is
# the only place a provider should spell them; the other four are convention.
# `check-derived-descriptor-fields` refuses a restatement that disagrees, and
# `build.rs` panics on one too.

# The C++ define `nros-cpp` puts on its INTERFACE for this backend. Spellings
# are INCONSISTENT across backends by history (`_CFFI` on two, bare on two) and
# are preserved exactly — consumers `#if` on them.
cpp_define = "NROS_RMW_ZENOH_CFFI"

# How this backend reaches a consumer's link. Pure Rust: an rlib bundled into
# the C/C++ umbrella, nothing extra on the link line.
[rmw.provides.cargo]
crate = "nros-rmw-zenoh"

[rmw.link]
# Naming an rlib IS the statement that this backend arrives INSIDE the C/C++
# umbrella staticlib and nothing separate reaches the link line — phase-439 W4
# reads it as `strategy = "umbrella"` (RFC-0094 D5), which is what retired the
# root `CMakeLists.txt`'s `if(NANO_ROS_RMW STREQUAL "zenoh" OR ... "xrce")` arm.
rlib_dep = "nros-rmw-zenoh"
# The `nros-c` feature that bundles it. AUTHORED, like `cpp_define`: `nros-c`
# spells this `cffi-zenoh-cffi` and xrce's `cffi-xrce-c`, which no convention
# produces. The `nros-cpp` half IS regular and is derived (`rmw-zenoh-cffi`).
c_cffi_feature = "cffi-zenoh-cffi"
needs_cxx_linker = false
# `extra_link_libs` was DELETED in phase-439 W4 (issue 1216). It was read by
# NOTHING, and its cyclonedds value named the archives whose only correct use is
# NOT to be passed to `target_link_libraries` — doing so is what issue 0475
# records as breaking the link with `undefined reference to ddsrt_*`.

# Optional capabilities a user may select (RFC-0071 D6). The KEY is the
# capability; the VALUE is this backend's own feature. Core never learns the
# right-hand side.
[rmw.capabilities]
zero-copy-receive = "unstable-zenoh-api"   # -> zpico-sys -> Z_FEATURE_UNSTABLE_API
# phase-347 W4 — the `safety` axis (E2E CRC attach/validate). This used to be
# recorded CENTRALLY as `backends_supporting: &["zenoh"]` in the capability
# registry; the backend declares it here instead, so a third-party backend can
# offer `safety` without an edit to core.
safety = "safety-e2e"
