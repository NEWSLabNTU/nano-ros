[package]
name = "nros-rmw-zenoh"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zenoh-pico RMW backend for nros"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "zenoh", "rmw", "embedded", "no-std"]
categories = ["embedded", "no-std", "network-programming"]

[features]
# issue 0270 — `platform-aliases` + `link-ip` were `zpico-sys`'s OWN defaults,
# reaching every consumer transitively (the `zpico-sys` dep below is now
# `default-features = false`), so a platform whose vendor `system.c` defines the
# `z_*` clock symbols natively could NOT drop them — cargo unification cannot
# subtract. They are nros-rmw-zenoh features instead, supplied BOTH here in
# `default` (the test / native path, which keeps default features on) AND from
# each `platform-*` below. A platform that must omit the alias TU simply does
# not forward them. (phase-337 W7.b: `platform-orin-spe`, the case this shape
# was built for, left with `nros-board-orin-spe`; the shape stays because the
# next vendor `system.c` will need it.)
default = ["platform-aliases", "link-ip"]
# The `zpico-sys` C alias TU (`platform_aliases.c`) forwarding every `_z_*`
# zenoh-pico symbol to the canonical `nros_platform_*` ABI, and the IP link
# (`Z_FEATURE_LINK_{TCP,UDP_*}`). Kept as explicit features so a native-`system.c`
# platform can omit both.
platform-aliases = ["zpico-sys/platform-aliases"]
link-ip = ["zpico-sys/link-ip"]
# issue 0283 — opt OUT of ROS 2 liveliness declarations (node + entity
# tokens). Data still flows; the session simply stays invisible to
# `ros2 node list` / `topic list`. For peer-to-peer fixtures that want the
# wire quiet; hardware images should leave liveliness ON.
no-liveliness = []
# Phase 129.C.3.a — `nros-platform/platform-<rtos>` forwards
# dropped. Phase 129.D retired `zpico-platform-shim`, which was
# the only consumer that needed `ConcretePlatform`. The two
# `now_ms()` callsites in `shim/{publisher,subscriber}.rs` now
# call the canonical `nros_platform_time_now_ns` C symbol
# directly; no Rust trait dispatch, no platform pin.
#
# Phase 214.G — forwards RESTORED for the canonical symbol-provider
# crate (`nros-platform/platform-<rtos>`). The retirement above only
# applied to `ConcretePlatform`; the alias TU compiled inside
# `zpico-sys` (`c/zpico/platform_aliases.c`, default-on via
# `zpico-sys/platform-aliases`) forwards every `_z_*` zenoh-pico
# symbol to the canonical `nros_platform_*` ABI, which means
# selecting `nros-rmw-zenoh/platform-posix` MUST also bring the C
# provider on the link line. Without the forward, the workspace test
# build links zpico-sys + the alias TU but no `nros_platform_*`
# definitions, surfacing as a wall of `undefined symbol:
# nros_platform_mutex_*` from rust-lld. See Track G in
# `docs/roadmap/phase-214-antipattern-audit-findings.md`.
platform-posix = [
    "zpico-sys/posix",
    "zpico-sys/platform-aliases",
    "zpico-sys/link-ip",
    "nros-platform/platform-posix",
]
# Embedded targets keep `nros-platform/platform-<rtos>` opt-in —
# their providers live in C ports linked at the consumer's
# board / west / ninja site (Zephyr module, NuttX build system,
# FreeRTOS / ThreadX board build.rs), not in `nros-platform-cffi`.
platform-zephyr = ["zpico-sys/zephyr", "zpico-sys/platform-aliases", "zpico-sys/link-ip"]
platform-bare-metal = ["zpico-sys/bare-metal", "zpico-sys/platform-aliases", "zpico-sys/link-ip"]
platform-freertos = ["zpico-sys/freertos", "zpico-sys/platform-aliases", "zpico-sys/link-ip"]
platform-nuttx = ["zpico-sys/nuttx", "zpico-sys/platform-aliases", "zpico-sys/link-ip"]
platform-threadx = ["zpico-sys/threadx", "zpico-sys/platform-aliases", "zpico-sys/link-ip"]
# Phase 128.E.1 — `link-tcp` / `link-udp-unicast` deleted (were
# no-op aliases pointing at `zpico-sys`'s always-on TCP / UDP
# compile). Consumers that still flipped them just stop. Real
# `link-*` features (`link-tls`, `link-custom`) keep their
# build-host gates.
link-tls = ["zpico-sys/link-tls"]
# Phase 115.B — runtime-pluggable user transport. Enables the
# `custom://` locator scheme; users register a `NrosTransportOps`
# vtable via `nros_rmw::set_custom_transport(...)` BEFORE opening
# the session.
link-custom = ["zpico-sys/link-custom"]
# RFC-0083 — CAN unicast over ISO-TP. Off by default: it needs a CAN interface
# and the `can-isotp` kernel module, neither of which a generic build can assume.
link-isotp = ["zpico-sys/link-isotp"]
# phase-359 W10 (backend tier) — this used to forward `nros-rmw/std`, which made
# THIS crate the reason `nros-core/std` was on in every native graph: a leaf
# that asked for `alloc` still got the std flavour of the core because a
# backend it linked asked for it. `Clock::system()` was the one thing that
# depended on it, and it now reaches the platform's wall clock instead
# (`nros-core/platform-clock`), so the forward has nothing left to carry.
std = ["alloc", "zpico-sys/std", "log"]
alloc = ["nros-rmw/alloc"]
rtic = []
polling = []
sync-spin = ["nros-rmw/sync-spin"]
sync-critical-section = ["nros-rmw/sync-critical-section"]
ffi-sync = ["dep:critical-section"]
log = ["dep:log"]

# E2E safety protocol (CRC-32 + sequence tracking)
safety-e2e = ["nros-rmw/safety-e2e", "nros-rmw-cffi/safety-e2e"]

# Zero-copy receive via z_bytes_get_contiguous_view (unstable zenoh-pico API)
unstable-zenoh-api = ["zpico-sys/unstable-zenoh-api"]

# Phase 99.F — native slot lending for zero-copy publish.
# ZenohPublisher impls SlotLending; uses zpico_publish_with_attachment_aliased
# which calls z_bytes_from_static_buf (stable zenoh-pico API) instead of
# z_bytes_copy_from_buf, eliminating the user→backend memcpy. Attachment
# is still copied (small, fixed size). Forwards to nros-rmw/lending.
lending = ["nros-rmw/lending"]

# ROS edition (controls data keyexpr type hash format)
ros-humble = []
ros-iron = []
ros-jazzy = []

[dependencies]
# issue 0589 — the diagnostic sink, and the reason there is no `std::eprintln!`
# left in this crate. Rust std stdio is FATAL on Zephyr `native_sim`:
# `zvfs_write(1, …)` dispatches to `stdinout_write_vmeth`, which calls
# `zvfs_write(1, …)` again, and `k_mutex` is recursive, so a diagnostic
# exhausts the stack and SIGSEGVs the image it was diagnosing. A `no_std` crate
# cannot gate on the platform (no `platform-*` feature — ARCHITECTURE §2), so
# the sink has to be the one that already knows where it is. Costs nothing in a
# real image: `nros-node` deps `nros-log` non-optionally, so anything that links
# an RMW backend already has it.
nros-log = { workspace = true }
nros-rmw = { version = "0.5.0", path = "../../../core/nros-rmw", default-features = false }
# Phase 115.M.3 — vtable register entry (previously shipped from
# the retired `nros-rmw-zenoh-cffi` shim) now lives in this crate.
# `RustBackendAdapter` requires `nros-rmw-cffi`'s `alloc` feature
# unconditionally (it boxes every entity handle).
nros-rmw-cffi = { version = "0.5.0", path = "../../cffi", default-features = false, features = ["alloc"] }
nros-core = { workspace = true, default-features = false }
# Phase 108.C.zenoh.{2,3} — needs `<P as PlatformClock>::clock_ms()`
# for deadline / lifespan emulation. The façade crate gates the
# ConcretePlatform pick on the same feature flags as the rest of
# nros, so adding it here doesn't constrain platform selection.
nros-platform = { version = "0.5.0", path = "../../../platform/nros-platform", default-features = false }
# issue 0270 — `default-features = false` so `platform-aliases` + `link-ip` are
# NOT forced transitively; they arrive via nros-rmw-zenoh's `default` / its
# `platform-*` features instead, so a platform whose vendor `system.c` provides
# `z_*` natively can drop the alias TU (no double-define).
zpico-sys = { version = "0.5.0", path = "../zpico-sys", default-features = false }
heapless = { workspace = true }
portable-atomic = { version = "1", default-features = false }
atomic-waker = { version = "1.1", default-features = false, features = ["portable-atomic"] }
log = { workspace = true, optional = true }
critical-section = { version = "1.2", optional = true }

[build-dependencies]
# issue 0460 — `ZPICO_{SUBSCRIBER,SERVICE}_BUFFER_SIZE` are Kconfig knobs on
# Zephyr, and the Rust lane never sees the cmake `set(ENV{...})` exports. One
# spelling of the `$DOTCONFIG` fallback, shared with `nros-zpico-build`.
nros-zephyr-build = { path = "../../../tooling/nros-zephyr-build" }

[dev-dependencies]
nros-tests = { path = "../../../testing/nros-tests" }
nros-ghost-types = { version = "0.5.0", path = "../../../verification/nros-ghost-types" }
# Force `ConcretePlatform` resolution for tests under `platform-posix`.
# Workspace-context builds get this via feature unification from a board
# crate; standalone `cargo test` here doesn't.
nros-platform = { version = "0.5.0", path = "../../../platform/nros-platform", default-features = false, features = ["platform-posix", "std"] }
# Phase 227.3(B) — the Rust shim is now platform-agnostic and the
# `--lib` unit-test binary references the zpico C-port symbols
# unconditionally. Pin the posix C port (threading / mutex / task
# symbols) for the standalone `cargo test` link, so a plain
# `cargo test -p nros-rmw-zenoh` (no `--features platform-posix`)
# links and runs the full unit suite. Workspace-context builds get
# this via feature unification from a board crate.
zpico-sys = { version = "0.5.0", path = "../zpico-sys", features = ["posix"] }

[lints]
workspace = true
