[package]
name = "nros-bridge"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-RMW bridge primitives for nano-ros (Phase 128.F)"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["ros2", "rmw", "bridge", "embedded", "no-std"]
categories = ["embedded", "no-std", "network-programming"]

[features]
default = []
# phase-361 W2 (revised) — `std` does NOT imply `alloc`. On embedded, both are
# opted into EXPLICITLY, per package, by the end user; a dep that needs the heap
# must make the user say `alloc`, never turn it on behind their back.
# phase-359 W10 (backend tier) — this used to forward `nros-node/std`, which made
# THIS crate the reason `nros-core/std` was on in every native graph: a leaf
# that asked for `alloc` still got the std flavour of the core because a
# backend it linked asked for it. `Clock::system()` was the one thing that
# depended on it, and it now reaches the platform's wall clock instead
# (`nros-core/platform-clock`), so the forward has nothing left to carry.
std = ["alloc"]
alloc = ["nros-node/alloc"]
# Phase 128.G — TOML-driven entrypoint. Reads `nros.toml` and builds
# an Executor + Nodes + bridges from the manifest. Pulls `toml` +
# `serde`; requires `std` because both crates do.
config = ["dep:toml", "dep:serde", "dep:nros-rmw"]
# Phase 128.F.5 — C/C++ bridge ABI. Emits `nros_init_multi`,
# `nros_pubsub_bridge_*` symbols matching `<nros/bridge.h>`. Requires
# `alloc` (every entity handle is boxed).
cffi = ["dep:nros-rmw-cffi"]

[dependencies]
# issue 0589 — the diagnostic sink, and the reason there is no `std::eprintln!`
# left in this crate. Rust std stdio is FATAL on Zephyr `native_sim`:
# `zvfs_write(1, …)` dispatches to `stdinout_write_vmeth`, which calls
# `zvfs_write(1, …)` again, and `k_mutex` is recursive, so a diagnostic
# exhausts the stack and SIGSEGVs the image it was diagnosing. A `no_std` crate
# cannot gate on the platform (no `platform-*` feature — ARCHITECTURE §2), so
# the sink has to be the one that already knows where it is. Costs nothing in a
# real image: `nros-node` deps `nros-log` non-optionally, so anything that links
# an RMW backend already has it.
nros-log = { workspace = true }
nros-node = { workspace = true, default-features = false, features = ["rmw-cffi"] }
nros-rmw-cffi = { workspace = true, optional = true }
# config-only — runtime Cyclone descriptor staging (phase-267 W-B1): the
# data-driven bridge stages a `dds_topic_descriptor_t` from the field schema
# carried in `nros-bridge.toml` via `nros_rmw::register_type_descriptor`.
nros-rmw = { workspace = true, default-features = false, optional = true }
# RFC-0088 / phase-421 W3 — NOT optional. `SerializationFormatId` is in the
# signature of `PubSubBridge::new`'s error, so it is part of the crate's
# unconditional public API, not a config-only detail. `default-features = false`
# keeps it `no_std`.
nros-serdes = { workspace = true, default-features = false }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true
