# qemu_cortex_m3 — board overlay (issue #531 verification lane).
#
# The board has no entropy device, but the networking stack calls
# `sys_rand_get()` (TCP ISN, ICMP ids), so a link against it fails with
# `undefined reference to z_impl_sys_rand_get`. Zephyr's answer for a board
# in that position is the explicitly-not-random generator, gated behind
# TEST_RANDOM_GENERATOR so that enabling it is a statement rather than an
# accident.
#
# NOT suitable for anything needing unpredictability. This board is an
# emulator target for timing and protocol work — which is exactly what it
# is used for here: confirming that periodic callbacks fire on a Cortex-M
# board below 60 MHz, where `k_cycle_get_64()` is unavailable (#531).
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
