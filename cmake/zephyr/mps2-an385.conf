# phase-337 W2.b — the Zephyr QEMU Cortex-M witness (mps2/an385).
#
# The point of this board, and why the settings below are what they are: every
# other Zephyr config in this repo is `native_sim/native/64` with
# `CONFIG_NET_SOCKETS_OFFLOAD=y` (see `native-sim-line-*.conf`), i.e. HOST BSD
# sockets on a 64-bit host. That means Zephyr's own IP stack, a real ethernet
# driver, and 32-bit pointer width have never run in CI. This bundle is the
# opposite of the NSOS one on every axis that matters:
#
#   native_sim (existing)        mps2/an385 (this file)
#   -------------------------    ----------------------------
#   NET_SOCKETS_OFFLOAD=y        offload OFF — Zephyr's in-kernel stack
#   no driver (host sockets)     eth_smsc911x against QEMU's lan9118
#   64-bit host pointers         32-bit ARMv7-M
#
# W2.a settled the board against the real Zephyr 3.7 checkout: `mps2_an385.dts`
# already carries an ENABLED `eth0: eth@40200000 { compatible = "smsc,lan9220" }`,
# `Kconfig.smsc911x` makes `ETH_SMSC911X` default-y on that node and sets
# `ETH_NIC_MODEL = "lan9118"` — the exact NIC `nros-tests/src/qemu.rs` already
# passes to QEMU for the FreeRTOS and bare-metal lanes. So no overlay, no SLIP,
# no new runner.

# --- The in-kernel stack, explicitly ------------------------------------------
# Offload is a NSOS-only shortcut; naming it =n here is deliberate documentation
# rather than a no-op, because a future shared conf that turns it on would
# silently erase this board's entire reason to exist.
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_NATIVE=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_SMSC911X=y

# --- Static IPv4 on the QEMU slirp network ------------------------------------
# QEMU user-mode networking hands out 10.0.2.0/24 with the host gateway at
# 10.0.2.2 — the same plan `Config::qemu_slirp` bakes for the bare-metal boards
# (nros-board-mps2-an385). DHCP is avoided on purpose: slirp's lease adds
# seconds of nondeterminism to a boot the tests time out on.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_DHCPV4=n
# Pick the QEMU transport explicitly. Zephyr's `QEMU_NET_STACK` choice defaults
# to the SLIP arm, which makes `cmake/emu/qemu.cmake` append
# `-serial unix:/tmp/slip.sock` and QEMU refuse to start without a SLIP daemon
# already listening:
#   qemu-system-arm: -serial unix:/tmp/slip.sock: Failed to connect
# SLIRP is what the 10.0.2.0/24 addresses above are FOR, and it needs no host
# side-process at all — which is the difference between a lane anyone can run
# and one that needs a daemon babysat alongside it.
CONFIG_NET_QEMU_USER=y

# The zenoh router lives on the HOST. `NROS_ZENOH_LOCATOR` defaults to
# `tcp/127.0.0.1:7456`, which under native_sim IS the host (offloaded sockets
# run in the host's namespace) but on a real guest is the guest's own loopback
# — so the session never connects and the entry reports
#   nros zephyr entry: run_components failed rc=-100
# Under SLIRP the host is always 10.0.2.2. This is the same 127.0.0.1-means-two
# -different-things trap the offload split creates everywhere else.
CONFIG_NROS_ZENOH_LOCATOR="tcp/10.0.2.2:7456"

# --- Sizing -------------------------------------------------------------------
# an385 has 4 MB of SRAM (`sram0: memory@20000000 reg = <0x20000000 0x400000>`),
# so this is not a tight board — the numbers below are the working set of
# zenoh-pico plus Zephyr's net stack, not a squeeze.
# Issue 0552 — at the old 16384 the main thread overflowed its stack, and
# without an MPU guard it did not announce itself: the SP walked past the base
# into `z_idle_stacks`, wiping the idle thread's SAVED CONTEXT, so the next
# PendSV switch to idle unstacked PC=0/xPSR=0 and Zephyr reported `USAGE FAULT /
# Illegal use of the EPSR` with every register zero — which reads exactly like a
# call through a NULL function pointer and is not one. The fault is therefore
# reported against a thread that did not overflow.
#
# TWO CORRECTIONS to the first version of this comment, both measured:
#
#  - The 88192-byte `NROS_EXECUTOR_SIZE` storage is NOT on this stack. The C/C++
#    entry template declares it `static ::nros::Node __nros_node;`, i.e. .bss.
#    Cross-check: 65536 was tried and passed all three cells, which an 88 KB
#    stack object makes impossible. What actually overflows is the executor
#    CONSTRUCTION path — ~13.4 KB was already consumed at `nros_cpp_init` entry
#    and `Executor::assemble` then cleared a ~9.3 KB temporary, caught by
#    watchpoint at `__aeabi_memclr4` (r0=0x20072e7c r1=0x200752dc, the latter
#    inside `z_idle_stacks`). So shrinking MAX_CBS / ARENA_SIZE does NOT shrink
#    what this knob has to cover.
#  - Rust does NOT pass on this board at 16384. Measured on the Rust leaf with
#    its own baked port: 2 runs with a router reachable, 2 faults; 2 runs
#    without, 0 faults. All three languages fault, and the split is the ROUTER
#    (the deep path only runs once the session opens), not the language. This is
#    the same language-split premise the issue was originally filed on, and the
#    issue's own CORRECTION section already records the refutation.
#
# Same class as FreeRTOS's 64 KB APP_TASK_STACK (platform-implementation-notes),
# for the same reason. 128 KB is well clear of the ~23 KB the construction path
# actually needs, on a board with 4 MB of SRAM.
CONFIG_MAIN_STACK_SIZE=131072

# Issue 0552 — keep the MPU stack guard ON. It is what turned that silent
# corruption into `FATAL ERROR 2: Stack overflow on CPU 0 / Current thread:
# main` in one run. A guard region costs an MPU slot and a little RAM; the
# alternative is a fault whose registers are all zero and whose first plausible
# reading is wrong.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_TCP=y

# --- This bundle serves all THREE entries -----------------------------------
# C, C++ and Rust all name this file LAST in `CONF_FILE`, so what it sets here
# wins over each example's `prj-*.conf` (which is how the MAIN_STACK_SIZE above
# overrides their 16384).
#
# This block used to read "for the C/C++ entry, NOT the Rust one": the pinned
# `zephyr-lang-rust` DT codegen emitted a five-argument `GpioPin::new` against a
# six-argument signature on any board with gpio nodes, which an385 has and
# native_sim does not. That was issue 0432, RESOLVED 2026-08-12 by phase-346
# W2/W3. The Rust leaf has built since, and `zephyr_cortex_m_rust_zenoh_pubsub_e2e`
# runs it.

# --- Randomness -----------------------------------------------------------
# an385 has no hardware entropy source, and nothing selects a software one by
# default, so the net stack's `sys_rand_get()` calls (TCP ISNs, SLIP, zenoh
# session ids) link against nothing:
#
#   undefined reference to `z_impl_sys_rand_get'
#
# native_sim never hit this — its entropy driver is the host's.
#
# `TEST_RANDOM_GENERATOR` is the ONLY option on this board, not a shortcut:
# every other arm of Kconfig's `RNG_GENERATOR_CHOICE` (including XOSHIRO)
# `depends on ENTROPY_HAS_DRIVER`, and an385 has no entropy device, so the
# whole choice is unselectable without it. Zephyr's own help text names this
# case — "Board-level configurations must not select this option unless the
# sole purpose of the board is testing (e.g. QEMU emulation boards)".
#
# It resolves to TIMER_RANDOM_GENERATOR, seeded by TIMER_RANDOM_INITIAL_STATE.
# That is a CONSTANT seed, so two images built from this bundle would derive
# identical zenoh session ids — the same failure mode as the unseeded
# native_sim pair repros (archived issue 0157), where discovery sees the peer
# as itself. A single-node witness is unaffected; anything that runs a PAIR off
# this bundle must give the second image a different TIMER_RANDOM_INITIAL_STATE.
CONFIG_TEST_RANDOM_GENERATOR=y

# --- QEMU timing --------------------------------------------------------------
# `mps2_an385_defconfig` sets `CONFIG_QEMU_ICOUNT_SHIFT=7`. icount decouples the
# guest clock from wall clock, which is right for deterministic timer tests and
# WRONG here: slirp I/O happens in host real time, so the guest's socket
# timeouts expire against a clock that is not moving with the network. The
# bare-metal lane hit the same class from the other side and fixed it with
# `-icount shift=auto` (docs/reference/qemu-icount.md); on Zephyr the cleaner
# lever is to leave the guest clock alone.
CONFIG_QEMU_ICOUNT=n
