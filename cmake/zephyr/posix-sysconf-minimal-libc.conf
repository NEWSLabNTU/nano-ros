# Zephyr 3.7: `default POSIX_SYSCONF_IMPL_FULL if CPP` picks the array-backed
# sysconf whenever C++ is on, and that implementation references ARG_MAX,
# CHILD_MAX and IOV_MAX -- none of which Zephyr's MINIMAL libc defines. The
# macro implementation is compile-time constant and does not.
CONFIG_POSIX_SYSCONF_IMPL_MACRO=y
