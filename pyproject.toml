# nano-ros is not a Python package. This file exists ONLY to configure
# towncrier (issue 0885), which reads `[tool.towncrier]` from here by
# convention. Nothing pip-installs this project.

[tool.towncrier]
name = "nano-ros"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## {version} — {project_date}"
# A fragment's number is the docs/issues id, not a GitHub issue number, so a
# link to `issues/{issue}` leads to an unrelated GitHub item, and a bare `#N`
# is an id the reader cannot look up. Render no reference at all: towncrier
# skips the reference when this formats to an empty string
# (`check-changelog-issue-links` renders a numbered fragment to hold it).
issue_format = ""

# One fragment per change, named `<issue-or-pr>.<type>.md`. The types mirror how
# this repo already talks about work, not towncrier's defaults: the tree files
# `fix`/`feat`/`perf`/`docs` commits and numbered ISSUES, so a fragment is named
# after the issue it closes and typed the same way its commit is.
[[tool.towncrier.type]]
directory = "fix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "feat"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "perf"
name = "Performance"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true
