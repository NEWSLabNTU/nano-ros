# Issue 2878 -- CTF tracing through a backend the application registers.
#
# The same shape as an image with its own recorder (the safety island's
# overwrite-oldest RAM ring): synchronous CTF, the backend picked by name.
# No in-tree backend is selected, so none is built: if the two CUSTOM symbols
# did not exist, Kconfig would fall back to the choice's default and the
# stream would never reach src/main.c's backend.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_CUSTOM=y
CONFIG_TRACING_BACKEND_CUSTOM_NAME="nros_test_ring"
CONFIG_TRACING_PACKET_MAX_SIZE=64
CONFIG_PRINTK=y
# k_thread_name_set() records a name, and emits thread_name_set.
CONFIG_THREAD_NAME=y
