# Every submodule that tracks a branch (`branch =` in .gitmodules), and where
# its patches start (phase-523 W4, RFC-0116's industrial purpose).
#
# A FORK row names the upstream repository and the upstream ref the patch line
# is measured against: a release tag where the pin descends from one, else an
# upstream branch (the merge base with it is recorded on the page). The page
# `docs/reference/forks/<name>.md` is GENERATED from this table and the pinned
# commit by `scripts/gen-fork-deltas.py`, which asks GitHub's compare API, so it
# needs `gh` and the network; nothing else does.
#
# An OURS row is a repository nano-ros authors (no upstream to diff against);
# its `main` is the line, and it gets no delta page.
#
# `just check fork-deltas` (offline) holds the set: every branch-tracking
# submodule has a row, every fork row has a page, and each page names the
# commit the superproject pins. A pin move without a regenerated page is red,
# so the page cannot describe a delta the tree no longer carries. The decision
# rule from phase-523 W4: a fork whose delta cannot be stated as a patch list
# against a pinned upstream is a fork whose pin is wrong, and is filed as such.

[[fork]]
name = "zenoh-pico"
path = "packages/rmw/zenoh/zpico-sys/zenoh-pico"
upstream = "eclipse-zenoh/zenoh-pico"
base = "1.10.1"

[[fork]]
name = "cyclonedds"
path = "third-party/dds/cyclonedds"
upstream = "eclipse-cyclonedds/cyclonedds"
base = "0.10.5"
# The rationale per patch group, kept by hand.
notes = "cyclonedds-fork-delta.md"

