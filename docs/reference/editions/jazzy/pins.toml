# The upstream ROS 2 Jazzy sources the committed Jazzy snapshots in this
# directory were derived from. ONE place names the pin; every snapshot header
# repeats the commit it read, and `scripts/check-upstream-edition.py` fails when
# the two disagree (a snapshot regenerated from a different tree than the one
# this file names is the drift this file exists to make visible).
#
# Regenerate (in the ROS 2 distrobox — Humble's rosidl generates the interface
# headers; see `scripts/gen-upstream-edition.py`'s docstring for why that is
# honest for an API-surface extraction and where it is not):
#   scripts/gen-upstream-edition.py --edition jazzy --src tmp/jazzy-src all
#
# A pin moves the way a submodule pin does: forward, on purpose, with the
# regenerated snapshots and the ledger rows they need in the same commit.

edition = "jazzy"

[repo.rmw]
url = "https://github.com/ros2/rmw"
branch = "jazzy"
commit = "8cb94a87cf3f4049abe2d563af893517bf336930"

