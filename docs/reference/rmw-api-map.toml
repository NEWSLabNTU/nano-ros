[rmw_init_options_init]
where = "declined"
reason = "upstream needs the init/copy/fini trio because its options OWN heap and carry an rcutils_allocator_t, which cannot cross this seam; ours is a build-time POD. Does NOT decide what the options CARRY: `localhost_only` and `enclave` are gaps (issue 0785, shape deferred to 0331), `security_options` is declined on the target (a DDS-SROS2 keystore path, no filesystem and no security plugin there), and `discovery_options` is an IRON field this Humble contract does not have"

[rmw_init_publisher_allocation]
where = "declined"
reason = "upstream's first two parameters are a `rosidl_message_type_support_t *` and a `rosidl_runtime_c__Sequence__bound *`, both declined ABI-wide, so the symbol cannot cross this seam whatever the third holds. TWO earlier reasons here were wrong: 'pools are baked' (issue 0777 — false for four backends of five) and then 'upstream pre-sizes an `rcutils_allocator_t` the caller owns' (also false — `rmw_publisher_allocation_t` is `{const char *implementation_identifier; void *data;}`, verified against Humble's `rmw/types.h`). The CAPABILITY question is separate and live for cyclonedds alone; it belongs to issue 0777, not to this parameter list"

