# ---------------------------------------------------------------------------
# WHY THE ARGUMENTS DIFFER
#
# 50 of the 70 slots take a different parameter list from the upstream symbol
# they answer, and writing 50 individual reasons would bury the fact that there
# are only a handful of causes. Each rule below names a parameter TYPE upstream
# passes and says what we do instead; the generator attributes every differing
# argument to one, and `--check` fails on an argument no rule explains — the
# same discipline as the ledger's "no row survives as 'that is just how it is'".
#
# `match` is a substring of the upstream parameter type.

# ---------------------------------------------------------------------------
# Jazzy-only contract symbols (`editions = ["jazzy"]`). Humble's 88 are above;
# Jazzy's 95 (docs/reference/editions/jazzy/rmw-implementation-contract.txt)
# add these seven and remove none. Every one of the 88 kept its signature.
# ---------------------------------------------------------------------------

[rmw_count_clients]
where = "vtable"
nano = "count_clients"
editions = ["jazzy"]
reason = "issue 1978: the service twin of `count_publishers`; zenoh counts `SC` tokens in its graph cache, Cyclone counts writers on the `rq/<name>Request` builtin topic (stock `rmw_cyclonedds_cpp`'s rule). XRCE and uORB leave it NULL = UNSUPPORTED."

[rmw_count_services]
where = "vtable"
nano = "count_services"
editions = ["jazzy"]
reason = "issue 1978: as rmw_count_clients, counting servers (`SS` tokens; readers on `rq/<name>Request`)."

[rmw_event_type_is_supported]
where = "vtable"
nano = "event_type_is_supported"
editions = ["jazzy"]
reason = "issue 1978: a static per-backend answer. zenoh answers from the one kind table its entities' `supports_event` read (`shim::events`); Cyclone answers every known kind (its `*_take_event` bodies serve all five); XRCE answers true for the two DEADLINE kinds only (emulated client-side, issue 2108); uORB NULL = false. The runtime reads it through one helper, cffi's `backend_event_type_is_supported`."

[rmw_get_gid_for_client]
where = "vtable"
nano = "get_gid_for_client"
editions = ["jazzy"]
reason = "issue 1978: the client twin of `get_gid_for_publisher`. zenoh: the gid stamped into every request attachment; Cyclone: the request writer's GUID; XRCE: the request writer's DDS GID that `ros_discovery_info` lists (issue 2110, UNSUPPORTED for an endpoint graph.c could not key). uORB NULL = UNSUPPORTED."

[rmw_serialization_support_init]
where = "declined"
status = "not-supported"
editions = ["jazzy"]
reason = "dynamic typesupport (rosidl_dynamic_typesupport, REP-2011): builds a serialization-library handle so messages whose type is learned at RUNTIME can be (de)serialized. Every type in an image is generated at build time (codegen, RFC-0023) into fixed-size storage, and dynamic data needs an allocator plus a type-description parser at runtime — RAM and flash on the targets this ABI serves, for a capability (tools handling types they were not built with) that is a host-tool concern. Same decision as rclcpp's GenericPublisher (`cpp:GenericPublisher`, declined)."

[rmw_take_dynamic_message]
where = "declined"
status = "not-supported"
editions = ["jazzy"]
reason = "as rmw_serialization_support_init: takes into a `rosidl_dynamic_typesupport_dynamic_data_t`, which only exists with dynamic typesupport."

[rmw_take_dynamic_message_with_info]
where = "declined"
status = "not-supported"
editions = ["jazzy"]
reason = "as rmw_take_dynamic_message."

[[arg_rule]]
match = "rmw_node_t"
title = "the SESSION is the seam"
why = """Upstream passes the node into almost every call. Our vtable is scoped to a session handle that already knows its node, so re-passing it would ask the caller to carry an identity the callee holds — the same argument that decided `handle-owns-node` in the C API, one layer down."""

[[arg_rule]]
match = "rmw_context_t"
title = "the SESSION is the seam"
why = """As `rmw_node_t`: upstream's context is the process-wide init state, and ours is the session the slot is being called on."""

[[arg_rule]]
match = "rcutils_allocator_t"
title = "no allocator at this seam"
why = """This ABI does not allocate. Upstream hands an `rcutils_allocator_t` so the implementation can size and own the result; ours writes into a caller-owned byte range whose capacity the caller already knows. An allocator parameter cannot cross a seam that has nothing to give it."""

[[arg_rule]]
match = "_allocation_t"
title = "pre-allocation declined ABI-wide"
why = """`rmw_publisher_allocation_t` / `rmw_subscription_allocation_t` are upstream's pre-sizing handles. Declined at this seam because their first parameters are a typesupport pointer and a sequence bound, both declined ABI-wide. The CAPABILITY question — can a backend pre-size — is live for cyclonedds alone, and issue 0777 is CLOSED, so it is no longer a place to route it: 0777 resolved with the finding that every deviation reason built on "pools are baked" was false, which settles the reason and not the capability. Anyone who wants pre-sizing for cyclonedds needs a NEW issue; a citation to a resolved one is not a reason."""

[[arg_rule]]
match = "rmw_names_and_types_t"
title = "visitor, not an owning out-param"
why = """Upstream fills a heap-owning out-parameter the caller must `fini`. We pass a VISITOR callback invoked once per entry, with borrowed strings valid for the call. No allocation, bounded work, and nothing for a caller to leak — which is what makes the graph family available on a target with no allocator at all."""

[[arg_rule]]
match = "rcutils_string_array_t"
title = "visitor, not an owning out-param"
why = """As `rmw_names_and_types_t` — an owning array upstream, a visitor here."""

[[arg_rule]]
match = "rosidl_message_type_support_t"
title = "types are resolved at BUILD time"
why = """Upstream resolves a type through a runtime typesupport pointer. Ours are resolved by codegen before the image exists, so the seam carries bytes and a type hash rather than a pointer to a type description that would have to be walked at runtime."""

[[arg_rule]]
match = "rosidl_service_type_support_t"
title = "types are resolved at BUILD time"
why = """As the message typesupport."""

[[arg_rule]]
match = "rmw_serialized_message_t"
title = "no allocator at this seam"
why = """`rmw_serialized_message_t` is an `rcutils_uint8_array_t`, which carries an allocator. The byte range and its length cross instead."""

[[arg_rule]]
match = "rmw_subscription_content_filter_options_t"
title = "reserved shape, no backend"
why = """Content filtering is declared for parity shape; no backend implements it, so the options type has no consumer to shape it for."""

[[arg_rule]]
match = "void *"
title = "bytes, not an untyped pointer"
why = """Upstream's `void *` is the message, interpreted through the typesupport pointer \
beside it. With types resolved at build time there is nothing to interpret it WITH, so \
the seam carries an explicit byte range and its length — which is also what makes the \
buffer's capacity checkable at the call."""

[[arg_rule]]
match = "rmw_event_t"
title = "events are a slot family, not an event object"
why = """Upstream models an event as an object you take from. Ours are per-kind slots on \
the session (`take_event` and the event mask in `rmw_event.h`), so the object that would \
carry the kind is the slot itself."""

# `symbols` scopes a rule to those upstream symbols (tried before the general
# rules): `rmw_service_info_t *` is answered one way on the server side and
# another on the client side, and one sentence cannot be true of both.
[[arg_rule]]
match = "rmw_service_info_t"
symbols = ["rmw_take_request"]
title = "the reply token beside, the metadata in a sibling slot"
why = """`take_request` returns only `int64_t *seq_out`, the backend's reply-correlation \
token that `send_response` takes back — all a server needs to answer. The rest of \
upstream's `rmw_service_info_t` (the requesting client's `request_id` and the two \
timestamps) is carried by the sibling slot `take_request_with_info` (issue 2081), which \
takes a caller-owned `rmw_service_info_t *` field for field, exactly upstream's shape. \
The runtime dispatches through it whenever a backend fills it: Cyclone DDS reports \
`request_id` and `source_timestamp`, XRCE-DDS `request_id` and `received_timestamp`; \
the zenoh backend reports `request_id`, `source_timestamp` and `received_timestamp` \
through the Rust adapter's side table instead (issue 1942). `received_timestamp` is the \
server's wall clock when the request arrived, as `rmw_zenoh_cpp` stamps it (issue 2135); \
Cyclone 0.10 has no reception time and reports none. A field not reported is zero."""

[[arg_rule]]
match = "rmw_service_info_t"
symbols = ["rmw_take_response"]
title = "the sequence number only — no service info on the client side"
why = """`take_response` returns only `int64_t *seq_out`, the `sequence_id` \
`send_request` handed out, which is what the runtime matches a reply against (issue \
0778). Nothing else from upstream's `rmw_service_info_t` crosses on the client side: \
there is no `take_response_with_info` slot, no backend reports the reply's timestamps \
or the server's identity, and no client API surfaces them."""

[[arg_rule]]
match = "rmw_request_id_t"
title = "reply against the backend's token"
why = """Upstream's `send_response` names the request by the client's `rmw_request_id_t`. \
Ours takes back `int64_t seq`, the reply-correlation token `take_request` returned — a \
reply-slot index on Cyclone, XRCE and zenoh — and the backend maps it to the requester \
itself. The client's own request id is reported separately, by \
`take_request_with_info`."""

[[arg_rule]]
match = "_array_t"
title = "visitor, not an owning out-param"
why = """`rmw_topic_endpoint_info_array_t` and `rmw_network_flow_endpoint_array_t` are \
heap-owning arrays with their own `fini`. Visited one entry at a time instead."""

[[arg_rule]]
match = "_sequence_t"
title = "visitor, not an owning out-param"
why = """`rmw_take_sequence`'s message and info sequences are caller-owned arrays sized \
by an allocator. The bounded form is a repeated take, which is what the executor does."""

[[arg_rule]]
match = "rmw_time_t"
title = "milliseconds, not a struct"
why = """`rmw_time_t` is a `{sec, nsec}` pair. This ABI carries `uint32_t` milliseconds \
throughout — the resolution every supported platform clock actually offers, and the unit \
the deadline arithmetic already uses."""

[[arg_rule]]
match = "rmw_event_callback_t"
title = "one wake callback per session"
why = """Upstream installs a callback per entity. Ours is `set_wake_callback` on the \
session: one executor drives several backends, so the wake has to be attributable to a \
session rather than to whichever entity fired."""

[[arg_rule]]
match = "rmw_init_options_t"
title = "build-time POD, no init/copy/fini"
why = """Upstream's options own heap and carry an allocator, which is why they need the \
init/copy/fini trio. Ours are a build-time POD passed by value."""

[[arg_rule]]
match = "const rmw_qos_profile_t"
title = "by pointer, not by value"
why = """Upstream passes two `rmw_qos_profile_t` BY VALUE. The struct is ~80 bytes, and a \
by-value copy of it crosses the seam twice on every compatibility check — on a target \
where the call may run from a 512-byte task stack. Ours takes `const rmw_qos_profile_t *`, \
which is the same information without the copies."""

