[rmw_subscription_set_on_new_message_callback]
where = "vtable"
nano = "subscription_set_on_new_message_callback"
reason = "exact name and signature (issue 1940, phase-397 W1). Two deliberate differences in BEHAVIOUR, stated in the header: `number_of_events` is a lower bound (a backend may call once per arrival with 1, so none tracks per-entity pending depth — issue 0960's RAM argument, kept), and samples that arrived before the registration are not replayed; a caller registers, then checks `has_data`. phase-407 had declined the trio; RFC-0084's 2026-10-17 amendment reversed that once issue 1940 showed every per-entity wake in the C, C++ and async Rust APIs was inert without it."


