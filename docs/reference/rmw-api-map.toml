[rmw_take_loaned_message]
where = "vtable"
nano = "take_loaned_message"
reason = "slot carried, and NO backend fills it — NULL in cyclonedds, NULL in XRCE, left at `EMPTY_VTABLE` by the Rust adapter, so every `try_borrow` across the C ABI takes the copy fallback today. Kept deliberately (issue 0781 item 2, DECIDED — not deferred): the scoped callback of `process_raw_in_place` ends the borrow when it returns, so it cannot hand a view to a caller that outlives the call, which is exactly what `nros-c` / `nros-cpp` `try_borrow` do. The loan pair is the only shape in this ABI that serves them, it is upstream-named, and its consumer degrades to a copy when the slot is NULL. What was wrong was the SILENCE — the slot existing read as the capability working; it says so now, here and in the header."

