reason = "slot kept, INERT by decision: no backend loans on the receive path (its sibling `take_loaned_message` is NULL everywhere and its consumer degrades to a copy), so there is nothing to attach metadata to. Kept as the pair's metadata form — upstream-named, and the only shape that hands a caller-outliving view plus its `rmw_message_info_t`. Earns a dispatch site in the same change that gives a backend a receive-side loan."

