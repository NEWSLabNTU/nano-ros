[book]
title = "nano-ros Book"
authors = ["aeon"]
language = "en"
src = "src"

[build]
build-dir = "book"

[preprocessor.mermaid]
command = "mdbook-mermaid"

# RFC-0114 D10: a manual board row older than `manual_stale_days` reads Builds
# in the RENDERED book. The committed pages carry the date that starts, because
# a tracked file must not change on a day nobody edited anything; this applies
# the clock at build time through the same renderer (scripts/gen-board-support.py).
[preprocessor.board-status]
command = "python3 ../scripts/mdbook-board-status.py"

# RFC-0124 D9: a step shown in Rust, C and C++ is one tab group in the source
# (`<!-- tabs -->` … `<!-- /tabs -->`, scripts/lib/book_tabs.py); this renders
# the groups as tabs. Python only, like the preprocessor above.
[preprocessor.lang-tabs]
command = "python3 ../scripts/mdbook-lang-tabs.py"

# RFC-0124 D2 and Topic levels: a page's `<!-- type: … · level: N -->`
# declaration renders as a badge under its title ("How-to · Level 2: Building
# real applications"). Pages with no declaration (the generated ones) get none.
[preprocessor.level-badge]
command = "python3 ../scripts/mdbook-level-badge.py"

[output.html]
git-repository-url = "https://github.com/NEWSLabNTU/nano-ros"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

# RFC-0123 D7: every page phase-532 moved keeps its old URL for two releases.
[output.html.redirect]
