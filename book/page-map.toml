# The page map (RFC-0123 D2, phase-532 W0): one row per page of either book.
# `old` = path under book/src when the map was seeded (absent for a new page);
# `was` = later user-book paths the page has left, oldest first (phase-537 W1);
# `book` + `path` = where it lives (path relative to that book's src/).
# User pages follow RFC-0124 Appendix A; `note` says what a later work item
# of phase-537 still splits or merges.
# `action`: keep | move | merge-into <user-path> | split <internals-path> |
#           new <owner phase>.  `batch` = the work item that performs it.
# Read it through scripts/lib/book_pages.py; never hand-parse it.

schema = 1

