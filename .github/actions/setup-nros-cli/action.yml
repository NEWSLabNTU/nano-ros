name: Build the in-tree nros CLI
description: >
  The ONE road by which a workflow gets the in-tree `nros` CLI: key the binary
  cache on the CLI's whole source stamp, restore it, run the user's verb
  `just setup-cli`, ASSERT the binary matches the checkout, put it on
  `$GITHUB_PATH`, and (by default) build the `nros-launch-resolve` helper.

  gate.yml carried this as three hand-written steps in ten jobs, plus two
  variants, while nightly.yml and three other workflows used an earlier
  version of this action that ran `cargo build` and no cache. Twelve copies of
  one rule is twelve places for it to drift. phase-431 W2's finding was
  exactly that: four sites asserted the stamp and the fifth did not, and read
  like the other four.

  WHY EACH STEP:

  - The cache key is `scripts/ci/cli-bin-cache-key.sh`, a hash of every file
    in `source_stamp.rs`'s watch set (packages/cli, each dir
    `cli-source-dirs.txt` lists, the submodule gitlinks, the toolchain pin).
    There are no restore-keys: a partial hit is a binary built for another
    tree. RESTORE-ONLY. `gate.yml`'s `warm-cache` job on push to main is the
    only writer, and it asks with `cache: lookup` and saves the result itself.
  - `just setup-cli`, not `cargo build`: the verb's own freshness check
    decides whether the restored binary is this tree's. The cache only fills
    in what the verb would build.
  - `nros source-stamp` (phase-429 W5): the binary's own answer to "do I match
    these sources". `check-ci-cli-from-source` requires it beside every build.
  - `play_launch` is initialised FIRST, at depth 1: its pin is a stamp input.
  - `just setup-launch-resolve` (issue 0797): `nros sync` refuses a workspace
    with no resolver, which once aborted five of eight nightly jobs in 2-5 s.
    A job that never syncs passes `launch-resolve: 'false'`.

  PREREQUISITE: `just` must already be on PATH. This action installs nothing.
  Every consumer today runs in a `nano-ros-ci` / `nano-ros-zephyr-ci`
  container, which bakes it. `check-workflow-just-provisioning` expands this
  action into each consuming job and checks there.

inputs:
  cache:
    description: >
      `restore` (default): restore the binary cache before building.
      `lookup`: only report whether an entry exists (for the job that writes
      the cache), and build regardless.
    required: false
    default: restore
  launch-resolve:
    description: "'true' (default) also builds the nros-launch-resolve helper."
    required: false
    default: "true"

outputs:
  key:
    description: The binary cache key, for a job that saves the cache.
    value: ${{ steps.cli-key.outputs.key }}
  cache-hit:
    description: "'true' when the binary cache had an exact entry."
    value: ${{ steps.restore.outputs.cache-hit || steps.lookup.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: cli-key
      shell: bash
      run: |
        case "${{ inputs.cache }}" in
          restore|lookup) ;;
          *) echo "setup-nros-cli: cache must be 'restore' or 'lookup', got '${{ inputs.cache }}'" >&2; exit 2 ;;
        esac
        key="$(scripts/ci/cli-bin-cache-key.sh)"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - id: restore
      if: ${{ inputs.cache == 'restore' }}
      uses: actions/cache/restore@v4
      with:
        path: |
          packages/cli/target/release/nros
          packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
          packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
          packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
        key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

    - id: lookup
      if: ${{ inputs.cache == 'lookup' }}
      uses: actions/cache/restore@v4
      with:
        path: |
          packages/cli/target/release/nros
          packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
          packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
          packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
        key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}
        lookup-only: true

    - shell: bash
      run: |
        git submodule update --init --depth 1 packages/cli/third-party/play_launch
        source ./activate.sh
        just setup-cli
        "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
        echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"
        if [ "${{ inputs.launch-resolve }}" = "true" ]; then
          just setup-launch-resolve
        fi
