# TIER 2 — build+run, 1-wise cover, ON A CLOCK (phase-410 W3).
#
# CI is BREADTH x DEPTH and only depth is expensive. This is RUN depth over the
# 1-wise breadth: measured 2026-08-31, an 11 min warm fixture rebuild plus a
# 9.5 min run, against 46 s for the build-depth lane in `build-wide.yml`.
#
# WHY A SCHEDULE AND NOT push(main)
#
# It used to live in `post-submit.yml` on `push(main)` with
# `cancel-in-progress: true`. With ten agents landing through a merge queue,
# merges arrive faster than 20 minutes, so each run was cancelled by the next
# merge and the tier completed NEVER. A scheduled run always finishes.
#
# The cost is latency: a regression is caught within a cycle rather than within
# a commit. That is the honest trade for a lane that actually reports.
#
# `cancel-in-progress: false` for the same reason — a newer schedule tick must
# not cancel a run that is most of the way through.
name: run-matrix

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: run-matrix
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    name: tier 2 (1-wise matrix)
    # Gated for the same reason as queue.yml's L3: this needs the RTOS
    # toolchains, and a job that cannot start is not a signal.
    if: ${{ vars.NROS_SELF_HOSTED_READY == 'true' }}
    runs-on: [self-hosted, linux, nros-qemu, nros-sdk-zephyr, nros-big]
    defaults:
      run:
        shell: bash
    # WHICH STAGE DID THIS RUN REACH? — issue 1158 item 3.
    #
    # Consumed by the `coverage` job below, which puts it in its own NAME so the
    # answer is legible from `gh run view` / the checks list without opening a
    # log. Empty when this job never started, which is a third answer again.
    outputs:
      stage_label: ${{ steps.stage.outputs.label }}
      reached_cells: ${{ steps.stage.outputs.reached_cells }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # A lane answers two questions with different answers: which fixtures must
      # be FRESH (its cell cover) and which must EXIST (a property of the run).
      # `lane=tier2` is the build tier 2's run requires — see #482 / phase-340 W3.
      # phase-411 W4 — a CI job is `just setup <scope>` then `just test <scope>`.
      # Only the SCOPE differs between lanes, so this file reads as a transcript
      # of a user session and "does CI do what I do?" is answerable by looking.
      #
      # What these two lines replaced: a `build-test-fixtures lane=tier2` step
      # plus a `ci matrix` step, i.e. the lane vocabulary spelled twice with the
      # reader left to know they must agree. `just test tier2` builds what that
      # scope needs and runs exactly it.
      - name: just setup tier2
        id: setup
        run: |
          source ./activate.sh
          just setup tier2

      # AFTER `setup`, not before — phase-413 W2.
      #
      # A runner that lies about its labels wins jobs it cannot run, and the red
      # lands on the author's change looking like a code failure. That is why
      # this exists. But it ran FIRST, and one thing it asserts is not a
      # property of the host at all:
      #
      #   runner-doctor.sh checks `$root/build/qemu/bin/qemu-system-arm` FIRST —
      #   "the project-local patched build is the PRIMARY path (phase-143) … a
      #   host with it needs nothing from the system" — and falls back to the
      #   system qemu only when that is absent.
      #
      # `build/qemu` is inside the CHECKOUT, and `just setup tier2` creates it:
      # the tier-2 preset includes the `qemu` module, whose `setup` ends in
      # `just qemu setup-qemu`. So the check ran one step too early, found no
      # patched binary, fell back to the system qemu — 6.2 on this runner — and
      # failed the `>= 7.2` the RTOS multi-instance cells need. Every run of
      # this workflow died at step 2 having provisioned nothing:
      #
      #   [MISSING] qemu-system-arm is 6.2 — the RTOS multi-instance cells need >= 7.2
      #   runner-doctor: FAIL — at least one label claims something this host does not have.
      #
      # It was reported as a host needing `runner-provision.sh nros-qemu`. It is
      # a workflow asking the host for something the next step provides.
      #
      # Fail-fast is not lost: a genuinely mislabeled runner still fails here,
      # and `setup` would have failed on it first anyway.
      - name: Verify this runner's labels are true
        id: doctor
        run: ./scripts/ci/runner-doctor.sh nros-qemu,nros-sdk-zephyr,nros-big

      # THE MISSING MIDDLE — phase-413 W2.
      #
      # The documented chain is `setup` -> `build` -> `test` (phase-411 W4), and
      # this job went straight from setup to the test lane. `ci matrix`
      # opens with `_lane-gate tier2`, which runs `check-fixtures-stale.sh` — a
      # FRESHNESS GATE, not a build. So the lane asked "are the fixtures fresh?"
      # of a tree that had never built them.
      #
      # On a self-hosted runner with a persistent workspace that can look like it
      # works, because a previous run left artifacts behind. It stops looking
      # like it works the moment the per-leaf `generated/` msg crates are absent,
      # and then the gate cannot even build a fixture to judge it:
      #
      #   ERROR: 104 rust fixture(s) could NOT be built by the staleness probe:
      #     examples/native/rust/talker
      #         error: failed to load manifest for dependency `std_msgs`
      #     examples/native/rust/service-client
      #         error: failed to load manifest for dependency `example_interfaces`
      #
      # `just build <scope>` is the stage that produces them: it runs `_codegen`
      # (issue 0992) and then the lane's fixtures. Naming the SAME scope as
      # setup and test keeps one vocabulary across the three steps, which is the
      # property phase-411 exists to give.
      - name: just build tier2
        id: build
        run: |
          source ./activate.sh
          just build tier2
      # `just ci matrix`, NOT `just test tier2`. phase-411 W4 briefly used the
      # latter and that was a COVERAGE REGRESSION caught by
      # check-tier-has-ci-owner: the tier recipe is `_lane-gate` + `check` +
      # `rust-rtos-link-check` + `test-all`, and `just test tier2` is only the
      # last of those. Provisioning by scope + running the TIER keeps the
      # transcript shape without quietly narrowing what runs.
      - name: just ci matrix
        id: cells
        run: |
          source ./activate.sh
          just ci matrix
      - name: Upload junit and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-submit-junit
          path: |
            target/nextest/**/junit*.xml
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Sweep orphans and disk
        if: always()
        run: ./scripts/ci/runner-sweep.sh || true

      # WHICH STAGE DID THIS RUN REACH? — issue 1158 item 3.
      #
      # The eight runs before this landed all said `failure` and hid three
      # different stories: three died in `Verify this runner's labels are true`,
      # two in `just setup tier2`, three in `just build tier2`. NOT ONE was a
      # test result — every failure is upstream of the cells, so this lane
      # produced no runtime verdict on any of those days while looking exactly
      # like a lane that had.
      #
      # That is the shape issue 1043 fixed for `check-submodule-pins`: where
      # there were two outcomes there are really three, and the third is "this
      # could not be evaluated here". VERDICT / NO VERDICT / DID NOT START.
      #
      # `if: always()`, and the script exits 0 unconditionally: it DESCRIBES the
      # lane, and a reporter that can redden the run it reports on is the defect
      # one layer up. The lane's own steps colour the run, as they already did.
      #
      # `steps.<id>.outcome`, not `.conclusion` — `outcome` is the step's real
      # result before any `continue-on-error` rewrite. Its vocabulary
      # (success/failure/skipped/cancelled) is the SAME one `gh run view --json
      # jobs` returns, which is what lets `--history` classify the eight runs
      # above with the identical function this step calls. See the module
      # docstring; those runs are asserted in its self-test.
      - name: Which stage did this lane reach?
        id: stage
        if: always()
        env:
          NROS_LANE_STEPS: >-
            [{"name": "just setup tier2", "conclusion": "${{ steps.setup.outcome }}"},
             {"name": "Verify this runner's labels are true", "conclusion": "${{ steps.doctor.outcome }}"},
             {"name": "just build tier2", "conclusion": "${{ steps.build.outcome }}"},
             {"name": "just ci matrix", "conclusion": "${{ steps.cells.outcome }}"}]
        run: python3 scripts/ci/lane-stage.py --report --lane "tier 2 (1-wise matrix)"

  # phase-405 — make the interlocked job's SKIP visible in the run that skipped
  # it. See scripts/ci/report-interlock-coverage.sh for why this warns rather
  # than fails when no runner is registered, and fails when one supposedly is.
  #
  # `if: always()` so it reports on a skip; `needs` so it sees the result.

  # The job NAME carries the stage — issue 1158 item 3.
  #
  # `did tier 2 run?` was a question this job could not answer. It read
  # `needs.matrix.result`, which is `failure` for a run that tested the whole
  # matrix and found a regression AND for a run that died in `runner-doctor`
  # having built nothing, so it printed "RAN and FAILED" for eight consecutive
  # runs of which none ran anything. A check-run name is the last piece of a
  # run that is legible without opening a log — `gh run view`, the commit's
  # checks list, the PR checks tab — so the answer goes there.
  #
  # `needs` IS an available context for `jobs.<job_id>.name` (unlike, say,
  # `steps`), which is why this reads a job OUTPUT rather than re-deriving
  # anything. `|| 'DID NOT START'` covers the interlocked skip, where the matrix
  # job produces no outputs at all — a third answer that is neither verdict nor
  # lane failure, and the one `report-interlock-coverage.sh` already handled.
  coverage:
    name: "tier 2 — ${{ needs.matrix.outputs.stage_label || 'DID NOT START' }}"
    needs: [matrix]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Report whether the interlocked lane ran
        run: ./scripts/ci/report-interlock-coverage.sh "tier 2 (1-wise matrix)" "${{ needs.matrix.result }}" "${{ vars.NROS_SELF_HOSTED_READY }}" "${{ needs.matrix.outputs.stage_label }}"
