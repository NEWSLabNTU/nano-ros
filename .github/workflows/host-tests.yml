# Host-test tier (CI reorg / phase-253) — the host-side regression net.
#
# Folds the two host suites into one tier file (separate jobs, separate
# concurrency, and neither cancels — both must complete):
#   - unit        : `just test-unit` — workspace unit tests
#                   (`cargo nextest --workspace --exclude nros-tests`),
#                   then `just test-ignored` (issue 1507) and
#                   `just test-doc` (doctests, both workspaces).
#   - feature-sweep : `just check feature-sweep` — per-feature clippy.
#   - check-build : `just check build` (3 shards) + `no-std` + `pristine-checkout`,
#                   the full compile tier — was gate.yml's scheduled job until
#                   phase-559 W7 took gate.yml's `schedule` away.
#   - rt-sched    : `rt_sched_levels_e2e` (phase-162) in a container granted
#                   `SYS_NICE`, the only lane that claims `rt-sched`.
#   - census      : the periodic lane census (phase-475 W5), was lane-census.yml.
#   - checkout-track / installed-track / image-track : the book's setup flow
#                   executed (issue 1107, phase-551), was probe.yml.
#   check-build, census and the book tracks joined this file's one daily cron
#   in phase-559 W6/W7: same cadence, same hosted runner class, and nothing
#   forced a separate file. Their jobs keep
#   their names, so a red still names which lane broke.
#
# Tier 1's OTHER half — `just build-test-fixtures lane=tier1` + `just ci tier1
# run` (preconditions + rust-rtos-link-check + `test-all`) — is NOT here. It
# was the `integration` job until issues 1684/1685, and it lives in
# `run-matrix.yml`'s `tier1` job on the self-hosted runner now, because this
# runner cannot hold it:
#
#   * DISK. The job built a hand-picked fixture SUBSET (rust core + workspace
#     fixtures, the ~52 G of extras left out for this 146 G disk) and then ran
#     `test-all` over the whole tier-1 lane with `NROS_SKIP_FIXTURE_CHECK=1`:
#     199 of 214 real failures were "fixture binary MISSING for an in-lane
#     coordinate" (run 37252649866). Building what the lane asserts was
#     measured at +37 G for the linux half ALONE (unfinished, 32 cores), +39 G
#     for the whole tier, against ~16 G free here.
#   * PROVISIONING. Tier 1 covers Zephyr native_sim and ThreadX-Linux, which
#     `just setup linux` does not provision: 81 undeclared capability skips.
#
# The self-hosted runner already carries the Zephyr SDK and the disk for
# tier 2; tier 1 runs there after it.
#
# Nightly (03:00 UTC) + on-demand ONLY — never per push (a per-push run was
# cancelled by the next push and never completed: #57, and again 26 of 29 push
# runs to 2026-10-03). See docs/development/ci-workflow-reorg.md.
#
# EVERY step that invokes `just` or `nros` sources `./activate.sh` first. That is
# the repo's activation SSoT and CLAUDE.md's sweep contract; three steps here
# used to source `/opt/ros/humble/setup.bash` alone and six sourced nothing.
# activate.sh is a strict superset of the ROS line — it sources ROS itself
# (nounset-guarded, issue 0639) and additionally exports `nano_ros_ROOT`, which
# is how `find_package(nano_ros)` resolves: the config lives at the checkout
# root, not in a CMake prefix. Without it the workspace fixture build died at
#
#   CMake Error at CMakeLists.txt:23 (find_package):
#     ... CMake did not find one.
#
# for every generated workspace root, because a generated root deliberately sets
# no prefix. activate.sh only ever PREPENDS to PATH, so the `$GITHUB_PATH`
# entries earlier steps add (the in-tree CLI) survive it.
name: host-tests

on:
  # phase-395 — POST-merge, not pre-merge. This lane needs ROS on the runner and
  # its two jobs failed on every pull request; a red that is STRUCTURAL is not a
  # gate, it is the noise that teaches people to ignore CI. It gates nothing
  # (only `check` is required), so running it per-PR bought no safety and cost a
  # concurrent runner on every agent push.
  #
  # SCHEDULE-ONLY since 2026-10-03. It ran on `push` to main to bound a
  # regression to one commit, and that bought nothing measurable: of the last
  # 29 push runs, 26 were CANCELLED, 1 failed and 2 passed. The cause is not
  # `cancel-in-progress` — the integration job already had it `false` — but
  # GitHub's concurrency model: a group keeps ONE pending run, so each merge
  # that arrived while a run was in flight replaced the one waiting. With the
  # merge queue landing faster than this lane's 45-150 min, almost no commit
  # was ever measured. `run-matrix.yml` moved to a schedule for the same reason;
  # the header above has said "NOT every direct push" since #57, and the
  # trigger contradicted it. One run a night that FINISHES is a verdict;
  # twenty-six that do not are noise.
  #
  # Bounding a regression is now a bisect over one day's merges, which the
  # queue keeps linear. `workflow_dispatch` answers "is THIS commit good" on
  # demand.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # ----- workspace unit tests (cheap; cancel-on-PR) -----
  unit:
    name: workspace unit tests
    runs-on: ubuntu-22.04
    # Issue 1492 — the ceiling argument (it was made first for the retired
    # tier-1 `integration` job, issues 1684/1685), with
    # a real margin, because here the healthy duration IS measured. This job
    # succeeds: 8 m 21 s, 10 m 23 s and 11 m 13 s on the three most recent runs
    # that were not superseded (2026-09-25). 45 is four times the worst of
    # those and still an eighth of the default it replaces. It has never
    # wedged; this is what a bound costs when nothing is wrong.
    timeout-minutes: 45
    # Per-job concurrency, one group per job; neither cancels.
    concurrency:
      group: host-tests-unit-${{ github.ref }}-${{ github.event_name }}
      # Schedule + dispatch only, so nothing supersedes: a nightly run that
      # finishes is the whole point of the lane (see `on:`).
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      # RESTORE here, SAVE right after the build below — deliberately split.
      #
      # `actions/cache` saves in a POST step, at job end. By then this job has
      # run `just setup linux`, built fixtures and run `just ci tier1`, and all
      # of them write into `packages/cli/target` too. So the entry stored is not
      # "the CLI build" but "whatever the whole job left behind".
      #
      # Measured on the live cache: eight `nros-cli-*` entries at 138 MB and ONE
      # at 5 571 MB, the big one on `refs/heads/main` — the branch where the job
      # runs to completion instead of being cancelled early. That single entry
      # was 56 % of the repository's 10 GB Actions cache limit, which is why
      # `gate.yml`'s sccache (1 GB, and the required PR check depends on it) had
      # no headroom.
      #
      # Splitting restore from save bounds the entry to what the CLI build
      # actually produces, which is the 138 MB the cancelled jobs already show.
      - name: Restore CLI build cache (Phase 218)
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      # The one CLI build road: `.github/actions/setup-nros-cli`.
      - name: Build nros CLI from packages/cli/ (Phase 218)
        uses: ./.github/actions/setup-nros-cli
        with:
          launch-resolve: 'false'

      # SAVE NOW, before anything else writes into this directory. See the
      # restore step above for the measurement. `if: always()` is deliberately
      # NOT set: a failed CLI build leaves a target dir that should not become
      # the entry every later run restores from.
      - name: Save CLI build cache (Phase 218)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}

      # phase-413 W5 — the scope verb.
      # `just setup linux` expands to `nros setup --build-sources` and
      # `just ci provision-zenohd`, which is exactly what this job spelled out,
      # plus the CLI/resolver and the host facts every tier asserts.
      #
      # It also fetches qemu and the XRCE agent, which the unit tests do not
      # use. That is the price of one vocabulary: a job body is
      # `just setup <scope>` plus one command, and both are prebuilt tarball
      # fetches from the index rather than source builds.
      - name: just setup linux
        run: |
          source ./activate.sh
          just setup linux

      - name: just test-unit
        run: |
          source ./activate.sh
          just test-unit

      # Issue 1507 — the `#[ignore]`d tests, both cargo workspaces. They need
      # no fixture, so they ride the job that already has the toolchain and the
      # CLI, ~1 min on top. Before this, the only lanes naming `test-ignored`
      # were tier 3 (no workflow runs it) and the tier-2 nightly, which has not
      # reached that step since it went red at `just build tier2-nightly` — so
      # an ignored test rotted unseen, and four had. Runs after a red
      # `test-unit` too: the two answer different questions.
      # `colcon_flag_parity` (phase-526 W3) compares `nros` against colcon over
      # the ros2_rust_examples workspace, and asserts the submodule is populated
      # rather than skipping. Its checkout is here, not in the CLI build step,
      # because nothing else in this job reads it.
      - name: just test-ignored
        if: success() || failure()
        run: |
          git submodule update --init --depth 1 packages/cli/testing_workspaces/ros2_rust_examples
          source ./activate.sh
          just test-ignored

      # nextest never runs doctests, and `test-doc`'s only other caller is
      # `test-all`, which sits behind a fixture build. Needs no fixture, so it
      # rides here. Runs after a red `test-unit` too: a different question.
      - name: just test-doc
        if: success() || failure()
        run: |
          source ./activate.sh
          just test-doc

  # ----- per-feature clippy, host and cross -----
  #
  # `just check feature-sweep`: each crate's features one at a time over its
  # base set (~310 host runs), plus the embedded-only platform features built
  # for the board that ships them (~20 cross runs). Its own job because it is
  # well past the unit job's ceiling; scheduled because no merge lane can
  # afford it. See the recipe and `scripts/check-feature-sweep.py`.
  feature-sweep:
    name: per-feature clippy (host + cross)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    concurrency:
      group: host-tests-feature-sweep-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: just setup linux
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup linux
          # The CROSS half builds zpico-sys for a FreeRTOS and a ThreadX board,
          # which compile those kernels' sources; the board env names the port,
          # the store holds the tree.
          nros setup --source freertos-kernel --source lwip --source threadx --source threadx-netxduo
          # Issue 1987 — the STANDALONE `nros-board-threadx-qemu-riscv64` row
          # compiles that kernel for riscv64, and its port is newlib-only (it
          # swaps newlib's per-thread `_impure_ptr`, issue 0680). The image's
          # apt `riscv64-unknown-elf-gcc` ships picolibc and no newlib, so
          # without the pinned dist the build fell back to it and died on
          # `string.h`. The dist bundles newlib, and the build finds it in
          # the store before anything on PATH.
          nros setup --tool riscv-none-elf-gcc
          # ...and for the NuttX board, whose zpico build reads the CONFIGURED
          # kernel's generated `include/nuttx/config.h` (~2 min + ~30 s).
          nros setup qemu-armv7a-nuttx
          bash scripts/nuttx/build-nuttx.sh

      - name: just check feature-sweep
        run: |
          source ./activate.sh
          just check feature-sweep

  # ----- tier-1 gates: NOT here (issue 2141, 2026-11-11) -----
  #
  # This file ran `just ci tier1 gates` (= `just check`: cli-fresh, fast,
  # api-parity, probe-workspace-caps, build) as a two-shard `gates` job from
  # issue 1651 until issue 2141 removed it. It duplicated `gate.yml`'s
  # scheduled run, which is the gates' nightly verdict (02:00 UTC daily, and
  # on workflow_dispatch):
  #
  #   * build tier — both ran `just check build` under NROS_GATE_SCOPE=build,
  #     so one derivation gives one 75-test set (gate.yml splits it 1-3/3
  #     by measured weight, `.config/build-gate-weights.txt`).
  #   * fast tier  — gate.yml's `check-fast` runs scope `fast`: the same set
  #     plus `cxx-compat-shim-facilities` (`check-gate-lists --lane fast` vs
  #     `--lane build`).
  #   * api-parity, probe-workspace-caps — gate.yml's `check-fast-compile`.
  #   * the tier-1 coordinates this job exported are read by no fast or build
  #     gate (only by the `run` part, in run-matrix.yml).
  #
  # And it could not fit its runner: ~45 min of setup and bindings per shard
  # before any gate, then about 205 min of build-tier wall on 4 CPUs, so both
  # shards hit the 120-minute cap every night from 2026-10-29 while gate.yml's
  # three shards passed (dispatch 42848962439). Do not re-add it: a second run
  # of the same gates buys no coverage. The LOCAL `just ci` / `just ci tier1`
  # still run the gates (`check::default`).

  # phase-162 — the one lane that claims `rt-sched`. Executor levels on Linux
  # need `CAP_SYS_NICE` for `SCHED_FIFO` and `SCHED_DEADLINE`, and the job
  # container is granted it here (`--cap-add SYS_NICE`, plus an RT priority
  # limit) instead of by `sudo setcap` on each fixture. The job runs as root
  # inside it, so the launcher is `direct`: the tests run the binaries as they
  # are. Every other lane leaves `rt-sched` unclaimed, so there the three tests
  # are `[SKIPPED:lane]`.
  rt-sched:
    name: real-time levels (rt-sched)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    concurrency:
      group: host-tests-rt-sched-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_NICE --ulimit rtprio=99
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Restore CLI build cache (Phase 218)
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        uses: ./.github/actions/setup-nros-cli

      # `rmw_zenohd` comes from the declared system closure (the image carries
      # no zenoh packages; see nightly.yml's platform job).
      - name: Provision the declared system closure and the Linux scope
        run: |
          source ./activate.sh
          nros setup --system --sudo
          just setup linux

      - name: Build the levels-cpp fixtures
        run: |
          source ./activate.sh
          for id in workspace-cpp-native-levels workspace-cpp-native-levels-s1 \
                    workspace-cpp-native-levels-s1-flat workspace-cpp-native-levels-budget; do
            NROS_FIXTURE_ID="$id" scripts/build/workspace-fixtures-build.sh linux cpp
          done

      - name: Probe the granted scheduling
        run: |
          chrt -f 80 true && echo "SCHED_FIFO: granted"
          chrt -d --sched-runtime 2000000 --sched-deadline 10000000 \
               --sched-period 10000000 0 true && echo "SCHED_DEADLINE: granted"
          nproc

      - name: rt_sched_levels_e2e
        env:
          NROS_TEST_UNCLAIMED: ""
          NROS_RT_SCHED_LAUNCHER: direct
        run: |
          source ./activate.sh
          cargo nextest run -p nros-tests --test rt_sched_levels_e2e \
            --no-fail-fast --success-output immediate

  # ===== the build tier (was gate.yml's `check-build`, cron 02:00; phase-559 W7) =====
  #
  # `just check build` (the full compile tier), `just check no-std` and `just
  # check pristine-checkout`. gate.yml lost its `schedule` trigger in W7, so its
  # one daily job came here, beside the other daily host lanes, with its steps
  # unchanged. It gates nothing, and never did: on gate.yml the required `CI`
  # excused it on every merge-gating event, and `check-lane-contracts` forbids
  # it on one (it resolves artifacts no PR job builds). A red here is a daily
  # verdict on `main`, like every job in this file.
  #
  # SHARDED (issue 2223). One hosted runner's disk could not hold the lane:
  # every `build-serial` gate keeps its build tree until the job ends, and on
  # 2026-11-03 (run 41563531517) the step started with 44 G free and ended
  # with 292 K. Every scheduled run from 2026-10-29 was red. The job is now
  # three matrix entries on this ONE job id, and each runs one shard of
  # `just check build` (`NROS_BUILD_GATE_SHARD`, issue 2141's mechanism:
  # `scripts/build/gate-shard.py` puts every gate in exactly one shard). Each
  # shard therefore has its own 146 G disk.
  # `check-merge-group-gates` rule 5 refuses a shard spec whose matrix does not
  # list 1..n. `no-std` and `pristine-checkout` are not part of the lane and
  # run once, on the last shard.
  check-build:
    name: check / build tier + no-std [${{ matrix.shard }}/3] (daily + manual)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-22.04
    concurrency:
      group: host-tests-check-build-${{ matrix.shard }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    # Issue 1353 — no DWARF, as gate.yml's workflow-wide `env:` (this job came
    # from there in phase-559 W7). It is most of what the compile tier writes,
    # and nothing in the tier reads it.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_NROS_RELWITHDEBINFO_DEBUG: "0"
    # Longest successful run measured 2026-11-12: 132 min (n=17 over 3 shards, scheduled). Twice that, so a
    # stalled runner fails fast instead of holding the merge queue for 6 h.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Issue 2382 — the host's preinstalled toolchains, mounted so
      # `reclaim-disk.sh` can remove them (candidate 3 there). Without them
      # this job reclaimed only the tool cache and reached the gate runner's
      # 30 GiB floor with 29 GiB free (scheduled run 42739859713, all three
      # shards). The same list `host-tests.yml`'s gate shards mount, where the
      # reclaim measured 32,744 MB freed and 51 GiB free after, in 107-153 s
      # (scheduled run 42747790725).
      volumes:
        - /usr/local/lib/android:/__host-reclaim/android
        - /usr/share/dotnet:/__host-reclaim/dotnet
        - /usr/local/.ghcup:/__host-reclaim/ghcup
        - /opt/ghc:/__host-reclaim/ghc
        - /usr/share/swift:/__host-reclaim/swift
        - /usr/local/share/powershell:/__host-reclaim/powershell
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      # Setup below is the same as gate.yml `check-fast`'s, whose comments
      # explain each step (phase-489 W1 split one job into those siblings).
      - name: Cache sccache directory (compiling events)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sccache
          key: sccache-${{ runner.os }}-check-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-check-

      # phase-489 W5 — which CPU did this run land on? The same gate set has
      # measured 6.0 min and 12.2 min of busy CPU on hosted runners, every gate
      # 1.6-2.0x slower in the slow runs, and the log named no CPU model, so the
      # hardware explanation stayed a suspicion. Evidence only: no behaviour.
      - name: Report runner hardware
        run: scripts/ci/report-runner-hardware.sh

      - name: Configure sccache (compiling events)
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::warning::sccache absent from the image — the compile tier runs UNCACHED."
            exit 0
          fi
          sccache --version
          export SCCACHE_DIR=/tmp/sccache
          export SCCACHE_CACHE_SIZE=2G
          export SCCACHE_ERROR_LOG=/tmp/sccache-server.log
          export SCCACHE_LOG=warn
          if sccache --start-server >/tmp/sccache-start.log 2>&1; then
            {
              echo "SCCACHE_DIR=/tmp/sccache"
              echo "SCCACHE_ERROR_LOG=/tmp/sccache-server.log"
              echo "SCCACHE_LOG=warn"
              echo "SCCACHE_CACHE_SIZE=2G"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable — the compile tier runs UNCACHED (issue 0874)."
            sed 's/^/  /' /tmp/sccache-start.log || true
          fi

      # The one CLI build road (`.github/actions/setup-nros-cli`): binary cache
      # keyed on the whole source stamp, `just setup-cli`, the stamp assertion.
      - name: Build the in-tree nros CLI (every event)
        uses: ./.github/actions/setup-nros-cli
        with:
          launch-resolve: 'false'

      - name: Provision clang-format (pinned by [tool.clang-format])
        run: |
          source ./activate.sh
          just setup-clang-format

      - name: Provision Corrosion (pinned by [tool.corrosion])
        run: |
          source ./activate.sh
          just workspace install-corrosion

      - name: Provision compile-tier sources
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Fetch the pin baseline for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh provide

      - name: Init submodules whose pin moved (commits only)
        run: bash scripts/ci/pin-baseline.sh init-moved

      - name: Fetch submodule history for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh deepen

      - name: Build nros-launch-resolve (cli-tests and generate-bindings both shell out to it)
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          just setup-launch-resolve

      # `check-api-parity` has NO step of its own here, and that is now the
      # finished answer rather than a deferral — issue 1066, closed.
      #
      # (phase-489 W5: it has since left the fast LANE for the
      # `check-fast-compile` sibling, which runs it by name on every event
      # `check-fast` runs on. The history below is why it gates at all.)
      #
      # IT RUNS. `api-parity` came off `.config/gate-lane-exempt.txt` in
      # `565f8c74f`, so it is an ordinary fast-lane gate and `just check fast`
      # (the `check-fast` sibling) runs it on `pull_request`, `merge_group`, `push` and the
      # nightly alike. Measured in this container, run 34687504281 on
      # 2026-09-12:
      #
      #   check-fast: 319 gate(s) at -P4, busy 1542s over wall 386s
      #   slowest gate: api-parity, 217543 ms (14.1% of busy)
      #
      # That log line is also the image evidence. `api_parity/extract_cxx.py`
      # shells out to `clang -Xclang -ast-dump=json`, and this comment used to
      # say the image shipped none — true until `0c73d061b` added it and issue
      # 1201 fixed the build that had been failing to publish it since
      # 2026-09-04. A 217 s clang+rustdoc extraction that exits 0 is a stronger
      # statement about what the image contains than any `which clang` step.
      #
      # WHY NOT A DEDICATED STEP ANYWAY. The argument for one was a cleaner
      # verdict name (phase-421's `node_get_serialization_format` accessors
      # landed UNLEDGERED and nobody could see which gate would have said so).
      # It costs a second full extraction: 217 s SERIAL, against a lane whose
      # whole wall is 386 s because the gate runs inside it at -P4. A step that
      # adds 56% to the job's wall to rename a failure is the wrong trade;
      # `just check fast` already prints `[FAIL] api-parity` with the row key.
      #
      # WHAT THE PR LANE COULD NOT DO, and now can: the gate's only authored
      # inputs are `docs/reference/api-parity-ledger/` (one file per row) and
      # `docs/reference/api-surface/`, both under `docs/`, which the `code`
      # probe above classified as documentation. So a pull request whose ENTIRE
      # SUBJECT was the ledger skipped this job and got no parity verdict until
      # the merge queue. The probe now excepts those two paths — see its
      # comment. Same shape as the `colcon` filter's `gate.yml` entry: a filter
      # that excludes the thing under test.

      # phase-396 W1 — the build tier is NOT on the merge group.
      #
      # It was (phase-395, `197eef4fa`, "PR cheap, batch thorough"), and the
      # amortisation argument was right: pay for expensive verification once per
      # batch instead of once per push. What it missed is that `check-build` was
      # never RUNNABLE here. It ends with `linux::check`, which hard-requires
      # generated message bindings, and includes `check-source-gates`, which
      # asserts prebuilt `.compile-ok` fixtures. This job builds the CLI,
      # provisions sources, and stops — so neither exists, and the required
      # check failed for EVERY pull request, not for any one of them:
      #
      #   native check: 40 example(s) are missing their generated message bindings
      #   BuildFailed("Test fixture binary not prebuilt: …/platform_hdr_posix_cpp_heap/.compile-ok")
      #
      # A merge queue routes around a change-specific failure by ejecting the
      # culprit and re-testing the rest. It cannot route around a check that is
      # red before it sees your change: every entry is the culprit. Six merge
      # groups, three different authors, one failing job, nothing merged for a
      # day.
      #
      # So the required set is now exactly `ci-l1` — `check-fast` + `test-unit`,
      # the tier CLAUDE.md tells every agent to run before pushing, and the one
      # `check-lane-contracts` proves is fixture-free. A required check should be
      # the thing the contributor was told to run.
      #
      # WHAT THIS GIVES UP, plainly: the merge group no longer catches a
      # compile-tier break in the merged state. `post-submit.yml` catches it on
      # `main` minutes later — it already runs tier-2 fixtures and `just
      # ci-matrix` — and that is the standard three-bucket split (required =
      # cheap and deterministic; heavy = post-merge with a revert path). It is a
      # real reduction in pre-merge coverage, and still the right trade: a check
      # that has never once passed provides no coverage at all.
      #
      # Restoring it means giving this job the artifacts first (PR #14 adds
      # `build-compile-check-fixtures`; the bindings half is unowned). Do that
      # before putting the tier back, not after.
      # issue 0871 — `check-build` runs `check-source-gates`, whose tests ASSERT
      # a prebuilt `.compile-ok` stamp that nothing in this job builds. phase-396
      # W1 took the build tier OFF the merge group precisely because it was not
      # runnable here, and named this step as one half of what restoring it needs
      # ("PR #14 adds build-compile-check-fixtures; the bindings half is
      # unowned"). This is that half: the tier below can now at least get past
      # `check-source-gates` on the nightly/manual lane.
      #
      # Same condition as the step it feeds, deliberately — it exists only to
      # serve `check-source-gates` and must never run on the cheap PR path.
      #
      # `builder=cxx-syntax`, not the whole manifest: the `cargo-check` and
      # `cmake-configure` rows need `nros-launch-resolve` (and the in-tree CLI)
      # from `activate.sh`, which this job does not provision — an unfiltered run
      # FAILS on those and never reaches the rows the gate asserts. Measured: 2 s
      # filtered vs 428 s for everything.
      - name: build compile-check fixtures (check-source-gates asserts them)
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          just build-compile-check-fixtures cxx-syntax

      # issue 0898 — the OTHER artifact `check-build` asserts and this job never
      # produced. phase-396 W1 named both halves when it took the build tier off
      # the merge group: "PR #14 adds build-compile-check-fixtures; the bindings
      # half is unowned". This is the bindings half.
      #
      #   native check: 40 example(s) are missing their generated message bindings
      #
      # Example msg crates (`generated/<msg>/`) are build-time AND
      # ROS-version-dependent, so they are gitignored and never shipped. `just
      # check` deliberately refuses to sync them — that would couple a static
      # check to a live ROS environment and rewrite each example's
      # `[patch.crates-io]` — so it GATES instead and names this remedy. The gate
      # is right; the job simply never ran the remedy.
      #
      # Affordable because this image HAS ROS: measured 23 s on a humble host for
      # the whole tree, against the ~587 s tier it unblocks.
      # phase-489 W4 — restore what the verb wrote last time, then run the verb.
      # The cache ONLY pre-populates: `just generate-bindings` below still runs
      # and its own content-addressed freshness (the standalone `.sig` stamps,
      # the probe sidecars' `probe_inputs_key`) regenerates anything stale. Key
      # and cached paths come from ONE script; `check` refuses a cached path git
      # tracks. Measured: a tree with fresh sidecars runs the verb in ~10 s,
      # against 18.7-21.7 min from cold (the C/C++ metadata probes, not codegen).
      - name: Key the message-bindings cache on the verb's real inputs
        id: bindings-key
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          scripts/ci/bindings-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Restore the message bindings + probe sidecars (pre-populate only)
        id: bindings-cache
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.bindings-key.outputs.paths }}
          key: ${{ steps.bindings-key.outputs.key }}
          restore-keys: ${{ steps.bindings-key.outputs.restore-prefix }}

      - name: generate message bindings (linux::check asserts them)
        id: generate-bindings
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          just generate-bindings

      # Saved right after the verb, not at job end, so the entry holds exactly
      # what the verb produced. Skipped on an EXACT hit (the entry already says
      # this); a prefix hit saves, because the verb refreshed part of it.
      - name: Save the message bindings + probe sidecars
        if: ${{ steps.generate-bindings.outcome == 'success' && steps.bindings-cache.outputs.cache-hit != 'true' && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.bindings-key.outputs.paths }}
          key: ${{ steps.bindings-key.outputs.key }}

      # The `source /opt/ros/humble/setup.bash` below is load-bearing, not
      # boilerplate: `check-rmw-cyclonedds`'s from-msg targets run
      # msg_to_cyclone_idl.py at BUILD time, which imports rosidl_adapter from
      # /opt/ros. The configure-time probe only checks the converter script
      # EXISTS (issue-0196 class: probe narrower than the rule), so an
      # unsourced env fails at 80% of the build rather than at configure.
      # Issue 0993 — this lane was put on the pull-request path and TAKEN BACK
      # OFF, and the measurement is why. It is recorded here because the
      # obvious next person to try it will make the same estimate.
      #
      # The design was sound: `generate-bindings` and the compile-check fixtures
      # are its prerequisites, they live in THIS job, so widening three `if:`
      # guards gates the lane while it still resolves only artifacts the job
      # itself builds. Nothing joins the required set.
      #
      # The COST killed it. Measured 190 s wall locally at -P32 — and CI fans
      # out at **-P4**, where the same lane took ~37 minutes (16:27 -> 17:05 on
      # run 33654481082), `source-gates` alone 496 s. The `check` job went from
      # 18 to 42 minutes. A four-core runner is the number that matters, and a
      # 32-core dev box says nothing useful about it.
      #
      # It also surfaced three gates that FAIL in the container — `borrowed-e2e`,
      # `sched-dim-arms`, `source-gates` — and the nightly had been red on
      # `borrowed-e2e` since at least 2026-09-01 with nobody noticing, which is
      # issue 0993's whole thesis arriving on schedule. Filed separately; a lane
      # cannot start gating pull requests while it is already red.

      # ONE GATE PER STEP — issue 1040, measured 2026-09-05.
      #
      # These three shared a single `run:` block, and a `run:` block is `bash
      # -e`: the first non-zero command ends it. `check build` has been red on
      # this lane since 2026-09-01 (`workspace-all`, `workspace-features`), so
      # `check no-std` and `check api-parity` NEVER EXECUTED on any of the five
      # scheduled runs since they were wired here. The step reported one red for
      # three gates, and two of them had no verdict at all — issue 0952's
      # withdrawal class, one level down from the recipe that names it.
      #
      # That is worse than not wiring them: `grep -rl api-parity
      # .github/workflows/` now answers yes while the gate has still never run
      # in CI. A placement that cannot report is not a placement.
      #
      # `!cancelled()` on each is what makes the split work: GitHub skips later
      # steps after a failure only under the default `success()` condition.
      # Issue 1353 step 1 — the compile tier dies of `No space left on device`
      # and leaves an artifact that cannot say what filled the disk (often the
      # log is truncated mid-compile, because when the disk is gone the log has
      # nowhere to land either). These two reports bracket the step the issue
      # names. They never fail the job: a report that can break the lane it
      # reports on is worse than no report.
      - name: Disk report (before check build) — issue 1353
        if: ${{ !cancelled() }}
        run: scripts/ci/disk-report.sh "before just check build"

      # Issue 1353 step 3, phase-466 W4. Same script and same reasoning as
      # host-tests.yml, and it runs on the same events as the step it protects:
      # `check build` is the only thing in this job that has ever exhausted the
      # disk, and it is `schedule`/`workflow_dispatch` only.
      #
      # This lane's numbers are NOT known — the failure destroys its own job
      # log (run 35808783184: the before-report reported success and its output
      # was never uploaded), which is what the `::notice::`/step-summary channel
      # added to `disk-report.sh` is there to fix. So this step is headroom
      # bought against a measured cause on a sibling lane, not against a
      # measurement of this one, and the next scheduled run is what prices it.
      - name: Reclaim disk before the compile tier — issue 1353
        if: ${{ !cancelled() }}
        run: scripts/ci/reclaim-disk.sh "before just check build"

      # THE CHANNEL THAT SURVIVES — issue 1353, and the reason this step is
      # here rather than one upload at the end of the job.
      #
      # Measured on scheduled run 35945635228 / job 107462875362 (2026-09-24):
      # the two steps above both COMPLETED, and neither of the channels
      # phase-466 W4 gave them carried their numbers off the runner. The job's
      # annotations hold one entry — the runner's own `IOException`, written by
      # the service — and its three `::notice::` lines are absent; the run page
      # renders no job summary for it either. Both are runner-side buffers, so
      # they die with the runner, which is the only failure mode this lane has.
      #
      # An artifact does not: once THIS step finishes, the blob exists
      # server-side, and `just check build` can take the runner with it without
      # taking the measurement. That is why the upload is its own step placed
      # immediately after the reclaim, and why there is a second one after the
      # compile tier rather than a single `always()` upload at the end —
      # `always()` only binds while a runner is alive to honour it, which is
      # exactly what this failure removes.
      #
      # The transcript path has one home, `scripts/ci/disk-transcript.sh`,
      # which publishes it to `$GITHUB_ENV`; naming the variable here rather
      # than repeating the path is what keeps the upload pointing at the file
      # the scripts actually write.
      - name: Upload the disk transcript (before check build) — issue 1353
        if: ${{ !cancelled() && env.NROS_DISK_TRANSCRIPT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: disk-transcript-before-check-build-${{ matrix.shard }}
          path: ${{ env.NROS_DISK_TRANSCRIPT }}
          if-no-files-found: ignore
          retention-days: 7

      # Issue 2382: the `build` lane claims submodules and history; without
      # this step every shard stopped in the lane preflight, no gate run.
      - name: Provision what the build lane claims (submodules, history, sources)
        timeout-minutes: 12
        uses: ./.github/actions/provision-gate-lane
        with:
          lane: build

      - name: just check build (daily / manual)
        if: ${{ !cancelled() }}
        env:
          NROS_BUILD_GATE_SHARD: ${{ matrix.shard }}/3
          NROS_GATE_SCOPE: build
        run: |
          source ./activate.sh
          just check build

      # `always()`, not `!cancelled()`: the run that FAILED is the one whose
      # numbers matter, and the default `success()` would skip exactly it.
      - name: Disk report (after check build) — issue 1353
        if: ${{ always() }}
        run: scripts/ci/disk-report.sh "after just check build"

      # The second upload, and the one that matters most on 2026-09-24's
      # evidence: on that run `just check build` FAILED (a step verdict, step
      # 24) and the after-report SUCCEEDED (step 25) — the runner was alive and
      # writing — and it was `just check no-std`, the step below, that killed
      # it. So the transcript held both brackets' numbers and nothing could
      # read them. This carries the same file, now including the after-report,
      # before the step that has been doing the killing.
      #
      # It replaces rather than duplicates the artifact above, by name: a
      # separate name is deliberate, so a run that dies during the upload still
      # leaves the earlier artifact intact.
      - name: Upload the disk transcript (after check build) — issue 1353
        if: ${{ always() && env.NROS_DISK_TRANSCRIPT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: disk-transcript-after-check-build-${{ matrix.shard }}
          path: ${{ env.NROS_DISK_TRANSCRIPT }}
          if-no-files-found: ignore
          retention-days: 7

      - name: just check no-std (daily / manual)
        if: ${{ !cancelled() && matrix.shard == 3 }}
        run: |
          source ./activate.sh
          just check no-std

      # Issue 1373 — the fast tier must be green in a checkout with NO
      # submodules (what `git worktree add` produces). Behavioural, because a
      # census of "which gates read a submodule" measurably misses the gates
      # that build the path from parts. It builds a submodule-free clone, runs
      # `check fast` there as a person in a fresh worktree would (no CI
      # identity), and removes the clone on exit. `just ci gate` runs it locally
      # on every pre-push; here it is the nightly / manual signal that
      # `check-default-gates-run-somewhere` requires.
      - name: just check pristine-checkout (daily / manual)
        if: ${{ !cancelled() && matrix.shard == 3 }}
        run: |
          source ./activate.sh
          just check pristine-checkout
      - name: sccache stats (compile tier)
        if: ${{ always() }}
        run: |
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || true
          if [ -s /tmp/sccache-server.log ]; then
            echo "--- sccache server log (deduped) ---"
            { sort /tmp/sccache-server.log | uniq -c | sort -rn | head -25; } || true
          fi

  # ===== lane census (was lane-census.yml, cron 04:40; phase-559 W6) =====
  #
  # phase-475 W5 — the periodic lane census.
  #
  # Runs every nros-tests target in the gate lane's OWN image, twice, with nothing
  # staged, and compares what would be admitted with `.config/lane-admission/
  # gate.txt` — the list `test-lane-contracts` runs. It reports newly admissible
  # targets (a missed opportunity) and admitted targets that would no longer pass
  # (the gate goes red on those anyway — W4 — this names them sooner, with a
  # reason), and the missing-capability table for whoever owns the image.
  #
  # It fails ONLY on a TIMEOUT: a test that hangs instead of skipping is always a
  # defect. Everything else is information; failing on every new red would make
  # this a second gate nobody asked for.
  #
  # Provisions exactly what the gate's `check` job provisions before
  # `test-lane-contracts`, step for step, because the census is only a statement
  # about that environment.

  census:
    concurrency:
      group: host-tests-census-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The same road the gate job takes: `.github/actions/setup-nros-cli`.
      - name: Build the in-tree nros CLI (as the gate job does)
        uses: ./.github/actions/setup-nros-cli
        with:
          launch-resolve: 'false'

      # Both of these were missing here while the gate job ran them, so the
      # census measured a poorer environment than the lane it describes: on
      # 2026-10-29 `cmake_platform_matrix` failed here on "the pinned Corrosion
      # is not in the SDK store", while the same target passes in the gate.
      - name: Provision clang-format (as the gate job does)
        run: |
          source ./activate.sh
          just setup-clang-format

      - name: Provision Corrosion (as the gate job does)
        run: |
          source ./activate.sh
          just workspace install-corrosion

      - name: Provision compile-tier sources (as the gate job does)
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Census (2 runs, in this image)
        run: |
          # `tee` opens its file when the pipeline STARTS, before the script
          # creates its out dir — the first scheduled run (37182733460) measured
          # a clean census (0 FAIL, 0 TIMEOUT) and a red step from exactly that.
          mkdir -p census-out
          scripts/test/lane-census.sh --here census-out --runs 2 \
            --admit census-out/gate.txt | tee census-out/summary.txt

      - name: Compare with the committed admission list
        run: |
          python3 scripts/test/lane-census-diff.py \
            .config/lane-admission/gate.txt census-out/gate.txt \
            census-out/per-target.json | tee census-out/diff.txt
          { echo '```'; cat census-out/summary.txt census-out/diff.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the census
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lane-census
          path: census-out/
          retention-days: 14

  # ===== book probes (was probe.yml, cron 08:00; phase-559 W6) =====
  #
  # The book's setup flow, EXECUTED — issue 1107 / phase-452 W3.
  #
  # `just probe` has existed since issue 0204 and no workflow ran it. The
  # `probe=NN` blocks in the book are extracted and run verbatim in pristine
  # containers, which is the difference between a page that has been proofread
  # and a page that has been executed — and the book is the one surface where
  # being wrong is REPLICATED rather than merely observed, because a new user
  # copies it.
  #
  # Both front doors, because they are two different machines:
  #
  #   * the CHECKOUT track — clone + bootstrap, then the first-node chapter.
  #     What everyone does until a release is cut.
  #   * the INSTALLED track — build the asset `release-nros.yml` would publish,
  #     install it into a second pristine container with nothing else mounted,
  #     and run `first-project.md` on a host with NO checkout: the book's first
  #     chapter (an mps2-an385 talker on QEMU over a serial link, `nros run`,
  #     then `ros2 topic echo`), timed from the first `nros setup` against the
  #     30-minute field budget (phase-525 W4). The Linux multi-node chapter is
  #     the `linux` track, replayed weekly by weekly.yml.
  #     The released `nros` could once build nothing and nothing noticed, because
  #     every host that ran it had a checkout the SDK-root ladder reached first.
  #
  # NOT on pull_request, and not in a merge-gating lane: ~30-60 min per track
  # cold. Schedule plus dispatch, the `check-build` placement, for the same
  # reason — a lane nobody can afford per push gets skipped, which is worse than
  # a smaller one that runs.
  #
  # The two tracks are SEPARATE JOBS rather than one `just probe bootstrap` so a
  # failure names which front door broke; run serially, the second never reports
  # when the first is red.

  checkout-track:
    concurrency:
      group: host-tests-checkout-track-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    name: book probe — checkout track
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # `just` is not on a bare `ubuntu-latest` runner, and this is the one
      # workflow that does not run inside `ghcr.io/newslabntu/nano-ros-ci`,
      # which is where every other lane gets it from. It cannot run there: the
      # probe drives `docker run` itself (`scripts/probe/run-bootstrap-probe.sh`
      # asserts a host `docker`), so it needs the runner rather than a
      # container. Without this step both jobs died with `just: command not
      # found` and exit 127 on this workflow's first scheduled run, before
      # either probe container started.
      #
      # The `~/.local/bin` destination is the one a contributor's checkout
      # uses, so PATH reads the same way.
      - name: Install just (if absent)
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            # issue 1760 — the pinned, checksummed release asset, retried on
            # every error class; never a piped installer script.
            bash scripts/ci/install-just.sh --to "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: just probe checkout
        env:
          # `actions/checkout` leaves a DETACHED HEAD, and the probe refuses
          # one by design ("set PROBE_BRANCH to a branch/tag to clone") rather
          # than guessing which tree to test. Naming the ref is what makes the
          # container clone the commit under test.
          PROBE_BRANCH: ${{ github.ref_name }}
        run: |
          source ./activate.sh
          just probe checkout

  installed-track:
    concurrency:
      group: host-tests-installed-track-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    name: book probe — installed track
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # See the checkout track above for why this lane installs `just` itself.
      - name: Install just (if absent)
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            # issue 1760 — the pinned, checksummed release asset, retried on
            # every error class; never a piped installer script.
            bash scripts/ci/install-just.sh --to "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: just probe installed
        env:
          PROBE_BRANCH: ${{ github.ref_name }}
        run: |
          source ./activate.sh
          just probe installed

  # RFC-0127 D7, phase-551 W5 — the `image` track. The newest released
  # starter image is pulled (timed), held to its size budget, and the book's
  # newcomer steps (book/src/start/starter-image.md) run in it with no
  # network; `latest` moves to it only when all of that passes
  # (scripts/ci/starter-latest.sh). A release's own job never moves `latest`
  # (starter-image.yml), so a starter is `latest` within a day of its
  # release, and only once probed.
  image-track:
    concurrency:
      group: host-tests-image-track-${{ github.ref }}
      cancel-in-progress: false
    name: image probe — starter
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Probe the newest starter, then move latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/starter-latest.sh
