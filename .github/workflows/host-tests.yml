# Host-test tier (CI reorg / phase-253) — the host-side regression net.
#
# Folds the two host suites into one tier file (separate jobs, separate
# concurrency, and neither cancels — both must complete):
#   - unit        : `just test-unit` — workspace unit tests
#                   (`cargo nextest --workspace --exclude nros-tests`),
#                   then `just test-ignored` (issue 1507) and
#                   `just test-doc` (doctests, both workspaces).
#   - feature-sweep : `just check feature-sweep` — per-feature clippy.
#   - (no gates job: `just check` runs in gate.yml's schedule, issue 2141)
#   - rt-sched    : `rt_sched_levels_e2e` (phase-162) in a container granted
#                   `SYS_NICE`, the only lane that claims `rt-sched`.
#
# Tier 1's OTHER half — `just build-test-fixtures lane=tier1` + `just ci tier1
# run` (preconditions + rust-rtos-link-check + `test-all`) — is NOT here. It
# was the `integration` job until issues 1684/1685, and it lives in
# `run-matrix.yml`'s `tier1` job on the self-hosted runner now, because this
# runner cannot hold it:
#
#   * DISK. The job built a hand-picked fixture SUBSET (rust core + workspace
#     fixtures, the ~52 G of extras left out for this 146 G disk) and then ran
#     `test-all` over the whole tier-1 lane with `NROS_SKIP_FIXTURE_CHECK=1`:
#     199 of 214 real failures were "fixture binary MISSING for an in-lane
#     coordinate" (run 37252649866). Building what the lane asserts was
#     measured at +37 G for the linux half ALONE (unfinished, 32 cores), +39 G
#     for the whole tier, against ~16 G free here.
#   * PROVISIONING. Tier 1 covers Zephyr native_sim and ThreadX-Linux, which
#     `just setup linux` does not provision: 81 undeclared capability skips.
#
# The self-hosted runner already carries the Zephyr SDK and the disk for
# tier 2; tier 1 runs there after it.
#
# Nightly (03:00 UTC) + on-demand ONLY — never per push (a per-push run was
# cancelled by the next push and never completed: #57, and again 26 of 29 push
# runs to 2026-10-03). See docs/development/ci-workflow-reorg.md.
#
# EVERY step that invokes `just` or `nros` sources `./activate.sh` first. That is
# the repo's activation SSoT and CLAUDE.md's sweep contract; three steps here
# used to source `/opt/ros/humble/setup.bash` alone and six sourced nothing.
# activate.sh is a strict superset of the ROS line — it sources ROS itself
# (nounset-guarded, issue 0639) and additionally exports `nano_ros_ROOT`, which
# is how `find_package(nano_ros)` resolves: the config lives at the checkout
# root, not in a CMake prefix. Without it the workspace fixture build died at
#
#   CMake Error at CMakeLists.txt:23 (find_package):
#     ... CMake did not find one.
#
# for every generated workspace root, because a generated root deliberately sets
# no prefix. activate.sh only ever PREPENDS to PATH, so the `$GITHUB_PATH`
# entries earlier steps add (the in-tree CLI) survive it.
name: host-tests

on:
  # phase-395 — POST-merge, not pre-merge. This lane needs ROS on the runner and
  # its two jobs failed on every pull request; a red that is STRUCTURAL is not a
  # gate, it is the noise that teaches people to ignore CI. It gates nothing
  # (only `check` is required), so running it per-PR bought no safety and cost a
  # concurrent runner on every agent push.
  #
  # SCHEDULE-ONLY since 2026-10-03. It ran on `push` to main to bound a
  # regression to one commit, and that bought nothing measurable: of the last
  # 29 push runs, 26 were CANCELLED, 1 failed and 2 passed. The cause is not
  # `cancel-in-progress` — the integration job already had it `false` — but
  # GitHub's concurrency model: a group keeps ONE pending run, so each merge
  # that arrived while a run was in flight replaced the one waiting. With the
  # merge queue landing faster than this lane's 45-150 min, almost no commit
  # was ever measured. `run-matrix.yml` moved to a schedule for the same reason;
  # the header above has said "NOT every direct push" since #57, and the
  # trigger contradicted it. One run a night that FINISHES is a verdict;
  # twenty-six that do not are noise.
  #
  # Bounding a regression is now a bisect over one day's merges, which the
  # queue keeps linear. `workflow_dispatch` answers "is THIS commit good" on
  # demand.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # ----- workspace unit tests (cheap; cancel-on-PR) -----
  unit:
    name: workspace unit tests
    runs-on: ubuntu-22.04
    # Issue 1492 — the ceiling argument (it was made first for the retired
    # tier-1 `integration` job, issues 1684/1685), with
    # a real margin, because here the healthy duration IS measured. This job
    # succeeds: 8 m 21 s, 10 m 23 s and 11 m 13 s on the three most recent runs
    # that were not superseded (2026-09-25). 45 is four times the worst of
    # those and still an eighth of the default it replaces. It has never
    # wedged; this is what a bound costs when nothing is wrong.
    timeout-minutes: 45
    # Per-job concurrency, one group per job; neither cancels.
    concurrency:
      group: host-tests-unit-${{ github.ref }}-${{ github.event_name }}
      # Schedule + dispatch only, so nothing supersedes: a nightly run that
      # finishes is the whole point of the lane (see `on:`).
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      # RESTORE here, SAVE right after the build below — deliberately split.
      #
      # `actions/cache` saves in a POST step, at job end. By then this job has
      # run `just setup linux`, built fixtures and run `just ci tier1`, and all
      # of them write into `packages/cli/target` too. So the entry stored is not
      # "the CLI build" but "whatever the whole job left behind".
      #
      # Measured on the live cache: eight `nros-cli-*` entries at 138 MB and ONE
      # at 5 571 MB, the big one on `refs/heads/main` — the branch where the job
      # runs to completion instead of being cancelled early. That single entry
      # was 56 % of the repository's 10 GB Actions cache limit, which is why
      # `gate.yml`'s sccache (1 GB, and the required PR check depends on it) had
      # no headroom.
      #
      # Splitting restore from save bounds the entry to what the CLI build
      # actually produces, which is the 138 MB the cancelled jobs already show.
      - name: Restore CLI build cache (Phase 218)
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          cargo build --release --manifest-path packages/cli/Cargo.toml --bin nros
          # phase-429 W5 — ASSERT the binary matches the checkout, do not hope.
          # The CLI cache key is narrower than `source_stamp.rs`'s watch set
          # (it misses `.jinja`, `cli-source-dirs.txt`, the out-of-tree crate
          # dirs and the `play_launch` pin), so an exact-key hit exists for a
          # tree whose stamp has moved. Fresh-checkout mtimes usually make
          # cargo rebuild; usually is not a guarantee, and a binary emitting
          # code the runtime did not expect is what RFC-0090 exists to stop.
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      # SAVE NOW, before anything else writes into this directory. See the
      # restore step above for the measurement. `if: always()` is deliberately
      # NOT set: a failed CLI build leaves a target dir that should not become
      # the entry every later run restores from.
      - name: Save CLI build cache (Phase 218)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}

      # phase-413 W5 — the scope verb.
      # `just setup linux` expands to `nros setup --build-sources` and
      # `just ci provision-zenohd`, which is exactly what this job spelled out,
      # plus the CLI/resolver and the host facts every tier asserts.
      #
      # It also fetches qemu and the XRCE agent, which the unit tests do not
      # use. That is the price of one vocabulary: a job body is
      # `just setup <scope>` plus one command, and both are prebuilt tarball
      # fetches from the index rather than source builds.
      - name: just setup linux
        run: |
          source ./activate.sh
          just setup linux

      - name: just test-unit
        run: |
          source ./activate.sh
          just test-unit

      # Issue 1507 — the `#[ignore]`d tests, both cargo workspaces. They need
      # no fixture, so they ride the job that already has the toolchain and the
      # CLI, ~1 min on top. Before this, the only lanes naming `test-ignored`
      # were tier 3 (no workflow runs it) and the tier-2 nightly, which has not
      # reached that step since it went red at `just build tier2-nightly` — so
      # an ignored test rotted unseen, and four had. Runs after a red
      # `test-unit` too: the two answer different questions.
      # `colcon_flag_parity` (phase-526 W3) compares `nros` against colcon over
      # the ros2_rust_examples workspace, and asserts the submodule is populated
      # rather than skipping. Its checkout is here, not in the CLI build step,
      # because nothing else in this job reads it.
      - name: just test-ignored
        if: success() || failure()
        run: |
          git submodule update --init --depth 1 packages/cli/testing_workspaces/ros2_rust_examples
          source ./activate.sh
          just test-ignored

      # nextest never runs doctests, and `test-doc`'s only other caller is
      # `test-all`, which sits behind a fixture build. Needs no fixture, so it
      # rides here. Runs after a red `test-unit` too: a different question.
      - name: just test-doc
        if: success() || failure()
        run: |
          source ./activate.sh
          just test-doc

  # ----- per-feature clippy, host and cross -----
  #
  # `just check feature-sweep`: each crate's features one at a time over its
  # base set (~310 host runs), plus the embedded-only platform features built
  # for the board that ships them (~20 cross runs). Its own job because it is
  # well past the unit job's ceiling; scheduled because no merge lane can
  # afford it. See the recipe and `scripts/check-feature-sweep.py`.
  feature-sweep:
    name: per-feature clippy (host + cross)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    concurrency:
      group: host-tests-feature-sweep-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: just setup linux
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup linux
          # The CROSS half builds zpico-sys for a FreeRTOS and a ThreadX board,
          # which compile those kernels' sources; the board env names the port,
          # the store holds the tree.
          nros setup --source freertos-kernel --source lwip --source threadx --source threadx-netxduo
          # Issue 1987 — the STANDALONE `nros-board-threadx-qemu-riscv64` row
          # compiles that kernel for riscv64, and its port is newlib-only (it
          # swaps newlib's per-thread `_impure_ptr`, issue 0680). The image's
          # apt `riscv64-unknown-elf-gcc` ships picolibc and no newlib, so
          # without the pinned dist the build fell back to it and died on
          # `string.h`. The dist bundles newlib, and the build finds it in
          # the store before anything on PATH.
          nros setup --tool riscv-none-elf-gcc
          # ...and for the NuttX board, whose zpico build reads the CONFIGURED
          # kernel's generated `include/nuttx/config.h` (~2 min + ~30 s).
          nros setup qemu-armv7a-nuttx
          bash scripts/nuttx/build-nuttx.sh

      - name: just check feature-sweep
        run: |
          source ./activate.sh
          just check feature-sweep

  # ----- tier-1 gates: NOT here (issue 2141, 2026-11-11) -----
  #
  # This file ran `just ci tier1 gates` (= `just check`: cli-fresh, fast,
  # api-parity, probe-workspace-caps, build) as a two-shard `gates` job from
  # issue 1651 until issue 2141 removed it. It duplicated `gate.yml`'s
  # scheduled run, which is the gates' nightly verdict (02:00 UTC daily, and
  # on workflow_dispatch):
  #
  #   * build tier — both ran `just check build` under NROS_GATE_SCOPE=build,
  #     so one derivation gives one 75-test set (gate.yml splits it 1-3/3
  #     by measured weight, `.config/build-gate-weights.txt`).
  #   * fast tier  — gate.yml's `check-fast` runs scope `fast`: the same set
  #     plus `cxx-compat-shim-facilities` (`check-gate-lists --lane fast` vs
  #     `--lane build`).
  #   * api-parity, probe-workspace-caps — gate.yml's `check-fast-compile`.
  #   * the tier-1 coordinates this job exported are read by no fast or build
  #     gate (only by the `run` part, in run-matrix.yml).
  #
  # And it could not fit its runner: ~45 min of setup and bindings per shard
  # before any gate, then about 205 min of build-tier wall on 4 CPUs, so both
  # shards hit the 120-minute cap every night from 2026-10-29 while gate.yml's
  # three shards passed (dispatch 42848962439). Do not re-add it: a second run
  # of the same gates buys no coverage. The LOCAL `just ci` / `just ci tier1`
  # still run the gates (`check::default`).

  # phase-162 — the one lane that claims `rt-sched`. Executor levels on Linux
  # need `CAP_SYS_NICE` for `SCHED_FIFO` and `SCHED_DEADLINE`, and the job
  # container is granted it here (`--cap-add SYS_NICE`, plus an RT priority
  # limit) instead of by `sudo setcap` on each fixture. The job runs as root
  # inside it, so the launcher is `direct`: the tests run the binaries as they
  # are. Every other lane leaves `rt-sched` unclaimed, so there the three tests
  # are `[SKIPPED:lane]`.
  rt-sched:
    name: real-time levels (rt-sched)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    concurrency:
      group: host-tests-rt-sched-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_NICE --ulimit rtprio=99
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Restore CLI build cache (Phase 218)
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        uses: ./.github/actions/setup-nros-cli

      # `rmw_zenohd` comes from the declared system closure (the image carries
      # no zenoh packages; see nightly.yml's platform job).
      - name: Provision the declared system closure and the Linux scope
        run: |
          source ./activate.sh
          nros setup --system --sudo
          just setup linux

      - name: Build the levels-cpp fixtures
        run: |
          source ./activate.sh
          for id in workspace-cpp-native-levels workspace-cpp-native-levels-s1 \
                    workspace-cpp-native-levels-s1-flat workspace-cpp-native-levels-budget; do
            NROS_FIXTURE_ID="$id" scripts/build/workspace-fixtures-build.sh linux cpp
          done

      - name: Probe the granted scheduling
        run: |
          chrt -f 80 true && echo "SCHED_FIFO: granted"
          chrt -d --sched-runtime 2000000 --sched-deadline 10000000 \
               --sched-period 10000000 0 true && echo "SCHED_DEADLINE: granted"
          nproc

      - name: rt_sched_levels_e2e
        env:
          NROS_TEST_UNCLAIMED: ""
          NROS_RT_SCHED_LAUNCHER: direct
        run: |
          source ./activate.sh
          cargo nextest run -p nros-tests --test rt_sched_levels_e2e \
            --no-fail-fast --success-output immediate
