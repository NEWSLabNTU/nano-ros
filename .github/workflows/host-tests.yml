# Host-test tier (CI reorg / phase-253) — the host-side regression net.
#
# Folds the two host suites into one tier file (separate jobs, separate
# concurrency so the cheap unit lane can cancel-on-PR while the heavy
# integration lane always completes):
#   - unit        : `just test-unit` — workspace unit tests
#                   (`cargo nextest --workspace --exclude nros-tests`).
#   - integration : `just test-integration` — the nros-tests crate (QEMU/Zephyr/
#                   ROS-interop groups excluded), the scaffold/launch/codegen net.
#
# Medium/heavy lanes: PR (path-scoped) + nightly + on-demand — NOT every direct
# push to main (a per-push run was cancelled by the next push within ~10 min and
# never completed; #57 root). See docs/development/ci-workflow-reorg.md.
#
# EVERY step that invokes `just` or `nros` sources `./activate.sh` first. That is
# the repo's activation SSoT and CLAUDE.md's sweep contract; three steps here
# used to source `/opt/ros/humble/setup.bash` alone and six sourced nothing.
# activate.sh is a strict superset of the ROS line — it sources ROS itself
# (nounset-guarded, issue 0639) and additionally exports `nano_ros_ROOT`, which
# is how `find_package(nano_ros)` resolves: the config lives at the checkout
# root, not in a CMake prefix. Without it the workspace fixture build died at
#
#   CMake Error at CMakeLists.txt:23 (find_package):
#     ... CMake did not find one.
#
# for every generated workspace root, because a generated root deliberately sets
# no prefix. activate.sh only ever PREPENDS to PATH, so the `$GITHUB_PATH`
# entries earlier steps add (the in-tree CLI, play_launch_parser) survive it.
name: host-tests

on:
  # phase-395 — POST-merge, not pre-merge. This lane needs ROS on the runner and
  # its two jobs failed on every pull request; a red that is STRUCTURAL is not a
  # gate, it is the noise that teaches people to ignore CI. It gates nothing
  # (only `check` is required), so running it per-PR bought no safety and cost a
  # concurrent runner on every agent push.
  #
  # `push` to main rather than schedule-only: this is L2, and bounding a
  # regression to one commit is most of what post-submit is for. It comes back
  # pre-merge when a self-hosted runner can actually satisfy it (W6).
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - "cmake/**"
      - "zephyr/cmake/**"
      - "nros-sdk-index.toml"
      - ".github/workflows/host-tests.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # ----- workspace unit tests (cheap; cancel-on-PR) -----
  unit:
    name: workspace unit tests
    runs-on: ubuntu-22.04
    # Per-job concurrency: the cheap unit lane supersedes its older PR run; the
    # heavy integration lane below uses its own group (cancel: false).
    concurrency:
      group: host-tests-unit-${{ github.ref }}-${{ github.event_name }}
      # Was keyed on `pull_request`, which this workflow no longer fires on —
      # the condition would have been permanently false, silently disabling
      # superseding. On push-to-main superseding is CORRECT: post-submit asks
      # "is main good now", so a newer commit's answer subsumes an older one's.
      cancel-in-progress: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Cache CLI build (Phase 218)
        uses: actions/cache@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          cargo build --release --manifest-path packages/cli/Cargo.toml --bin nros
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      - name: Provision workspace sources via nros
        run: |
          source ./activate.sh
          nros setup --source px4-rs --source zenoh-pico --source mbedtls \
                     --source micro-cdr --source micro-xrce-dds-client \
                     --source cyclonedds-src

      # The workspace unit suite includes nros-rmw-zenoh's `status_events_matrix`,
      # which opens a client-mode session against a local zenohd.
      #
      # `just zenohd setup` used to build the VENDORED router. RFC-0075 /
      # phase-362 deleted it (`build/zenohd/` is gone) and the router became
      # ROS's own `rmw_zenohd`, but this step was left behind. The top-level
      # recipe is `zenohd locator="tcp/..."`, so `setup` was being passed as a
      # LOCATOR — the step could not have worked, and host-tests has been red on
      # it. `check-just-recipe-refs` did not catch it because it reads
      # `just/*.just` and never `.github/workflows/`.
      #
      # Install the router ROS itself ships. If it is unavailable the zenoh
      # lanes SKIP and announce it (`check-zenohd-router-skips` enforces that
      # they can), which is a worse result than running them but a far better
      # one than a job that always fails.
      - name: just ci provision-zenohd
        run: |
          source ./activate.sh
          just ci provision-zenohd

      - name: just test-unit
        run: |
          source ./activate.sh
          just test-unit

  # ----- nros-tests integration (heavy; always completes) -----
  integration:
    name: nros-tests integration (host)
    runs-on: ubuntu-22.04
    concurrency:
      group: host-tests-integration-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Cache CLI build (Phase 218)
        uses: actions/cache@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Build nros CLI from packages/cli/ (Phase 218)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          cargo build --release --manifest-path packages/cli/Cargo.toml --bin nros
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      - name: Provision workspace sources via nros
        run: |
          source ./activate.sh
          nros setup --source px4-rs --source zenoh-pico --source mbedtls \
                     --source micro-cdr --source micro-xrce-dds-client \
                     --source cyclonedds-src --source nuttx-libc

      # `test-integration` spawns zenohd to back the Phase 211/212 host tests.
      - name: just ci provision-zenohd
        run: |
          source ./activate.sh
          just ci provision-zenohd

      # Test prerequisites the way a user gets them — via `nros setup` (#25): the
      # patched qemu-system-arm (build/qemu/), the prebuilt Micro-XRCE-DDS Agent
      # (nros store), and play_launch_parser (launch-graph tool; best-effort).
      - name: Provision QEMU + XRCE agent + play_launch_parser (nros setup --tool)
        run: |
          source ./activate.sh
          nros setup --tool qemu --prefix "$GITHUB_WORKSPACE/build/qemu" --index nros-sdk-index.toml
          nros setup --tool xrce-agent --index nros-sdk-index.toml
          nros setup --tool play_launch_parser --index nros-sdk-index.toml \
            || echo "play_launch_parser unavailable — workspace-entry fixtures [SKIPPED]"
          plp_bin="$(dirname "$(find "$HOME/.nros/sdk/play_launch_parser" -type f -name play_launch_parser -path '*/bin/*' 2>/dev/null | head -1)")"
          [ -n "$plp_bin" ] && echo "$plp_bin" >> "$GITHUB_PATH" || true

      # `nros sync` resolves SystemModels by shelling out to `nros-launch-resolve`,
      # which it looks for NEXT TO the `nros` binary (issue 0285 — absolute path,
      # never $PATH). Without it every fixture build dies at the sync step:
      #
      #   Error: sync: 9 SystemModel(s) need resolving but `nros-launch-resolve`
      #          is not next to the `nros` binary
      #
      # Only `nightly.yml` provisioned it, so this lane had been red for at least
      # ten consecutive runs — both fixture builds failing, both failures
      # swallowed (see below), and 296 tests then skipping for fixtures that were
      # never built.
      - name: Build nros-launch-resolve (nros sync needs it beside the CLI)
        run: |
          source ./activate.sh
          just setup-launch-resolve

      # The native integration tests spawn PREBUILT example binaries via
      # `require_prebuilt_binary`. Stage them by building the fixtures the way a
      # user does. Issue #29 — split into per-stage steps with `df` checkpoints
      # (a build that fills the shared ~146 GB disk kills the agent + discards the
      # step's log); `build-fixture-rust-core` only (+17 GB), extras (~52 GB) NOT
      # run (would starve test-integration → ENOSPC). CI-build env scoped to the
      # fixture steps only (never the job — test-integration asserts on symbols).
      - name: Build rust core fixtures
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          RUSTFLAGS: "-C debuginfo=0"
          # Issue #57 Cause-1: cap the fixture builder's rustc fan-out — the
          # 2-vCPU / 7 GB runner OOM-kills rustc mid-compile otherwise.
          NROS_BUILD_JOBS: "2"
          CARGO_BUILD_JOBS: "2"
        run: |
          source ./activate.sh
          mkdir -p build/ci-logs
          echo "before:"; df -h / | tail -1
          # FAIL, do not swallow. This used to end `|| { tail; echo "partial —
          # [SKIPPED]"; }`, so a build that died at line one reported the step as
          # SUCCESS; the tests then skipped for absent fixtures and the run blamed
          # a skip budget. Ten runs of a green step over a failed build.
          # `check-skip-budget` (issue 0584) rejects exactly this laundering — a
          # missing in-lane fixture is a hard failure — so the swallow could only
          # ever produce a red whose stated reason was wrong.
          just native build-fixture-rust-core > build/ci-logs/rust-core.log 2>&1 \
            || { echo "::group::rust-core FAILED tail"; tail -120 build/ci-logs/rust-core.log; echo "::endgroup::"; exit 1; }
          echo "after rust-core ($(wc -l < build/ci-logs/rust-core.log) lines suppressed):"; df -h / | tail -1

      - name: Build workspace fixtures
        env:
          # NB (issue #71): do NOT add `CARGO_PROFILE_RELEASE_LTO: "off"` here. The
          # native C++/mixed workspace Entry links two Rust staticlibs that each
          # bundle `std`; the FFI crate's `lto = true` DCE-strips the redundant
          # `rust_begin_unwind`. Forcing LTO off keeps it → `multiple definition`.
          RUSTFLAGS: "-C debuginfo=0"
          NROS_BUILD_JOBS: "2"
          CARGO_BUILD_JOBS: "2"
        run: |
          source ./activate.sh
          just native build-workspace-fixtures > build/ci-logs/workspace.log 2>&1 \
            || { echo "::group::workspace FAILED tail"; tail -120 build/ci-logs/workspace.log; echo "::endgroup::"; \
                 echo "::group::issue 0919 — feature resolution for zpico-sys"; \
                 for ws in bridge-cyclonedds rust; do \
                   echo "--- examples/workspaces/$ws"; \
                   ( cd "examples/workspaces/$ws" 2>/dev/null \
                     && cargo tree -e features -i zpico-sys --offline 2>&1 | head -40 ) || true; \
                   echo "--- $ws generated selection crate"; \
                   cat "examples/workspaces/$ws/generated/nros-selection/native_entry/Cargo.toml" 2>/dev/null | grep -v '^#' | grep . || true; \
                   echo "--- $ws generated entry root"; \
                   cat "examples/workspaces/$ws/build/posix-zenoh/native_entry/Cargo.toml" 2>/dev/null | grep -v '^#' | grep . || true; \
                 done; \
                 echo "::endgroup::"; \
                 exit 1; }
          echo "after workspace ($(wc -l < build/ci-logs/workspace.log) lines suppressed):"; df -h / | tail -1

      # phase-407 — run the TIER, not a hand-rolled approximation of it.
      #
      # This lane built `native build-fixture-rust-core` + `build-workspace-
      # fixtures` and then `just test-integration`, which is roughly tier 1 —
      # and "roughly" is the problem: `check-tier-has-ci-owner` found Tier1
      # declared in the RFC-0061 ladder and invoked by NO workflow, so the
      # tier's definition and this lane's behaviour could drift with nothing
      # to notice. `just ci tier1` is preconditions + check +
      # rust-rtos-link-check + test-all, narrowed to the tier-1 coordinates.
      #
      # The fixture builds above stay: the tier ASSERTS its preconditions, it
      # does not provision them.
      - name: just ci tier1
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          source ./activate.sh
          mkdir -p build/ci-logs
          set +e
          just ci tier1 > build/ci-logs/ci-tier1.log 2>&1
          rc=$?
          set -e
          echo "::group::ci tier1 output (tail)"; tail -200 build/ci-logs/ci-tier1.log; echo "::endgroup::"
          exit $rc

      - name: Report skipped fixtures (post-run)
        if: always()
        run: |
          if [ -f target/nextest/default/junit.xml ]; then
            echo "::group::skipped fixtures"
            grep -E '<skipped|\[SKIPPED\]' target/nextest/default/junit.xml \
              | head -100 || echo "(no skips recorded)"
            echo "::endgroup::"
          else
            echo "(no junit.xml — test-integration may have failed before any test ran)"
          fi

      - name: Upload nextest JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-integration-tests-junit
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore
          retention-days: 7
