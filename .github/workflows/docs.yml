name: docs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "packages/api/nros/**"
      - "packages/core/nros-rmw/**"
      - "packages/core/nros-rmw-abi/**"
      - "packages/platform/nros-platform-api/**"
      - "packages/platform/nros-platform-cffi/**"
      - "packages/platform/nros-platform-posix/**"
      - "packages/api/nros-c/include/**"
      - "packages/api/nros-c/Doxyfile"
      - "packages/api/nros-c/docs/**"
      - "packages/api/nros-cpp/include/**"
      - "packages/api/nros-cpp/Doxyfile"
      - "book/rustdoc-driver/**"
      - "packages/rmw/zenoh/nros-rmw-zenoh/src/**"
      - "packages/rmw/xrce/nros-rmw-xrce/src/**"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

# Pages deploys must not be interrupted mid-flight — don't cancel an in-progress
# deploy (unlike the check lanes); just serialize.
concurrency:
  group: deploy-book
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4
        # The book deploy only needs the repository sources used by mdBook,
        # rustdoc, and Doxygen. Do not fetch every submodule here: several
        # platform/runtime submodules are large, target-specific, and may
        # temporarily point at fork-only commits while development branches are
        # being synchronized. Recursive checkout makes an otherwise unrelated
        # book deploy fail before docs build starts.
        # phase-262: the rustdoc-driver no longer pulls nros-cli-core (nros-macros
        # now deps the nros-pkg-index / nros-launch-parser leaf crates, not the
        # whole CLI), so no ros-launch-resolve submodule init is needed here.

      # phase-422 W2 — the VERSION comes from the index, which is the pin.
      # This said `mdbook-version: "latest"`, a second and unpinned mechanism
      # for the tool `[tool.mdbook]` pins: the book could build against a
      # different mdBook than any contributor runs, and a breaking upstream
      # release would land here with no commit.
      #
      # The action still does the download — resolving through
      # `nros setup --tool mdbook` would mean building the CLI in a docs-only
      # job, which is a real cost for no extra correctness once the version is
      # read from the same place.
      - name: Resolve the pinned mdBook version from the index
        id: mdbook_pin
        run: |
          # awk, not a heredoc: a heredoc terminator must sit at column 0, and
          # column 0 inside a YAML `run:` block is parsed as SYNTAX. Verified
          # the heredoc form fails ("unexpected EOF") before choosing this.
          ver="$(awk '/^\[tool\.mdbook\]/{f=1;next} /^\[/{f=0} f && /^version[[:space:]]*=/{gsub(/[^0-9.]/,"",$0); print; exit}' nros-sdk-index.toml)"
          [ -n "$ver" ] || { echo "could not read [tool.mdbook] version from the index" >&2; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "mdBook pinned at $ver (nros-sdk-index.toml)"

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ steps.mdbook_pin.outputs.version }}

      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      # The INDEX names these, not this file — phase-413 W3. `[prereq.doxygen]`
      # and `[prereq.graphviz]` already carry the apt/dnf/pacman/brew spellings
      # and a presence probe; repeating `doxygen graphviz` here made this the
      # second place that fact lived, and the one nobody updates.
      #
      # `nros setup --system` is the user-facing verb and stays so. It is not
      # used HERE because this job builds no CLI, and making a docs deploy
      # compile one to learn that `doxygen` is spelled `doxygen` costs minutes
      # to answer what the index answers in milliseconds. The script reads the
      # same file the CLI reads.
      - name: Install Doxygen + Graphviz (from the index)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            $(python3 scripts/sdk/prereq-packages.py --manager apt doxygen graphviz)

      - name: Install Rust toolchain
        # tools/rust-toolchain.toml pins the workspace channel; reuse it so
        # rustdoc output matches the in-repo `cargo doc` invocation.
        run: |
          rustup show
          rustup component add rust-docs --toolchain $(awk '/^channel/ {gsub(/"/,"",$3); print $3; exit}' tools/rust-toolchain.toml) || true

      - name: Build mdBook
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /nano-ros-book/
        # The static pool inventory is generated and untracked, and SUMMARY.md
        # lists it as a chapter, so it has to exist before mdbook runs.
        run: |
          python3 scripts/gen-pool-inventory.py
          python3 scripts/gen-config-surface.py
          mdbook build book

      - name: Build rustdoc
        # User-facing crates only — internal platform/board/driver crates
        # are not part of the public API surface and would just bloat the
        # deploy. Wipe target/doc/ first so prior workspace cargo-doc
        # artefacts (if any cache hit) don't leak into the deployed tree.
        # Pass an rmw + platform feature combo so the rmw-gated re-exports
        # (`nros::Executor`, `nros::Promise`, etc.) actually appear in the
        # rendered output — the reference stubs deep-link into them.
        env:
          # The driver builds dependency docs, so allow existing internal
          # intra-doc links that were not checked by the old `--no-deps`
          # workflow path.
          RUSTDOCFLAGS: "-A rustdoc::broken-intra-doc-links -A rustdoc::private-intra-doc-links"
        run: |
          rm -rf target/doc target/doxygen
          # Phase 104.A: `rmw-zenoh` feature on `nros` is now
          # `rmw-zenoh-cffi`. The Rust `nros-platform-posix` crate
          # was deleted (123.A.1.x.2); POSIX C symbols ship from
          # `packages/platform/nros-platform-posix/src/*.c`, compiled
          # by `nros-platform-cffi`'s `posix-c-port` feature.
          # The book rustdoc driver is its own tiny workspace so Cargo
          # does not resolve root workspace members backed by target/runtime
          # submodules. The driver depends on the public crates and activates
          # the same doc-facing feature set.
          CARGO_TARGET_DIR=target cargo doc \
            --manifest-path book/rustdoc-driver/Cargo.toml

      - name: Build Doxygen — C
        run: |
          mkdir -p target/doxygen/c
          cd packages/api/nros-c
          doxygen Doxyfile

      - name: Build Doxygen — C++
        run: |
          mkdir -p target/doxygen/cpp
          cd packages/api/nros-cpp
          doxygen Doxyfile

      - name: Build Doxygen — RMW vtable (porter-facing)
        # phase-321 W2.e moved the shim crates to packages/rmw/, but the
        # vtable headers + Doxyfile are the ABI SSoT and live in
        # packages/core/nros-rmw-abi (RFC-0054).
        run: |
          mkdir -p target/doxygen/rmw-cffi
          cd packages/core/nros-rmw-abi
          doxygen Doxyfile

      - name: Build Doxygen — Platform ABI (porter-facing)
        # RFC-0054: the SSoT C headers live in nros-platform-api (the old
        # cbindgen direction is retired). Doxygen warns-and-succeeds on a
        # missing INPUT, which is how the published reference shipped EMPTY
        # for a while — hence the emitted-page assertion.
        run: |
          mkdir -p target/doxygen/platform-cffi
          (cd packages/platform/nros-platform-api && doxygen Doxyfile)
          ls target/doxygen/platform-cffi/html/*_8h.html >/dev/null

      - name: Stage API docs into book output
        # Lay native API docs alongside the mdBook so all the
        # `../api/<lang>/...` links from book/src/reference/*.md resolve.
        # rustdoc has no top-level `index.html` for multi-`-p` invocations,
        # so stage a tiny redirect to the umbrella crate.
        run: |
          mkdir -p book/book/api
          cp -r target/doc                          book/book/api/rust
          cp -r target/doxygen/c/html               book/book/api/c
          cp -r target/doxygen/cpp/html             book/book/api/cpp
          cp -r target/doxygen/rmw-cffi/html        book/book/api/rmw-cffi
          cp -r target/doxygen/platform-cffi/html   book/book/api/platform-cffi
          cat > book/book/api/rust/index.html <<'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=nros/index.html">
          <link rel="canonical" href="nros/index.html">
          <p>Redirecting to <a href="nros/index.html">nros</a>…</p>
          HTML

      - name: Setup deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PAGES_DEPLOY_KEY }}

      - name: Deploy to NEWSLabNTU.github.io
        run: |
          git clone git@github.com:NEWSLabNTU/NEWSLabNTU.github.io.git _pages
          rm -rf _pages/nano-ros-book
          cp -r book/book _pages/nano-ros-book
          cd _pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nano-ros-book
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Update nano-ros book

          Source: ${{ github.server_url }}/${{ github.repository }}/tree/main/book
          Commit: ${{ github.sha }}"
            git push
          fi
