# Arm auto-merge on every pull request that is ready for one.
#
# WHY THIS EXISTS
#
# `main` requires a pull request and the merge queue, so a PR reaches `main`
# only if someone arms auto-merge. Nobody does it reliably, and the cost was
# measured on 2026-09-06: of 23 open pull requests, **16 were not armed**. An
# unarmed PR never enters the queue, so it sits while `main` moves -- 56 to 71
# commits in a day at the current rate -- until it conflicts and needs a
# rebase that nobody asked for.
#
# The loop closes on itself, which is the part worth naming: **a force-push
# CANCELS auto-merge.** So the rebase that unsticks a stale PR also disarms it,
# and the PR goes straight back to rotting. Nine PRs were rebased by hand that
# morning and every one came out unarmed. Work in, no throughput out.
#
# `synchronize` in the trigger list is what closes it: a rebase re-arms.
#
# WHY `pull_request_target`
#
# `pull_request` from a fork gets a READ-ONLY token, so it cannot arm
# anything -- which is the case that most needs arming. `pull_request_target`
# runs with the base repository's token.
#
# That trigger is dangerous when a workflow CHECKS OUT the pull request's code,
# because untrusted code then runs with a writable token. This one checks out
# NOTHING and runs no code from the PR: it makes a single API call, by number.
# Do not add `actions/checkout` here.
#
# NO `branches:` OR `paths:` FILTER, deliberately
#
# The same trap `gate.yml` documents at length. A `branches: [main]` filter
# silently drops every event from a STACKED pull request (base is not `main`),
# and retargeting a PR emits `edited`, which is not in the default type list --
# so PR #71 sat thirteen hours with zero check suites. A filter here would fail
# the same way, and the failure looks like "auto-merge just doesn't work
# sometimes".
#
# WHAT IT DOES NOT CHANGE
#
# Arming auto-merge is not merging. The PR still waits for the required `CI`
# context and still goes through the merge queue, which runs `test-unit` and
# the rest before anything lands. This changes WHO pushes the button, not what
# the button checks.
#
# Opt out per-PR with the `no-auto-merge` label, or by leaving the PR a draft.
#
# WHOSE PULL REQUESTS GET ARMED
#
# `author_association` is OWNER, MEMBER or COLLABORATOR. That is the whole
# test, and it carries the distinction on its own -- those three are exactly
# the values that mean the account has access to THIS repository.
#
# The one that looks close and is not is `CONTRIBUTOR`. GitHub gives it to
# anyone who has had a commit merged here, so an outside contributor's SECOND
# pull request arrives as `CONTRIBUTOR` with no more access than their first.
# It is a history, not a permission. `FIRST_TIME_CONTRIBUTOR` and `NONE` are
# the same case, said differently.
#
# WHERE THE BRANCH LIVES IS REPORTED, NOT ENFORCED
#
# An earlier version also required the head branch to be in this repository,
# on the argument that pushing it proved write access. True, but the converse
# does not hold: a member who prefers to work from their own fork has the same
# access and was getting the outsider's treatment, and "not armed" would then
# depend on the contributor's workflow rather than on their permissions. The
# fork flag is still printed, because it is the first thing anyone asks when
# reading one of these logs.
#
# Nothing is lost by dropping it. A fork PR from a non-member still fails the
# association test, which is the check that was doing the work.
#
# Everything else -- a fork PR from an outsider, a first-time contributor,
# `NONE` -- is simply NOT ARMED. Nothing is blocked and nothing is rejected:
# CI still runs, the PR is still reviewable, and a maintainer who wants it to
# land arms it by hand after reading it. Auto-merge is a convenience for work
# that was already going to land unattended; an outside contribution is
# exactly the case that wants a human at the end.
#
# `AUTO_MERGE_AUTHORS` (a repository variable, optional) narrows it further:
# a comma-separated list of accounts, and when set, ONLY those accounts are
# armed. Use it to name the agent accounts explicitly instead of trusting
# every member. Unset -- the default -- means the association decides.
#
# Note this rule has NO history to validate against: all 556 pull requests
# ever opened here are from one MEMBER account on non-fork branches, so no
# third-party PR has ever existed to test it. It is written to fail CLOSED for
# that reason -- an unrecognised association is not armed.

# ARMED IS NOT ENQUEUED WHEN THIS WORKFLOW ARMED IT
#
# Measured 2026-11-13 over the last 80 pull requests: auto-merge was enabled
# 64 times by a user's own `gh pr merge --auto` and 22 times by this workflow.
# For the first kind, GitHub put the pull request in the merge queue itself,
# as that user, once `CI` went green. For the second kind it never did: 21
# were enqueued later BY HAND, and the other one was still waiting. GitHub
# does not act later on an auto-merge request a `GITHUB_TOKEN` made, the same
# rule that stops a `GITHUB_TOKEN` event from starting a workflow.
#
# The token CAN enqueue directly. When this workflow arms a pull request that
# is ALREADY clean, `gh pr merge --auto` enqueues it on the spot (#3696, 6 s
# after arming, and its merge_group runs started normally). So the `enqueue`
# job below waits for the moment arming alone misses: `gate` finishing green
# for a pull request. If that pull request is armed, CLEAN and not queued, it
# is enqueued, pinned to the commit `gate` judged, so a push in between is
# never enqueued in its place. `workflow_dispatch` runs the same check over
# every open pull request, as a backstop.
#
# Arming with a user's token instead (a PAT or an App secret) would make
# GitHub do this itself. That is a new credential, so it is a maintainer's
# call and is not done here.

name: arm auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  # `workflows:` names the workflow by its `name:`, and `gate.yml` is `gate`.
  # Only a workflow on the default branch is ever triggered by this event,
  # and, like `pull_request_target`, it runs with the base repository's token
  # and checks out nothing.
  workflow_run:
    workflows: [gate]
    types: [completed]
  workflow_dispatch:

permissions:
  # Issue 1338 (second fault) -- `enablePullRequestAutoMerge` needs CONTENTS
  # write as well: with `pull-requests: write` alone GitHub answers
  # `Resource not accessible by integration`, and it did on every run of the
  # 40 measured on 2026-10-12 (0 armed). On a branch with a merge queue,
  # arming is an enqueue, which is a contents operation. Still no checkout:
  # the job runs `gh` against the API and executes nothing from the PR.
  contents: write
  pull-requests: write

concurrency:
  # One arm per PR; a burst of pushes does not need a queue of identical calls.
  # A `workflow_run` has no pull request number in its payload; its head
  # commit stands in. A dispatch sweep never cancels anything else.
  group: arm-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  arm:
    name: arm auto-merge
    # A draft is a statement that the author is not done. `no-auto-merge` is
    # the same statement for a PR that must not land on its own -- a spike, a
    # discussion, anything wanting a human at the end.
    if: >-
      ${{ github.event_name == 'pull_request_target'
          && github.event.pull_request.draft == false
          && !contains(github.event.pull_request.labels.*.name, 'no-auto-merge') }}
    runs-on: ubuntu-latest
    # Longest green run 0.1 min (n=40); floor 10.
    timeout-minutes: 10
    steps:
      # The trust decision is a STEP, not another `if:` on the job, so that
      # "why was my pull request not armed?" has an answer in a log somewhere.
      # A job skipped by an expression leaves no record of which clause was
      # false, and this one has four.
      - name: Decide whether this author's pull requests arm themselves
        id: trust
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ALLOWLIST: ${{ vars.AUTO_MERGE_AUTHORS }}
        run: |
          # `fork=` is REPORTED and not tested: a member working from their own
          # fork has the same access as one pushing a branch here, and it is
          # the first thing anyone asks when reading this log.
          echo "author=$AUTHOR association=$ASSOCIATION fork=$IS_FORK"

          arm=yes
          case "$ASSOCIATION" in
            # The three values that mean access to THIS repository. CONTRIBUTOR
            # is deliberately absent: GitHub gives it to anyone who has had a
            # commit merged, so it is a history rather than a permission.
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "not arming — author_association is '$ASSOCIATION', not OWNER/MEMBER/COLLABORATOR"
              arm=no
              ;;
          esac
          if [ -n "$ALLOWLIST" ]; then
            # An explicit list, when the repository sets one: name the agent
            # accounts rather than trusting every member.
            case ",$ALLOWLIST," in
              *",$AUTHOR,"*) ;;
              *)
                echo "not arming — '$AUTHOR' is not in AUTO_MERGE_AUTHORS"
                arm=no
                ;;
            esac
          fi

          if [ "$arm" = yes ]; then
            echo "arming — the author already has write access to this repository"
          else
            echo "This is not a rejection. CI still runs and the pull request is"
            echo "still mergeable; a maintainer arms it by hand after reading it."
          fi
          echo "arm=$arm" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.trust.outputs.arm == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `--rebase` names the method for repositories without a queue; where
          # a queue IS configured GitHub owns the method and `gh` says so on
          # stderr ("The merge strategy for main is set by the merge queue")
          # while arming correctly. That notice is not an error.
          #
          # Already-armed is also not an error, and `synchronize` will re-run
          # this on every push, so the common case is a no-op.
          # issue 1338 — TWO faults lived in the single line this replaces, and
          # they compounded in the worst direction: one made it always fail,
          # the other made it always report success.
          #
          #   * No `--repo`. This job checks out NOTHING, on purpose (see the
          #     `pull_request_target` note above — do not add a checkout to fix
          #     this). `gh pr merge` resolves the repository from the local git
          #     remote, so with no local git it died on EVERY run with
          #     `failed to run git: fatal: not a git repository`.
          #   * `if cmd | tee ...` tests the PIPELINE's status, which is
          #     `tee`'s and is 0 either way. The `else` below was unreachable,
          #     so the `::warning::` had never once been emitted and the run
          #     printed `armed #N` three lines under the git error.
          #
          # So the workflow written to fix "16 of 23 PRs are not armed" had
          # never armed one, and the only visible evidence was a green check
          # saying it had. Issue 1226's shape with the sign flipped.
          #
          # `rc=0; cmd || rc=$?` is this repo's ONE spelling for a status you
          # mean to INSPECT under `set -e` (issue 1249) — and a pipe destroys
          # it, which is why the redirect replaces the `tee`.
          rc=0
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --rebase \
            > /tmp/arm.log 2>&1 || rc=$?
          sed 's/^/  /' /tmp/arm.log
          if [ "$rc" -eq 0 ]; then
            echo "armed #$NUMBER"
          elif grep -q 'Resource not accessible by integration' /tmp/arm.log; then
            # Issue 1338 -- a PERMISSION refusal is not a PR state; it is this
            # workflow being unable to do its job for every PR, which a
            # warning hid for a month. Fail loudly instead.
            echo "::error::arm-auto-merge lacks the token permission to arm #$NUMBER (issue 1338)"
            exit 1
          else
            # Never fail the workflow for this. A PR that cannot be armed yet
            # (queued, closed, conflicting) is a state to report, not a red X
            # on someone's pull request -- and a red check here would be a
            # second, confusing signal beside the real `CI` one.
            echo "::warning::could not arm auto-merge on #$NUMBER"
          fi

  enqueue:
    name: enqueue an armed, clean pull request
    # Only a green `gate` run for a pull request (a merge_group or push run of
    # `gate` judges no pull request), or a dispatched sweep.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event_name == 'workflow_run'
              && github.event.workflow_run.event == 'pull_request'
              && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    # A query and a mutation per pull request, plus at most a minute of
    # waiting for GitHub to finish computing the merge state; floor 10.
    timeout-minutes: 10
    steps:
      - name: Enqueue each armed, clean pull request that is not queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Which pull requests to look at: the one(s) whose head `gate` just
          # judged, or every open one for a dispatched sweep.
          if [ -n "$HEAD_SHA" ]; then
            if ! numbers="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
                --jq '.[] | select(.state == "open") | .number')"; then
              echo "::warning::could not list the pull requests for $HEAD_SHA"
              exit 0
            fi
          else
            if ! numbers="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                --limit 200 --json number --jq '.[].number')"; then
              echo "::error::could not list open pull requests"
              exit 1
            fi
          fi
          [ -n "$numbers" ] || { echo "no open pull request to look at"; exit 0; }

          owner="${GITHUB_REPOSITORY%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){id isDraft headRefOid isInMergeQueue mergeStateStatus autoMergeRequest{enabledAt}}}}'
          for n in $numbers; do
            # `mergeStateStatus` is computed lazily and reads UNKNOWN for a
            # while after a check completes, so ask again a few times.
            state=""
            for _ in 1 2 3 4 5 6; do
              if ! pr="$(gh api graphql -f query="$query" -f o="$owner" -f r="$name" -F n="$n" \
                  --jq '.data.repository.pullRequest')"; then
                echo "::warning::#$n: could not read its state"
                continue 2
              fi
              state="$(jq -r '.mergeStateStatus' <<<"$pr")"
              [ "$state" = UNKNOWN ] || break
              sleep 10
            done
            id="$(jq -r '.id' <<<"$pr")"
            head="$(jq -r '.headRefOid' <<<"$pr")"
            armed="$(jq -r '.autoMergeRequest != null' <<<"$pr")"
            queued="$(jq -r '.isInMergeQueue' <<<"$pr")"
            draft="$(jq -r '.isDraft' <<<"$pr")"
            echo "#$n: state=$state armed=$armed queued=$queued draft=$draft head=$head"

            if [ "$armed" != true ] || [ "$queued" = true ] || [ "$draft" = true ]; then
              echo "  nothing to do"
              continue
            fi
            if [ -n "$HEAD_SHA" ] && [ "$head" != "$HEAD_SHA" ]; then
              echo "  its head moved past the commit gate judged; that commit's own run decides"
              continue
            fi
            if [ "$state" != CLEAN ]; then
              echo "  not CLEAN, so not enqueued"
              continue
            fi

            rc=0
            gh api graphql \
              -f query='mutation($id:ID!,$sha:GitObjectID!){enqueuePullRequest(input:{pullRequestId:$id,expectedHeadOid:$sha}){mergeQueueEntry{position}}}' \
              -f id="$id" -f sha="$head" > /tmp/enqueue.log 2>&1 || rc=$?
            sed 's/^/  /' /tmp/enqueue.log
            if [ "$rc" -eq 0 ]; then
              echo "  enqueued #$n"
            elif grep -q 'Resource not accessible by integration' /tmp/enqueue.log; then
              # As for arming (issue 1338): a permission refusal is this job
              # unable to do its work for every pull request. Say so loudly.
              echo "::error::arm-auto-merge lacks the token permission to enqueue #$n"
              exit 1
            else
              # A race with a push, a conflict, or a human who enqueued it a
              # moment earlier: a state to report, not a red mark on the PR.
              echo "::warning::could not enqueue #$n"
            fi
          done
