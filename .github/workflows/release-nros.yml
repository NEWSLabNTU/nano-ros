# Cut a release of the `nros` CLI — phase-431 W5.
#
# MANUAL DISPATCH ONLY, and with an explicit version. The CLI rolls rapidly
# in-tree; a release is a deliberate act for USERS, not a consequence of a
# version bump landing on main. Nothing here is scheduled and nothing triggers
# on a tag: the tag is created BY this workflow, from the version you type.
#
# Never a local build. That is the `nano-ros-sdk` repo's own convention for the
# assets it publishes, and the reason is reproducibility rather than
# convenience — a binary built on somebody's laptop carries that laptop's
# glibc, its toolchain and whatever was in its environment, and nothing
# afterwards can tell you which.
#
# WHAT A RELEASE RECORDS ABOUT ITSELF — RFC-0097 D7, phase-443 W2
#
# The last time nano-ros shipped a prebuilt `nros`, the binary emitted code
# that had drifted from the runtime, and drifted generated code COMPILES — so
# the failure was silent and the download was withdrawn (phase-288 D1/D2).
#
# This workflow used to answer that by ASSERTING three versions equal: the
# release version, `NROS_CODEGEN_VERSION`, and `[tool.nros].version` in the
# index. The coupling was mechanised, which is why it never drifted; it is also
# why nothing could move alone. RFC-0097 measured what that cost — on `main`,
# 2026-09-10: `packages/cli` 710 commits per 60 days, the runtime crates the CLI
# compiles 248, `nros-sdk-index.toml` 70, and `NROS_CODEGEN_VERSION` 2, ALL
# TIME. The axis carrying every compatibility promise moves twice, ever; the
# artifact carrying it would have moved ~450 times as often.
#
# So the release now RECORDS its components instead. `share/nros/manifest.toml`
# declares all four, and only `codegen` promises anything:
#
#     version  = "0.7.9"      the toolchain
#     codegen  = 7            the ONLY field that can invalidate existing output
#     index    = "2026-09-10" pointers into nano-ros-sdk
#     nano_ros = "abc1234"    the runtime commit
#
# `0.7.1` and `0.7.9` both declaring `codegen = 7` is the whole feature: a user
# takes either and re-emits nothing. `nros pin <version>` reads two manifests
# out of the store and says so before it moves anything.
#
# ONE equality survives, because it is the one that is TRUE: the manifest's
# `codegen` must equal `NROS_CODEGEN_VERSION` in the tree this binary was built
# from. That is not a coupling between axes — it is the manifest being about the
# artifact, and it is the assertion phase-288's silent failure actually needed.
# It cannot be got wrong by construction either: the manifest is stamped by
# `nros toolchain manifest`, which takes the number from the binary's own
# `abi_guard::EMITTED_VERSION` and has no `--codegen` flag. `check-release-manifest`
# gates that this step still exists and that the retired equalities stay retired.
#
# The other two are now REPORTED, not enforced: the index's pinned version and
# the crate version are printed beside the release version so drift is visible.
#
#   source-stamp        the binary matches the checkout it was built from
#   manifest codegen    it equals `NROS_CODEGEN_VERSION` in that same tree
#
# WHAT THE ASSET CONTAINS, and why each part is not optional
#
#   bin/nros                          the binary
#   share/nros/manifest.toml          what this release is MADE OF (RFC-0097 D7)
#                                     — read by `nros pin` and
#                                     `nros toolchain manifest`, never parsed
#                                     out of a filename
#   share/nros/VERSION                the STORE version (`0.5.0-nros1`), which
#                                     `nros --version` does not print — without
#                                     it `install.sh` cannot name the prefix the
#                                     index pins, and a later
#                                     `nros setup --tool nros` installs a second
#                                     copy of the same binary. NOT replaced by
#                                     the manifest: `install.sh` chooses the
#                                     prefix in POSIX shell before anything is
#                                     unpacked, and must not need a TOML parser
#                                     to do it. The workflow writes both from
#                                     one input, so they agree by construction
#   share/nros/nros-sdk-index.toml    a released `nros` has no checkout to find
#                                     an index in, so `nros setup <board>` fails
#                                     outright without this (phase-431 W5,
#                                     `setup::shipped_index`)
#   <asset>.sha256                    `install.sh` REFUSES an asset it cannot
#                                     verify, so a release without this is
#                                     un-installable by design
#
# Linux x86_64 only for now. macOS is deferred by the tree, and linux-arm64
# waits on a runner decision — it is one matrix row when that is made, and the
# index already has the host key for it.
name: release nros

on:
  workflow_dispatch:
    inputs:
      version:
        description: "store version to release, e.g. 0.5.0-nros1 (recorded, not asserted equal to anything — RFC-0097 D7)"
        required: true
        type: string
      publish:
        description: "create the tag + GitHub release (off = build and verify only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-nros
  cancel-in-progress: false

jobs:
  build:
    name: build + verify nros-linux-x86_64
    # 22.04, not `latest`: the binary links the runner's glibc, and a newer one
    # will not run on the LTS the book's install instructions target. The floor
    # is a property of the release, so it is pinned rather than inherited.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The asset is `.tar.zst` and `tar` shells out to the `zstd` binary. The
      # package NAME comes from the index, not from here: it carries the
      # apt/dnf/pacman/brew spellings, and a copy in a workflow is the one that
      # goes stale (`check-workflow-indexed-apt`, which caught this line).
      - name: Install zstd
        run: |
          sudo apt-get update
          # shellcheck disable=SC2046
          sudo apt-get install -y $(python3 scripts/sdk/prereq-packages.py --manager apt zstd)

      - name: Build the CLI from source
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          cargo build --release --manifest-path packages/cli/Cargo.toml --bin nros
          # phase-447 A1 — the launch resolver, the SECOND artifact a build
          # needs and the one the SDK root cannot carry (it is a binary, its own
          # cargo workspace, and it embeds CPython).
          #
          # Measured, not assumed: with `share/nano-ros` staged and no checkout
          # present, `nros new my_robot --workspace` scaffolds and then dies at
          # cmake configure with "`nros-launch-resolve` not found. Build it with
          # ./scripts/bootstrap.sh" — a remedy naming a checkout the user does
          # not have. Every workspace configure goes through it, because
          # `nano_ros_entry` resolves the bringup's launch file into a
          # SystemModel.
          #
          # `bootstrap.sh` builds exactly this for a contributor, one line below
          # the CLI, and for the same reason: "a CLI without it fails the FIRST
          # `nros new --workspace` build". `resolve_launch_resolver` rung 2 is
          # already "a sibling of the running `nros` — the installed layout", so
          # staging it into `bin/` beside the CLI needs no code.
          #
          # Its own workspace (own lock, own `ros-launch-manifest` pin), hence
          # its own manifest path. `default-features = false` in that manifest
          # drops z3/libclang, so this adds no system build dep beyond the
          # CPython pyo3 already links.
          cargo build --release \
              --manifest-path packages/cli/nros-launch-resolve/Cargo.toml
          # phase-429 W5 — the binary must match the checkout it was built from.
          # A release is the one artifact where nobody downstream can re-check
          # this, so it is asserted here rather than assumed.
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null

      - name: Record what this release is made of
        run: |
          set -euo pipefail
          nros="$GITHUB_WORKSPACE/packages/cli/target/release/nros"
          want_version='${{ inputs.version }}'
          stage="$RUNNER_TEMP/prefix"
          mkdir -p "$stage/share/nros"

          # RECORD. `codegen` is taken by the binary from its own
          # `abi_guard::EMITTED_VERSION` — there is no flag for it, so this
          # cannot record a number the binary does not emit. `index` is a DATE
          # (the index is a table of pointers into `nano-ros-sdk`, which
          # publishes per-tool and has no version of its own, RFC-0097 D5).
          #
          # `actions/checkout@v4` fetches depth 1, so a path-limited `git log`
          # is empty unless HEAD itself touched the index. Falling back to
          # HEAD's own date keeps the field HONEST for a shallow clone: "the
          # index as of this commit" is true either way, where an empty string
          # would only look like a missing field.
          index_date="$(git log -1 --format=%cs -- nros-sdk-index.toml || true)"
          [ -n "$index_date" ] || index_date="$(git log -1 --format=%cs)"
          "$nros" toolchain manifest \
              --store-version "$want_version" \
              --index "$index_date" \
              --nano-ros "$(git rev-parse --short HEAD)" \
              --write "$stage/share/nros/manifest.toml"
          cat "$stage/share/nros/manifest.toml"

          # THE ONE EQUALITY THAT SURVIVES. The manifest promises that code
          # emitted by this binary compiles against this tree's runtime, and
          # that promise is checkable here and nowhere downstream: drifted
          # generated code COMPILES, so a wrong number is silent forever
          # (phase-288 D1/D2). Everything else this workflow used to assert has
          # become a printed NOTE below.
          manifest_codegen="$(sed -n 's/^codegen = \([0-9]\+\)$/\1/p' "$stage/share/nros/manifest.toml")"
          tree_codegen="$(sed -n 's/^pub const NROS_CODEGEN_VERSION: u32 = \([0-9]\+\);.*/\1/p' \
              packages/core/nros-core/src/codegen_version.rs)"
          if [ -z "$manifest_codegen" ] || [ -z "$tree_codegen" ]; then
              echo "::error::could not read the codegen version (manifest '$manifest_codegen', tree '$tree_codegen')" >&2
              exit 1
          fi
          if [ "$manifest_codegen" != "$tree_codegen" ]; then
              echo "::error::the manifest records codegen $manifest_codegen, the tree declares $tree_codegen" >&2
              exit 1
          fi
          echo "codegen $manifest_codegen: the manifest and packages/core/nros-core agree"

          # REPORTED, NOT ENFORCED. These two used to be hard failures, and
          # they are exactly the couplings D7 removes: an index edit and a CLI
          # version bump are invisible to already-generated code, so neither may
          # block a release. They are still worth SEEING, because a surprise
          # here is usually a mistake — just not one this workflow gets to
          # decide.
          indexed="$(sed -n '/^\[tool\.nros\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' nros-sdk-index.toml)"
          crate="$("$nros" --version | awk '{print $NF}')"
          echo "note: releasing   $want_version"
          echo "note: crate       $crate"
          echo "note: index pins  ${indexed:-<none>}"
          if [ "$indexed" != "$want_version" ]; then
              printf '::warning::%s\n' \
                  "[tool.nros].version is '${indexed:-<none>}', not '$want_version' — a later 'nros setup --tool nros' resolves a different prefix until the index is bumped."
          fi

      - name: Stage the prefix
        run: |
          set -euo pipefail
          # `share/nros/manifest.toml` is already here — the recording step
          # wrote it into this same prefix, so what was verified is what ships.
          stage="$RUNNER_TEMP/prefix"
          mkdir -p "$stage/bin" "$stage/share/nros"
          test -f "$stage/share/nros/manifest.toml"
          cp packages/cli/target/release/nros "$stage/bin/nros"
          # phase-447 A1 — beside `nros`, which is `resolve_launch_resolver`
          # rung 2 ("the installed layout"). It links `libpython3.10.so.1.0` as a
          # hard DT_NEEDED — 22.04's interpreter, which is why the runner is
          # pinned there — and a host without it gets `verify_resolver_pin`'s
          # named diagnostic rather than a raw loader message. Declaring and
          # PROBING that floor before download is RFC-0099 D1, not this line.
          cp packages/cli/nros-launch-resolve/target/release/nros-launch-resolve \
              "$stage/bin/nros-launch-resolve"
          printf '%s\n' '${{ inputs.version }}' >"$stage/share/nros/VERSION"
          cp nros-sdk-index.toml "$stage/share/nros/nros-sdk-index.toml"
          # phase-440 W7 / RFC-0095 D8 job 2: the launcher fetches a pinned
          # toolchain by running THIS installer, so the fetch has one
          # implementation rather than a Rust reimplementation of "which asset,
          # which checksum, which prefix". `orchestration::dispatch` looks for
          # it at exactly this path and refuses (naming the remedy) when an
          # asset predating this line does not carry it.
          cp scripts/install.sh "$stage/share/nros/install.sh"
          chmod +x "$stage/share/nros/install.sh"
          # phase-447 A1 / RFC-0099 D2 — the SDK ROOT a build reads.
          #
          # Without it the installed journey dead-ends one step from the end:
          # `nros build` resolves its board catalog from a nano-ros CHECKOUT and
          # says so, so `install.sh` -> `nros setup` -> `nros new` -> `nros
          # build` fails on the first release ever cut. It is INSIDE the
          # toolchain rather than beside it because RFC-0097 D6 already decided
          # codegen and the runtime are one unit.
          #
          # The path list and the reason for every entry live in the script, and
          # the script VERIFIES what it staged — a set that only this workflow
          # knew would be checked nowhere, and could not be run by a person
          # asking "what does the asset carry?".
          sh scripts/stage-sdk-root.sh "$stage"
          # Prefix-rooted, the mirror shape every other dist in the index uses,
          # so `sdk_store::execute`'s default unpack lands it unchanged.
          tar --zstd -cf "$RUNNER_TEMP/nros-linux-x86_64.tar.zst" -C "$stage" bin share
          cd "$RUNNER_TEMP"
          sha256sum nros-linux-x86_64.tar.zst >nros-linux-x86_64.tar.zst.sha256
          cat nros-linux-x86_64.tar.zst.sha256

      - name: Prove the asset installs, before publishing it
        run: |
          set -euo pipefail
          # The installer's own refusals are gated in `just check nros-installer`
          # against a synthetic tarball. This runs the REAL one, which is the
          # only way to catch an asset that is well-formed and wrong — a missing
          # VERSION file, a prefix rooted one directory too deep, a binary that
          # does not run on a clean runner.
          python3 -m http.server 8422 --directory "$RUNNER_TEMP" &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 50); do
              curl -fsS -o /dev/null "http://127.0.0.1:8422/nros-linux-x86_64.tar.zst" && break
              sleep 0.2
          done
          NROS_HOME="$RUNNER_TEMP/probe" \
            NROS_INSTALL_URL="http://127.0.0.1:8422/nros-linux-x86_64.tar.zst" \
            sh scripts/install.sh
          installed="$RUNNER_TEMP/probe/bin/nros"
          test -x "$installed"
          test "$(readlink -f "$installed")" = "$RUNNER_TEMP/probe/sdk/nros/${{ inputs.version }}/bin/nros"
          # The fronted binary must be able to do the thing a user installs it
          # for, from a directory that is not a checkout.
          cd "$RUNNER_TEMP"
          "$installed" --codegen-version
          "$installed" setup --list >/dev/null
          # phase-447 A1/A2 — the two things that make the installed journey
          # reach a BUILD, asked of the INSTALLED prefix rather than of the
          # staging dir. `sdk-root` walks the same four-rung ladder `nros build`
          # does, from a directory that is not a checkout and with no
          # NROS_REPO_DIR, so only the shipped rung can answer; and it prints the
          # prefix's own `share/nano-ros`, which proves the asset unpacked where
          # the binary looks rather than merely somewhere.
          test "$(env -u NROS_REPO_DIR "$installed" sdk-root)" \
               = "$(readlink -f "$RUNNER_TEMP/probe/sdk/nros/${{ inputs.version }}")/share/nano-ros"
          # The launch resolver, asked of the FRONT dir — because that is the
          # rung `model_location::launch_resolver_bin` reads
          # (`$NROS_HOME/bin/nros-launch-resolve`), and a resolver sitting in the
          # store that nothing fronted is a resolver no build finds. Run, not
          # just present: it links libpython, so "the file is there" and "it
          # starts" are different questions and the loader answers the second
          # before `main`.
          "$RUNNER_TEMP/probe/bin/nros-launch-resolve" --version
          # RFC-0097 D7 — the manifest must survive the install and be READ back
          # by the installed binary, from the file, at the prefix it landed in.
          # An asset whose manifest the CLI cannot read is an asset for which
          # `nros pin` cannot answer the re-emit question, which is the whole
          # point of shipping it.
          "$installed" toolchain manifest | tee "$RUNNER_TEMP/read-back.toml"
          grep -qx "codegen = $("$installed" --codegen-version)" "$RUNNER_TEMP/read-back.toml"
          echo "the asset installs, fronts, finds its own index, and declares its components"

      - uses: actions/upload-artifact@v4
        with:
          name: nros-linux-x86_64
          path: |
            ${{ runner.temp }}/nros-linux-x86_64.tar.zst
            ${{ runner.temp }}/nros-linux-x86_64.tar.zst.sha256

      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nros-${{ inputs.version }}"
          nros="$GITHUB_WORKSPACE/packages/cli/target/release/nros"
          # The notes go through a FILE, one `printf` argument per line. A
          # column-0 line inside a YAML `run:` block is parsed as syntax, not as
          # text, so a heredoc is unusable here and its terminator would have to
          # sit where YAML expects a key (CLAUDE.md's pitfall index).
          printf '%s\n' \
            "The \`nros\` CLI, codegen version $("$nros" --codegen-version)." \
            "" \
            "Coming from another release that declares the SAME codegen version?" \
            "Nothing is re-emitted — take it (RFC-0097 D7). \`nros pin <version>\`" \
            "reads both manifests out of your store and says so before it moves" \
            "your \`nros-toolchain.toml\`; \`nros toolchain manifest\` prints what" \
            "an installed toolchain declares." \
            "" \
            "Install:" \
            "" \
            '```' \
            "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh" \
            '```' \
            "" \
            "Contributors build from source instead: inside a checkout the tree's own" \
            "build is the only correct binary (RFC-0090, phase-431 W1/W2)." \
            >"$RUNNER_TEMP/notes.md"
          # `--target` pins the release to the commit that was verified above,
          # not to whatever the branch points at when this step runs.
          gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "nros ${{ inputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "$RUNNER_TEMP/nros-linux-x86_64.tar.zst" \
              "$RUNNER_TEMP/nros-linux-x86_64.tar.zst.sha256"
