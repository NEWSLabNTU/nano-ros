# Post-submit lane — phase-395 W7.
#
# Runs on `push` to `main`, AFTER a change has landed. This is where the lanes
# too expensive to gate a merge still get a daily-or-better signal, and where a
# regression that slipped past the pre-merge lanes is caught within one commit
# rather than at the next nightly.
#
# WHY POST-SUBMIT IS NOT A WEAKER PRE-MERGE
#
# Pre-merge and post-submit answer different questions. Pre-merge asks "is this
# change safe to land?" and must be affordable per batch. Post-submit asks "is
# main still good?" and may cost whatever a bisect would have cost, because it
# runs once per landed change and its job is to bound how far a regression can
# travel before anyone notices.
#
# phase-410 — TIER 2 MOVED OUT, to `run-matrix.yml` on a clock.
#
# It ran here on `push(main)` with `cancel-in-progress: true`. That setting is
# right for "is main good NOW", and fatal for a lane this long: measured
# 2026-08-31, tier 2 is an 11 min warm fixture rebuild plus a 9.5 min run. With
# ten agents landing through a merge queue that batches four, merges arrive
# faster than that, so every run is cancelled by the next merge and the tier
# COMPLETES NEVER — a lane that always cancels looks busy while reporting
# nothing, which is worse than the skipped job phase-411 made visible.
#
# What stays here is `dep-chain` (hosted, 158 s), which is genuinely per-merge
# and which no earlier lane can run because it needs codegen output. It keeps
# its OWN job, because that is what stops one red from withdrawing another
# lane's verdict when a second lane joins it.
#
# `api-parity` used to be the second one. It graduated to the merge gate
# (issue 1066) and its job is gone; the comment where it stood says why.
#
# WHAT THIS DOES NOT DO YET
#
# The plan names `ci-l4-tier1` — the tier-1 boards' cross-RUN coverage. That
# recipe does not exist, and inventing its contents here would be guessing at
# which cells belong in it. Until it exists this lane runs tier 2 (`ci-matrix`),
# which is a real cover (1-wise over platform/lang/rmw/kind) and honestly
# narrower than what the plan eventually wants.
name: post-submit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Superseding is correct HERE and wrong in the queue: post-submit asks "is
  # main good NOW", so a newer commit's answer subsumes an older one's.
  group: post-submit-${{ github.ref }}
  # ...but supersede the PENDING run, never the RUNNING one — phase-413.
  #
  # MEASURED 2026-09-03: 10 of the last 30 runs of this lane were CANCELLED.
  # `dep-chain` is 158 s and merges through a batching queue sometimes arrive
  # inside that, so the header's own class — "a lane that always cancels looks
  # busy while reporting nothing" — still bit the lane phase-410 left behind.
  #
  # `cancel-in-progress: false` is NOT "let them all pile up". GitHub keeps at
  # most one run in progress per group and ONE pending: when a run is queued
  # behind an in-progress one, any PREVIOUSLY pending run in the same group is
  # cancelled. So this setting is a debounce, and it changes WHICH run is
  # discarded — the pending one, which has consumed no runner, instead of the
  # in-flight one, which has already spent its minutes and is thrown away with
  # nothing to show.
  #
  # The cost is honest and small: the verdict in flight is for a slightly older
  # commit, and the newest pending run covers the newest one. A cancelled run
  # gives NO verdict at all, which is the failure mode this repo keeps meeting
  # (issue 0996: four of six lanes carrying no signal). Trading a little
  # freshness for a verdict that exists is the right way round for a lane whose
  # whole job is to bound how far a regression travels.
  #
  # `cancel-in-progress: true` stays right where a run is SHORT relative to the
  # merge interval, or where an operator asked for the newest answer on demand
  # (`build-wide.yml`, dispatch-only since W1).
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  # phase-395 W12 — `check-dep-chain`, moved off the merge path.
  #
  # 158 s measured, an 8-cell board×rmw matrix (`nros setup --dry-run` + codegen
  # + `cargo tree` per cell). Its own header still claims it runs "in seconds",
  # which was true per cell and stopped being true as cells accumulated.
  #
  # No single pull request changes the board×rmw wiring, so paying it on every
  # merge bought little while adding 158 s to the critical path to landing. Here
  # a regression is still bounded to one commit, which is what post-submit is
  # for.
  #
  # HOSTED, unlike the matrix job below: this needs ROS and the CLI, both of
  # which the ci-base image has, and nothing else. Gating it on a self-hosted
  # runner that does not exist yet would have moved it from expensive to never.
  dep-chain:
    name: dep-chain (8 board×rmw cells)
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build nros CLI + provision sources
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          cargo build --release --manifest-path packages/cli/Cargo.toml --bin nros
          # phase-429 W5 — ASSERT the binary matches the checkout, do not hope.
          # The CLI cache key is narrower than `source_stamp.rs`'s watch set
          # (it misses `.jinja`, `cli-source-dirs.txt`, the out-of-tree crate
          # dirs and the `play_launch` pin), so an exact-key hit exists for a
          # tree whose stamp has moved. Fresh-checkout mtimes usually make
          # cargo rebuild; usually is not a guarantee, and a binary emitting
          # code the runtime did not expect is what RFC-0090 exists to stop.
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src
      # The same predicate that heads `check-build`: a stale CLI surfaces here as
      # nine failed cells whose printed cause is a cargo resolution error
      # (issue 0363), so ask the cheap question first.
      - name: just check cli-fresh
        run: |
          source ./activate.sh
          just check cli-fresh
      - name: just check dep-chain
        run: |
          source ./activate.sh
          just check dep-chain

  # issue 1040 / issue 1066 — `check-api-parity` USED TO HAVE A JOB HERE, and
  # the reason it does not any more is that the gate finally reached a
  # merge-gating lane instead.
  #
  # The job was right for its moment: the gate ran in no workflow on any event,
  # it was RED on main (`rust:Executor::set_min_stack_headroom_bytes` had no
  # ledger row), and "a lane cannot start gating pull requests while it is
  # already red" is a rule this repo has paid for five times. `push` to main
  # bounded an unledgered surface change to ONE commit rather than to a nightly
  # batch.
  #
  # Both halves moved. The ledger is clean — `just check api-parity` ends
  # "every divergence carries a ledger entry" — and `565f8c74f` took the gate
  # off `.config/gate-lane-exempt.txt`, so `just check fast` in `gate.yml`'s
  # `check` job now runs it on `pull_request` and `merge_group`. The queue
  # tests the MERGED state and `main-rules` admits no other path to `main`, so
  # a post-submit run here re-asks a question the queue has already answered
  # about the same tree. Measured cost of asking it twice: 217 s of extraction
  # per merge, plus an `apt-get install clang` the image has shipped since
  # `0c73d061b`.
  #
  # `dep-chain` stays. It is exempt from the fast lane for a reason that has
  # not changed — it needs codegen output — so this is still the only lane that
  # runs it.

  coverage:
    name: coverage report (did the post-submit lanes run?)
    needs: [dep-chain]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Every lane reports, THEN the verdicts combine — NOT a run of commands
      # under `bash -e`, where a leading non-zero call withdraws the ones
      # behind it. This job exists precisely to say whether a lane ran, so
      # reporting one lane's coverage by silently not reporting another's is
      # the defect issue 1040 is about, in the job that reports on it. The
      # shape stays with one lane in the list; it is what makes adding a second
      # safe.
      - name: Report whether each interlocked lane ran
        run: |
          rc=0
          ./scripts/ci/report-interlock-coverage.sh \
            "dep-chain" "${{ needs.dep-chain.result }}" "true" || rc=1
          exit "$rc"
