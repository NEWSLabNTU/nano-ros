# The starter image -- RFC-0127 D6, phase-551 W4.
#
# `ghcr.io/newslabntu/nano-ros-starter`, public (RFC-0127 Q1, ruled
# 2026-11-12). Built by the RELEASE, never by hand from a session or a laptop:
# `release-nros.yml` calls this workflow after it has published `nros-<ver>`,
# so the image installs the asset that release just published and bakes the
# store that release's `nros setup` resolves (RFC-0127 D5 guarantee 2). The
# context is written from the release's own tag, not from `main`, for the
# same reason: the index the `host` layers read is the release's.
#
# Three things a run can do, and only these:
#
#   build `starter`         on every release (workflow_call), tag `<ver>`, and
#                           on dispatch for a release whose image failed;
#   build `starter-zephyr`  on dispatch only (RFC-0127 Q4), tag `<ver>-zephyr`;
#   retag                   on dispatch: point a semester or LTS tag
#                           (`2027-spring`) at an existing `<ver>`, the
#                           deliberate retag RFC-0127 D6 names.
#
# What it never does:
#
#   * re-push a version tag. `<ver>` and `<ver>-zephyr` are IMMUTABLE
#     (RFC-0127 D5 guarantee 1): a customer's `FROM ...:<ver>` must mean the
#     same bytes forever, so a tag that already exists refuses the build
#     before anything is built;
#   * move `latest`. That is the `image` probe track's (RFC-0127 D7, phase-551
#     W5): `latest` moves only after a timed pull of the released tag builds
#     the first project offline. A retag named `latest` is refused here.
#
# The image is over its compressed budget (2 GB `starter`, 5 GB
# `starter-zephyr`, RFC-0127 D7) -> the build fails and nothing is pushed;
# `scripts/ci/starter-image.sh` is the one place that budget is measured.
#
# ONE-TIME, by an org admin, not by this workflow: a package GHCR creates on
# first push is PRIVATE, and GITHUB_TOKEN cannot change a package's
# visibility. After the first release publishes `nano-ros-starter`, set it
# public in the package's settings (RFC-0127 Q1).
#
# amd64 only (RFC-0127 Q6): arm64 is one more platform here when
# `release-nros.yml`'s runner decision is made (phase-551 W8).
name: starter image

on:
  workflow_call:
    inputs:
      version:
        description: "store version, e.g. 0.6.0-nros9"
        required: true
        type: string
      target:
        description: "starter or starter-zephyr"
        required: false
        default: starter
        type: string
      # phase-567 W3: release-nros.yml calls this on a dry run as well as on
      # a publish, from the commit being released (no tag yet on a dry run)
      # with the asset its build job produced, and pushes only on a publish.
      push:
        description: "push the image (off = build and verify only)"
        required: false
        default: true
        type: boolean
      ref:
        description: "the commit to build (default: the `nros-<version>` tag)"
        required: false
        default: ""
        type: string
      asset_artifact:
        description: "install `nros` from this workflow artifact (the release job's asset) instead of the published release"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "released store version, e.g. 0.6.0-nros9 (its `nros-<ver>` tag must exist)"
        required: true
        type: string
      target:
        description: "what to build (ignored when `retag` is set)"
        required: false
        default: starter-zephyr
        type: choice
        options:
          - starter-zephyr
          - starter
      retag:
        description: "instead of building: point this tag (e.g. 2027-spring) at the existing `<version>`"
        required: false
        default: ""
        type: string
      scripts_from_main:
        description: "build a released version's image with main's context writer (the tag's book, index and sources); for a release whose own writer cannot write its context (issue 2635)"
        required: false
        default: false
        type: boolean
      push:
        description: "push the image (off = build and verify only)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: starter-image-${{ inputs.version }}-${{ inputs.target || 'starter' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/newslabntu/nano-ros-starter

jobs:
  build:
    name: build + push ${{ inputs.target || 'starter' }} ${{ inputs.version }}
    if: ${{ inputs.retag == '' || inputs.retag == null }}
    # 22.04 like the release job: the image is `FROM ubuntu:22.04`, and the
    # runner's engine is what builds it, not what runs it, so this is for
    # sameness rather than correctness.
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The release's tree, not main's: its index and its install.sh. On a
          # release-nros.yml run, the commit being released (the tag does not
          # exist on a dry run, and on a publish it names that commit).
          ref: ${{ inputs.ref || format('nros-{0}', inputs.version) }}

      # Issue 2635, user ruling 2026-11-16: a release's tag is immutable, so a
      # tag whose own context writer cannot write its context (0.6.0-nros11:
      # the step reader refused the book's split step 34) is built with
      # main's writer over the tag's tree. ONLY the writer comes from main;
      # the book it reads, the index, install.sh and every copied input stay
      # the tag's, so the image is still that release's. Both revisions go in
      # the labels below.
      - name: Take the context writer from main
        id: scripts
        if: ${{ inputs.scripts_from_main == true }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          writer=(scripts/ci/starter-image.sh scripts/ci/image-context.sh
                  scripts/ci/lib/image-context.sh scripts/probe/extract-book-steps.py
                  scripts/lib/book_tabs.py)
          git checkout FETCH_HEAD -- "${writer[@]}"
          echo "context writer from main $(git rev-parse FETCH_HEAD): ${writer[*]}"
          echo "rev=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

      - name: Name the tag
        id: tag
        run: |
          set -euo pipefail
          target='${{ inputs.target || 'starter' }}'
          case "$target" in
            starter) tag='${{ inputs.version }}' ;;
            starter-zephyr) tag='${{ inputs.version }}-zephyr' ;;
            *) echo "unknown target '$target'" >&2; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE:$tag" >> "$GITHUB_OUTPUT"
          echo "image: $IMAGE:$tag ($target)"

      # phase-567 W3: the asset the release's build job produced, served on
      # the loopback for install.sh's NROS_INSTALL_URL (its .sha256 beside it,
      # still required). The build uses the host network to reach it. The
      # same bytes on a dry run and a publish, so the image a dry run verified
      # is the image a publish pushes.
      - name: Fetch the release asset
        if: ${{ inputs.asset_artifact != '' && inputs.asset_artifact != null }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.asset_artifact }}
          path: ${{ runner.temp }}/asset
      - name: Serve the release asset
        id: asset
        if: ${{ inputs.asset_artifact != '' && inputs.asset_artifact != null }}
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/asset"
          (cd "$RUNNER_TEMP/asset" && nohup python3 -m http.server 8422 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:8422/nros-linux-x86_64.tar.zst" && break
            sleep 1
          done
          curl -fsS -o /dev/null "http://127.0.0.1:8422/nros-linux-x86_64.tar.zst.sha256"
          echo "args=--network host --build-arg NROS_INSTALL_URL=http://127.0.0.1:8422/nros-linux-x86_64.tar.zst" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RFC-0127 D5 guarantee 1, checked BEFORE the build: a version tag is
      # never re-pushed. `manifest inspect` exits non-zero for a tag that does
      # not exist; anything it can read is a tag somebody already relies on.
      - name: Refuse an existing version tag
        run: |
          set -euo pipefail
          ref='${{ steps.tag.outputs.ref }}'
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "starter image: $ref already exists, and version tags are immutable (RFC-0127 D5 guarantee 1)." >&2
            echo "Release a new version instead; a semester tag moves with the retag dispatch." >&2
            exit 1
          fi
          echo "$ref is free"

      # A hosted runner has ~14 GB free; `starter` peaks above that while its
      # build steps run, and `starter-zephyr` adds ~10 GB. These trees are
      # the runner image's, not ours.
      - name: Free runner disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
                      /opt/hostedtoolcache
          df -h /

      - name: Build (size checked against the budget)
        run: |
          set -euo pipefail
          bash scripts/ci/starter-image.sh \
              --target '${{ steps.tag.outputs.target }}' \
              --tag '${{ steps.tag.outputs.ref }}' \
              -- --build-arg 'NROS_VERSION=${{ inputs.version }}' \
                 --label 'org.opencontainers.image.source=https://github.com/${{ github.repository }}' \
                 --label 'org.opencontainers.image.version=${{ inputs.version }}' \
                 --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
                 ${{ steps.scripts.outputs.rev && format('--label io.nano-ros.context-writer-revision={0}', steps.scripts.outputs.rev) || '' }} \
                 ${{ steps.asset.outputs.args }}

      # phase-567 W3: the `image` probe track against the image THIS job
      # built, before any push: the size budget, every `probe=` block of the
      # starter page (the seat's steps with --network none) and the course
      # recipe. On a dry run and a publish alike.
      - name: Verify the built image (no pull)
        run: bash scripts/probe/verify-starter-image.sh '${{ steps.tag.outputs.ref }}'

      # phase-567 W3: the pinned-newer replay with the asset this release is
      # made of standing in for the published release: that asset installed,
      # then a project pinned to the previous release built under its pin.
      # `pinned` cannot be rehearsed before publishing (the asset under test
      # sorts above the pin, so the front it expects is not the one it gets);
      # it stays a post-publish check. Once per release, on the `starter` leg.
      # This runner has no `just`; the replay below is its only invocation.
      - name: Install just (if absent)
        if: ${{ inputs.asset_artifact != '' && inputs.asset_artifact != null && (inputs.target || 'starter') == 'starter' }}
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            # issue 1760 — the pinned, checksummed release asset, retried on
            # every error class; never a piped installer script.
            bash scripts/ci/install-just.sh --to "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Replay pinned-newer against the release asset
        if: ${{ inputs.asset_artifact != '' && inputs.asset_artifact != null && (inputs.target || 'starter') == 'starter' }}
        env:
          PROBE_BRANCH: ${{ github.ref_name }}
          PROBE_CANDIDATE_ASSET: ${{ runner.temp }}/asset
          PROBE_CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source ./activate.sh
          just probe pinned-newer

      - name: Push
        if: ${{ inputs.push != false }}
        run: |
          set -euo pipefail
          ref='${{ steps.tag.outputs.ref }}'
          # Re-checked: another run may have pushed while this one built.
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "starter image: $ref appeared during the build; not overwriting it." >&2
            exit 1
          fi
          docker push "$ref"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
          echo "pushed $ref"
          echo "digest $digest"
          printf '%s\n' "### starter image" "" "\`$ref\`" "" "\`$digest\`" \
              "" "\`latest\` is unchanged: the \`image\` probe track moves it (RFC-0127 D7)." \
              >> "$GITHUB_STEP_SUMMARY"

  retag:
    name: retag ${{ inputs.retag }} -> ${{ inputs.version }}
    if: ${{ inputs.retag != '' && inputs.retag != null }}
    runs-on: ubuntu-22.04
    # NEVER RUN, so unmeasured. A registry retag; re-measure from its first run.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Retag
        env:
          RETAG: ${{ inputs.retag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # `latest` is the probe track's; a version-shaped name would be a
          # second, mutable spelling of an immutable tag.
          case "$RETAG" in
            latest) echo "retag: \`latest\` moves only through the image probe track (RFC-0127 D7)" >&2; exit 1 ;;
            [0-9]*.*|*-zephyr) echo "retag: '$RETAG' looks like a version tag, which is immutable (RFC-0127 D5)" >&2; exit 1 ;;
          esac
          case "$RETAG" in
            *[!A-Za-z0-9._-]*|'') echo "retag: '$RETAG' is not a valid tag" >&2; exit 1 ;;
          esac
          docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null
          docker buildx imagetools create -t "$IMAGE:$RETAG" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:$RETAG" | head -5
          printf '%s\n' "### starter image retag" "" "\`$IMAGE:$RETAG\` -> \`$IMAGE:$VERSION\`" \
              >> "$GITHUB_STEP_SUMMARY"
