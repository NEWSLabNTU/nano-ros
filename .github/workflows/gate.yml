  check-workspace-all:
    name: check / workspace-all (host + embedded clippy)
    # phase-489 W2 — this job and `check-test-unit` are ROUTED by event.
    #
    #   merge_group, workflow_dispatch   [self-hosted, linux, nros-sdk-zephyr,
    #                                    nros-big] — the L3 label set, since the
    #                                    embedded half needs arm-none-eabi-gcc
    #   pull_request, schedule           ubuntu-22.04 in the CI image, as before
    #
    # WHY ONLY THOSE EVENTS. Merge throughput is set by the merge-group run, so
    # that is where a faster sibling pays. Three runners also carry queue L3
    # (one at a time) and the nightly lanes; the pull-request load is about
    # twice the merge-group load (measured over the first day after W1: 41
    # pull_request vs 21 merge_group runs), and adding it would saturate the
    # pool and starve L3. `schedule` runs at night, beside the nightly matrix.
    #
    # NEVER ON A PULL REQUEST, so never on a fork's. This is a public repo; a
    # fork PR from a returning contributor needs no approval, and on a
    # self-hosted runner it would run contributor code on lab machines
    # (docs/development/multi-agent-ci-workflow.md, rule 1).
    # `check-workflow-runner-isolation` proves the route's condition cannot be
    # true on `pull_request` / `pull_request_target`.
    #
    # THE INTERLOCK — its OWN variable, `vars.NROS_GATE_SELF_HOSTED`, unset by
    # default, so landing this changes nothing until an operator turns it on.
    # Not `NROS_SELF_HOSTED_READY` (queue L3's): that switch is safe to leave on
    # for a lane nothing requires, and these jobs feed the REQUIRED `CI`. A job
    # whose labels no live runner takes does not fail, it WAITS, so a stalled
    # pool would freeze the merge queue until its check timeout. Measured on
    # 2026-10-12 while this was written: two of the three runners showed
    # `online`/idle and took no job for hours (every queue L3 that day ran on
    # newslab-server-241; nightly and run-matrix sat queued). Turn it on only
    # after a `workflow_dispatch` run of this workflow has gone green on the
    # pool; turn it off (unset, or anything but `true`) to send both jobs back
    # to the hosted runner on the next run.
    #
    # `check-cli-tests` is routed the same way (its comment block says what
    # the runner image needed first: the ROS interface packages its rosidl
    # parity tests read).
    #
    # A self-hosted checkout persists, so the first step after checkout is
    # `scripts/ci/self-hosted-clean-tree.sh` — see its header.
