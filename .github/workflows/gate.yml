        with:
          path: |
            packages/cli/target/release/nros
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
            packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
          key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

      - name: Build the in-tree nros CLI (every event)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup-cli
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      - name: Provision clang-format (pinned by [tool.clang-format])
        run: |
          source ./activate.sh
          just setup-clang-format

      - name: Provision Corrosion (pinned by [tool.corrosion])
        run: |
          source ./activate.sh
          just workspace install-corrosion

      - name: Provision compile-tier sources
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Fetch the pin baseline for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh provide

      - name: Init submodules whose pin moved (commits only)
        run: bash scripts/ci/pin-baseline.sh init-moved

      - name: Fetch submodule history for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh deepen

      - name: Build nros-launch-resolve (cli-tests and generate-bindings both shell out to it)
        if: >-
          ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name)
              && !cancelled() }}
        run: |
          source ./activate.sh
          just setup-launch-resolve

      # `check-api-parity` has NO step of its own here, and that is now the
      # finished answer rather than a deferral — issue 1066, closed.
      #
      # (phase-489 W5: it has since left the fast LANE for the
      # `check-fast-compile` sibling, which runs it by name on every event
      # `check-fast` runs on. The history below is why it gates at all.)
      #
      # IT RUNS. `api-parity` came off `.config/gate-lane-exempt.txt` in
      # `565f8c74f`, so it is an ordinary fast-lane gate and `just check fast`
      # (the `check-fast` sibling) runs it on `pull_request`, `merge_group`, `push` and the
      # nightly alike. Measured in this container, run 34687504281 on
      # 2026-09-12:
      #
      #   check-fast: 319 gate(s) at -P4, busy 1542s over wall 386s
      #   slowest gate: api-parity, 217543 ms (14.1% of busy)
      #
      # That log line is also the image evidence. `api_parity/extract_cxx.py`
      # shells out to `clang -Xclang -ast-dump=json`, and this comment used to
      # say the image shipped none — true until `0c73d061b` added it and issue
      # 1201 fixed the build that had been failing to publish it since
      # 2026-09-04. A 217 s clang+rustdoc extraction that exits 0 is a stronger
      # statement about what the image contains than any `which clang` step.
      #
      # WHY NOT A DEDICATED STEP ANYWAY. The argument for one was a cleaner
      # verdict name (phase-421's `node_get_serialization_format` accessors
      # landed UNLEDGERED and nobody could see which gate would have said so).
      # It costs a second full extraction: 217 s SERIAL, against a lane whose
      # whole wall is 386 s because the gate runs inside it at -P4. A step that
      # adds 56% to the job's wall to rename a failure is the wrong trade;
      # `just check fast` already prints `[FAIL] api-parity` with the row key.
      #
      # WHAT THE PR LANE COULD NOT DO, and now can: the gate's only authored
      # inputs are `docs/reference/api-parity-ledger/` (2158 rows) and
      # `docs/reference/api-surface/`, both under `docs/`, which the `code`
      # probe above classified as documentation. So a pull request whose ENTIRE
      # SUBJECT was the ledger skipped this job and got no parity verdict until
      # the merge queue. The probe now excepts those two paths — see its
      # comment. Same shape as the `colcon` filter's `gate.yml` entry: a filter
      # that excludes the thing under test.

      # phase-396 W1 — the build tier is NOT on the merge group.
      #
      # It was (phase-395, `197eef4fa`, "PR cheap, batch thorough"), and the
      # amortisation argument was right: pay for expensive verification once per
      # batch instead of once per push. What it missed is that `check-build` was
      # never RUNNABLE here. It ends with `linux::check`, which hard-requires
      # generated message bindings, and includes `check-source-gates`, which
      # asserts prebuilt `.compile-ok` fixtures. This job builds the CLI,
      # provisions sources, and stops — so neither exists, and the required
      # check failed for EVERY pull request, not for any one of them:
      #
      #   native check: 40 example(s) are missing their generated message bindings
      #   BuildFailed("Test fixture binary not prebuilt: …/platform_hdr_posix_cpp_heap/.compile-ok")
      #
      # A merge queue routes around a change-specific failure by ejecting the
      # culprit and re-testing the rest. It cannot route around a check that is
      # red before it sees your change: every entry is the culprit. Six merge
      # groups, three different authors, one failing job, nothing merged for a
      # day.
      #
      # So the required set is now exactly `ci-l1` — `check-fast` + `test-unit`,
      # the tier CLAUDE.md tells every agent to run before pushing, and the one
      # `check-lane-contracts` proves is fixture-free. A required check should be
      # the thing the contributor was told to run.
      #
      # WHAT THIS GIVES UP, plainly: the merge group no longer catches a
      # compile-tier break in the merged state. `post-submit.yml` catches it on
      # `main` minutes later — it already runs tier-2 fixtures and `just
      # ci-matrix` — and that is the standard three-bucket split (required =
      # cheap and deterministic; heavy = post-merge with a revert path). It is a
      # real reduction in pre-merge coverage, and still the right trade: a check
      # that has never once passed provides no coverage at all.
      #
      # Restoring it means giving this job the artifacts first (PR #14 adds
      # `build-compile-check-fixtures`; the bindings half is unowned). Do that
      # before putting the tier back, not after.
      # issue 0871 — `check-build` runs `check-source-gates`, whose tests ASSERT
      # a prebuilt `.compile-ok` stamp that nothing in this job builds. phase-396
      # W1 took the build tier OFF the merge group precisely because it was not
      # runnable here, and named this step as one half of what restoring it needs
      # ("PR #14 adds build-compile-check-fixtures; the bindings half is
      # unowned"). This is that half: the tier below can now at least get past
      # `check-source-gates` on the nightly/manual lane.
      #
      # Same condition as the step it feeds, deliberately — it exists only to
      # serve `check-source-gates` and must never run on the cheap PR path.
      #
      # `builder=cxx-syntax`, not the whole manifest: the `cargo-check` and
      # `cmake-configure` rows need `nros-launch-resolve` / `play_launch_parser`
      # from `activate.sh`, which this job does not provision — an unfiltered run
      # FAILS on those and never reaches the rows the gate asserts. Measured: 2 s
      # filtered vs 428 s for everything.
      - name: build compile-check fixtures (check-source-gates asserts them)
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        run: |
          source ./activate.sh
          just build-compile-check-fixtures cxx-syntax

      # issue 0898 — the OTHER artifact `check-build` asserts and this job never
      # produced. phase-396 W1 named both halves when it took the build tier off
      # the merge group: "PR #14 adds build-compile-check-fixtures; the bindings
      # half is unowned". This is the bindings half.
      #
      #   native check: 40 example(s) are missing their generated message bindings
      #
      # Example msg crates (`generated/<msg>/`) are build-time AND
      # ROS-version-dependent, so they are gitignored and never shipped. `just
      # check` deliberately refuses to sync them — that would couple a static
      # check to a live ROS environment and rewrite each example's
      # `[patch.crates-io]` — so it GATES instead and names this remedy. The gate
      # is right; the job simply never ran the remedy.
      #
      # Affordable because this image HAS ROS: measured 23 s on a humble host for
      # the whole tree, against the ~587 s tier it unblocks.
      # phase-489 W4 — restore what the verb wrote last time, then run the verb.
      # The cache ONLY pre-populates: `just generate-bindings` below still runs
      # and its own content-addressed freshness (the standalone `.sig` stamps,
      # the probe sidecars' `probe_inputs_key`) regenerates anything stale. Key
      # and cached paths come from ONE script; `check` refuses a cached path git
      # tracks. Measured: a tree with fresh sidecars runs the verb in ~10 s,
      # against 18.7-21.7 min from cold (the C/C++ metadata probes, not codegen).
      - name: Key the message-bindings cache on the verb's real inputs
        id: bindings-key
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        run: |
          source ./activate.sh
          scripts/ci/bindings-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Restore the message bindings + probe sidecars (pre-populate only)
        id: bindings-cache
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.bindings-key.outputs.paths }}
          key: ${{ steps.bindings-key.outputs.key }}
          restore-keys: ${{ steps.bindings-key.outputs.restore-prefix }}

      - name: generate message bindings (linux::check asserts them)
        id: generate-bindings
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        run: |
          source ./activate.sh
          just generate-bindings

      # Saved right after the verb, not at job end, so the entry holds exactly
      # what the verb produced. Skipped on an EXACT hit (the entry already says
      # this); a prefix hit saves, because the verb refreshed part of it.
      - name: Save the message bindings + probe sidecars
        if: ${{ steps.generate-bindings.outcome == 'success' && steps.bindings-cache.outputs.cache-hit != 'true' && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.bindings-key.outputs.paths }}
          key: ${{ steps.bindings-key.outputs.key }}

      # The `source /opt/ros/humble/setup.bash` below is load-bearing, not
      # boilerplate: `check-rmw-cyclonedds`'s from-msg targets run
      # msg_to_cyclone_idl.py at BUILD time, which imports rosidl_adapter from
      # /opt/ros. The configure-time probe only checks the converter script
      # EXISTS (issue-0196 class: probe narrower than the rule), so an
      # unsourced env fails at 80% of the build rather than at configure.
      # Issue 0993 — this lane was put on the pull-request path and TAKEN BACK
      # OFF, and the measurement is why. It is recorded here because the
      # obvious next person to try it will make the same estimate.
      #
      # The design was sound: `generate-bindings` and the compile-check fixtures
      # are its prerequisites, they live in THIS job, so widening three `if:`
      # guards gates the lane while it still resolves only artifacts the job
      # itself builds. Nothing joins the required set.
      #
      # The COST killed it. Measured 190 s wall locally at -P32 — and CI fans
      # out at **-P4**, where the same lane took ~37 minutes (16:27 -> 17:05 on
      # run 33654481082), `source-gates` alone 496 s. The `check` job went from
      # 18 to 42 minutes. A four-core runner is the number that matters, and a
      # 32-core dev box says nothing useful about it.
      #
      # It also surfaced three gates that FAIL in the container — `borrowed-e2e`,
      # `sched-dim-arms`, `source-gates` — and the nightly had been red on
      # `borrowed-e2e` since at least 2026-09-01 with nobody noticing, which is
      # issue 0993's whole thesis arriving on schedule. Filed separately; a lane
      # cannot start gating pull requests while it is already red.

      # ONE GATE PER STEP — issue 1040, measured 2026-09-05.
      #
      # These three shared a single `run:` block, and a `run:` block is `bash
      # -e`: the first non-zero command ends it. `check build` has been red on
      # this lane since 2026-09-01 (`workspace-all`, `workspace-features`), so
      # `check no-std` and `check api-parity` NEVER EXECUTED on any of the five
      # scheduled runs since they were wired here. The step reported one red for
      # three gates, and two of them had no verdict at all — issue 0952's
      # withdrawal class, one level down from the recipe that names it.
      #
      # That is worse than not wiring them: `grep -rl api-parity
      # .github/workflows/` now answers yes while the gate has still never run
      # in CI. A placement that cannot report is not a placement.
      #
      # `!cancelled()` on each is what makes the split work: GitHub skips later
      # steps after a failure only under the default `success()` condition.
      # Issue 1353 step 1 — the compile tier dies of `No space left on device`
      # and leaves an artifact that cannot say what filled the disk (often the
      # log is truncated mid-compile, because when the disk is gone the log has
      # nowhere to land either). These two reports bracket the step the issue
      # names. They never fail the job: a report that can break the lane it
      # reports on is worse than no report.
      - name: Disk report (before check build) — issue 1353
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        run: scripts/ci/disk-report.sh "before just check build"

      # Issue 1353 step 3, phase-466 W4. Same script and same reasoning as
      # host-tests.yml, and it runs on the same events as the step it protects:
      # `check build` is the only thing in this job that has ever exhausted the
      # disk, and it is `schedule`/`workflow_dispatch` only.
      #
      # This lane's numbers are NOT known — the failure destroys its own job
      # log (run 35808783184: the before-report reported success and its output
      # was never uploaded), which is what the `::notice::`/step-summary channel
      # added to `disk-report.sh` is there to fix. So this step is headroom
      # bought against a measured cause on a sibling lane, not against a
      # measurement of this one, and the next scheduled run is what prices it.
      - name: Reclaim disk before the compile tier — issue 1353
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        run: scripts/ci/reclaim-disk.sh "before just check build"

      # THE CHANNEL THAT SURVIVES — issue 1353, and the reason this step is
      # here rather than one upload at the end of the job.
      #
      # Measured on scheduled run 35945635228 / job 107462875362 (2026-09-24):
      # the two steps above both COMPLETED, and neither of the channels
      # phase-466 W4 gave them carried their numbers off the runner. The job's
      # annotations hold one entry — the runner's own `IOException`, written by
      # the service — and its three `::notice::` lines are absent; the run page
      # renders no job summary for it either. Both are runner-side buffers, so
      # they die with the runner, which is the only failure mode this lane has.
      #
      # An artifact does not: once THIS step finishes, the blob exists
      # server-side, and `just check build` can take the runner with it without
      # taking the measurement. That is why the upload is its own step placed
      # immediately after the reclaim, and why there is a second one after the
      # compile tier rather than a single `always()` upload at the end —
      # `always()` only binds while a runner is alive to honour it, which is
      # exactly what this failure removes.
      #
      # The transcript path has one home, `scripts/ci/disk-transcript.sh`,
      # which publishes it to `$GITHUB_ENV`; naming the variable here rather
      # than repeating the path is what keeps the upload pointing at the file
      # the scripts actually write.
      - name: Upload the disk transcript (before check build) — issue 1353
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() && env.NROS_DISK_TRANSCRIPT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: disk-transcript-before-check-build
          path: ${{ env.NROS_DISK_TRANSCRIPT }}
          if-no-files-found: ignore
          retention-days: 7

      - name: just check build (nightly / manual only)
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        run: |
          source ./activate.sh
          just check build

      # `always()`, not `!cancelled()`: the run that FAILED is the one whose
      # numbers matter, and the default `success()` would skip exactly it.
      - name: Disk report (after check build) — issue 1353
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && always() }}
        run: scripts/ci/disk-report.sh "after just check build"

      # The second upload, and the one that matters most on 2026-09-24's
      # evidence: on that run `just check build` FAILED (a step verdict, step
      # 24) and the after-report SUCCEEDED (step 25) — the runner was alive and
      # writing — and it was `just check no-std`, the step below, that killed
      # it. So the transcript held both brackets' numbers and nothing could
      # read them. This carries the same file, now including the after-report,
      # before the step that has been doing the killing.
      #
      # It replaces rather than duplicates the artifact above, by name: a
      # separate name is deliberate, so a run that dies during the upload still
      # leaves the earlier artifact intact.
      - name: Upload the disk transcript (after check build) — issue 1353
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && always() && env.NROS_DISK_TRANSCRIPT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: disk-transcript-after-check-build
          path: ${{ env.NROS_DISK_TRANSCRIPT }}
          if-no-files-found: ignore
          retention-days: 7

      - name: just check no-std (nightly / manual only)
        if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        run: |
          source ./activate.sh
          just check no-std
      - name: sccache stats (compile tier)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) && always() }}
        run: |
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || true
          if [ -s /tmp/sccache-server.log ]; then
            echo "--- sccache server log (deduped) ---"
            { sort /tmp/sccache-server.log | uniq -c | sort -rn | head -25; } || true
          fi

  # ----- scaffold-journey (RFC-0040 resolve-only) -----
  # phase-422 follow-up — WARM the compile-tier caches on `main`, so the
  # pull_request and merge_group runs can actually restore them.
  #
  # Measured on merge_group: "Build nros CLI + provision" 128 s and "Build
  # nros-launch-resolve" 91 s, EVERY entry, plus an sccache dir that missed both
  # its exact key and its `sccache-Linux-check-` restore prefix. 219 s per entry
  # rebuilding artifacts whose sources had not changed.
  #
  # The cause is cache SCOPING, not the keys. GitHub lets a run restore caches
  # from its own ref or from the DEFAULT branch, and nothing else. A merge_group
  # run executes on an ephemeral `gh-readonly-queue/main/pr-N-<sha>` ref, so the
  # cache it saves is scoped to a ref that will never run again, and the only
  # other scope it can read — `main` — was never written, because every cache
  # step in the `check` job is gated to
  # pull_request/merge_group/schedule/workflow_dispatch. Both halves of the
  # restore therefore missed by construction, which is exactly what the logs
  # showed: "Cache not found for input keys: nros-cli-Linux-<hash>,
  # nros-cli-Linux-".
  #
  # This job writes those same keys on `push` to main — once per merge, instead
  # of once per queue entry. It deliberately does NOT run the gates: its only
  # product is a populated cache.
  warm-cache:
    name: warm the compile-tier cache (main only)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      # Same path + key as `check-cli-tests`' full-tree cache, or this warms nothing.
      # `check-gate-cache-keys-agree` asserts they stay identical.
      #
      # RESTORE here, SAVE right after "Build nros CLI + the launch resolver"
      # below — deliberately split. `actions/cache` saves in a POST step, at
      # job end; by then nothing else in THIS job writes into these two
      # `target` dirs, but a combined action still stores whatever the runner
      # image itself leaves lying around under them plus whatever a future
      # step here grows into. Measured on the live cache under the sibling
      # `nros-cli-*` key in host-tests.yml: entries at 116 MB (restore/save
      # split, bounded to the CLI build) and 8194 MB (combined action, one
      # entry carrying a whole job's leftovers) — the repository's 10 GB
      # Actions cache total was at 11.69 GB, so GitHub was evicting, including
      # `gate.yml`'s own sccache entry that the required PR check reads.
      - name: Restore CLI build cache (compile tier)
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/cli/target
            packages/cli/nros-launch-resolve/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      # RESTORE here, SAVE right after "Build nros CLI + the launch resolver"
      # below — same split, same reason: sccache's own dir is populated by
      # that same step (every `cargo` call there runs through `RUSTC_WRAPPER`
      # once "Configure sccache" exports it), and nothing after that step
      # writes into it.
      - name: Restore sccache directory
        id: sccache-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sccache
          key: sccache-${{ runner.os }}-check-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-check-
            sccache-${{ runner.os }}-

      # The warm job must START sccache, and must name it as the compiler
      # wrapper ITSELF. Both halves were missing and the job warmed nothing.
      #
      # The `check` job gets away without either because every build it runs
      # goes through `just`, and `justfile:13` is
      # `export RUSTC_WRAPPER := command -v sccache`. This job calls `cargo`
      # DIRECTLY, so that export never applies: no wrapper ran, `/tmp/sccache`
      # was never created, and the save step ended every run with
      #
      #   Path Validation Error: Path(s) specified in the action for caching
      #   do(es) not exist, hence no cache is being saved.
      #
      # which is a warning, not a failure, so the job stayed green while
      # producing nothing. Measured consequence: NO `sccache-*` entry has ever
      # existed on `refs/heads/main`, and a `pull_request` run may restore only
      # from its own ref or the default branch — so every PR compiled cold at a
      # 1.55% hit rate (19 hits / 1210 misses on run 33991268794), which is
      # most of `check cli-tests`' 311 s.
      #
      # Same shape as the `check` job's configure step and for the same reason
      # (issue 0874): PROVE the backend in this step, publish to `$GITHUB_ENV`
      # only if the server started. A broken sccache handed to `rustc` fails
      # the COMPILER rather than losing a cache.
      # phase-489 W5 — which CPU did this run land on? The same gate set has
      # measured 6.0 min and 12.2 min of busy CPU on hosted runners, every gate
      # 1.6-2.0x slower in the slow runs, and the log named no CPU model, so the
      # hardware explanation stayed a suspicion. Evidence only: no behaviour.
      - name: Report runner hardware
        run: scripts/ci/report-runner-hardware.sh

      - name: Configure sccache
        run: |
          # Create the dir unconditionally: the cache path must exist at save
          # time or the step warns and saves nothing, which is the failure this
          # is fixing. An empty dir is a 0-byte entry, not a wrong one.
          mkdir -p /tmp/sccache
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::warning::sccache absent from the image — this job warms NOTHING."
            exit 0
          fi
          sccache --version
          export SCCACHE_DIR=/tmp/sccache
          export SCCACHE_CACHE_SIZE=2G
          export SCCACHE_ERROR_LOG=/tmp/sccache-server.log
          export SCCACHE_LOG=warn
          if sccache --start-server >/tmp/sccache-start.log 2>&1; then
            {
              echo "SCCACHE_DIR=/tmp/sccache"
              echo "SCCACHE_ERROR_LOG=/tmp/sccache-server.log"
              echo "SCCACHE_LOG=warn"
              echo "SCCACHE_CACHE_SIZE=2G"
              # The half the `check` job does not need. Without it the builds
              # below are plain rustc and this job is decorative.
              # Issue 1646 — the SHIM, which runs a `staticlib` uncached
              # (sccache cannot key its transitive closure) and hands
              # every other call to the sccache on PATH.
              echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/scripts/bin/rustc-wrapper/sccache"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable — this job warms NOTHING (issue 0874)."
            sed 's/^/  /' /tmp/sccache-start.log || true
          fi

      # phase-489 W3 — the binary cache the `check-*` siblings restore. Same key
      # step and paths as theirs (`check-gate-cache-keys-agree`). `lookup-only`:
      # this job only needs to know whether main already holds the entry.
      - name: Key the CLI binary cache on source_stamp.rs's whole watch set
        id: cli-key
        run: |
          key="$(scripts/ci/cli-bin-cache-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look up the CLI binary cache
        id: cli-bin-cache
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: |
            packages/cli/target/release/nros
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
            packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
          key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

      - name: Build nros CLI + the launch resolver
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup-cli
          # phase-429 W5 — ASSERT the binary matches the checkout, do not hope.
          # The other four acquisition sites carried this and this one did not,
          # which is worse than a missing check: four green steps taught that
          # the rule was in force here too. A warmed cache whose key is narrower
          # than `source_stamp.rs`'s watch set hands `check cli-tests` a binary
          # from a different tree (phase-431 W2, `check-ci-cli-from-source`).
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          # phase-489 W3 — the user's verbs, not bare `cargo build`s: the
          # binary cache carries the content stamp and the Python half
          # `setup-launch-resolve` writes beside the resolver, and a consumer's
          # `just setup-launch-resolve` skips only when both are there.
          just setup-launch-resolve
          # `check cli-tests` is 338 s of the 20 min job and it is COMPILE-bound
          # (measured: 350 CPU-s to build, tests run in under a second). Warming
          # only the binary left the biggest step cold — main's warm entry was
          # 208 MB against the 1.78 GB a `check` run actually caches. `--no-run`
          # compiles the test harnesses without executing them, which is exactly
          # the artifact that step waits on.
          cargo test --no-run --manifest-path packages/cli/Cargo.toml

      # SAVE NOW, before anything else writes into these paths (nothing after
      # this point does). See the restore steps above for the measurement.
      # `if: always()` is deliberately NOT set: a failed build leaves a target
      # dir that should not become the entry every later run restores from.
      - name: Save CLI build cache (compile tier)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            packages/cli/target
            packages/cli/nros-launch-resolve/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}

      - name: Save the CLI binary cache (phase-489 W3)
        if: steps.cli-bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            packages/cli/target/release/nros
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
            packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
          key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

      # phase-489 W5 — warm what the `check-fast` job actually COMPILES.
      #
      # Until now this job warmed the CLI build and nothing else, so the
      # restored sccache answered none of `check-fast`'s ~1240 compile requests
      # (30 hits, 3.7 %) and its compile-heavy gates (`probe-workspace-caps`,
      # `api-parity`, `declared-qos-registration`, ...) ran cold on every pull
      # request. The honest way to warm a gate is to RUN it, the way a user
      # does, so this runs `just check fast` itself after the same provisioning
      # as the `check-fast` job (the steps below are copies of its steps of the
      # same name). A pull request or a queue entry never waits on this job; it
      # reads the cache it leaves behind. Compile
      # requests are keyed on the checkout path (`/__w/nano-ros/nano-ros`) and
      # the compiler flags, which this job and the consumers share.
      - name: Provision clang-format (pinned by [tool.clang-format])
        run: |
          source ./activate.sh
          just setup-clang-format

      - name: Provision Corrosion (pinned by [tool.corrosion])
        run: |
          source ./activate.sh
          just workspace install-corrosion

      - name: Provision compile-tier sources
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Fetch the pin baseline for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh provide

      - name: Init submodules whose pin moved (commits only)
        run: bash scripts/ci/pin-baseline.sh init-moved

      - name: Fetch submodule history for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh deepen

      - name: Fetch commit history for the citation gates (commits only)
        timeout-minutes: 6
        run: |
          base="${GITHUB_BASE_REF:-main}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=1 origin \
              "+refs/heads/$base:refs/remotes/origin/$base"
            . scripts/lib/deadline.sh
            "${NROS_DEADLINE[@]}" 300 git fetch --no-tags --quiet --filter=tree:0 --unshallow \
              origin "+refs/heads/$base:refs/remotes/origin/$base"
          fi
          test "$(git rev-parse --is-shallow-repository)" = false
          git rev-list --count HEAD

      - name: Provision the sources the fast-line source gates read
        timeout-minutes: 8
        run: |
          git submodule update --init --depth 1 \
            packages/rmw/zenoh/zpico-sys/zenoh-pico \
            packages/rmw/xrce/xrce-sys/micro-cdr \
            packages/rmw/xrce/xrce-sys/micro-xrce-dds-client \
            third-party/nuttx/libc
          rev="$(awk '/- name: zephyr$/ { z = 1 } z && /revision:/ { print $2; exit }' west.yml)"
          [ -n "$rev" ] || { echo "no zephyr revision in west.yml" >&2; exit 1; }
          if [ ! -d zephyr-workspace/zephyr/lib/cpp/minimal/include ]; then
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch "$rev" \
              https://github.com/zephyrproject-rtos/zephyr.git zephyr-workspace/zephyr
            git -C zephyr-workspace/zephyr sparse-checkout set lib/cpp/minimal/include
          fi

      # NOT `continue-on-error`: this runs a gate, and `ci-ok` hears it
      # (`check-default-gates-run-somewhere`). The save below is `!cancelled()`
      # instead, so a gate that flakes on main still leaves the ~1 GB of
      # compiles that DID finish.
      - name: just check fast (warms the compiles `check-fast` makes)
        run: |
          source ./activate.sh
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"
          PATH="$GITHUB_WORKSPACE/packages/cli/target/release:$PATH" just check fast

      # phase-489 W5 — `check-fast-compile`'s two gates left the fast line, and
      # they are most of its compiles, so they are warmed by name here
      # (`check-gate-cache-keys-agree`). One per block, like any gate placement.
      - name: just check probe-workspace-caps (warms `check-fast-compile`)
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          just check probe-workspace-caps

      - name: just check api-parity (warms `check-fast-compile`)
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          just check api-parity

      - name: Save sccache directory
        if: ${{ !cancelled() && steps.sccache-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/sccache
          key: sccache-${{ runner.os }}-check-${{ github.sha }}

      # Say what was actually warmed. This job was green for its whole life
      # while saving nothing, because the only evidence was a `::warning::` in
      # the save step's log. A size of 0 here means the wrapper did not run and
      # every PR after this one will compile cold — the one number that says
      # whether the job did its job.
      - name: Report what was warmed
        if: always()
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
          echo "sccache dir: $(du -sh /tmp/sccache 2>/dev/null | cut -f1) in $(find /tmp/sccache -type f 2>/dev/null | wc -l) file(s)"
          if [ -z "$(find /tmp/sccache -type f 2>/dev/null | head -1)" ]; then
            echo "::warning::sccache dir is EMPTY — nothing to save, so every pull request will compile cold."
          fi

  scaffold-journey:
    name: nros new -> sync -> resolve
    needs: changes
    if: ${{ needs.changes.outputs.scaffold == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      # RESTORE here, SAVE right after "just scaffold-journey" below —
      # deliberately split. `actions/cache` saves in a POST step, at job end;
      # `just scaffold-journey`'s `setup-cli` prereq is what actually populates
      # `packages/cli/target` (via `cargo build`), and the recipe itself writes
      # nothing else into that dir afterward. A combined action here stores
      # whatever this job leaves behind rather than "the CLI build" alone.
      # Measured on the live cache under the sibling `nros-cli-*` key in
      # host-tests.yml: 116 MB (restore/save split) vs 8194 MB (combined
      # action) — the repository's 10 GB Actions cache total was at 11.69 GB,
      # so GitHub was evicting, including `gate.yml`'s own sccache entry that
      # the required PR check reads.
      - name: Restore CLI build cache (Phase 218)
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      # `just scaffold-journey`'s `setup-cli` prereq does the `cargo build`, but
      # not this nested submodule init — the CLI sub-workspace path-deps
      # ros-launch-manifest-types from it (reached THROUGH ros-launch-resolve,
      # which vendors rlm — phase-312/RFC-0060). Init it before the recipe.
      - name: Init CLI launch-manifest submodule
        run: git submodule update --init --depth 1 packages/cli/third-party/play_launch

      - name: just scaffold-journey
        run: |
          source ./activate.sh
          just scaffold-journey

      # SAVE NOW, before anything else writes into this directory (nothing
      # after this point does — this is the job's last step). See the restore
      # step above for the measurement. `if: always()` is deliberately NOT
      # set: a failed build leaves a target dir that should not become the
      # entry every later run restores from.
      - name: Save CLI build cache (Phase 218)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/cli/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}

  # ----- colcon-parity (the CI image, phase-413 W3) -----
  #
  # This lane used to be bare `ubuntu-22.04` and spend its first minutes adding
  # the ROS apt repository and installing a ROS desktop stack — ten packages —
  # plus `just`, on EVERY run. `images.yml` has been building
  # `ghcr.io/newslabntu/nano-ros-ci:humble` and describing it as "ROS 2 Humble +
  # host tools, the base `container:` for the check / … lanes" the whole time;
  # only `nightly.yml` and the `check` job above used it.
  #
  # MEASURED before converting, not assumed. The image is `FROM
  # ros:humble-ros-base`, and all ten apt names this lane installed are already
  # in that upstream base — `python3-colcon-common-extensions`,
  # `ros-humble-{ros-base,rclcpp,std-msgs,geometry-msgs,sensor-msgs,
  # rosidl-default-generators,rosidl-default-runtime,ament-cmake,
  # ament-cmake-auto}` — with `colcon` on PATH. `just` is baked and PINNED by
  # the image (`JUST_VERSION`), which is stronger than the `curl | sh` this
  # replaces: that fetched whatever was current at run time. Then
  # `just colcon-parity` was RUN in the image: 3 packages, consumer binary
  # produced, 7.63 s.
  #
  # The apt repo step goes with them. Its `gnupg`/`lsb-release` were kept
  # literal on the argument that RFC-0062 cannot express "add this apt
  # repository first" — true, and moot once nothing adds a repository: the
  # image's ROS comes from its own base layer.
  colcon-parity:
    name: colcon build examples/templates/local-msg-package/src/
    needs: changes
    if: ${{ needs.changes.outputs.colcon == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # fixture is self-contained; no nano-ros submodules needed

      # `just colcon-parity` sources ROS, scans ONLY src/ (`--base-paths src`:
      # local_msgs → extra_msgs → consumer, skipping the top-level nano-ros umbrella
      # CMakeLists that needs the `nros` codegen tool), builds, and asserts the
      # consumer binary — the same parity check, no inline drift.
      #
      # The recipe SKIPS when `colcon` is absent (`nros_check_skip`, exit 0).
      # That is right for a developer host and wrong here: this job exists to
      # run it, and an image that lost ROS would report GREEN over nothing —
      # the fail-open shape issues 0650/1001 are about. Assert the precondition
      # the container is supposed to provide, so a skip cannot pass for a run.
      - name: assert this lane can actually run colcon
        run: |
          source ./activate.sh
          if ! command -v colcon >/dev/null; then
            echo "colcon absent from the CI image: the recipe would SKIP and" >&2
            echo "this lane would report green over nothing. The image is" >&2
            echo "FROM ros:humble-ros-base, which carries colcon; if that" >&2
            echo "changed, fix the image rather than this step." >&2
            exit 1
          fi
          echo "colcon: $(command -v colcon)"

      - name: just colcon-parity
        run: |
          source ./activate.sh
          just colcon-parity

  # ----- sdk-index gate (verify prebuilt assets resolve + hash) -----
  sdk-index:
    name: verify nros-sdk-index assets
    needs: changes
    if: ${{ needs.changes.outputs.sdk_index == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify prebuilt assets resolve + hash
        run: python3 scripts/sdk/verify-index.py nros-sdk-index.toml
      # Phase 191.3 — the index source-build flags and the prebuilt build script
      # must not drift (else prebuilt != source-built).
      - name: Check qemu configure flags match (index vs build script)
        run: ./scripts/sdk/check-qemu-configure.sh
      # issue 1006 — a qemu recipe with no `dist` is source-built by every user,
      # so an auto-detected backend makes its runtime deps the build host's.
      - name: Check source-only qemu recipes pin their backends
        run: python3 scripts/sdk/check-qemu-source-features.py nros-sdk-index.toml

  # ---------------------------------------------------------------------------
  # THE REQUIRED CHECK — phase-395 W20.
  #
  # One aggregator, and it is the ONLY context in the required set. This is
  # GitHub's own recommended shape for a workflow with conditional jobs, and it
  # exists because of a defect that froze this repo four separate ways in one
  # day: a required check that fails to produce a VERDICT blocks forever, since
  # GitHub cannot tell "not applicable" from "not yet".
  #
  #   always RED       a gate that could not pass on the runner (issue 0853)
  #   always PENDING   a self-hosted required check with no runner
  #   cannot REPORT    a required check with no `merge_group` trigger
  #   never TRIGGERED  a `paths:` filter the pull request did not match
  #
  # The last one deadlocked two pull requests against each other: #16 carried
  # the ROS-environment fix that #6's merge group needed, and #16 touched only
  # `ci/docker/**`, which the filter did not list — so its required check had
  # never run, and could never run.
  #
  # WHY AN AGGREGATOR FIXES THE CLASS. It has no `if:` on the job and no filter
  # on the trigger, so it ALWAYS runs and therefore always reports. Every real
  # job may then be skipped, filtered or renamed freely — the required set never
  # changes, so it cannot drift out of sync with the workflow either.
  #
  # THE TRAP, which GitHub documents and which makes the naive version useless:
  # A SKIPPED JOB REPORTS SUCCESS. So `needs:` alone is not a gate — an
  # aggregator that merely depends on its jobs passes when they were all
  # skipped. It has to INSPECT `needs.*.result`, which is what the step below
  # does, and treat `skipped` as a deliberate decision rather than a pass.
  ci-ok:
    name: CI
    # `always()` so a failed or skipped dependency still runs this — without it
    # the aggregator is itself skipped, and a skipped required check reports
    # success, which is the vacuous green this exists to prevent.
    if: always()
    needs:
      - changes
      - check-fast
      - check-fast-compile
      - check-compile-smoke
      - check-cli-tests
      - check-workspace-all
      - check-test-unit
      - check-template-copy-out
      - check-lane-contracts
      - check-build
      - warm-cache
      - scaffold-journey
      - colcon-parity
      - sdk-index
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have actually passed
        run: |
          set -euo pipefail
          fail=0
          event="${{ github.event_name }}"

          # The `check-*` siblings are the gate, so a skip has to be JUSTIFIED
          # rather than accepted. Two justifications exist:
          #
          #   1. a pull request that touched no code, where `changes` RAN and
          #      said so. `changes` failing is not "docs only": every sibling
          #      skips then, and that must read as no verdict, never as green.
          #   2. an event the sibling has no work on — its own job-level `if:`
          #      names its events, and the list after each `sibling` call below
          #      must equal that set (`check-default-gates-run-somewhere`
          #      asserts it, and asserts every gate-running job is listed here).
          #
          # Any other skip — including a sibling skipped on one of its OWN
          # events — means the gate did not run, and that must never read as
          # green, which is the vacuous pass this aggregator exists to prevent.
          # `cancelled` and `failure` fail like any other non-success.
          docs_only=0
          if [ "$event" = "pull_request" ] \
             && [ "${{ needs.changes.result }}" = "success" ] \
             && [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            docs_only=1
          fi

          sibling() {
            local name="$1" res="$2" events=" $3 "
            case "$res" in
              success) echo "  ok       $name" ;;
              skipped)
                if [ "$docs_only" = 1 ]; then
                  echo "  skipped  $name (docs-only pull request — no code to verify)"
                elif [[ "$events" != *" $event "* ]]; then
                  echo "  skipped  $name (has no work on $event)"
                else
                  echo "  FAIL     $name was SKIPPED on $event, an event it runs on"
                  echo "           changes=${{ needs.changes.result }} code=${{ needs.changes.outputs.code }}"
                  fail=1
                fi ;;
              *) echo "  FAIL     $name: $res"; fail=1 ;;
            esac
          }

          sibling check-fast           "${{ needs.check-fast.result }}"           "push pull_request merge_group schedule workflow_dispatch"
          sibling check-fast-compile   "${{ needs.check-fast-compile.result }}"   "push pull_request merge_group schedule workflow_dispatch"
          sibling check-compile-smoke  "${{ needs.check-compile-smoke.result }}"  "pull_request"
          sibling check-cli-tests      "${{ needs.check-cli-tests.result }}"      "pull_request merge_group schedule workflow_dispatch"
          sibling check-workspace-all  "${{ needs.check-workspace-all.result }}"  "pull_request merge_group schedule workflow_dispatch"
          sibling check-test-unit      "${{ needs.check-test-unit.result }}"      "merge_group schedule workflow_dispatch"
          sibling check-template-copy-out "${{ needs.check-template-copy-out.result }}" "merge_group workflow_dispatch"
          sibling check-lane-contracts "${{ needs.check-lane-contracts.result }}" "merge_group schedule workflow_dispatch"
          sibling check-build          "${{ needs.check-build.result }}"          "schedule workflow_dispatch"
          sibling warm-cache           "${{ needs.warm-cache.result }}"           "push workflow_dispatch"

          # The narrow lanes are path-gated BY DESIGN, so `skipped` is a real
          # answer for them: their paths did not move. Only a failure counts.
          for pair in \
            "scaffold-journey:${{ needs.scaffold-journey.result }}" \
            "colcon-parity:${{ needs.colcon-parity.result }}" \
            "sdk-index:${{ needs.sdk-index.result }}"; do
            name="${pair%%:*}"; res="${pair#*:}"
            case "$res" in
              success) echo "  ok       $name" ;;
              skipped) echo "  skipped  $name (path-gated; its paths did not move)" ;;
              *)       echo "  FAIL     $name: $res"; fail=1 ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then
            echo
            echo "CI: at least one required gate did not pass." >&2
            exit 1
          fi
          echo
          echo "CI: every gate passed or was legitimately skipped."
