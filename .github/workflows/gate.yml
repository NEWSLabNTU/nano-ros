          export SCCACHE_CACHE_SIZE=2G
          export SCCACHE_ERROR_LOG=/tmp/sccache-server.log
          export SCCACHE_LOG=warn
          if sccache --start-server >/tmp/sccache-start.log 2>&1; then
            {
              echo "SCCACHE_DIR=/tmp/sccache"
              echo "SCCACHE_ERROR_LOG=/tmp/sccache-server.log"
              echo "SCCACHE_LOG=warn"
              echo "SCCACHE_CACHE_SIZE=2G"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable — the compile tier runs UNCACHED (issue 0874)."
            sed 's/^/  /' /tmp/sccache-start.log || true
          fi

      - name: Key the CLI binary cache on source_stamp.rs's whole watch set
        id: cli-key
        run: |
          key="$(scripts/ci/cli-bin-cache-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the nros + nros-launch-resolve binaries (every event)
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/cli/target/release/nros
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
            packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
          key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

      - name: Build the in-tree nros CLI (every event)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup-cli
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      - name: Provision clang-format (pinned by [tool.clang-format])
        run: |
          source ./activate.sh
          just setup-clang-format

      - name: Provision Corrosion (pinned by [tool.corrosion])
        run: |
          source ./activate.sh
          just workspace install-corrosion

      - name: Provision compile-tier sources
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Fetch the pin baseline for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh provide

      - name: Init submodules whose pin moved (commits only)
        run: bash scripts/ci/pin-baseline.sh init-moved

      - name: Fetch submodule history for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh deepen

      - name: Build nros-launch-resolve (cli-tests and generate-bindings both shell out to it)
        if: >-
          ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name)
              && !cancelled() }}
        run: |
          source ./activate.sh
          just setup-launch-resolve

      # The 2026-09-05 no-alloc break (b9450327dd, 92849933d9) / #1102 follow-up —
      # the FEATURE-COMBINATION gap, closed on the batch lane.
      #
      # `compile-smoke` says so itself twenty lines up: "no feature
      # combinations, so a break that only appears under
      # `--no-default-features` still reaches the queue". On 2026-09-05 that is
      # exactly what happened. `nros-node`'s new stack-headroom rule called
      # `nros_platform_api::task::stack_unused_bytes()`, and `task` was gated
      # behind the `alloc` feature, so `main` could not build for an embedded
      # target. Both halves were green on the required `CI` context, because
      # the only lane that compiles a no-alloc configuration —
      # `check-workspace-embedded`, inside `check-build` — runs on
      # `schedule`/`workflow_dispatch` and NO merge-gating event.
      #
      # The cost of that gap was not one red: THREE independent fixes were
      # written for the same defect (PRs #489 and #497, plus main's own
      # `b9450327d` + `92849933d`), because nothing told anyone it was already
      # being handled.
      #
      # `workspace-all` is the narrow answer, not `check-build`. It is the gate
      # that actually caught this (host check + embedded check in parallel,
      # measured 62 s), and unlike `check-build` it resolves no prebuilt
      # fixture or generated binding — `check-build` was tried on a
      # merge-gating event before and could never pass there, which is what
      # `check-lane-contracts` now enforces.
      #
      # ON THE PULL-REQUEST LANE SINCE 2026-09-10, reversing this step's own
      # earlier reasoning. That reasoning was: "same `PR cheap, batch thorough`
      # split as `test-unit` above. A surprise here ejects a batch, which is
      # visible and recoverable; on the PR lane it would block every pull
      # request at once." Both halves were re-measured and neither survived.
      #
      # NOT CHEAP-VERSUS-EXPENSIVE. This step is **28 s** on the runner
      # (07:39:56 -> 07:40:24 on run 34449411245) inside a `check` job that
      # takes ~9 minutes. `test-unit` in the same job is 3 m 37 s and
      # `test-lane-contracts` 1 m 15 s. Grouping it with `test-unit` under one
      # cost argument was the error: it is ~5 % of the lane, not a tier.
      #
      # "VISIBLE AND RECOVERABLE" UNDERCOUNTS BY THE BATCH. An ejection is not
      # one PR's problem: `grouping_strategy` is ALLGREEN and
      # `max_entries_to_build` is 5, so a failing entry takes its batch-mates
      # down and they rebuild. Measured over 2026-09-09/10, when exactly two
      # entries were at fault: #741 was ejected 8 times, #768 and #779 7 times
      # each, with no defect of their own. One of the two culprits was a single
      # `clippy::derivable_impls` error THIS STEP catches — it cost a batch of
      # five, where on the PR lane it costs one 28 s run.
      #
      # "WOULD BLOCK EVERY PULL REQUEST AT ONCE" is a claim about a break that
      # is already on `main` — a toolchain bump surfacing new `-D warnings`
      # lints is the real case (CLAUDE.md says so). But that blocks everything
      # either way: on `merge_group` nothing merges, it just fails later and
      # louder. Running here does not create that failure mode, it relocates
      # the report to the PR that caused it.
      #
      # `test-unit` deliberately STAYS on the batch lane: 3 m 37 s per push is
      # the cost "PR cheap, batch thorough" was actually written for.
      #
      # CORRECTION, 2026-09-11. The 28 s above measured the EMBEDDED half only.
      # The host half was `just check workspace`, which had become an `echo`
      # claiming host clippy ran "in the fast tier" — it did not: issue 0466
      # moved `check-test-targets` to `build-serial`, schedule only. So no
      # merge-gating lane ran a host clippy, and 20 errors in nros-node's own
      # test target plus a `needless_borrow` in nros-tests reached main. The
      # host half is now `check-test-targets` — `--workspace --all-targets`
      # and then every crate ALONE, because `--workspace` unifies features and
      # hid the nros-node errors behind a sibling's `std`. It costs real time
      # now; read this step's duration off the run, not off the 28 s. For
      # scale only: `check-test-targets` alone (workspace + per crate + CLI)
      # took 113 s locally on a WARM target dir — a cold runner pays more.
      - name: just check workspace-all (host + embedded clippy)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) && !cancelled() }}
        run: |
          source ./activate.sh
          just check workspace-all
      - name: sccache stats (compile tier)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) && always() }}
        run: |
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || true
          if [ -s /tmp/sccache-server.log ]; then
            echo "--- sccache server log (deduped) ---"
            { sort /tmp/sccache-server.log | uniq -c | sort -rn | head -25; } || true
          fi

