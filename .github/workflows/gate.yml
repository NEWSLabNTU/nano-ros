      contents: read
      packages: read
    # The self-hosted runner IS a container (unprivileged, no Docker), so it
    # cannot start a job container: the image is empty there and the steps run
    # in the runner's own image. An EMPTY image means "no container".
    container:
      image: ${{ !(vars.NROS_GATE_SELF_HOSTED == 'true' && contains(fromJSON('["merge_group","workflow_dispatch"]'), github.event_name)) && 'ghcr.io/newslabntu/nano-ros-ci:humble' || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

