          # justfile's size. Exporting the hosted 1G here would make the shared
          # server EVICT the warm cache queue L3 also reads down to 1 GB.
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            echo "self-hosted: sccache uses its own volume (${SCCACHE_DIR:-$HOME/.cache/sccache})"
            exit 0
          fi
