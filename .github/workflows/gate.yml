    if: >-
      ${{ always() && contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name)
          && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    # phase-489 W2 — ROUTED: self-hosted on merge_group / workflow_dispatch,
    # hosted (in the CI image) on pull_request / schedule. Why each half, the
    # fork-PR rule, the interlock variable and the clean-tree step: see the
    # `check-workspace-all` comment block. The expression is spelled ONCE, and
    # `check-workflow-runner-isolation` parses it (scripts/lib/runner_route.py).
    runs-on: ${{ vars.NROS_GATE_SELF_HOSTED == 'true' && contains(fromJSON('["merge_group","workflow_dispatch"]'), github.event_name) && fromJSON('["self-hosted","linux","nros-sdk-zephyr","nros-big"]') || 'ubuntu-22.04' }}
