# PR-check tier (CI reorg / phase-253) — the fast, per-push + PR gate set.
#
# Folds four formerly-separate lanes into one tier file. CI yml = thin
# `just <recipe>` callers (single source of truth — docs/development/
# ci-workflow-reorg.md + the recipe-org block in the justfile). A `changes`
# path-filter job gates the narrow lanes so they only run when their paths move
# (on a PR); on push/schedule/dispatch every job runs.
#
#   - check-*        : `just check fast` on every event, plus the PR-only source
#                      gates (compile-smoke, rustdoc-links, rustdoc-workspace),
#                      as parallel sibling jobs `CI` aggregates (phase-489 W1).
#                      The buildless gate survives the rapid push cadence.
#                      `just check build` -- the FULL compile tier -- runs on
#                      `schedule`/`workflow_dispatch` ONLY, never on a pull
#                      request. A PR gets a compile SMOKE, not the tier.
#                      Both this line and the job name below used to assert that
#                      tier ran on a pull request -- coverage advertised and not
#                      delivered, which cost two sessions a day chasing reds the
#                      PR lane would never have shown them (issue 1514). The old
#                      wording is not quoted here on purpose:
#                      `check-lane-coverage-labels` matches the CLAIM as prose
#                      and cannot tell a quotation from an assertion.
#   - scaffold-journey : `just scaffold-journey` (RFC-0040 resolve-only journey).
#   - colcon-parity  : `just colcon-parity` (local-msg-package builds under colcon).
#   - sdk-index      : verify-index.py + qemu-configure drift (sdk-index bumps).
#
# NOT folded here: the heavy test/build lanes (host-tests, nightly), release,
# images, docs.
name: gate

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - "scripts/**"
      - "ci/nano-ros-sdk/**"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - "**/*.just"
      - ".clang-format"
      - "rustfmt.toml"
      - "nros-sdk-index.toml"
      - ".gitmodules"
      - ".github/workflows/gate.yml"
  pull_request:
    # NO `branches:` filter and NO `paths:` filter. Both are load-bearing rather
    # than oversights, and they are the same trap on two different axes.
    #
    # `branches: [main]` was here until PR #71 deadlocked on it. That PR was
    # STACKED — opened against `fix/0041-zephyr-heap-knob` (PR #61's branch),
    # not against main — so every `pull_request` event it produced was filtered
    # out before a workflow could be dispatched:
    #
    #   01:32  opened            base is not main  -> filtered
    #   01:57  synchronize       base is not main  -> filtered
    #   01:58  base retargeted to main             -> GitHub emits
    #          `pull_request.edited`, which is NOT one of the default types
    #          (`opened`, `synchronize`, `reopened`), so nothing dispatched
    #   01:58  auto-merge enabled
    #
    # Net: ZERO check suites for the head sha, thirteen hours and counting,
    # auto-merge armed against a required check that was never requested. Not
    # failing — permanently ineligible, exactly like PR #13 below.
    #
    # Retargeting is the trap's teeth: it is the natural thing to do when the
    # PR underneath you merges, it looks like it should re-run everything, and
    # it re-runs nothing. Dropping the filter fixes it at the root instead of
    # subscribing to `edited` (which would also fire on every title and body
    # edit): a stacked PR now gets its checks while it is still stacked, and
    # because check runs attach to the COMMIT rather than to the PR, the
    # retarget inherits them and the rollup is already populated.
    #
    # A stacked PR's checks are not wasted work either — its head sha is what
    # eventually reaches the queue, so this is the same verification, earlier.
    #
    # And the `paths:` half, which is the older lesson:
    #
    #
    # `check` is a REQUIRED status check. A path-filtered required check never
    # runs for a pull request outside those paths, so it never REPORTS, so the
    # PR sits BLOCKED forever — not failing, just permanently ineligible. PR #13
    # (docs only) hit exactly this: zero checks in its rollup and no way to
    # merge.
    #
    # The same sentence is already written under `merge_group:` below, and it
    # was true of `branches:` above. Three spellings of one rule: a required
    # check must be reachable from every event that can produce the head sha
    # a merge is asked to admit. Applying the rule to one axis at a time is
    # the "fix the reported site, not the class" mistake CLAUDE.md names —
    # each of the three was fixed only after it had already frozen a PR.
    #
    # Affordable because the PR gate is now cheap — `check-fast` plus a compile
    # smoke, not the full tier — so a docs-only PR pays a few minutes rather
    # than fifteen. If that ever stops being true, the fix is a cheaper gate,
    # never a path filter on a required check.
  # phase-395 W7 — the merge queue. A required status check MUST trigger on
  # `merge_group` or it is never reported for a queued batch, and GitHub fails
  # the merge waiting for it: a frozen repo, not a gated one.
  #
  # This is not symmetric with the other triggers, and the asymmetry is the
  # whole lesson. A required check has to report in BOTH places — on the pull
  # request, because GitHub will not admit a PR to the queue until its required
  # checks pass, and on the merge group, because that is where the batch is
  # actually verified. A check that runs in only one of them deadlocks: PR #6
  # sat BLOCKED with `L1 (compile + unit)` simply ABSENT from its rollup, since
  # the check gating entry could only run after entry.
  #
  # Deliberately no `paths:` filter here. Path-gating a merge-queue check means
  # a batch touching only unfiltered paths never reports it, which is the same
  # freeze arriving by a quieter route.
  merge_group:
  # Nightly runs the FULL gate (fast + build tier) even on a direct-push-to-main
  # workflow where PRs are rare — so the compile gates get a daily signal.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}-${{ github.event_name }}
  # NEVER cancel a merge-queue run. Cancelling one makes the batch fail with no
  # verdict, and GitHub then ejects pull requests that were never actually
  # tested — the opposite of what the queue is for. Superseding is right
  # everywhere else, where a newer push's answer subsumes an older one's.
  #
  # ...EXCEPT a push to `main`. That run's only product is `warm-cache`, which
  # takes 12-25 min, while merges land every 10-60 min: with cancel-in-progress
  # the next merge killed it mid-run (6 of the last 8 warm jobs `cancelled`,
  # phase-489 W5), so the cache `check-*` restores never tracked main. Without
  # cancelling, GitHub queues the next run behind it and keeps only the NEWEST
  # pending one — the latest main still wins, and every started warm completes.
  # `ci-ok` is unaffected: a queued run is not a result, and a push run gates
  # nothing (PRs and the queue read their own events' runs).
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.event_name != 'push' }}

# Issue 1353 — no DWARF in this workflow's builds. Nothing in the gate reads
# it: no gate or test parses `.debug_*` (`git grep` for addr2line, gimli,
# dwarfdump finds only a hint string in read-boot-report.py). It is most of
# what the compile tier writes: measured on one local `just ci gate`, DWARF was
# 8.9 of 12.3 GiB in `target/debug/deps` (72 %) and 3.3 of 8.4 GiB in the
# `target-check-*` dirs (39 %). The scheduled `check build` writes ~40 G into
# the ~38 G a hosted runner has after the reclaim, so this is the margin.
#
# Workflow-wide, not per job: the sccache warm job and every compiling job
# must build with the same flags, or the cache they share stops matching.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_NROS_RELWITHDEBINFO_DEBUG: "0"

jobs:
  # Path-gate the narrow lanes: on a PR each runs only if its paths moved; on
  # push/schedule/dispatch the per-job `if` falls through to run them all.
  changes:
    # Not on a merge group. `dorny/paths-filter` has no base ref to diff there,
    # and the three lanes below fall through on any non-`pull_request` event, so
    # without this a queued batch would additionally run `scaffold-journey` and
    # `colcon-parity` — minutes of latency on every merge, and `colcon-parity`
    # is the lane that was already red on 2026-08-27 for reasons unrelated to
    # any change in the batch. A skipped dependency skips its dependents, so
    # this one condition covers all three.
    #
    # Only the REQUIRED check needs to run in the queue, and `check` declares no
    # `needs`, so it is unaffected.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    outputs:
      scaffold: ${{ steps.f.outputs.scaffold }}
      colcon: ${{ steps.f.outputs.colcon }}
      sdk_index: ${{ steps.f.outputs.sdk_index }}
      # phase-395 — does this pull request touch anything `check` verifies?
      # A docs-only change does not, and paying ~5 min of CLI build and source
      # provisioning to lint markdown is not sane.
      #
      # This is a JOB-level filter, deliberately. Path-filtering the TRIGGER of
      # a required workflow leaves its check Pending forever, which deadlocked
      # #6 and #16 against each other; a skipped JOB reports Success. GitHub's
      # guidance is explicit: "do not use path or branch filtering to skip
      # workflow runs if the workflow is required".
      code: ${{ steps.codeprobe.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            scaffold:
              - 'packages/cli/**'
              - 'nros-sdk-index.toml'
              - 'scripts/ci/scaffold-journey-check.sh'
            colcon:
              - 'examples/templates/local-msg-package/**'
              # phase-413 W3 — the lane's OWN definition and the recipe it
              # runs. Without these, a change to the colcon-parity job could
              # not run the colcon-parity job: converting it from a bare
              # runner to `container:` touched only `gate.yml`, so the filter
              # said "colcon: false" and the conversion would have merged
              # having never executed once. A filter that excludes the thing
              # under test is the coverage hole issues 0981/1001 keep finding
              # in a different costume.
              - '.github/workflows/gate.yml'
              - 'justfile'
            sdk_index:
              - 'nros-sdk-index.toml'
              - '.gitmodules'
              - 'scripts/sdk/verify-index.py'
              - 'scripts/sdk/check-qemu-configure.sh'
              - 'ci/nano-ros-sdk/scripts/build-qemu.sh'

      # Computed explicitly rather than as a negated paths-filter pattern,
      # because the failure mode is a FALSE GREEN on the required gate and the
      # negation semantics were not something to guess at. FAIL-SAFE by
      # construction: a path this cannot classify, an empty diff, or a failed
      # diff all count as CODE, so the gate is never silenced by accident. The
      # classifier was tested against every case below before it shipped.
      - name: Does this pull request touch anything `check` verifies?
        id: codeprobe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The API, not `git diff`: `actions/checkout` is SHALLOW by default,
            # so the base ref is usually absent and the diff would fail — which
            # the fail-safe would turn into `code=true` forever, i.e. safe but
            # never actually firing. `gh` answers exactly and needs no fetch.
            if changed="$(gh pr view "${{ github.event.pull_request.number }}" \
                            --repo "${{ github.repository }}" \
                            --json files --jq '.files[].path' 2>/dev/null)" \
                 && [ -n "$changed" ]; then
              code=false
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                case "$f" in
                  # Issue 1066. These two live under `docs/` and are not
                  # documentation: they are the INPUT to `check-api-parity`,
                  # which runs in the `check` job below as an ordinary
                  # fast-lane gate. The ledger is the 2158 written verdicts,
                  # `api-surface/` the recorded rclc/rclcpp/rclrs side. A pull
                  # request that deletes a ledger row — for a divergence that
                  # still exists — is by this probe's own spelling a
                  # documentation change, so the job that would have caught it
                  # skipped, and the author heard about it as a merge-queue
                  # ejection instead. Measured: the deletion makes `just check
                  # api-parity` exit 1 with `1 item(s) differ with no ledger
                  # entry`, and `code` stayed `false`.
                  #
                  # Listed BEFORE the documentation arm because `case` takes
                  # the first match and `docs/*` matches these too. Same shape
                  # as the `colcon` filter's `gate.yml` entry above: a filter
                  # that excludes the thing under test.
                  docs/reference/api-parity-ledger/*|docs/reference/api-surface/*)
                    code=true; break ;;
                  *.md|docs/*|book/*) ;;
                  *) code=true; break ;;
                esac
              done <<< "$changed"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then
            echo "code touched (or undetermined) — \`check\` will run"
          else
            echo "documentation only — \`check\` will skip, and \`CI\` will say so"
          fi

  # ----- fast gate (always) -----
  check-fast:
    name: check / fast (every event)
    # phase-489 W1 — the old single `check` job, split into parallel siblings.
    #
    # `check` ran every gate one after another: ~33 min of steps per merge-group
    # batch, while its critical path is really its longest gate. Each sibling
    # below runs exactly the gate steps it ran inside `check`, under the same
    # step `if:`s, after the same setup (checkout, sccache, CLI, clang-format,
    # Corrosion, compile-tier sources, pin baseline). Nothing carries a build dir
    # between jobs, so each sibling provisions its own artifacts —
    # `check-lane-contracts` checks every job separately for exactly that.
    #
    #   check-fast           every event      check fast, submodule-commits-reachable
    #   check-compile-smoke  PR              compile-smoke, rustdoc-links, rustdoc-workspace
    #   check-cli-tests      PR/MG/nightly   launch-resolve-fresh, cli-tests + node-std-tests (PR/MG),
    #                                        cpp-ffi-tests (MG)
    #   check-workspace-all  PR/MG/nightly   workspace-all
    #   check-test-unit      MG/nightly      test-unit
    #   check-lane-contracts MG/nightly      test-lane-contracts
    #   check-build          nightly/manual  compile-check fixtures, generate-bindings, check build, no-std
    #
    # A sibling's job-level `if:` names the events it has work on. `CI` treats a
    # skip on any OTHER event as deliberate and a skip on one of its own events as
    # a failure; `check-default-gates-run-somewhere` holds the two lists equal and
    # requires every gate-running job here to be one `CI` inspects. phase-489
    # W2 routes `check-workspace-all` and `check-test-unit` to the self-hosted
    # runners on merge_group / workflow_dispatch (see `check-workspace-all`);
    # everything else, and every pull request, stays hosted.
    #
    # `always()` is load-bearing on every sibling: `changes` is skipped on a merge
    # group, and a skipped dependency skips its dependents — without it no sibling
    # would run in the queue, which is the one place it matters most. The
    # `pull_request` arm narrows to a code-touching diff (docs-only PRs skip).
    needs: changes
    if: >-
      ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      # Compiler cache for the COMPILE tier — phase-395. `check-build` compiles
      # the whole workspace from scratch: 587 s of an 878 s gate, measured. Only
      # `packages/cli/target` was cached, and that is the 79 s half.
      #
      # sccache rather than caching `target/`, for a CORRECTNESS reason and not
      # only a size one: sccache is content-hashed, so a restored cache cannot
      # make a stale artifact read as fresh. Restoring a `target/` dir into a
      # fresh checkout gives artifacts mtimes newer than their sources — the
      # museum-binary class CLAUDE.md's fixture-mtime treadmill describes, and
      # exactly what a cache must never introduce.
      #
      # GHA backend. CORRECTION to an earlier version of this comment, which
      # claimed the backend is "a separate store with its own eviction": it is
      # NOT. sccache's GHA backend writes to the SAME GitHub Actions Cache
      # service as `actions/cache`, and the 10 GB limit is per REPOSITORY across
      # every cache in it regardless of which tool wrote it. Eviction is
      # least-recently-used across that one pool, plus a 7-day unused sweep.
      #
      # So the CLI cache and this one DO compete, and GitHub warns about exactly
      # the failure that creates — "cache thrashing, where caches are created
      # and deleted at a high frequency". `SCCACHE_CACHE_SIZE=2G` below is a
      # deliberate share of the pool rather than the justfile's 30 GB
      # workstation figure, chosen to leave room for the CLI cache.
      #
      # What the backend genuinely buys over `actions/cache` is that it needs no
      # save/restore step and no key: sccache reads and writes entries as it
      # compiles, so a partial hit is still a hit. That is the real argument,
      # and it does not depend on the pool claim that was wrong.
      #
      # UNVERIFIED: whether `SCCACHE_CACHE_SIZE` is honoured by the GHA backend
      # at all — it is documented for the local disk cache, and GitHub's own
      # eviction may be the only thing bounding this. The `--show-stats` step
      # below is what would reveal thrashing.
      #
      # The binary is BAKED INTO THE IMAGE (ci/docker/ci-base), and the
      # justfile's `RUSTC_WRAPPER := command -v sccache` picks it up with no
      # further wiring — so this only has to point it at a backend.
      # Wherever anything COMPILES — which is now the pull request too, since
      # the compile smoke landed there. Gating this on the tier alone would have
      # left the PR's `cargo check` uncached, which is the one event that runs
      # on every push an agent makes.
      # issue 0874 — sccache's GHA backend CANNOT work here, so the cache is a
      # plain directory and `actions/cache` carries it between runs.
      #
      # Measured, not assumed. With both v2 variables finally present the
      # backend started and then failed 777 of 777 writes:
      #
      #   storage write check failed: NotFound (permanent) => 404 page not found
      #   uri: https://results-receiver.actions.githubusercontent.com/
      #        _apis/artifactcache/cache?keys=sccache/...
      #
      # `_apis/artifactcache/cache` is the **v1** path; `results-receiver` is the
      # **v2** host, which serves a Twirp API at an entirely different path. The
      # opendal build inside sccache 0.17.0 still composes v1 requests, so
      # pointing it at the v2 host 404s every one. No amount of env plumbing
      # fixes a client speaking the wrong protocol — which is why the
      # `github-script` export added an hour earlier is gone again: it did its
      # job (the variables arrived, proven by the log) and the job was not the
      # blocker.
      #
      # `actions/cache` is the working alternative and needs no argument about
      # trust: it already caches the CLI build in this same job and saved
      # ~774 MB there, on the same runtime token the Rust binary could not use.
      #
      # The CORRECTNESS argument for sccache over caching `target/` is untouched
      # and is the reason this is a cache of sccache's own dir rather than of
      # build output: sccache entries are CONTENT-hashed, so a restored cache
      # cannot make a stale artifact read as fresh. Restoring a `target/` dir
      # gives artifacts mtimes newer than their sources — the museum-binary
      # class CLAUDE.md's fixture-mtime treadmill describes.
      #
      # Sized by phase-489 W5 against what the warm job now stores (see
      # docs/roadmap/phase-489-ci-build-speedup.md): the old 1 GB was FULL with
      # the CLI build alone (1009 MiB of 1 GiB), so adding the `check-fast`
      # compiles to it would have evicted one set to hold the other. Every run
      # of the warm job writes a new entry under a per-SHA key inside the
      # repository's single 10 GB pool; `restore-keys` makes an older entry a
      # partial hit, which is all a content-hashed cache needs.
      - name: Cache sccache directory (compiling events)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        # RESTORE-ONLY. A save here writes a cache the run can never read again:
        # merge_group executes on an ephemeral `gh-readonly-queue/...` ref and a
        # pull_request on `refs/pull/N/merge`, and GitHub scopes a cache to its
        # creating ref. Measured 2026-09-05: 16 such entries held 13.34 GB of a
        # 10 GB pool — 97.6% — so the pool ran 37% over its limit and evicted
        # continuously, and `main`'s shared entry (the only one anything can
        # restore from) was the small, least-recently-used thing it discarded.
        # `warm-cache` on push to main is the ONE writer.
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sccache
          key: sccache-${{ runner.os }}-check-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-check-

      # phase-489 W5 — which CPU did this run land on? The same gate set has
      # measured 6.0 min and 12.2 min of busy CPU on hosted runners, every gate
      # 1.6-2.0x slower in the slow runs, and the log named no CPU model, so the
      # hardware explanation stayed a suspicion. Evidence only: no behaviour.
      - name: Report runner hardware
        run: scripts/ci/report-runner-hardware.sh

      - name: Configure sccache (compiling events)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::warning::sccache absent from the image — the compile tier runs UNCACHED."
            exit 0
          fi
          sccache --version

          # issue 0874 — an ABSENT sccache degrades gracefully (above); a BROKEN
          # one used to be fatal, and the asymmetry is the bug. `RUSTC_WRAPPER`
          # makes sccache a prefix on every `rustc`, so a backend that cannot
          # start does not lose a cache — it fails the compiler:
          #
          #   sccache: error: Server startup failed: create gha cache failed:
          #     ConfigInvalid (permanent) => ACTIONS_CACHE_URL not found
          #   error: process didn't exit successfully: `sccache rustc -vV`
          #
          # That took down `main` and every open PR at once. So PROVE the
          # backend before handing it the compiler: export the config into this
          # step only, start a server, and publish to `$GITHUB_ENV` only if that
          # worked. On failure sccache stays on PATH with its LOCAL disk cache,
          # which is the same uncached-but-working state as the absent case.
          # Report ARRIVAL, never the values: the token is a credential, and
          # the URL is noise. Without this the only evidence that the backend
          # was misconfigured was sccache's own error text, which names the
          # symptom (`cache url ... not found`) and not the cause.
          # `${V:-UNSET}` expands to the VALUE when V is set, so the obvious
          # one-liner prints "SET<the url>". Ask the question directly.
          export SCCACHE_DIR=/tmp/sccache
          export SCCACHE_CACHE_SIZE=2G
          # The stats counters give a write-error COUNT and no reason. 777 of
          # 777 writes failed on run 33294943815 with the backend started and
          # both variables present, so the next question is WHY, and only the
          # server's own log answers it. `warn` rather than `debug`: one line
          # per distinct failure, not one per compilation unit.
          export SCCACHE_ERROR_LOG=/tmp/sccache-server.log
          export SCCACHE_LOG=warn
          if sccache --start-server >/tmp/sccache-start.log 2>&1; then
            {
              echo "SCCACHE_DIR=/tmp/sccache"
              echo "SCCACHE_ERROR_LOG=/tmp/sccache-server.log"
              echo "SCCACHE_LOG=warn"
              # Well under the 10 GB cap this store does NOT share; the
              # justfile's 30G default is a developer-workstation figure.
              echo "SCCACHE_CACHE_SIZE=2G"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable — the compile tier runs UNCACHED (issue 0874)."
            sed 's/^/  /' /tmp/sccache-start.log || true
          fi

      # ----- the in-tree nros CLI: EVERY event -----
      #
      # phase-422 W2 moved clang-format's provisioning into the index, so
      # `just setup-clang-format` is `nros setup --tool clang-format` now and
      # the formatter cannot be obtained without the CLI. This step used to sit
      # in the compile tier, BELOW the clang-format step that needs it:
      # `nros: command not found`, exit 127. One root failure took the job five
      # steps red — the nine steps after it skipped, and `compile-smoke`,
      # `rustdoc-links`, `cli-tests` and the launch-resolver build then ran
      # without submodules or sources and failed for THAT reason instead
      # (run 34034485659; only the first of the five failures was real).
      #
      # Hoisted here and NO LONGER event-guarded. `check-fast` runs
      # `check-c-fmt` / `check-cpp-fmt` on EVERY event including the post-merge
      # push lane; the CI image ships no clang-format at all; and the resolver
      # ERRORS rather than degrading when it finds none — so leaving the push
      # lane without the CLI would not fall back, it would go red. The push
      # lane's "no CLI, no sources" contract therefore holds for SOURCES only:
      # a pinned formatter became a CLI product, and provisioning it here is
      # the same command a contributor runs.
      #
      # It sits AFTER the sccache steps deliberately: `RUSTC_WRAPPER` has to be
      # exported before the first cargo invocation or this build is the one
      # compile in the job that misses the cache.
      # phase-489 W3 — cache the BINARIES, not the build tree.
      #
      # This step used to restore all of `packages/cli/target` and
      # `nros-launch-resolve/target`: main's entry was 2967 MB and took a
      # constant 3.8 min on every event, to hand this job one 28 MB `nros`.
      # What the job actually consumes is `nros` (asked for its own freshness
      # by `source-stamp` below), and `nros-launch-resolve` with the two files
      # `just setup-launch-resolve` keeps beside it: the content stamp its skip
      # path compares, and the Python half it `dlopen`s. Four files, ~42 MB
      # uncompressed.
      #
      # THE KEY IS A SUPERSET OF THE STAMP. The old key hashed
      # `packages/cli/**/{Cargo.lock,Cargo.toml,*.rs}` and was narrower than
      # `source_stamp.rs`'s watch set — no `.jinja`, `askama.toml`,
      # `cli-source-dirs.txt`, out-of-tree crate dirs or `play_launch` pin — so
      # an exact hit existed for a tree whose stamp had moved, and only cargo's
      # mtime luck stood between it and a stale binary. The script hashes the
      # git index entries of EVERY file in the stamp's closure (packages/cli plus
      # each dir `cli-source-dirs.txt` lists) — the submodule gitlinks
      # included, so the pin is in it — plus the toolchain pin. No restore-keys:
      # a partial hit is by definition a binary for another tree.
      #
      # The key is still not the authority. `nros source-stamp` in the next step
      # is: it refuses a binary whose baked stamp is not this checkout's, and the
      # step then builds rather than trusting the cache.
      #
      # RESTORE-ONLY, for the scoping reason the sccache step gives;
      # `warm-cache` on push to main is the one writer.
      - name: Key the CLI binary cache on source_stamp.rs's whole watch set
        id: cli-key
        run: |
          key="$(scripts/ci/cli-bin-cache-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the nros + nros-launch-resolve binaries (every event)
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/cli/target/release/nros
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
            packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
          key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

      # The user's verb, not a CI-only build: `just setup-cli` runs on every
      # event, and ITS freshness check (`nros source-stamp`) decides whether
      # the restored binary is this tree's — skip if so, `cargo build --locked`
      # if not. The cache only pre-populates what setup-cli would build; it
      # never replaces the step.
      # phase-429 W5 — then ASSERT the binary matches the checkout, whichever
      # path produced it. `play_launch` is initialised FIRST: its pin is a
      # stamp input.
      - name: Build the in-tree nros CLI (every event)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup-cli
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      # ----- shared setup -----
      #
      # `just setup-clang-format`, NOT a pip install with a literal version.
      #
      # This step used to be `pip install "clang-format==17.0.5"` while a
      # `.clang-format-version` file pinned 17.0.6 — two sources of truth for
      # one version, already drifted. And they drifted INVISIBLY: the resolver
      # (`scripts/dev/clang-format.sh`) prefers `build/clang-format/bin/`, which
      # only the recipe creates, so CI fell through to the PATH copy and printed
      # `WARN: clang-format 17.0.5 on PATH != pinned 17.0.6` to stderr in a lane
      # nobody reads unless it fails. Different clang-format versions reformat
      # differently, so CI was checking a different standard than every local
      # run.
      #
      # phase-422 W2 finished the job: the version, the per-host wheel URL and
      # its sha256 are `[tool.clang-format]` in `nros-sdk-index.toml`, the file
      # is deleted, and the recipe is `nros setup --tool clang-format`. One
      # home for the pin, and the same command a contributor runs.
      - name: Provision clang-format (pinned by [tool.clang-format])
        run: |
          source ./activate.sh
          just setup-clang-format

      # Corrosion — issue 1553. `check-fast` runs `probe-workspace-caps` and
      # `probe-shared-types`, each of which CONFIGURES a probe project, and a
      # probe configure reaches `nros_resolve_corrosion`. With nothing at the
      # pinned prefix that resolver does the correct second thing — it clones
      # Corrosion from git into the shared host fetch cache — and the two gates
      # run in the same `-P4` parallel lane, so they clone into one directory at
      # once and one loses:
      #
      #   fatal: destination path 'corrosion-src' already exists and is not an
      #   empty directory
      #   BUG: refs/files-backend.c:2992: initial ref transaction called with
      #   existing refs
      #
      # A run-time step and not an image layer, which is what issue 1553
      # originally proposed: `$HOME` in a container job is `/github/home`, a
      # BIND MOUNT the runner lays over the image, so an `~/.nros` baked into
      # `ci/docker/ci-base` is masked before the first step runs. The store root
      # the cmake resolver reads is `$NROS_HOME/sdk` or `$HOME/.nros/sdk`
      # (`nros_store_root()`, the one root variable since RFC-0103 D6), so
      # the only prefix an image could fill is one that moves every lane's
      # workspaces and fetch cache with it.
      #
      # Cheap enough to sit beside clang-format on every event: `[tool.corrosion]`
      # is config-only at install time (a small CMake superproject staged into
      # the store), which is why the index files it under the `default` tier.
      # It is also what the SDK store is FOR — issue 0500's whole point is that
      # a configure should resolve the pinned tool rather than reach the network,
      # so this makes the supported path the one CI takes.
      - name: Provision Corrosion (pinned by [tool.corrosion])
        run: |
          source ./activate.sh
          just workspace install-corrosion

      # ----- `-sys` sources: build tier (non-push) only -----
      # check-fast is SOURCE-FREE (no cargo build/clippy/test, no `cargo tree`/
      # metadata), so the push lane needs no provisioned source: ~1 min, which
      # survives the rapid push cadence. The build tier (PR/nightly) needs every
      # `-sys` source submodule (zenoh-pico/mbedtls/micro/cyclonedds + px4-rs)
      # so its clippy and cargo-tree gates resolve and compile.
      #
      # phase-395 put the CLI build here too; phase-422 W2 moved it above,
      # because clang-format is provisioned by it on every event. What is left
      # here is the half that really is compile-tier-only.
      - name: Provision compile-tier sources
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      # ----- fast tier (every event) -----
      # check-fast is buildless + source-free: the C/C++ gates here are
      # clang-format only (check-c-fmt / check-cpp-fmt). The compile gates
      # (check-c / check-cpp — nros-c/nros-cpp build + syntax + clippy, which pull
      # the ros-launch-resolve submodule + the zenoh-pico source) live in
      # check-build (PR/nightly), so the push lane needs no submodule/source.
      # `check-submodule-pins` runs inside `check fast` and compares this
      # branch's gitlinks against the BASE's. It is network-free by the
      # check-fast contract, so it cannot fetch the base itself — and
      # `actions/checkout` is shallow, so `origin/main` is normally absent here.
      #
      # That combination made the gate `exit 0` without comparing anything, on
      # every PR, for as long as it existed. A real play_launch pin rewind
      # reached a pushed branch and was caught only by a local run. The gate now
      # FAILS instead of skipping when it has no baseline; this step is what
      # gives it one.
      #
      # depth=1 is enough: the gate reads TREES (`git ls-tree <ref>`), never
      # history.
      #
      # WHICH commit is the baseline is decided in ONE place,
      # `scripts/ci/pin-baseline.sh` (issue 1912), which every copy of these
      # three steps calls. It used to be `origin/${GITHUB_BASE_REF:-main}` here,
      # nine times over — right for a pull request, and wrong on a PUSH, where
      # it is main's tip when the queued job finally RUNS: a later commit's
      # forward pin bump then read as a REWIND of the commit under test. The
      # baseline is now the commit under test's own: `event.before` on push,
      # `merge_group.base_sha`, `pull_request.base.sha`, and the first parent
      # on schedule / dispatch.
      - name: Fetch the pin baseline for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh provide

      # The step above says "depth=1 is enough: the gate reads TREES, never
      # history". True of the SUPERPROJECT, and not of the submodules. To prove
      # a moved pin is a fast-forward the gate runs
      # `git -C <path> merge-base --is-ancestor <old> <new>`, which needs BOTH
      # commits in that submodule's object store — and the baseline commit is
      # by definition the one before the tip, which a shallow submodule never
      # has. `git fetch --all` does not deepen a shallow clone, so the gate's
      # own retry could not help either.
      #
      # The effect was that EVERY pin bump failed with "commit ... is not in
      # the submodule's object store", advising "push the submodule commit
      # FIRST" — advice already satisfied, since the commit was pushed and on
      # its branch. Same shape as the baseline trap above: the gate cannot
      # fetch (check-fast is network-free), so the workflow provides.
      #
      # UNSHALLOW, not `--depth=1 <sha>`. Fetching the baseline sha shallowly
      # does hand over the commit object, and it is useless here: a shallow
      # fetch grafts it as a ROOT with no parent links, so `merge-base
      # --is-ancestor` finds no path between the two pins and reports
      # "DIVERGED - neither pin contains the other" on what is actually a
      # clean fast-forward. Connectivity is the whole point, so the history
      # has to be real.
      #
      # Only submodules that are initialised AND actually missing their
      # baseline commit are touched, so the cost lands on the one repo whose
      # pin moved rather than on every clone.
      # An UNINITIALISED submodule whose pin moved is the same trap one step
      # earlier, and it is the one that bites hardest: this job initialises
      # exactly `packages/cli/third-party/play_launch`, so a bump to any OTHER
      # submodule reaches the gate with no object store to read and fails
      # `CANNOT VERIFY ... not initialised here`. That is unconditional — no
      # amount of pushing, rebasing or re-running clears it, because nothing
      # in the lane was ever going to provide the objects. Measured on the
      # nuttx `.bss` pin bump (issue 1034), which could not pass CI at all
      # while passing `just check fast` locally, where the submodule exists.
      #
      # `--filter=tree:0`: the gate needs COMMITS (for `merge-base
      # --is-ancestor`) and nothing else, so trees and blobs stay on the
      # server. Not `--depth`, for the reason spelled out above — a shallow
      # commit is grafted as a root and destroys the connectivity the check
      # is about. Only submodules whose pin actually MOVED are touched, so a
      # PR that moves none pays nothing.
      - name: Init submodules whose pin moved (commits only)
        run: bash scripts/ci/pin-baseline.sh init-moved

      - name: Fetch submodule history for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh deepen

      # Two fast-line gates ask a question about the COMMIT GRAPH:
      # `doc-commit-citations` (does every cited hash name a reachable commit?)
      # and `roadmap-commit-refs` (is each cited commit on main?). On the
      # shallow checkout both correctly refuse to answer -- a dead hash and an
      # unfetched one look the same -- and report NOT VERIFIED. So CI never ran
      # either one, while every local `just check fast` did. Phase-474's doc
      # merged citing four pre-rebase hashes, and from then on every contributor's
      # local fast line was red over a doc nobody in their PR had touched.
      #
      # The workflow provides the history, as the pin-baseline steps above do.
      # `--filter=tree:0` fetches COMMITS only, which is all either gate reads.
      # Measured from a depth-1 clone of this repository: 1.8 s and +13 MiB
      # (13 706 commits), against 49 s and ~1 GiB for a full unshallow (issue
      # 1476). In the merge queue this is what catches the class: a doc citing
      # its own branch's commits passes on the PR, but the queue's rebase
      # changes those hashes, so the merge group sees them dangle. A failed
      # fetch fails the step rather than letting the gates skip again.
      #
      # The BASE BRANCH only, never a bare `origin`. actions/checkout creates the
      # remote with the default `+refs/heads/*` refspec, so `--unshallow origin`
      # pulls the history of EVERY branch on the repository; in the CI image it
      # ran 85 minutes until the runner was torn down, twice, while the same
      # command on a single-branch clone took 2 s. Reproduced in
      # nano-ros-ci:humble after checkout's exact fetch: all branches still
      # running at a 180 s cap, `main` alone 5-6 s, unshallowed (13 752 commits).
      # The deadline turns any future stall into a red step in minutes.
      - name: Fetch commit history for the citation gates (commits only)
        timeout-minutes: 6
        run: |
          base="${GITHUB_BASE_REF:-main}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            # The depth-1 base fetch FIRST is load-bearing, not redundant with
            # the pin-baseline step: without the base tip already present, git
            # 2.34's treeless unshallow lazily fetches trees one at a time and
            # stalls (measured: past a 240 s cap; with it, 5 s). Doing it here
            # keeps this step correct whatever runs before it.
            git fetch --no-tags --quiet --depth=1 origin \
              "+refs/heads/$base:refs/remotes/origin/$base"
            . scripts/lib/deadline.sh
            "${NROS_DEADLINE[@]}" 300 git fetch --no-tags --quiet --filter=tree:0 --unshallow \
              origin "+refs/heads/$base:refs/remotes/origin/$base"
          fi
          test "$(git rev-parse --is-shallow-repository)" = false
          git rev-list --count HEAD

      # Four more fast-line gates read SOURCES this job never checked out, so
      # they reported NOT VERIFIED on every CI run while a local run verified
      # them: `capability-conditionals` (zenoh-pico's platform.h),
      # `xrce-vendored-versions` (micro-cdr, micro-xrce-dds-client),
      # `leaf-lockfiles` (the nuttx FFI crates patch `libc` to
      # third-party/nuttx/libc) and `cxx-compat-shim-facilities` (Zephyr's
      # minimal libcpp headers). Depth-1 submodules plus a SPARSE Zephyr at the
      # pinned west revision -- only `lib/cpp/minimal/include`, the one
      # directory the gate reads. Measured from a fresh clone: ~8 s for the
      # submodules, 2.4 s and 6 MiB for the Zephyr slice, and all four gates
      # then verify.
      - name: Provision the sources the fast-line source gates read
        timeout-minutes: 8
        run: |
          git submodule update --init --depth 1 \
            packages/rmw/zenoh/zpico-sys/zenoh-pico \
            packages/rmw/xrce/xrce-sys/micro-cdr \
            packages/rmw/xrce/xrce-sys/micro-xrce-dds-client \
            third-party/nuttx/libc
          rev="$(awk '/- name: zephyr$/ { z = 1 } z && /revision:/ { print $2; exit }' west.yml)"
          [ -n "$rev" ] || { echo "no zephyr revision in west.yml" >&2; exit 1; }
          if [ ! -d zephyr-workspace/zephyr/lib/cpp/minimal/include ]; then
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch "$rev" \
              https://github.com/zephyrproject-rtos/zephyr.git zephyr-workspace/zephyr
            git -C zephyr-workspace/zephyr sparse-checkout set lib/cpp/minimal/include
          fi

      - name: just check fast
        run: |
          source ./activate.sh
          just check fast

      # The skip ledger is a CONTRACT here, not a report: every gate this job
      # cannot give an input to is named in .config/ci-check-fast-skips.txt with
      # the reason, and any other NOT VERIFIED fails the job. Without it, a gate
      # that loses its input in CI goes quiet instead of red -- which is how the
      # six gates above stopped verifying, one at a time, unnoticed.
      - name: CI may skip only the allowlisted gates
        run: |
          source ./activate.sh
          scripts/ci/check-fast-skip-allowlist.sh

      # A pin naming a commit no remote can serve is a repo that builds only on
      # the machine that made it: every clone and every CI run dies at
      # `git submodule update` with `reference is not a tree`, and the
      # superproject commit has to be rewritten because a pin cannot point at
      # nothing. AGENTS.md has said "push the submodule commit FIRST" since
      # forever and nothing enforced it.
      #
      # Not in `check-fast`: that tier is source-free AND network-free by
      # contract, and this gate's whole job is to ask the REMOTE. Asking the
      # local clone instead would pass on exactly the one host where the
      # mistake is invisible.
      #
      # Every pin, not only the moved ones: a PR is where a reviewer's fresh
      # clone gets its first chance, and 20 `--depth=1` existence probes cost
      # seconds.
      - name: just check submodule-commits-reachable
        run: |
          source ./activate.sh
          just check submodule-commits-reachable

      - name: sccache stats (compile tier)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) && always() }}
        run: |
          # MEASURED, not assumed. A cache that silently misses every request
          # looks exactly like one that is working; the only difference is in
          # this output. `|| true` — a stats failure must never fail a gate.
          #
          # `pull_request` was NOT in that list, which made the sentence above
          # false exactly where it mattered: the PR is the event that compiles
          # on every push an agent makes, and it was the one event with no
          # stats. A backend that had been unavailable since the sccache bump
          # therefore cost ~178 s per run — 45% of this job — behind a
          # `::warning::` and no measurement at all. Same shape as the export
          # bug above: the diagnostic excluded the case it existed for.
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || true
          # A non-zero `Cache write errors` above is a count with no cause. The
          # server log carries the actual transport/HTTP error; dedupe it, since
          # one root cause repeats once per compilation unit.
          if [ -s /tmp/sccache-server.log ]; then
            echo "--- sccache server log (deduped) ---"
            { sort /tmp/sccache-server.log | uniq -c | sort -rn | head -25; } || true
          fi

  # phase-489 W5 — the fast line's two COMPILE gates, beside it rather than in it.
  #
  # `probe-workspace-caps` (CMake probe of a two-package workspace, a cold cargo
  # build of the C++ runtime) and `api-parity` (rustdoc JSON + clang AST of the
  # three surfaces) were ~1/3 of `check-fast`'s CPU on a 4-vCPU runner that the
  # lane saturates (busy/wall 4.0x), so they set its wall: 465-482 s on EPYC
  # 7763. In their own job they run on their own 4 vCPUs, in parallel with the
  # fast line, and `check-fast` keeps its buildless contract.
  #
  # Coverage is unchanged: the job-level `if:` is `check-fast`'s, so every event
  # that ran them inside `just check fast` still runs them, and `ci-ok` hears
  # this job with `check-fast`'s event list (`check-default-gates-run-somewhere`
  # R3). Locally they left `just check fast` (and so `pre-push`) for
  # `.config/gate-lane-exempt.txt`, and `just check` (`default:`) plus
  # `just ci gate` (its `steps=(…)`) name them, so every tier that claimed them
  # still runs them. `warm-cache` warms their compiles too
  # (`check-gate-cache-keys-agree`). Setup below is the subset of `check-fast`'s
  # steps these two gates read, whose comments explain each.
  check-fast-compile:
    name: check / fast compile gates (every event)
    needs: changes
    if: >-
      ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Cache sccache directory (compiling events)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sccache
          key: sccache-${{ runner.os }}-check-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-check-

      - name: Report runner hardware
        run: scripts/ci/report-runner-hardware.sh

      - name: Configure sccache (compiling events)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::warning::sccache absent from the image — the compile tier runs UNCACHED."
            exit 0
          fi
          sccache --version

          export SCCACHE_DIR=/tmp/sccache
          export SCCACHE_CACHE_SIZE=2G
          export SCCACHE_ERROR_LOG=/tmp/sccache-server.log
          export SCCACHE_LOG=warn
          if sccache --start-server >/tmp/sccache-start.log 2>&1; then
            {
              echo "SCCACHE_DIR=/tmp/sccache"
              echo "SCCACHE_ERROR_LOG=/tmp/sccache-server.log"
              echo "SCCACHE_LOG=warn"
              echo "SCCACHE_CACHE_SIZE=2G"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable — the compile tier runs UNCACHED (issue 0874)."
            sed 's/^/  /' /tmp/sccache-start.log || true
          fi

      - name: Key the CLI binary cache on source_stamp.rs's whole watch set
        id: cli-key
        run: |
          key="$(scripts/ci/cli-bin-cache-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the nros + nros-launch-resolve binaries (every event)
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/cli/target/release/nros
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
            packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
          key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

      - name: Build the in-tree nros CLI (every event)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup-cli
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      - name: Provision Corrosion (pinned by [tool.corrosion])
        run: |
          source ./activate.sh
          just workspace install-corrosion

      - name: Provision compile-tier sources
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Provision the sources the fast-line source gates read
        timeout-minutes: 8
        run: |
          git submodule update --init --depth 1 \
            packages/rmw/zenoh/zpico-sys/zenoh-pico \
            packages/rmw/xrce/xrce-sys/micro-cdr \
            packages/rmw/xrce/xrce-sys/micro-xrce-dds-client \
            third-party/nuttx/libc

      # The skip ledger is shared with `check-fast`'s reader; this job starts
      # it empty so the closing step below reads only these two gates.
      - name: Reset the skip ledger
        run: |
          source ./activate.sh
          just _check-skip-reset

      # One gate per `run:` block (`check-default-gates-run-somewhere` R2), and
      # `!cancelled()` so a red first gate still leaves the second its verdict.
      - name: just check probe-workspace-caps
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          just check probe-workspace-caps

      - name: just check api-parity
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          just check api-parity

      # Neither gate is in `.config/ci-check-fast-skips.txt`, so neither may
      # skip here: a recorded skip (no CLI, no cmake, no store Corrosion) is a
      # missing input this job must provide, never a pass.
      - name: These gates may not skip
        if: ${{ !cancelled() }}
        run: |
          source ./activate.sh
          . scripts/build/check-skip.sh
          ledger="$(_nros_check_skip_file)"
          if [ -s "$ledger" ]; then
            echo "check-fast-compile: FAIL -- these gates did not verify:" >&2
            sed 's/^/  /' "$ledger" >&2
            exit 1
          fi
          echo "check-fast-compile: no gate skipped"

      - name: sccache stats (compile tier)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) && always() }}
        run: |
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || true
          if [ -s /tmp/sccache-server.log ]; then
            echo "--- sccache server log (deduped) ---"
            { sort /tmp/sccache-server.log | uniq -c | sort -rn | head -25; } || true
          fi

  check-compile-smoke:
    name: check / compile-smoke + rustdoc (pull request only)
    needs: changes
    if: >-
      ${{ always() && github.event_name == 'pull_request'
          && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      # Setup below is the same as `check-fast`'s, whose comments explain each
      # step (phase-489 W1 split one job into these siblings).
      - name: Cache sccache directory (compiling events)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sccache
          key: sccache-${{ runner.os }}-check-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-check-

      # phase-489 W5 — which CPU did this run land on? The same gate set has
      # measured 6.0 min and 12.2 min of busy CPU on hosted runners, every gate
      # 1.6-2.0x slower in the slow runs, and the log named no CPU model, so the
      # hardware explanation stayed a suspicion. Evidence only: no behaviour.
      - name: Report runner hardware
        run: scripts/ci/report-runner-hardware.sh

      - name: Configure sccache (compiling events)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::warning::sccache absent from the image — the compile tier runs UNCACHED."
            exit 0
          fi
          sccache --version
          export SCCACHE_DIR=/tmp/sccache
          export SCCACHE_CACHE_SIZE=2G
          export SCCACHE_ERROR_LOG=/tmp/sccache-server.log
          export SCCACHE_LOG=warn
          if sccache --start-server >/tmp/sccache-start.log 2>&1; then
            {
              echo "SCCACHE_DIR=/tmp/sccache"
              echo "SCCACHE_ERROR_LOG=/tmp/sccache-server.log"
              echo "SCCACHE_LOG=warn"
              echo "SCCACHE_CACHE_SIZE=2G"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable — the compile tier runs UNCACHED (issue 0874)."
            sed 's/^/  /' /tmp/sccache-start.log || true
          fi

      - name: Key the CLI binary cache on source_stamp.rs's whole watch set
        id: cli-key
        run: |
          key="$(scripts/ci/cli-bin-cache-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the nros + nros-launch-resolve binaries (every event)
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/cli/target/release/nros
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
            packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
          key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

      - name: Build the in-tree nros CLI (every event)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup-cli
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      - name: Provision clang-format (pinned by [tool.clang-format])
        run: |
          source ./activate.sh
          just setup-clang-format

      - name: Provision Corrosion (pinned by [tool.corrosion])
        run: |
          source ./activate.sh
          just workspace install-corrosion

      - name: Provision compile-tier sources
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Fetch the pin baseline for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh provide

      - name: Init submodules whose pin moved (commits only)
        run: bash scripts/ci/pin-baseline.sh init-moved

      - name: Fetch submodule history for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh deepen

      # THE ARRANGEMENT, phase-395 — now spread across the `check-*` siblings
      # (phase-489 W1) and still ONE required status context, `CI`, which does
      # DIFFERENT WORK per event:
      #
      #   pull_request  ->  check-fast + compile-smoke + cli-tests
      #                     + workspace-all
      #   merge_group   ->  + test-unit, test-lane-contracts       per BATCH
      #   schedule      ->  + check-build, no-std — the full tier, daily
      #
      # NOTE `check-build` is schedule/dispatch ONLY. It was on the merge group
      # once and could never pass there (it resolves generated bindings and
      # prebuilt `.compile-ok` that no CI job builds), which left the required
      # check red for every pull request for a day. `check-lane-contracts`
      # enforces the rule that came out of it: a gate on an affordability tier
      # may only resolve artifacts the job itself builds.
      #
      # That is the whole economic argument for a merge queue: the expensive
      # verification runs once per batch, not once per pull request AND again
      # per batch.
      #
      # What keeps the queue from eating bad batches is NOT this gate — it is
      # the agent running `just ci gate` locally before pushing, which is the
      # same tier. A compile error that reaches the queue ejects its batch-mates;
      # GitHub then re-tests them in smaller groups, so the cost is bounded and
      # paid rarely.
      #
      # phase-395 — a COMPILE SMOKE TEST, pull requests only.
      #
      # The compile tier lives in the merge group, which means a plainly broken
      # pull request is caught by the QUEUE — costing a batch slot, an ejection
      # and someone's triage — rather than by its own gate. This compiles the
      # workspace ONCE (no lints, no feature matrix, no backends) to catch that
      # class here, while the expensive verification stays batched.
      #
      # Not on merge_group: `check-build` there does strictly more, so running
      # both would compile the same tree twice on the critical path to landing.
      #
      # It does NOT subsume the tier and must not be read as doing so — no
      # clippy, so no `-D warnings`; no feature combinations, so a break that
      # only appears under `--no-default-features` still reaches the queue.
      # What it does catch is the common case: a type error, a signature change
      # that did not propagate, a test that no longer compiles.
      - name: just check compile-smoke (pull request only)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: |
          source ./activate.sh
          just check compile-smoke

      # phase-431 W6 — rustdoc, on a lane a PR actually runs.
      #
      # The broken-link lint is deny-level here and NOTHING on a merge-gating
      # path ran rustdoc, so `just book` and every docs deploy were red for
      # three days with no lane saying so (`docs.yml`'s path filter includes the
      # crate that broke, so it was failing rather than skipping). A second
      # break sat behind the first, invisible, because rustdoc stops at the
      # first crate that fails.
      #
      # It lives in THIS job because the job already compiles the workspace on a
      # pull request — `check-lane-contracts`'s rule is that a lane may only
      # resolve artifacts the job itself builds. It documents the DEPLOYED crate
      # set (scripts/build/rustdoc-set.sh, shared with `just book`), not the
      # workspace. The wider pass is now its own step below (issue 1116 /
      # phase-452 W4) and stays separate: what makes THIS one worth being red
      # is that a red here means the deploy is broken.
      # issue 1138 — the gate has three outcomes now (FAIL / NOT VERIFIED / OK),
      # because `cargo doc` runs `zpico-sys`'s build script and that script
      # PANICS on an unprovisioned zenoh-pico. A checkout without the source
      # gets a reported skip instead of a red about documentation.
      #
      # THIS job is the one lane that genuinely provisions it — the step above
      # does — so here the skip would be a lie of a different kind: a
      # provisioning regression would silently stop checking the docs and this
      # step would stay green. STRICT turns that back into a red, and it is set
      # HERE and nowhere else, for exactly the reason 1043 gives: setting it on
      # a lane that provisions a subset re-creates the issue.
      - name: just check rustdoc-links (pull request only)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          NROS_RUSTDOC_LINKS_STRICT: "1"
        run: |
          source ./activate.sh
          just check rustdoc-links

      # issue 1116 / phase-452 W4 — the OTHER scope, in its OWN step.
      #
      # `rustdoc-links` above answers for the six crates the book deploys and
      # must keep answering only for those: a crate nothing publishes must not
      # be able to turn a pull request red over a docs deploy that is fine.
      # This step answers for the rest of the workspace, which had never been
      # asked: 179 diagnostics and twelve crates that could not document at
      # all, measured 2026-09-25, where the issue had recorded "~70, five"
      # three weeks earlier. All fixed; this holds the zero. 8.6 s warm.
      #
      # A SEPARATE step, not another command in the block above, for issue
      # 1040's R2: a `run:` block is `bash -e`, so a second `just check`
      # sequenced after a red first one never executes — and a gate that did
      # not execute is indistinguishable from one that passed.
      #
      # STRICT here for the same reason as its sibling and NOWHERE else: this
      # job's "Provision compile-tier sources" step really does install every
      # source in the table (zenoh-pico, cyclonedds, micro-cdr,
      # micro-xrce-dds-client), so an absent one is the WORKFLOW's regression
      # and must be a red rather than a reported skip.
      - name: just check rustdoc-workspace (pull request only)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          NROS_RUSTDOC_WORKSPACE_STRICT: "1"
        run: |
          source ./activate.sh
          just check rustdoc-workspace
      - name: sccache stats (compile tier)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) && always() }}
        run: |
          command -v sccache >/dev/null 2>&1 && sccache --show-stats || true
          if [ -s /tmp/sccache-server.log ]; then
            echo "--- sccache server log (deduped) ---"
            { sort /tmp/sccache-server.log | uniq -c | sort -rn | head -25; } || true
          fi

  check-cli-tests:
    name: check / cli-tests + node-std-tests + launch-resolve-fresh
    needs: changes
    if: >-
      ${{ always() && contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name)
          && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    # phase-489 W2 — ROUTED like `check-workspace-all` / `check-test-unit`:
    # self-hosted on merge_group / workflow_dispatch, hosted (in the CI image)
    # on pull_request / schedule. Why each half, the fork-PR rule, the interlock
    # variable (`vars.NROS_GATE_SELF_HOSTED`, unset = hosted, nothing changes)
    # and the clean-tree step: see the `check-workspace-all` comment block.
    # `check-workflow-runner-isolation` parses the expression
    # (scripts/lib/runner_route.py).
    #
    # This job was held back from the first routing because its `cli-tests`
    # step runs the rosidl parity tests `--ignored` once `/opt/ros/$ROS_DISTRO`
    # exists, and they FAIL on an absent interface package. The runner image
    # now carries them: `[prereq.ros-interface-packages]` (std_msgs,
    # geometry_msgs, sensor_msgs, example_interfaces), added to the image by
    # `scripts/ci/runner-container.sh`. The image must be REBUILT and
    # redeployed by the runner operators before the variable is turned on.
    runs-on: ${{ vars.NROS_GATE_SELF_HOSTED == 'true' && contains(fromJSON('["merge_group","workflow_dispatch"]'), github.event_name) && fromJSON('["self-hosted","linux","nros-sdk-zephyr","nros-big"]') || 'ubuntu-22.04' }}
    permissions:
      contents: read
      packages: read
    # The self-hosted runner IS a container (unprivileged, no Docker), so it
    # cannot start a job container: an EMPTY image means "no container".
    container:
      image: ${{ !(vars.NROS_GATE_SELF_HOSTED == 'true' && contains(fromJSON('["merge_group","workflow_dispatch"]'), github.event_name)) && 'ghcr.io/newslabntu/nano-ros-ci:humble' || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      # phase-489 W2 — see `check-workspace-all`: a self-hosted checkout
      # persists, so remove leftover state and ASSERT the result.
      - name: Start from a clean tree (self-hosted only)
        if: ${{ runner.environment == 'self-hosted' }}
        run: scripts/ci/self-hosted-clean-tree.sh

      # Setup below is the same as `check-fast`'s, whose comments explain each
      # step (phase-489 W1 split one job into these siblings).
      # Hosted only: a self-hosted runner keeps its own sccache volume.
      - name: Cache sccache directory (compiling events)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) && runner.environment == 'github-hosted' }}
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sccache
          key: sccache-${{ runner.os }}-check-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-check-

      # phase-489 W5 — which CPU did this run land on? The same gate set has
      # measured 6.0 min and 12.2 min of busy CPU on hosted runners, every gate
      # 1.6-2.0x slower in the slow runs, and the log named no CPU model, so the
      # hardware explanation stayed a suspicion. Evidence only: no behaviour.
      - name: Report runner hardware
        run: scripts/ci/report-runner-hardware.sh

      - name: Configure sccache (compiling events)
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::warning::sccache absent from the image — the compile tier runs UNCACHED."
            exit 0
          fi
          sccache --version
          # Self-hosted: leave sccache on its persistent volume and the
          # justfile's size (see `check-workspace-all`).
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            echo "self-hosted: sccache uses its own volume (${SCCACHE_DIR:-$HOME/.cache/sccache})"
            exit 0
          fi
          export SCCACHE_DIR=/tmp/sccache
          export SCCACHE_CACHE_SIZE=2G
          export SCCACHE_ERROR_LOG=/tmp/sccache-server.log
          export SCCACHE_LOG=warn
          if sccache --start-server >/tmp/sccache-start.log 2>&1; then
            {
              echo "SCCACHE_DIR=/tmp/sccache"
              echo "SCCACHE_ERROR_LOG=/tmp/sccache-server.log"
              echo "SCCACHE_LOG=warn"
              echo "SCCACHE_CACHE_SIZE=2G"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable — the compile tier runs UNCACHED (issue 0874)."
            sed 's/^/  /' /tmp/sccache-start.log || true
          fi

      # `cli-tests` compiles the CLI sub-workspace's TEST targets, which the
      # binary cache does not hold, so this sibling alone also restores the full
      # target tree `warm-cache` saves (`cargo test --no-run` there). That is the
      # 3.8 min restore phase-489 measured; it now sits on this one sibling's
      # path instead of on the required gate's. BEFORE the binary restore, so an
      # exact binary hit overwrites whatever `nros` this older tree carries.
      - name: Cache CLI build (cli-tests' test targets)
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/cli/target
            packages/cli/nros-launch-resolve/target
          key: nros-cli-${{ runner.os }}-${{ hashFiles('packages/cli/Cargo.lock', 'packages/cli/**/Cargo.toml', 'packages/cli/**/*.rs') }}
          restore-keys: |
            nros-cli-${{ runner.os }}-

      - name: Key the CLI binary cache on source_stamp.rs's whole watch set
        id: cli-key
        run: |
          key="$(scripts/ci/cli-bin-cache-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the nros + nros-launch-resolve binaries (every event)
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/cli/target/release/nros
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve
            packages/cli/nros-launch-resolve/target/release/nros-launch-resolve.nros-source-stamp
            packages/cli/nros-launch-resolve/target/release/libplay_launch_parser_pyexec.so
          key: nros-cli-bin-${{ runner.os }}-${{ steps.cli-key.outputs.key }}

      - name: Build the in-tree nros CLI (every event)
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          source ./activate.sh
          just setup-cli
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null
          echo "$GITHUB_WORKSPACE/packages/cli/target/release" >> "$GITHUB_PATH"

      - name: Provision clang-format (pinned by [tool.clang-format])
        run: |
          source ./activate.sh
          just setup-clang-format

      - name: Provision Corrosion (pinned by [tool.corrosion])
        run: |
          source ./activate.sh
          just workspace install-corrosion

      - name: Provision compile-tier sources
        if: ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name) }}
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Fetch the pin baseline for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh provide

      - name: Init submodules whose pin moved (commits only)
        run: bash scripts/ci/pin-baseline.sh init-moved

      - name: Fetch submodule history for check-submodule-pins
        run: bash scripts/ci/pin-baseline.sh deepen

      # The CLI sub-workspace's own tests, on BOTH merge-gating events.
      #
      # `cli-tests` lived only in `check-build`, which is `schedule` /
      # `workflow_dispatch` only — so nothing on the path to `main` ran it, and a
      # red could land and stay. It did: issue 0896's C++ RX bound shipped with a
      # golden and a parity expectation that both contradicted the emitter, and
      # `main` carried those two reds until someone ran `just ci l1` locally.
      # A test suite no merge-gating lane runs is the issue-0319 shape (a backend
      # suite with no lane, red on main for two days) one workspace over.
      #
      # It belongs here rather than in the build tier because it resolves NO
      # fixture: no SDK, no cross toolchain, no QEMU — the
      # `check-lane-contracts` rule for a merge-gating lane.
      #
      # WHAT IT COSTS, measured on this runner in both cache states, because a
      # single number is what made the first two estimates wrong:
      #
      #   cold (empty sccache):  6 m 15 s tests + 2 m 07 s provisioning
      #   warm:                  1 m 32 s tests +    17 s provisioning
      #
      # The local warm-tree figure was 34 s; quoting THAT here would have been
      # an order of magnitude out, and quoting only the cold one would have
      # over-stated the steady state by four. The CLI build two steps up does
      # NOT amortise either: it builds `--bin nros`, while this compiles the
      # sub-workspace's test targets.
      #
      # That is real latency on the path to landing, and it buys the guarantee
      # that the suite cannot be red on `main` — which it was, for the two days
      # issue 0896's reds sat there.
      #
      # It needs no ROS either, and that is a property of the suite rather than
      # an assumption: `cargo-nano-ros`'s integration tests read
      # `AMENT_PREFIX_PATH` and print `[NO-ROS] … skip` when it is unset, because
      # this sub-workspace is run with a plain `cargo test`. Verified by running
      # the whole workspace with `AMENT_PREFIX_PATH`, `ROS_DISTRO`,
      # `CMAKE_PREFIX_PATH` and `LD_LIBRARY_PATH` unset and a minimal `PATH`:
      # zero failures.
      #
      # On merge_group as well as pull_request, unlike `compile-smoke`. The
      # reason `compile-smoke` is PR-only is that `check-build` would do strictly
      # more in the queue — but `check-build` is NOT on the merge group
      # (phase-396 W1), so for this suite the queue would otherwise run nothing.
      # Cheap and deterministic is exactly what that lane is documented to
      # accept.
      # `cli-tests`' `plan_pipeline_e2e` shells out to `nros-launch-resolve`, and
      # `--bin nros` does NOT build it — it is a separate workspace beside the
      # CLI (issue 0797), so nothing earlier in this job produces it.
      #
      # This is the `check-lane-contracts` rule applied to the step below: a lane
      # may resolve a compile-stage artifact only if the lane BUILDS it. Same
      # provisioning `host-tests.yml` does for the same reason.
      #
      # Found by RUNNING it, not by reading: the local run that justified this
      # step passed with ROS unset, which proved env independence and said
      # nothing about artifact preconditions — the helper was already built in
      # that tree. CI had no such tree and failed with
      # `nros-launch-resolve not built at … — run just setup-launch-resolve`.
      # Two steps need it, on DISJOINT events, so the condition is the union of
      # theirs: `just check cli-tests` on pull_request/merge_group, and
      # `just generate-bindings` on schedule/workflow_dispatch — that one runs
      # `nros sync`, which refuses to resolve a SystemModel without the
      # resolver beside the `nros` binary.
      #
      # It was built for the first pair only, so every scheduled run since
      # 2026-09-01 died in `generate-bindings` with "1 SystemModel(s) need
      # resolving but `nros-launch-resolve` is not next to the `nros` binary".
      # Same shape `check-lane-contracts` exists to forbid — a step resolving an
      # artifact its own job never builds — but that gate only reaches
      # merge-gating lanes, and its predicate is one level down (a RECIPE
      # resolving an unbuilt stamp, not a STEP narrower than its consumers), so
      # nothing watched this. Issue 1030 carries the gap.
      - name: Build nros-launch-resolve (cli-tests and generate-bindings both shell out to it)
        if: >-
          ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name)
              && !cancelled() }}
        run: |
          source ./activate.sh
          just setup-launch-resolve

      # Issue 1739 — `check::launch-resolve-fresh` is a step of `just ci gate`
      # and is lane-EXEMPT (it needs the resolver built), so it was in no lane
      # and on no workflow: `check-default-gates-run-somewhere` assumed a
      # `check::` step covered "through the lane". This job builds the resolver
      # in the step above, so the gate has its artifact here, on the same events.
      - name: just check launch-resolve-fresh
        if: >-
          ${{ contains(fromJSON('["pull_request","merge_group","schedule","workflow_dispatch"]'), github.event_name)
              && !cancelled() }}
        run: |
          source ./activate.sh
          just check launch-resolve-fresh

      - name: just check cli-tests
        if: >-
          ${{ contains(fromJSON('["pull_request","merge_group"]'), github.event_name)
              && !cancelled() }}
        run: |
          source ./activate.sh
          just check cli-tests

      # issue 1059 — `node-std-tests` on BOTH merge-gating events, for the same
      # reason `cli-tests` is above it, and with the same evidence behind it.
      #
      # It lived only in `check-build`, which is `schedule` / `workflow_dispatch`
      # only, so nothing on the path to `main` ran it. `main` then carried a
      # compile error for a day: phase-421 W1-W3 reverted an associated type
      # across 142 impls and left NINE behind, and
      #
      #     error[E0437]: type `Format` is not a member of trait
      #                   `nros_serdes::schema::Message`
      #
      # is not a subtle red. It hid because all nine survivors are
      # `#[cfg(test)]`: `cargo check -p nros-node --lib --features std` PASSES,
      # because test cfg is not compiled. Only a test BUILD reaches them, and no
