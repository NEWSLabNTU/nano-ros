          source ./activate.sh
          just setup-launch-resolve

      # Issue 1226 — the last step of `just ci gate`, and until now the one step
      # of that lane NO workflow ran, on any event.
      #
      # `test-unit` above excludes `nros-tests` by CRATE, because that crate's
      # tests generally need `just build-test-fixtures` staged first. These two
