# phase-433 W5 — does what worked against a live ROS 2 peer STILL work?
#
# Membership is `.config/interop-verdicts.toml`, not a list in this file: a cell
# joins only after a human ran it live and `--record` wrote the verdict from a
# real junit. So this lane is GREEN on its first run by construction, and a red
# means a cell that demonstrably worked has stopped working.
#
# That is the whole reason it is separate from `host-tests.yml`'s `just ci
# tier1`. Tier 1 carries the entire compile tier, so any unrelated red stops the
# run before `test-all` and the cells produce no verdict at all — measured on
# 2026-09-06, when tier1 finally cleared issue 1136's fixture break and then
# died in `check-build` on an unrelated latch test. Verification must not be
# hostage to everything else being green (CLAUDE.md: a uniformly-red lane has no
# signal capacity).
#
# SCHEDULE + DISPATCH ONLY. Never on `pull_request`: it needs a live bus, it is
# slow, and a required check that cannot pass everywhere is how two PRs
# deadlocked on 2026-08-28.
name: live-peer regression

on:
  schedule:
    # 04:00 UTC, clear of the 05:00 platform sweep and the nightly report.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: live-peer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: cells with a recorded live PASS
    runs-on: ubuntu-22.04
    # The distro comes from the image, which is why grepping this file for
    # `ros-humble` finds nothing (that reading cost issue 1127 a wrong revision).
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    # WHICH STAGE DID THIS RUN REACH? — issue 1158's third axis, applied here.
    #
    # This lane already discriminated "the run did not happen" from "a cell
    # regressed", but ONLY inside `test-live-peer-regression`'s cell loop, by
    # exit code (100 = nextest ran and failed; anything else = the run did not
    # happen). Every step UPSTREAM of that loop reported as a flat lane
    # `failure` — which is the exact ambiguity the loop was written to remove,
    # one step above where the guard was put.
    #
    # Measured: run 34186427723 (2026-09-08) died in the fixture build and
    # reached zero cells. `gh run list` said `failure`, indistinguishable from a
    # recorded-passing cell having regressed — which is the one thing this lane
    # exists to report.
    outputs:
      stage_label: ${{ steps.stage.outputs.label }}
      reached_cells: ${{ steps.stage.outputs.reached_cells }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the nros CLI
        id: cli
        run: |
          git submodule update --init --depth 1 packages/cli/third-party/play_launch
          cargo build --release --manifest-path packages/cli/Cargo.toml --bin nros
          # phase-429 W5 — ASSERT the binary matches the checkout rather than
          # hoping. A stale CLI re-stales every fixture keyed on its source
          # stamp, so this lane would report a fixture problem for a CLI one.
          "$GITHUB_WORKSPACE/packages/cli/target/release/nros" source-stamp >/dev/null

      - name: Report what the ledger claims, before running anything
        id: ledger
        run: |
          source ./activate.sh
          just interop-verdicts

      # Run 34300486133 (2026-09-09) died here, one step further on than the
      # abort PR #780 fixed, and said exactly why:
      #
      #   ERROR: workspace fixture 'workspace-rust-native-bridge' requires the
      #          cyclonedds submodule, which is not checked out
      #          (third-party/dds/cyclonedds is empty).
      #
      # `actions/checkout@v4` above takes NO submodules, and the only
      # `git submodule update` in this lane is the CLI step's `play_launch`.
      # The lane then asks for cyclonedds fixtures two lines below, so the
      # requirement was always there and nothing checked it out.
      #
      # `--recursive` is the error's own advice, and cyclonedds needs it: this
      # fixture vendors C++ CycloneDDS by design. NOT `--depth 1` here — the
      # pin is a chosen release plus our fork's patch commits (issue 0507), and
      # a shallow clone is what makes `git merge-base --is-ancestor` unable to
      # answer, which is the shape that cost a false data-loss alarm on
      # 2026-08-31.
      - name: Check out the submodules the fixtures vendor
        id: submodules
        run: |
          # EVERY backend this lane builds, not the one that happened to fail
          # first. Run 34443301413 fixed cyclonedds and then died on XRCE — the
          # same requirement one backend over, because the fix had been aimed at
          # the reported site instead of the class.
          #
          # The set is derived from the three build lines below: the workspace
          # rows cover zenoh/cyclonedds/xrce, and each vendors its own C or C++
          # source. `zenoh-pico`/`mbedtls` already arrive with the container
          # image, and re-initialising them is a no-op that costs nothing and
          # stops this list from depending on that staying true.
          #
          # NOT `submodules: recursive` on `actions/checkout` — that is all 20,
          # including `PX4-Autopilot` and `qemu`, none of which this lane builds.
          git submodule update --init --recursive \
              third-party/dds/cyclonedds \
              packages/rmw/xrce/xrce-sys/micro-xrce-dds-client \
              packages/rmw/xrce/xrce-sys/micro-cdr \
              packages/rmw/zenoh/zpico-sys/zenoh-pico \
              packages/rmw/zenoh/zpico-sys/mbedtls

      # NOT "the fixtures those CELLS resolve", which is what this said until
      # 2026-09-09. `lane-stage.py` classifies a step by keyword, `cells` is the
      # marker for the runtime stage, and the classifier takes the most specific
      # stage first — so the old name made a FIXTURE BUILD failure report as
      # "the cells ran and failed", i.e. as a live-peer regression. Run
      # 34186427723 is exactly that failure. The self-test pins the old spelling
      # as a misclassification so the rename cannot be undone by accident.
      - name: Build the fixtures those rows resolve
        id: fixtures
        run: |
          source ./activate.sh
          # Order is load-bearing: the CLI first (above), then anything that runs
          # `nros sync` — it rewrites `generated/` and re-stales every row
          # fixture built before it — then the rows. Building rows first cost a
          # whole box batch on 2026-09-06.
          NROS_CARGO_FLAGS= just native build-workspace-fixtures
          bash scripts/build/fixtures-build.sh linux rust zenoh
          bash scripts/build/fixtures-build.sh linux rust cyclonedds

      - name: Run the cells with a recorded PASS
        id: cells
        run: |
          source ./activate.sh
          just native test-live-peer-regression

      - name: Ledger after the run
        if: always()
        run: |
          source ./activate.sh
          just interop-verdicts || true

      # `steps.<id>.outcome`, not `.conclusion`: the outcome is the step's own
      # result before any `continue-on-error` rewrite, and it speaks the same
      # vocabulary `gh run view --json jobs` returns — which is what lets
      # `--history` classify this lane's past runs with the identical function
      # this step calls.
      - name: Which stage did this lane reach?
        id: stage
        if: always()
        env:
          NROS_LANE_STEPS: >-
            [{"name": "Build the nros CLI", "conclusion": "${{ steps.cli.outcome }}"},
             {"name": "Report what the ledger claims, before running anything", "conclusion": "${{ steps.ledger.outcome }}"},
             {"name": "Check out the submodules the fixtures vendor", "conclusion": "${{ steps.submodules.outcome }}"},
             {"name": "Build the fixtures those rows resolve", "conclusion": "${{ steps.fixtures.outcome }}"},
             {"name": "Run the cells with a recorded PASS", "conclusion": "${{ steps.cells.outcome }}"}]
        run: python3 scripts/ci/lane-stage.py --report --lane "live-peer regression"

  # The job NAME carries the stage, for the same reason `run-matrix.yml`'s
  # `coverage` job does: a check-run name is the last piece of a run that is
  # legible without opening a log — `gh run view`, the commit's checks list, the
  # run list. Everything else this lane knows about how far it got dies in a log
  # nobody reads until something is already wrong.
  #
  # `if: always()` and `needs`, so it reports on a failure and a skip alike;
  # `|| 'DID NOT START'` covers the run where `regression` produces no outputs
  # at all, which is neither a verdict nor a lane failure.
  stage:
    name: "live-peer — ${{ needs.regression.outputs.stage_label || 'DID NOT START' }}"
    needs: [regression]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      # Through `env:`, never interpolated into the script body — a `${{ }}`
      # expansion is substituted as TEXT before the shell parses the line, so a
      # label carrying a quote would be a shell injection rather than a string.
      - name: Say in the run list what the log would have to be opened for
        env:
          LABEL: ${{ needs.regression.outputs.stage_label || 'DID NOT START' }}
          REACHED: ${{ needs.regression.outputs.reached_cells }}
        run: |
          label="$LABEL"
          reached="$REACHED"
          echo "live-peer regression: $label"
          if [ "$reached" != "true" ]; then
              echo ""
              echo "The cells did not run, so this run says NOTHING about whether"
              echo "a recorded-passing cell still passes. It is a verdict about"
              echo "the lane, not about the code. Do not read a green ledger as"
              echo "guarded until a run reaches its cells."
          fi
