# Publish — phase-559 W8. What `main` publishes on a merge:
#
#   job       was          publishes
#   deploy    docs.yml     the user book, nano-ros Internals and the API docs,
#                          to NEWSLabNTU.github.io/nano-ros-book
#   ci-base   images.yml   ghcr.io/newslabntu/nano-ros-ci
#   zephyr    images.yml   ghcr.io/newslabntu/nano-ros-zephyr-ci
#
# One file because nothing forces them apart: both run on a push to `main`
# and on dispatch, neither runs pull-request code, and neither is a required
# check. A path filter is per FILE and trigger (phase-559 H5), so the push
# `paths:` below is the union of both, and the `changes` job decides which
# job a push reaches: the book filter for `deploy`, one filter per image.
# A dispatch names the one thing to publish (`job`), and ONLY that: the path
# filters decide on a push alone. On a dispatch `dorny/paths-filter` compares
# against the previous commit, so a dispatch of `job=docs` right after a merge
# that touched a Dockerfile rebuilt and pushed both images (run 43569744391,
# 2026-11-14; `images.yml` had the same flaw).
#
# The book job needs no container and no toolchain beyond the pinned mdBook
# and Doxygen; the image jobs need buildx and a GHCR login. Permissions are
# per job, so the book's deploy holds no `packages: write`.
#
# Image tier (CI reorg / phase-253) — build + publish the CI container images.
#
# Folds the two image-build lanes into one tier file; a `changes` path-filter
# gates each job so only the image whose Dockerfile moved rebuilds (image builds
# are expensive):
#   - ci-base : ROS 2 Humble + host tools, the base `container:` for the check /
#               host-tests / platform lanes. See ci/docker/ci-base/Dockerfile.
#   - zephyr  : ci-base + the Zephyr SDK layer, the `container:` for the nightly
#               Zephyr jobs. See ci/docker/zephyr-ros/Dockerfile.
#
# GHCR repo names must be lowercase; the owner (NEWSLabNTU) is mixed-case.

name: publish

on:
  push:
    branches: [main]
    paths:
      - "ci/docker/ci-base/**"
      - "ci/docker/zephyr-ros/**"
      - ".github/workflows/publish.yml"
      # issue 1201 — the ci-base Dockerfile COPYs these two files, so they are
      # image inputs as much as the Dockerfile is. They are in the CONTENT tag
      # below for the same reason.
      - "scripts/lib/rust-targets.sh"
      - "config/rust-targets.txt"
      # phase-466 — the shared apt closure BOTH images COPY. Same rule: an
      # image input that is not in this filter is a content change that
      # publishes nothing, which is how the two lists drifted in the first
      # place. It is in both `changes` filters below and in ci-base's content
      # tag.
      - "ci/docker/apt-packages.txt"
      # issue 1760 — the `just` installer BOTH images COPY and run. Same rule.
      - "scripts/ci/install-just.sh"
      # issue 1868 — the pinned Rust toolchains ci-base bakes, and the script
      # that installs them. Same rule.
      - "config/rust-toolchains.txt"
      - "scripts/lib/install-rust-toolchains.sh"
      # phase-543 W0 — the pinned cargo-nextest ci-base bakes, and its installer.
      - "config/ci-base-tools.toml"
      - "scripts/lib/index_tool.py"
      # issue 2511 — the Zephyr SDK rows (one per Zephyr line) the zephyr image
      # bakes.
      - "config/zephyr-ci-tools.toml"
      - "scripts/lib/index_packages.py"
      # The book and API docs (the `deploy` job; was docs.yml's own list).
      - "book/**"
      - "book-internals/**"
      - "scripts/mdbook-*.py"
      - "scripts/lib/book_tabs.py"
      - "scripts/lib/book_charter.py"
      - "packages/api/nros/**"
      - "packages/core/nros-rmw/**"
      - "packages/core/nros-rmw-abi/**"
      - "packages/platform/nros-platform-api/**"
      - "packages/platform/nros-platform-cffi/**"
      - "packages/platform/nros-platform-posix/**"
      - "packages/api/nros-c/include/**"
      - "packages/api/nros-c/Doxyfile"
      - "packages/api/nros-c/docs/**"
      - "packages/api/nros-cpp/include/**"
      - "packages/api/nros-cpp/Doxyfile"
      - "book/rustdoc-driver/**"
      - "packages/rmw/zenoh/nros-rmw-zenoh/src/**"
      - "packages/rmw/xrce/nros-rmw-xrce/src/**"
  workflow_dispatch:
    inputs:
      job:
        description: "What to publish: the book, or an image (the zephyr one is 30 min)"
        type: choice
        default: docs
        options: [docs, ci-base, zephyr, both-images]

# Every job reads the repository; the image jobs add `packages: write`.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # Longest green run 0.2 min (n=31); floor 10.
    timeout-minutes: 10
    outputs:
      docs: ${{ steps.f.outputs.docs }}
      ci_base: ${{ steps.f.outputs.ci_base }}
      zephyr: ${{ steps.f.outputs.zephyr }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            docs:
              - 'book/**'
              - 'book-internals/**'
              - 'scripts/mdbook-*.py'
              - 'scripts/lib/book_tabs.py'
              - 'scripts/lib/book_charter.py'
              - 'packages/api/nros/**'
              - 'packages/core/nros-rmw/**'
              - 'packages/core/nros-rmw-abi/**'
              - 'packages/platform/nros-platform-api/**'
              - 'packages/platform/nros-platform-cffi/**'
              - 'packages/platform/nros-platform-posix/**'
              - 'packages/api/nros-c/include/**'
              - 'packages/api/nros-c/Doxyfile'
              - 'packages/api/nros-c/docs/**'
              - 'packages/api/nros-cpp/include/**'
              - 'packages/api/nros-cpp/Doxyfile'
              - 'book/rustdoc-driver/**'
              - 'packages/rmw/zenoh/nros-rmw-zenoh/src/**'
              - 'packages/rmw/xrce/nros-rmw-xrce/src/**'
              - '.github/workflows/publish.yml'
            ci_base:
              - 'ci/docker/ci-base/**'
              - 'ci/docker/apt-packages.txt'
              - 'scripts/lib/rust-targets.sh'
              - 'config/rust-targets.txt'
              - 'scripts/ci/install-just.sh'
              - 'config/rust-toolchains.txt'
              - 'scripts/lib/install-rust-toolchains.sh'
              - 'config/ci-base-tools.toml'
              - 'scripts/lib/index_tool.py'
              - 'scripts/lib/index_packages.py'
            zephyr:
              - 'ci/docker/zephyr-ros/**'
              - 'ci/docker/apt-packages.txt'
              - 'scripts/ci/install-just.sh'
              # issue 2475 — the nextest pin both images bake, and its installer.
              - 'config/ci-base-tools.toml'
              - 'scripts/lib/index_tool.py'
              - 'scripts/lib/index_packages.py'
              # issue 2511 — the Zephyr SDK pins it bakes.
              - 'config/zephyr-ci-tools.toml'

  ci-base:
    name: build + push ci-base image
    needs: changes
    if: >-
      ${{ (github.event_name == 'push' && needs.changes.outputs.ci_base == 'true')
          || (github.event_name == 'workflow_dispatch'
              && contains(fromJSON('["ci-base","both-images"]'), inputs.job)) }}
    runs-on: ubuntu-latest
    # Longest green run 23.7 min (n=27); twice that, rounded up.
    timeout-minutes: 50
    concurrency:
      group: images-ci-base
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      # TWO tags, deliberately:
      #
      #   humble              a floating alias — whatever was built last
      #   humble-<sha12>      the CONTENT of the Dockerfile that built it
      #
      # The floating tag is what every consumer used, and it is why a toolset
      # bump was invisible: the same tag silently means something different
      # after a rebuild, so a lane could not tell which toolchain it ran on.
      # The zephyr image below already avoids this (`humble-sdk0.17.4-r2`);
      # ci-base did not.
      #
      # CONTENT-derived rather than a hand-bumped revision, because a
      # hand-bumped one has the failure mode we are removing: it relies on
      # somebody remembering. Any edit to what is baked yields a new tag by
      # construction.
      #
      # Consumers still pin `humble` — moving them is a SEPARATE step, and it
      # has to be, because this tag does not exist in the registry until this
      # workflow has run on `main` at least once. Switching a `container:` in
      # the same commit would reference an image that is not there yet.
      IMAGE: ghcr.io/newslabntu/nano-ros-ci
      TAG: humble
    steps:
      - uses: actions/checkout@v4
      - name: Derive the content tag
        id: ctag
        # Over EVERY file the image bakes, not just the Dockerfile: a
        # `rust-targets.txt` edit changes the published content with the
        # Dockerfile byte-identical, and a tag that does not move for it is
        # the "same tag, different toolchain" defect this tag exists to end.
        run: |
          sha="$(cat ci/docker/ci-base/Dockerfile ci/docker/apt-packages.txt \
                     scripts/lib/rust-targets.sh config/rust-targets.txt \
                     scripts/ci/install-just.sh \
                     config/rust-toolchains.txt scripts/lib/install-rust-toolchains.sh \
                     config/ci-base-tools.toml scripts/lib/index_tool.py scripts/lib/index_packages.py \
                 | sha256sum | cut -c1-12)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "content tag: ${{ env.IMAGE }}:humble-$sha"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      # issue 1201 — the context is the REPO ROOT, not the Dockerfile's dir.
      #
      # `436035894` (2026-09-04) made the Dockerfile `COPY
      # scripts/lib/rust-targets.sh` and `config/rust-targets.txt` — paths
      # relative to the repository — while this step still handed buildx
      # `context: ci/docker/ci-base`, inside which neither exists. Every
      # ci-base build since failed in under a minute at "failed to calculate
      # checksum of ref: not found", and nothing consumed the failure: the
      # `humble` tag kept serving the 2026-08-29 content, so the image the
      # `check` job pulls never gained the targets 436035894 baked, nor the
      # `clang` that 0c73d061b added two days later for `check-api-parity`.
      # A floating tag that stays put on a failed build is indistinguishable
      # from one that was never asked to move.
      #
      # `.dockerignore` next to the Dockerfile (buildx reads
      # `<Dockerfile>.dockerignore` first) keeps the root context to the
      # files the Dockerfile names — a hosted checkout has no build output or
      # initialised submodules, but the rule should not depend on that.
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/ci-base/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ steps.ctag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  zephyr:
    name: build + push zephyr-ci image
    needs: changes
    if: >-
      ${{ (github.event_name == 'push' && needs.changes.outputs.zephyr == 'true')
          || (github.event_name == 'workflow_dispatch'
              && contains(fromJSON('["zephyr","both-images"]'), inputs.job)) }}
    runs-on: ubuntu-latest
    # Longest green run 31.2 min (n=11); twice that, rounded up.
    timeout-minutes: 65
    concurrency:
      group: images-zephyr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      # Tag encodes ROS distro + SDK version + `-rN` content revision — bump the
      # SDK/distro part when either changes, `-rN` when the Dockerfile changes
      # without an SDK/distro bump. Keep in lockstep with
      # `config/zephyr-ci-tools.toml` + every Zephyr `container:`. r2 (#59): added ros-humble-example-interfaces.
      # r3 (#0878): baked Zephyr's pinned Python build prereqs (west, pyelftools,
      # PyYAML, pykwalify, packaging) — without them every nightly cell failed at
      # `just zephyr setup` before any build.
      # r4: the SECOND Zephyr SDK (1.0.1, for the 4.4 line) actually lands. The
      # commit that added it (e569d9a55) left the tag at r3, and its image build
      # 404'd on the download, so the registry kept serving one-SDK content under
      # r3 while the tree said two — and every `zephyr 4.4 /*` cell went on
      # failing `find_package(Zephyr-sdk 1.0)` against 0.17.4. Bumped because the
      # published content changes, which is what `-rN` is for; r3 stays valid for
      # anything still pinned to it.
      #
      # ORDERING, because this tag is hand-bumped rather than content-derived:
      # `nightly.yml` is moved to r3 in the SAME commit, and r3 does not exist in
      # the registry until this workflow has run on `main`. That is safe here only
      # because this workflow triggers on the merge push (its paths filter covers
      # `ci/docker/zephyr-ros/**`) and nightly runs on a daily schedule — hours of
      # slack. If the image build fails, fix it before the next nightly rather
      # than reverting the consumers.
      # r5 (phase-466; issues 1359 + 1364): the apt closure is no longer a
      # hand-written mirror of ci-base's. It had drifted by `unzip` and
      # `python3-tomli`, and both absences were fatal to whole lanes — all 22
      # nightly `zephyr *` jobs died in `_setup-common`'s `setup-clang-format`
      # (no unzip to unpack the prebuilt), and `live-peer regression` died on
      # every repo script that reads TOML (jammy Python 3.10 has no `tomllib`
      # and the image had no `tomli`). Both now come from
      # `ci/docker/apt-packages.txt`, the ONE list both images COPY.
      # r6 (issue 1760): `just` is the pinned, checksummed release asset from
      # `scripts/ci/install-just.sh` instead of whatever `just.systems/install.sh`
      # served at build time. Consumers (nightly.yml, live-peer.yml) are
      # schedule-only, so moving them in the same commit has the slack the r3
      # note above relies on.
      # r7 (issue 2475 defect 3): cargo-nextest at the index pin, baked the way
      # ci-base bakes it, so a lane preflight claiming `nextest` passes here.
      # Consumers (nightly.yml, live-peer.yml, merge-runtime.yml, gate.yml's
      # daily zephyr copy-out) are schedule/dispatch-only, so moving them in the
      # same commit has the r3 note's slack.
      # r8 (issue 2511): the SDKs are the index's per-line pins, 0.16.9 for 3.7
      # and 1.0.1 for 4.4, read from `config/zephyr-ci-tools.toml`; 0.17.4,
      # which no line pins, is gone. The SDK part of the tag moves with it.
      # Jobs register the SDKs with `nros-zephyr-sdks-register`, which replaces
      # `/opt/zephyr-sdk/setup.sh -c` (that registered 0.17.4 alone). Consumers
      # are schedule/dispatch-only, so moving them in the same commit has the
      # r3 note's slack.
      IMAGE: ghcr.io/newslabntu/nano-ros-zephyr-ci
      TAG: humble-sdk0.16.9-r8
    steps:
      - uses: actions/checkout@v4
      # The same CONTENT tag ci-base carries, for the same reason and now for a
      # sharper one (phase-466). `-rN` is hand-bumped, so it moves only when
      # somebody remembers; and because it is also overwritable, a lane that is
      # still red after a fix cannot tell whether the fix failed or the image
      # was never republished. That ambiguity is precisely what let every
      # scheduled lane sit red for eleven days. Consumers keep pinning `-rN`
      # (the alias); this second tag is the evidence of what was in it.
      - name: Derive the content tag
        id: ctag
        run: |
          sha="$(cat ci/docker/zephyr-ros/Dockerfile ci/docker/apt-packages.txt \
                     scripts/ci/install-just.sh config/ci-base-tools.toml \
                     scripts/lib/index_tool.py scripts/lib/index_packages.py \
                     config/zephyr-ci-tools.toml \
                 | sha256sum | cut -c1-12)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "content tag: ${{ env.IMAGE }}:${{ env.TAG }}-$sha"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      # phase-466 — the context is the REPO ROOT, not the Dockerfile's dir,
      # because the Dockerfile now COPYs `ci/docker/apt-packages.txt`. This is
      # the change issue 1201 records ci-base needing and NOT getting: a COPY of
      # a repository path against a context that does not contain it fails in
      # under a minute at "failed to calculate checksum of ref: not found",
      # every time, while the published tag goes on serving old content.
      # `ci/docker/zephyr-ros/Dockerfile.dockerignore` keeps the root context to
      # the files this Dockerfile names.
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/zephyr-ros/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ steps.ctag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: changes
    if: >-
      ${{ (github.event_name == 'push' && needs.changes.outputs.docs == 'true')
          || (github.event_name == 'workflow_dispatch' && inputs.job == 'docs') }}
    # Pages deploys must not be interrupted mid-flight — don't cancel an
    # in-progress deploy (unlike the check lanes); just serialize.
    concurrency:
      group: deploy-book
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Longest green run 3.5 min (n=40); 2x rounds to 10.
    timeout-minutes: 10
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4
        # The book deploy only needs the repository sources used by mdBook,
        # rustdoc, and Doxygen. Do not fetch every submodule here: several
        # platform/runtime submodules are large, target-specific, and may
        # temporarily point at fork-only commits while development branches are
        # being synchronized. Recursive checkout makes an otherwise unrelated
        # book deploy fail before docs build starts.
        # phase-262: the rustdoc-driver no longer pulls nros-cli-core (nros-macros
        # now deps the nros-pkg-index / nros-launch-parser leaf crates, not the
        # whole CLI), so no ros-launch-resolve submodule init is needed here.

      # phase-422 W2 — the VERSION comes from the index, which is the pin.
      # This said `mdbook-version: "latest"`, a second and unpinned mechanism
      # for the tool `[tool.mdbook]` pins: the book could build against a
      # different mdBook than any contributor runs, and a breaking upstream
      # release would land here with no commit.
      #
      # The action still does the download — resolving through
      # `nros setup --tool mdbook` would mean building the CLI in a docs-only
      # job, which is a real cost for no extra correctness once the version is
      # read from the same place.
      - name: Resolve the pinned mdBook version from the index
        id: mdbook_pin
        run: |
          # awk, not a heredoc: a heredoc terminator must sit at column 0, and
          # column 0 inside a YAML `run:` block is parsed as SYNTAX. Verified
          # the heredoc form fails ("unexpected EOF") before choosing this.
          ver="$(awk '/^\[tool\.mdbook\]/{f=1;next} /^\[/{f=0} f && /^version[[:space:]]*=/{gsub(/[^0-9.]/,"",$0); print; exit}' nros-sdk-index.toml)"
          [ -n "$ver" ] || { echo "could not read [tool.mdbook] version from the index" >&2; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "mdBook pinned at $ver (nros-sdk-index.toml)"

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ steps.mdbook_pin.outputs.version }}

      - name: Install mdbook-mermaid
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      # The INDEX names these, not this file — phase-413 W3. `[prereq.doxygen]`
      # and `[prereq.graphviz]` already carry the apt/dnf/pacman/brew spellings
      # and a presence probe; repeating `doxygen graphviz` here made this the
      # second place that fact lived, and the one nobody updates.
      #
      # `nros setup --system` is the user-facing verb and stays so. It is not
      # used HERE because this job builds no CLI, and making a docs deploy
      # compile one to learn that `doxygen` is spelled `doxygen` costs minutes
      # to answer what the index answers in milliseconds. The script reads the
      # same file the CLI reads.
      # RESOLVE FIRST, and capture the status. A `$(…)` in argument position
      # throws its exit status away, and `apt-get install` with zero packages
      # exits 0 — so a failed resolve installs NOTHING and the step goes GREEN
      # (issue 1466, measured live in live-peer).
      - name: Install Doxygen + Graphviz (from the index)
        run: |
          if ! pkgs="$(python3 scripts/sdk/prereq-packages.py --manager apt doxygen graphviz)"; then
            echo "::error::prereq-packages.py could not resolve doxygen/graphviz from nros-sdk-index.toml"
            exit 1
          fi
          sudo apt-get update
          # shellcheck disable=SC2086  # deliberate: $pkgs is a package LIST
          sudo apt-get install -y $pkgs

      - name: Install Rust toolchain
        # tools/rust-toolchain.toml pins the workspace channel; reuse it so
        # rustdoc output matches the in-repo `cargo doc` invocation.
        run: |
          rustup show
          rustup component add rust-docs --toolchain $(awk '/^channel/ {gsub(/"/,"",$3); print $3; exit}' tools/rust-toolchain.toml) || true

      - name: Build mdBook
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /nano-ros-book/
        # The static pool inventory is generated and untracked, and SUMMARY.md
        # lists it as a chapter, so it has to exist before mdbook runs.
        run: |
          python3 scripts/gen-pool-inventory.py
          python3 scripts/gen-config-surface.py
          mdbook build book
          # RFC-0123 D7: nano-ros Internals, staged under the user book at
          # `internals/` (built separately: mdBook clears its build dir).
          mdbook build book-internals
          mkdir -p book/book/internals
          cp -r book-internals/book/. book/book/internals/

      - name: Build rustdoc
        # User-facing crates only — internal platform/board/driver crates
        # are not part of the public API surface and would just bloat the
        # deploy. Wipe target/doc/ first so prior workspace cargo-doc
        # artefacts (if any cache hit) don't leak into the deployed tree.
        # Pass an rmw + platform feature combo so the rmw-gated re-exports
        # (`nros::Executor`, `nros::Promise`, etc.) actually appear in the
        # rendered output — the reference stubs deep-link into them.
        env:
          # The driver builds dependency docs, so allow existing internal
          # intra-doc links that were not checked by the old `--no-deps`
          # workflow path.
          RUSTDOCFLAGS: "-A rustdoc::broken-intra-doc-links -A rustdoc::private-intra-doc-links"
        run: |
          rm -rf target/doc target/doxygen
          # Phase 104.A: `rmw-zenoh` feature on `nros` is now
          # `rmw-zenoh-cffi`. The Rust `nros-platform-posix` crate
          # was deleted (123.A.1.x.2); POSIX C symbols ship from
          # `packages/platform/nros-platform-posix/src/*.c`, compiled
          # by `nros-platform-cffi`'s `posix-c-port` feature.
          # The book rustdoc driver is its own tiny workspace so Cargo
          # does not resolve root workspace members backed by target/runtime
          # submodules. The driver depends on the public crates and activates
          # the same doc-facing feature set.
          CARGO_TARGET_DIR=target cargo doc \
            --manifest-path book/rustdoc-driver/Cargo.toml

      - name: Build Doxygen — C
        run: |
          mkdir -p target/doxygen/c
          cd packages/api/nros-c
          doxygen Doxyfile

      - name: Build Doxygen — C++
        run: |
          mkdir -p target/doxygen/cpp
          cd packages/api/nros-cpp
          doxygen Doxyfile

      - name: Build Doxygen — RMW vtable (porter-facing)
        # phase-321 W2.e moved the shim crates to packages/rmw/, but the
        # vtable headers + Doxyfile are the ABI SSoT and live in
        # packages/core/nros-rmw-abi (RFC-0054).
        run: |
          mkdir -p target/doxygen/rmw-cffi
          cd packages/core/nros-rmw-abi
          doxygen Doxyfile

      - name: Build Doxygen — Platform ABI (porter-facing)
        # RFC-0054: the SSoT C headers live in nros-platform-api (the old
        # cbindgen direction is retired). Doxygen warns-and-succeeds on a
        # missing INPUT, which is how the published reference shipped EMPTY
        # for a while — hence the emitted-page assertion.
        run: |
          mkdir -p target/doxygen/platform-cffi
          (cd packages/platform/nros-platform-api && doxygen Doxyfile)
          ls target/doxygen/platform-cffi/html/*_8h.html >/dev/null

      - name: Stage API docs into book output
        # Lay native API docs alongside the mdBook so all the
        # `../api/<lang>/...` links from book/src/reference/*.md resolve.
        # rustdoc has no top-level `index.html` for multi-`-p` invocations,
        # so stage a tiny redirect to the umbrella crate.
        run: |
          mkdir -p book/book/api
          cp -r target/doc                          book/book/api/rust
          cp -r target/doxygen/c/html               book/book/api/c
          cp -r target/doxygen/cpp/html             book/book/api/cpp
          cp -r target/doxygen/rmw-cffi/html        book/book/api/rmw-cffi
          cp -r target/doxygen/platform-cffi/html   book/book/api/platform-cffi
          cat > book/book/api/rust/index.html <<'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=nros/index.html">
          <link rel="canonical" href="nros/index.html">
          <p>Redirecting to <a href="nros/index.html">nros</a>…</p>
          HTML

      - name: Setup deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PAGES_DEPLOY_KEY }}

      - name: Deploy to NEWSLabNTU.github.io
        run: |
          git clone git@github.com:NEWSLabNTU/NEWSLabNTU.github.io.git _pages
          rm -rf _pages/nano-ros-book
          cp -r book/book _pages/nano-ros-book
          cd _pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nano-ros-book
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Update nano-ros book

          Source: ${{ github.server_url }}/${{ github.repository }}/tree/main/book
          Commit: ${{ github.sha }}"
            git push
          fi
