# Verus proofs (`just verify-verus`) — WEEKLY, advisory, gates nothing.
#
# Issue 2499: no lane ran the Verus proofs, so the lane rotted unseen. The
# crate's rust toolchain and its caret `vstd` requirement drifted away from the
# pinned Verus binary, and `cargo verus verify` panicked inside `vstd` before
# reaching a single nano-ros proof. A spec change (issue 2487) then landed
# UNPROVEN because there was nothing to prove it with.
#
# Weekly is enough: the inputs that break this lane are pin moves (the Verus
# binary, its toolchain, `vstd`) and edits to the ghost model, and a week of
# latency on either is cheap next to never hearing. Schedule + dispatch only,
# so it costs no PR anything. Kept to one job on purpose: the CI reorg may
# re-home it, and a small file is easy to move.
name: verify-verus

on:
  schedule:
    # Mondays 05:41 UTC — off the hour, clear of next-stable (04:17).
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-verus
  cancel-in-progress: true

jobs:
  verify-verus:
    name: verify-verus (advisory — gates nothing)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Build the in-tree nros CLI
        uses: ./.github/actions/setup-nros-cli

      # Downloads the `[tool.verus]` pin and installs the rust toolchain that
      # binary was built with.
      - name: Provision Verus
        run: |
          source ./activate.sh
          just verification verus

      - name: Run the Verus proofs
        run: |
          source ./activate.sh
          just verify-verus
