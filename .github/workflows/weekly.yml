# Weekly lanes — phase-559 W4. ONE cron, on SUNDAY (user ruling 2026-11-13,
# verbatim: "Change weekly.yml to run on Sundays. The overall organization is
# good to me."). Schedule + dispatch only: nothing here gates a merge, and no
# job is named `CI`.
#
# One file, because the lanes share a cadence and a runner class (hosted,
# advisory) and nothing forces them apart (phase-559: a file boundary exists
# only where a named constraint forces it). The first three were three files
# with three Monday crons: probe-platforms.yml (09:00), next-stable.yml
# (04:17), and nightly.yml's `zenoh-probe` (09:00, the only weekly cron in a
# daily file). The Verus proofs joined as the fourth lane (issue 2499).
#
# Each lane keeps its own jobs, so a red still names which lane broke.
# Dispatch runs ONE lane (`lane:`) or all of them; `candidate:` is
# next-stable's toolchain.
#
# Readers of this file's NAME, moved here in the same PR: check-cadence-jobs
# (the `weekly` cadence is job `chapter` here), check-board-registry,
# check-book-probe-tracks, record-lane-runs (`weekly` lane),
# next-stable-delta.py (its never-gates guard).
name: weekly

on:
  schedule:
    # Sundays 09:00 UTC — no daily lane runs then (02:00-08:00 are taken).
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      lane:
        description: "Which weekly lane to run"
        type: choice
        options: [all, probe-platforms, zenoh-probe, next-stable, verify-verus]
        default: all
      candidate:
        description: "next-stable: toolchain to try against the pin (stable, beta, 1.100.0, ...)"
        required: false
        default: "stable"

permissions:
  contents: read
  packages: read

jobs:
  # ===== probe-platforms (was probe-platforms.yml) =====
  #
  # The QEMU platform chapters, EXECUTED — phase-517 W10.
  #
  # `host-tests.yml`'s book-probe jobs replay the Linux front doors (the checkout track and the
  # installed track's first-project.md, the serial QEMU chapter). Every other user chapter — bare-metal,
  # FreeRTOS, ThreadX, NuttX, Zephyr — had only been proofread: their setup,
  # scaffold, build and run lines were checked to PLAN (`nros build --dry-run`),
  # never run on a machine without a checkout. This lane installs the release
  # asset into a clean container per chapter and replays that chapter's
  # `probe=NN` blocks, and each Run step must print the output block the chapter
  # documents beside it (`probe-expect`), so a chapter whose command is wrong
  # fails on the step that is wrong.
  #
  # WEEKLY, plus dispatch. NOT on pull_request and not in any merge-gating lane:
  # each chapter provisions a cross toolchain and QEMU and builds an image, tens
  # of minutes cold, and a lane nobody can afford per push gets skipped. Hosted
  # runners only (the probe drives `docker run` itself, so it needs the runner,
  # not a container) — no self-hosted runner is involved.
  #
  # The twin track (phase-524 W4a: `renode-nucleo`) replays the Zephyr
  # chapter's setup, then boots a board's serial talker in its emulator twin and
  # hears it from `ros2 topic echo` (scripts/probe/verify-installed-twin.sh).
  # A twin is free and open source (RFC-0115 Amendment 1), so no twin track
  # needs a secret and this lane holds none.
  #
  # The asset is built ONCE (`just probe platform-asset`, the same steps
  # `release-nros.yml` runs) and handed to one job per chapter, so a red names
  # its chapter and one chapter's failure never hides another's.

  asset:
    if: ${{ github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'probe-platforms' }}
    concurrency:
      group: weekly-probe-platforms-${{ github.ref }}
      cancel-in-progress: true
    name: build the release asset
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tracks: ${{ steps.tracks.outputs.tracks }}
    steps:
      - uses: actions/checkout@v4
      # phase-522 W2 — the weekly tracks are the board registry's `[[probe]]`
      # entries with `weekly = true`, generated into
      # scripts/probe/probe-tracks.json; run-bootstrap-probe.sh reads the same
      # file, so the two lists cannot disagree.
      - name: read the weekly probe tracks
        id: tracks
        run: |
          set -euo pipefail
          if ! tracks="$(python3 scripts/probe/probe-track.py --weekly)"; then
            echo "::error::scripts/probe/probe-track.py --weekly failed"
            exit 1
          fi
          echo "tracks=$tracks" >> "$GITHUB_OUTPUT"
      # See host-tests.yml's book-probe jobs for why these lanes install `just` themselves.
      - name: Install just (if absent)
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            bash scripts/ci/install-just.sh --to "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: just probe platform-asset
        env:
          # `actions/checkout` leaves a detached HEAD; the probe clones a named ref.
          PROBE_BRANCH: ${{ github.ref_name }}
          PROBE_RELEASE_CACHE: "0"
        run: |
          source ./activate.sh
          just probe platform-asset "$RUNNER_TEMP/asset"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-asset
          path: ${{ runner.temp }}/asset
          retention-days: 7

  chapter:
    if: ${{ github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'probe-platforms' }}
    name: book probe — ${{ matrix.platform }}
    needs: asset
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.asset.outputs.tracks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install just (if absent)
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            bash scripts/ci/install-just.sh --to "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: probe-asset
          path: ${{ runner.temp }}/asset
      - name: just probe ${{ matrix.platform }}
        env:
          PROBE_BRANCH: ${{ github.ref_name }}
          PROBE_ASSET: ${{ runner.temp }}/asset
        run: |
          source ./activate.sh
          just probe ${{ matrix.platform }}

  # ===== zenoh-probe (was nightly.yml's only weekly cron) =====
  #
  # The book's ROS-interop road (issue 2468): the checkout road AND the
  # installed one, then a stock ROS 2 node hears an nros talker over zenoh.
  # Weekly by the user's ruling of 2026-11-12 (1-3 h hosted).
  zenoh-probe:
    if: ${{ github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'zenoh-probe' }}
    runs-on: ubuntu-latest
    # Measured 59 min on a 139-class host (2026-11-12), the most of any probe
    # track: it runs the checkout road AND the installed one. A hosted 4-vCPU
    # runner, cold, can take 2-3x that, and a job that hits its timeout ends
    # CANCELLED with no verdict (issue 2141's shape). 180 until a hosted run
    # is measured; then set it from that run with headroom (issue 1492).
    timeout-minutes: 180
    concurrency:
      group: weekly-zenoh-probe-${{ github.ref }}-${{ github.event_name }}
    permissions:
      contents: read
    steps:
      # Full history: the probe container clones from this checkout
      # (mounted read-only), and cloning from a shallow repo fails.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim host disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
              /usr/share/dotnet /usr/local/.ghcup 2>/dev/null || true
          echo "after:";  df -h / | tail -1

      - name: Name the commit under test
        run: git switch -c probe-under-test 2>/dev/null || git checkout -b probe-under-test

      # Cold, as installed-probe is: this track runs the installed road too, so
      # the two verdicts mean the same thing.
      - name: Run zenoh interop probe
        run: PROBE_BRANCH=probe-under-test PROBE_RELEASE_CACHE=0 PROBE_TRACK=zenoh ./scripts/probe/run-bootstrap-probe.sh

      # Two roads in one hosted job is the disk-heaviest probe: print what is
      # left, pass or fail, so a later ENOSPC reads as disk, not as a book defect.
      - name: Disk after the probe
        if: always()
        run: df -h /

  # ===== next-stable (was next-stable.yml) =====
  #
  # Advisory "try the next stable" lane — issue 1642.
  #
  # `rust-toolchain.toml` is PINNED to a version (issue 1447, PR #1556), because
  # the floating `stable` channel took `main` red for everyone the day Rust 1.99.0
  # released. The pin's cost is drift: nothing says a bump is due or how large it
  # will be. This lane answers that once a week. It runs the merge-gating lint
  # gates twice on the same tree — under the pin and under the current `stable` —
  # and reports the diagnostic sites `stable` adds (PR #1536's A/B, made routine):
  #
  #   green    the bump is free today — take it
  #   red      the next bump costs the sites listed in the job summary
  #   no verdict (exit 2, also red) the A/B could not measure; see the summary
  #
  # IT MUST NEVER GATE A MERGE. A gating lane on an unpinned toolchain blocks
  # every pull request on a compiler nobody chose, which is issue 1447 itself.
  # Three properties keep it out of the merge path, and each is one edit away
  # from being lost, so `scripts/ci/next-stable-delta.py --selftest` (a fast-tier
  # gate, `just check next-stable-advisory`) refuses a change to any of them:
  #
  #   1. TRIGGERS: `schedule` + `workflow_dispatch` only. No `pull_request`, no
  #      `merge_group`, no `push` — so no check run ever attaches to a PR head or
  #      a queue batch.
  #   2. NOT IN THE AGGREGATOR: the one required check is the `CI` context, which
  #      is `gate.yml`'s `ci-ok` job. Its `needs:` can only name jobs in gate.yml;
  #      a job in this file cannot become one of them.
  #   3. NOT NAMED `CI`: the ruleset requires the context by bare NAME (no app
  #      id), so a job here called `CI` would report into it.
  #
  # WHO SEES IT. A run nobody reads has no signal capacity (issue 1158). The
  # report goes to the job SUMMARY (the run page), an `::error`/`::notice`
  # annotation naming the price, and a `next-stable-report` artifact with every
  # log. GitHub sends a scheduled workflow's failure notification to whoever last
  # edited its `cron:` line. `gh run list --workflow next-stable.yml` is the
  # history; whoever bumps the pin reads the latest run first, or runs
  # `scripts/ci/next-stable-delta.py` locally (same A/B, same report).

  next-stable:
    if: ${{ github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'next-stable' }}
    concurrency:
      group: weekly-next-stable
      cancel-in-progress: true
    name: next-stable (advisory — gates nothing)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Reclaim disk (two full lint builds, one per toolchain)
        run: scripts/ci/reclaim-disk.sh "before next-stable A/B"

      # The CLI is built under the PIN (rust-toolchain.toml), as every other
      # lane builds it — the candidate is applied per gate, not to the setup.
      - name: Build the in-tree nros CLI
        uses: ./.github/actions/setup-nros-cli

      - name: Provision compile-tier sources
        run: |
          source ./activate.sh
          nros setup \
            --source px4-rs --source zenoh-pico --source mbedtls --source micro-cdr \
            --source micro-xrce-dds-client --source cyclonedds-src

      - name: Measure the next-stable delta
        env:
          CANDIDATE: ${{ inputs.candidate || 'stable' }}
        run: |
          set -uo pipefail
          source ./activate.sh
          rc=0
          python3 scripts/ci/next-stable-delta.py --install \
            --candidate "$CANDIDATE" --out tmp/next-stable || rc=$?
          cat tmp/next-stable/report.md >> "$GITHUB_STEP_SUMMARY" || true
          case "$rc" in
            0) echo "::notice title=next-stable: bump is free::$CANDIDATE raises nothing the pin does not." ;;
            1) echo "::error title=next-stable: bump is priced::$CANDIDATE adds diagnostic sites the pin does not — see the job summary." ;;
            *) echo "::error title=next-stable: no verdict::The A/B could not measure the toolchain (exit $rc) — fix the lane, not the code. See the job summary." ;;
          esac
          exit "$rc"

      - name: Upload logs + report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: next-stable-report
          path: tmp/next-stable/
          if-no-files-found: warn
          retention-days: 30

  # ===== verify-verus (issue 2499) =====
  #
  # The Verus proofs (`just verify-verus`). No lane ran them, so the lane
  # rotted unseen: the crate's rust toolchain and a caret `vstd` drifted from
  # the pinned Verus binary, and `cargo verus verify` panicked inside `vstd`
  # before any nano-ros proof, which let issue 2487's spec change land unproven.
  # `scripts/check-verus-pins.py`, at the head of the recipe, now refuses that
  # drift by name. `just verification verus` downloads the `[tool.verus]` pin
  # and installs the rust toolchain that binary was built with.
  verify-verus:
    if: ${{ github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'verify-verus' }}
    concurrency:
      group: weekly-verify-verus
      cancel-in-progress: true
    name: verify-verus (advisory — gates nothing)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: ghcr.io/newslabntu/nano-ros-ci:humble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout nano-ros
        uses: actions/checkout@v4

      - name: Build the in-tree nros CLI
        uses: ./.github/actions/setup-nros-cli

      # Downloads the `[tool.verus]` pin and installs the rust toolchain that
      # binary was built with.
      - name: Provision Verus
        run: |
          source ./activate.sh
          just verification verus

      - name: Run the Verus proofs
        run: |
          source ./activate.sh
          just verify-verus
