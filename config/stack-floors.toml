[[policy]]
kind = "cut"
match = "4core9panicking"
reason = "the panic path diverges; a panic inside the panic handler is its only cycle"

[[policy]]
kind = "cut"
match = "4core3str16slice_error_fail"
reason = "panic path (slice_error_fail <-> slice_error_fail_rt), diverges"

[[policy]]
kind = "cut"
match = "4core3fmt"
reason = "core::fmt recurses through dyn Write / Display for nested values; its own frames count, its callees do not"

[[policy]]
kind = "cut"
match = "names_and_types"
rmw = "zenoh"
reason = "the graph query; an image that never calls it must not be charged for it at every indirect site. An image that does needs its own allowance (issue 2360)"

[[policy]]
kind = "external"
match = "17compiler_builtins3mem6memcpy"
reason = "compiler_builtins' memcpy as the C lane links it (a per-build crate hash, so by substring); a leaf loop with no bitcode in the inputs"

[[policy]]
kind = "external"
match = "17compiler_builtins3mem6memset"
reason = "compiler_builtins' memset, as memcpy"

[[policy]]
kind = "external"
match = "17compiler_builtins3mem7memmove"
reason = "compiler_builtins' memmove, as memcpy"

[[policy]]
kind = "external"
name = "__aeabi_uldivmod"
reason = "hand assembly in compiler_builtins, no bitcode; a leaf"

[[policy]]
kind = "external"
name = "__aeabi_ldivmod"
reason = "hand assembly in compiler_builtins, no bitcode; a leaf"

[[policy]]
kind = "external"
name = "__aeabi_read_tp"
reason = "hand assembly (TLS pointer read), a leaf"

[[policy]]
kind = "frame"
name = "z_malloc"
bytes = 0
target = "thumbv7em-none-eabi"
reason = "tail call (b.w) in zpico-sys platform_aliases.c, read off the prologue; the cc build gets no -fstack-usage under Zephyr"

[[policy]]
kind = "frame"
name = "z_free"
bytes = 0
target = "thumbv7em-none-eabi"
reason = "tail call (b.w), as z_malloc"

[[policy]]
kind = "frame"
name = "z_random_fill"
bytes = 0
target = "thumbv7em-none-eabi"
reason = "tail call (b.w), as z_malloc"

[[policy]]
kind = "frame"
name = "z_sleep_us"
bytes = 8
target = "thumbv7em-none-eabi"
reason = "push {r3, lr}, read off the prologue, as z_malloc"

[[policy]]
kind = "frame"
name = "z_sleep_ms"
bytes = 8
target = "thumbv7em-none-eabi"
reason = "push {r3, lr}, read off the prologue, as z_malloc"

# The cargo road (issue 2400 W5) links newlib's `libc.a` through the board
# crate (`rustc-link-lib=static=c`), so its members are walked; newlib is
# prebuilt with no -fstack-usage, and the walk reads their frames from the
# linked image's .debug_frame (`--cfi-elf`).

[[policy]]
kind = "cut"
match = "__assert_func"
target = "thumbv7m-none-eabi"
reason = "a failed C assert prints and aborts; the path diverges, as the Rust panic path"

[[policy]]
kind = "frame"
name = "__aeabi_cdcmple"
bytes = 12
target = "thumbv7m-none-eabi"
reason = "libgcc _arm_cmpdf2.o, hand assembly with no CFI: push {r0, lr} (8) and its bl to __nedf2 (str r12, [sp, #-4]!: 4), read off the disassembly; the call is section-internal, so no relocation names it"
