# The five `platform_aliases.c` frames (`z_malloc`, `z_free`, `z_random_fill`,
# `z_sleep_us`, `z_sleep_ms`) were hand-read rows here, keyed by target. They
# retired in phase-557 W9a: the Zephyr lanes now build cc-rs C with
# `-fstack-usage`, so the compiler that built each object states its frame.
# A hand-read frame is a fact about one set of flags, not a target (issue 2460).

# The cargo road (issue 2400 W5) links newlib's `libc.a` through the board
# crate (`rustc-link-lib=static=c`), so its members are walked; newlib is
# prebuilt with no -fstack-usage, and the walk reads their frames from the
# linked image's .debug_frame (`--cfi-elf`).

[[policy]]
kind = "cut"
match = "__assert_func"
target = "thumbv7m-none-eabi"
reason = "a failed C assert prints and aborts; the path diverges, as the Rust panic path"

# libgcc's hand-assembly builtins (`__aeabi_cdcmple`, `__aeabi_dadd`, ...) carry
# no CFI, so their frames come from config/stack-builtins.toml, measured from
# the toolchain's own archive and keyed by its code key (phase-557 W9b).
# `__aeabi_cdcmple` was a hand-read 12 B row here; the recipe measures 12 B.
