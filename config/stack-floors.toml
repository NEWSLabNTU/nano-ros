# Stack-floor inputs a build cannot measure. Issue 2400, schema 2.
#
# Floors are measured EVERY build (ruled 2026-11-10). This table holds no
# floors. A build walks the image's own frames (stable `-C save-temps`
# bitcode through the pinned llc) and computes
#
#   floor = ceil8( (static_now + allowance) * (100 + margin_pct) / 100 )
#
# - [[allowance]], per (image, target, role): a twin's run-time peak minus
#   the static walk measured at the same time. It may be negative. It names
#   issue 2402, which would retire it. An ADDEND, not a max: the static part
#   still moves with every direct frame. An image with no row is unmeasured:
#   its floor is reported with a warning and is never enforced; a consumer
#   (W4's CHECK, strict in CI) refuses only measured images.
# - [[policy]]: the walk's cuts, externals and stated frames, each filtered
#   by optional `rmw` / `target`, and each with a reason.
# - [indirect.<rmw>]: how the static walk charges an indirect call site.
#
# Check offline:
#   python3 scripts/nros-stack-floor.py --validate-table config/stack-floors.toml
# That checks every reason, every allowance's issue, and `bytes = peak - static`.
#
# Roles: OPEN = init + Executor::open + registration (the main/boot task:
# Zephyr CONFIG_MAIN_STACK_SIZE, PX4 STACK_MAIN). SPIN = one executor pass on
# a thread of its own (a tier task, PX4's work queue).

schema = 2
margin_pct = 10
# Counted once: Zephyr's timer `elapsed` <-> `sys_clock_elapsed`, and
# `Arc<ComponentCell>` drop reaching a ctx drop that drops an Arc.
recursion_allowance = 0

[indirect.default]
# A backend with no policy of its own: direct calls only. Its vtable calls are
# what an [[allowance]] row would add. Without one, the build warns that they
# are not counted, or refuses under --strict (issue 2402).
mode = "allowance:0"

[indirect.zenoh]
# Every indirect call is BOUND to the functions it can reach and followed
# (issue 2402): a vtable slot to the functions at that slot, a Rust call to
# the functions of its type, a C call to the functions C can hold whose type
# its clang IR matches (issue 2516). The static walk is then the floor, so a
# measured peak is an [[observed]] row the walk must cover, never an
# allowance added to it. The walk is a HEURISTIC floor, not an upper bound:
# its depth is order-dependent under call cycles, pending an exact search
# (issue 2550); it reports the deepest of 8 fixed callee orders. The fold it replaces
# charged the first indirect call a flat 9,520 B and walked nothing behind it:
# 23,968 B on the mps2 bare-metal talker, whose run overflowed 31 KiB.
mode = "bind"

# Measured peaks are [[observed]] rows (issue 2402). `image` is the key a build
# computes (cmake/NanoRosStackFloor.cmake `_nros_stack_floor_image_key`, key
# (c) ruled 2026-11-12): the image's `[image.<id>] stack_floor_image`, which
# `nros new` writes as `<template>/<lang>/<rmw>@<board>` so a renamed project
# keeps its row, else `<bringup>@<board>`. `--validate-table` refuses a
# template key whose template or board is gone.
#
# Under `bind` the static walk is the floor (a heuristic one, issue 2550), so
# a row adds NOTHING to
# the floor: floor = ceil8(static x (100 + margin) / 100). A row does two jobs.
# It makes its image MEASURED, so a stack below the floor fails the build
# instead of warning. And it is evidence the walk must cover: a static walk
# below `peak` refuses, as a walker defect. `static` is the bind walk the peak
# was checked against; `nros new` stamps the template's stack from it.
# `[observed.shape]` is the derived entity counts the measured image was built
# with. `just zephyr stack-floor-twin` re-measures each peak on the Renode twin
# and fails when the run is above the static walk.
#
# Peaks measured 2026-11-10 on the nucleo-f767zi Renode twin (CONFIG_INIT_STACKS
# + thread analyzer, main-thread peak), re-measured 2026-11-13 by the twin
# lane. Statics walked 2026-11-14 under `bind` on images `nros new` made and
# `nros build` built. Before `bind` these were [[allowance]] rows of +8,476,
# +6,676 and -4,236 B over a fold walk of 21,780, 22,212 and 16,112 B. The
# Rust images are built with LTO (issue 2407); the C talker's lane builds
# nros-relwithdebinfo, with no LTO.
#
# The bind walk is loose where C calls through a pointer: zenoh-pico's sites
# carry no type, so each reaches every function C can hold (issue 2516). That
# is most of the C talker's 123 KB against its 11.9 KB run.

[[observed]]
image = "action-server/rust/zenoh@nucleo-f767zi-zephyr"
rmw = "zenoh"
target = "thumbv7em-none-eabi"
role = "OPEN"
peak = 30256
static = 68608
method = "Renode nucleo-f767zi twin, thread analyzer main-thread peak over 7 rounds, LTO build; static from rust_main"
issue = "2402"

