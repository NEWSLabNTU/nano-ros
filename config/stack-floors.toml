# Stack-floor inputs a build cannot measure. Issue 2400, schema 2.
#
# Floors are measured EVERY build (ruled 2026-11-10). This table holds no
# floors. A build walks the image's own frames (stable `-C save-temps`
# bitcode through the pinned llc) and computes
#
#   floor = ceil8( (static_now + allowance) * (100 + margin_pct) / 100 )
#
# - [[allowance]], per (image, target, role): a twin's run-time peak minus
#   the static walk measured at the same time. It may be negative. It names
#   issue 2402, which would retire it. An ADDEND, not a max: the static part
#   still moves with every direct frame. An image with no row is unmeasured:
#   its floor is reported with a warning and is never enforced; a consumer
#   (W4's CHECK, strict in CI) refuses only measured images.
# - [[policy]]: the walk's cuts, externals and stated frames, each filtered
#   by optional `rmw` / `target`, and each with a reason.
# - [indirect.<rmw>]: how the static walk charges an indirect call site.
#
# Check offline:
#   python3 scripts/nros-stack-floor.py --validate-table config/stack-floors.toml
# That checks every reason, every allowance's issue, and `bytes = peak - static`.
#
# Roles: OPEN = init + Executor::open + registration (the main/boot task:
# Zephyr CONFIG_MAIN_STACK_SIZE, PX4 STACK_MAIN). SPIN = one executor pass on
# a thread of its own (a tier task, PX4's work queue).

schema = 2
margin_pct = 10
# Counted once: Zephyr's timer `elapsed` <-> `sys_clock_elapsed`, and
# `Arc<ComponentCell>` drop reaching a ctx drop that drops an Arc.
recursion_allowance = 0

[indirect.default]
# A backend with no policy of its own: direct calls only. Its vtable calls are
# what an [[allowance]] row would add. Without one, the build warns that they
# are not counted, or refuses under --strict (issue 2402).
mode = "allowance:0"

[indirect.zenoh]
# The RMW vtable's targets are the zenoh shim's trampolines. Folding over
# EVERY address-taken function charges the graph query (19,656 B) at every
# site and over-counts by 57 %. Folding over these under-counts, and the
# allowance below covers the difference (issue 2402).
mode = "fold1"
scope = ["zenoh", "zpico"]

# Allowances are per IMAGE SHAPE (ruled (A), 2026-11-10). `image` is the key a
# build computes (cmake/NanoRosStackFloor.cmake `_nros_stack_floor_image_key`,
# key (c) ruled 2026-11-12): the image's `[image.<id>] stack_floor_image`,
# which `nros new` writes as `<template>/<lang>/<rmw>@<board>` so a renamed
# project keeps its row, else `<bringup>@<board>`. `--validate-table` refuses a
# template key whose template or board is gone. `[allowance.shape]` is the
# derived entity counts the measured image was built with; a build whose counts
# differ is warned that it is not the image that was measured. The static
# walk's indirect charge is wrong in both directions (3-8 KB low on the Rust
# images below, 12.6 KB HIGH on the C talker), so one image's measurement says
# nothing about another's, and an allowance may be negative. An image with no
# row is unmeasured: reported, never enforced.
#
# Measured 2026-11-10 on the nucleo-f767zi Renode twin (CONFIG_INIT_STACKS +
# thread analyzer, main-thread peak over 7 rounds), re-measured after issue
# 2401 (#3481) moved the session-property buffers to the heap. That lowered
# every static walk (C talker -8,200 B, Rust talker -1,008, action server
# -784) and moved no peak, so each allowance rose by its walk's drop. A row
# measured before a frame on its walk changes is stale in the UNSAFE
# direction: the walk falls, the allowance stays, and the floor drops below
# the peak (the C talker's old row gave 3,848 B against an 11,696 B peak).
# `just zephyr stack-floor-twin` re-measures every row here and fails when
# `bytes != peak - static`; its first run (2026-11-13) found the C talker's
# peak 180 B above its row and confirmed both Rust rows exact. The Rust images were
# built with LTO (issue 2407, `cargo rustc --crate-type staticlib`). The C
# talker's lane builds nros-relwithdebinfo, so it has no LTO. The static walk
# uses this table's policy.

[[allowance]]
image = "action-server/rust/zenoh@nucleo-f767zi-zephyr"
rmw = "zenoh"
target = "thumbv7em-none-eabi"
role = "OPEN"
bytes = 8476
issue = "2402"
reason = "calls through the RMW vtable the static walk charges at the deepest scoped target, not at the frame that runs; LTO's inlining merges more of them (2,992 B without LTO, before issue 2401)"

[allowance.measured]
peak = 30256
static = 21780
method = "Renode nucleo-f767zi twin, thread analyzer main-thread peak over 7 rounds, LTO build; static from rust_main"
image = "nros new --board nucleo-f767zi-zephyr --lang rust --rmw zenoh --template action-server"
issue = "2407"

[allowance.shape]
NROS_EXECUTOR_MAX_NODES = 1
NROS_MAX_PUBLISHERS = 2
NROS_MAX_SUBSCRIBERS = 0
NROS_MAX_QUERYABLES = 4
NROS_EXECUTOR_MAX_CBS = 1
NROS_EXECUTOR_ACTION_CLIENTS = 1

[[allowance]]
image = "talker/rust/zenoh@nucleo-f767zi-zephyr"
rmw = "zenoh"
target = "thumbv7em-none-eabi"
role = "OPEN"
bytes = 6676
issue = "2402"
reason = "calls through the RMW vtable the static walk cannot bind to a slot"

[allowance.measured]
peak = 28888
static = 22212
method = "Renode nucleo-f767zi twin, thread analyzer main-thread peak over 6 rounds, LTO build; static from rust_main"
image = "nros new --board nucleo-f767zi-zephyr --lang rust --rmw zenoh --template talker"
issue = "2400"

[allowance.shape]
NROS_EXECUTOR_MAX_NODES = 1
NROS_MAX_PUBLISHERS = 1
NROS_MAX_SUBSCRIBERS = 0
NROS_MAX_QUERYABLES = 0
NROS_EXECUTOR_MAX_CBS = 1
NROS_EXECUTOR_ACTION_CLIENTS = 0

[[allowance]]
image = "talker/c/zenoh@nucleo-f767zi-zephyr"
rmw = "zenoh"
target = "thumbv7em-none-eabi"
role = "OPEN"
bytes = -4236
issue = "2402"
reason = "NEGATIVE: the static walk charges each of 51 indirect sites on the C path 8,392 B (the deepest zenoh-scoped target) while the targets that run are shallow"

[allowance.measured]
peak = 11876
static = 16112
method = "Renode nucleo-f767zi twin, thread analyzer main-thread peak over 14 rounds, nros-relwithdebinfo (no LTO); static from main. Re-measured 2026-11-13 by the twin lane (scripts/stack-floor-twin.py): the peak rose 180 B with the walk unchanged, so the growth is on an indirect path the walk charges, not follows"
image = "nros new --board nucleo-f767zi-zephyr --lang c --rmw zenoh --template talker"
issue = "2400"

[allowance.shape]
NROS_EXECUTOR_MAX_NODES = 1
NROS_MAX_PUBLISHERS = 1
NROS_MAX_SUBSCRIBERS = 0
NROS_MAX_QUERYABLES = 0
NROS_EXECUTOR_MAX_CBS = 1
NROS_EXECUTOR_ACTION_CLIENTS = 0

[[policy]]
kind = "cut"
match = "4core9panicking"
reason = "the panic path diverges; a panic inside the panic handler is its only cycle"

[[policy]]
kind = "cut"
match = "4core3str16slice_error_fail"
reason = "panic path (slice_error_fail <-> slice_error_fail_rt), diverges"

[[policy]]
kind = "cut"
match = "4core3fmt"
reason = "core::fmt recurses through dyn Write / Display for nested values; its own frames count, its callees do not"

[[policy]]
kind = "cut"
match = "names_and_types"
rmw = "zenoh"
reason = "the graph query; an image that never calls it must not be charged for it at every indirect site. An image that does needs its own allowance (issue 2360)"

[[policy]]
kind = "external"
match = "17compiler_builtins3mem6memcpy"
reason = "compiler_builtins' memcpy as the C lane links it (a per-build crate hash, so by substring); a leaf loop with no bitcode in the inputs"

[[policy]]
kind = "external"
match = "17compiler_builtins3mem6memset"
reason = "compiler_builtins' memset, as memcpy"

[[policy]]
kind = "external"
match = "17compiler_builtins3mem7memmove"
reason = "compiler_builtins' memmove, as memcpy"

[[policy]]
kind = "external"
name = "__aeabi_uldivmod"
reason = "hand assembly in compiler_builtins, no bitcode; a leaf"

[[policy]]
kind = "external"
name = "__aeabi_ldivmod"
reason = "hand assembly in compiler_builtins, no bitcode; a leaf"

[[policy]]
kind = "external"
name = "__aeabi_read_tp"
reason = "hand assembly (TLS pointer read), a leaf"

[[policy]]
kind = "frame"
name = "z_malloc"
bytes = 0
target = "thumbv7em-none-eabi"
reason = "tail call (b.w) in zpico-sys platform_aliases.c, read off the prologue; the cc build gets no -fstack-usage under Zephyr"

[[policy]]
kind = "frame"
name = "z_free"
bytes = 0
target = "thumbv7em-none-eabi"
reason = "tail call (b.w), as z_malloc"

[[policy]]
kind = "frame"
name = "z_random_fill"
bytes = 0
target = "thumbv7em-none-eabi"
reason = "tail call (b.w), as z_malloc"

[[policy]]
kind = "frame"
name = "z_sleep_us"
bytes = 8
target = "thumbv7em-none-eabi"
reason = "push {r3, lr}, read off the prologue, as z_malloc"

[[policy]]
kind = "frame"
name = "z_sleep_ms"
bytes = 8
target = "thumbv7em-none-eabi"
reason = "push {r3, lr}, read off the prologue, as z_malloc"
