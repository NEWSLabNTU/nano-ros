# refuses), and `just zephyr stack-floor-drift` fails when the walk leaves
# the band (above max(static, walk_floor), or more than 2 % below static).
# For an image whose stack is deliberately not sized from its walk. Needs
# image, rmw, target, role, static, method and issue; takes walk_floor with
# walk_floor_reason; never peak or shape, which only size a stack.
