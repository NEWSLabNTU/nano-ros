# RFC-0049 / phase-290 — per-platform-package configuration.
#
# Sections: `[capabilities]` (software-stack facts), `[knobs.*]` (typed
# policy defaults; deny_unknown_fields), top-level `arch_profiles` /
# `compile` / `required_env` (what any vendored C build here needs; the
# zenoh-pico port rows are `[port.<platform>]` in nros-rmw-zenoh's
# nros-rmw.toml since phase-349 W2b), `[arch.*]` (reusable compiler-flag
# profiles; may be duplicated across platform files only byte-identically).
# Resolution ladder: builtin < platform (inherits chain) < board < env.
# Schema + loader: nros-board-common/src/platform_config.rs.
# phase-349 W1 / RFC-0072 — the names this platform answers to; the
# directory is just where the file lives. names[0] is canonical.
#
# phase-468 W1 — `esp32` joins the list, and it is not a convenience alias: it
# is the name this file was already answering under a different spelling.
# Four measurements, none of them a reading of intent:
#
#   1. `PlatformKind::Esp32::platform_feature()` returns `platform-bare-metal`
#      (nros-cli-core/src/orchestration/board_descriptor.rs, RFC-0064 R5 D6 /
#      phase-375 W8). Its own doc-comment says so and adds "There is no
#      `config/esp32/`" — the repo had already decided esp32's platform, and
#      then had nowhere to write it down.
#   2. `nros-board-esp32-qemu` depends on `nros-rmw-zenoh` with feature
#      `platform-bare-metal`, which is `["zpico-sys/bare-metal", …]`, which
#      sets `CARGO_FEATURE_BARE_METAL`, which makes `nros-zpico-build`'s own
#      `platform_name` derivation resolve `"bare-metal"`. So the vendored
#      zenoh-pico C build of EVERY esp32 image already reads this file. Only
#      the knob-rung road (`NROS_PLATFORM_NAME`, from the board's
#      `platform = "esp32"`) asked for a name nothing answered.
#   3. `[arch.riscv32imc]` below was written FOR the ESP32-C3 — see the
#      "Phase 148: bare-metal spans cortex-m3 … AND riscv32imc (ESP32-C3)"
#      comment on `arch_profiles` below.
#   4. This file declares NO `[knobs.*]` and NO `[capabilities]`, so the rungs
#      esp32 resolves through it are byte-identical to the builtin defaults it
#      fell through to before. The image does not move; what moves is that the
#      name is ANSWERED and the two roads name ONE descriptor instead of two.
#
# esp32's two real hardware budgets are BOARD facts and already sit at the
# board rung — `[knobs.net] max_udp_sockets` and
# `[knobs.executor] arena_size` in `nros-board-esp32-qemu/nros-board.toml`
# (phase-445 W2/W6). The platform rung has nothing left to add for it.
names = ["bare-metal", "esp32"]

# phase-349 W2b — what this platform needs from ANY C build of a vendored
# component: which `[arch.*]` profiles apply (first `target_match` wins, in
# this order), the compile settings, and the board facts it requires. The
# zenoh-pico port rows that used to sit beside these in `[build.zenoh]` live
# in the zenoh backend's descriptor now: `[port.bare-metal]` in
# packages/rmw/zenoh/nros-rmw-zenoh/nros-rmw.toml ("platforms name no
# backends", RFC-0072 §9).
# Phase 148: bare-metal spans cortex-m3 (mps2-an385-baremetal) AND
# riscv32imc (ESP32-C3). First arch whose `target_match` hits is applied —
# see nros-zpico-build's `platform_arch`.
#
# issue 1154 — `cortex-m4f` (an STM32F4-class Cortex-M4F) was defined here
# and not listed, so a bare-metal `thumbv7em-none-eabihf` build matched no
# profile and compiled zenoh-pico with cc-rs's defaults instead of these
# flags. It is listed now. No in-tree bare-metal image targets thumbv7em, so
# no image moves. A `riscv32gc` profile sat beside it, also unlisted; it was
# deleted rather than listed, because no bare-metal Rust triple is named
# `riscv32gc` (rustc's are `riscv32i…-unknown-none-elf`, none with `d`), and
# its `-mabi=ilp32d` matches none of them — there was no board to keep it for.
arch_profiles = ["cortex-m3", "cortex-m4f", "riscv32imc"]
# Phase 204.9 — size build (`-Os`): zenoh-pico is the biggest vendor C blob
# on embedded; `-Os` saved ~8 KB .text on the bare-metal talker vs `-O2`.
compile = { opt_level = "s", warnings = false, cflags = ["-ffunction-sections", "-fdata-sections"] }

# issue 1037 — a software-stack FACT, and the first `[capabilities]` entry here.
# Every bare-metal port exports `nros_platform_clock_ns` (its Rust `PlatformClock`
# impl, emitted through `nros-platform`'s shims); `nros-c`'s bare-metal arms
# already pull `nros-log/platform-clock` on exactly that premise
# (`check-baremetal-platform-arms`). Knob rungs are unaffected.
[capabilities]
clock = true

[arch.cortex-m3]
target_match = "thumbv7m"
target_exclude = "thumbv7em"
cflags = ["-mcpu=cortex-m3", "-mthumb"]

# The FULL hard-float triple, not `thumbv7em`: `target_match` is a substring
# test, so `thumbv7em` would also claim soft-float `thumbv7em-none-eabi` and
# compile it `-mfloat-abi=hard`. A soft-float thumbv7em build matches no
# profile instead — the FreeRTOS `cortex-m7` profile's rule (its comment has
# the reasoning). A Cortex-M7 bare-metal image (`thumbv7em-none-eabihf` too)
# would take these M4F flags; M7 runs that code, and its fpv5 FPU executes
# fpv4-sp instructions.
[arch.cortex-m4f]
target_match = "thumbv7em-none-eabihf"
cflags = ["-mcpu=cortex-m4", "-mthumb", "-mfpu=fpv4-sp-d16", "-mfloat-abi=hard"]

[arch.riscv32imc]
target_match = "riscv32imc"
cflags = ["-march=rv32imc", "-mabi=ilp32"]
needs_picolibc = true
needs_errno_override = true
needs_riscv_compiler = true

