# GENERATED by `python3 scripts/lib/index_tool.py extract zephyr-sdk zephyr-sdk-1-0-1` from nros-sdk-index.toml.
# Do not edit: change the index row and regenerate (gate `ci-base-tools`).
[tool.zephyr-sdk]
# The Zephyr SDK, host-keyed (issue 0610). `scripts/zephyr/setup.sh` used to
# hardcode the x86_64 tarball AND its sha256, so on any other host it fetched a
# 1.3 GiB archive, PASSED the checksum, and then failed inside the SDK's own
# installer with `Installing host tools ... ERROR: Host tools installation
# failed` — the cross toolchains are host-agnostic, the HOST TOOLS are native
# binaries. Selecting by `dist.<host>` is what this table exists for.
#
# UNLIKE every other `[tool.*]` here, these URLs are UPSTREAM rather than
# repackaged into NEWSLabNTU/nano-ros-sdk. Deliberate: the archive is 1.3 GiB
# and we apply nothing to it, so a repack would cost a release asset per host
# to add zero value. Two consequences to know about — the tarball is `.tar.xz`
# (GNU tar auto-detects it, and the `zstd` preflight in `sdk_store.rs` does not
# apply), and it unpacks to `<prefix>/zephyr-sdk-<version>/` rather than the
# `<prefix>/bin` layout the repacked dists share, which is exactly the path
# `scripts/zephyr/setup.sh` and `ZEPHYR_SDK_INSTALL_DIR` already expect.
#
# Checksums are upstream's, from the release's own `sha256.sum`.
#
# issue 1259 — fetching the archive is NOT all this entry does any more. The
# SDK's own `setup.sh` had "no expression in this schema" and lived in the shell
# script; `post_install` is that expression, so `nros setup --tool zephyr-sdk`
# alone now runs the installer, and the `smoke` probes below make the difference
# between "the bytes arrived" and "a compiler in here runs" a MEASURED one.
version = "0.16.9"
upstream = "v0.16.9" # sdk-ng release tag (SSOT for the URLs below)
# phase-517 W10 — the SDK's own `setup.sh` (`post_install` below) refuses to
# run without `wget` ([prereq.wget] says why). Declared HERE so the plan asks
# for it before the 1.4 GiB fetch rather than after: replaying
# `integration-zephyr.md` on the installed track fetched for 17 minutes and then
# failed the post-install step with exit 91.
system = ["wget"]
# The tarball's own top-level directory. `{version}` keeps it tied to the pin —
# the alternative is a literal that has to be edited in lockstep with the line
# above, which is the drift `scripts/lib/zephyr-sdk.sh` was carrying by hand.
subdir = "zephyr-sdk-{version}"
# issue 1744 — these rows are also the RUN SET `check-dist-runtime-deps` holds
# this UPSTREAM dist to: what nano-ros executes from it (the cross compilers,
# the assembler and linker they drive, and the `dtc` Zephyr's devicetree step
# runs — measured in an mps2/an385 build cache). The rest of the bundle (host
# qemu, gdb-py, the pokysdk sysroot's own tools) is upstream's, with upstream's
# documented host requirements, and gets one NOTE rather than a verdict.
# `dtc` is host-shaped (`sysroots/<arch>-pokysdk-linux/`, and no host tools at
# all on macOS), so its row names the one host it was measured on.
smoke = [
    { run = "arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc --version", expect = "arm-zephyr-eabi-gcc" },
    { run = "arm-zephyr-eabi/bin/arm-zephyr-eabi-as --version", expect = "GNU assembler" },
    { run = "arm-zephyr-eabi/bin/arm-zephyr-eabi-ld --version", expect = "GNU ld" },
    { run = "x86_64-zephyr-elf/bin/x86_64-zephyr-elf-gcc --version", expect = "x86_64-zephyr-elf-gcc" },
    { run = "x86_64-zephyr-elf/bin/x86_64-zephyr-elf-as --version", expect = "GNU assembler" },
    { run = "x86_64-zephyr-elf/bin/x86_64-zephyr-elf-ld --version", expect = "GNU ld" },
    { run = "sysroots/x86_64-pokysdk-linux/usr/bin/dtc --version", expect = "DTC", hosts = ["linux-x86_64"] },
]
# MEASURED, and the `-t` and the `-h` do very different amounts of work here.
# 0.16.x ships every toolchain INSIDE the 1.3 GiB bundle, and its `setup.sh -t`
# loop is a `[ -d "${toolchain}" ] && continue` over directories the unpack
# already created — so the two `-t` arguments are a NO-OP on this entry and are
# kept only so both SDK rows state one command. `-h` is the live half: it runs
# the bundled `zephyr-sdk-x86_64-hosttools-standalone-0.9.sh`, which is what
# puts `sysroots/` and `environment-setup-*` in the SDK, and which nothing on
# the `nros setup --tool zephyr-sdk` road ran before this. Measured on
# linux-x86_64: 1,445 MB fetched, 7.8 GB after the step.
#
# The `smoke` probes are therefore the important half of this row rather than
# `post_install`: a 0.16.8 prefix could always report success and never be asked
# whether one compiler in it runs.
#
# NO `-c`. That writes `~/.cmake/packages/Zephyr-sdk/<hash>`, which is per-USER
# state OUTSIDE the prefix: `nros store gc` cannot reclaim it, a second clone's
# SDK ends up in the same registry, and `find_package(Zephyr-sdk)` then picks
# whichever of five it likes — a silent version substitution of exactly the kind
# `nros sdk-path` exists to prevent (issue 0625). Consumers export
# `ZEPHYR_SDK_INSTALL_DIR` from `nros sdk-path zephyr-sdk` instead;
# `scripts/zephyr/ensure-sdk-registered.sh` still registers for the callers that
# want the registry (issue 1279), and that is its decision to make, not ours.
post_install.run = "./setup.sh -t arm-zephyr-eabi -t x86_64-zephyr-elf -h"
post_install.why = "running the SDK's own setup.sh: install the host tools (the toolchains are already in this bundle)"
dist.linux-x86_64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.9/zephyr-sdk-0.16.9_linux-x86_64.tar.xz", sha256 = "9b4b96f8df594801a84fce1aa112a84cdfcd430efc2a74229907b6421fb859a8", floor = { glibc = "2.27", glibcxx = "3.4.21" } }
dist.linux-arm64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.9/zephyr-sdk-0.16.9_linux-aarch64.tar.xz", sha256 = "a8c1731ad602553304e539a7ade9cdb34caabc1850d581585cbba0372a7493b2", floor = { glibc = "2.27", glibcxx = "3.4.21" } }
dist.macos-arm64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.9/zephyr-sdk-0.16.9_macos-aarch64.tar.xz", sha256 = "82e1851797cd70b18cb2e252fb303ddb5deb1044ca02af9840e6c7e872b178e5", floor = { macos = "14.0" } }
dist.macos-x86_64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.9/zephyr-sdk-0.16.9_macos-x86_64.tar.xz", sha256 = "436eb123068cc8cd4bd6eed7596bf3046182360126ba8a268098cfc729917dce", floor = { macos = "14.0" } }

[tool.zephyr-sdk-1-0-1]
# The Zephyr SDK for the 4.4 ROLLING line. A second entry rather than a version
# bump on `[tool.zephyr-sdk]`, because the two Zephyr lines need DIFFERENT SDKs
# at the same time: `zephyr/SDK_VERSION` in 3.7 demands 0.16.9 and in 4.4
# demands 1.0.1, and `FindZephyr-sdk.cmake` refuses anything older than the
# tree asks for. `scripts/zephyr/setup.sh` selects the entry by $MANIFEST.
#
# Until this existed, `NROS_ZEPHYR_VERSION=4.4 just zephyr setup` exited 0 and
# produced a workspace that could not build ANY Cortex-M target: the manifest
# and the patch set were line-dispatched, the SDK was not. The failure surfaced
# only at the first `west build`, as a bare `FindZephyr-sdk.cmake:160
# find_package` error naming neither the SDK version nor the step that chose
# it. Found bringing up mr_canhubk3 (S32K344, Cortex-M7).
#
# TWO DIFFERENCES FROM THE 0.16.x ENTRY, both consequences of upstream's 1.0.x
# repackaging, and both fine for the flow `install_sdk` already runs:
#
#  * These are the `_minimal` archives (~70 MiB, not 1.3 GiB). 1.0.x ships the
#    toolchains as SEPARATE downloads, which the SDK's own `setup.sh -t <target>`
#    fetches on demand — the same command this repo already invokes to register
#    them. So the split costs nothing here and saves the bandwidth of every
#    toolchain we do not use.
#
#    "Costs nothing HERE" was true only of the `just zephyr setup` road, and
#    issue 1259 is what it cost everywhere else: `nros setup --tool
#    zephyr-sdk-1-0-1` exited 0 over 68 MB holding `{cmake, hosttools,
#    sdk_gnu_toolchains, sdk_version, setup.sh}` and no `gnu/` at all, and the
#    first `west build` for any Cortex-M board failed inside
#    `FindZephyr-sdk.cmake` naming neither the missing toolchain nor the step
#    that should have fetched it. `post_install` below is that step.
#  * There is NO macos-x86_64: upstream ships only aarch64 for macOS at 1.0.x.
#    An Intel Mac on the 4.4 line has no dist and `nros setup` will say so,
#    which is the honest outcome rather than a silent wrong-host fetch (the
#    failure mode issue 0610 was about).
#
# Checksums are upstream's own, from the release's `sha256.sum`; the
# linux-x86_64 one was additionally verified against a local download.
version = "1.0.1"
upstream = "v1.0.1" # sdk-ng release tag (SSOT for the URLs below)
subdir = "zephyr-sdk-{version}"
# 1.0.x moved the toolchains under `gnu/` — the 0.16.x entry's probes are at the
# bundle root. Two layouts, two sets of probes, and `subdir` is why neither has
# to restate the version.
# issue 1744 — the RUN SET, as on [tool.zephyr-sdk]; the `dtc` path differs
# too: 1.0.x unpacks the host tools under `hosttools/`.
smoke = [
    { run = "gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc --version", expect = "arm-zephyr-eabi-gcc" },
    { run = "gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-as --version", expect = "GNU assembler" },
    { run = "gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-ld --version", expect = "GNU ld" },
    { run = "gnu/x86_64-zephyr-elf/bin/x86_64-zephyr-elf-gcc --version", expect = "x86_64-zephyr-elf-gcc" },
    { run = "gnu/x86_64-zephyr-elf/bin/x86_64-zephyr-elf-as --version", expect = "GNU assembler" },
    { run = "gnu/x86_64-zephyr-elf/bin/x86_64-zephyr-elf-ld --version", expect = "GNU ld" },
    { run = "hosttools/sysroots/x86_64-pokysdk-linux/usr/bin/dtc --version", expect = "DTC", hosts = ["linux-x86_64"] },
]
# THE fix for issue 1259: the `_minimal` bundle is designed to be completed by
# this command, which DOWNLOADS each named toolchain (~1 GiB per pair here). It
# is idempotent — upstream's loop skips a toolchain whose `gnu/<name>` directory
# already exists — and the completion is recorded in `.nros-provenance`, so a
# second `nros setup` runs nothing and a run interrupted mid-fetch resumes here
# rather than re-downloading the bundle.
#
# Same target list and same `-h`/no-`-c` reasoning as [tool.zephyr-sdk] above.
post_install.run = "./setup.sh -t arm-zephyr-eabi -t x86_64-zephyr-elf -h"
post_install.why = "running the SDK's own setup.sh: fetch the arm-zephyr-eabi + x86_64-zephyr-elf toolchains the _minimal bundle omits, and install host tools (~1 GiB, several minutes)"
dist.linux-x86_64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-x86_64_minimal.tar.xz", sha256 = "ca9bc0ff66fafca1dac9d592a36d953cf16d096a9d09b1c0357f021cf9f6a7eb", floor = { none = "its only binaries are the hosttools installer's Yocto sysroot, and all 109 ELF run on that sysroot's own ld.so + glibc (measured from the .sh payload); the toolchains setup.sh fetches later are not this artifact" } }
dist.linux-arm64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-aarch64_minimal.tar.xz", sha256 = "d79c5bfc68e679488659bea289a4026e52a64f03338875c8c9c850fff13cee30", floor = { none = "its only binaries are the hosttools installer's Yocto sysroot, and all 108 ELF run on that sysroot's own ld.so + glibc (measured from the .sh payload); the toolchains setup.sh fetches later are not this artifact" } }
dist.macos-arm64 = { url = "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_macos-aarch64_minimal.tar.xz", sha256 = "867063901f39528a6175a80ebc20367bd6cb440593e7e2650eda30392f1f6b65", floor = { macos = "14.0" } }
