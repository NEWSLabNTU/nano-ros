# nano-ros SDK package index (Phase 187).
#
# `nros setup <board>` reads this to fetch prebuilt host toolchains/tools, or
# build them from the `[tool.*.source]` recipe into the same prefix. Prebuilt
# `dist` assets are hosted on NEWSLabNTU/nano-ros-sdk Releases:
#   tag = <tool>-<version>,  asset = <tool>-<host>.tar.zst  (+ .sha256)
#
# Version is the SSOT. `dist.<host>.{url,sha256}` are filled by seeding the
# nano-ros-sdk build workflow (workflow_dispatch) + verified by the
# `sdk-index-gate` CI on any change here. Until an asset is seeded, leave its
# `dist.<host>` out — `nros setup` falls back to the `[tool.*.source]` recipe.
#
# host keys: linux-x86_64 · linux-arm64 · macos-arm64  (matches sdk_index::host_key)

# --- the repo's own build-stage source union (issue 0390) ---
# The `[source.*]` names `just test` (links every RMW's `-sys`) and
# `just build-test-fixtures` (resolves component graphs that path-dep platform
# sources even for a native component) need present, regardless of which board
# or rmw was provisioned. `nros setup --build-sources` provisions them all;
# `nros setup --build-sources --check` is the preflight the two recipes run.
# Curated from what the ROOT workspace + metadata refresh actually touch on the
# host — NOT the cross-only trees (freertos/threadx/nuttx kernels, px4-autopilot,
# rosidl), which only a target build for that board pulls in.
build_sources = [
    "zenoh-pico",             # zpico-sys build.rs (root member)
    "mbedtls",                # zpico-sys TLS build (root member)
    "cyclonedds-src",         # cyclonedds-sys build.rs (root member)
    "micro-xrce-dds-client",  # nros-rmw-xrce-cffi build.rs (root member)
    "micro-cdr",              # nros-rmw-xrce-cffi build.rs (root member)
    "px4-rs",                 # px4-sitl-tests is a root cargo path-dep — the
                              # workspace cannot even LOAD without it
    "nuttx-libc",             # build-test-fixtures metadata refresh path-deps it
]

# --- prebuilt host tools (target-agnostic) ---

# The `nros` CLI is NOT an index tool. It lives in-tree at `packages/cli/`
# and is built from source per checkout (`scripts/bootstrap.sh`, or the
# internal alias `just setup-cli`) — nano-ros is a source distribution
# (phase-288 D1/D2). The pre-288 `[tool.nros]` entry pointed at the ARCHIVED
# standalone `NEWSLabNTU/nros-cli` repo's 0.3.6 binaries — 15 releases stale
# and ABI-mismatched with the checkout; installing it via
# `nros setup --tool nros` was a footgun and the entry is removed.

# nros2: rebuilt with --enable-slirp (nano-ros QEMU tests use -netdev user;
# nros1 lacked slirp and couldn't network).
[tool.qemu]
version = "11.0.0-nros2"
# phase-327 W4 (issue 0368 F3): the dist links libslirp.so.0 dynamically;
# stock Ubuntu does not ship it. Re-cut with an $ORIGIN rpath bundle as
# -nros3 to drop this. Declared so setup/doctor can say so BEFORE the smoke
# check fails with a bare loader error.
system = ["libslirp"]
upstream = "nano-ros-v11.0.0-patches" # exact upstream rev/branch (SSOT for build-tool.yml)
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/qemu-11.0.0-nros2/qemu-linux-x86_64.tar.zst", sha256 = "a1cb9df6f41070d43042c2455e23823431226e9274c67435eafcbc9cddb1166e" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/qemu-11.0.0-nros2/qemu-linux-arm64.tar.zst", sha256 = "33d243e541d2415ceccae65a5e7d7c0aa22c85eeff00c516462f90e4edb4b181" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/qemu-11.0.0-nros2/qemu-macos-arm64.tar.zst", sha256 = "daedfbe7af61a91bb746cb911dcc5b88a486fd255b23a3e1e00e58523994fb2d" }
[tool.qemu.source]
git = "https://github.com/NEWSLabNTU/qemu"
ref = "nano-ros-v11.0.0-patches" # patched fork branch (no tags upstream)
configure = "./configure --prefix={prefix} --target-list=arm-softmmu,riscv64-softmmu --enable-slirp --disable-docs --disable-tools --disable-gtk --disable-vnc --disable-sdl --disable-spice"
install = "make -j$(nproc) && make install"

[tool.arm-none-eabi-gcc]
version = "13.2-nros1"
upstream = "13.2.rel1" # ARM release id (SSOT — build script no longer hand-derives)
# Repackaged from ARM's release; no in-repo source build (binary toolchain).
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/arm-none-eabi-gcc-13.2-nros1/arm-none-eabi-gcc-linux-x86_64.tar.zst", sha256 = "2d913ea50094cefc29a85bf18dddcbf8854b7a2ec9ca892e89f2f25ba06b32da" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/arm-none-eabi-gcc-13.2-nros1/arm-none-eabi-gcc-linux-arm64.tar.zst", sha256 = "93da429c4a93d0c99a8a16b8cdbb979ef8717c1f8b39fcf3cae4a601d426db6e" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/arm-none-eabi-gcc-13.2-nros1/arm-none-eabi-gcc-macos-arm64.tar.zst", sha256 = "d1a2311ff7590e6370be8df34e6dea3d572df83aa95672eb484026f2fd4b6748" }

[tool.riscv-none-elf-gcc]
version = "14.2-nros1"
upstream = "14.2.0-3" # xPack build (SSOT — was hardcoded only in the build script)
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/riscv-none-elf-gcc-14.2-nros1/riscv-none-elf-gcc-linux-x86_64.tar.zst", sha256 = "0f7a938cf5724c6c4ac48af140ede038015d63df1a6460f671d1215fff5ba622" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/riscv-none-elf-gcc-14.2-nros1/riscv-none-elf-gcc-linux-arm64.tar.zst", sha256 = "8eba3c6e8e9dd51ae0583146209100a5e09a670649f1ed0840c26608caa32095" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/riscv-none-elf-gcc-14.2-nros1/riscv-none-elf-gcc-macos-arm64.tar.zst", sha256 = "eb9cd46e48e2196fb13d09112a655b3b926ff18a2350eb7ae79336205165b954" }

# nros2 (#189): built WITH `zenoh/transport_serial` — the nros1 binaries
# refuse `--listen serial/...` ("Unicast not supported for serial protocol")
# and exit, killing the serial e2e lanes. The legacy in-tree build always
# enabled the feature; the phase-187 migration dropped it. `dist.<host>` rows
# return once the nano-ros-sdk repo seeds zenohd-1.7.2-nros2 assets
# (ci/nano-ros-sdk/scripts/build-zenohd.sh carries the same flag); until
# then every host source-builds via the recipe below.
# zenohd — SOURCE-ONLY, and the one that matters most for a first-time user:
# zenoh is the DEFAULT rmw, so `nros setup native` (the book's headline board)
# takes the source recipe below. The other two RMW daemons DO ship prebuilts
# (`[tool.cyclonedds]`, `[tool.xrce-agent]`), which is why this reads as a
# surprise rather than as the norm.
#
# `dist.<host>` is left out until a prebuilt asset is seeded on
# NEWSLabNTU/nano-ros-sdk — same state as `[tool.sccache]` below, and the same
# remedy. The rebuild carries `--features zenoh/transport_serial`, so an
# upstream zenohd release cannot be used as the asset unmodified.
#
# Issue 0374 / phase-355 W1: the book used to promise prebuilts without
# qualification. It now points at `--dry-run` for the per-host answer rather
# than enumerating, so seeding an asset here needs no doc edit.
[tool.zenohd]
version = "1.7.2-nros2"
upstream = "1.7.2" # = source.ref
[tool.zenohd.source]
git = "https://github.com/eclipse-zenoh/zenoh"
ref = "1.7.2"
install = "cargo install --path zenohd --root {prefix} --locked --features zenoh/transport_serial"

# sccache — shared compiler cache (issue #74). The justfile already wires
# `RUSTC_WRAPPER := sccache` (and the zephyr fixture build uses it as a CMake
# COMPILER_LAUNCHER) when it is on PATH, so provisioning it halves clean / CI
# rebuilds (measured ~46% host, ~22% embedded — docs/development/build-ux-audit.md).
# Source-only for now: `dist.<host>` is left out until a prebuilt asset is seeded
# on NEWSLabNTU/nano-ros-sdk, so `nros setup --tool sccache` falls back to the
# source recipe (`cargo install sccache`).
[tool.sccache]
version = "0.8.2-nros1"
upstream = "0.8.2" # = source.ref (mozilla/sccache release tag, without the `v`)
[tool.sccache.source]
git = "https://github.com/mozilla/sccache"
ref = "v0.8.2"
# vendored-openssl: the default features pull openssl-sys, which hard-fails
# on any host without libssl-dev (observed 2026-08-03; the RFC-0062 class —
# an undeclared system dep). Vendoring removes the system dep entirely.
install = "cargo install --path . --root {prefix} --locked --features vendored-openssl"

[tool.openocd]
version = "0.12.0-nros1"
upstream = "v0.12.0" # upstream tag (SSOT — build script no longer hand-derives)
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/openocd-0.12.0-nros1/openocd-linux-x86_64.tar.zst", sha256 = "f21e7be90a71c354251956ce43b30520e116de9ceab57ac70d521eccd99809ca" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/openocd-0.12.0-nros1/openocd-linux-arm64.tar.zst", sha256 = "39ed5882df9f20ca2dda18a850418441dcbb17a2f39071dae587d40f0a590987" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/openocd-0.12.0-nros1/openocd-macos-arm64.tar.zst", sha256 = "1777ad02eeb1b7702d61a53b72496a00bea4aad18d3415f1e4cf82172f974909" }

# Micro-XRCE-DDS Agent — the host daemon the XRCE-DDS RMW connects to (the
# counterpart to zenohd for the rmw-xrce path). Source build is a CMake
# superbuild (pulls Fast-DDS/Fast-CDR), so prefer the prebuilt once seeded.
[tool.xrce-agent]
version = "2.4.3-nros1"
upstream = "v2.4.3" # = source.ref (eProsima release tag)
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/xrce-agent-2.4.3-nros1/xrce-agent-linux-x86_64.tar.zst", sha256 = "61c2e7786ffdbc3ea7f19882f12fb9dd3c28756c6dafd6ec459c9fa86de9438f" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/xrce-agent-2.4.3-nros1/xrce-agent-linux-arm64.tar.zst", sha256 = "29c6d7db3147bd9b0fac7d76ece23d90fa22907a7a556b88c3c2f9d6b8ba0344" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/xrce-agent-2.4.3-nros1/xrce-agent-macos-arm64.tar.zst", sha256 = "08133ec56db8fb5c0d80cfb5c99b5dea52e8b1af5932a5057fd153c1cb896e96" }
[tool.xrce-agent.source]
git = "https://github.com/eProsima/Micro-XRCE-DDS-Agent"
ref = "v2.4.3"
configure = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUAGENT_BUILD_EXECUTABLE=ON -DUAGENT_P2P_PROFILE=OFF -DUAGENT_LOGGER_PROFILE=OFF -DUAGENT_SOCKETCAN_PROFILE=OFF"
# Superbuild: no top-level `install` target + the binary's RUNPATH is absolute,
# so build then assemble a relocatable prefix (real binary + bundled libs + a
# wrapper that points LD/DYLD_LIBRARY_PATH at ../lib). Mirrors
# nano-ros-sdk/scripts/build-xrce-agent.sh.
install = '''cmake --build build --parallel $(nproc) && mkdir -p {prefix}/bin {prefix}/lib && cp -a build/MicroXRCEAgent {prefix}/lib/MicroXRCEAgent.real && find build -maxdepth 1 \( -name 'libmicroxrcedds_agent.so*' -o -name 'libmicroxrcedds_agent*.dylib' \) -exec cp -a {} {prefix}/lib/ \; && find build/temp_install \( -name 'libfastrtps*.so*' -o -name 'libfastrtps*.dylib' -o -name 'libfastcdr*.so*' -o -name 'libfastcdr*.dylib' \) -exec cp -a {} {prefix}/lib/ \; && printf '#!/bin/sh\nh="$(cd "$(dirname "$0")" && pwd)"\nLD_LIBRARY_PATH="$h/../lib:$LD_LIBRARY_PATH" DYLD_LIBRARY_PATH="$h/../lib:$DYLD_LIBRARY_PATH" exec "$h/../lib/MicroXRCEAgent.real" "$@"\n' > {prefix}/bin/MicroXRCEAgent && chmod +x {prefix}/bin/MicroXRCEAgent'''

# Cyclone DDS host tools — `idlc` (descriptor codegen) + `libddsc` for the
# rmw-cyclonedds path (native + the embedded cross-ddsc base). Built from the
# NEWSLabNTU fork's `nano-ros` integration branch, pinned to the submodule sha.
[tool.cyclonedds]
version = "0.10.5-nros1"
upstream = "12b4af2c5ac98657d42df84a5a45006ceede503b" # fork sha = submodule pointer
dist.linux-x86_64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/cyclonedds-0.10.5-nros1/cyclonedds-linux-x86_64.tar.zst", sha256 = "ed8a51eac91a884f39bfff4fe824923e5edf1f9dadb4a941c99a9f080c7217d3" }
dist.linux-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/cyclonedds-0.10.5-nros1/cyclonedds-linux-arm64.tar.zst", sha256 = "4c224398115bd45e14b37d6c8de7e94f4aed6f46da762f517654221327c51d5e" }
dist.macos-arm64 = { url = "https://github.com/NEWSLabNTU/nano-ros-sdk/releases/download/cyclonedds-0.10.5-nros1/cyclonedds-macos-arm64.tar.zst", sha256 = "f13c0dab71aa953c72aa5e5b4d7d8022a48de1670ccf28b103920ec06f1c3715" }
[tool.cyclonedds.source]
git = "https://github.com/NEWSLabNTU/cyclonedds"
ref = "12b4af2c5ac98657d42df84a5a45006ceede503b"
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX={prefix} -DCMAKE_BUILD_TYPE=Release -DBUILD_IDLC=ON -DBUILD_TESTING=OFF -DBUILD_DDSPERF=OFF"
install = "cmake --build build --parallel $(nproc) --target install"

# play_launch_parser — the launch-graph parser the `nros plan` /
# `nros codegen-system` resolver shells out to when synthesising or
# multi-resolving `<pkg>/launch/*.launch.xml` (Phase 212.L.6). The
# resolver builds the XML body (synth-from-Component-pkg OR pkg-named
# vs system.launch.xml precedence) in-memory and pipes it through this
# binary to get the `record.json` the planner consumes. Without it the
# Phase 212 L.6 gate tests (`phase212_l6_launch_synth::*`) skip clean;
# with it they transition SKIP -> PASS, closing the §Acceptance
# "Launch file synthesis works" + "Multi-launch resolution works"
# bullets.
#
# Source-build only — the upstream `jerry73204/play_launch_parser` repo
# is a Rust workspace (no PyPI package, no prebuilt release tags), so
# install via `cargo install --path crates/play_launch_parser` (same
# shape as `[tool.nros]` / `[tool.zenohd]`). Pinned to a SHA on `main`
# (no upstream tags yet) — same convention the `[tool.cyclonedds]` row
# uses to pin a SHA on the NEWSLabNTU fork's `nano-ros` branch. The
# cmd-line surface the L.6 resolver requires (`play_launch_parser --help`,
# the `launch <pkg> <file>` subcommand) has been stable across the
# pinned `main` window, but bumping the SHA is the explicit signal to
# re-run the L.6 gate tests.
#
# Build-time prereq: a Python dev install (pyo3 `auto-initialize` links
# libpythonX.Y at build time). On the default-tier host that's already
# present (apt `python3`/`python3-dev` covered by `just workspace
# apt-packages`); on bare-bones CI it would be the one extra apt
# package, but neither tier moves a module without docs + orchestrator
# updates so this stays implicit (the `workspace` module is the
# umbrella). Header/binary-only install at well under the 500 MB /
# 5 min `default` tier policy in `docs/development/sdk-tiers.md`,
# idempotent (the `just workspace install-play-launch-parser` recipe
# gates on a `.installed-version` stamp).
[tool.play_launch_parser]
version = "0.1.0-nros1"
upstream = "098ccb43328bca3c35320bb3adac27a11035b15d" # = source.ref (main SHA, no upstream tags)
[tool.play_launch_parser.source]
git = "https://github.com/jerry73204/play_launch_parser"
ref = "098ccb43328bca3c35320bb3adac27a11035b15d"
install = "cargo install --path crates/play_launch_parser --root {prefix} --locked"

# Corrosion — the CMake ↔ Rust/Cargo bridge that `corrosion_import_crate()`
# in mixed-language workspaces (Phase 212 — `cmake/NanoRosThreadxSystemCodegen.cmake`,
# `multi_pkg_workspace_mixed` fixture, examples/native/rust talker/listener
# CycloneDDS path) depends on. Header/config-only at install time: a small
# CMake superproject staged into `~/.nros/sdk/corrosion/share/corrosion/`
# (well under the 500 MB / 5 min `default` tier policy in
# `docs/development/sdk-tiers.md`, idempotent — `just workspace install-corrosion`
# already gates on a `.installed-version` stamp). Source-built only — upstream
# `corrosion-rs/corrosion` releases ship source tarballs, not prebuilt binaries
# we mirror, so no `dist.<host>` rows. Pinned to the same `v0.6.1` tag the
# `just workspace install-corrosion` recipe uses, so a `nros setup --tool corrosion`
# and a `just workspace install-corrosion` land the same Corrosion version at the
# same prefix. The Phase 212 `cmake_mixed_corrosion_bridge_builds` test (and the
# `just workspace doctor` check) both expect `~/.nros/sdk/corrosion/`.
[tool.corrosion]
# issue 0493 — bumped v0.5.1 -> v0.6.1 on 2026-08-10. This is ADOPTING AN
# UPSTREAM FIX, not an experiment: read from the two installed sources,
# v0.5.1's Corrosion.cmake:751 sets the cargo target dir to a CONSTANT
# `${CMAKE_BINARY_DIR}/${build_dir}/cargo/build`, so two workspace roots
# configured into one binary dir share one `deps/` and their `#[no_mangle]`
# exports collide at link. v0.6.1:781-784 hashes the workspace manifest path
# into the directory name (`SHA1`, first 5 chars), which cannot collide.
#
# v0.6.1 is ALREADY exercised on every workspace/fixture build here — those
# configures miss the SDK prefix and fall through to FetchContent v0.6.1. So the
# bump makes the SUPPORTED path match the one already proven green, rather than
# introducing an untested version.
version = "0.6.1-nros1"
upstream = "v0.6.1" # = source.ref (corrosion-rs/corrosion release tag)
[tool.corrosion.source]
git = "https://github.com/corrosion-rs/corrosion"
ref = "v0.6.1"
configure = "cmake -S . -B build -DCMAKE_INSTALL_PREFIX={prefix} -DCMAKE_BUILD_TYPE=Release -DCORROSION_BUILD_TESTS=OFF"
install = "cmake --build build --parallel $(nproc) --target install"

# Phase 197.3 — Espressif's QEMU fork (provides the `esp32c3` machine the ESP32
# emulator tests need; stock qemu-system-riscv32 only knows `virt`). Source-built
# only (not hosted) — `just esp32 setup` → `nros setup --tool esp32-qemu`.
[tool.esp32-qemu]
version = "esp-develop-nros1"
# Source-built (no dist): these are BUILD deps of qemu's meson configure —
# found undeclared when the configure died on glib-2.0 (phase-327 W4 applied
# to source recipes; probed BEFORE the build so the failure names packages).
system = ["libglib2-dev", "libpixman-dev", "libgcrypt-dev"]
upstream = "esp-develop"
[tool.esp32-qemu.source]
git = "https://github.com/espressif/qemu"
# A tag, not a bare SHA: nros's source-build clones by ref (git clone --branch),
# which needs a branch/tag. esp-develop line provides the `esp32c3` machine.
ref = "esp-develop-9.2.2-20260417"
# `--disable-werror` — this fork is pinned to the esp-develop 9.2.2 line, and
# QEMU builds -Werror by default, so any compiler NEWER than the fork fails on
# warnings in upstream's own code rather than on anything we did. Observed with
# gcc 16.1.1: `util/log.c:188` takes `char *pidstr = strstr(filename, "%")`,
# which newer headers type as `const char *` →
# `-Werror=discarded-qualifiers`, 643 objects into a 2670-object build. Pinning
# the source and not the compiler makes this inevitable on a rolling host; the
# alternative (patching upstream C in a vendored fork we do not maintain) is
# strictly worse. `[tool.qemu]` does not need it — it is 11.0.0 and normally
# arrives as a prebuilt `dist`.
configure = "./configure --target-list=riscv32-softmmu --prefix={prefix} --enable-gcrypt --enable-slirp --disable-werror --disable-strip --disable-user --disable-capstone --disable-vnc --disable-gtk --disable-sdl --disable-docs"
install = "ninja -C build -j$(nproc) && ninja -C build install"

# issue 0486 — espflash packs an ELF into the ESP32 flash image the QEMU runner
# and the e2e tests actually boot (`espflash save-image --merge`). It was
# documented in prose only (`docs/guides/esp32-setup.md`) and reachable solely by
# a hand-run `cargo install`, so a host that completed `just esp32 setup` still
# produced NO flash images — the pack step warned and the lane exited 0. That is
# issue 0399's shape one dependency over: 0399 declared `riscv-none-elf-gcc`
# because a documented-provisioned host could not COMPILE the example; this is
# the same claim about the PACK step.
#
# Source-built and pinned like every other cargo tool here (`[tool.sccache]`,
# `[tool.play_launch_parser]`) rather than a bare `cargo install espflash`, which
# would resolve against crates.io at whatever version is current that day — the
# drift the pinning convention and the project-wide `--locked` shim exist to
# prevent. The binary lives in the `espflash/` subdir of the workspace
# (`cargo-espflash/` is the separate cargo-subcommand front end and is not
# wanted here).
#
# NO `system = [...]`: verified by building it on a clean host 2026-08-10 —
# `serialport v4.9.0` compiles with no libudev dev package present, so the
# historical libudev requirement no longer applies. Probed rather than assumed,
# because an undeclared system dep is the RFC-0062 class that `[tool.sccache]`
# carries `--features vendored-openssl` to avoid.
[tool.espflash]
version = "4.5.0-nros1"
upstream = "v4.5.0" # = source.ref (esp-rs/espflash release tag)
[tool.espflash.source]
git = "https://github.com/esp-rs/espflash"
ref = "v4.5.0"
install = "cargo install --path espflash --root {prefix} --locked"

# 194.3c — genromfs: the NuttX rv-virt board's src/Makefile unconditionally bakes
# an etc/ ROMFS (RCSRCS = etc/init.d/{rc.sysinit,rcS}) via `genromfs`, so any
# rv-virt `make export` needs it on PATH. The qemu-armv7a board has no RCSRCS, so
# arm doesn't. Source-built (tiny single-file C tool; not apt — keeps "everything
# via nros setup"). Installs to {prefix}/bin/genromfs; activate puts the SDK-store
# bins on PATH. Only the qemu-riscv-nuttx board lists it.
[tool.genromfs]
version = "0.5.7-nros1"
upstream = "0.5.7"
[tool.genromfs.source]
git = "https://github.com/chexum/genromfs"
ref = "0.5.7"
configure = "make genromfs"
install = "install -D -m 0755 genromfs {prefix}/bin/genromfs"

# --- source packages (built with the app for the user's target) ---
#
# Phase 195.B — data-driven provisioning. Each source is a committed submodule,
# so `nros setup` runs `git submodule update --init <submodule>` into `dest`;
# `git`/`ref` record the canonical pin (SSOT — kept in lockstep with
# `.gitmodules` + the recorded gitlink, so the two can't drift). `dest` is
# workspace-relative — never a path baked into the `nros` binary.

[source.freertos-kernel]
version = "10.6.2"
git = "https://github.com/FreeRTOS/FreeRTOS-Kernel.git"
ref = "0adc196d4bd52a2d91102b525b0aafc1e14a2386"
dest = "third-party/freertos/kernel"
submodule = "third-party/freertos/kernel"

[source.lwip]
version = "2.2.0"
git = "https://github.com/jerry73204/lwip.git"
ref = "6233eb61c89b531fd5aaa16acdd6bc5c6368dfdd"
dest = "third-party/freertos/lwip"
submodule = "third-party/freertos/lwip"

[source.threadx]
version = "6.4.1"
git = "https://github.com/eclipse-threadx/threadx.git"
ref = "4b6e8100d932a3a67b34c6eb17f84f3bffb9e2ae"
dest = "third-party/threadx/kernel"
submodule = "third-party/threadx/kernel"

[source.zenoh-pico]
version = "1.7.2"
git = "https://github.com/jerry73204/zenoh-pico.git"
ref = "f68feb77fbe48c2443957fd18639705808a31848"
dest = "packages/rmw/zenoh/zpico-sys/zenoh-pico"
submodule = "packages/rmw/zenoh/zpico-sys/zenoh-pico"

# NuttX Rust libc fork — the qemu-arm-nuttx examples path-dep it via their
# .cargo/config (`libc = { path = third-party/nuttx/libc }`), so it must be
# provisioned by `nros setup qemu-arm-nuttx`, not hand-checked-out by the user.
[source.nuttx-libc]
version = "0.2-nuttx"
git = "https://github.com/jerry73204/libc.git"
ref = "10d142a8007b6b3534f893d8aa89f74f8d6e7b71"
dest = "third-party/nuttx/libc"
submodule = "third-party/nuttx/libc"

# px4-rs Rust bindings fork. The px4 examples path-dep its crates, AND the root
# workspace lists `packages/testing/nros-tests` which path-deps px4-sitl-tests
# here — so cargo can't even *load* the workspace without it. Provisioned by
# `nros setup --source px4-rs`, never hand-checked-out. Non-recursive: this is
# the bindings tree only, not the giant PX4-Autopilot submodule.
[source.px4-rs]
version = "0.1.0"
git = "https://github.com/jerry73204/px4-rs.git"
ref = "b17ce297a456c891445a575ce7250573cff96938"
dest = "third-party/px4/px4-rs"
submodule = "third-party/px4/px4-rs"

# CycloneDDS fork as an in-tree *source* (the submodule the Zephyr build patches
# in place) — distinct from `[tool.cyclonedds]` (the prebuilt/host-built ddsc the
# native+host RMW links). Same fork pin. Named `cyclonedds-src` so board/rmw
# package refs to `cyclonedds` keep resolving unambiguously to the tool.
# Provisioned by `nros setup --source cyclonedds-src`.
[source.cyclonedds-src]
version = "0.10.5-nros1"
git = "https://github.com/NEWSLabNTU/cyclonedds.git"
ref = "12b4af2c5ac98657d42df84a5a45006ceede503b"
dest = "third-party/dds/cyclonedds"
submodule = "third-party/dds/cyclonedds"

# Phase 197.2/197.4 — build-time source submodules, folded into the relevant
# board/rmw `packages` (approach A) so `nros setup <board>` provisions them and a
# bare-machine `nros setup <board> → build` works. The SDK index is the single
# home for every source ref (retired config/submodule-deps.toml).

# zenoh-pico TLS dep (zpico-sys C build gates on its presence).
[source.mbedtls]
version = "3.x"
git = "https://github.com/Mbed-TLS/mbedtls.git"
ref = "5e146adef63b326b04282252639bebc2730939c6"
dest = "packages/rmw/zenoh/zpico-sys/mbedtls"
submodule = "packages/rmw/zenoh/zpico-sys/mbedtls"

# Micro-XRCE-DDS Client + Micro-CDR — the vendored C sources nros-rmw-xrce-cffi's
# build.rs compiles (its presence gate prints `git submodule update --init …`).
[source.micro-xrce-dds-client]
version = "2.4.3-nros1"
git = "https://github.com/eProsima/Micro-XRCE-DDS-Client.git"
ref = "bdfa28090efc8c0e89aa5c95cdf0878c8289a18b"
dest = "packages/rmw/xrce/xrce-sys/micro-xrce-dds-client"
submodule = "packages/rmw/xrce/xrce-sys/micro-xrce-dds-client"

[source.micro-cdr]
version = "2.0.x"
git = "https://github.com/eProsima/Micro-CDR.git"
ref = "99672492c5ef9fc378a8835b0bce9b2f7fa41306"
dest = "packages/rmw/xrce/xrce-sys/micro-cdr"
submodule = "packages/rmw/xrce/xrce-sys/micro-cdr"

# NetX Duo network stack (ThreadX boards link it; virtio-net-netx CMake + the
# threadx board build.rs expect it checked out).
[source.threadx-netxduo]
version = "6.4.x"
git = "https://github.com/NEWSLabNTU/netxduo.git"
ref = "d0c2e80e2da61e274f8f53505b1974fcad7d1071"
dest = "third-party/threadx/netxduo"
submodule = "third-party/threadx/netxduo"

# NuttX kernel + apps — the qemu-arm-nuttx board build.rs / build-nuttx.sh expect
# them present (the export is built with the app, per Phase 194). The Rust libc
# fork is the separate `[source.nuttx-libc]` (it's a board package).
[source.nuttx-kernel]
version = "12.13.0"
git = "https://github.com/jerry73204/nuttx.git"
ref = "d230b7d38380b65351fd5acc8d8c9d25473ec967"
dest = "third-party/nuttx/nuttx"
submodule = "third-party/nuttx/nuttx"

[source.nuttx-apps]
version = "12.13.0"
git = "https://github.com/apache/nuttx-apps.git"
ref = "e4b84b29d47b98a666df524d6f2d38904c972de5"
dest = "third-party/nuttx/nuttx-apps"
submodule = "third-party/nuttx/nuttx-apps"

# PX4-Autopilot — the heavy (>1 GB) reference tree (extended/opt-in). px4-rs (the
# bindings) is the separate `[source.px4-rs]`.
[source.px4-autopilot]
version = "1.17.0"
git = "https://github.com/PX4/PX4-Autopilot.git"
ref = "d6f12ad1c4f70ad3230afd7d86e971421e02fef4"
dest = "third-party/px4/PX4-Autopilot"
submodule = "third-party/px4/PX4-Autopilot"
# Phase 232.5 — pin the stable release tag `v1.17.0` (SHA `d6f12ad`) instead of
# the previous dev commit (`ecfe44a`, mislabeled 1.15.x, post-1.17.0-alpha1),
# which risked a silent uORB ABI drift. `v1.17.0` carries `msg/versioned/` (the
# 37 versioned core topics 232.1 enumerates) + the 6-field `orb_metadata` (232.4).
# The pin is now an advertised tag, so a shallow `git submodule update --depth 1`
# can reach it directly; nros ≥ 0.3.7 still falls back to an explicit depth-1
# fetch-by-SHA if needed. `recursive = false`: PX4's ~50 OWN sub-submodules are
# PX4's concern, pulled shallow by `just px4 setup` (`--depth 1 --recommend-shallow
# --recursive`), not nano-ros source provisioning.
shallow = true
recursive = false

# NOTE (197.4): opt-in dev/interop source repos (zenoh / rmw_zenoh / XRCE-agent
# upstreams, Tonbandgeraet tracing) are intentionally NOT modeled here yet — the
# released `nros` rejects unknown index fields/sections, so wiring opt-in
# `dev_sources` / `[reference.*]` needs an nros-cli schema change first (tracked
# in the Phase 197 workflow review). They remain plain `.gitmodules` submodules.

# --- license-gated (never hosted; instruct + nros doctor checks the env var) ---

[gated.arm-fvp]
version = "11.24"
env = "ARM_FVP_DIR"
installer = "arm-fvp-installer"

# --- RMW host packages (Phase 191.6.a): the RMW axis, orthogonal to the board.
# `nros setup <board> --rmw <name>` resolves `board.packages ∪ rmw.packages`
# (default `--rmw zenoh`). Boards list only platform/toolchain packages; the RMW
# daemon/tool lives here — no board×rmw pair enumeration. ---

[rmw.zenoh]
# Phase 197.4 (approach A) — the build-time source submodules are folded into
# `packages` so `nros setup <board>` is the complete provisioner (a bare-machine
# `nros setup <board> → build` works; build.rs gates on these). The released
# `nros` parses [rmw.*]/[board.*] with a strict schema (only `packages` +
# board descriptors), so no extra fields here.
packages = ["zenohd", "zenoh-pico", "mbedtls"]

[rmw.xrce]
packages = ["xrce-agent", "micro-xrce-dds-client", "micro-cdr"]

[rmw.cyclonedds]
packages = ["cyclonedds", "cyclonedds-src"]

# --- boards (Phase 191.1): board → required package set, the board→toolchain
# SSOT. `nros setup <board>` looks the board up here (no name guessing); an
# unknown board errors. `packages` lists [tool]/[source]/[gated] names; empty is
# valid (e.g. ESP32-C3's riscv32 toolchain is rustup-managed). `arch`/`platform`
# are descriptive. Keyed by the canonical board id (examples/<board>/ dir name
# or the board-crate name). ---

[board.native]
arch = "x86_64"
platform = "posix"
packages = [] # host daemon comes from the RMW axis (default rmw.zenoh)

[board.posix]
arch = "x86_64"
platform = "posix"
packages = [] # host daemon comes from the RMW axis (default rmw.zenoh)

[board.qemu-arm-baremetal]
arch = "cortex-m3"
platform = "bare-metal"
packages = ["arm-none-eabi-gcc", "qemu"]

[board.mps2-an385]
arch = "cortex-m3"
platform = "bare-metal"
packages = ["arm-none-eabi-gcc", "qemu"]

[board.qemu-arm-freertos]
arch = "cortex-m3"
platform = "freertos"
packages = ["arm-none-eabi-gcc", "qemu", "freertos-kernel", "lwip"]

[board.qemu-arm-nuttx]
arch = "cortex-a7"
platform = "nuttx" # NuttX kernel/apps are submodule SDKs (built with the app)
# nuttx-libc is the one source the Rust example path-deps, so `nros setup` must
# provision it. (Kernel/apps are pulled by the full west/make build, not here.)
packages = ["arm-none-eabi-gcc", "qemu", "nuttx-libc", "nuttx-kernel", "nuttx-apps"]

# 194.3c — the riscv (rv-virt) NuttX board: the 2nd-arch proof that the NuttX
# provisioning path is arch-agnostic. Same source set as qemu-arm-nuttx but the
# riscv cross-gcc; qemu already builds riscv64-softmmu (see [tool.qemu] configure
# --target-list). The rv-virt board bakes an `etc/` ROMFS at export time (the
# stock board's `RCSRCS = etc/init.d/{rc.sysinit,rcS}` → `genromfs`), so it
# needs the `genromfs` host tool — arm's config skips ROMFS and does not.
[board.qemu-riscv-nuttx]
arch = "riscv32" # rv-virt (rv32imac); riscv32imac-unknown-nuttx-elf
platform = "nuttx"
# genromfs: the rv-virt board bakes an etc/ ROMFS at export time (arm doesn't).
packages = ["riscv-none-elf-gcc", "qemu", "genromfs", "nuttx-libc", "nuttx-kernel", "nuttx-apps"]

[board.qemu-riscv64-threadx]
arch = "riscv64"
platform = "threadx"
packages = ["riscv-none-elf-gcc", "qemu", "threadx", "threadx-netxduo"]

[board.threadx-linux]
arch = "x86_64"
platform = "threadx"
# runs on the host; the zenoh daemon comes from rmw.zenoh
packages = ["threadx", "threadx-netxduo"]

[board.qemu-esp32-baremetal]
arch = "riscv32"
platform = "bare-metal"
# issue 0399 — the board compiles zpico C for riscv32imc and needs a riscv
# cross gcc. `riscv-none-elf-gcc` is the xPack multilib toolchain (rv32imc /
# ilp32 capable); declaring it here means `nros setup qemu-esp32-baremetal`
# provisions the compiler zpico-build's detection now looks for, instead of
# leaving a documented-provisioned host unable to build the example.
# issue 0486 — `espflash` joins `riscv-none-elf-gcc` for the same reason 0399
# added that one: without it a documented-provisioned host builds every ELF and
# then produces no flash image, with the lane exiting 0.
packages = ["riscv-none-elf-gcc", "espflash"]

[board.fvp-aemv8r-smp]
arch = "aarch64"
platform = "bare-metal"
packages = ["arm-fvp"]

[board.zephyr]
platform = "zephyr" # west + zephyr-sdk toolchain, provisioned outside the index
packages = []

# NOTE (197.4 → phase-327): index sections are rejected-unknown by whatever
# `nros` parses them, so adding a section IS a CLI schema change. phase-327 W1
# (RFC-0062) added [system.*]/[rust.*]/[python.*] below together with the
# in-tree CLI schema — a RELEASED pre-327 `nros` cannot parse this file
# anymore; contributors use the in-tree CLI (issue 0363 forces it fresh).


[source.rosidl]
# phase-327 / issue 0368 — rosidl_adapter for the cyclone msg->IDL step
# WITHOUT a ROS install: scripts/cyclonedds/msg_to_cyclone_idl.py resolves
# third-party/ros/rosidl/rosidl_adapter/scripts as its last ladder rung
# (env override and /opt/ros still win). Python deps ride [python.*]:
# catkin-pkg, empy (PINNED 3.3.4 — empy 4 breaks rosidl templates), lark.
version = "humble-5621b26"
git = "https://github.com/ros2/rosidl"
ref = "5621b26eff54596a356ad8abd72c06e7650d21f7"
dest = "third-party/ros/rosidl"

# --- OS packages (phase-327 W1, RFC-0062) -----------------------------------
#
# Abstract keys mapped per package manager. `nros setup --system` composes the
# detected manager's ONE install command and prints it (never runs it without
# --sudo); `nros setup --system --check` runs the probes (the doctor surface).
# Mappings verified on Ubuntu 22.04 (issue 0368's clean-host walk); dnf/pacman/
# brew mappings are best-effort and unverified — fix them as hosts appear.

[system.libglib2-dev]
why = "qemu source builds (esp32-qemu meson configure)"
apt = ["libglib2.0-dev"]
dnf = ["glib2-devel"]
pacman = ["glib2"]
brew = ["glib"]
check = { pkg_config = "glib-2.0" }

[system.libpixman-dev]
why = "qemu source builds (softmmu display layer)"
apt = ["libpixman-1-dev"]
dnf = ["pixman-devel"]
pacman = ["pixman"]
brew = ["pixman"]
check = { pkg_config = "pixman-1" }

[system.libgcrypt-dev]
why = "qemu source builds (--enable-gcrypt)"
apt = ["libgcrypt20-dev"]
dnf = ["libgcrypt-devel"]
pacman = ["libgcrypt"]
brew = ["libgcrypt"]
# issue 0487 — BOTH, because the two distros ship different halves: Arch's
# libgcrypt 1.12 ships `libgcrypt.pc` and no `libgcrypt-config`; Ubuntu 22.04's
# 1.9 ships the script and no `.pc`. Probes are OR-ed.
check = { cmd = "libgcrypt-config", pkg_config = "libgcrypt" }

[system.doxygen]
why = "C API reference docs (just docs-c; found undeclared by check-sysdep-remedies)"
apt = ["doxygen"]
dnf = ["doxygen"]
pacman = ["doxygen"]
brew = ["doxygen"]
check = { cmd = "doxygen" }

[system.gcc-arm-none-eabi]
why = "ARM bare-metal cross gcc via the apt path (the [tool.arm-none-eabi-gcc] dist is the store alternative)"
apt = ["gcc-arm-none-eabi"]
dnf = ["arm-none-eabi-gcc-cs"]
pacman = ["arm-none-eabi-gcc"]
brew = ["arm-none-eabi-gcc"]
check = { cmd = "arm-none-eabi-gcc" }

[system.cmake]
why = "every C/C++ configure step"
apt = ["cmake"]
dnf = ["cmake"]
pacman = ["cmake"]
brew = ["cmake"]
check = { cmd = "cmake" }

[system.genromfs]
why = "NuttX riscv rv-virt etc/ ROMFS image (the [tool.genromfs] source recipe is the store alternative)"
apt = ["genromfs"]
pacman = ["genromfs"]
check = { cmd = "genromfs" }

[system.socat]
why = "test-harness serial/TCP relays"
apt = ["socat"]
dnf = ["socat"]
pacman = ["socat"]
brew = ["socat"]
check = { cmd = "socat" }

[system.zstd]
why = "tar decompresses the prebuilt `.tar.zst` SDK dists via the external zstd binary (issue 0385; stock Ubuntu 22.04 ships no zstd)"
apt = ["zstd"]
dnf = ["zstd"]
pacman = ["zstd"]
brew = ["zstd"]
check = { cmd = "zstd" }

[system.libmbedtls]
why = "zenoh-pico TLS link (zpico-sys)"
apt = ["libmbedtls-dev"]
dnf = ["mbedtls-devel"]
pacman = ["mbedtls"]
brew = ["mbedtls"]
# issue 0603 — HEADER, not sharedlib. The consumer compiles
# `zenoh-pico/system/link/tls.c` against `mbedtls/entropy.h`; the runtime
# package `libmbedtls14` ships `libmbedtls.so.14`, which a prefix-matching
# `sharedlib = "libmbedtls.so"` accepted. So this gate said "present" on a host
# with no headers and `lane=tier2` died twenty minutes in, after building six
# embedded families. Same string `nros-zpico-build/src/runner.rs` checks before
# it fabricates the .pc files, so the gate and the build ask one question.
check = { header = "mbedtls/entropy.h" }

[system.clang]
why = "bindgen + C toolchain probes"
apt = ["clang"]
dnf = ["clang"]
pacman = ["clang"]
brew = ["llvm"]
check = { cmd = "clang" }

[system.libclang-dev]
why = "bindgen (z3-sys via ros-launch-manifest-check -> nros-launch-resolve build; issue 0368 F5)"
apt = ["libclang-dev"]
dnf = ["clang-devel"]
pacman = ["clang"]
brew = ["llvm"]
# issue 0603 swept the `-dev`-package-with-sharedlib-probe shape and DELIBERATELY
# left this one. bindgen `dlopen`s libclang at run time — it wants the LIBRARY,
# not `/usr/include/clang-c`. And the versioned dev packages (`libclang-14-dev`)
# install their headers under `/usr/lib/llvm-14/include`, so a `header` probe
# would report MISSING on a host that has the thing and works. Loadable is the
# right question here; the prefix match is deliberate too (libclang-14.so.1).
check = { sharedlib = "libclang" }

[system.libz3]
why = "ros-launch-manifest-check (z3) -> nros-launch-resolve build (issue 0368 F5)"
apt = ["libz3-dev"]
dnf = ["z3-devel"]
pacman = ["z3"]
brew = ["z3"]
# issue 0603 — same latent defect as libmbedtls, caught by the sweep rather than
# by a failure: `libz3.so` prefix-matches the runtime `libz3.so.4`, so a host
# with only `libz3-4` would read as present and z3-sys would then fail to find
# `z3.h`. Unlike libclang this dev package is unversioned and does install into
# `/usr/include`, so the header is the honest test.
check = { header = "z3.h" }

[system.python3-dev]
why = "pyo3 source builds (play_launch_parser, nros-launch-resolve; issue 0368 F5)"
apt = ["python3-dev"]
dnf = ["python3-devel"]
pacman = ["python"]
brew = ["python"]
check = { pkg_config = "python3" }

[system.python3-venv]
why = "ESP-IDF install + tool venvs (issue 0368 F7)"
apt = ["python3-venv"]
dnf = ["python3"]
pacman = ["python"]
brew = ["python"]

[system.python3-pip]
why = "pip-layer installs (west, colcon, clang-format wheel)"
apt = ["python3-pip"]
dnf = ["python3-pip"]
pacman = ["python-pip"]
brew = ["python"]
check = { cmd = "pip3" }

[system.libslirp]
why = "runtime dep of the qemu-nros dist (-netdev user; issue 0368 F3)"
apt = ["libslirp0"]
dnf = ["libslirp"]
pacman = ["libslirp"]
brew = ["libslirp"]
check = { sharedlib = "libslirp.so.0" }

[system.aria2]
why = "Zephyr SDK fetch (west sdk install; issue 0368 F7)"
apt = ["aria2"]
dnf = ["aria2"]
pacman = ["aria2"]
brew = ["aria2"]
check = { cmd = "aria2c" }

[system.gnu-parallel]
why = "just format fan-out (issue 0368 F7)"
apt = ["parallel"]
dnf = ["parallel"]
pacman = ["parallel"]
brew = ["parallel"]
check = { cmd = "parallel" }

[system.qemu-system-arm]
why = "ARM QEMU lanes via the apt path (the [tool.qemu] nros dist is the harness-preferred build)"
apt = ["qemu-system-arm"]
dnf = ["qemu-system-arm"]
pacman = ["qemu-system-arm"]
brew = ["qemu"]
check = { cmd = "qemu-system-arm" }

[system.qemu-system-misc]
why = "RISC-V QEMU lanes (threadx-riscv64, nuttx rv-virt)"
apt = ["qemu-system-misc"]
dnf = ["qemu-system-riscv"]
pacman = ["qemu-system-riscv"]
brew = ["qemu"]
check = { cmd = "qemu-system-riscv64" }

[system.gcc-riscv64-unknown-elf]
why = "RISC-V bare-metal cross gcc (threadx-riscv64, nuttx rv-virt; the [tool.riscv-none-elf-gcc] dist is the xPack-prefixed alternative)"
apt = ["gcc-riscv64-unknown-elf"]
pacman = ["riscv64-elf-gcc"]
check = { cmd = "riscv64-unknown-elf-gcc" }

[system.picolibc-riscv64-unknown-elf]
why = "picolibc for the riscv64-unknown-elf gcc (nuttx rv-virt userspace)"
apt = ["picolibc-riscv64-unknown-elf"]

[system.kconfig-frontends]
why = "NuttX configuration (kconfig-conf/kconfig-mconf)"
apt = ["kconfig-frontends-nox"]
check = { cmd = "kconfig-conf" }

# --- Rust layer (phase-327 W1) ----------------------------------------------
#
# Previously living in `just workspace` recipe bodies (rust-pinned-toolchains /
# rust-targets / cargo-tools). The channel SSOT for the pinned nightly stays
# tools/rust-toolchain.toml (recipes awk it); this records the DECLARATION so
# setup/doctor derive from one file. cargo-nextest was required by `just
# test-all` and declared nowhere (issue 0368 F7).

[rust.toolchain.stable]
channel = "stable"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]

[rust.toolchain.nightly-pinned]
# Keep in lockstep with tools/rust-toolchain.toml (the awk-read SSOT).
channel = "nightly-2026-04-11"
components = ["rustfmt", "miri", "rust-src", "llvm-tools"]

[rust.target.thumbv7em-hf]
triple = "thumbv7em-none-eabihf"

[rust.target.thumbv7m]
triple = "thumbv7m-none-eabi"

[rust.target.thumbv7m-nightly]
triple = "thumbv7m-none-eabi"
toolchain = "nightly-pinned"

[rust.target.armv7r-hf]
triple = "armv7r-none-eabihf"

[rust.target.riscv32imc]
triple = "riscv32imc-unknown-none-elf"

[rust.target.riscv64gc]
triple = "riscv64gc-unknown-none-elf"

[rust.cargo-tool.nextest]
crate = "cargo-nextest"
check = { cmd = "cargo-nextest" }

[rust.cargo-tool.llvm-cov]
crate = "cargo-llvm-cov"
check = { cmd = "cargo-llvm-cov" }

[rust.cargo-tool.espflash]
crate = "espflash"
