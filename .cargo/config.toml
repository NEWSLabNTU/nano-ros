# Phase 77.25: v0 symbol mangling is required for the nros-sizes-build
# probe to work under the workspace's fat-LTO release profile. The v0
# scheme encodes const-generic values (including `size_of::<T>()`
# results) into the mangled symbol name — names survive LTO-only
# rlibs while object-file symbol sizes don't, which is the exact gap
# that produced the silent 0-byte `NROS_*_SIZE` macros tracked in
# 77.23/77.24. v0 has been stable since Rust 1.60; the only
# user-visible effect is slightly cleaner demangled output in
# backtraces.
[build]
rustflags = ["-C", "symbol-mangling-version=v0"]

# phase-340 W6 — mirrors the root `Cargo.toml`'s `[profile.dev]`. A leaf under
# this checkout resolves `dev` through cargo's config walk-up, not through the
# root manifest (which governs only the root workspace), so the Zephyr west lane
# needs the setting HERE to see it. See the manifest for the measurement.
[profile.dev]
opt-level = 1
# phase-359 W10 — mirrors the manifest's `panic = "abort"`, added there so a
# bare `cargo check -p <crate>` works on this workspace's `no_std` crates:
# `nros-c` / `nros-cpp` build staticlib/cdylib artifacts and rustc refuses
# `no_std` + `panic = "unwind"` for those. The manifest governs the root
# workspace only, so a leaf resolving `dev` through the config walk-up — every
# Zephyr west leaf — got `unwind` and the mismatch this file exists to prevent.
panic = "abort"
incremental = false
# phase-359 W10 / `7f4da362c` — mirrors the manifest's `panic = "abort"`, which
# is what lets a bare `cargo check -p nros-c` / `-p nros-cpp` work: rustc
# refuses `no_std` + `panic = "unwind"` for a `staticlib`/`cdylib`. The setting
# has to be in BOTH copies — a leaf outside the root workspace resolves `dev`
# through this file, and only through this file.
panic = "abort"

# phase-336 — the nano-ros presets, so a bare `cargo build --profile
# nros-relwithdebinfo` in any leaf UNDER this checkout resolves without the
# environment injection the build scripts use. Mirrors the root `Cargo.toml`;
# `nros-cargo-profile`'s `config_toml_matches_this_table` test fails on drift.
# phase-340 W1 dropped `incremental = true` here 2026-08-06 — see the root
# `Cargo.toml` and nros-cargo-profile's RELWITHDEBINFO doc comment for the
# measurement. This copy is the one LEAVES resolve through, so it is the copy
# that actually decides what the fixture lanes build with.
[profile.nros-relwithdebinfo]
inherits = "release"
opt-level = 2
debug = 1
lto = "off"
codegen-units = 16
panic = "abort"

# Opt-in for local iteration; ~28 % more disk. Never `CARGO_INCREMENTAL=1`,
# which makes sccache abort the build outright. Settings repeated rather than
# chained — see the root `Cargo.toml` for why.
[profile.nros-iterate]
inherits = "release"
opt-level = 2
debug = 1
lto = "off"
codegen-units = 16
incremental = true
panic = "abort"

[profile.nros-minsizerel]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

# Phase 212.M.7 — riscv32imc (esp32c3 / esp32c2 under ESP-IDF) has no
# hardware atomics. `portable-atomic` requires either a critical-section
# impl or the `portable_atomic_unsafe_assume_single_core` cfg on such
# targets. esp32c3 / esp32c2 are officially single-core RISC-V SoCs so
# the cfg is correct (matches esp-hal convention). SAFE ONLY on single-
# hart targets — do not propagate to riscv32imac (esp32c6 / esp32h2 /
# esp32p4) where atomics exist OR to a multi-core SoC.
[target.riscv32imc-unknown-none-elf]
rustflags = [
  "-C", "symbol-mangling-version=v0",
  "--cfg=portable_atomic_unsafe_assume_single_core",
]
