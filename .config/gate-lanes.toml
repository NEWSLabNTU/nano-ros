# Gate lanes as SCOPES (phase-543 W3). A lane names the tiers it runs and the
# capabilities its environment CLAIMS. A gate (or a unit of one) that needs a
# capability its lane does not claim is out of that lane's scope: the nextest
# harness lists it as ignored, so it is shown as not run, by name, and never
# counted as a pass. A gate that IS in scope and finds its capability missing
# at run time fails (its skip ledger is not empty). Scope is a property of the
# lane, never of the host that happens to run it (issue 1758's rule for tests).
#
# With NROS_GATE_LANE unset, every capability is claimed, so a host lacking one
# is red, honestly.
#
# Capabilities a gate declares with `[group('needs:<cap>')]` on its recipe.
# `check-gate-needs` refuses a `needs:` naming a capability not listed here.
[capabilities]
cli = "the in-tree `nros` CLI (just setup-cli)"
cmake = "cmake and ninja on PATH"
cc = "a host C/C++ compiler and binutils (ar, nm, objcopy)"
arm-gcc-any = "any arm-none-eabi-g++, pinned or not (the CI image's distro package, or nros setup --tool arm-none-eabi-gcc)"
bindgen = "bindgen-cli at the pin"
ros2 = "a sourced ROS 2 (AMENT_PREFIX_PATH)"
colcon = "colcon on PATH"
sources = "provisioned source clones under $NROS_HOME/sources (nros setup --source)"
submodules = "the submodules .config/worktree-provisioning.txt lists"
git-history = "commit history deeper than a shallow clone"
zephyr-tree = "Zephyr's lib/cpp/minimal/include under zephyr-workspace/ (CI's sparse clone)"
zephyr = "a resolvable west workspace"
west = "a Python interpreter that imports west (scripts/build/zephyr-python.sh)"
nuttx = "the NuttX sources (NUTTX_DIR)"
fsp = "the NVIDIA Orin SPE FSP tree (NV_SPE_FSP_DIR)"
build-tree = "artifacts a fixture or image build produced"
arm-gcc = "the pinned arm-none-eabi-gcc dist ([tool.arm-none-eabi-gcc], nros setup --tool arm-none-eabi-gcc)"

# Shared resources a gate USES, with how many gates may hold one at once
# (`[group('uses:<res>')]` on the recipe; phase-543 W4). Each becomes a nextest
# test group in the harness's generated config. A gate blocked on a cargo build
# lock still holds a test slot, so bounding the holders keeps slots for gates
# that can run.
[resources]
root-target = 2   # the root workspace's `target/` (cargo's build-directory lock)
# issue 2356 — the units of `scaffold-builds` and `template-copy-out` each build
# cold in their own tree under $TMPDIR (scripts/build/gate-scratch.sh). Each unit
# is its own nextest test (phase-543 W2), so the in-gate bound
# (`nros_gate_unit_jobs`) never sees more than one; this is the bound. Sized from
# the host, not chosen: max-threads is the smaller of TMPDIR's free space when
# the config is generated over `scratch-gib`, the measured peak of the largest
# unit (a C++ scaffold or workspace copy, 4.7 GiB on newslab-118; Rust units
# 2.0 GiB), and the run's CPUs over `cpus`, since every unit runs its own
# parallel build (phase-489's one unit per 8 CPUs). The disk bound alone let a
# disk-backed /tmp admit dozens, and a 32-core host sat at load 100-130.
scratch-tree = { scratch-gib = 5, cpus = 8 }

[lane.fast]
# `check / fast` on the hosted runner: the ci-base image provides these.
tiers = ["fast"]
claims = ["cli", "cmake", "cc", "arm-gcc-any", "bindgen", "ros2", "colcon", "sources", "submodules", "git-history", "zephyr-tree"]

[lane.build]
# The hosted runner's other jobs: `check / build tier` shards (gate.yml) and
# host-tests' tier-1 gates, which run `just check` and so both tiers. Same
# image as `fast`, without the sparse Zephyr header clone.
tiers = ["fast", "build"]
# Issue 2413: `arm-gcc` is provisioned by `scripts/ci/provision-gate-lane.sh
# build` for the FreeRTOS C++ copy-out units, which refuse the distro 10.3.
claims = ["cli", "cmake", "cc", "bindgen", "ros2", "colcon", "sources", "submodules", "git-history", "arm-gcc", "arm-gcc-any"]

[lane.queue]
# The self-hosted runner (nros-sdk-zephyr): the image's set plus a Zephyr
# workspace and the fixture build's artifacts.
tiers = ["fast", "build"]
claims = ["cli", "cmake", "cc", "bindgen", "ros2", "colcon", "sources", "submodules", "git-history", "zephyr-tree", "zephyr", "west", "build-tree"]

[lane.dev]
# A developer worktree after `just setup-worktree` with ROS 2 sourced: what
# `just check lane dev` runs before a push. No Zephyr and no fixture build, so
# the gates that need them run in `fast`/`queue` instead.
# Nor `arm-gcc-any` (issue 2419): a cross compiler is not part of a worktree's
# setup, so `px4-uorb-nuttx-compile` runs in `fast` and `build`, and by name
# (`just check px4-uorb-nuttx-compile`) where one is installed.
tiers = ["fast", "build"]
claims = ["cli", "cmake", "cc", "bindgen", "ros2", "colcon", "sources", "submodules", "git-history"]

[lane.runner]
# The self-hosted runner image (nros-qemu, nros-sdk-zephyr, nros-big), at the
# point `just build <lane>` / `just ci matrix` run the gate tiers: BEFORE any
# fixture build, in a shallow checkout, with no bindgen or colcon and only the
# submodules its own lanes provision. Measured from the preflight's refusal on
# run 42346220231. The gates that need more run in gate.yml's hosted jobs; the
# Zephyr and fixture gates run as named steps after the build there.
tiers = ["fast", "build"]
claims = ["cli", "cmake", "cc", "ros2", "sources", "west"]

[lane.pristine]
# `check pristine-checkout`: a worktree with no submodules and no CLI
# (issues 0650, 1373).
tiers = ["fast"]
claims = ["cmake", "cc", "git-history"]
