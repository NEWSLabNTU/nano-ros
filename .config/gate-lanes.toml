# Gate lanes as SCOPES (phase-543 W3). A lane names the tiers it runs and the
# capabilities its environment CLAIMS. A gate (or a unit of one) that needs a
# capability its lane does not claim is out of that lane's scope: the nextest
# harness lists it as ignored, so it is shown as not run, by name, and never
# counted as a pass. A gate that IS in scope and finds its capability missing
# at run time fails (its skip ledger is not empty). Scope is a property of the
# lane, never of the host that happens to run it (issue 1758's rule for tests).
#
# With NROS_GATE_LANE unset, every capability is claimed, so a host lacking one
# is red, honestly.
#
# Capabilities a gate declares with `[group('needs:<cap>')]` on its recipe.
# `check-gate-needs` refuses a `needs:` naming a capability not listed here.
[capabilities]
cli = "the in-tree `nros` CLI (just setup-cli)"
cmake = "cmake and ninja on PATH"
cc = "a host C/C++ compiler and binutils (ar, nm, objcopy)"
arm-gcc-any = "any arm-none-eabi-g++, pinned or not (the CI image's distro package, or nros setup --tool arm-none-eabi-gcc)"
bindgen = "bindgen-cli at the pin"
ros2 = "a sourced ROS 2 (AMENT_PREFIX_PATH)"
colcon = "colcon on PATH"
sources = "provisioned source clones under $NROS_HOME/sources (nros setup --source)"
submodules = "the submodules [[provision.submodule]] lists, below"
git-history = "commit history deeper than a shallow clone"
zephyr-tree = "Zephyr's lib/cpp/minimal/include under zephyr-workspace/ (CI's sparse clone)"
zephyr = "a resolvable west workspace"
west = "a Python interpreter that imports west (scripts/build/zephyr-python.sh)"
nuttx = "the NuttX sources (NUTTX_DIR)"
fsp = "the NVIDIA Orin SPE FSP tree (NV_SPE_FSP_DIR)"
build-tree = "artifacts a fixture or image build produced"
arm-gcc = "the pinned arm-none-eabi-gcc dist ([tool.arm-none-eabi-gcc], nros setup --tool arm-none-eabi-gcc)"

# Shared resources a gate USES, with how many gates may hold one at once
# (`[group('uses:<res>')]` on the recipe; phase-543 W4). Each becomes a nextest
# test group in the harness's generated config. A gate blocked on a cargo build
# lock still holds a test slot, so bounding the holders keeps slots for gates
# that can run.
[resources]
root-target = 2   # the root workspace's `target/` (cargo's build-directory lock)
# issue 2356 — the units of `scaffold-builds` and `template-copy-out` each build
# cold in their own tree under $TMPDIR (scripts/build/gate-scratch.sh). Each unit
# is its own nextest test (phase-543 W2), so the in-gate bound
# (`nros_gate_unit_jobs`) never sees more than one; this is the bound. Sized from
# the host, not chosen: max-threads is the smaller of TMPDIR's free space when
# the config is generated over `scratch-gib`, the measured peak of the largest
# unit (a C++ scaffold or workspace copy, 4.7 GiB on newslab-118; Rust units
# 2.0 GiB), and the run's CPUs over `cpus`, since every unit runs its own
# parallel build (phase-489's one unit per 8 CPUs). The disk bound alone let a
# disk-backed /tmp admit dozens, and a 32-core host sat at load 100-130.
scratch-tree = { scratch-gib = 5, cpus = 8 }

[lane.fast]
# `check / fast` on the hosted runner: the ci-base image provides these.
tiers = ["fast"]
claims = ["cli", "cmake", "cc", "arm-gcc-any", "bindgen", "ros2", "colcon", "sources", "submodules", "git-history", "zephyr-tree"]

[lane.build]
# The hosted runner's other jobs: `check / build tier` shards (gate.yml), which
# run the fast tier too through `just check build`'s lane. host-tests' tier-1
# gates job ran this lane as well until issue 2141 removed it as a duplicate.
# Same image as `fast`, without the sparse Zephyr header clone.
tiers = ["fast", "build"]
# Issue 2413: `arm-gcc` is provisioned by `scripts/ci/provision-gate-lane.sh
# build` for the FreeRTOS C++ copy-out units, which refuse the distro 10.3.
claims = ["cli", "cmake", "cc", "bindgen", "ros2", "colcon", "sources", "submodules", "git-history", "arm-gcc", "arm-gcc-any"]

[lane.dev]
# A developer worktree after `just setup-worktree` with ROS 2 sourced: what
# `just check lane dev` runs before a push. No Zephyr and no fixture build, so
# the gates that need them run in `fast`/`queue` instead.
# Nor `arm-gcc-any` (issue 2419): a cross compiler is not part of a worktree's
# setup, so `px4-uorb-nuttx-compile` runs in `fast` and `build`, and by name
# (`just check px4-uorb-nuttx-compile`) where one is installed.
tiers = ["fast", "build"]
claims = ["cli", "cmake", "cc", "bindgen", "ros2", "colcon", "sources", "submodules", "git-history"]
# phase-565 W4: no CI job runs this lane; a contributor's worktree does
# (`just check lane dev`, and the pre-push hook's `check fast`).
local = "a developer worktree: `just check lane dev` and the pre-push `check fast`; provisioned by `just setup-worktree`"

[lane.runner]
# The self-hosted runner image (nros-qemu, nros-sdk-zephyr, nros-big), at the
# point `just build <lane>` / `just ci matrix` run the gate tiers: BEFORE any
# fixture build, in a shallow checkout, with no bindgen or colcon and only the
# submodules its own lanes provision. Measured from the preflight's refusal on
# run 42346220231. The gates that need more run in gate.yml's hosted jobs; the
# Zephyr and fixture gates run as named steps after the build there.
tiers = ["fast", "build"]
claims = ["cli", "cmake", "cc", "ros2", "sources", "west"]

[lane.merge]
# `merge-runtime.yml` (phase-535 W8): a hosted shard (`nano-ros-ci` or
# `nano-ros-zephyr-ci`) reaching the fast tier through `just build merge`,
# BEFORE any fixture build, in a shallow checkout. Like `runner`, it claims
# only what the image and the job's own `just setup <board>` provide; the
# gates needing more run in gate.yml's jobs on the same merge group.
tiers = ["fast"]
claims = ["cli", "cmake", "cc", "ros2", "sources"]

[lane.pristine]
# `check pristine-checkout`: a worktree with no submodules and no CLI
# (issues 0650, 1373).
tiers = ["fast"]
claims = ["cmake", "cc", "git-history"]
local = "`just check pristine-checkout`, a step of `just ci gate`, in a clone it makes itself"

# How each capability is PROVIDED (phase-565 W2; RFC-0131 D3). Every capability
# has a `remedy`, the fix a refusal names. One that nano-ros can install itself
# also names a `provisioner`: a `claim_<name>` function in
# scripts/lib/claim-provision.sh, run by `just setup-worktree` for the `dev`
# lane and by CI's scripts/ci/provision-gate-lane.sh for a CI lane, so both run
# the same code. The rest are HOST tools: named with their remedy, never
# installed (no sudo). `ci = false` marks a provisioner a CI job's own steps
# already cover, so CI's provisioner leaves it to them. `order` is the order the
# provisioners run in: a submodule that is a CLI build input (play_launch,
# issue 0561) before `cli`, and `sources` after it, since it needs a CLI. Read
# only through scripts/lib/lane_provision.py; `lane_provision.py --check` (gate
# `lane-claims-provisioned`) refuses a capability with no entry.
[provision]
order = ["submodules", "git-history", "zephyr-tree", "cli", "sources", "arm-gcc"]

[provision.claim]
cli = { provisioner = "cli", ci = false, remedy = "just setup-cli && just setup-launch-resolve" }
submodules = { provisioner = "submodules", remedy = "just setup-worktree" }
git-history = { provisioner = "git-history", remedy = "git fetch --unshallow" }
sources = { provisioner = "sources", remedy = "nros setup --source <name> (the index's [source.*] rows)" }
zephyr-tree = { provisioner = "zephyr-tree", remedy = "the sparse header clone (scripts/ci/provision-gate-lane.sh), or a west workspace" }
arm-gcc = { provisioner = "arm-gcc", remedy = "nros setup --tool arm-none-eabi-gcc" }
ros2 = { remedy = "source /opt/ros/<distro>/setup.bash (or ./activate.sh with ROS installed)" }
colcon = { remedy = "install colcon (python3 -m pip install colcon-common-extensions)" }
bindgen = { remedy = "just setup linux" }
cmake = { remedy = "install cmake and ninja" }
cc = { remedy = "install a C/C++ compiler" }
arm-gcc-any = { remedy = "any arm-none-eabi-g++ on PATH works: the distro package (gcc-arm-none-eabi, as in the CI image) or nros setup --tool arm-none-eabi-gcc then re-source activate.sh; or set NROS_ARM_NONE_EABI_PREFIX" }
zephyr = { remedy = "just zephyr setup" }
west = { remedy = "just zephyr setup" }
nuttx = { remedy = "nros setup --source nuttx" }
fsp = { remedy = "provision NV_SPE_FSP_DIR (not on any runner)" }
build-tree = { remedy = "just build-test-fixtures" }

# What the `submodules` claim provisions: the submodules the gate tiers read,
# and WHICH gates read each (phase-565 W1; until then the separate list
# `.config/worktree-provisioning.txt`, issue 1513). ONE table, read only through
# `scripts/lib/lane_provision.py` (gate `check-lane-provisioning-single-source`):
# by `just setup-worktree`, by the lane preflight (`_require-worktree-provisioning`)
# and by CI's `scripts/ci/provision-gate-lane.sh`, which takes the rows whose
# `tiers` meet its lane's. A path that names no submodule of this checkout is
# reported, not skipped: that is how a renamed submodule is caught.
#
# NOT every submodule: no lane checks out all 20 (issue 1043), and the Zephyr
# `hal_*` modules alone are gigabytes. This is the set the gate tiers read,
# which is why each row says who reads it.
[[provision.submodule]]
path = "packages/rmw/zenoh/zpico-sys/zenoh-pico"
tiers = ["fast"]
reads = "capability-conditionals, zpico-config-keys, support-status"

[[provision.submodule]]
path = "packages/rmw/xrce/xrce-sys/micro-cdr"
tiers = ["fast"]
reads = "xrce-vendored-versions"

[[provision.submodule]]
path = "packages/rmw/xrce/xrce-sys/micro-xrce-dds-client"
tiers = ["fast"]
reads = "xrce-vendored-versions"

[[provision.submodule]]
path = "third-party/nuttx/nuttx-apps"
tiers = ["fast"]
reads = "nuttx-rust-triple (upstream's tools/Rust.mk triple table)"

[[provision.submodule]]
path = "third-party/dds/cyclonedds"
tiers = ["build"]
reads = "test-targets, workspace-all, workspace-features"

[[provision.submodule]]
path = "packages/cli/third-party/play_launch"
tiers = ["build"]
reads = "cli-tests; and the launch resolver is built from it"

[[provision.submodule]]
path = "third-party/freertos/kernel"
tiers = ["build"]
reads = "workspace-all, test-targets (nros-board-freertos build script; store-first), island-shaped-workspace (its mps2-an385-freertos board image)"

[[provision.submodule]]
path = "third-party/freertos/lwip"
tiers = ["build"]
reads = "workspace-all, test-targets (nros-board-freertos build script; store-first), island-shaped-workspace (its mps2-an385-freertos board image)"

[[provision.submodule]]
path = "third-party/threadx/kernel"
tiers = ["build"]
reads = "workspace-all, test-targets (nros-board-threadx build script; store-first)"

[[provision.submodule]]
path = "third-party/threadx/netxduo"
tiers = ["build"]
reads = "workspace-all, test-targets (nros-board-threadx build script; store-first)"

[[provision.submodule]]
path = "packages/cli/testing_workspaces/ros2_rust_examples"
tiers = ["build"]
reads = "cli-tests (the colcon flag parity tests, phase-526 W3)"
