# nros West Manifest
#
# This manifest defines the nros Zephyr workspace.
# Users initialize a workspace with:
#
#   west init -m https://github.com/user/nano-ros ~/nano-ros-workspace
#   cd ~/nano-ros-workspace
#   west update
#
# Or for local development:
#
#   west init -l /path/to/nros ~/nano-ros-workspace
#   cd ~/nano-ros-workspace
#   west update

manifest:
  version: "1.0"

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    # Zephyr RTOS
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v3.7.0
      import:
        # Import Zephyr's modules, filtered to essentials.
        #
        # THIS LIST IS DERIVED. The SSoT is `[zephyr_module.*]` in
        # `nros-sdk-index.toml` — a module belongs here iff its `lines`
        # contains "3.7". `check-zephyr-module-allowlist` holds the two in
        # step, and `nros setup zephyr --dry-run` prices the set from the
        # index. Edit the index, then mirror it here; editing only this file
        # is what RFC-0099 D10 calls the provisioner not reading its own SSoT.
        name-allowlist:
          # Core
          - cmsis
          - picolibc
          # Crypto
          - mbedtls
          - tinycrypt
          # HALs — see `[zephyr_module.*]` for who needs each, and for the
          # four that used to sit here. phase-447 F1 / issue 1275.
          - hal_espressif
          # Bootloader
          - mcuboot
          # Tools
          - net-tools

    # Rust language support for Zephyr. Phase 199.2 — pin a specific SHA (not
    # `main`, which drifts): the support unit is the (zephyr × zephyr-lang-rust)
    # pair, so the 3.7 LTS line freezes the zephyr-lang-rust rev `main` resolved
    # to (zephyr-lang-rust is untagged — no Zephyr-version release to pin). Bump
    # deliberately; see docs/development/zephyr-version-support.md.
    - name: zephyr-lang-rust
      remote: zephyrproject-rtos
      revision: 404fcefdbab0f2711cd342a1fab9d2eda52a1ba9
      path: modules/lang/rust

  self:
    # nros is the manifest repository
    path: nros
    # phase-298 W2 (issue 0232) — register the nano-ros west extension
    # commands (`west nros`: run the nano-ros CLI against this workspace).
    # Without this line the extension never loads and the command fails
    # "unknown command".
    #
    # `west fvp` was the other one until RFC-0064 R5 D4; see
    # scripts/west-commands.yml for why it went.
    west-commands: scripts/west-commands.yml
