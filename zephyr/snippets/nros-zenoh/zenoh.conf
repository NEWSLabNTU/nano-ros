# Phase 180.C — nano-ros zenoh RMW Kconfig (Zephyr 4.x snippet).
#
# RMW-common settings derived from examples/zephyr/c/talker/prj-zenoh.conf.
# Kept in lockstep with that overlay (the canonical zenoh example config).
# NSOS / native_sim line overlay is intentionally NOT included here — it is
# board+line specific (cmake/zephyr/native-sim-line-<v>.conf).

CONFIG_NROS_RMW_ZENOH=y

CONFIG_NET_TCP=y
# Zephyr's default tcp_work workqueue stack (1024 B) overflows on arm64 —
# corrupted context, wild ERET to __start at EL0, EC 0x18 fatal in tcp_work
# (ASI wall #3, phase-292 W2). Anything enabling NET_TCP must raise it.
CONFIG_POSIX_API=y

# Resource SIZING is deliberately not here. It lives as `configdefault` entries
# in the module Kconfig (zephyr/Kconfig, "RMW resource sizing"), so a board conf
# or prj.conf can override it. A snippet is EXTRA_CONF_FILE and therefore BEATS
# the board's own CONF_FILE -- values set here cannot be argued with, which is
# how a 16 MiB malloc arena reached a board with 320 KiB of SRAM.
# Structural settings stay: they are what the backend needs to function at all,
# not a size anyone should tune.
