# Phase 180.C — nano-ros Cyclone DDS RMW snippet.
#
# Selecting `-S nros-cyclonedds` appends cyclonedds.conf (RMW select + transport + POSIX/
# thread + resource sizing) to the build's Kconfig fragments — the settings the
# per-example `prj-cyclonedds.conf` overlay supplies. Zephyr 3.7 and 4.x both support
# module snippets (3.7 has `scripts/snippets.py` and the module `snippet_root`
# key; issue 2157 measured `-S` merging on 3.7 with CONF_FILE set — this header
# used to say "4.x only", which was never true).
#
# Additive: the prj-cyclonedds.conf overlays are NOT removed. RMW-only: native_sim's
# network is the separate `nros-nsos` snippet, which the board names.
name: nros-cyclonedds
append:
  EXTRA_CONF_FILE: cyclonedds.conf
