# Issue 2157 -- native_sim's network: NSOS (host BSD sockets, no TAP device).
#
# A board package selects it by name (`[board.zephyr] snippets = ["nros-nsos"]`,
# which the module hook adds to SNIPPET for every `system.toml` image); any
# other build passes `-S nros-nsos` (or `set(SNIPPET nros-nsos)` before
# `find_package(Zephyr)`). Zephyr resolves the name through this module's
# `snippet_root`, so no build needs a path into nano-ros.
#
# Board-scoped to native_sim. The generic `zephyr` board names this snippet,
# and its `west_board` is only a DEFAULT: the same board is built with
# `-b mps2/an385`, where NSOS cannot be enabled (`depends on ARCH_POSIX`) and an
# unscoped snippet makes Kconfig refuse the build (issue 2182). Only the BOARD
# the build actually targets can answer, and this regex is where Zephyr asks it.
# Zephyr matches it against the full board string -- `${BOARD}${BOARD_QUALIFIERS}`
# on 3.7, `${BOARD}/${BOARD_QUALIFIERS}` on 4.4 -- so `native_sim/native/64`,
# `native_sim/native` and a bare `native_sim` all match on both lines.
#
# A native simulator board under another name gets no NSOS from this; give it
# a snippet of its own.
name: nros-nsos
boards:
  /native_sim(/.*)?/:
    append:
      EXTRA_CONF_FILE: nsos.conf
