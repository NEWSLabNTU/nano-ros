# Issue 2157 -- native_sim NSOS, one file for every Zephyr line.
#
# The native TAP driver is `ETH_NATIVE_POSIX` on 3.7 and `ETH_NATIVE_TAP` on
# 4.4, and Zephyr refuses an assignment to a symbol the line does not define,
# so naming either one ties the file to a line. Both lines enable it only as
# `default y if NET_L2_ETHERNET && ETH_DRIVER` (boards/native/native_sim/
# Kconfig.defconfig), and `ETH_DRIVER` has kept its name across both, so
# turning the driver CLASS off removes the TAP driver on each without naming
# it. Left on, it boots onto `eth_posix: Cannot create zeth` and a segfault
# (issue 2140).
#
# The socket layer NSOS reroutes, stated here rather than left to an image's
# own fragment: this snippet IS native_sim's network (the board names it), and
# without these lines every NSOS assignment below is dropped as an unmet
# dependency. A scaffolded workspace image names no fragment of its own, so it
# had no NETWORKING, hence no entropy driver either, and zephyr.exe failed to
# link on `z_impl_sys_rand_get` (zenoh-pico's random source).
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_ETH_DRIVER=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
