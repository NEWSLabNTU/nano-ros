name: nros

# Phase 215.D.3 follow-up — `west-commands` is NOT a valid key in
# Zephyr 3.7's module.yml schema (the schema validator rejects it at
# `find_package(Zephyr)` time). West extension registration moves to
# the workspace `west.yml` manifest's nano-ros project entry:
#
#     projects:
#       - name: nano-ros
#         path: nano-ros
#         west-commands: scripts/west-commands.yml
#
# Or users can run `west config --global commands.allow_extensions true`
# and pick up `scripts/west-commands.yml` from this checkout via
# `west config manifest.path`. See `scripts/west-commands.yml` +
# the `west nros` extension it registers.

build:
  cmake: zephyr
  kconfig: zephyr/Kconfig
  settings:
    # Phase 180.C — module-contributed snippets (Zephyr 3.7 and 4.x; issue
    # 2157 measured 3.7, whose `scripts/snippets.py` and module schema both
    # carry it — this said "4.x only"). The snippet_root is interpreted
    # relative to the MODULE ROOT (the dir containing zephyr/module.yml = the
    # repo root), and snippets.py then scans `<snippet_root>/snippets/`.
    # Pointing it at `zephyr` makes Zephyr discover `zephyr/snippets/*/
    # snippet.yml`, so a downstream user selects the nano-ros RMW with
    # `west build -S nros-<rmw>` and native_sim's host-socket network with
    # `-S nros-nsos` (which a board package names, so the module hook adds it).
    snippet_root: zephyr
    # phase-481 W1 (RFC-0098 D11) — the module's own pre-Kconfig hook. Zephyr
    # includes `<module_ext_root>/modules/modules.cmake` after module discovery
    # and BEFORE `configuration_files`/`kconfig`, in the application's scope, so
    # `zephyr/modules/modules.cmake` can render the image's `system.toml` into a
    # Kconfig fragment and place it last in `EXTRA_CONF_FILE` — on every road,
    # with no line in the leaf (a leaf-side helper cannot locate nano-ros on a
    # plain `west build`; phase-481 W0 measured it). Relative to the module root.
    module_ext_root: zephyr

# Phase 180.C contributed Twister samples here, one per hand-written Zephyr
# leaf (`samples:`, emitted by `zephyr_module.py::process_twister`). Phase-531
# W6 moved the last of those leaves to bringup workspaces, whose west
# application is generated by `nros build`, so the module names no sample.
