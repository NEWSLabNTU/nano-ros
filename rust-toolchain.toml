[toolchain]
# PINNED, not floating — issue 1447, which this moved from a prediction to a
# measurement on 2026-10-01. `stable` is a MOVING channel, so the day 1.99.0
# released it reached every checkout and CI at once with no commit: no diff, no
# blame, nobody deciding to take it. `main` went red for everyone, two finished
# pull requests were blocked on lints their authors did not write, and the
# break could not be reproduced locally because this host's `stable` was still
# 1.98.1.
#
# THREE tools move with this line, not one — the issue's own framing undersold
# it by two thirds. Clearing 1.99.0 took 9 sites: 2 clippy
# (`needless_borrows_for_generic_args`), 5 rustdoc
# (`redundant_explicit_links`), and 7 rustc errors from a FUTURE-INCOMPAT lint
# (`semicolon_in_expressions_from_non_local_macros`) that `-D warnings` turns
# into a hard error — those last were not even our code, but eyre 0.6.12's
# `bail!`, fixed by taking 0.6.14.
#
# BUMPING IS NOW A COMMIT SOMEBODY MAKES. The work is the same; it moves to a
# moment someone chose, runs every lane before it lands, and is reviewable.
# The cost this buys is a recurring chore, and the risk it creates is drift —
# a pin that ages silently is how a six-week bump becomes a sixty-site one.
#
# This does NOT make any clippy lane merge-gating; that is issue 1445 and a
# separate decision. A pin stops the surprise, not the gap.
channel = "1.99.0"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
# phase-418 418.3 — `armv7r-none-eabi` joins the hard-float triple already
# here: the Orin SPE FSP is softfp (AAPCS base), so the `hf` triple is the
# wrong ABI for that image. Neither replaces the other.
# MIRRORS the `rustup` rows of config/rust-targets.txt, which is the ONE list
# (issue 0833) — do not hand-edit this against a grep of `--target`, which is
# how it came to hold three triples the list did not and to miss one it did.
# The `build-std` rows there (the two NuttX triples) are deliberately absent:
# they have no prebuilt rust-std for rustup to install.
#
# Why duplicate the list at all: rustup reads THIS file automatically, so a
# fresh clone gets the targets without anyone running a recipe first. That is
# worth a mirror, and `check-rust-targets-covered` is what keeps the mirror
# from becoming a fifth spelling — it compares this array against the `rustup`
# rows in both directions, so neither a missing nor a stray triple can ship.
targets = [
    "thumbv7m-none-eabi",
    "thumbv7em-none-eabihf",
    "armv7r-none-eabi",
    "armv7r-none-eabihf",
    "armv8r-none-eabihf",
    "riscv32imc-unknown-none-elf",
    "riscv64gc-unknown-none-elf",
    "aarch64-unknown-none",
    "armv7a-none-eabi",
    "armv7a-none-eabihf",
    # issue 1153 / phase-450 W3 — the no-FPU and alternate-profile siblings a
    # Zephyr board reaches via `NROS_RUST_TARGET`, which the coverage gate did
    # not scan until now.
    "thumbv7em-none-eabi",
    "thumbv8m.main-none-eabi",
    "thumbv8m.main-none-eabihf",
    "i686-unknown-linux-gnu",
]
